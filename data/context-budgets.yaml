version: 1

# Byte budgets are deterministic drift guards, not token-window assumptions.
# The runtime acceptance test still measures real resident tokens from JSONL
# with scripts/context_window_report.py.
surfaces:
  contributor_instruction_loader:
    path: CLAUDE.md
    max_bytes: 256
  contributor_instructions:
    # Repository-local Claude development and headless benchmark sessions load
    # CLAUDE.md, which imports AGENTS.md. Installed plugin sessions started in a
    # target repository do not select this surface, so it is excluded from the
    # plugin-selected aggregates but retained as a resident-context ratchet.
    path: AGENTS.md
    max_bytes: 18500
  skill_router:
    path: skills/create-threat-model/SKILL.md
    # Includes the cross-path release-gate schedule; keep enough slack for a
    # concise new invariant without hiding material router growth.
    max_bytes: 8500
  thin_full_runtime:
    path: skills/create-threat-model/SKILL-full-runtime.md
    # Raised to cover routed evidence-verifier fields and the explicit
    # cross-path Stage-3 safety-gate handoff. The ceiling retains only modest
    # drift slack; it is not a licence to grow the runtime surface.
    max_bytes: 13250
  thin_rerender_runtime:
    path: skills/create-threat-model/SKILL-rerender-runtime.md
    max_bytes: 10000
  thin_stage1_v2_runtime:
    # Carries the boundary loop and dispatch rules only, never a phase
    # algorithm. The headroom guard requires at least ten percent free.
    path: skills/create-threat-model/SKILL-thin-stage1-v2.md
    max_bytes: 6400
  thin_stage1d_runtime:
    path: skills/create-threat-model/SKILL-thin-stage1d.md
    # 3400 -> 3600 (2026-08-21), matching thin_stage2_runtime. The waiter's
    # nonzero exit needed a one-shot retry instruction: a verifier cut off at
    # its turn ceiling leaves an unfinalized pre-seed, and without the repeat
    # that chain ships as a plain `inconclusive`. At 3400 the file already sat
    # at 89.6%, so the only way to fit it was deleting existing dispatch
    # guidance. Raised instead, so the ten-percent headroom guard keeps doing
    # its job rather than being worked around.
    #
    # 3600 -> 4000 (2026-08-23). That retry is now the controller's, keyed on
    # the merged verdicts instead of the waiter's exit status, which a
    # background launch reports as 0 no matter what the script returned. The
    # runtime has to describe a second possible action from `finalize-abuse`,
    # which is more text than the branch it replaces. At 3600 the file landed
    # on 89.9% — passing only by rounding, and only after the wording had been
    # cut past the point of clarity. 4000 restores headroom comparable to
    # thin_stage2_runtime (81%), so the guard measures drift again rather than
    # rationing a control-flow rule the orchestrator has to follow exactly.
    max_bytes: 4000
  thin_stage2_runtime:
    path: skills/create-threat-model/SKILL-thin-stage2.md
    max_bytes: 3600
  thin_stage3_runtime:
    path: skills/create-threat-model/SKILL-thin-stage3.md
    max_bytes: 8000
  thin_stage4_runtime:
    path: skills/create-threat-model/SKILL-thin-stage4.md
    max_bytes: 3600
  thin_completion_runtime:
    path: skills/create-threat-model/SKILL-thin-completion.md
    max_bytes: 6000
  shared_threat_analysis_kernel:
    path: skills/internal-threat-analysis-kernel/SKILL.md
    # The release budget is 4k measured tokens. This byte ceiling is the fast
    # drift guard; reviewed provider/A-B measurements own release acceptance.
    max_bytes: 16000
  architecture_analyst_role:
    path: agents/appsec-architecture-analyst.md
    max_bytes: 12000
  control_analyst_role:
    path: agents/appsec-control-analyst.md
    max_bytes: 12000
  post_stride_synthesizer_role:
    path: agents/appsec-post-stride-synthesizer.md
    max_bytes: 12000
  stride_analyzer_role:
    path: agents/appsec-stride-analyzer-v2.md
    max_bytes: 12000
  stride_lens_llm:
    path: agents/shared/owasp-llm-top10.md
    max_bytes: 7000
  stride_lens_agentic:
    path: agents/shared/owasp-asi-top10.md
    max_bytes: 8000
  stride_lens_spa:
    path: agents/shared/spa-threats.md
    max_bytes: 3500
  stride_lens_mobile:
    path: agents/stride-lenses/mobile.md
    max_bytes: 2500
  stride_lens_supply_chain:
    path: agents/shared/supply-chain-patterns.md
    max_bytes: 14000
aggregate:
  # Router + compact runtime + Stage 1 + conditional Stage 1d.
  thin_full_pre_stage2_max_bytes: 30000
  thin_full_without_stage1d_max_bytes: 27000
  # Cumulative thin control prose through the Stage-2 dispatch.
  thin_full_through_stage2_max_bytes: 33000
  # Router + rerender runtime. Stage-2 instructions are loaded only after the
  # controller has verified on-disk Stage-1 artifacts.
  thin_rerender_pre_stage2_max_bytes: 13000

admission:
  shared_kernel_max_tokens: 4000
  role_contract_max_tokens: 3000
  dispatch_task_max_tokens: 1500
  state_manifest_max_tokens: 500
  plugin_selected_startup_max_tokens: 10000
  initial_resident_max_tokens: 30000
  # WP0 has a measurement format, but no reviewed provider/A-B tool-surface
  # record yet. Keep the aggregate release gate disabled until WP5a stabilizes
  # the startup cohort and that record exists.
  enforce_startup_totals: false
