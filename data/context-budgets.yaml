version: 1

# Byte budgets are deterministic drift guards, not token-window assumptions.
# The runtime acceptance test still measures real resident tokens from JSONL
# with scripts/context_window_report.py.
surfaces:
  contributor_instruction_loader:
    path: CLAUDE.md
    max_bytes: 256
  contributor_instructions:
    # Repository-local Claude development and headless benchmark sessions load
    # CLAUDE.md, which imports AGENTS.md. Installed plugin sessions started in a
    # target repository do not select this surface, so it is excluded from the
    # plugin-selected aggregates but retained as a resident-context ratchet.
    path: AGENTS.md
    max_bytes: 18500
  skill_router:
    path: skills/create-threat-model/SKILL.md
    # Includes the cross-path release-gate schedule; keep enough slack for a
    # concise new invariant without hiding material router growth.
    max_bytes: 8500
  thin_full_runtime:
    path: skills/create-threat-model/SKILL-full-runtime.md
    # Raised to cover routed evidence-verifier fields and the explicit
    # cross-path Stage-3 safety-gate handoff. The ceiling retains only modest
    # drift slack; it is not a licence to grow the runtime surface.
    max_bytes: 13250
  thin_rerender_runtime:
    path: skills/create-threat-model/SKILL-rerender-runtime.md
    max_bytes: 10000
  # The stage runtimes must stay small, but they are the ONLY copy of their
  # script invocations -- SKILL-thin-stage1.md:4 forbids reading Stage 1 out of
  # SKILL-impl.md, where the verbatim commands still live. The 2026-07-20
  # juice-shop run compacted these surfaces to 93-96% of the previous ceilings
  # and the detail that got squeezed out was exactly the executable syntax:
  # log_event.py was invoked three times before it succeeded, and every
  # record_stage_stats.py call tripped the --subagent-type/--since-iso pairing
  # warning. These ceilings carry the headroom needed to state a command
  # exactly; test_thin_runtimes_have_headroom_for_operational_detail keeps a
  # >=10% margin so the next compaction pass cannot silently reclaim it.
  thin_stage1_runtime:
    path: skills/create-threat-model/SKILL-thin-stage1.md
    # Raised 8600->9200 (2026-07-21): the STRIDE wave-dispatch imperative was
    # compacted to a single descriptive sentence in the 115178f thin-orchestrator
    # rebuild, and the headless run then dispatched the wave serially (~66 min vs
    # ~10 min parallel). The restored HARD-CONSTRAINT prose (one-message =
    # concurrent + concrete anti-serial check) is load-bearing operational
    # detail, the same category the headroom guard protects -- not discretionary.
    # Raised 9200->9400 (2026-07-25): the dispatch description now names the
    # analysis tier (`STRIDE (light): <NAME>` for a cheap_stride entry) so the
    # agent list says which components run at light depth. At 9200 the file
    # sat at 89.8%, leaving 14 bytes -- less than any wording of that rule costs.
    max_bytes: 11000
  thin_stage1_v2_runtime:
    # The context-v2 Stage-1 runtime. It replaces the legacy Stage-1 file for a
    # run prepared as runtime_generation=context-v2 and must stay materially
    # smaller: it carries the boundary loop and dispatch rules only, never a
    # phase algorithm.
    path: skills/create-threat-model/SKILL-thin-stage1-v2.md
    max_bytes: 6000
  thin_stage1b_runtime:
    path: skills/create-threat-model/SKILL-thin-stage1b.md
    max_bytes: 4300
  thin_stage1d_runtime:
    path: skills/create-threat-model/SKILL-thin-stage1d.md
    max_bytes: 3400
  thin_stage2_runtime:
    path: skills/create-threat-model/SKILL-thin-stage2.md
    max_bytes: 3600
  legacy_initial_slice:
    path: skills/create-threat-model/SKILL-impl.md
    start: BOF
    end: "<!-- LAZY-LOAD BOUNDARY"
    max_bytes: 230000
  full_stage1_slice:
    path: skills/create-threat-model/SKILL-impl.md
    start: "## Stages 1a–1c — Analysis Pipeline"
    end: "<!-- LAZY-LOAD BOUNDARY"
    # Measured 56,358 bytes after moving Stage 1d behind the lazy boundary.
    max_bytes: 57500
  full_stage1d_slice:
    path: skills/create-threat-model/SKILL-impl.md
    start: "## Stage 1d — Abuse Case Verification"
    end: "## Stage 2 - Report Rendering"
    max_bytes: 15000
  stage2_runtime_dispatch_slice:
    path: skills/create-threat-model/SKILL-impl.md
    start: "## Stage 2 - Report Rendering"
    end: "### Handling turn-budget cut-offs"
    max_bytes: 20000
  stage3_runtime_gate_slice:
    path: skills/create-threat-model/SKILL-impl.md
    start: "## Stage 3 - QA Review"
    end: "### Stage 3 handoff banner"
    max_bytes: 25000
  threat_analyst:
    path: agents/appsec-threat-analyst.md
    max_bytes: 155000
  shared_threat_analysis_kernel:
    path: skills/internal-threat-analysis-kernel/SKILL.md
    # The release budget is 4k measured tokens. This byte ceiling is the fast
    # drift guard; reviewed provider/A-B measurements own release acceptance.
    max_bytes: 16000
  architecture_analyst_role:
    path: agents/appsec-architecture-analyst.md
    max_bytes: 12000
  control_analyst_role:
    path: agents/appsec-control-analyst.md
    max_bytes: 12000
  post_stride_synthesizer_role:
    path: agents/appsec-post-stride-synthesizer.md
    max_bytes: 12000
  stride_analyzer_role:
    path: agents/appsec-stride-analyzer-v2.md
    max_bytes: 12000
  stride_lens_llm:
    path: agents/shared/owasp-llm-top10.md
    max_bytes: 7000
  stride_lens_agentic:
    path: agents/shared/owasp-asi-top10.md
    max_bytes: 8000
  stride_lens_spa:
    path: agents/shared/spa-threats.md
    max_bytes: 3500
  stride_lens_mobile:
    path: agents/stride-lenses/mobile.md
    max_bytes: 2500
  stride_lens_supply_chain:
    path: agents/shared/supply-chain-patterns.md
    max_bytes: 14000
  phase_group_recon:
    path: agents/phases/phase-group-recon.md
    max_bytes: 40000
  phase_group_architecture:
    path: agents/phases/phase-group-architecture.md
    max_bytes: 190000
  phase_group_threats:
    path: agents/phases/phase-group-threats.md
    max_bytes: 160000
  phase_group_finalization:
    path: agents/phases/phase-group-finalization.md
    max_bytes: 155000

aggregate:
  # These three absorb ~2.4 KB of restored script invocations (log_event.py and
  # record_stage_stats.py in all three stage runtimes). Compacting them back out
  # is what broke the 2026-07-20 juice-shop run: the stage files are the only
  # copy of those commands, because SKILL-thin-stage1.md:4 forbids reading Stage
  # 1 out of SKILL-impl.md. Executable syntax is not discretionary prose -- trim
  # explanation before trimming a command line.
  # Router + compact runtime + compact Stage-1a/1c + Stage-1b + conditional Stage-1d.
  thin_full_pre_stage2_max_bytes: 38000
  # Quick/explicit-skip runs still load Stage 1b but never Stage 1d.
  thin_full_without_stage1d_max_bytes: 35000
  # Cumulative thin control prose through the Stage-2 dispatch.
  thin_full_through_stage2_max_bytes: 41500
  # Router + rerender runtime. Stage-2 instructions are loaded only after the
  # controller has verified on-disk Stage-1 artifacts.
  thin_rerender_pre_stage2_max_bytes: 18000
  # The compact path must remain materially smaller than the legacy prefix.
  thin_to_legacy_max_ratio: 0.50

admission:
  shared_kernel_max_tokens: 4000
  role_contract_max_tokens: 3000
  dispatch_task_max_tokens: 1500
  state_manifest_max_tokens: 500
  plugin_selected_startup_max_tokens: 10000
  initial_resident_max_tokens: 30000
  # WP0 has a measurement format, but no reviewed provider/A-B tool-surface
  # record yet. Keep the aggregate release gate disabled until WP5a stabilizes
  # the startup cohort and that record exists.
  enforce_startup_totals: false
