version: 1

# Byte budgets are deterministic drift guards, not token-window assumptions.
# The runtime acceptance test still measures real resident tokens from JSONL
# with scripts/runtime/context_window_report.py.
surfaces:
  contributor_instruction_loader:
    path: CLAUDE.md
    max_bytes: 256
  contributor_instructions:
    # Repository-local Claude development and headless benchmark sessions load
    # CLAUDE.md, which imports AGENTS.md. Installed plugin sessions started in a
    # target repository do not select this surface, so it is excluded from the
    # plugin-selected aggregates but retained as a resident-context ratchet.
    path: AGENTS.md
    max_bytes: 18500
  skill_router:
    path: skills/appsec-analyzer/SKILL.md
    # Loaded on every assessment invocation. The business-context dialog is a
    # separate file the skill reads only when the dialog runs.
    max_bytes: 12000
  shared_threat_analysis_kernel:
    path: skills/internal-threat-analysis-kernel/SKILL.md
    # The release budget is 4k measured tokens. This byte ceiling is the fast
    # drift guard; reviewed provider/A-B measurements own release acceptance.
    max_bytes: 16000
  architecture_analyst_role:
    path: agents/appsec-architecture-analyst.md
    # 12000 -> 13000 (2026-09-17): the role now names the pre-flow role units,
    # evidenced capability and service-role labels, and concrete access-group
    # and `none` rules; a juice-shop run without them lost the login sequence,
    # the public API alternative and every embedded-store access method.
    max_bytes: 13000
  control_analyst_role:
    path: agents/appsec-control-analyst.md
    max_bytes: 12000
  post_stride_synthesizer_role:
    path: agents/appsec-post-stride-synthesizer.md
    max_bytes: 12000
  stride_analyzer_role:
    path: agents/appsec-stride-analyzer-v2.md
    # 12000 -> 14500 (2026-08-30): carrying requirements and blueprint
    # provenance into findings and mitigations grew the role to 12764 bytes,
    # past the hard budget, with no band left for the ten-percent headroom
    # guard. The eight sections are each 800-2200 bytes of distinct contract
    # (ownership, admission, bounded reads, write-first, prior/actor/boundary
    # handling, the six-category workflow, finding admission, output), so
    # fitting 12000 meant cutting a third of one of them out of the most
    # quality-critical prompt in the pipeline. Raised instead. This is not a
    # licence to grow: the role ships once per STRIDE component, so a standard
    # run pays every byte here seven times.
    # 14500 -> 17500 (2026-09-24): the mechanism_trace contract (ad8a5a35,
    # +1128 bytes) landed with this guard red, and the retry repair brief adds
    # 224. Both are rules the completion gate enforces; cutting their text to
    # fit would raise gate rejections, the failure this contract exists to stop.
    max_bytes: 17500
  stride_lens_llm:
    path: agents/shared/owasp-llm-top10.md
    max_bytes: 7000
  stride_lens_agentic:
    path: agents/shared/owasp-asi-top10.md
    max_bytes: 8000
  stride_lens_rag:
    path: agents/stride-lenses/rag.md
    max_bytes: 2600
  stride_lens_mcp:
    path: agents/stride-lenses/mcp.md
    max_bytes: 3300
  stride_lens_spa:
    path: agents/shared/spa-threats.md
    max_bytes: 3500
  stride_lens_mobile:
    path: agents/stride-lenses/mobile.md
    max_bytes: 2500
  stride_lens_supply_chain:
    path: agents/shared/supply-chain-patterns.md
    max_bytes: 14000
admission:
  shared_kernel_max_tokens: 4000
  role_contract_max_tokens: 3000
  dispatch_task_max_tokens: 1500
  state_manifest_max_tokens: 500
  plugin_selected_startup_max_tokens: 10000
  initial_resident_max_tokens: 30000
  # WP0 has a measurement format, but no reviewed provider/A-B tool-surface
  # record yet. Keep the aggregate release gate disabled until WP5a stabilizes
  # the startup cohort and that record exists.
  enforce_startup_totals: false
