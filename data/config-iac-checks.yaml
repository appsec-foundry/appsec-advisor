# config-iac-checks.yaml — canonical security checks for configuration files
# and infrastructure-as-code artifacts.
#
# Used by appsec-config-scanner (Phase 2.5 new agent). Each check targets a
# specific IaC file type and emits a finding when the pattern condition fails.
#
# Check structure:
#   id                         — IAC-NNN stable identifier
#   name                       — the desired state; mitigation cards reuse it
#   violation_title            — finding title: the defect when the check fails,
#                                a weakness class with a title-case lead
#   iac_type                   — file category (Dockerfile, github_workflow,
#                                docker_compose, dependabot, npm_config,
#                                kubernetes, helm_values, terraform)
#   file_pattern               — glob to find target files
# Top-level `file_patterns_by_type` replaces that fallback with the complete
# category inventory when a format has equivalent names or extensions.
#   pattern                    — regex or keyword to match
#   expect                     — `present`, `absent`, `all_third_party_actions`,
#                                `any_of`, `any_of_present`, `structured`,
#                                `file_exists`, `repository`
#   anchor                     — optional regex for `present`/`any_of_present`:
#                                the line a missing statement belongs to, cited
#                                as evidence (`anchor_occurrence: first|last`,
#                                default first). Without one, or when the file has
#                                no such line, the finding is an absence (line 0,
#                                the file searched) — never a pseudo line 1.
#   capability / precondition  — `expect: repository` only: a property of the
#                                whole repository (sbom, image_signing,
#                                dependency_updates + `ecosystem`) judged once
#                                from analyzers/supply_chain_facts.py, which owns
#                                the detection patterns. `precondition`
#                                (has_build_pipeline, publishes_container_image,
#                                dependency_update_tool_configured) limits the
#                                check to repositories it applies to. One gap is
#                                one finding listing every file searched.
#                                `file_pattern` is only its display path.
#   severity_if_violated       — severity if the expectation is not met
#   cwe                        — primary CWE for the finding
#   stride                     — the STRIDE category of the weakness this check
#                                reports, one of Spoofing, Tampering,
#                                Repudiation, Information Disclosure, Denial of
#                                Service, Elevation of Privilege. Required: no
#                                default is applied downstream. Choose the harm
#                                the defect enables, not the file type:
#                                  Elevation of Privilege — more privilege or
#                                    reach than needed (root, privileged,
#                                    broad token or IAM scope, auto-approved
#                                    agent tools, untrusted code in a trusted
#                                    context)
#                                  Tampering — code, dependency or artifact
#                                    integrity (unpinned or unsigned inputs,
#                                    build scripts, stale dependencies)
#                                  Information Disclosure — data or secrets
#                                    exposed (hardcoded secrets, plaintext
#                                    transport or storage, public exposure)
#                                  Denial of Service — availability only
#                                  Repudiation — missing provenance or audit
#                                    record of what was built or done
#                                  Spoofing — identity not established
#   finding_type               — FT-NNN from finding-types.yaml
#   rationale                  — 1-2 sentence reason this matters
#   remediation                — short fix text (becomes mitigation_title_hint)
#   breach_vector              — optional; how an attacker reaches the defect
#                                (config-scan-findings `breachVector`), default
#                                `Build-Time`. Set it only when the check itself
#                                establishes the reach, e.g. an internet-open rule

schema_version: 1

# Category-wide inventory patterns. These are the authoritative alternatives
# for checks in the named category; `file_pattern` remains the canonical
# display path and fallback for categories without an entry here.
file_patterns_by_type:
  Dockerfile:
    - "**/Dockerfile"
    - "**/Dockerfile.*"
    - "**/*.dockerfile"
  github_workflow:
    - "**/.github/workflows/*.yml"
    - "**/.github/workflows/*.yaml"
  docker_compose:
    - "**/docker-compose*.yml"
    - "**/docker-compose*.yaml"
    - "**/compose*.yml"
    - "**/compose*.yaml"
  dependabot:
    - "**/.github/dependabot.yml"
    - "**/.github/dependabot.yaml"
  # Where repository automation lives. Deliberately not `**/*.sh`: a vendored
  # tree would contribute both scan cost and findings nobody maintains.
  agent_automation:
    - "**/.github/workflows/*.yml"
    - "**/.github/workflows/*.yaml"
    - ".github/**/*.sh"
    - "*.sh"
    - "scripts/**/*.sh"
    - "bin/**/*.sh"
    - "ci/**/*.sh"
    - "tools/**/*.sh"
    - "Makefile"
  # Raw manifests only; Helm templates are not YAML until rendered and are
  # listed as their own surface below.
  kubernetes:
    - "**/k8s/**/*.yaml"
    - "**/k8s/**/*.yml"
    - "**/kubernetes/**/*.yaml"
    - "**/kubernetes/**/*.yml"
    - "**/manifests/**/*.yaml"
    - "**/manifests/**/*.yml"
    - "**/deploy/**/*.yaml"
    - "**/deploy/**/*.yml"
    - "**/deployment/**/*.yaml"
    - "**/deployment/**/*.yml"
  terraform:
    - "**/*.tf"
    - "**/*.tfvars"
  # Recognised surfaces without checks yet. The scanner reports their files as
  # `uncovered_iac` so a run names what it did not examine instead of reading
  # as a clean scan. A category moves out of this block with its first check.
  helm:
    - "**/Chart.yaml"
  helm_values:
    - "**/values.yaml"
    - "**/.gitlab/auto-deploy-values.yaml"
  pulumi:
    - "**/Pulumi.yaml"
    - "**/Pulumi.yml"
  aws_cdk:
    - "**/cdk.json"
  serverless:
    - "**/serverless.yml"
    - "**/serverless.yaml"
  bicep:
    - "**/*.bicep"
  azure_arm:
    - "**/azuredeploy*.json"
  ansible:
    - "**/ansible.cfg"
  nomad:
    - "**/*.nomad"
    - "**/*.nomad.hcl"

checks:
  # ============ Dockerfile ============
  - id: IAC-001
    stride: Tampering
    name: "Dockerfile base image must be digest-pinned"
    violation_title: "Unpinned Container Base Image"
    iac_type: Dockerfile
    file_pattern: "Dockerfile"
    pattern: "^FROM\\s+\\S+@sha256:"
    expect: present
    anchor: "^FROM\\s"
    severity_if_violated: Medium
    cwe: CWE-1104
    finding_type: FT-140
    rationale: "Tag-only base images (FROM node:24) can be silently substituted by a malicious publisher. Digest-pinning (@sha256:…) ensures the exact image bytes are used on every build."
    remediation: "Pin base image to @sha256:<digest>"

  - id: IAC-002
    stride: Elevation of Privilege
    name: "Dockerfile USER directive (non-root)"
    violation_title: "Container Runs as Root"
    iac_type: Dockerfile
    file_pattern: "Dockerfile"
    pattern: "^USER\\s+(?!root)(?!0\\b)"
    expect: present
    # The runtime user is set in the final stage; cite its FROM.
    anchor: "^FROM\\s"
    anchor_occurrence: last
    severity_if_violated: Medium
    cwe: CWE-250
    finding_type: FT-160
    rationale: "Containers running as root expand container-escape blast radius."
    remediation: "Add USER <non-root-uid>"

  - id: IAC-003
    stride: Denial of Service
    name: "Dockerfile HEALTHCHECK instruction"
    violation_title: "Missing Container Healthcheck"
    iac_type: Dockerfile
    file_pattern: "Dockerfile"
    pattern: "^HEALTHCHECK"
    expect: present
    anchor: "^FROM\\s"
    anchor_occurrence: last
    severity_if_violated: Low
    cwe: CWE-703
    finding_type: FT-160
    rationale: "Missing HEALTHCHECK delays orchestrator detection of a hung or poisoned container."
    remediation: "Add HEALTHCHECK CMD curl -f http://localhost:<port>/health"

  - id: IAC-004
    stride: Elevation of Privilege
    name: "Dockerfile no --unsafe-perm install flag"
    violation_title: "Package Install Scripts Run as Root"
    iac_type: Dockerfile
    file_pattern: "Dockerfile"
    pattern: "--unsafe-perm"
    expect: absent
    severity_if_violated: High
    cwe: CWE-250
    finding_type: FT-162
    rationale: "`npm install --unsafe-perm` runs postinstall scripts as root, widening supply-chain compromise scope."
    remediation: "Remove --unsafe-perm; use non-root user"

  - id: IAC-005
    stride: Tampering
    name: "Dockerfile npm/pnpm/yarn install without --ignore-scripts"
    violation_title: "Dependency Install Scripts Run at Build Time"
    iac_type: Dockerfile
    file_pattern: "Dockerfile"
    # Flag the BAD pattern (a JS package install that does NOT pass
    # --ignore-scripts) rather than requiring the good flag globally. The old
    # `expect: present` form fired on every Dockerfile that used no JS package
    # manager at all — e.g. a Maven/Java image got a spurious npm finding
    # (false positive, insecure-spring-app T-054, 2026-07-15). The negative
    # lookahead + `expect: absent` fires only when an npm/pnpm/yarn install is
    # actually present but unhardened, mirroring IAC-004 (--unsafe-perm).
    pattern: "(npm (ci|install)|pnpm install|yarn install)(?!.*--ignore-scripts)"
    expect: absent
    severity_if_violated: Medium
    cwe: CWE-506
    finding_type: FT-171
    rationale: "Without --ignore-scripts, any compromised dependency publisher can execute postinstall code at build time."
    remediation: "Use `npm ci --ignore-scripts` and audit required postinstalls separately"

  # ============ GitHub Actions Workflows ============
  - id: IAC-010
    stride: Elevation of Privilege
    name: "GitHub Actions workflow-level permissions block"
    violation_title: "Missing Workflow Permissions Block"
    iac_type: github_workflow
    file_pattern: ".github/workflows/*.yml"
    expect: structured
    evaluator: github_workflow_permissions_missing
    severity_if_violated: Medium
    cwe: CWE-732
    finding_type: FT-143
    rationale: "Without an explicit permissions block at workflow or job level, the job inherits the repository default (commonly write-all) for GITHUB_TOKEN — any compromised step can push code, create releases, or approve PRs."
    remediation: "Add `permissions: { contents: read }` at workflow root; elevate per-job only where needed"

  - id: IAC-011
    stride: Tampering
    name: "Third-party GitHub Actions pinned to commit SHA"
    violation_title: "Unpinned Third-Party GitHub Action"
    iac_type: github_workflow
    file_pattern: ".github/workflows/*.yml"
    pattern: "uses:\\s+[^@]+@[0-9a-f]{40}"
    expect: all_third_party_actions
    severity_if_violated: Medium
    cwe: CWE-829
    finding_type: FT-146
    rationale: "Tag-based action references (@v3, @main) are mutable — a compromised publisher can retroactively inject malicious code into an already-used tag."
    remediation: "Pin every third-party action to a full 40-char commit SHA"

  - id: IAC-012
    stride: Elevation of Privilege
    name: "pull_request_target must not check out head ref from fork"
    violation_title: "Fork Checkout in pull_request_target Workflow"
    iac_type: github_workflow
    file_pattern: ".github/workflows/*.yml"
    pattern: "on:.*pull_request_target.*\\n.*actions/checkout.*ref:\\s*\\$\\{\\{\\s*github\\.event\\.pull_request\\.head"
    expect: absent
    severity_if_violated: Critical
    cwe: CWE-829
    finding_type: FT-145
    rationale: "pull_request_target runs with secrets AND write access; checking out fork code there is a direct RCE vector — a PR can execute arbitrary code with repo secrets."
    remediation: "Never check out PR-head in pull_request_target. Use pull_request event (no secrets) for code execution; use pull_request_target only for metadata ops"

  - id: IAC-013
    stride: Elevation of Privilege
    name: "No script injection via github.event.* expressions in run:"
    violation_title: "Workflow Script Injection from Event Data"
    iac_type: github_workflow
    file_pattern: ".github/workflows/*.yml"
    pattern: "run:.*\\$\\{\\{\\s*github\\.event\\.(pull_request\\.title|issue\\.title|comment\\.body|head_ref|review\\.body).*\\}\\}"
    expect: absent
    severity_if_violated: High
    cwe: CWE-78
    finding_type: FT-144
    rationale: "Expanding user-controlled PR/issue fields into a `run:` block allows shell injection — the attacker's PR title executes as shell."
    remediation: "Pass via env: instead: `env: TITLE: ${{ github.event... }}` then `run: echo \"$TITLE\"`"

  - id: IAC-014
    stride: Information Disclosure
    name: "No ACTIONS_STEP_DEBUG or set -x echoing secrets"
    violation_title: "Secrets Echoed in Workflow Debug Logs"
    iac_type: github_workflow
    file_pattern: ".github/workflows/*.yml"
    pattern: "(ACTIONS_STEP_DEBUG:\\s*true|set\\s+-x|echo\\s+\\$\\{?[A-Z_]+_TOKEN|echo\\s+\\$\\{?[A-Z_]+_SECRET)"
    expect: absent
    severity_if_violated: High
    cwe: CWE-532
    finding_type: FT-147
    rationale: "Debug-mode workflows and unrestricted echo can dump secret values into logs — any repo-read-permission user then reads them."
    remediation: "Remove debug flags; use ::add-mask:: for ad-hoc secrets; never echo variables starting with _TOKEN/_SECRET"

  - id: IAC-015
    stride: Elevation of Privilege
    name: "GITHUB_TOKEN scope minimization"
    violation_title: "Default GITHUB_TOKEN Scope Not Restricted"
    iac_type: github_workflow
    file_pattern: ".github/workflows/*.yml"
    expect: structured
    evaluator: github_workflow_token_scope_broad
    severity_if_violated: Medium
    cwe: CWE-732
    finding_type: FT-143
    rationale: "The workflow root grants `contents: write` (or `write-all`) to every job, so any step in any job can push code or tags; read-only contents at the root forces per-job opt-in for write scopes."
    remediation: "Add `permissions: { contents: read }` at root; per-job elevate to `contents: write` only where needed"

  # ============ docker-compose ============
  - id: IAC-020
    stride: Elevation of Privilege
    name: "docker-compose no privileged mode"
    violation_title: "Privileged Compose Service"
    iac_type: docker_compose
    file_pattern: "docker-compose*.yml"
    pattern: "privileged:\\s*true"
    expect: absent
    severity_if_violated: High
    cwe: CWE-732
    finding_type: FT-161
    rationale: "`privileged: true` grants all Linux capabilities + host device access — equivalent to root on the host."
    remediation: "Remove privileged: true; add individual cap_add entries only if strictly needed"

  - id: IAC-021
    stride: Elevation of Privilege
    name: "docker-compose no docker.sock mount"
    violation_title: "Docker Socket Mounted into Container"
    iac_type: docker_compose
    file_pattern: "docker-compose*.yml"
    pattern: "/var/run/docker\\.sock"
    expect: absent
    severity_if_violated: High
    cwe: CWE-732
    finding_type: FT-161
    rationale: "Mounting /var/run/docker.sock gives the container full control over the host's Docker daemon — equivalent to root."
    remediation: "Remove the docker.sock volume; use docker:dind if daemon access is truly needed"

  - id: IAC-022
    stride: Elevation of Privilege
    name: "docker-compose no host network mode"
    violation_title: "Compose Service on Host Network"
    iac_type: docker_compose
    file_pattern: "docker-compose*.yml"
    pattern: "network_mode:\\s*host"
    expect: absent
    severity_if_violated: Medium
    cwe: CWE-732
    finding_type: FT-161
    rationale: "Host networking defeats container network isolation; any port the app opens binds on the host."
    remediation: "Use bridge/custom networks; expose only the needed ports via `ports:`"

  - id: IAC-023
    stride: Information Disclosure
    name: "docker-compose secrets supplied by reference"
    violation_title: "Hardcoded Secret in Compose Environment"
    iac_type: docker_compose
    file_pattern: "docker-compose*.yml"
    expect: structured
    evaluator: compose_environment_secret_literal
    severity_if_violated: High
    cwe: CWE-798
    finding_type: FT-050
    breach_vector: "Repo-Read"
    rationale: "A credential written as a literal in a service's `environment` is readable by everyone with repository access and runs unchanged wherever the file is deployed."
    remediation: "Move the value to Compose `secrets` or an untracked env file and reference it as `${VAR}`; rotate the committed value"

  - id: IAC-024
    stride: Information Disclosure
    name: "docker-compose data and admin ports bound to a host address"
    violation_title: "Data or Admin Port Published on All Interfaces"
    iac_type: docker_compose
    file_pattern: "docker-compose*.yml"
    expect: structured
    evaluator: compose_sensitive_port_on_all_interfaces
    severity_if_violated: Medium
    cwe: CWE-668
    finding_type: FT-161
    rationale: "A published database, broker, or remote-administration port without a host address binds on every interface of the host, so the service is reachable from any network the host is attached to."
    remediation: "Drop the `ports:` entry and use the Compose network, or bind it to `127.0.0.1:`"

  # ============ Dependabot / Renovate ============
  # Coverage, not presence: each check applies only when the repository uses
  # the ecosystem and has Dependabot or Renovate configured; Renovate without
  # `enabledManagers` covers every ecosystem. A repository with no update tool
  # at all is the §6.11 "Automated dependency updates" control row
  # (model/emit_sca_practice.py), not three findings here.
  - id: IAC-030
    stride: Tampering
    name: "Dependabot covers npm ecosystem"
    violation_title: "Dependabot Does Not Cover npm"
    iac_type: dependabot
    file_pattern: ".github/dependabot.yml"
    expect: repository
    capability: dependency_updates
    ecosystem: npm
    precondition: dependency_update_tool_configured
    severity_if_violated: Medium
    cwe: CWE-1104
    finding_type: FT-170
    rationale: "npm ecosystem must be tracked for timely dependency security updates."
    remediation: "Add npm ecosystem entry to .github/dependabot.yml"

  - id: IAC-031
    stride: Tampering
    name: "Dependabot covers github-actions ecosystem"
    violation_title: "Dependabot Does Not Cover GitHub Actions"
    iac_type: dependabot
    file_pattern: ".github/dependabot.yml"
    expect: repository
    capability: dependency_updates
    ecosystem: github-actions
    precondition: dependency_update_tool_configured
    severity_if_violated: Medium
    cwe: CWE-1104
    finding_type: FT-170
    rationale: "GitHub Actions ecosystem must be tracked so SHA-pinned actions receive security updates."
    remediation: "Add github-actions ecosystem entry"

  - id: IAC-032
    stride: Tampering
    name: "Dependabot covers docker ecosystem"
    violation_title: "Dependabot Does Not Cover Docker"
    iac_type: dependabot
    file_pattern: ".github/dependabot.yml"
    expect: repository
    capability: dependency_updates
    ecosystem: docker
    precondition: dependency_update_tool_configured
    severity_if_violated: Medium
    cwe: CWE-1104
    finding_type: FT-170
    rationale: "Docker ecosystem must be tracked when Dockerfile is present — base-image updates need review."
    remediation: "Add docker ecosystem entry to track Dockerfile updates"

  # ============ Renovate (added 2026-05 — first-class parity with Dependabot) ============
  # Renovate is detected from any of: renovate.json, renovate.json5,
  # .renovaterc, .renovaterc.json, .renovaterc.json5, .github/renovate.json.
  # The `expect: present_any` semantics means the check passes if ANY of
  # the file_pattern globs resolves. config-scanner glob-walks each entry
  # and reports the first match.
  #
  # Note: Renovate's hosted-app mode can enable updates without any file
  # in the repo (the GitHub App reads config from a central location).
  # Detection is therefore best-effort — file absence is a "warning"
  # severity, not "missing". model/emit_sca_practice.py also surfaces this as
  # the §6.11 "Automated dependency updates" control row.

  - id: IAC-033
    stride: Tampering
    name: "Renovate config present (file-mode detection)"
    violation_title: "Renovate Configuration Missing"
    iac_type: renovate
    file_pattern: "renovate.json"
    pattern: ".*"
    expect: present
    severity_if_violated: Low
    cwe: CWE-1104
    finding_type: FT-170
    rationale: "Renovate is a first-class peer of Dependabot for automated dependency updates. File-mode detection is best-effort; hosted-app mode is not detectable from the repo."
    remediation: "Add renovate.json with a baseline preset (extends: [\"config:base\"]) OR confirm Renovate hosted-app is enabled at the repo / org level."

  - id: IAC-034
    stride: Tampering
    name: "Renovate config alternative location (.github/renovate.json)"
    violation_title: "Renovate GitHub Directory Configuration Missing"
    iac_type: renovate
    file_pattern: ".github/renovate.json"
    pattern: ".*"
    expect: present
    severity_if_violated: Low
    cwe: CWE-1104
    finding_type: FT-170
    rationale: "Mirror of IAC-033 for the .github/ subdirectory location (Renovate accepts both)."
    remediation: "Place renovate.json at repo root or under .github/. Either is accepted by Renovate."

  - id: IAC-035
    stride: Tampering
    name: "Renovate config alternative dotfile (.renovaterc[.json])"
    violation_title: "Renovate Dotfile Configuration Missing"
    iac_type: renovate
    file_pattern: ".renovaterc.json"
    pattern: ".*"
    expect: present
    severity_if_violated: Low
    cwe: CWE-1104
    finding_type: FT-170
    rationale: "Mirror of IAC-033 for the legacy .renovaterc.json dotfile location."
    remediation: "Either consolidate to renovate.json or keep .renovaterc.json — both are recognised."

  # ============ SBOM & Provenance ============
  # Repository capabilities: one workflow that signs or generates an SBOM
  # satisfies the repository, so these are judged once, not per workflow.
  - id: IAC-040
    stride: Tampering
    name: "Container image signing via cosign or attest-build-provenance"
    violation_title: "Missing Container Image Signing"
    iac_type: github_workflow
    file_pattern: ".github/workflows/*.yml"
    expect: repository
    capability: image_signing
    # Only a repository that pushes an image has something to sign.
    precondition: publishes_container_image
    severity_if_violated: Medium
    cwe: CWE-347
    finding_type: FT-148
    rationale: "Unsigned container images cannot be verified for provenance — any registry intermediary could substitute them."
    remediation: "Add cosign signing step to release workflow; or use actions/attest-build-provenance"

  - id: IAC-041
    stride: Repudiation
    name: "SBOM generation in build pipeline"
    violation_title: "Missing SBOM Generation"
    iac_type: github_workflow
    file_pattern: ".github/workflows/*.yml"
    expect: repository
    capability: sbom
    precondition: has_build_pipeline
    severity_if_violated: Low
    cwe: CWE-1104
    finding_type: FT-148
    rationale: "SBOM generation enables downstream vulnerability tracking and supply-chain auditability."
    remediation: "Generate SBOM (CycloneDX / SPDX) in release workflow and publish as artifact"

  # ============ NPM config ============
  - id: IAC-050
    stride: Tampering
    name: "package-lock.json present and committed"
    violation_title: "Missing npm Lockfile"
    iac_type: npm_config
    file_pattern: "package-lock.json"
    pattern: ""
    expect: file_exists
    severity_if_violated: Medium
    cwe: CWE-1104
    finding_type: FT-171
    rationale: "Without a lockfile, `npm install` installs different transitive versions on each run — supply-chain attacks become undetectable."
    remediation: "Commit package-lock.json; use `npm ci` in CI"

  - id: IAC-051
    stride: Tampering
    name: "No postinstall scripts in package.json (or audited)"
    violation_title: "Unaudited npm Lifecycle Script"
    iac_type: npm_config
    file_pattern: "package.json"
    pattern: "\"(postinstall|prepare)\":"
    expect: absent_or_documented
    severity_if_violated: Medium
    cwe: CWE-506
    finding_type: FT-171
    rationale: "postinstall hooks execute arbitrary code at install time — the attack surface for supply-chain compromise."
    remediation: "Remove postinstall if possible; else document why required and use --ignore-scripts in CI and audit the hook content"

  # ============ Coding-agent configuration ============
  # Signals: agent configuration a repository commits — Claude Code, OpenAI
  # Codex, GitHub Copilot / VS Code agent mode, Gemini CLI, Kiro. Machine-local
  # setup (`~/.claude`, `~/.codex`, IDE user settings) is out of reach and out
  # of scope.
  #
  # False-positive exclusion shared by every absence check below: a repository
  # that commits no agent autonomy produces no finding. Missing isolation is
  # only a violation where the same committed file also pre-approves tool use.
  # Explicit weakening (sandbox off, approvals off, tools auto-trusted) is a
  # violation on its own.
  - id: IAC-060
    stride: Elevation of Privilege
    name: "Claude Code project settings must enable the command sandbox"
    violation_title: "Claude Code Command Sandbox Not Enabled"
    iac_type: agent_config
    file_pattern: ".claude/settings*.json"
    expect: structured
    evaluator: claude_sandbox_absent
    severity_if_violated: Medium
    cwe: CWE-250
    finding_type: FT-180
    rationale: "The project settings pre-approve tool calls but declare no sandbox, so the agent runs with the contributor's full filesystem and network reach. An instruction planted in repository content, a dependency, or an issue body then reaches the shell with no boundary around it."
    remediation: "Set sandbox.enabled to true in the project settings; keep filesystem allow-lists in user settings, where absolute host paths belong"

  - id: IAC-061
    stride: Elevation of Privilege
    name: "Claude Code settings must not disable permission prompts"
    violation_title: "Claude Code Permission Prompts Disabled"
    iac_type: agent_config
    file_pattern: ".claude/settings*.json"
    pattern: "\"defaultMode\"\\s*:\\s*\"bypassPermissions\""
    expect: absent
    severity_if_violated: High
    cwe: CWE-732
    finding_type: FT-181
    rationale: "bypassPermissions removes the approval prompt for every tool call, for every contributor who opens the repository. Agent-generated commands reach the shell unreviewed."
    remediation: "Remove defaultMode: bypassPermissions and grant narrow permissions.allow rules instead"

  - id: IAC-062
    stride: Elevation of Privilege
    name: "Claude Code settings must not auto-trust repository MCP servers"
    violation_title: "Claude Code Auto-Trusts Repository MCP Servers"
    iac_type: agent_config
    file_pattern: ".claude/settings*.json"
    pattern: "\"enableAllProjectMcpServers\"\\s*:\\s*true"
    expect: absent
    severity_if_violated: Medium
    cwe: CWE-829
    finding_type: FT-181
    rationale: "Every MCP server declared in the repository is approved without review, so a pull request can add a server whose tools the agent then calls."
    remediation: "Remove enableAllProjectMcpServers and approve MCP servers individually"

  - id: IAC-063
    stride: Elevation of Privilege
    name: "Codex project config must not disable the sandbox"
    violation_title: "Codex Sandbox Disabled"
    iac_type: agent_config
    file_pattern: ".codex/config.toml"
    pattern: "(?m)^\\s*(?:[A-Za-z_][\\w.-]*\\.)?sandbox_mode\\s*=\\s*[\"']danger-full-access[\"']"
    expect: absent
    severity_if_violated: High
    cwe: CWE-250
    finding_type: FT-180
    rationale: "danger-full-access runs Codex with no filesystem or network boundary for anyone who trusts this project, so a generated command reaches the whole machine."
    remediation: "Set sandbox_mode = \"workspace-write\" (or \"read-only\") in .codex/config.toml"

  - id: IAC-064
    stride: Elevation of Privilege
    name: "Codex project config must not disable approvals"
    violation_title: "Codex Approvals Disabled"
    iac_type: agent_config
    file_pattern: ".codex/config.toml"
    pattern: "(?m)^\\s*(?:[A-Za-z_][\\w.-]*\\.)?approval_policy\\s*=\\s*[\"']never[\"']"
    expect: absent
    severity_if_violated: High
    cwe: CWE-732
    finding_type: FT-181
    rationale: "approval_policy = \"never\" executes generated commands without asking, so the sandbox boundary is the only remaining control."
    remediation: "Use approval_policy = \"on-request\" or \"untrusted\" in the project config"

  - id: IAC-065
    stride: Information Disclosure
    name: "Codex sandbox must not be granted network access"
    violation_title: "Codex Sandbox Network Access Enabled"
    iac_type: agent_config
    file_pattern: ".codex/config.toml"
    pattern: "(?m)^\\s*(?:[A-Za-z_][\\w.-]*\\.)?network_access\\s*=\\s*true"
    expect: absent
    severity_if_violated: Medium
    cwe: CWE-668
    finding_type: FT-180
    rationale: "The workspace-write sandbox blocks outbound traffic by default; enabling it gives commands the agent runs a direct exfiltration channel for anything readable in the workspace."
    remediation: "Drop network_access = true, or constrain traffic with the network_proxy domain policy"

  - id: IAC-066
    stride: Elevation of Privilege
    name: "VS Code workspace settings must not auto-approve every agent tool"
    violation_title: "VS Code Agent Tools Auto-Approved"
    iac_type: agent_config
    file_pattern: ".vscode/settings.json"
    pattern: "\"chat\\.tools\\.global\\.autoApprove\"\\s*:\\s*true"
    expect: absent
    severity_if_violated: High
    cwe: CWE-732
    finding_type: FT-181
    rationale: "Global auto-approval runs every Copilot agent tool call, terminal commands included, without a confirmation dialog."
    remediation: "Remove chat.tools.global.autoApprove and allow-list individual commands via chat.tools.terminal.autoApprove"

  - id: IAC-067
    stride: Elevation of Privilege
    name: "VS Code workspace settings must not turn the agent sandbox off"
    violation_title: "VS Code Agent Sandbox Disabled"
    iac_type: agent_config
    file_pattern: ".vscode/settings.json"
    pattern: "\"chat\\.agent\\.sandbox\\.enabled\"\\s*:\\s*\"off\""
    expect: absent
    severity_if_violated: Medium
    cwe: CWE-250
    finding_type: FT-180
    rationale: "Committing the sandbox off removes the filesystem and network isolation around agent terminal commands for everyone who opens the workspace."
    remediation: "Set chat.agent.sandbox.enabled to \"on\" or drop the key so the user's own setting applies"

  - id: IAC-068
    stride: Elevation of Privilege
    name: "Gemini CLI project settings must enable sandboxing"
    violation_title: "Gemini CLI Sandbox Not Enabled"
    iac_type: agent_config
    file_pattern: ".gemini/settings.json"
    expect: structured
    evaluator: gemini_sandbox_absent
    severity_if_violated: Medium
    cwe: CWE-250
    finding_type: FT-180
    rationale: "The project settings auto-accept tool calls or trust an MCP server while sandboxing stays off (its default), so shell commands and file writes run directly on the host."
    remediation: "Set tools.sandbox to \"docker\" or \"podman\" in .gemini/settings.json"

  - id: IAC-069
    stride: Elevation of Privilege
    name: "Gemini CLI project settings must not auto-trust tools"
    violation_title: "Gemini CLI Tools Auto-Trusted"
    iac_type: agent_config
    file_pattern: ".gemini/settings.json"
    expect: structured
    evaluator: gemini_tool_auto_trust
    severity_if_violated: Medium
    cwe: CWE-829
    finding_type: FT-181
    rationale: "A server marked trust: true bypasses all tool-call confirmations, and autoAccept approves tool calls without review — both for anyone who opens the project."
    remediation: "Remove trust: true and autoAccept from the project settings"

  - id: IAC-070
    stride: Elevation of Privilege
    name: "Kiro workspace MCP servers must not auto-approve tools"
    violation_title: "Kiro MCP Tools Auto-Approved"
    iac_type: agent_config
    file_pattern: ".kiro/settings/mcp.json"
    expect: structured
    evaluator: kiro_mcp_auto_approve
    severity_if_violated: Medium
    cwe: CWE-732
    finding_type: FT-181
    rationale: "Tools listed in autoApprove run without a confirmation, so any repository content that steers the agent reaches those tools directly."
    remediation: "Empty the autoApprove list, or keep only read-only tools in it"

  - id: IAC-071
    stride: Elevation of Privilege
    name: "Automation must not run a coding agent without sandbox or approvals"
    violation_title: "Unsandboxed Coding Agent in Automation"
    iac_type: agent_automation
    file_pattern: ".github/workflows/*.yml"
    pattern: "--dangerously-skip-permissions|--dangerously-bypass-approvals-and-sandbox|--allow-all-tools|--approval-mode[ =]yolo|--sandbox[ =]danger-full-access|--permission-mode[ =]bypassPermissions|(?<![\\w-])--yolo(?![\\w-])"
    expect: absent
    severity_if_violated: High
    cwe: CWE-250
    finding_type: FT-180
    rationale: "The repository's workflow or script starts an agent with approvals and isolation switched off, with repository write access and CI secrets in its environment and no human in the loop."
    remediation: "Drop the bypass flag and grant the agent the specific tools the job needs"

  - id: IAC-072
    stride: Elevation of Privilege
    name: "Committed agent hooks must not run remote or constructed commands"
    violation_title: "Agent Hook Runs Remote or Constructed Commands"
    iac_type: agent_config
    file_pattern: ".claude/*.json"
    expect: structured
    evaluator: claude_hook_runs_untrusted_command
    severity_if_violated: High
    cwe: CWE-829
    finding_type: FT-182
    rationale: "A hook runs on every matching event, before anyone reviews the result. Piping fetched content into a shell executes whatever the remote host serves that day, and building the command through substitution lets the tool payload or the prompt text decide what runs."
    remediation: "Replace the hook body with a checked-in script that takes no interpolated input and fetches nothing at run time"

  - id: IAC-073
    stride: Information Disclosure
    name: "Committed agent hooks must not egress or delete on every trigger"
    violation_title: "Agent Hook Egresses or Deletes on Every Trigger"
    iac_type: agent_config
    file_pattern: ".claude/*.json"
    expect: structured
    evaluator: claude_hook_egresses_or_destroys
    severity_if_violated: Medium
    cwe: CWE-668
    finding_type: FT-182
    rationale: "The hook sends data outward or removes files each time its event fires, for every contributor, with whatever the session holds in scope."
    remediation: "Drop the network call or destructive command from the hook, or gate it behind an explicit local opt-in"

  - id: IAC-074
    stride: Elevation of Privilege
    name: "Committed permission rules must not grant shell or credential access"
    violation_title: "Agent Permission Rules Grant Shell or Credential Access"
    iac_type: agent_config
    file_pattern: ".claude/settings*.json"
    expect: structured
    evaluator: claude_permission_grants_host_control
    severity_if_violated: High
    cwe: CWE-732
    finding_type: FT-181
    rationale: "A pre-approved `Bash(*)`, a high-risk command wildcard, an unrestricted write, or a rule naming a credential-bearing path removes the prompt for exactly the calls the prompt exists for — and it does so for everyone who opens the repository."
    remediation: "Narrow each allow rule to the command or path the workflow needs, and keep credential paths in permissions.deny"

  - id: IAC-075
    stride: Information Disclosure
    name: "Committed permission rules must not grant unrestricted read or fetch"
    violation_title: "Agent Permission Rules Grant Unrestricted Read or Fetch"
    iac_type: agent_config
    file_pattern: ".claude/settings*.json"
    expect: structured
    evaluator: claude_permission_grants_broad_access
    severity_if_violated: Medium
    cwe: CWE-668
    finding_type: FT-181
    rationale: "An unrestricted `Read` reaches files outside the project, and a `WebFetch` without a domain list is a usable channel for sending what it read anywhere."
    remediation: "Scope Read rules to project paths and pin WebFetch to the domains the work needs"

  # ============ Kubernetes manifests ============
  # Evaluated per workload manifest (Pod, Deployment, StatefulSet, DaemonSet,
  # ReplicaSet, ReplicationController, Job, CronJob). A missing NetworkPolicy is
  # a property of a namespace across files and is not checked per file.
  - id: IAC-080
    stride: Elevation of Privilege
    name: "Kubernetes containers run unprivileged"
    violation_title: "Privileged Kubernetes Container"
    iac_type: kubernetes
    file_pattern: "k8s/*.yaml"
    expect: structured
    evaluator: kubernetes_privileged_container
    severity_if_violated: High
    cwe: CWE-250
    finding_type: FT-163
    rationale: "`securityContext.privileged: true` gives the container every capability and the host's devices, so a compromise of the workload is a compromise of the node."
    remediation: "Remove `privileged: true`; add only the individual capabilities the workload needs"

  - id: IAC-081
    stride: Elevation of Privilege
    name: "Kubernetes pods keep their own namespaces"
    violation_title: "Kubernetes Pod Shares Host Namespaces"
    iac_type: kubernetes
    file_pattern: "k8s/*.yaml"
    expect: structured
    evaluator: kubernetes_host_namespace
    severity_if_violated: High
    cwe: CWE-668
    finding_type: FT-163
    rationale: "`hostNetwork`, `hostPID`, or `hostIPC` puts the pod into the node's namespace, where it sees node traffic and processes and bypasses network policy."
    remediation: "Remove `hostNetwork`/`hostPID`/`hostIPC` and expose the workload through a Service"

  - id: IAC-082
    stride: Elevation of Privilege
    name: "Kubernetes containers are prevented from running as root"
    violation_title: "Kubernetes Container Allowed to Run as Root"
    iac_type: kubernetes
    file_pattern: "k8s/*.yaml"
    expect: structured
    evaluator: kubernetes_root_not_prevented
    severity_if_violated: Medium
    cwe: CWE-250
    finding_type: FT-163
    rationale: "Without `runAsNonRoot: true` or a non-zero `runAsUser` on the pod or the container, an image that defaults to root runs as root and any container escape starts with root."
    remediation: "Set `securityContext.runAsNonRoot: true` and a non-zero `runAsUser` on the pod or each container"

  - id: IAC-083
    stride: Information Disclosure
    name: "Kubernetes container secrets come from Secret references"
    violation_title: "Hardcoded Secret in Kubernetes Container Env"
    iac_type: kubernetes
    file_pattern: "k8s/*.yaml"
    expect: structured
    evaluator: kubernetes_env_secret_literal
    severity_if_violated: High
    cwe: CWE-798
    finding_type: FT-050
    breach_vector: "Repo-Read"
    rationale: "A credential in a container's `env[].value` is committed with the manifest and visible to anyone who can read the Deployment."
    remediation: "Store the value in a Secret and reference it with `valueFrom.secretKeyRef`; rotate the committed value"

  - id: IAC-084
    stride: Information Disclosure
    name: "Kubernetes Ingresses and OpenShift Routes terminate TLS"
    violation_title: "Kubernetes Ingress or Route Without TLS"
    iac_type: kubernetes
    file_pattern: "k8s/*.yaml"
    expect: structured
    evaluator: kubernetes_route_without_tls
    severity_if_violated: Medium
    cwe: CWE-319
    finding_type: FT-053
    rationale: "An Ingress without `spec.tls`, a Route without `tls.termination`, or a Route with `insecureEdgeTerminationPolicy: Allow` serves the application over plain HTTP, so credentials and session tokens cross the network readable and alterable."
    remediation: "Add a `tls` section with a certificate to the Ingress or Route, and set `insecureEdgeTerminationPolicy` to `Redirect` or `None`"

  # ============ Helm values ============
  # A chart's values.yaml (next to its Chart.yaml) and GitLab Auto Deploy's
  # .gitlab/auto-deploy-values.yaml configure the rendered workload. The chart
  # templates themselves have no checks, so `helm` stays an uncovered surface.
  - id: IAC-085
    stride: Elevation of Privilege
    name: "Helm chart values run the container unprivileged"
    violation_title: "Privileged Container in Helm Chart Values"
    iac_type: helm_values
    file_pattern: "values.yaml"
    expect: structured
    evaluator: helm_values_privileged_container
    severity_if_violated: High
    cwe: CWE-250
    finding_type: FT-163
    rationale: "`securityContext.privileged: true` in the chart values gives the rendered container every capability and the host's devices."
    remediation: "Remove `privileged: true` from the values; add only the individual capabilities the workload needs"

  - id: IAC-086
    stride: Information Disclosure
    name: "Helm chart values enable the ingress only with TLS"
    violation_title: "Helm Chart Ingress Without TLS"
    iac_type: helm_values
    file_pattern: "values.yaml"
    expect: structured
    evaluator: helm_values_ingress_without_tls
    severity_if_violated: Medium
    cwe: CWE-319
    finding_type: FT-053
    rationale: "An enabled ingress without a `tls` section serves the application over plain HTTP, so credentials and session tokens cross the network readable and alterable."
    remediation: "Add `ingress.tls` with the hosts and certificate secret to the chart values"

  # ============ Terraform ============
  - id: IAC-090
    stride: Information Disclosure
    name: "Terraform ingress to data and admin ports is restricted"
    violation_title: "Data or Admin Port Open to the Internet"
    iac_type: terraform
    file_pattern: "*.tf"
    expect: structured
    evaluator: terraform_open_sensitive_ingress
    severity_if_violated: High
    cwe: CWE-668
    finding_type: FT-164
    breach_vector: "Internet Anon"
    rationale: "An ingress rule from `0.0.0.0/0` or `::/0` to SSH, RDP, a database, or a broker port makes that service directly attackable from the internet."
    remediation: "Restrict the source to known CIDRs or security groups and reach admin ports through a bastion or VPN"

  - id: IAC-091
    stride: Information Disclosure
    name: "Terraform storage buckets and containers are private"
    violation_title: "Publicly Accessible Storage Bucket"
    iac_type: terraform
    file_pattern: "*.tf"
    expect: structured
    evaluator: terraform_public_storage
    severity_if_violated: High
    cwe: CWE-668
    finding_type: FT-164
    breach_vector: "Internet Anon"
    rationale: "A public ACL, a disabled public access block, or a policy granting `*` lets anyone on the internet read the stored objects."
    remediation: "Enable all public access block flags, drop public ACLs, and grant bucket access to named principals only"

  - id: IAC-092
    stride: Information Disclosure
    name: "Terraform data stores encrypt data at rest"
    violation_title: "Unencrypted Data Store at Rest"
    iac_type: terraform
    file_pattern: "*.tf"
    expect: structured
    evaluator: terraform_unencrypted_storage
    severity_if_violated: Medium
    cwe: CWE-311
    finding_type: FT-164
    rationale: "A database, volume, or cache with encryption disabled — or left at a provider default that is unencrypted — exposes its data through snapshots, backups, and underlying storage."
    remediation: "Set the resource's encryption flag to `true`, preferably with a customer-managed KMS key"

  - id: IAC-093
    stride: Information Disclosure
    name: "Terraform credentials come from variables without defaults or a secret store"
    violation_title: "Hardcoded Credential in Terraform Configuration"
    iac_type: terraform
    file_pattern: "*.tf"
    expect: structured
    evaluator: terraform_credential_literal
    severity_if_violated: High
    cwe: CWE-798
    finding_type: FT-050
    breach_vector: "Repo-Read"
    rationale: "A credential written as a literal attribute, local, or variable default is committed with the configuration and lands in plan output and state."
    remediation: "Declare the variable without a default and mark it `sensitive`, or read the value from a secret manager data source; rotate the committed value"

  - id: IAC-094
    stride: Information Disclosure
    name: "Terraform load balancers serve HTTPS"
    violation_title: "Load Balancer Serving Plain HTTP"
    iac_type: terraform
    file_pattern: "*.tf"
    expect: structured
    evaluator: terraform_plaintext_load_balancer
    severity_if_violated: Medium
    cwe: CWE-319
    finding_type: FT-053
    rationale: "A load balancer whose listeners in this file speak only HTTP carries credentials and session tokens unencrypted between clients and the service."
    remediation: "Add an HTTPS listener with an ACM certificate and turn the HTTP listener into a redirect to HTTPS"

  - id: IAC-095
    stride: Information Disclosure
    name: "Terraform compute resources stay without public IP addresses"
    violation_title: "Compute Resource With a Public IP Address"
    iac_type: terraform
    file_pattern: "*.tf"
    expect: structured
    evaluator: terraform_public_compute_address
    severity_if_violated: Medium
    cwe: CWE-668
    finding_type: FT-164
    rationale: "An EC2 instance or ECS task with a public IP address is reachable from the internet directly, bypassing the load balancer and whatever it enforces, as far as its security groups allow."
    remediation: "Place the instance or task in a private subnet without a public IP and reach it through a load balancer or NAT"

  - id: IAC-096
    stride: Information Disclosure
    name: "Terraform databases are not publicly accessible"
    violation_title: "Publicly Accessible Database Instance"
    iac_type: terraform
    file_pattern: "*.tf"
    expect: structured
    evaluator: terraform_publicly_accessible_database
    severity_if_violated: High
    cwe: CWE-668
    finding_type: FT-164
    breach_vector: "Internet Anon"
    rationale: "`publicly_accessible = true` gives the database a public endpoint, so its login is attackable from the internet whenever a security group admits the traffic."
    remediation: "Set `publicly_accessible = false` and reach the database only from the application subnets"

  - id: IAC-097
    stride: Elevation of Privilege
    name: "Terraform IAM policies grant specific actions on specific resources"
    violation_title: "Wildcard IAM Permissions on All Resources"
    iac_type: terraform
    file_pattern: "*.tf"
    expect: structured
    evaluator: terraform_wildcard_iam_policy
    severity_if_violated: High
    cwe: CWE-732
    finding_type: FT-164
    rationale: "A policy that allows `*` or `service:*` on `Resource \"*\"` lets whoever holds the role use the whole service across the account, so a compromise of one workload reaches every resource of that service."
    remediation: "List the specific actions the workload calls and the ARNs of the resources it needs"

# Deployment-inventory facts the deployment figure marks `weak`, each covered
# by the checks named here on the same file, or listed with `exception` and its
# reason when no file-level check can express it. `fact` is a full-match regex
# on the fact text. tests/test_iac_resource_checks.py fails when a weak fact of
# scripts/analyzers/deployment_inventory.py has no entry, so a weakness never appears
# only in a figure.
inventory_weak_facts:
  - fact: "privileged container"
    checks: [IAC-020, IAC-080, IAC-085]
  - fact: "Docker socket mounted"
    checks: [IAC-021]
  - fact: "host network"
    checks: [IAC-081]
  - fact: "no TLS"
    checks: [IAC-084]
  - fact: "plain HTTP also accepted \\(insecureEdgeTerminationPolicy: Allow\\)"
    checks: [IAC-084]
  - fact: "no TLS on the ingress"
    checks: [IAC-086]
  - fact: "HTTP :\\S*( from 0\\.0\\.0\\.0/0)? — no TLS"
    checks: [IAC-094]
  - fact: "public IP( on the tasks)?"
    checks: [IAC-095]
  - fact: "publicly accessible"
    checks: [IAC-096]
  - fact: "task role may use \\S+ on every resource"
    checks: [IAC-097]
  - fact: "(storage )?not encrypted"
    checks: [IAC-092]
