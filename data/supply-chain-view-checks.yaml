# Where Figure 1b shows a config/IaC finding, and which attack entry it can establish (RA-30).
#
# `element` places the finding on a supply-chain element: repository, package
# (one row per ecosystem), github_action, base_image, remote_script, ci_include, ci (the CI
# system that owns the cited file) or artifact (a release artifact). `entry`
# names the attack mechanism the finding establishes; a check without `entry`
# is shown on its element and never draws an attack arrow. `requires: pushed`
# limits the entry to repositories that push a container image.
#
# `runtime` lists checks about the running system. Their findings stay on the
# runtime components of Figure 1a. On a build-plane component, which Figure 1a
# does not draw, Figure 1b lists them without an owner and without an entry.
#
# Every check in data/config-iac-checks.yaml appears exactly once, in `checks`
# or in `runtime` (tests/test_build_supply_chain_view.py).

entries: [dependency, ci-input, repository, artifact]

checks:
  IAC-001: {element: base_image, entry: ci-input}
  IAC-004: {element: package}
  IAC-005: {element: package, entry: dependency}
  IAC-010: {element: ci}
  IAC-011: {element: github_action, entry: ci-input}
  IAC-012: {element: ci, entry: repository}
  IAC-013: {element: ci, entry: repository}
  IAC-014: {element: ci}
  IAC-015: {element: ci}
