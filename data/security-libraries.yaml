# Supported JS/TS implementation signals and runtime dependency inventory.
# Library presence never establishes enforcement or suppresses a weakness.
# The detector records source practices; it cannot prove global control absence.
# `central_control` selects a reviewed mechanism with source-backed wording.
# Domains without it retain inventory only and do not emit weakness signals.
# Values are canonical classes from data/weakness-classes.yaml.
version: 1
domains:
  injection:
    # Parameterized ORMs / query builders + input-validation schema libs.
    vetted_libs:
      [sequelize, prisma, "@prisma/client", typeorm, knex, "drizzle-orm", mikro-orm,
       zod, joi, "@hapi/joi", yup, ajv, "express-validator", "class-validator"]
    bespoke_patterns:
      - '(?i)\.query\s*\(\s*`\s*(?:select|insert|update|delete|with|replace)\b[^`]*\$\{\s*[A-Za-z_$]'
      - '(?i)\.query\s*\(\s*(?:"\s*(?:select|insert|update|delete|with|replace)\b[^"]*"|''\s*(?:select|insert|update|delete|with|replace)\b[^'']*'')\s*\+\s*[A-Za-z_$]'
    central_control:
      principle: "input validation / query parametrization"
      mechanism_id: database-query-concatenation
      cwe: CWE-89
      weakness_title: "Database access relies on concatenated queries"
      statement: "Database queries are assembled from application values instead of passing those values through an enforced parameterised data-access path."

  broken_auth:
    vetted_libs:
      [passport, next-auth, "@auth/core", "openid-client", "express-session",
       jsonwebtoken, jose, "@fastify/jwt"]
    bespoke_patterns:
      - "algorithms\\s*:\\s*\\[\\s*['\"]none"    # verify with alg:none accepted
    central_control:
      principle: "authentication / token verification"
      mechanism_id: unsigned-token-acceptance
      cwe: CWE-347
      weakness_title: "Token verification permits unsigned tokens"
      statement: "A token-verification configuration explicitly permits the unsigned algorithm."

  weak_crypto:
    vetted_libs:
      [argon2, bcrypt, bcryptjs, "libsodium-wrappers", libsodium, scrypt, "node-forge"]
    bespoke_patterns:
      - '(?i)crypto\.createHash\(\s*[''"`](?:md5|sha1)[''"`]\s*\)\.update\(\s*(?:pw|password|secret|token)\b'
      - '(?i)\b(?:token|secret|sessionKey)\s*=\s*Math\.random\(\)'

  output_xss_csp:
    vetted_libs: [dompurify, "sanitize-html", xss]
    bespoke_patterns:
      - 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*(?!(?:DOMPurify\.sanitize|sanitizeHtml)\b)[A-Za-z_$][\w.$]*(?:\s*[,}])'
      - '\.innerHTML\s*=\s*(?!(?:DOMPurify\.sanitize|sanitizeHtml)\b)[A-Za-z_$][\w.$]*(?:\s*[;\n]|\s*$)'
      - 'bypassSecurityTrustHtml\s*\(\s*(?:[A-Za-z_$][\w.$]*|`[^`]*\$\{)'
    central_control:
      principle: "output encoding / sanitization"
      mechanism_id: frontend-output-encoding
      cwe: CWE-79
      weakness_title: "Frontend rendering lacks enforced output encoding"
      statement: "Browser rendering paths write HTML or DOM content directly without one enforced contextual-encoding or sanitisation boundary."

  missing_authz:
    vetted_libs: ["@casl/ability", casl, accesscontrol]
    bespoke_patterns:
      - "req\\.user\\.(role|isAdmin)\\s*==="    # ad-hoc per-handler role check
    # A local role check alone does not prove a missing authorization policy.

  server_side_exposure:
    vetted_libs: [ssrf-req-filter]
    bespoke_patterns:
      - 'axios\.(get|post)\(\s*req\.'            # user-controlled outbound request
