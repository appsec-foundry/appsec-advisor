schema_version: 1
catalog_id: core-stage1-v1

# Human review surface: threat-modeling categories, contexts, agents, and
# routing decisions. Implementation and security mappings live separately.
categories:
  - id: target_and_run
    name: Target and run
    description: What is being assessed and which operator-selected run settings apply.
  - id: business_and_requirements
    name: Business context and requirements
    description: Business purpose, security expectations, policies, requirements, and related project facts.
  - id: repository_discovery
    name: Repository discovery
    description: Technologies, entry points, deployment surfaces, configuration, and other discovered repository
      signals.
  - id: architecture_and_data_flows
    name: Architecture, assets, and data flows
    description: Components, security architecture, routes, assets, interfaces, relationships, assumptions, and
      validated data-flow structure.
  - id: actors_and_abuse_cases
    name: Actors and abuse cases
    description: Human and system actors, privileges, attacker goals, abuse-case candidates, and verification evidence.
  - id: trust_boundaries
    name: Trust boundaries
    description: Boundary candidates, canonical boundaries, crossings, assumptions, and coverage decisions.
  - id: security_controls_and_evidence
    name: Security controls and evidence
    description: Existing controls and mitigations, control gaps, deterministic checks, source evidence, and bounded
      evidence samples.
  - id: threat_analysis
    name: Threat analysis
    description: Threat hypotheses, STRIDE categories, analysis lenses, threat candidates, proposed mitigations, and
      consolidation decisions.
  - id: verification_and_risk
    name: Verification and risk
    description: Evidence verdicts, severity and ranking decisions, triage state, and bounded synthesis requests.
  - id: prior_runs_and_identity
    name: Prior runs and identity
    description: Stable finding identity, prior findings, accepted risk, baselines, and carry-forward state.

# Names and purposes are written for AppSec and engineering reviewers.
agents:
  - id: context_resolver
    name: Project context resolver
    purpose: Resolve bounded business, policy, requirements, and related-repository context.
    scope: whole_run
    stage: Project context
  - id: recon_scanner
    name: Repository reconnaissance scanner
    purpose: Discover repository technologies, entry points, deployment surfaces, and security signals.
    scope: whole_run
    stage: Repository discovery
  - id: config_scanner
    name: Configuration and infrastructure scanner
    purpose: Inspect bounded configuration, infrastructure-as-code, container, and deployment surfaces.
    scope: whole_run
    stage: Configuration discovery
  - id: actor_discoverer
    name: Actor discoverer
    purpose: Propose repository-specific actors from the validated static actor set and recon signals.
    scope: whole_run
    stage: Actor discovery
  - id: architecture_analyst
    name: Architecture analyst
    purpose: Build the component, data-flow, asset, and attack-surface model.
    scope: whole_run
    stage: Architecture analysis
  - id: trust_boundary_analyst
    name: Trust-boundary analyst
    purpose: Assess only the bounded deterministic trust-boundary handoff.
    scope: whole_run
    stage: Trust-boundary analysis
  - id: control_analyst
    name: Security-control analyst
    purpose: Assess component controls and produce bounded per-component analysis guidance.
    scope: whole_run
    stage: Security-control analysis
  - id: stride_analyzer
    name: STRIDE component analyst
    purpose: Analyze one selected component from bounded evidence, taxonomy, and fixed lenses.
    scope: one_component
    stage: Threat analysis
  - id: threat_merger
    name: Threat merge reviewer
    purpose: Review bounded candidate groups without reading the complete architecture or source tree.
    scope: whole_run
    stage: Threat consolidation
  - id: evidence_verifier
    name: Evidence verifier
    purpose: Verify a bounded sample of finding citations against repository evidence.
    scope: whole_run
    stage: Evidence verification
  - id: triage_validator
    name: Triage fallback validator
    purpose: Repair triage only when deterministic ranking cannot complete.
    scope: whole_run
    stage: Risk triage
  - id: post_stride_synthesizer
    name: Post-STRIDE synthesizer
    purpose: Synthesize only requested root-cause or mitigation decisions from validated threat inputs.
    scope: whole_run
    stage: Risk synthesis
  - id: abuse_case_verifier
    name: Abuse-case verifier
    purpose: Verify one matched abuse case against bounded entry-point, sink, and control evidence.
    scope: one_candidate
    stage: Abuse-case verification

# Runtime migration state is reported by effective-plan receipts and the
# implementation plan; it is not a human routing choice.
contexts:
  - id: run.configuration
    name: Resolved run configuration
    category: target_and_run
    description: Validated run choices and bounded operator inputs used by early analysis.
    scope: whole_run
  - id: run.assessment_depth
    name: Assessment depth
    category: target_and_run
    description: Validated quick, standard, or thorough depth used to bound optional discovery and analysis effort.
    scope: whole_run
  - id: run.scan_manifest
    name: Operator scan manifest
    category: target_and_run
    description: Optional file selection explicitly supplied by the operator for this run.
    scope: whole_run
  - id: business.project_context
    name: Resolved project context
    category: business_and_requirements
    description: Bounded business purpose, architecture decisions, policy, and related-project facts treated as
      data.
    scope: whole_run
  - id: business.organization_context
    name: Organization context
    category: business_and_requirements
    description: Preset-selected organization facts loaded as bounded untrusted reference data.
    scope: whole_run
  - id: business.component_context
    name: Component business impact
    category: business_and_requirements
    description: Business purpose, compromise impact, sensitive assets, obligations, and explicit assumptions that
      apply to the current component.
    scope: one_component
  - id: architecture.component_context
    name: Component security architecture
    category: architecture_and_data_flows
    description: Security role, exposed interfaces, security dependencies, deployment constraints, and analytical
      assumptions that apply to the current component.
    scope: one_component
  - id: business.context_sources
    name: Project context source documents
    category: business_and_requirements
    description: Repository and organization documents used to derive business and security context.
    scope: whole_run
  - id: requirements.security
    name: Resolved security requirements
    category: business_and_requirements
    description: Validated requirements selected from operator, organization, repository, or fallback policy.
    scope: whole_run
  - id: requirements.component_context
    name: Component requirement violations
    category: business_and_requirements
    description: Bounded validated requirement violations that apply to the current component.
    scope: one_component
  - id: prior_run.findings
    name: Prior findings and stable identity
    category: prior_runs_and_identity
    description: Prior canonical findings and identity anchors used for carry-forward and stable references.
    scope: whole_run
  - id: prior_run.component_findings
    name: Component prior findings
    category: prior_runs_and_identity
    description: Bounded prior finding and stable-identity records that apply to the current component.
    scope: one_component
  - id: discovery.recon_patterns
    name: Deterministic recon patterns
    category: repository_discovery
    description: Best-effort deterministic reconnaissance signals prepared before semantic discovery.
    scope: whole_run
  - id: discovery.repository_surface
    name: Repository discovery surface
    category: repository_discovery
    description: Bounded direct reads used to discover technology, entry points, deployment, and security signals.
    scope: whole_run
  - id: discovery.scan_policy
    name: Core scan policy
    category: repository_discovery
    description: Plugin-owned exclusions and output structure that constrain broad reconnaissance.
    scope: whole_run
  - id: discovery.config_checks
    name: Configuration and IaC checks
    category: repository_discovery
    description: Plugin-owned checks, evidence requirements, mappings, and false-positive exclusions.
    scope: whole_run
  - id: discovery.config_surface
    name: Configuration discovery surface
    category: repository_discovery
    description: Bounded selected configuration, infrastructure, container, and deployment files.
    scope: whole_run
  - id: discovery.recon_summary
    name: Validated reconnaissance summary
    category: repository_discovery
    description: Bounded numbered summary of the discovered application and security surface.
    scope: whole_run
  - id: discovery.recon_projection
    name: Bounded reconnaissance projection
    category: repository_discovery
    description: Canonical recon headings with deterministic per-section and whole-context omission disclosure.
    scope: whole_run
  - id: discovery.recon_signals
    name: Structured reconnaissance signals
    category: repository_discovery
    description: Validated deployable-unit, exposure, actor, and capability signals.
    scope: whole_run
  - id: architecture.routes
    name: Route inventory
    category: architecture_and_data_flows
    description: Deterministically extracted application routes and entry-point metadata.
    scope: whole_run
  - id: architecture.route_projection
    name: Bounded architecture route projection
    category: architecture_and_data_flows
    description: Risk-shaped and framework-diverse route records selected from the complete deterministic inventory.
    scope: whole_run
  - id: architecture.targeted_source
    name: Targeted architecture source reads
    category: architecture_and_data_flows
    description: Bounded reads used to resolve architecture details absent from deterministic projections.
    scope: whole_run
  - id: architecture.components
    name: Components and security architecture
    category: architecture_and_data_flows
    description: Validated component identities, types, paths, technologies, exposure, and trust placement.
    scope: whole_run
  - id: architecture.coverage
    name: Architecture coverage signals
    category: architecture_and_data_flows
    description: Deterministic architecture-control checks and coverage dispositions.
    scope: whole_run
  - id: architecture.complete_model
    name: Complete shared architecture model
    category: architecture_and_data_flows
    description: Aggregate architecture context forbidden to focused consumers when bounded projections exist.
    scope: whole_run
  - id: actors.static
    name: Static actor set
    category: actors_and_abuse_cases
    description: Validated default, organization, and repository actors available before semantic discovery.
    scope: whole_run
  - id: actors.resolved
    name: Resolved actor set
    category: actors_and_abuse_cases
    description: Final actor identities and privileges after static and optional semantic discovery are merged.
    scope: whole_run
  - id: actors.component_context
    name: Component actors
    category: actors_and_abuse_cases
    description: Bounded resolved actors whose privileges and reachability apply to the current component.
    scope: one_component
  - id: abuse_cases.matches
    name: Matched abuse-case candidate projection
    category: actors_and_abuse_cases
    description: One bounded candidate definition and its matched finding evidence, projected from the complete match set.
    scope: one_candidate
  - id: abuse_cases.evidence
    name: Abuse-case verification evidence
    category: actors_and_abuse_cases
    description: Bounded entry-point, sink, and control evidence used to verify one candidate.
    scope: one_candidate
  - id: trust_boundaries.assessment
    name: Trust-boundary assessment handoff
    category: trust_boundaries
    description: Bounded deterministic component and flow projection for boundary assessment.
    scope: whole_run
  - id: trust_boundaries.canonical
    name: Canonical trust boundaries
    category: trust_boundaries
    description: Validated promoted boundaries, crossings, assumptions, and coverage decisions.
    scope: whole_run
  - id: trust_boundaries.component_context
    name: Component trust boundaries
    category: trust_boundaries
    description: Bounded canonical boundary records adjacent to the current component.
    scope: one_component
  - id: controls.analysis_source
    name: Current control-analysis source context
    category: security_controls_and_evidence
    description: Targeted source and requirements reads not yet covered by exact-byte action receipts.
    scope: whole_run
  - id: controls.component_evidence
    name: Component evidence bundle
    category: security_controls_and_evidence
    description: Bounded interfaces, deterministic signals, related-repository evidence, and source slices relevant
      to one component.
    scope: one_component
  - id: controls.component_context
    name: Component controls and existing mitigations
    category: security_controls_and_evidence
    description: Bounded control and existing-mitigation records that apply to the current component.
    scope: one_component
  - id: threats.dispatch_plan
    name: Component STRIDE context plan
    category: threat_analysis
    description: Validated component projection binding analysis policy, lenses, and admitted artifact receipts.
    scope: one_component
  - id: threats.component_taxonomy
    name: Component threat taxonomy
    category: threat_analysis
    description: Bounded plugin-owned threat and CWE taxonomy selected for one component.
    scope: one_component
  - id: threats.known_threats
    name: Component known threats
    category: threat_analysis
    description: Bounded team-provided known-threat records that apply to the current component.
    scope: one_component
  - id: threats.related_repositories
    name: Component related-repository roots
    category: threat_analysis
    description: Validated roots for only the related repositories cited by one component's admitted source evidence.
    scope: one_component
  - id: threats.analysis_lenses
    name: Applicable threat-analysis lenses
    category: threat_analysis
    description: Fixed plugin-owned technology and capability lenses selected from a closed registry.
    scope: one_component
  - id: threats.optional_discovery
    name: Optional component discovery
    category: threat_analysis
    description: Existing component-local optional discovery that must not expand repository access.
    scope: one_component
  - id: threats.analysis_settings
    name: Bounded component analysis policy
    category: threat_analysis
    description: Controller-selected analysis effort and evidence-sampling decisions for one component.
    scope: one_component
  - id: threats.merge_review
    name: Merge review candidate groups
    category: threat_analysis
    description: Bounded candidate groups projected from the complete deterministic merge state.
    scope: whole_run
  - id: threats.merge_scope
    name: Merge decision scope
    category: threat_analysis
    description: Group identifiers for which the merge reviewer must return decisions.
    scope: whole_run
  - id: threats.merged
    name: Canonical threats and proposed mitigations
    category: threat_analysis
    description: Validated semantic and deterministic threats with their proposed mitigations before evidence and
      triage updates.
    scope: whole_run
  - id: threats.generated_projection
    name: Generated threat synthesis input
    category: threat_analysis
    description: Bounded threat mechanisms and component tiers selected from the canonical merged set.
    scope: whole_run
  - id: threats.proposed_mitigations_projection
    name: Proposed mitigation synthesis input
    category: threat_analysis
    description: Bounded proposed remediation and verification records paired with canonical threat IDs.
    scope: whole_run
  - id: verification.evidence_sample
    name: Evidence verification sample
    category: verification_and_risk
    description: Deterministically selected findings with exact-source-bound cited code windows.
    scope: whole_run
  - id: verification.triage_flags
    name: Triage decisions
    category: verification_and_risk
    description: Validated ranking, severity, evidence, and review flags associated with merged threats.
    scope: whole_run
  - id: verification.triage_context
    name: Current triage policy context
    category: verification_and_risk
    description: Existing policy and helper reads not yet covered by exact-byte action receipts.
    scope: whole_run
  - id: verification.synthesis_scope
    name: Requested synthesis decisions
    category: verification_and_risk
    description: Bounded decision identifiers that constrain post-STRIDE synthesis.
    scope: whole_run

# Required and forbidden entries are core security policy. Extensions may make
# policy stricter but may not weaken these decisions.
assignments:
  - id: run-config-for-early-analysis
    context: run.configuration
    agents:
      - context_resolver
      - recon_scanner
      - config_scanner
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Early analysis must use the validated run settings and may not infer them from repository content.
  - id: assessment-depth-for-bounded-discovery
    context: run.assessment_depth
    agents:
      - config_scanner
      - actor_discoverer
    delivery: optional
    importance: supporting
    applies_to: whole_run
    reason: Assessment depth bounds optional discovery work.
  - id: scan-manifest-for-recon
    context: run.scan_manifest
    agents:
      - recon_scanner
    delivery: optional
    importance: supporting
    applies_to: whole_run
    reason: The manifest narrows discovery only when the operator explicitly provides it.
  - id: business-context-sources
    context: business.context_sources
    agents:
      - context_resolver
    delivery: optional
    importance: supporting
    applies_to: whole_run
    reason: Project documents provide bounded facts and remain untrusted data.
  - id: project-context-for-component-projection
    context: business.project_context
    agents:
      - control_analyst
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: The control analyst projects applicable business facts once so focused component agents never receive
      the complete shared document.
  - id: organization-context-for-component-projection
    context: business.organization_context
    agents:
      - control_analyst
    delivery: optional
    importance: supporting
    applies_to: whole_run
    reason: Preset-selected organization facts enrich the component projection when an organization profile provides
      them.
  - id: component-business-impact-for-stride
    context: business.component_context
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: A component receives only an independently selected business-impact projection when applicable facts are
      available.
  - id: component-security-architecture-for-stride
    context: architecture.component_context
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: A component receives only its bounded security-architecture projection; the complete shared model remains
      forbidden.
  - id: security-requirements
    context: requirements.security
    agents:
      - context_resolver
    delivery: optional
    importance: supporting
    applies_to: whole_run
    reason: Requirements enrich project context while the configured requirements fail mode remains authoritative.
  - id: deterministic-recon-patterns
    context: discovery.recon_patterns
    agents:
      - recon_scanner
    delivery: optional
    importance: supporting
    applies_to: whole_run
    reason: Deterministic patterns reduce broad discovery and retain the documented fallback.
  - id: repository-discovery
    context: discovery.repository_surface
    agents:
      - recon_scanner
    delivery: optional
    importance: background
    applies_to: whole_run
    reason: Recon may inspect bounded repository surfaces after deterministic inputs are considered.
  - id: core-scan-policy
    context: discovery.scan_policy
    agents:
      - recon_scanner
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Broad discovery must always apply plugin-owned exclusions and output structure.
  - id: core-config-checks
    context: discovery.config_checks
    agents:
      - config_scanner
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Configuration findings require plugin-owned checks and false-positive exclusions.
  - id: configuration-discovery
    context: discovery.config_surface
    agents:
      - config_scanner
    delivery: optional
    importance: supporting
    applies_to: whole_run
    reason: The scanner may read only bounded configuration and infrastructure surfaces.
  - id: static-actors-for-discovery
    context: actors.static
    agents:
      - actor_discoverer
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Semantic actor discovery extends a validated set rather than replacing it.
  - id: recon-summary-for-actors-and-architecture
    context: discovery.recon_projection
    agents:
      - actor_discoverer
      - architecture_analyst
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Actor and architecture decisions receive only the validated bounded reconnaissance projection.
  - id: recon-signals-for-actors
    context: discovery.recon_signals
    agents:
      - actor_discoverer
    delivery: optional
    importance: supporting
    applies_to: whole_run
    reason: Structured signals improve actor discovery and cache binding without replacing the static actor set.
  - id: resolved-actors-for-architecture
    context: actors.resolved
    agents:
      - architecture_analyst
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Architecture must use finalized actor identities and privileges.
  - id: routes-for-architecture
    context: architecture.route_projection
    agents:
      - architecture_analyst
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: A bounded risk-shaped and diverse route projection anchors semantic attack-surface decisions while deterministic consumers retain the complete inventory.
  - id: no-complete-route-inventory-for-architecture
    context: architecture.routes
    agents:
      - architecture_analyst
    delivery: forbidden
    importance: essential
    applies_to: whole_run
    reason: Semantic architecture analysis receives the bounded route projection, never the complete route inventory.
  - id: targeted-source-for-architecture
    context: architecture.targeted_source
    agents:
      - architecture_analyst
    delivery: optional
    importance: background
    applies_to: whole_run
    reason: Targeted reads may resolve details absent from deterministic architecture inputs.
  - id: bounded-boundary-handoff
    context: trust_boundaries.assessment
    agents:
      - trust_boundary_analyst
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Boundary analysis receives only its validated deterministic assessment projection.
  - id: components-for-control-analysis
    context: architecture.components
    agents:
      - control_analyst
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Control overlays must reference finalized component identities.
  - id: boundaries-for-control-analysis
    context: trust_boundaries.canonical
    agents:
      - control_analyst
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Control analysis must use canonical promoted trust boundaries.
  - id: coverage-for-control-analysis
    context: architecture.coverage
    agents:
      - control_analyst
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Deterministic coverage signals must remain visible to control analysis.
  - id: current-control-source-context
    context: controls.analysis_source
    agents:
      - control_analyst
    delivery: optional
    importance: supporting
    applies_to: whole_run
    reason: Shadow mode records current targeted reads without claiming they are already projected or receipted.
  - id: stride-dispatch-plan
    context: threats.dispatch_plan
    agents:
      - stride_analyzer
    delivery: required
    importance: essential
    applies_to: current_component
    reason: Each component analyst receives one bounded plan instead of the whole-run STRIDE manifest.
  - id: stride-component-evidence
    context: controls.component_evidence
    agents:
      - stride_analyzer
    delivery: required
    importance: essential
    applies_to: current_component
    reason: Each component analyst receives only its bounded and receipted security evidence.
  - id: stride-component-known-threats
    context: threats.known_threats
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: Team-provided threats are delivered only through an independently receipted component projection.
  - id: stride-component-controls
    context: controls.component_context
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: Existing controls and mitigations are delivered only through an independently receipted component
      projection.
  - id: stride-component-prior-findings
    context: prior_run.component_findings
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: Prior findings are delivered only through an independently receipted component projection.
  - id: stride-component-actors
    context: actors.component_context
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: Resolved actors are delivered only when the component-specific actor slice contains applicable records.
  - id: stride-component-boundaries
    context: trust_boundaries.component_context
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: Canonical boundaries are delivered only through the current component's bounded projection.
  - id: stride-component-requirements
    context: requirements.component_context
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: Requirement violations are delivered only when they apply to the current component.
  - id: stride-component-taxonomy
    context: threats.component_taxonomy
    agents:
      - stride_analyzer
    delivery: required
    importance: essential
    applies_to: current_component
    reason: Threat categories are selected by the plugin and cannot be supplied by repository content.
  - id: stride-related-repositories
    context: threats.related_repositories
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: A component analyst receives roots only for related repositories cited by its admitted source slices.
  - id: stride-analysis-lenses
    context: threats.analysis_lenses
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: Applicable lenses resolve only from the plugin-owned closed registry.
  - id: stride-optional-discovery
    context: threats.optional_discovery
    agents:
      - stride_analyzer
    delivery: optional
    importance: background
    applies_to: current_component
    reason: Existing optional discovery remains component-local and may not expand repository access.
  - id: stride-analysis-settings
    context: threats.analysis_settings
    agents:
      - stride_analyzer
    delivery: optional
    importance: supporting
    applies_to: current_component
    reason: Controller-selected settings explain the bounded analysis effort.
  - id: bounded-merge-review
    context: threats.merge_review
    agents:
      - threat_merger
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Merge review operates only on the bounded candidate projection.
  - id: merge-decision-scope
    context: threats.merge_scope
    agents:
      - threat_merger
    delivery: optional
    importance: supporting
    applies_to: whole_run
    reason: Decision identifiers constrain review to deterministic candidate groups.
  - id: merged-threats-for-late-analysis
    context: threats.merged
    agents:
      - triage_validator
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Exceptional semantic triage repair retains controlled ownership of the canonical threat set.
  - id: evidence-sample-for-verification
    context: verification.evidence_sample
    agents:
      - evidence_verifier
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Verification receives only the deterministically selected findings and exact-source-bound cited windows.
  - id: generated-threats-for-synthesis
    context: threats.generated_projection
    agents:
      - post_stride_synthesizer
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Root-cause synthesis receives bounded threat mechanisms and component tiers, not the canonical merged set.
  - id: proposed-mitigations-for-synthesis
    context: threats.proposed_mitigations_projection
    agents:
      - post_stride_synthesizer
    delivery: required
    importance: essential
    applies_to: whole_run
    reason: Synthesis compares only bounded proposed mitigations paired to the supplied threat IDs.
  - id: optional-triage-flags-for-repair
    context: verification.triage_flags
    agents:
      - triage_validator
    delivery: optional
    importance: supporting
