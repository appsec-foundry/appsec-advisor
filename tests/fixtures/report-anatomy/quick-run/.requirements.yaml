categories:
- id: CAT-WEB
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/web-frontend-security
  title: Web & Frontend Security
  context: Applies to applications that serve browser content or accept cross-origin browser requests. OWASP Top 10:2025 A01, A02, and A05 are the primary risk mappings.
  requirements:
  - id: WEB-001
    url: https://appsec.int.example.com/req/web-frontend-security#web-001
    text: Applications that use cookie-based or other ambient browser credentials MUST reject forged cross-site state-changing requests with a framework CSRF control, a session-bound token, or a validated same-origin signal. SameSite cookies provide defense in depth and state-changing actions MUST NOT use HTTP GET.
    priority: MUST
  - id: WEB-002
    url: https://appsec.int.example.com/req/web-frontend-security#web-002
    text: Authentication tokens, secrets, and sensitive personal data MUST NOT be stored in browser storage accessible to JavaScript. Session cookies MUST use HttpOnly, Secure, and an appropriate SameSite value.
    priority: MUST
  - id: WEB-003
    url: https://appsec.int.example.com/req/web-frontend-security#web-003
    text: When cross-origin browser access is required, CORS MUST emit only the methods and headers needed and return an Access-Control-Allow-Origin value only for an exact-match trusted origin. Credentialed responses MUST NOT use a wildcard origin, and CORS MUST NOT replace authentication, authorization, or CSRF protection.
    priority: MUST
  - id: WEB-004
    url: https://appsec.int.example.com/req/web-frontend-security#web-004
    text: Browser applications MUST send a tested Content-Security-Policy that restricts content to required sources, blocks object embedding, restricts framing, and avoids unsafe-inline and unsafe-eval unless a documented nonce- or hash-based migration is in progress.
    priority: MUST
  - id: WEB-005
    url: https://appsec.int.example.com/req/web-frontend-security#web-005
    text: Production browser applications served over HTTPS MUST send Strict-Transport-Security with a minimum max-age of one year. includeSubDomains and preload MUST be enabled only when every affected subdomain is HTTPS-ready and controlled by the organization.
    priority: MUST
  - id: WEB-006
    url: https://appsec.int.example.com/req/web-frontend-security#web-006
    text: Frontend dependencies SHOULD be actively maintained, version-locked, integrity-verified, and built with the framework's production safety checks enabled. Language- or framework-specific strict modes apply only when that technology supports them.
    priority: SHOULD
  - id: WEB-007
    url: https://appsec.int.example.com/req/web-frontend-security#web-007
    text: Untrusted data MUST be rendered with contextual output encoding or framework-native safe binding for the target HTML, attribute, URL, CSS, or JavaScript context. Unsafe DOM sinks such as raw innerHTML MUST NOT receive unsanitized content.
    priority: MUST
  - id: WEB-008
    url: https://appsec.int.example.com/req/web-frontend-security#web-008
    text: Browser responses MUST set X-Content-Type-Options, Referrer-Policy, an application-specific Permissions-Policy, and a framing restriction through CSP frame-ancestors or X-Frame-Options.
    priority: MUST
- id: CAT-EH
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/error-handling-security-events
  title: Error Handling & Security Events
  context: Applies to every application and service. Failures must preserve security invariants and expose no diagnostic internals to untrusted clients.
  requirements:
  - id: EH-001
    url: https://appsec.int.example.com/req/error-handling-security-events#eh-001
    text: Expected and unexpected errors MUST leave the application in a defined secure state, roll back incomplete security-sensitive operations, and fail closed when authorization or security context is missing or ambiguous.
    priority: MUST
  - id: EH-002
    url: https://appsec.int.example.com/req/error-handling-security-events#eh-002
    text: Client error responses MUST NOT expose stack traces, query text, internal paths, credentials, tokens, or raw exceptions. Diagnostic details MAY be recorded only in access-controlled server-side logs after sensitive values are removed.
    priority: MUST
  - id: EH-003
    url: https://appsec.int.example.com/req/error-handling-security-events#eh-003
    text: Authentication, registration, password-reset, and authorization failures MUST use non-enumerating responses and MUST NOT reveal whether an account, tenant, or protected resource exists.
    priority: MUST
- id: CAT-HN
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/system-hardening
  title: System Hardening
  context: Applies to production services and their operational endpoints. Network placement is defense in depth and never replaces authentication or authorization.
  requirements:
  - id: HN-001
    url: https://appsec.int.example.com/req/system-hardening#hn-001
    text: Production responses MUST remove unnecessary technology-disclosure headers and default banners. Required protocol headers MUST reveal no more product or version detail than operationally necessary.
    priority: MUST
  - id: HN-002
    url: https://appsec.int.example.com/req/system-hardening#hn-002
    text: Debug endpoints MUST be disabled in production. Required management endpoints MUST be authenticated and authorized, expose only necessary operations, and be isolated from public ingress on a dedicated interface, listener, or upstream route.
    priority: MUST
  - id: HN-003
    url: https://appsec.int.example.com/req/system-hardening#hn-003
    text: Production deployments MUST disable unused features, modules, sample applications, directory listings, and debug modes, and MUST contain no default, shared, or vendor-supplied working account.
    priority: MUST
  - id: HN-004
    url: https://appsec.int.example.com/req/system-hardening#hn-004
    text: High-exposure internet-facing applications SHOULD use a managed WAF or equivalent edge control when the threat model justifies it. This control MUST NOT replace application authentication, authorization, validation, or timely remediation.
    priority: SHOULD
- id: CAT-SD
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/secure-design-business-logic
  title: Secure Design & Business Logic
  context: Applies to systems with protected assets, privileged workflows, trust boundaries, or business rules whose abuse could cause material impact.
  requirements:
  - id: SD-001
    url: https://appsec.int.example.com/req/secure-design-business-logic#sd-001
    text: The system MUST maintain a threat model for protected assets, trust boundaries, entry points, privileged operations, and material abuse cases, and MUST review it when those elements change.
    priority: MUST
  - id: SD-002
    url: https://appsec.int.example.com/req/secure-design-business-logic#sd-002
    text: Security-sensitive business rules, including ownership, transaction limits, workflow ordering, and state transitions, MUST be enforced server-side and tested against representative bypass and replay attempts.
    priority: MUST
  - id: SD-003
    url: https://appsec.int.example.com/req/secure-design-business-logic#sd-003
    text: High-impact or irreversible operations MUST require an authenticated and authorized actor, an explicit confirmation or approval appropriate to the risk, replay protection where applicable, and an attributable audit event.
    priority: MUST
- id: CAT-AC
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/authentication-access-control
  title: Authentication & Access Control
  context: Applies to every protected action and resource. Authentication establishes identity; authorization independently binds that identity to the requested operation, tenant, and resource.
  requirements:
  - id: AC-001
    url: https://appsec.int.example.com/req/authentication-access-control#ac-001
    text: Service-to-service calls MUST authenticate the calling workload with a dedicated identity using an approved mechanism such as OAuth 2.0 client credentials with confidential-client authentication, private-key JWT, workload identity, or mTLS. Credentials and scopes MUST be unique and least-privileged per service.
    priority: MUST
  - id: AC-002
    url: https://appsec.int.example.com/req/authentication-access-control#ac-002
    text: Every protected operation MUST authorize the authenticated identity server-side using least privilege and deny by default. The policy MAY use roles, attributes, relationships, or capabilities, but MUST NOT rely on client-side checks.
    priority: MUST
  - id: AC-003
    url: https://appsec.int.example.com/req/authentication-access-control#ac-003
    text: Login, registration, credential recovery, verification, token issuance, and other abuse-prone endpoints MUST apply bounded request sizes and rate limits by both account or identifier and client source using a control effective across application instances.
    priority: MUST
  - id: AC-004
    url: https://appsec.int.example.com/req/authentication-access-control#ac-004
    text: Workforce and privileged users MUST authenticate through the organization-managed identity provider using OIDC authorization code with PKCE or SAML, and privileged access MUST require phishing-resistant MFA where supported. A parallel local password path requires a documented operational need.
    priority: MUST
  - id: AC-005
    url: https://appsec.int.example.com/req/authentication-access-control#ac-005
    text: Resource servers MUST validate every access token before use. JWT validation MUST verify the signature with an allowlisted algorithm and expected issuer, audience, and expiry; opaque tokens MUST use authoritative introspection or an equivalent server-side mechanism. Cached results MUST NOT outlive token validity or revocation policy.
    priority: MUST
  - id: AC-006
    url: https://appsec.int.example.com/req/authentication-access-control#ac-006
    text: Every request for a protected object MUST authorize the authenticated identity against that object's owner, tenant, state, and requested action. User-supplied identifiers and token possession alone MUST NOT grant access.
    priority: MUST
  - id: AC-007
    url: https://appsec.int.example.com/req/authentication-access-control#ac-007
    text: Stateful sessions MUST rotate their identifier after authentication and privilege changes, be invalidated server-side on logout and credential or MFA changes, and enforce documented idle and absolute expiration limits.
    priority: MUST
  - id: AC-008
    url: https://appsec.int.example.com/req/authentication-access-control#ac-008
    text: Authentication and recovery flows MUST issue one-time codes only through their addressed out-of-band channel, make them short-lived and single-use, and grant no full session or protected access before verification succeeds.
    priority: MUST
- id: CAT-IV
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/input-validation-data-handling
  title: Input Validation & Data Handling
  context: Applies at every boundary where data, files, URLs, serialized objects, or commands enter from an untrusted source.
  requirements:
  - id: IV-001
    url: https://appsec.int.example.com/req/input-validation-data-handling#iv-001
    text: At each trust boundary, external input MUST be validated for expected type, length, range, format, and allowed values before use. Security-sensitive structured requests MUST reject unknown or ambiguous fields.
    priority: MUST
  - id: IV-002
    url: https://appsec.int.example.com/req/input-validation-data-handling#iv-002
    text: When XML is accepted, parsers MUST disable external entity resolution, external DTD loading, and network access unless a documented use case enables an allowlisted resource through an isolated parser.
    priority: MUST
  - id: IV-003
    url: https://appsec.int.example.com/req/input-validation-data-handling#iv-003
    text: Untrusted data MUST use a safe, data-only parser with an explicit schema or type allowlist and MUST NOT be passed to a deserializer that can instantiate arbitrary or privileged types.
    priority: MUST
  - id: IV-004
    url: https://appsec.int.example.com/req/input-validation-data-handling#iv-004
    text: Database queries MUST bind untrusted values through parameterized queries, prepared statements, or safe ORM parameters. Untrusted values MUST NOT be concatenated into query syntax or identifiers.
    priority: MUST
  - id: IV-005
    url: https://appsec.int.example.com/req/input-validation-data-handling#iv-005
    text: File uploads MUST enforce size and count limits, verify content independently of the supplied name and media type, generate a server-controlled storage name, prevent path traversal and active-content execution, and store files outside executable or public paths unless explicitly required.
    priority: MUST
  - id: IV-006
    url: https://appsec.int.example.com/req/input-validation-data-handling#iv-006
    text: Input-driven work MUST enforce request and decompressed-size limits, field and collection bounds, nesting limits, processing timeouts, and pagination or result caps before expensive parsing or downstream work.
    priority: MUST
  - id: IV-007
    url: https://appsec.int.example.com/req/input-validation-data-handling#iv-007
    text: When untrusted input influences an outbound destination, the application MUST allowlist permitted schemes and destinations, resolve and validate the effective address, block loopback, link-local, private, metadata, and other forbidden networks, and revalidate or disable redirects.
    priority: MUST
  - id: IV-008
    url: https://appsec.int.example.com/req/input-validation-data-handling#iv-008
    text: Untrusted values MUST NOT select filesystem paths, commands, interpreters, or process options. Filesystem access MUST use canonical contained paths, and process execution MUST use a shell-free argument array with an allowlisted executable and bounded runtime.
    priority: MUST
- id: CAT-DP
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/data-protection-cryptography
  title: Data Protection & Cryptography
  context: Applies according to data classification and threat model. Cryptographic choices and retention periods must follow an approved organizational policy rather than an invented universal value.
  requirements:
  - id: DP-001
    url: https://appsec.int.example.com/req/data-protection-cryptography#dp-001
    text: Confidential data at rest MUST be protected with an organization-approved authenticated-encryption or platform storage mechanism, with keys separated from the protected data and access limited to the workload identities that require it.
    priority: MUST
  - id: DP-002
    url: https://appsec.int.example.com/req/data-protection-cryptography#dp-002
    text: Session, reset, activation, and other bearer tokens MUST be generated with a cryptographically secure random source and at least 128 bits of entropy. Cryptographic keys MUST use the algorithm-specific size and generation mechanism required by the approved cryptographic policy.
    priority: MUST
  - id: DP-003
    url: https://appsec.int.example.com/req/data-protection-cryptography#dp-003
    text: Credentials, bearer tokens, one-time codes, and other sensitive values MUST NOT appear in URLs or query parameters. They MUST use an appropriate protected header or request body over TLS and be excluded from logs and analytics.
    priority: MUST
  - id: DP-004
    url: https://appsec.int.example.com/req/data-protection-cryptography#dp-004
    text: When local passwords are required, the application MUST reject inputs above its documented UTF-8 byte limit before hashing and store passwords only with a maintained Argon2id, scrypt, bcrypt, or PBKDF2 implementation using approved parameters and unique salts.
    priority: MUST
  - id: DP-005
    url: https://appsec.int.example.com/req/data-protection-cryptography#dp-005
    text: Persistent credentials and cryptographic keys MUST come from external configuration or a managed secret store, remain stable until explicit rotation, be scoped to one workload and purpose, and be rotated on compromise and according to a documented lifecycle.
    priority: MUST
  - id: DP-006
    url: https://appsec.int.example.com/req/data-protection-cryptography#dp-006
    text: Traffic that leaves the machine MUST use TLS 1.2 or later with an approved configuration; TLS 1.3 SHOULD be preferred. Plain HTTP MAY be used only on loopback, and workload authentication such as mTLS MUST be added when the trust model requires it.
    priority: MUST
  - id: DP-007
    url: https://appsec.int.example.com/req/data-protection-cryptography#dp-007
    text: TLS clients MUST validate certificate chains and the expected service identity and MUST NOT expose a production switch that disables verification. Private trust anchors MUST be configured explicitly and scoped to their intended destinations.
    priority: MUST
  - id: DP-008
    url: https://appsec.int.example.com/req/data-protection-cryptography#dp-008
    text: Personal, confidential, and regulated data MUST have documented collection purpose, access policy, retention period, backup handling, and verifiable deletion behavior, and the application MUST retain no more data than those purposes require.
    priority: MUST
- id: CAT-SC
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/supply-chain-dependency-security
  title: Supply Chain & Dependency Security
  context: Applies to source, build, package, model, container, and deployment dependencies. Blocking thresholds and exceptions must be explicit, risk-based, time-bounded, and auditable.
  requirements:
  - id: SC-001
    url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-001
    text: CI MUST scan resolved direct and transitive dependencies against current vulnerability intelligence and block release for known-exploited or policy-defined critical or high findings. An exception MUST name an owner, compensating controls, justification, and expiry regardless of fix availability.
    priority: MUST
  - id: SC-002
    url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-002
    text: Production builds MUST resolve dependencies from a committed lockfile or equivalent immutable manifest, verify package integrity, and use frozen installation so floating ranges cannot change the deployed dependency graph.
    priority: MUST
  - id: SC-003
    url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-003
    text: Build systems MUST use an explicit allowlist of trusted registries and namespaces, authenticate private sources, and prevent dependency-confusion fallback from private package names to public registries.
    priority: MUST
  - id: SC-004
    url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-004
    text: Each production release SHOULD produce an SBOM from the resolved build graph, bind it to the released artifact, retain it with release evidence, and make it available to vulnerability-response owners.
    priority: SHOULD
  - id: SC-005
    url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-005
    text: Dependency changes SHOULD receive automated policy review during each build, and owners SHOULD remove unused packages and replace unmaintained dependencies within a documented remediation period.
    priority: SHOULD
  - id: SC-006
    url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-006
    text: CI MUST run applicable static security analysis on changed code and block policy-defined exploitable findings. Suppressions MUST identify the exact finding, rationale, approver, and expiry and MUST NOT disable the scanner or an entire rule class without review.
    priority: MUST
  - id: SC-007
    url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-007
    text: Release artifacts MUST be produced by an access-controlled build service from reviewed source, carry verifiable provenance and integrity metadata, and be promoted without rebuilding or accepting unsigned replacement artifacts.
    priority: MUST
- id: CAT-LM
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/security-logging-monitoring
  title: Security Logging & Monitoring
  context: Applies to production services and security-relevant control planes. Logs must support investigation without becoming a secondary store of secrets or unnecessary personal data.
  requirements:
  - id: LM-001
    url: https://appsec.int.example.com/req/security-logging-monitoring#lm-001
    text: Applications MUST record security-relevant events including authentication and authorization failures, privilege and identity changes, sensitive configuration changes, administrative actions, and security-control throttling with an attributable actor, target, time, action, and outcome.
    priority: MUST
  - id: LM-002
    url: https://appsec.int.example.com/req/security-logging-monitoring#lm-002
    text: Security events MUST use a structured, versioned format with a timestamp, correlation identifier, actor or workload identifier where lawful, target, action, outcome, and source component.
    priority: MUST
  - id: LM-003
    url: https://appsec.int.example.com/req/security-logging-monitoring#lm-003
    text: Production security events MUST be forwarded to an access-controlled centralized system that detects unauthorized modification or deletion and preserves events when an application instance is replaced or compromised.
    priority: MUST
  - id: LM-004
    url: https://appsec.int.example.com/req/security-logging-monitoring#lm-004
    text: Security logs SHOULD follow a documented retention and deletion policy derived from incident-response, legal, and privacy needs, with access restrictions and integrity protection throughout the retention period.
    priority: SHOULD
  - id: LM-005
    url: https://appsec.int.example.com/req/security-logging-monitoring#lm-005
    text: Alerting SHOULD cover defined high-confidence events such as repeated authentication failures, privilege changes, security-control disablement, unusual protected-data access, and log-pipeline failure, with a tested route to an accountable responder.
    priority: SHOULD
  - id: LM-006
    url: https://appsec.int.example.com/req/security-logging-monitoring#lm-006
    text: Logs MUST NOT contain passwords, bearer tokens, private keys, session identifiers, one-time codes, or complete payment credentials. Personal data MUST be minimized, masked where possible, and limited to a documented investigation purpose.
    priority: MUST
- id: CAT-IF
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/infrastructure-container-security
  title: Infrastructure & Container Security
  context: Applies only when the application builds or deploys containers, Kubernetes workloads, or infrastructure as code; otherwise these requirements are not applicable.
  requirements:
  - id: IF-001
    url: https://appsec.int.example.com/req/infrastructure-container-security#if-001
    text: Container images MUST be scanned before promotion and continuously re-evaluated against current vulnerability intelligence. Promotion MUST block known-exploited or policy-defined critical or high findings unless a time-bounded approved exception exists.
    priority: MUST
  - id: IF-002
    url: https://appsec.int.example.com/req/infrastructure-container-security#if-002
    text: Application containers MUST run as a non-root numeric identity, disallow privilege escalation, and be rejected by deployment policy when those properties are absent.
    priority: MUST
  - id: IF-003
    url: https://appsec.int.example.com/req/infrastructure-container-security#if-003
    text: Container root filesystems SHOULD be read-only, with explicitly declared, size-bounded writable mounts only for required runtime data and temporary files.
    priority: SHOULD
  - id: IF-004
    url: https://appsec.int.example.com/req/infrastructure-container-security#if-004
    text: Production containers MUST drop all Linux capabilities by default, add back only documented required capabilities, use a restrictive seccomp profile, and MUST NOT run privileged.
    priority: MUST
  - id: IF-005
    url: https://appsec.int.example.com/req/infrastructure-container-security#if-005
    text: Container workloads MUST use default-deny ingress and egress policy with explicit exceptions for documented service flows, DNS, telemetry, and required external destinations.
    priority: MUST
  - id: IF-006
    url: https://appsec.int.example.com/req/infrastructure-container-security#if-006
    text: Infrastructure-as-code MUST be validated in CI against an approved security policy and block policy-defined critical misconfigurations before deployment. Exceptions MUST be scoped, owned, justified, and time-bounded.
    priority: MUST
  - id: IF-007
    url: https://appsec.int.example.com/req/infrastructure-container-security#if-007
    text: Base images SHOULD be pinned by immutable digest and rebuilt automatically when an approved upstream image or required security update changes, within the remediation window defined by policy.
    priority: SHOULD
  - id: IF-008
    url: https://appsec.int.example.com/req/infrastructure-container-security#if-008
    text: Infrastructure changes MUST originate from version-controlled reviewed definitions and pass required approval and policy gates before an automated identity with least privilege applies them to production.
    priority: MUST
- id: CAT-LLM
  source_id: owasp-informed-requirements
  url: https://appsec.int.example.com/req/ai-llm-security
  title: AI / LLM Security (OWASP LLM Top 10)
  context: Applies only to features that send data to or act on output from an LLM, embedding model, vector store, or model-connected tool. Model output and retrieved content are always untrusted.
  requirements:
  - id: LLM-001
    url: https://appsec.int.example.com/req/ai-llm-security#llm-001
    text: |-
      Prompts, retrieved documents, files, tool results, memory, and model output MUST be treated as untrusted content and clearly separated from operator instructions.
      The application MUST assume prompt injection cannot be eliminated by delimiters, sanitization, or system instructions and MUST limit impact with deterministic authorization, least privilege, constrained tools, validated outputs, and adversarial tests for direct and indirect injection.
    priority: MUST
  - id: LLM-002
    url: https://appsec.int.example.com/req/ai-llm-security#llm-002
    text: |-
      Before model invocation, the application MUST authorize and minimize every data item placed in the model context for the authenticated tenant and purpose.
      Model output MUST be checked for policy-prohibited sensitive data before delivery, but pattern filtering MUST NOT replace source-data access control or tenant isolation.
    priority: MUST
  - id: LLM-003
    url: https://appsec.int.example.com/req/ai-llm-security#llm-003
    text: |-
      Model, adapter, tokenizer, dataset, prompt package, and LLM SDK versions MUST come from approved sources, be inventoried, pinned or immutably identified, and have integrity and provenance verified before deployment.
    priority: SHOULD
  - id: LLM-004
    url: https://appsec.int.example.com/req/ai-llm-security#llm-004
    text: |-
      RAG ingestion MUST authenticate and authorize the source, retain provenance and tenant ownership, reject or quarantine untrusted updates, and record attributable changes.
      Retrieval MUST enforce the source document's access policy before content reaches the model context.
    priority: SHOULD
  - id: LLM-005
    url: https://appsec.int.example.com/req/ai-llm-security#llm-005
    text: |-
      Model output MUST be validated against a bounded schema and encoded for its destination before use.
      It MUST NOT flow directly into eval, a shell, query syntax, HTML, filesystem paths, security decisions, or downstream actions; deterministic code must validate and mediate each sink.
    priority: MUST
  - id: LLM-006
    url: https://appsec.int.example.com/req/ai-llm-security#llm-006
    text: |-
      Each model-connected tool action MUST be authenticated and authorized server-side for the current user, tenant, resource, and operation using a least-privileged tool identity and bounded parameters.
      High-impact, external, destructive, or irreversible actions MUST require an explicit human approval at the point where the exact action and target are known.
    priority: MUST
  - id: LLM-007
    url: https://appsec.int.example.com/req/ai-llm-security#llm-007
    text: |-
      System prompts MUST contain no credentials, personal data, tenant secrets, hidden authorization rules, or other information whose disclosure creates a security boundary failure.
      Authorization and safety-critical behavior MUST be enforced outside the model because system-prompt confidentiality and instruction adherence cannot be relied upon.
    priority: MUST
  - id: LLM-008
    url: https://appsec.int.example.com/req/ai-llm-security#llm-008
    text: |-
      Vector and embedding stores MUST isolate tenants and enforce document-level authorization for queries and updates.
      Similarity search MUST enforce bounded result counts and rate limits, and ingestion MUST validate model identity, dimensions, content size, and provenance.
    priority: SHOULD
  - id: LLM-009
    url: https://appsec.int.example.com/req/ai-llm-security#llm-009
    text: |-
      When model output can materially affect a person, security decision, financial action, or regulated process, the application MUST ground claims in authorized sources, surface provenance and uncertainty, and require deterministic validation or qualified human review before acting.
    priority: SHOULD
  - id: LLM-010
    url: https://appsec.int.example.com/req/ai-llm-security#llm-010
    text: |-
      LLM features MUST bound input size, output tokens, requests per user and source, tool calls, retrieval results, agent iterations, wall-clock time, concurrency, and cost.
      Shared enforcement, monitoring, quotas, and circuit breakers MUST prevent one tenant or workflow from exhausting service or budget.
    priority: MUST
blueprints:
- id: BP-API-OVERVIEW
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/api-overview
  title: Security Blueprint for APIs
  summary: |-
    This blueprint outlines the essential practices for building and deploying secure APIs.
    It highlights what developers need to do, why it matters, and integrates relevant
    authentication services and security requirements.
  topics:
  - _sections
  sections:
  - title: Sections
    url: https://appsec.int.example.com/blueprints/api-overview#_sections
    content: |-
      Hardening — Hardening API configuration
      Input Validation — Restrictive API input validation
      Secret Management — Secure secret storage and access
      End-User Access — Authentication and authorization with user context via SSO
      Service-to-Service Access — Authentication and authorization of product APIs
      CORS — Securing cross-origin access using CORS
- id: BP-API-HARDENING
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/api-hardening
  title: API Hardening
  summary: |-
    Guidance for hardening API configuration across different technology stacks.
    Sections without technology boxes apply to all stacks.
  topics:
  - _waf
  - _transport_encryption
  - _disable_management_endpoints
  - _rate_limiting
  - _dependency_scanning
  sections:
  - title: 1. Deploy a WAF on Internet-Facing Applications
    url: https://appsec.int.example.com/blueprints/api-hardening#_waf
    content: Use a managed WAF or equivalent edge control when justified by the application's exposure and threat model, and keep application-layer controls authoritative.
    references:
    - id: HN-004
      url: https://appsec.int.example.com/req/system-hardening#hn-004
  - title: 2. Transport Encryption
    url: https://appsec.int.example.com/blueprints/api-hardening#_transport_encryption
    content: Handle all API communication using TLS 1.3; for service-to-service calls prefer mTLS.
    references:
    - id: DP-006
      url: https://appsec.int.example.com/req/data-protection-cryptography#dp-006
  - title: 3. Disable Management and Debug Endpoints
    url: https://appsec.int.example.com/blueprints/api-hardening#_disable_management_endpoints
    content: |-
      Expose only essential public endpoints (e.g. /health, /info, /ready).
      Serve all detailed or sensitive operational endpoints on an internal-only port or interface.
      Prevent external exposure through ingress, routing, or load balancer configuration.
      Use a dedicated management port that is not exposed via public ingress.
    references:
    - id: HN-002
      url: https://appsec.int.example.com/req/system-hardening#hn-002
  - title: 4. Rate Limiting
    url: https://appsec.int.example.com/blueprints/api-hardening#_rate_limiting
    content: |-
      Prevent abuse (brute force, scraping) and protect availability by limiting excessive traffic.
      Apply shared rate limiting at the edge and application layer by both client source and authenticated account or identifier.
      Define endpoint-specific limits from capacity and abuse testing rather than copying universal example numbers.
      Return HTTP 429 Too Many Requests on breach.
    references:
    - id: AC-003
      url: https://appsec.int.example.com/req/authentication-access-control#ac-003
  - title: 5. Implement Dependency and Code Scanning
    url: https://appsec.int.example.com/blueprints/api-hardening#_dependency_scanning
    content: |-
      Integrate SCA tooling to detect vulnerable dependencies automatically on every build.
      Run SAST on every pull request; do not merge code with unresolved high-severity findings.
    references:
    - id: SC-001
      url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-001
    - id: SC-006
      url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-006
- id: BP-API-VALIDATION
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/api-validation
  title: Input Validation
  summary: Guidance for restrictive API input validation across different technology stacks.
  topics:
  - _unexpected_field_handling
  - _restrictive_dto_validation
  - _boundary_size_limits
  - _parameterized_data_access
  sections:
  - title: 1. Unexpected Field Handling
    url: https://appsec.int.example.com/blueprints/api-validation#_unexpected_field_handling
    content: |-
      Reject or remove any input fields that are not defined in the approved schema.
      Prevent mass-assignment and hidden parameter injection by processing only allowlisted fields.
      Use a dedicated DTO (Data Transfer Object) that declares only the fields your API accepts.
    references:
    - id: IV-001
      url: https://appsec.int.example.com/req/input-validation-data-handling#iv-001
  - title: 2. Implement Restrictive Validation in DTOs
    url: https://appsec.int.example.com/blueprints/api-validation#_restrictive_dto_validation
    content: |-
      Define explicit constraints on every input field — not just type, but also length, range, and allowed characters.
      Use validation annotations or schemas to enforce constraints such as max length, numeric ranges, and character allowlists.
    references:
    - id: IV-001
      url: https://appsec.int.example.com/req/input-validation-data-handling#iv-001
  - title: 3. Boundary & Size Limits
    url: https://appsec.int.example.com/blueprints/api-validation#_boundary_size_limits
    content: Apply strict limits on payload size, field length, array length, and nesting depth.
    references:
    - id: IV-006
      url: https://appsec.int.example.com/req/input-validation-data-handling#iv-006
  - title: 4. Parameterized Data Access
    url: https://appsec.int.example.com/blueprints/api-validation#_parameterized_data_access
    content: |-
      To prevent SQL Injection, ensure that all user input is treated strictly as data and can never modify the structure of a query.
      Use parameterized queries, prepared statements, or ORM methods for all database access.
      Never concatenate user input into query strings.
    references:
    - id: IV-004
      url: https://appsec.int.example.com/req/input-validation-data-handling#iv-004
- id: BP-SECRET-MANAGEMENT
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/secret-management
  title: Secret Storage
  summary: Guidance for secure secret storage and access across different deployment environments.
  topics:
  - _kubernetes_secrets
  - _cloud_secrets_manager
  - _hashicorp_vault
  sections:
  - title: 1. Secret Management in Kubernetes / OpenShift
    url: https://appsec.int.example.com/blueprints/secret-management#_kubernetes_secrets
    content: |-
      Mount secrets as read-only files inside the container.
      Restrict access using RBAC so only the application's ServiceAccount may read the secret.
      Mount secrets as read-only volumes; set defaultMode to 0440.
      Read mounted files at startup; never log or expose the values.
      Trigger a rolling restart after secret rotation to reload properties.
    references:
    - id: DP-005
      url: https://appsec.int.example.com/req/data-protection-cryptography#dp-005
  - title: 2. Cloud Secrets Manager
    url: https://appsec.int.example.com/blueprints/secret-management#_cloud_secrets_manager
    content: |-
      Use a managed secrets service for storing and rotating secrets in cloud environments.
      Grant the application's IAM role least-privilege access (read on the specific secret only).
      For Kubernetes, use the CSI Driver to mount secrets directly as pod volume files.
      Enable automatic rotation and configure the reconciler poll interval to balance freshness with cost.
    references:
    - id: DP-005
      url: https://appsec.int.example.com/req/data-protection-cryptography#dp-005
  - title: 3. HashiCorp Vault
    url: https://appsec.int.example.com/blueprints/secret-management#_hashicorp_vault
    content: |-
      Consider HashiCorp Vault if your application spans cloud and on-premise infrastructure,
      you require dynamic secrets or fine-grained lease management, or you already operate a Vault cluster.
      For single-platform workloads the platform-native options above are simpler and sufficient.
- id: BP-API-AUTHZ-ENDUSER
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/api-authz-enduser
  title: End-User Authentication and Authorization via SSO
  summary: |-
    Applies to: Browser-based web applications (SPAs) and Mobile apps.
    Requirement: AC-004 — Securely Authenticate Users
  topics:
  - _bff_pattern
  - _sso_client_config
  - _refresh_tokens
  - _access_tokens
  - _oauth_redirects
  - _issuer_validation
  - _audience_validation
  - _method_level_authz
  - _resource_level_authz
  sections:
  - title: 1. Implement a Backend-for-Frontend (BFF)
    url: https://appsec.int.example.com/blueprints/api-authz-enduser#_bff_pattern
    content: |-
      Implement a Backend-for-Frontend (BFF) for user-context API access in your SPA.
      This keeps tokens out of the browser runtime, reduces XSS/token exfiltration risk, and enables hardened cookie-based sessions.
    references:
    - id: AC-004
      url: https://appsec.int.example.com/req/authentication-access-control#ac-004
  - title: 2. Configure the Client in the Identity Provider
    url: https://appsec.int.example.com/blueprints/api-authz-enduser#_sso_client_config
    content: |-
      Configure the OAuth client in your identity provider.
      Restrict access to internal users only unless anonymous/public access is explicitly required.
      Configure user roles and scopes as needed for your application.
      Recommended OAuth settings: Grant=authorization_code, PKCE=enabled, Access token TTL=5 minutes, Refresh token TTL=15–30 days with BFF.
    references:
    - id: AC-004
      url: https://appsec.int.example.com/req/authentication-access-control#ac-004
  - title: 2.1. Handling Refresh Tokens
    url: https://appsec.int.example.com/blueprints/api-authz-enduser#_refresh_tokens
    content: |-
      Refresh tokens MUST stay server-side (e.g. in the BFF).
      Treat them as secrets; never expose or store them in the browser.
  - title: 2.2. Handling Access Tokens
    url: https://appsec.int.example.com/blueprints/api-authz-enduser#_access_tokens
    content: |-
      Preferred: transmit via secure cookies with HttpOnly, Secure, SameSite=Lax (or Strict if compatible).
      Avoid persistent client-side storage.
      If unavoidable, transmit only via HTTP header: Authorization: Bearer <token>.
      Never put tokens in URLs (query string, fragment, or redirects).
      Enforce strong XSS protections including CSP.
    references:
    - id: WEB-002
      url: https://appsec.int.example.com/req/web-frontend-security#web-002
    - id: DP-003
      url: https://appsec.int.example.com/req/data-protection-cryptography#dp-003
  - title: 2.3. OAuth Redirect URI Validation
    url: https://appsec.int.example.com/blueprints/api-authz-enduser#_oauth_redirects
    content: |-
      Redirect URI validation MUST use exact matching against registered values.
      Production web-client redirects must use HTTPS and contain no fragment; loopback and claimed HTTPS redirects for native applications follow the applicable OAuth profile instead of a web-client exception.
  - title: '3.1. Step 1: Issuer Validation'
    url: https://appsec.int.example.com/blueprints/api-authz-enduser#_issuer_validation
    content: |-
      Verify that the token was issued by the correct identity provider.
      Configure the resource server with the issuer-uri or jwk-set-uri of your identity provider.
      Use a library that supports OIDC discovery and manual JWKS configuration.
    references:
    - id: AC-005
      url: https://appsec.int.example.com/req/authentication-access-control#ac-005
  - title: '3.2. Step 2: API-Level Authorization (via Audience)'
    url: https://appsec.int.example.com/blueprints/api-authz-enduser#_audience_validation
    content: |-
      Ensure a JWT access token was issued for this resource server by validating its audience against the exact configured audience value.
      Do not assume the audience equals an OAuth client identifier; opaque access tokens require authoritative introspection instead of local claim parsing.
    references:
    - id: AC-005
      url: https://appsec.int.example.com/req/authentication-access-control#ac-005
  - title: '3.3. Step 3: Method-Level Authorization'
    url: https://appsec.int.example.com/blueprints/api-authz-enduser#_method_level_authz
    content: |-
      Validate whether the client or user role is allowed to access a particular route.
      Check role or scope claims from the JWT token.
      Define application-specific scopes and validate them on each protected endpoint.
    references:
    - id: AC-002
      url: https://appsec.int.example.com/req/authentication-access-control#ac-002
  - title: '3.4. Step 4: Resource-Level Authorization'
    url: https://appsec.int.example.com/blueprints/api-authz-enduser#_resource_level_authz
    content: |-
      APIs operating with user context must also verify access to each specific resource to prevent IDOR.
      For routes like /orders/{id}, compare token claims (e.g. tenant_id, sub) with the resource's attributes (e.g. order.tenant_id, owner_id).
      Grant access only if the caller has the required scope AND the resource belongs to the same tenant or user indicated by the token.
    references:
    - id: AC-006
      url: https://appsec.int.example.com/req/authentication-access-control#ac-006
- id: BP-API-AUTHZ-SERVICE
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/api-authz-service
  title: Service-to-Service API Authentication and Authorization
  summary: 'Scope: Machine-to-machine (M2M) APIs using OAuth 2.0 client credentials.'
  topics:
  - _oauth_config
  - _token_handling
  - _token_storage
  - _refresh_tokens
  - _authorizing_requests
  - _issuer_validation
  - _audience_validation
  - _method_level_authz
  sections:
  - title: 1. Configure the OAuth Client (Client Credentials)
    url: https://appsec.int.example.com/blueprints/api-authz-service#_oauth_config
    content: |-
      Register a dedicated OAuth client per service in your identity provider.
      Use the client credentials grant (grant_type=client_credentials).
      Assign only the scopes strictly required by the calling service (least privilege).
      Treat client_id as a public identifier and store only client secrets or private keys in a managed secret store; never hard-code credentials.
      Prefer asymmetric client authentication where supported and rotate credentials on compromise and according to a documented lifecycle.
      Recommended settings: Access token TTL=5–15 minutes; do not use refresh tokens with client credentials.
    references:
    - id: AC-001
      url: https://appsec.int.example.com/req/authentication-access-control#ac-001
  - title: 2. Token Handling
    url: https://appsec.int.example.com/blueprints/api-authz-service#_token_handling
    content: 'Send tokens only in the HTTP header: Authorization: Bearer <token>'
    references:
    - id: DP-003
      url: https://appsec.int.example.com/req/data-protection-cryptography#dp-003
  - title: 3. Token Storage
    url: https://appsec.int.example.com/blueprints/api-authz-service#_token_storage
    content: 'See Secret Storage blueprint. Requirement: AC-001 — Securely Authenticate API Services'
    references:
    - id: AC-001
      url: https://appsec.int.example.com/req/authentication-access-control#ac-001
  - title: 3.1. Refresh Tokens
    url: https://appsec.int.example.com/blueprints/api-authz-service#_refresh_tokens
    content: Do not use refresh tokens with client credentials flows.
  - title: 4. Authorizing Requests
    url: https://appsec.int.example.com/blueprints/api-authz-service#_authorizing_requests
    content: |-
      Authorization must be enforced on multiple layers:
      - API-Level: Is the token valid for this API? (iss, aud)
      - Method-Level: Is the caller allowed to perform this action? (scopes/roles such as orders.delete or orders.read)
      - Object-Level: Is the caller allowed to act on this specific resource? (owner, tenant, status)
      All requests must be authorized on every call. An SSO integration does not replace per-request authorization checks.
    references:
    - id: AC-002
      url: https://appsec.int.example.com/req/authentication-access-control#ac-002
  - title: '4.1. Step 1: Issuer Validation'
    url: https://appsec.int.example.com/blueprints/api-authz-service#_issuer_validation
    content: |-
      Verify that the token was issued by the correct identity provider.
      Configure the resource server with the issuer-uri or jwk-set-uri of your API gateway's IdP.
      For IdPs without OIDC discovery, use the JWKS URI directly.
    references:
    - id: AC-005
      url: https://appsec.int.example.com/req/authentication-access-control#ac-005
  - title: '4.2. Step 2: API-Level Authorization (via Audience)'
    url: https://appsec.int.example.com/blueprints/api-authz-service#_audience_validation
    content: |-
      For JWT access tokens, validate the signature, allowed algorithm, issuer, expiry, and exact audience configured for this resource server.
      Do not assume the audience is the API's OAuth client identifier; use authoritative introspection for opaque tokens.
    references:
    - id: AC-005
      url: https://appsec.int.example.com/req/authentication-access-control#ac-005
  - title: '4.3. Step 3: Method or Role-Level Authorization'
    url: https://appsec.int.example.com/blueprints/api-authz-service#_method_level_authz
    content: |-
      Validate whether the calling service is allowed to perform the requested action.
      For APIs without user context this is typically done by checking the scope claim.
      Use specific scopes (e.g. orders.delete, orders.read) to protect individual operations.
    references:
    - id: AC-002
      url: https://appsec.int.example.com/req/authentication-access-control#ac-002
- id: BP-API-CORS
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/api-cors
  title: CORS Enforcement
  summary: 'Limit which origins may call the API from a browser.'
  topics: []
  sections:
  - title: Overview
    url: https://appsec.int.example.com/blueprints/api-cors#overview
    content: |-
      Emit CORS response headers only on routes that require cross-origin browser access.
      Match the Origin exactly against an explicit allowlist and echo it only after a match.
      Do not use wildcard origins for credentialed responses, and allow only required methods and headers.
      Treat requests without an Origin according to normal API authentication and authorization; CORS is a browser policy and is not an access-control mechanism.
      Protect cookie-authenticated state changes separately against CSRF.
    references:
    - id: WEB-003
      url: https://appsec.int.example.com/req/web-frontend-security#web-003
- id: BP-SPA-BFF
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/spa-bff
  title: Security Blueprint for SPAs with BFF
  summary: |-
    This blueprint describes concrete measures to build a secure Single-Page Application (SPA) using a Backend-for-Frontend (BFF) and an identity provider.
    It focuses on what to do, why it matters, and how to implement it in day-to-day development.
  topics:
  - _hardening
  - _frontend_framework
  - _bff
  - _authentication
  - _recommended_pattern
  - _authorization
  - _secure_session_cookies
  - _csrf_protection
  - _browser_storage
  - _xss_hardening
  - _trusted_types
  - _csp
  - _pwa_service_worker
  - _hsts
  - _additional_headers
  - _dependency_hygiene
  - _build_integrity
  sections:
  - title: Frontend Framework
    url: https://appsec.int.example.com/blueprints/spa-bff#_frontend_framework
    content: |-
      Use a mature, actively maintained frontend framework with hardened compiler and build settings.
      Enable TypeScript strict mode and strict template checking to eliminate entire classes of runtime bugs.
      Ensure production build optimizations (AOT compilation, tree-shaking, minification) are enabled.
    references:
    - id: WEB-006
      url: https://appsec.int.example.com/req/web-frontend-security#web-006
  - title: Use a Backend-for-Frontend (BFF)
    url: https://appsec.int.example.com/blueprints/spa-bff#_bff
    content: |-
      The SPA is a public client; the BFF is a confidential client that holds all OAuth tokens.
      All browser requests go through /bff/**.
      The BFF handles OAuth/OIDC flows with the identity provider, stores access and refresh tokens server-side,
      issues hardened session cookies to the browser, and rotates session identifiers after authentication.
      This prevents token exposure to JavaScript and mitigates XSS impact.
    references:
    - id: AC-004
      url: https://appsec.int.example.com/req/authentication-access-control#ac-004
  - title: Recommended Authentication Pattern
    url: https://appsec.int.example.com/blueprints/spa-bff#_recommended_pattern
    content: |-
      Let the BFF handle the OAuth/OIDC flow, not the SPA.
      The BFF exposes: /bff/login, /bff/logout, /bff/user (minimal data and permissions).
      This prevents access tokens from ever entering the browser.
  - title: Authorization
    url: https://appsec.int.example.com/blueprints/spa-bff#_authorization
    content: |-
      Authorization is enforced server-side only.
      Refer to the API Security Blueprint for access control implementation details.
    references:
    - id: AC-002
      url: https://appsec.int.example.com/req/authentication-access-control#ac-002
  - title: Secure Session Cookies
    url: https://appsec.int.example.com/blueprints/spa-bff#_secure_session_cookies
    content: |-
      Set HttpOnly, Secure, Path=/, and SameSite=Lax or Strict on the session cookie and omit Domain where host-only scope is sufficient.
      Example: Set-Cookie: __Host-session=<opaque-random-session-id>; Path=/; HttpOnly; Secure; SameSite=Lax
      For a justified cross-site SSO or iframe flow, SameSite=None also requires Secure and a separate CSRF defense.
      HttpOnly cookies are not accessible to JavaScript, making them resistant to XSS token theft.
    references:
    - id: WEB-001
      url: https://appsec.int.example.com/req/web-frontend-security#web-001
  - title: CSRF Protection
    url: https://appsec.int.example.com/blueprints/spa-bff#_csrf_protection
    content: |-
      Treat SameSite as defense in depth rather than the sole CSRF control.
      The BFF must validate a framework-provided or session-bound CSRF token, or an explicitly designed same-origin signal, for every state-changing request authenticated by a cookie.
      State-changing operations must not use GET, and cross-site flows using SameSite=None require the same server-side protection.
    references:
    - id: WEB-001
      url: https://appsec.int.example.com/req/web-frontend-security#web-001
  - title: Browser Storage
    url: https://appsec.int.example.com/blueprints/spa-bff#_browser_storage
    content: |-
      Do not store access tokens, refresh tokens, API keys, or privilege flags in: localStorage, sessionStorage, IndexedDB.
      Store only UI state in the browser; store session and user state on the BFF.
    references:
    - id: WEB-002
      url: https://appsec.int.example.com/req/web-frontend-security#web-002
  - title: XSS Hardening
    url: https://appsec.int.example.com/blueprints/spa-bff#_xss_hardening
    content: |-
      Use the framework's built-in interpolation and binding to render user content rather than unsafe innerHTML assignments.
      If innerHTML is unavoidable, sanitize using DOMPurify with Trusted Types support.
      Avoid wrapping unsafe browser APIs (window, document, ElementRef) unless strictly required.
    references:
    - id: WEB-007
      url: https://appsec.int.example.com/req/web-frontend-security#web-007
  - title: Trusted Types (TT)
    url: https://appsec.int.example.com/blueprints/spa-bff#_trusted_types
    content: |-
      Trusted Types provide browser-level protection against DOM-based XSS by requiring that dangerous DOM sinks only accept values created from approved policies.
      Add CSP directives: require-trusted-types-for 'script'; trusted-types framework dompurify default;
      Do not use: trusted-types *; — this disables meaningful protection.
    references:
    - id: WEB-007
      url: https://appsec.int.example.com/req/web-frontend-security#web-007
  - title: Recommended CSP
    url: https://appsec.int.example.com/blueprints/spa-bff#_csp
    content: |-
      Content-Security-Policy: default-src 'self'; base-uri 'none'; object-src 'none';
        script-src 'self'; style-src 'self'; img-src 'self' data:;
        connect-src 'self' https://idp.example.com;
        worker-src 'self'; frame-ancestors 'none';
        require-trusted-types-for 'script'; trusted-types framework dompurify default;
      Avoid: unsafe-inline, unsafe-eval.
    references:
    - id: WEB-004
      url: https://appsec.int.example.com/req/web-frontend-security#web-004
  - title: PWA / Service Worker Safety
    url: https://appsec.int.example.com/blueprints/spa-bff#_pwa_service_worker
    content: |-
      Never cache sensitive endpoints (/bff/login, /bff/logout, /bff/user, /api/private/**).
      Cache only static assets: JS, CSS, HTML, images, fonts, /assets/**.
      Do not intercept or cache non-GET requests (POST/PUT/PATCH/DELETE).
      Do not provide a navigation fallback that serves a cached index.html for protected routes before authentication is established.
  - title: HSTS Header
    url: https://appsec.int.example.com/blueprints/spa-bff#_hsts
    content: |-
      Serve SPA and BFF only over HTTPS.
      Enable HSTS with at least: Strict-Transport-Security: max-age=31536000
      Add includeSubDomains and preload only after confirming every affected subdomain is controlled and permanently HTTPS-ready.
    references:
    - id: WEB-005
      url: https://appsec.int.example.com/req/web-frontend-security#web-005
  - title: Additional Security Headers
    url: https://appsec.int.example.com/blueprints/spa-bff#_additional_headers
    content: |-
      Referrer Policy: Referrer-Policy: strict-origin-when-cross-origin
      Permissions Policy: Permissions-Policy: geolocation=(), camera=(), microphone=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=()
    references:
    - id: WEB-008
      url: https://appsec.int.example.com/req/web-frontend-security#web-008
  - title: Dependency Hygiene
    url: https://appsec.int.example.com/blueprints/spa-bff#_dependency_hygiene
    content: |-
      Continuously scan frontend dependencies for known vulnerabilities.
      Use automated dependency management tooling to keep frontend packages up to date.
    references:
    - id: SC-001
      url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-001
    - id: SC-005
      url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-005
  - title: Build Integrity
    url: https://appsec.int.example.com/blueprints/spa-bff#_build_integrity
    content: |-
      Self-host scripts whenever possible.
      If using a CDN, apply Subresource Integrity (SRI):
      <script src="https://cdn.example.com/lib.min.js" integrity="sha384-BASE64HASH" crossorigin="anonymous"></script>
    references:
    - id: SC-002
      url: https://appsec.int.example.com/req/supply-chain-dependency-security#sc-002
- id: BP-CONTAINER-SECURITY
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/container-security
  title: Container & Infrastructure Security
  summary: |-
    Guidance for hardening container images and Kubernetes workloads.
    Applies to all services deployed as containers in any environment.
  topics:
  - _image_hardening
  - _runtime_policy
  - _network_policy
  - _iac_scanning
  - _podsecurity_standards
  - _seccomp_profiles
  sections:
  - title: 1. Image Hardening
    url: https://appsec.int.example.com/blueprints/container-security#_image_hardening
    content: |-
      Use a minimal base image (distroless, Alpine, or a hardened internal base).
      Pin the base image to an immutable digest (sha256:...) rather than a mutable tag.
      Run the container as a non-root user; set USER in the Dockerfile.
      Mount the filesystem read-only where possible; declare writable paths explicitly.
      Scan the image in CI with a vulnerability scanner before pushing to the registry.
    references:
    - id: IF-001
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-001
    - id: IF-002
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-002
    - id: IF-007
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-007
  - title: 2. Runtime Policy
    url: https://appsec.int.example.com/blueprints/container-security#_runtime_policy
    content: |-
      Drop all Linux capabilities (--cap-drop=ALL) and add back only what is strictly required.
      Set allowPrivilegeEscalation: false and readOnlyRootFilesystem: true in the pod security context.
      Do not run privileged containers in production.
      Enforce workload policies via PodSecurity admission or an OPA/Kyverno policy engine.
    references:
    - id: IF-003
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-003
    - id: IF-004
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-004
  - title: 3. Network Policy
    url: https://appsec.int.example.com/blueprints/container-security#_network_policy
    content: |-
      Apply Kubernetes NetworkPolicy (or a service-mesh equivalent) to each namespace.
      Default-deny all ingress and egress; allow only explicitly required flows.
      Restrict egress to known external endpoints; do not allow pods unrestricted internet access.
    references:
    - id: IF-005
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-005
  - title: 4. IaC Security Scanning
    url: https://appsec.int.example.com/blueprints/container-security#_iac_scanning
    content: |-
      Integrate an IaC security scanner (e.g. Checkov, tfsec, kics) into the CI/CD pipeline.
      Fail the build on critical policy violations.
      Store all IaC in version control and require peer review before merging infrastructure changes.
    references:
    - id: IF-006
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-006
    - id: IF-008
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-008
  - title: 5. PodSecurity Standards
    url: https://appsec.int.example.com/blueprints/container-security#_podsecurity_standards
    content: |-
      Apply the Kubernetes PodSecurity admission controller at the namespace level.
      Use the "restricted" profile for production namespaces:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: production
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
      The restricted profile enforces: non-root UID, no privilege escalation, no hostNetwork/hostPID,
      restricted volume types, and seccomp profile set to RuntimeDefault or Localhost.
    references:
    - id: IF-002
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-002
    - id: IF-004
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-004
  - title: 6. Seccomp Profiles
    url: https://appsec.int.example.com/blueprints/container-security#_seccomp_profiles
    content: |-
      Apply a seccomp profile to every pod to restrict the set of system calls available to the container.
      Use RuntimeDefault as the minimum baseline:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      For high-security workloads, create a custom Localhost profile that allows only the syscalls
      your application actually uses. Audit with tools like strace or seccomp-bpf logging to
      determine the required syscall set before enforcing.
    references:
    - id: IF-004
      url: https://appsec.int.example.com/req/infrastructure-container-security#if-004
- id: BP-SECURITY-LOGGING
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/security-logging
  title: Security Logging & Monitoring
  summary: |-
    Guidance for implementing structured security logging, centralized log aggregation,
    sensitive data redaction, and anomaly alerting.
  topics:
  - _structured_logging
  - _centralized_aggregation
  - _sensitive_data_redaction
  - _security_event_coverage
  - _alerting_rules
  - _log_retention
  sections:
  - title: 1. Structured Logging Format
    url: https://appsec.int.example.com/blueprints/security-logging#_structured_logging
    content: |-
      Use a structured log format (JSON) with consistent fields across all services.
      Every security-relevant log entry MUST include: timestamp (ISO 8601), request-id (correlation),
      user-id or service-id, action performed, outcome (success/failure), and source IP.
      Avoid free-text-only log entries for security events — they are difficult to parse and alert on.
      Use a shared logging library or middleware to enforce the schema automatically.
    references:
    - id: LM-002
      url: https://appsec.int.example.com/req/security-logging-monitoring#lm-002
  - title: 2. Security Event Coverage
    url: https://appsec.int.example.com/blueprints/security-logging#_security_event_coverage
    content: |-
      Log all security-relevant events with sufficient context for incident investigation:
      - Authentication: login success/failure, MFA challenge, token refresh, session creation/destruction
      - Authorization: access denied, privilege escalation attempts, RBAC role changes
      - Data access: bulk exports, sensitive record access, admin operations
      - Configuration: security setting changes, secret rotation, firewall rule modifications
      - Input validation: rejected payloads, rate limit breaches, WAF blocks
      Do not log the request body or response body by default — only log metadata.
    references:
    - id: LM-001
      url: https://appsec.int.example.com/req/security-logging-monitoring#lm-001
  - title: 3. Sensitive Data Redaction
    url: https://appsec.int.example.com/blueprints/security-logging#_sensitive_data_redaction
    content: |-
      Never include sensitive values in log entries at any severity level.
      Implement a redaction layer that strips or masks: passwords, API keys, bearer tokens,
      credit card numbers (PCI), PII (email, phone, SSN), session identifiers, and cryptographic keys.
      Use pattern-based redaction (regex for known formats) plus field-name-based redaction
      (any field named password, secret, token, authorization, cookie).
      Validate redaction in CI with a log sanitization test that asserts no sensitive patterns appear.
    references:
    - id: LM-006
      url: https://appsec.int.example.com/req/security-logging-monitoring#lm-006
  - title: 4. Centralized Log Aggregation
    url: https://appsec.int.example.com/blueprints/security-logging#_centralized_aggregation
    content: |-
      Forward all security logs to a centralized, tamper-resistant log aggregation system.
      Do not rely solely on local application logs — they can be deleted or modified by an attacker.
      Use a log shipper (Fluentd, Fluent Bit, Vector) to forward logs from each pod/container.
      Ensure the aggregation system enforces write-once semantics or append-only storage
      to prevent post-compromise log tampering.
    references:
    - id: LM-003
      url: https://appsec.int.example.com/req/security-logging-monitoring#lm-003
  - title: 5. Alerting Rules
    url: https://appsec.int.example.com/blueprints/security-logging#_alerting_rules
    content: |-
      Define alerting rules for anomalous patterns and route alerts to an on-call channel:
      - Repeated authentication failures (>5 per minute from same IP or user)
      - Privilege escalation (role change to admin, new service account creation)
      - Unusual data access volumes (bulk export exceeding normal baseline)
      - Rate limit breaches from a single source
      - Authorization failures spike (>10x baseline within 5 minutes)
      Tune thresholds based on production baselines to minimize alert fatigue.
    references:
    - id: LM-005
      url: https://appsec.int.example.com/req/security-logging-monitoring#lm-005
  - title: 6. Log Retention
    url: https://appsec.int.example.com/blueprints/security-logging#_log_retention
    content: |-
      Retain security logs for a minimum of 90 days online (hot storage, queryable)
      and 12 months in cold storage (archived, retrievable for forensic investigations).
      Align retention periods with compliance requirements (SOC 2, ISO 27001, PCI DSS).
      Automate log lifecycle management with retention policies in the aggregation platform.
    references:
    - id: LM-004
      url: https://appsec.int.example.com/req/security-logging-monitoring#lm-004
- id: BP-ERROR-HANDLING
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/error-handling
  title: Error Handling & Secure Failure
  summary: |-
    Guidance for implementing secure error handling that prevents information disclosure
    while maintaining debuggability through server-side diagnostics.
  topics:
  - _global_error_handler
  - _safe_error_responses
  - _auth_error_consistency
  - _server_side_diagnostics
  sections:
  - title: 1. Global Error Handler
    url: https://appsec.int.example.com/blueprints/error-handling#_global_error_handler
    content: |-
      Install a global error handler that catches all unhandled exceptions and returns a safe response.
      The handler MUST: return a generic error message to the client, log the full exception server-side
      with a correlation ID, set the appropriate HTTP status code, and ensure the application remains
      in a secure state (no partial transactions, no leaked resources).
      Never allow framework default error pages (with stack traces) to reach production.
    references:
    - id: EH-001
      url: https://appsec.int.example.com/req/error-handling-security-events#eh-001
  - title: 2. Safe Error Responses
    url: https://appsec.int.example.com/blueprints/error-handling#_safe_error_responses
    content: |-
      Return generic error messages to clients; log detailed diagnostics server-side only.
      Safe response format: {"error": "An error occurred", "correlationId": "<uuid>"}
      Never include in client responses: stack traces, SQL statements, internal file paths,
      database connection strings, framework version numbers, or internal service names.
      Use a correlation ID so support staff can look up the full error in server logs.
    references:
    - id: EH-002
      url: https://appsec.int.example.com/req/error-handling-security-events#eh-002
  - title: 3. Authentication & Authorization Error Consistency
    url: https://appsec.int.example.com/blueprints/error-handling#_auth_error_consistency
    content: |-
      Handle authentication and authorization failures consistently to avoid information disclosure:
      - Login failure: always return "Invalid credentials" regardless of whether the user exists
      - Use constant-time comparison for credentials to prevent timing side-channels
      - Return identical HTTP status codes and response shapes for "user not found" vs "wrong password"
      - Rate-limit failed attempts uniformly regardless of the failure reason
      - Do not reveal whether an email/username is registered in error messages or password reset flows
    references:
    - id: EH-003
      url: https://appsec.int.example.com/req/error-handling-security-events#eh-003
  - title: 4. Server-Side Diagnostics
    url: https://appsec.int.example.com/blueprints/error-handling#_server_side_diagnostics
    content: |-
      Log full exception details server-side for every error, including:
      - Exception type and message, stack trace, request method and path
      - Authenticated user ID (if available), correlation ID, timestamp
      - Request parameters (with sensitive values redacted per the Security Logging blueprint)
      Use structured logging (JSON) so diagnostics are searchable in the log aggregation platform.
      Set log level to ERROR for unhandled exceptions and WARN for expected validation failures.
    references:
    - id: LM-001
      url: https://appsec.int.example.com/req/security-logging-monitoring#lm-001
- id: BP-LLM-SECURITY
  source_id: owasp-informed-blueprints
  url: https://appsec.int.example.com/blueprints/llm-security
  title: AI / LLM Application Security
  summary: |-
    Guidance for building secure applications that integrate Large Language Models.
    Covers prompt injection defenses, output filtering, tool permission models, and cost control.
  topics:
  - _prompt_injection_defense
  - _output_filtering
  - _tool_permission_model
  - _rag_security
  - _cost_control
  - _system_prompt_protection
  sections:
  - title: 1. Prompt Injection Defense
    url: https://appsec.int.example.com/blueprints/llm-security#_prompt_injection_defense
    content: |-
      Treat user prompts, retrieved documents, files, tool results, and memory as untrusted content, including indirect instructions hidden in non-text input.
      Separate untrusted content from operator instructions, but do not treat delimiters, sanitization, or the system prompt as a security boundary.
      Constrain model capabilities and validate structured output with deterministic code.
      Authorize every data retrieval and tool action outside the model with least privilege.
      Require approval for high-impact actions and test direct, indirect, encoded, multilingual, and cross-modal injection attempts.
    references:
    - id: LLM-001
      url: https://appsec.int.example.com/req/ai-llm-security#llm-001
  - title: 2. Output Filtering & Validation
    url: https://appsec.int.example.com/blueprints/llm-security#_output_filtering
    content: |-
      Authorize and minimize source data before it enters the model context; output filtering cannot repair unauthorized retrieval.
      Treat model output as untrusted and validate it against a bounded schema and the destination's policy.
      Apply contextual encoding before display and deterministic validation before any downstream API or tool call.
      Never pass output directly to eval, a shell, query syntax, innerHTML, filesystem paths, or an authorization decision.
      Record validation failures without storing prompts, outputs, credentials, or personal data unnecessarily.
    references:
    - id: LLM-002
      url: https://appsec.int.example.com/req/ai-llm-security#llm-002
    - id: LLM-005
      url: https://appsec.int.example.com/req/ai-llm-security#llm-005
  - title: 3. Tool Permission Model
    url: https://appsec.int.example.com/blueprints/llm-security#_tool_permission_model
    content: |-
      Expose only tools required for the feature and give each tool a dedicated least-privileged identity.
      Authorize every invocation server-side for the authenticated user, tenant, action, target resource, and bounded parameters.
      Require a human to approve high-impact, external, destructive, or irreversible actions after the exact action and target are known.
      Prevent cross-tenant state and memory reuse, cap invocations and iterations, and log the actor, tool, target, decision, and outcome without sensitive parameters.
    references:
    - id: LLM-006
      url: https://appsec.int.example.com/req/ai-llm-security#llm-006
  - title: 4. RAG & Vector Store Security
    url: https://appsec.int.example.com/blueprints/llm-security#_rag_security
    content: |-
      Authenticate and authorize every source and updater, retain provenance and tenant ownership, and quarantine content that fails the ingestion policy.
      Enforce the source document's authorization before retrieval so a user cannot retrieve embeddings for inaccessible content.
      Isolate tenant indexes and caches, bound result counts, and rate-limit similarity search to reduce extraction and resource abuse.
      Validate the embedding model identity, dimensions, content size, and update history before indexing.
    references:
    - id: LLM-004
      url: https://appsec.int.example.com/req/ai-llm-security#llm-004
    - id: LLM-008
      url: https://appsec.int.example.com/req/ai-llm-security#llm-008
  - title: 5. Cost Control & Rate Limiting
    url: https://appsec.int.example.com/blueprints/llm-security#_cost_control
    content: |-
      Bound input bytes, output tokens, retrieval results, tool calls, agent iterations, concurrency, and wall-clock time.
      Enforce shared quotas by authenticated tenant and user as well as client source.
      Monitor and attribute consumption without logging prompt contents, and alert before approved budgets are exhausted.
      Use graceful degradation and circuit breakers that stop expensive work without disabling authentication or authorization.
    references:
    - id: LLM-010
      url: https://appsec.int.example.com/req/ai-llm-security#llm-010
  - title: 6. System Prompt Protection
    url: https://appsec.int.example.com/blueprints/llm-security#_system_prompt_protection
    content: |-
      Store prompts as reviewed configuration and avoid returning unnecessary internal configuration in normal responses or errors.
      Never place credentials, personal data, tenant secrets, hidden authorization rules, or other security-sensitive values in a prompt.
      Assume users can infer or extract prompt content and enforce authorization, policy, tool permissions, and output constraints outside the model.
      Version and review prompt changes because they affect behavior, while keeping deterministic controls authoritative.
    references:
    - id: LLM-007
      url: https://appsec.int.example.com/req/ai-llm-security#llm-007
