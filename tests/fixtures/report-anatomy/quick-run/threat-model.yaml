  stride: Denial of Service
  cwe: CWE-918
  title: Server-side request forgery without URL validation — server.js:30
  scenario: An attacker POSTs an attacker-controlled URL to /webhooks/preview; server.js:30 passes it directly to fetch()
    with no validation, timeout, or size limit, allowing the attacker to force the server to make arbitrary HTTP requests,
    reach internal services including cloud metadata endpoints, or exhaust server threads by targeting slow-responding hosts.
  attack_steps: null
  evidence_summary: server.js:30 passes `req.body.url` directly to `fetch()` without URL scheme or hostname validation, and
    applies no AbortSignal timeout or response-body size limit, proving attacker-controlled external network requests execute
    unbounded from server context.
  impact_description: An attacker can enumerate internal services on the VPC or container network, access cloud metadata credentials
    (e.g., AWS IMDSv1 at 169.254.169.254), or exhaust server connection threads and memory through deliberately slow or large
    responses, degrading availability for legitimate users.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None — no URL allowlist, scheme restriction, timeout, or authentication is applied to /webhooks/preview.
  mitigation_title: Validate and bound outbound URL in /webhooks/preview handler in server.js
  remediation:
    effort: Medium
    steps:
    - Before calling `fetch()` at server.js:30, parse `req.body.url` with `new URL()`, reject any hostname not in an explicit
      allowlist, and block private, loopback, link-local, and metadata address ranges (per IV-007).
    - 'Pass `{ signal: AbortSignal.timeout(5000) }` to `fetch()` and limit the response body read to a documented byte cap
      (e.g., `res.arrayBuffer()` with a size check) to prevent thread exhaustion.'
    - Apply partner authentication middleware to `/webhooks/preview` so only authorized callers can trigger outbound fetches.
    code_example: "// server.js:30 — validate URL before fetch\nconst ALLOWED_HOSTS = new Set(['hooks.example.com'])\nconst\
      \ parsed = new URL(req.body.url)\nif (!ALLOWED_HOSTS.has(parsed.hostname))\n  return res.status(400).json({ error: 'Disallowed\
      \ URL' })\nconst response = await fetch(req.body.url, { signal: AbortSignal.timeout(5000) })"
    verification: '`curl -s -o /dev/null -w ''%{http_code}'' -X POST http://localhost:3000/webhooks/preview -H ''Content-Type:
      application/json'' -d ''{"url":"http://169.254.169.254/latest/meta-data/"}'' ` must return 400 after the fix.'
    reference: OWASP Server-Side Request Forgery Prevention Cheat Sheet — https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
  evidence:
  - file: server.js
    line: 30
