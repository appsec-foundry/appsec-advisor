    boundary. Access control depends on each handler (or the caller) remembering to require a session, so an unauthenticated
    client can reach privileged operations directly.
  structural_recommendation: enforce authentication centrally at the routing and channel boundary so every exposed endpoint
    requires a verified session unless explicitly marked public
- id: W-003
  weakness_class: injection
  kind: design
  title: Input handling lacks enforced boundary validation
  statement: Schema / Allowlist Input Validation is not consistently enforced.
  severity: Medium
  severity_basis: design-risk
  observable_backing:
    absent_control_signal:
    - Schema Validation
    - Allowlist Validation
  mechanism_id: blacklist-only-input-validation
  description: Request handlers do not validate input against one enforced server-side schema or allowlist at the boundary
    — validation is either absent on the vulnerable parameters or limited to rejecting selected bad patterns (a blacklist).
    New encodings and unanticipated input forms can therefore reach downstream parsers or interpreters.
  structural_recommendation: enforce server-side schemas and domain-specific allowlists before input reaches parsing, persistence,
    or command construction
- id: W-004
  weakness_class: outdated_deps
  kind: design
  title: Build pipeline trusts mutable third-party references
  statement: Third-Party Action Pinning is not consistently enforced.
  severity: Medium
  severity_basis: design-risk
  observable_backing:
    absent_control_signal:
    - Commit-SHA Action Pinning
    - Dependency Provenance Verification
  mechanism_id: build-pipeline-mutable-refs
  description: CI/CD workflows resolve third-party actions and other build dependencies to mutable tags or branches instead
    of immutable commit digests, so a retagged or compromised upstream runs inside the pipeline with its token and secret
    scope.
  structural_recommendation: pin every third-party action and build dependency to an immutable commit SHA (or a vetted internal
    mirror) and enforce SHA-pinning in CI
verdict:
  severity: red
  opening: 'This application has no access controls that work: any caller from the internet can take over any user account,
    run arbitrary commands on the server, or read every secret the service depends on — without supplying any credential.
    The service must not be publicly reachable in its current state.'
  bullets:
  - title: Authentication bypassed at login
    body: Database query injection (SQL injection) at the login handler grants any caller a signed admin session without a
      password.
    findings:
    - F-001
    - F-003
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Server takeover via admin route
    body: Command string injection (OS command injection) on an unauthenticated admin route lets any caller run arbitrary
      system commands.
    findings:
    - F-002
    weaknesses: []
    verified_attack_path: false
  - title: All runtime secrets exposed
    body: An unauthenticated debug route returns all runtime configuration as plain text, disclosing every credential and
      signing secret used by the application.
    findings:
    - F-004
    - F-006
    weaknesses: []
    verified_attack_path: false
  - title: Account access freely forgeable
    body: The session signing key is committed in source code so any reader with repository access can issue tokens for any
      user identity.
    findings:
    - F-005
    weaknesses: []
    verified_attack_path: false
  - title: Customer account data exposed
    body: User records are readable without authentication, exposing account details and role assignments for any enumerated
      identifier.
    findings:
    - F-011
    - F-010
    weaknesses: []
    verified_attack_path: false
  - title: AI assistant open to cost abuse
    body: The AI assistant accepts unauthenticated requests with no rate limit, enabling cost exhaustion and prompt manipulation
      against the integrated language model.
    findings:
    - F-008
    weaknesses: []
    verified_attack_path: false
  closing: Adding authentication to every public route and removing all hardcoded secrets would close the most critical risks;
    the remaining gaps follow from those two absent controls.
  bullets_intro: 'What an attacker can do today:'
