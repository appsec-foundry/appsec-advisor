attack_surface:
- entry_point: POST /login
  protocol: HTTP
  auth_required: false
  notes: Login endpoint performs authentication via SQL string interpolation at server.js:12 enabling SQL injection to bypass
    credential check.
  relevance_tags:
  - authentication
- entry_point: GET /users/:id
  protocol: HTTP
  auth_required: false
  notes: Unauthenticated user lookup; raw SQL with string interpolation at server.js:18 is a SQL injection sink.
- entry_point: POST /admin/export
  protocol: HTTP
  auth_required: false
  notes: Unauthenticated admin endpoint; exec() with unsanitized user-supplied path enables command injection and arbitrary
    file read.
  relevance_tags:
  - management
  - missing-auth
- entry_point: POST /webhooks/preview
  protocol: HTTP
  auth_required: false
  notes: Unauthenticated webhook preview; fetch(req.body.url) enables SSRF to internal network and cloud metadata endpoints.
- entry_point: POST /assistant
  protocol: HTTP
  auth_required: false
  notes: Unauthenticated LLM endpoint; user input concatenated directly into prompt enabling prompt injection against gpt-4o-mini.
  relevance_tags:
  - missing-auth
  - llm
- entry_point: GET /redirect
  protocol: HTTP
