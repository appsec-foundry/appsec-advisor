tier_root_causes:
  server:
  - Raw request data interpolated into SQL and shell command execution strings
  - Routes registered without authentication middleware expose privileged operations
  - Attacker-controlled URLs accepted without scheme/host validation or allowlisting
  - Secrets committed to source and exposed through unauthenticated debug endpoints
  - Tenant identity derived from an unvalidated request header instead of JWT claims
