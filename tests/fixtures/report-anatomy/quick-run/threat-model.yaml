threats:
- local_id: web-api-001
  threat_category_id: TH-02
  additional_categories: []
  stride: Spoofing
  cwe: CWE-89
  title: SQL Injection authentication bypass — server.js:12
  scenario: An unauthenticated attacker submits a crafted email value such as `' OR '1'='1' --` to POST /login. The server
    concatenates the attacker-controlled string directly into the SQL query via template literal interpolation at server.js:12,
    causing the database to return the first user row (typically admin) without verifying the password. The server then issues
    a valid JWT for that identity, giving the attacker a signed session as any user including administrators.
  attack_steps:
  - Attacker posts /login with email=`' OR '1'='1' --` and arbitrary password, submitting a tautological predicate to the
    login SQL handler.
  - The interpolated query `SELECT id, role FROM users WHERE email = '' OR '1'='1' --' AND password = '...'` returns the first
    user row without password verification.
  - Server passes the returned user object to signJwt() and issues a fully valid JWT for the impersonated identity.
  - Attacker uses the forged JWT to access admin-only operations and all user data under the impersonated identity.
  evidence_summary: 'server.js:12 interpolates req.body.email and req.body.password directly into a SQL string: `SELECT id,
    role FROM users WHERE email = ''${req.body.email}'' AND password = ''${req.body.password}''`. No parameterization, no
    prepared statement, and no input sanitization is present.'
  impact_description: Complete authentication bypass. Attacker obtains a signed JWT for any user account including administrators,
    enabling subsequent access to all protected routes, user data, and admin operations within the application.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None
  mitigation_title: Replace string-interpolated SQL with parameterized queries in login handler
  remediation:
    effort: Low
    steps:
    - 'Replace the template-literal SQL string at server.js:12 with a parameterized query: `db.query(''SELECT id, role FROM
      users WHERE email = ? AND password = ?'', [req.body.email, req.body.password])`.'
    - Add input validation middleware (e.g., express-validator) to enforce type, length, and format on email and password
      fields before they reach any database call.
    - Write an integration test that submits `' OR '1'='1' --` as the email and asserts HTTP 401 with no JWT in the response.
    code_example: null
    verification: Send POST /login with body {"email":"' OR '1'='1' --","password":"x"}; the response MUST be HTTP 401 with
      no token field. A 200 response with a JWT indicates the injection is still exploitable.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  evidence:
  - file: server.js
    line: 12
  boundary_refs:
  - boundary_id: tb-1
    origin_component_id: web-api
    rationale: tb-1 authentication leg assumes credentials are verified before the handler; SQL injection at server.js:12
      defeats that verification entirely.
    leg: authentication
