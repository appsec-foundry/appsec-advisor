- assessment: The coupon limit (max 10%) and eligibility conditions exist only in the system prompt. The generateCoupon tool accepts any number with no server-side cap, order validation or authentication, so model-directed action authorization depends on prompt compliance. getOrderById does check authentication and ownership (compared by vowel-masked email). The model-chosen searchProducts and getProductReviews tools have no per-user scoping. The /rest/chat route has no auth middleware, and the flow evidence says the token is decoded without signature verification. The system prompt also embeds a confidential discount instruction.
  component_ids:
