- assessment: 'isAuthorized/denyAll/isAccounting are applied to baskets, complaints, privacy requests, B2B, 2FA and several generated API resources. Coverage is inconsistent: PUT /api/Products/:id authorization is commented out, /api/Deliverys, /rest/order-history, /rest/deluxe-membership, /rest/memories, /rest/chat and /rest/products/:id/reviews PUT show no authorization middleware in the inspected slices. The /api/Quantitys/:id IpFilter uses a placeholder address.'
