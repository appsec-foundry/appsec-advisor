components:
- id: angular-spa
  name: Angular SPA Frontend
  tier: client
  paths:
  - frontend/src/app/**/*.ts
  - frontend/src/app/**/*.html
  - frontend/src/hacking-instructor/**/*.ts
- id: express-backend
  name: Express REST API Backend
  tier: application
  paths:
  - server.ts
  - app.ts
  - routes/*.ts
  - lib/**/*.ts
  - models/*.ts
  - views/*.hbs
  - views/*.pug
- id: auth
  name: Authentication and Session Surface
  tier: application
  paths:
  - routes/login.ts
  - routes/saveLoginIp.ts
  - lib/insecurity.ts
  - lib/startup/registerWebsocketEvents.ts
  - routes/2fa.ts
  - routes/authenticatedUsers.ts
  - routes/resetPassword.ts
- id: realtime-channel
  name: Real-time WebSocket Channel
  tier: application
  paths:
  - lib/challengeUtils.ts
  - lib/startup/registerWebsocketEvents.ts
- id: web3-nft
  name: Web3 and NFT Surface
  tier: application
  paths:
  - routes/checkKeys.ts
  - routes/nftMint.ts
  - routes/redirect.ts
  - routes/web3Wallet.ts
- id: ci-cd-pipeline
  name: CI/CD Pipeline
  tier: application
  paths:
  - .github/workflows/**
  - .gitlab-ci.yml
  - Dockerfile
  - docker-compose.test.yml
  - package.json
  - frontend/package.json
- id: sqlite-db
  name: SQLite Database
  tier: data
  paths:
  - data/datacreator.ts
  - data/staticData.ts
- id: marsdb-store
  name: MarsDB Embedded Document Store
  tier: data
  paths:
  - data/mongodb.ts
trust_boundaries:
- id: tb-2
  from: external
  to: auth
  kind: identity
- id: tb-1
  from: external
  to: express-backend
  kind: network
- id: tb-3
  from: external
  to: realtime-channel
  kind: network
- id: tb-4
  from: express-backend
  to: sqlite-db
  kind: process
- id: tb-5
  from: express-backend
  to: marsdb-store
  kind: process
- id: tb-6
  from: express-backend
  to: external
  kind: third-party
