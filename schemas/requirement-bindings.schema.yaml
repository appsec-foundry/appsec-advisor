$schema: https://json-schema.org/draft/2020-12/schema
$id: https://appsec-advisor.local/schemas/requirement-bindings.schema.yaml
title: Requirement implementation bindings
type: object
additionalProperties: false
required:
  - version
  - retired_ids
  - requirements
properties:
  version:
    const: 1
  retired_ids:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: ^REQ-[A-Z]{2,5}-[0-9]{3}$
  requirements:
    type: object
    propertyNames:
      pattern: ^REQ-[A-Z]{2,5}-[0-9]{3}$
    additionalProperties:
      type: object
      additionalProperties: false
      required:
        - applies_to
        - decisions
        - documents
        - coverage
        - guards
      properties:
        applies_to:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        decisions:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Z]{2,3}-[0-9]+$
        documents:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: \.md$
        coverage:
          enum:
            - direct
            - partial
            - advisory
        guards:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^tests/.+\.py::(?:[A-Za-z_][A-Za-z0-9_]*::)?test_[A-Za-z0-9_]+$
