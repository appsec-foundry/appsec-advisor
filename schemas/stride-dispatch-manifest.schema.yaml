$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://appsec-advisor/schemas/stride-dispatch-manifest.schema.yaml"
title: AppSec Advisor STRIDE Dispatch Manifest
description: |
  Schema for `.stride-dispatch-manifest.json` — the Analyst-A → skill handoff
  for Full-M1. Analyst-A (Phases 1-8 + dispatch-prep) serializes every
  per-component parameter the `appsec-stride-analyzer` needs into this manifest,
  then stops before Phase 9. The skill (Level-0) reads it, validates it via
  `scripts/validate_dispatch_manifest.py` (hard gate), and dispatches one
  `appsec-stride-analyzer` per component in bounded parallel waves — replacing
  serial inline STRIDE without creating an unbounded concurrency burst.

  The per-component fields mirror the dispatch parameters documented in
  `agents/phases/phase-group-threats.md` ("For each component, use Agent tool")
  and the Inputs section of `agents/appsec-stride-analyzer.md`. Scalar context
  fields (interfaces, controls, known_*) are authored by the
  analyst from its Phase 6-8 analysis (they are NOT all reconstructable from the
  structured on-disk artifacts, which is why the analyst must serialize them
  here). Index/slice fields are absolute paths under $OUTPUT_DIR, or the literal
  string "none".

type: object
additionalProperties: true
required:
  - schema_version
  - components
properties:
  schema_version:
    type: integer
    const: 1
  context_version:
    description: |
      Evidence-admission contract. Absent/1 retains the legacy index-only
      handoff. Version 2 requires one fingerprinted bounded evidence bundle per
      selected component and activates canonical containment checks.
    type: integer
    enum: [1, 2]
  generated_at:
    type: string
    description: ISO-8601 UTC timestamp when Analyst-A wrote the manifest.
  stride_profile:
    description: STRIDE profile passed to every analyzer (label or inline object).
    oneOf:
      - type: string
      - type: object
  components:
    type: array
    minItems: 1
    description: One entry per non-trivial, non-carry-forward component to dispatch.
    items:
      type: object
      additionalProperties: true
      required:
        - component_id
        - component_name
        - component_paths
        - component_complexity
        - max_turns
        - index_paths
      properties:
        component_id:
          type: string
          minLength: 1
          pattern: "^[a-z0-9][a-z0-9-]*$"
        component_name:
          type: string
          minLength: 1
        component_description:
          type: string
        component_paths:
          description: Path globs for this component (list, or comma-separated string).
          oneOf:
            - type: string
              minLength: 1
            - type: array
              items: { type: string }
              minItems: 1
        component_complexity:
          type: string
          enum: [simple, moderate, complex]
        max_turns:
          type: integer
          minimum: 1
        estimated_threat_count:
          type: integer
          minimum: 0
        business_context:
          description: Bounded human-readable business and organization facts for this component.
          type: object
          minProperties: 1
          maxProperties: 5
          additionalProperties: false
          properties:
            business_purpose: { type: string, minLength: 1, maxLength: 1000, pattern: "\\S" }
            impact_if_compromised: { type: string, minLength: 1, maxLength: 1000, pattern: "\\S" }
            sensitive_assets: { $ref: "#/$defs/context_list" }
            security_obligations: { $ref: "#/$defs/context_list" }
            security_assumptions: { $ref: "#/$defs/context_list" }
        architecture_context:
          description: Bounded human-readable security architecture facts for this component.
          type: object
          minProperties: 1
          maxProperties: 5
          additionalProperties: false
          properties:
            security_role: { type: string, minLength: 1, maxLength: 1000, pattern: "\\S" }
            exposed_interfaces: { $ref: "#/$defs/context_list" }
            security_dependencies: { $ref: "#/$defs/context_list" }
            deployment_constraints: { $ref: "#/$defs/context_list" }
            architecture_assumptions: { $ref: "#/$defs/context_list" }
        estimated_threat_count_label:
          description: |
            Pacing band for `estimated_threat_count`, derived deterministically by
            the builder (low ≤3 / moderate 4–7 / high ≥8). This — not the integer —
            is what the dispatch prompt passes as `ESTIMATED_THREAT_COUNT`, because
            the analyzer's turn-budget self-regulation branches on the label.
          type: string
          enum: [low, moderate, high]
        cheap_stride:
          description: |
            Audit marker — true when cheap-stride put this component in the
            screening set (flat 8-turn six-category pass). Absent otherwise.
            Cheap-stride is on by default at quick/standard depth, off at
            thorough; `--cheap-stride` / `--no-cheap-stride` override.
          type: boolean
        interfaces:
          description: Component interfaces (entry points / exposed surfaces) from Phase 6.
          oneOf: [ { type: string }, { type: array } ]
        controls:
          description: Security controls relevant to this component, from Phase 8.
          oneOf: [ { type: string }, { type: array } ]
        known_secrets:
          oneOf: [ { type: string }, { type: array } ]
        known_vulns:
          oneOf: [ { type: string }, { type: array } ]
        known_llm_patterns:
          oneOf: [ { type: string }, { type: array } ]
        supply_chain_findings:
          description: Only for the ci-cd-pipeline component; otherwise omitted/none.
          oneOf: [ { type: string }, { type: array }, { type: "null" } ]
        focus_paths:
          description: Compatibility input; context version 2 normalizes this to a bounded list.
          oneOf:
            - { type: string, minLength: 1, maxLength: 4096 }
            - type: array
              maxItems: 16
              items: { type: string, minLength: 1, maxLength: 500 }
        exclude_paths:
          description: Compatibility input; context version 2 normalizes this to a bounded list.
          oneOf:
            - { type: string, minLength: 1, maxLength: 4096 }
            - type: array
              maxItems: 16
              items: { type: string, minLength: 1, maxLength: 500 }
        taxonomy_slice_dir:
          type: string
          description: Per-component taxonomy slice dir, or the plugin data dir.
        index_paths:
          type: object
          additionalProperties: false
          description: |
            Per-component context file paths under $OUTPUT_DIR, each an absolute
            path to an existing file OR the literal string "none". The validator
            enforces existence for non-"none" values.
          required:
            - prior_findings
            - known_threats
            - cross_repo
            - requirements_violations
            - relevant_actors
            - trust_boundaries
          properties:
            prior_findings:        { type: string, minLength: 1 }
            known_threats:         { type: string, minLength: 1 }
            cross_repo:            { type: string, minLength: 1 }
            requirements_violations: { type: string, minLength: 1 }
            relevant_actors:       { type: string, minLength: 1 }
            trust_boundaries:       { type: string, minLength: 1 }
        lens_ids:
          description: Fixed plugin-owned optional analysis lenses selected from validated component features.
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [agentic, llm, mobile, spa, supply-chain]
        evidence_bundle_path:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "^\\.dispatch-context/[a-z0-9][a-z0-9-]*/evidence-bundle\\.json$"
        evidence_bundle_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        evidence_bundle_estimated_tokens:
          type: integer
          minimum: 1
          maximum: 16384
        business_context_path:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "^\\.dispatch-context/[a-z0-9][a-z0-9-]*/business-context\\.json$"
        business_context_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        business_context_estimated_tokens:
          type: integer
          minimum: 1
          maximum: 4096
        architecture_context_path:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "^\\.dispatch-context/[a-z0-9][a-z0-9-]*/architecture-context\\.json$"
        architecture_context_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        architecture_context_estimated_tokens:
          type: integer
          minimum: 1
          maximum: 4096
        security_context_projections:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: object
            required: [context_id, artifact_path, sha256, estimated_tokens]
            additionalProperties: false
            properties:
              context_id:
                enum:
                  - actors.component_context
                  - controls.component_context
                  - prior_run.component_findings
                  - requirements.component_context
                  - threats.known_threats
                  - trust_boundaries.component_context
              artifact_path:
                type: string
                minLength: 1
                maxLength: 500
                pattern: "^\\.dispatch-context/[a-z0-9][a-z0-9-]*/(?:actors|controls|known-threats|prior-findings|requirements|trust-boundaries)-context\\.json$"
              sha256:
                type: string
                pattern: "^[a-f0-9]{64}$"
              estimated_tokens:
                type: integer
                minimum: 1
                maximum: 16384
      allOf:
        - if:
            anyOf:
              - required: [business_context_path]
              - required: [business_context_sha256]
              - required: [business_context_estimated_tokens]
          then:
            required:
              - business_context_path
              - business_context_sha256
              - business_context_estimated_tokens
        - if:
            anyOf:
              - required: [architecture_context_path]
              - required: [architecture_context_sha256]
              - required: [architecture_context_estimated_tokens]
          then:
            required:
              - architecture_context_path
              - architecture_context_sha256
              - architecture_context_estimated_tokens

allOf:
  - if:
      required: [context_version]
      properties:
        context_version: { const: 2 }
    then:
      properties:
        components:
          items:
            required:
              - evidence_bundle_path
              - evidence_bundle_sha256
              - evidence_bundle_estimated_tokens
            properties:
              focus_paths:
                type: array
                maxItems: 16
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
                  maxLength: 500
                  not:
                    pattern: "^(?:/|[A-Za-z]:[\\/]|[A-Za-z][A-Za-z0-9+.-]*://)|(?:^|/)\\.\\.(?:/|$)|\\\\|[*?\\[\\]{}!]"
              exclude_paths:
                type: array
                maxItems: 16
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
                  maxLength: 500
                  not:
                    pattern: "^(?:/|[A-Za-z]:[\\/]|[A-Za-z][A-Za-z0-9+.-]*://)|(?:^|/)\\.\\.(?:/|$)|\\\\|[*?\\[\\]{}!]"

$defs:
  context_list:
    type: array
    minItems: 1
    maxItems: 8
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 300
      pattern: "\\S"
