$schema: https://json-schema.org/draft/2020-12/schema
$id: https://appsec-advisor/schemas/threat-taxonomy-slice.schema.yaml
title: Component threat-taxonomy slice
type: object
required: [schema_version, categories, cwe_to_th]
additionalProperties: false
properties:
  schema_version:
    const: 1
  categories:
    type: array
    maxItems: 64
    items:
      type: object
      required:
        - id
        - title
        - description
        - stride
        - cwe_pillar
        - cwe_canonical
        - cwe_top25_members
        - owasp_top10_2025
        - owasp_asvs
        - typical_findings
      additionalProperties: false
      properties:
        id: {$ref: '#/$defs/th_id'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, minLength: 1, maxLength: 4000}
        stride:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            enum: [Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege]
        cwe_pillar: {$ref: '#/$defs/cwe_id'}
        cwe_canonical: {$ref: '#/$defs/cwe_id'}
        cwe_top25_members:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {$ref: '#/$defs/cwe_id'}
        owasp_top10_2025: {type: string, pattern: '^A(?:0[1-9]|10)$'}
        owasp_api2023:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, pattern: '^API(?:[1-9]|10)$'}
        owasp_asvs: {type: string, minLength: 1, maxLength: 50}
        typical_findings:
          type: array
          minItems: 1
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 1000}
        signal_required: {type: boolean}
        signal_patterns:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 1000}
  cwe_to_th:
    type: object
    maxProperties: 1000
    propertyNames: {$ref: '#/$defs/cwe_id'}
    additionalProperties:
      type: array
      minItems: 1
      maxItems: 16
      uniqueItems: true
      items: {$ref: '#/$defs/th_id'}
$defs:
  th_id: {type: string, pattern: '^TH-[0-9]{2}$'}
  cwe_id: {type: string, pattern: '^CWE-[0-9]+$'}
