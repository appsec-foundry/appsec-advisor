$schema: https://json-schema.org/draft/2020-12/schema
$id: https://appsec-advisor/schemas/threat-model.output-v2.schema.yaml
title: Repository-qualified threat-model.yaml output
description: Version 2 retains the version-1 output contracts and adds an admitted source inventory and repository-qualified
  paths and evidence.
type: object
additionalProperties: true
required:
- meta
- components
- assets
- attack_surface
- trust_boundaries
- security_controls
- threats
- mitigations
- source_inventory
properties:
  actors:
    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/actors
  meta:
    type: object
    additionalProperties: true
    required:
    - schema_version
    - project
    - generated
    - mode
    - model
    properties:
      schema_version:
        const: 2
      project:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/project
      generated:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/generated
      analysis_duration_seconds:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/analysis_duration_seconds
      mode:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/mode
      open_user_registration:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_user_registration
      opt_in_actors_not_enabled:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/opt_in_actors_not_enabled
      open_registration_resolution:
        type: object
        additionalProperties: false
        required:
        - open
        - disputed
        - reason
        - evidence
        properties:
          open:
            $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_registration_resolution/properties/open
          disputed:
            $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_registration_resolution/properties/disputed
          reason:
            $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_registration_resolution/properties/reason
          evidence:
            type: array
            maxItems: 8
            uniqueItems: true
            items:
              type: object
              additionalProperties: false
              required:
              - file
              - line
              - repository_id
              - sha256
              properties:
                file:
                  $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_registration_resolution/properties/evidence/items/properties/file
                line:
                  $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_registration_resolution/properties/evidence/items/properties/line
                repository_id:
                  type: string
                  pattern: ^repo-[a-f0-9]{16}$
                sha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
        allOf:
        - if:
            $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_registration_resolution/allOf/0/if
          then:
            $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_registration_resolution/allOf/0/then
        - if:
            $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_registration_resolution/allOf/1/if
          then:
            $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_registration_resolution/allOf/1/then
      enrichment_pass:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/enrichment_pass
      open_registration_source:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/open_registration_source
      analyst:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/analyst
      model:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/model
      compliance_scope:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/compliance_scope
      asset_classification:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/asset_classification
      repo_url:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/repo_url
      team_owner:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/team_owner
      git:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/git
      id_counters:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/id_counters
      boundary_selection:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/boundary_selection
      accepted_risks:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/meta/properties/accepted_risks
  changelog:
    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/changelog
  components:
    type: array
    items:
      type: object
      additionalProperties: true
      required:
      - id
      - name
      - paths
      - repository_ids
      properties:
        id:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/id
        name:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/name
        description:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/description
        paths:
          type: array
          minItems: 1
          maxItems: 20000
          uniqueItems: true
          items:
            $ref: https://appsec-advisor/schemas/fragments/components-v2.schema.json#/$defs/source_path
        sensitive_data:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required:
            - category
            - basis
            - handling
            - evidence
            allOf:
            - if:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/sensitive_data/items/allOf/0/if
              then:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/sensitive_data/items/allOf/0/then
            properties:
              category:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/sensitive_data/items/properties/category
              basis:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/sensitive_data/items/properties/basis
              handling:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/sensitive_data/items/properties/handling
              evidence:
                type: array
                minItems: 1
                maxItems: 8
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - file
                  - line
                  - repository_id
                  - sha256
                  properties:
                    file:
                      $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/sensitive_data/items/properties/evidence/items/properties/file
                    line:
                      $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/sensitive_data/items/properties/evidence/items/properties/line
                    repository_id:
                      type: string
                      pattern: ^repo-[a-f0-9]{16}$
                    sha256:
                      type: string
                      pattern: ^[a-f0-9]{64}$
        capabilities:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required:
            - capability
            - evidence
            properties:
              capability:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/capabilities/items/properties/capability
              evidence:
                type: array
                minItems: 1
                maxItems: 4
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - file
                  - line
                  - repository_id
                  - sha256
                  properties:
                    file:
                      $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/capabilities/items/properties/evidence/items/properties/file
                    line:
                      $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/capabilities/items/properties/evidence/items/properties/line
                    repository_id:
                      type: string
                      pattern: ^repo-[a-f0-9]{16}$
                    sha256:
                      type: string
                      pattern: ^[a-f0-9]{64}$
        complexity:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/complexity
        tier:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/components/items/properties/tier
        repository_ids:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: ^repo-[a-f0-9]{16}$
  external_entities:
    type: array
    maxItems: 64
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - kind
      - description
      - evidence
      dependentSchemas:
        access:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/dependentSchemas/access
        service_roles:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/dependentSchemas/service_roles
      properties:
        id:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/id
        name:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/name
        kind:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/kind
        access:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/access
        service_roles:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required:
            - role
            - evidence
            properties:
              role:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/service_roles/items/properties/role
              evidence:
                type: array
                minItems: 1
                maxItems: 4
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - file
                  - line
                  - repository_id
                  - sha256
                  properties:
                    file:
                      $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/service_roles/items/properties/evidence/items/properties/file
                    line:
                      $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/service_roles/items/properties/evidence/items/properties/line
                    repository_id:
                      type: string
                      pattern: ^repo-[a-f0-9]{16}$
                    sha256:
                      type: string
                      pattern: ^[a-f0-9]{64}$
        description:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/description
        declared:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/declared
        evidence:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required:
            - file
            - line
            - repository_id
            - sha256
            properties:
              file:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/evidence/items/properties/file
              line:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/external_entities/items/properties/evidence/items/properties/line
              repository_id:
                type: string
                pattern: ^repo-[a-f0-9]{16}$
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
  data_flows:
    type: array
    items:
      type: object
      additionalProperties: true
      required:
      - id
      - from
      - to
      - label
      - protocol
      - data_classification
      properties:
        id:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/id
        from:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/from
        to:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/to
        from_entity:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/from_entity
        to_entity:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/to_entity
        label:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/label
        diagram_label:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/diagram_label
        protocol:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/protocol
        authentication:
          type: object
          additionalProperties: false
          required:
          - scheme
          - scope
          - evidence
          properties:
            scheme:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/authentication/properties/scheme
            scope:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/authentication/properties/scope
            transport:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/authentication/properties/transport
            flow:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/authentication/properties/flow
            factors:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/authentication/properties/factors
            evidence:
              type: array
              minItems: 1
              maxItems: 8
              items:
                type: object
                additionalProperties: false
                required:
                - file
                - line
                - repository_id
                - sha256
                properties:
                  file:
                    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/authentication/properties/evidence/items/properties/file
                  line:
                    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/authentication/properties/evidence/items/properties/line
                  repository_id:
                    type: string
                    pattern: ^repo-[a-f0-9]{16}$
                  sha256:
                    type: string
                    pattern: ^[a-f0-9]{64}$
          allOf:
          - if:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/authentication/allOf/0/if
            then:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/authentication/allOf/0/then
            else:
              not:
                required:
                - factors
          - if:
              required:
              - flow
            then:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/authentication/allOf/1/then
        access_group:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/access_group
        interaction:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/interaction
        protocol_group:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/protocol_group
        data_classification:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/data_classification
        direction:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/direction
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - file
            - repository_id
            - sha256
            properties:
              file:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/evidence/items/properties/file
              line:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/data_flows/items/properties/evidence/items/properties/line
              repository_id:
                type: string
                pattern: ^repo-[a-f0-9]{16}$
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
  business_context_trace:
    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/business_context_trace
  requirements_compliance:
    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/requirements_compliance
  requirements_provenance:
    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/requirements_provenance
  abuse_case_analysis:
    description: Canonical deterministic result of abuse-case matching and step verification. Rendering fields and icons are
      excluded.
    type: object
    additionalProperties: false
    required:
    - status
    - reason
    - cases
    - catalog_evaluated
    properties:
      status:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/status
      reason:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/reason
      cases:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - title
          - source
          - actor
          - goal
          - prerequisite
          - combined_risk
          - chain_verdict
          - verification_complete
          - unverified_steps
          - matched_finding_ids
          - blocking_mitigation_ids
          - steps
          properties:
            id:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/id
            title:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/title
            source:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/source
            actor:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/actor
            goal:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/goal
            prerequisite:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/prerequisite
            combined_risk:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/combined_risk
            chain_verdict:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/chain_verdict
            verification_complete:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/verification_complete
            unverified_steps:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/unverified_steps
            matched_finding_ids:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/matched_finding_ids
            blocking_mitigation_ids:
              $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/blocking_mitigation_ids
            steps:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - step
                - outcome
                - verdict
                - finding_id
                - evidence
                - controls_found
                - unverified
                properties:
                  step:
                    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/steps/items/properties/step
                  outcome:
                    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/steps/items/properties/outcome
                  verdict:
                    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/steps/items/properties/verdict
                  finding_id:
                    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/steps/items/properties/finding_id
                  evidence:
                    oneOf:
                    - $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/steps/items/properties/evidence/oneOf/0
                    - type: object
                      additionalProperties: false
                      required:
                      - file
                      - line
                      - repository_id
                      - sha256
                      properties:
                        file:
                          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/steps/items/properties/evidence/oneOf/1/properties/file
                        line:
                          type: integer
                          minimum: 1
                        repository_id:
                          type: string
                          pattern: ^repo-[a-f0-9]{16}$
                        sha256:
                          type: string
                          pattern: ^[a-f0-9]{64}$
                  controls_found:
                    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/steps/items/properties/controls_found
                  unverified:
                    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/cases/items/properties/steps/items/properties/unverified
      catalog_evaluated:
        $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/abuse_case_analysis/properties/catalog_evaluated
  tier_root_causes:
    $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/tier_root_causes
  assets:
    type: array
    items:
      type: object
      additionalProperties: true
      required:
      - name
      - classification
      properties:
        name:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/assets/items/properties/name
        component_refs:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required:
            - component_id
            - relation
            - evidence
            properties:
              component_id:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/assets/items/properties/component_refs/items/properties/component_id
              relation:
                $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/assets/items/properties/component_refs/items/properties/relation
              evidence:
                type: array
                minItems: 1
                maxItems: 8
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - file
                  - line
                  - repository_id
                  - sha256
                  properties:
                    file:
                      $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/assets/items/properties/component_refs/items/properties/evidence/items/properties/file
                    line:
                      $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/assets/items/properties/component_refs/items/properties/evidence/items/properties/line
                    repository_id:
                      type: string
                      pattern: ^repo-[a-f0-9]{16}$
                    sha256:
                      type: string
                      pattern: ^[a-f0-9]{64}$
        classification:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/assets/items/properties/classification
        description:
          $ref: https://appsec-advisor/schemas/threat-model.output.schema.yaml#/properties/assets/items/properties/description
  attack_surface:
