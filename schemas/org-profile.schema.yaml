$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://appsec-advisor/schemas/org-profile.schema.yaml"
title: AppSec Advisor Org Profile
description: |
  Versioned org profile contract. Org profiles let a company package
  defaults, presets, requirements source, optional markdown LLM context,
  and skill toggles together with the plugin without forking core files.
  Profiles are validated and resolved before Stage 1 of any scan — they
  never inject agent instructions and never replace renderer / QA /
  schema pipelines.

type: object
additionalProperties: false
required:
  - api_version
  - organization
  - compatibility
  - default_preset
  - presets

properties:
  api_version:
    type: string
    enum:
      - appsec-advisor.org-profile/v1
      - appsec-advisor.org-profile/v2

  organization:
    type: object
    additionalProperties: false
    required: [id, name, profile_version]
    properties:
      id:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{1,62}$"
      name:
        type: string
        minLength: 1
        maxLength: 120
      profile_version:
        type: string
        minLength: 1
        maxLength: 40
      owner:
        type: string
        maxLength: 120

  compatibility:
    type: object
    additionalProperties: false
    required: [core]
    properties:
      core:
        type: string
        minLength: 1
        maxLength: 80

  policy:
    type: object
    additionalProperties: false
    description: |
      Org-wide run policy. Applies across every preset.
    properties:
      disable_opus:
        type: boolean
        description: |
          When true, every Opus model selection in any preset or run is
          downgraded to Sonnet, regardless of CLI flags (cost/compliance
          ceiling). OR-combined with the CLI flag --no-opus and the env
          var APPSEC_DISABLE_OPUS — any source can enable it, none can
          disable it for a given run.
      url_allowlist:
        type: array
        maxItems: 64
        items:
          type: string
          minLength: 1
          maxLength: 253
        description: |
          Hostnames the tool may fetch from (e.g. remote requirements
          catalogs, related-repo threat models). When set, every remote
          fetch is restricted to these hosts (exact or a dotted subdomain);
          any other host is rejected on top of the always-on SSRF guard
          (loopback / RFC1918 / cloud-metadata are blocked regardless).

  branding:
    type: object
    additionalProperties: false
    description: |
      Org-wide cover-page branding for the produced report (PDF/HTML).
      Profile-level (not preset-scoped): the same contact and logo apply
      across every preset. A local `--report-title` / `--contact-name` /
      `--contact-email` / `--logo` CLI flag overrides the matching field
      here for a single run. All fields are optional; omitted fields fall
      back to the core-default cover layout.
    properties:
      report_title:
        type: string
        minLength: 1
        maxLength: 120
        description: |
          Cover title label. The project name is still appended, so
          "Security Assessment" renders as "Security Assessment — <Project>".
      contact_name:
        type: string
        minLength: 1
        maxLength: 120
        description: Contact person shown in the cover metadata table.
      contact_email:
        type: string
        minLength: 1
        maxLength: 254
        description: Contact e-mail shown in the cover metadata table.
      logo:
        type: string
        minLength: 1
        maxLength: 2048
        description: |
          Cover logo: a local file path (relative to the profile dir or
          absolute) or an http(s) URL. Staged into the output dir before
          rendering; a fetch/copy failure degrades gracefully to no logo.

  banner:
    type: object
    additionalProperties: false
    description: |
      Session-start status banner. `package_internal_plugin.py` resolves these
      fields into the packaged `config.json`, because the banner runs as a
      SessionStart hook and stays free of a YAML dependency. A developer's
      `APPSEC_BANNER` environment variable overrides all of them, in both
      directions.
    properties:
      enabled:
        type: boolean
        description: |
          Set false to ship a build whose sessions open silently. Removing the
          hook from `plugin_surface.hooks` has the same effect and also drops
          the code.
      headline:
        type: string
        minLength: 1
        maxLength: 120
        description: |
          Prepended to the status line, e.g. "ACME AppSec Advisor". What
          follows — the model, its findings, its age — is always computed from
          the repository and cannot be overridden.
      url:
        type: string
        minLength: 1
        maxLength: 2048
        description: |
          The URL the `help` skill prints under "More information". Point it at
          the internal repository or runbook; omit it to keep the upstream URL,
          or pass `--info-url ""` when packaging to drop the line entirely. The
          session banner itself does not print it.

  skills:
    type: object
    additionalProperties: false
    description: |
      Skills this organization adds to the packaged plugin, alongside the
      upstream ones. Claude Code discovers skills by convention — every
      `skills/<name>/SKILL.md` under the plugin root — so packaging copies each
      matched directory into the build.

      Two things are refused rather than resolved quietly. A name that collides
      with an upstream skill aborts the build, because replacing, say,
      `create-threat-model` would change what its command does without anyone
      deciding to. And frontmatter that would not pass for an upstream skill
      aborts too: `name` must match the directory, `description` must be
      non-empty and at most 1024 characters, and no other keys are allowed.

      Added skills take part in everything upstream ones do — the package
      policy can exclude them, `skill_toggles` can disable them, and the
      namespace-leak check applies, so an org skill must use its own command
      namespace. They are listed under `skills.org_added` in
      `package-surface.json` so the artifact surface stays auditable.
    properties:
      add:
        type: string
        minLength: 1
        maxLength: 240
        default: "skills/*/SKILL.md"
        description: |
          Glob for the skills to add, relative to the profile directory, matching
          each SKILL.md. Must stay inside the profile directory.

  baseline:
    type: object
    additionalProperties: false
    description: |
      The secure-coding baseline this organization installs into Claude Code's
      instruction files — the rules the assistant loads before it writes code.
      Declaring it here replaces the plugin's default baseline everywhere: the
      session-start banner, `/appsec-advisor:verify-baseline`, and what
      `/appsec-advisor:install-baseline` installs.

      `package_internal_plugin.py` resolves this block into the packaged
      `config.json`, because the banner runs as a SessionStart hook and stays
      free of a YAML dependency.

      `id` is the whole contract. The baseline file must declare it as a line
      reading `baseline-id: <id>`, and that marker is what every check looks
      for; a document that does not carry it is refused rather than installed,
      which is what stops a login page or a 404 body from being written in as
      security rules. The convention is `<name>-<version>[+<derivative>]`
      (`acme-sec-1.0`, or `aisec-0.1+acme` for an adaptation of the published
      baseline) — see docs/org-profiles.md.
    properties:
      enabled:
        type: boolean
        description: |
          Set false to ship a build that neither checks for nor installs a
          baseline. The banner drops its baseline line and both skills report
          that none is configured. Removing the two skills through
          `skill_toggles` also drops the commands.
      enforce:
        type: boolean
        description: |
          Set true to make a missing or foreign baseline a non-zero exit from
          `/appsec-advisor:verify-baseline`, so a CI step gates on it. Default
          false: the check reports what is loaded and nothing fails, because
          which rules a machine loads is the reader's own configuration. A
          version of the configured baseline newer than the one this build names
          never fails either — that is the same rules, further along.
      id:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._+-]{0,79}$"
        description: |
          The id the baseline file declares, e.g. `acme-sec-1.0`. Required
          whenever this block sets a source. A derivative (`<id>+suffix`) of
          the configured id counts as installed and is reported with its
          suffix; an older version or a different baseline does not, so drift
          stays visible.
      name:
        type: string
        minLength: 1
        maxLength: 120
        description: |
          Display name used in the banner and both skills, e.g.
          "ACME Secure Coding Baseline". Omit it and they say
          "secure-coding baseline"; a build that declares its own baseline never
          inherits the plugin's product name for it.
      url:
        type: string
        minLength: 1
        maxLength: 2048
        description: |
          http(s) URL of the baseline markdown file itself — a raw-file URL, not
          a rendered page. Subject to `policy.url_allowlist` when that is set.
          Takes precedence over `git`.
      git:
        type: object
        additionalProperties: false
        required: [url, path]
        description: |
          A baseline kept in a git repository rather than served as a raw file.
          Cloned shallowly with the machine's existing git credentials; an
          unauthenticated clone fails rather than prompting.
        properties:
          url:
            type: string
            minLength: 1
            maxLength: 2048
          ref:
            type: string
            minLength: 1
            maxLength: 120
            description: "Branch or tag to clone; defaults to the repository's HEAD."
          path:
            type: string
            minLength: 1
            maxLength: 240
            description: Path of the baseline file inside the repository.
      file:
        type: string
        minLength: 1
        maxLength: 240
        description: |
          Optional fallback copy shipped inside the profile directory, used when
          `url` / `git` cannot be reached — an air-gapped machine, a proxy, an
          outage. Path is relative to the profile directory. Without it, a build
          that declares its own baseline has no offline install path, because
          the plugin's bundled copy is a different baseline and would be refused
          by the id check.
      install_filename:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}\\.md$"
        description: |
          Filename written into the repository or `~/.claude/` on install
          (default: `secure-coding-baseline.md`).

  default_preset:
    type: string
    pattern: "^[a-z0-9][a-z0-9_-]{1,62}$"

  requirements:
    type: object
    additionalProperties: false
    properties:
      source:
        type: object
        additionalProperties: false
        properties:
          requirements_yaml_url:
            type: ["string", "null"]
          human_source_url:
            type: ["string", "null"]
            format: uri
          label:
            type: string
            maxLength: 120
          cache:
            type: boolean
          fail_mode:
            enum: [fail_closed, cache_fallback, disabled_on_fail]
      create_threat_model:
        type: object
        additionalProperties: false
        properties:
          default_active:
            type: boolean
          quick_default_active:
            type: boolean
      standalone_audit:
        type: object
        additionalProperties: false
        properties:
          enabled:
            type: boolean

  llm_context:
    type: object
    additionalProperties: false
    properties:
      documents:
        type: array
        maxItems: 20
        items:
          type: object
          additionalProperties: false
          required: [id, path, purpose]
          properties:
            id:
              type: string
              pattern: "^[a-z0-9][a-z0-9_-]{1,62}$"
            path:
              type: string
              maxLength: 240
            purpose:
              enum:
                - organization_background
                - worst_case_scenarios
                - business_context
                - data_context
                - company_background
                - identity_ecosystem
                - platform_ecosystem
                - trust_zones
                - data_classification
                - security_operations
                - other
            max_bytes:
              type: integer
              minimum: 1024
              maximum: 200000
            applies_to_components:
              type: array
              minItems: 1
              maxItems: 64
              uniqueItems: true
              description: |
                Optional final component IDs that may receive facts from this
                document. Omit to let the component projector decide relevance.
              items:
                type: string
                pattern: "^[a-z0-9][a-z0-9-]{0,99}$"

  security_coach:
    type: object
    additionalProperties: false
    description: |
      Prompt-time security coaching. An org can define its own steering
      behaviour here: the always-on baseline text and its own topics. A topic
      is criteria + action — `triggers` (keywords that fire it) and the
      `guidance` / `requirements` it injects. Guidance is advisory context,
      capped by the built-in max_injected_chars; it is never model instructions.
    properties:
      enabled_by_default:
        type: boolean
      max_requirements_per_topic:
        type: integer
        minimum: 0
        maximum: 10
      baseline:
        type: string
        minLength: 1
        maxLength: 2000
        description: Always-on secure-by-default text, replacing the built-in baseline.
      inherit_default_topics:
        type: boolean
        description: Keep the built-in topics (default true); false uses only your topics.
      topics:
        type: object
        maxProperties: 64
        propertyNames:
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
        additionalProperties:
          type: object
          additionalProperties: false
          required: [triggers]
          properties:
            triggers:
              type: array
              minItems: 1
              maxItems: 64
              items:
                type: string
                minLength: 1
                maxLength: 80
            guidance:
              type: string
              maxLength: 1000
            requirements:
              type: array
              maxItems: 20
              items:
                type: string
                maxLength: 80

  skill_toggles:
    type: object
    additionalProperties:
      oneOf:
        - type: boolean
        - type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled:
              type: boolean
            reason:
              type: string
              maxLength: 240

  actors:
    type: object
    additionalProperties: false
    description: |
      Actor-layer configuration for this org profile (api_version v2+).
      v1 profiles are treated as if actors: {inherit_defaults: true, disable: [], add: []}.
    properties:
      inherit_defaults:
        type: boolean
        default: true
        description: >
          Whether to activate the plugin's 9 default actor classes (ACT-D-*).
          Set false only for regulated environments needing a fully controlled
          actor stack — the tool will report coverage gaps vs. default classes.
      disable:
        type: array
        items:
          type: string
          pattern: "^ACT-(D|E|R|X)-[0-9]{1,4}$"
        description: >
          Actor IDs to deactivate. Each deactivated default actor is logged in
          run-issues.json. Enterprise-disable is terminal — repo layer cannot re-enable.
      add:
        type: string
        default: "actors/*.yaml"
        description: >
          Glob (relative to profile directory) for additional actor definition files.
          Each file contains a top-level `actors:` array of actor objects.

  presets:
    type: object
    minProperties: 1
    additionalProperties:
      $ref: "#/$defs/preset"

  abuse_cases:
    type: object
    additionalProperties: false
    description: |
      Controls which abuse-case scenarios (AC-NNN) are evaluated against the
      repository. The plugin standard library
      (data/abuse-cases/default-library.yaml) is activated unless
      inherit_defaults is false; org-specific cases are loaded from the glob in
      `add` (relative to the profile directory) and validated against
      schemas/abuse-cases.schema.yaml.
    properties:
      inherit_defaults:
        type: boolean
        default: true
      disable:
        type: array
        items:
          type: string
          pattern: "^(AC-T|AC|ORG-AC)-[0-9]{3,}$"
      add:
        type: string
        default: "abuse-cases/*.yaml"

  mcp:
    type: object
    additionalProperties: false
    required: [servers]
    description: |
      MCP servers bundled into the packaged plugin's .mcp.json, letting an org
      wire in its own services (e.g. internal SAST/SCA endpoints). Which declared
      servers are actually emitted can be narrowed by the package-policy allowlist
      (plugin_surface.mcp_servers). Secrets — tokens, internal URLs — must be
      referenced via ${ENV_VAR} and are expanded by Claude Code at load time;
      a credential embedded in a server url (user:pass@host) is rejected at
      validation time. MCP tool *output* is untrusted reference data: it can
      inform findings but never changes severity rules, permissions, schemas,
      or tool behavior.
    properties:
      servers:
        type: object
        minProperties: 1
        maxProperties: 32
        propertyNames:
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
        additionalProperties:
          $ref: "#/$defs/mcp_server"

  hooks:
    type: object
    maxProperties: 32
    description: |
      Claude Code hooks bundled into the packaged plugin's hooks/hooks.json, so
      an org can ship its own event handlers (e.g. a PreToolUse Bash guard)
      inside one central plugin. Each hook script lives under the profile
      directory and is referenced with ${CLAUDE_PLUGIN_ROOT}/org-profile/...;
      the packager records every org hook in package-surface.json (org-owned,
      distinct from the upstream hooks) so the artifact surface stays auditable,
      and package-policy (plugin_surface.hooks) can exclude one by id. Org hooks
      run at Claude Code's event layer — they never reach the analysis pipeline;
      findings, severity, and schemas stay core-owned.
    propertyNames:
      pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
    additionalProperties:
      $ref: "#/$defs/org_hook"

$defs:
  org_hook:
    type: object
    additionalProperties: false
    required: [event, command]
    description: |
      A single org-declared hook. `command` must reference an executable under
      the profile directory via ${CLAUDE_PLUGIN_ROOT}/org-profile/... `matcher`
      is only meaningful for PreToolUse / PostToolUse (a tool-name pattern).
    properties:
      event:
        enum:
          - UserPromptSubmit
          - PreToolUse
          - PostToolUse
          - Stop
          - SubagentStop
          - Notification
          - SessionStart
          - SessionEnd
          - PreCompact
      command:
        type: string
        minLength: 1
        maxLength: 2048
      matcher:
        type: string
        minLength: 1
        maxLength: 256

  mcp_server:
    type: object
    additionalProperties: false
    minProperties: 1
    description: |
      A single MCP server entry, mirroring the Claude Code .mcp.json server
      contract. Provide `url` (http/sse transport) or `command` (stdio). Use
      ${ENV_VAR} / ${CLAUDE_PLUGIN_ROOT} for secrets and bundled paths.
    properties:
      type:
        enum: [stdio, http, sse]
      command:
        type: string
        minLength: 1
        maxLength: 2048
      args:
        type: array
        maxItems: 64
        items:
          type: string
          maxLength: 2048
      env:
        type: object
        additionalProperties:
          type: string
          maxLength: 4096
      url:
        type: string
        minLength: 1
        maxLength: 2048
      headers:
        type: object
        additionalProperties:
          type: string
          maxLength: 4096

  preset:
    type: object
    additionalProperties: false
    required: [base_mode]
    properties:
      base_mode:
        enum: [quick, standard, thorough]
      target:
        $ref: "#/$defs/target"
      outputs:
        $ref: "#/$defs/outputs"
      scan:
        $ref: "#/$defs/scan"
      requirements:
        $ref: "#/$defs/preset_requirements"
      context:
        $ref: "#/$defs/preset_context"
      quality:
        $ref: "#/$defs/quality"
      verification:
        $ref: "#/$defs/verification"
      guardrails:
        $ref: "#/$defs/guardrails"

  target:
    type: object
    additionalProperties: false
    properties:
      repo:
        enum: [current, cli_required, profile_default]
      repo_path:
        type: ["string", "null"]
        maxLength: 240
      output_dir:
        type: ["string", "null"]
        maxLength: 240

  outputs:
    type: object
    additionalProperties: false
    properties:
      yaml:
        type: boolean
      sarif:
        type: boolean
      pdf:
        type: boolean
      pentest_tasks:
        type: boolean
      pentest_format:
        enum: [generic, strix]
      pentest_target:
        type: ["string", "null"]
        format: uri

  scan:
    type: object
    additionalProperties: false
    properties:
      incremental:
        enum: ["auto", true, false]
      scan_manifest:
        type: boolean

  preset_requirements:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
      gate:
        type: object
        additionalProperties: false
        description: |
          Default gate policy for both requirements skills. CLI flags
          (--gate / --gate-on / --priority-floor) override these.
        properties:
          mode:
            enum: [advisory, enforce]   # advisory exits 0; enforce = like --gate
          gate_on:
            enum: [fail, partial]
          priority_floor:
            enum: [MUST, SHOULD, MAY]

  preset_context:
    type: object
    additionalProperties: false
    properties:
      document_ids:
        type: array
        maxItems: 20
        items:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{1,62}$"

  quality:
    type: object
    additionalProperties: false
    properties:
      qa_review:
        enum: [auto, enabled, disabled]
      architecture_enrichment:
        enum: [auto, enabled, disabled]
      architect_review:
        enum: [auto, enabled, disabled]
      attack_walkthroughs:
        enum: [auto, enabled, disabled]

  verification:
    type: object
    additionalProperties: false
    properties:
      evidence_recheck:
        enum: [sampled, full]
      generate_pentest_verification_tasks:
        type: boolean

  guardrails:
    type: object
    additionalProperties: false
    properties:
      max_wall_time:
        type: ["string", "null"]
        pattern: "^[0-9]+(s|m|h)?$"
      max_cost_usd:
        type: ["number", "null"]
        minimum: 0
      max_resumes:
        type: integer
        minimum: 0
        maximum: 10
      tracing:
        type: boolean
      verbose_report:
        type: boolean
      fail_on:
        enum: [critical, high, medium]
        description: |
          Headless/CI release gate: exit non-zero when the run adds threats at
          or above this severity. The --fail-on CLI flag overrides it.
