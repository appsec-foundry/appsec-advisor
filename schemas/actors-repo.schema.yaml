$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://appsec-advisor/schemas/actors-repo.schema.yaml"
title: Repository Actor Configuration
description: "Contract for <repo>/.appsec/actors.yaml."

type: object
additionalProperties: false
properties:
  actors:
    type: array
    items:
      type: object
      required: [id]
      properties:
        id:
          type: string
          pattern: "^ACT-(D|E|R|X)-[0-9]{1,4}$"
      additionalProperties: true
    description: |
      Layer entries may be partial overrides of an existing actor. The resolver
      validates the fully merged records against actors.schema.yaml before
      writing .actors-resolved.json.
  disable:
    type: array
    items:
      oneOf:
        - type: string
          pattern: "^ACT-(D|E|R|X)-[0-9]{1,4}$"
        - type: object
          additionalProperties: false
          required: [id]
          properties:
            id:
              type: string
              pattern: "^ACT-(D|E|R|X)-[0-9]{1,4}$"
            reason:
              type: [string, "null"]
              maxLength: 400
  enable:
    type: array
    description: "Opt-in actor IDs (activation_conditions.opt_in) to assess for this repository."
    items:
      type: string
      pattern: "^ACT-(D|E|R|X)-[0-9]{1,4}$"
  discovery:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
      max_proposed:
        type: integer
        minimum: 0
        maximum: 5
        default: 5
  inherit_org:
    type: boolean
    default: true
  legitimate_roles:
    type: array
    maxItems: 16
    description: |
      Legitimate roles the repository owner declares, typically because their
      access control lives outside this repository (ingress SSO, VPN,
      authenticating proxy). A declared role replaces the modelled role with the
      same id, or is added, and its access class is never withdrawn.
    items:
      type: object
      additionalProperties: false
      required: [id, name, access, description]
      properties:
        id:
          type: string
          pattern: "^ext-[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 80
        access:
          type: string
          enum: [internet-anon, internet-user, internet-priv-user]
        description:
          type: string
          minLength: 1
          maxLength: 240
        authentication:
          type: string
          minLength: 1
          maxLength: 240
          description: "Where and how the role signs in, e.g. 'SSO via oauth2-proxy at the ingress'."
      if:
        properties:
          access:
            enum: [internet-user, internet-priv-user]
      then:
        required: [authentication]
