# Example custom question package for the on-demand threat analysis.
# Select it for one analysis with:
#   appsec-analyst-cli review ... --package /abs/path/payments-package.yaml
# In CI, pin it from trusted configuration outside the checkout:
#   --ci --trusted-package /trusted/payments-package.yaml#sha256=<digest>
# Questions guide investigation only. They cannot carry commands, tools,
# write targets, prompt overrides, or permissions; the schema rejects them.
schema_version: 1
kind: questions
id: example/payments
version: 1.1.0
title: Payment flow questions
provenance:
  source: Example organization AppSec team
  revision: "2026-10"
questions:
  - id: refund-bound
    topic: business_integrity
    applies_when: [business_operation]
    asks: Where reimbursement is limited to the captured amount, can repeated or concurrent refunds, chargebacks, or credits exceed that limit for the same order?
    purpose: Unbounded refunds move money out without a conventional vulnerability.
    evidence: [captured amount and applicable refund limit, cumulative refund calculation, transaction and idempotency controls]
    requirement_refs: [PAY-REFUND-1]
    negative_tests: [Where reimbursement is limited to the captured amount, repeated or concurrent refunds exceeding the remaining allowance are refused.]
  - id: price-source
    topic: business_integrity
    applies_when: [business_operation, untrusted_input]
    asks: Where the server determines the payable amount, can client-supplied price, discount, or currency values change that amount without an authorized pricing decision?
    purpose: Client-supplied prices let a buyer set their own price.
    evidence: [authoritative pricing expectation, checkout amount calculation, pricing service or signed quote validation]
    requirement_refs: [PAY-PRICE-1]
    negative_tests: [A manipulated price in the request does not change the charged amount.]
  - id: approval-separation
    topic: authorization
    applies_when: [business_operation, changed_permission]
    asks: Where policy requires different initiator and approver identities, can a payment initiator approve the same payment?
    purpose: Self-approval lets one actor bypass required independent approval and authorize an improper payout.
    evidence: [applicable separation policy and process scope, initiator and approver identity sources, rejecting approval controls]
    negative_tests: [An initiator approving the same payment is refused where policy requires separation.]
  - id: approved-recipient-binding
    topic: business_integrity
    applies_when: [business_operation, changed_permission]
    asks: Where approval is bound to a payment recipient, can a later recipient change be executed without renewed approval?
    purpose: Reusing approval for another recipient lets an actor redirect an authorized payout.
    evidence: [applicable approval binding and process scope, recipient update path, approval invalidation and execution checks]
    negative_tests: [A changed recipient cannot receive the payment under the previous recipient's approval.]
