components:
- id: vulnerable-app-java
  name: VulnerableApp Java Backend
  description: Spring Boot 2.7.18 / Java 17 application that hosts all deliberate vulnerability endpoints (SQL injection,
    XSS, SSRF, command injection, path traversal, XXE, LDAP injection, cache poisoning, file upload, open redirect, password
    reset, cryptographic failures). Exposes a REST API consumed by the frontend and scanner benchmark pipeline. Embeds an
    H2 in-memory database with two datasource connections (admin and application user).
  paths:
  - src/main/java/org/sasanlabs/**
  - src/main/resources/application*.properties
  - src/main/resources/attackvectors/**
  - src/main/resources/scanner/**
  - src/main/resources/log4j2.xml
  - src/main/resources/i18n/**
  - build.gradle
  tier: application
  complexity: complex
  framework: spring-boot
  deployment_zones:
  - internal-network
  handles_sensitive_data: true
  threat_ids:
  - T-001
  - T-004
  - T-008
  - T-016
  - T-017
  - T-018
  - T-021
  - T-022
  - T-034
  - T-035
  - T-044
  - T-045
  - T-061
- id: vulnerable-app-auth
  name: VulnerableApp Auth & Session Subsystem
  description: Authentication and session management subsystem co-located inside the Spring Boot process. Implements deliberately
    vulnerable login (SQL-injectable query in AuthLoginService), JWT signing/verification with a hardcoded PKCS12 keystore
    password (JWTAlgorithmKMS.java:41), IDOR-exposed login details (IDORLoginController), and session token handling via SessionManagementVulnerability.
    Shares the H2 datasource with the main backend.
  paths:
  - src/main/java/org/sasanlabs/service/vulnerability/authentication/**
  - src/main/java/org/sasanlabs/service/vulnerability/jwt/**
  - src/main/java/org/sasanlabs/service/vulnerability/sessionManagement/**
  - src/main/java/org/sasanlabs/service/vulnerability/idor/**
  - src/main/java/org/sasanlabs/configuration/VulnerableAppConfiguration.java
  - src/main/java/org/sasanlabs/configuration/DatabaseSeeder.java
  - src/main/resources/sasanlabs.p12
  tier: application
  complexity: moderate
  framework: spring-boot
  deployment_zones:
  - internal-network
  handles_sensitive_data: true
  threat_ids:
  - T-006
  - T-007
  - T-011
  - T-014
  - T-015
  - T-031
  - T-032
  - T-033
  - T-038
  - T-040
  - T-054
  - T-058
  - T-062
- id: vulnerable-app-frontend
  name: VulnerableApp Static Frontend
  description: Browser-executed JavaScript and HTML templates served as static resources by the Spring Boot backend. Each
    template exercises a specific vulnerability class (XSS, DOM injection, clickjacking, cache poisoning, etc.) via deliberate
    unsafe patterns such as innerHTML assignment without sanitization. No build framework; raw JavaScript/HTML files committed
    to the repository.
  paths:
  - src/main/resources/static/**
  - src/main/resources/sampleVulnerability/**
  tier: client
  complexity: moderate
  framework: null
  deployment_zones:
  - internet
  handles_sensitive_data: false
  threat_ids:
  - T-005
  - T-020
  - T-023
  - T-042
  - T-043
  - T-059
  - T-060
  - T-063
  - T-064
- id: vulnerable-app-jsp
  name: VulnerableApp JSP Variant
  description: Alternative JSP/Java Servlet deployment variant distributed as a pre-built Docker image (sasanlabs/owasp-vulnerableapp-jsp).
    No source files reside in this repository. Reachable via the Nginx facade proxy on the internal app_net network.
  paths:
  - docker-compose.yml
  tier: application
  complexity: simple
  framework: jsp
  deployment_zones:
  - internal-network
  handles_sensitive_data: false
  threat_ids: []
- id: vulnerable-app-php
  name: VulnerableApp PHP Variant
  description: Alternative PHP deployment variant distributed as a pre-built Docker image (sasanlabs/owasp-vulnerableapp-php).
    No source files reside in this repository. Reachable via the Nginx facade proxy on the internal app_net network.
  paths:
  - docker-compose.yml
  tier: application
  complexity: simple
  framework: null
  deployment_zones:
  - internal-network
  handles_sensitive_data: false
  threat_ids: []
- id: facade-service
  name: VulnerableApp Facade (Nginx Proxy)
  description: Nginx reverse proxy distributed as a pre-built Docker image (sasanlabs/owasp-vulnerableapp-facade). Acts as
    the single internet-facing entry point on port 80 and routes requests to VulnerableApp-base, VulnerableApp-jsp, VulnerableApp-php,
    llmforge, and mailpit based on URL path. Configured via environment variables and mounted nginx templates.
  paths:
  - docker-compose.yml
  tier: application
  complexity: simple
  framework: nginx
  deployment_zones:
  - internet
  - dmz
  handles_sensitive_data: false
  threat_ids:
  - T-013
  - T-027
  - T-028
  - T-036
  - T-046
  - T-047
  - T-051
- id: llmforge-service
  name: LLMForge LLM API Service
  description: Python-based LLM API bridge (sasanlabs/llmforge) that mediates between the facade and the Ollama inference
    engine. Exposes an HTTP API on port 8000 and forwards prompts to Ollama at http://ollama:11434. Route prefix /llmforge
    is passed from the facade. Constitutes the primary LLM attack surface for the stack.
  paths:
  - docker-compose.yml
  tier: application
  complexity: moderate
  framework: null
  deployment_zones:
  - internal-network
  handles_sensitive_data: false
  threat_ids:
  - T-002
  - T-003
  - T-029
  - T-037
  - T-048
  - T-052
- id: ollama-service
  name: Ollama LLM Inference Engine
  description: 'Local Ollama model server (ollama/ollama) that stores and serves language model weights (default: phi3:mini
    plus nomic-embed-text). Port 11434 is published directly to the host, making the inference API reachable beyond the internal
    Docker network. Initialised by the ollama-model-init one-shot container on first startup.'
  paths:
  - docker-compose.yml
  tier: data
  complexity: moderate
  framework: null
  deployment_zones:
  - internet
  - internal-network
  handles_sensitive_data: false
  threat_ids:
  - T-010
  - T-030
  - T-049
- id: mailpit-service
  name: Mailpit SMTP Test Server
  description: Mailpit (axllent/mailpit:v1.30.1) captures outbound SMTP traffic from the VulnerableApp password-reset and
    email-test flows. SMTP endpoint on port 1025 is exposed internally; web UI on port 8025 is published to the host. Stores
    captured messages in a SQLite file (mailpit.db) and accepts any SMTP authentication credentials without validation.
  paths:
  - docker-compose.yml
  tier: data
  complexity: simple
  framework: null
  deployment_zones:
  - internet
  - internal-network
  handles_sensitive_data: true
  threat_ids:
  - T-009
  - T-041
  - T-053
- id: ci-cd-pipeline
  name: CI/CD Pipeline
  description: Continuous-integration / deployment workflows (.github/workflows/create-release.yml, .github/workflows/docker.yml,
    .github/workflows/gradle.yml, .github/workflows/onboard_sasanlabs.yml, …). Build and release automation holding repository,
    registry and deploy credentials, with supply-chain reach into the produced artifact.
  paths:
  - .github/workflows/**
