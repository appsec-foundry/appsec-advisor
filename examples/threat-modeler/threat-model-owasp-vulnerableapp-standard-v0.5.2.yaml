  classification: Restricted
  description: PKCS12 keystore (sasanlabs.p12) and RSA/HMAC keys used to sign and verify JWT tokens. The keystore password
    'chan**** (8 chars)' is hardcoded at JWTAlgorithmKMS.java:41. Compromise allows forging arbitrary JWT tokens accepted by all JWTVulnerability
    endpoints.
  linked_threats: []
  evidence_flags: []
- id: A-002
  name: User Session Tokens
  classification: Confidential
  description: HTTP session identifiers and JWT bearer tokens issued to authenticated users during login flows (AuthenticationVulnerability,
    SessionManagementVulnerability). Stored in cookies or Authorization headers. Theft allows session hijacking against any
    active user account.
  linked_threats: []
  evidence_flags: []
- id: A-003
  name: H2 In-Memory User Database
  classification: Confidential
  description: Embedded H2 in-memory database (jdbc:h2:mem:testdb) holding application user credentials, session records,
    and test fixture data seeded by DatabaseSeeder. The H2 web console is exposed at /h2 (application.properties:13). Unauthorized
    console access grants full SQL read/write over all stored user data.
  linked_threats: []
  evidence_flags: []
- id: A-004
  name: Test User Credentials
  classification: Internal
  description: Test fixture accounts (usernames and passwords) seeded into the H2 database via DatabaseSeeder and referenced
    in unit tests (IDORLoginServiceTest). These credentials are deliberately weak and documented in README for scanner testing
    purposes.
  linked_threats: []
  evidence_flags:
  - inferred_classification
- id: A-005
  name: Scanner Benchmark Result Data
  classification: Internal
  description: Benchmark run records and scanner evaluation results ingested via POST /scanner/benchmark (BenchmarkController.java:38)
    and stored in the database. These records drive the platform's scanner comparison metrics and can be tampered with by
    unauthenticated callers.
  linked_threats: []
  evidence_flags: []
- id: A-006
  name: Captured Email Messages (Mailpit)
  classification: Internal
  description: Password-reset tokens and test emails captured by Mailpit in mailpit.db (docker-compose.yml:89). The Mailpit
    web UI at port 8025 is published to the host without authentication, exposing all captured messages including one-time
    password-reset links to any host-reachable client.
  linked_threats: []
  evidence_flags: []
- id: A-007
  name: LLM Model Weights and Inference Prompts
  classification: Internal
  description: Ollama model weights (phi3:mini, nomic-embed-text) stored in the ollama_data Docker volume, and user-supplied
    prompts forwarded through llmforge to Ollama. The Ollama REST API on port 11434 is published to the host, allowing unauthenticated
    model pull, push, and prompt execution from outside the Docker network.
  linked_threats: []
  evidence_flags: []
- id: A-008
  name: CI/CD Secrets and Docker Hub Credentials
  classification: Restricted
  description: Long-lived Docker Hub credentials and GitHub Actions secrets used to build and publish container images across
    four workflow files under .github/workflows/. No Trusted Publishing (OIDC) is configured and third-party Actions are not
    SHA-pinned, creating a supply-chain exfiltration path for any compromised workflow step.
  linked_threats: []
  evidence_flags: []
