  - Attacker requests /CommandInjectionVulnerability/LEVEL_1?ipaddress=127.0.0.1%3Bwhoami without authentication.
  - Application calls ProcessBuilder with sh -c 'ping -c 2 127.0.0.1;whoami', interpreting the semicolon as a command separator.
