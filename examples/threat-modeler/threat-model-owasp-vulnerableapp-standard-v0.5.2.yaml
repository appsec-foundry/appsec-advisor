- local_id: vulnerable-app-auth-015
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-770
  title: Unbounded in-memory session store with no server-side invalidation at logout
  scenario: An attacker repeatedly logs in to LEVEL_1 through LEVEL_4 endpoints, each creating a new entry in the `sessions`
    ConcurrentHashMap. On logout, `logoutWithoutInvalidation` (line 263) clears only the client-side cookie and never calls
    `sessions.remove()`. Over time, the map grows without bound, consuming heap until the JVM runs out of memory and the application
    crashes.
  evidence_summary: 'SessionManagementService.java:55: `private final Map<String, SessionUser> sessions = new ConcurrentHashMap<>()`
    — no maximum size or TTL. Line 263-282 (`logoutWithoutInvalidation`) does not remove the session entry from the map, confirmed
    by the absence of any `sessions.remove()` call in that method.'
  impact_description: An attacker (or even non-malicious heavy traffic) can exhaust JVM heap by creating unlimited sessions
    that are never evicted, causing an out-of-memory crash and service disruption.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: Level 5 and Level 6 implement server-side invalidation on logout; Levels 1-4 do not.
  mitigation_title: Add session eviction by TTL and server-side removal on logout for Levels 1-4
  remediation:
    effort: Medium
    steps:
    - Replace the raw `ConcurrentHashMap` with a bounded, TTL-based cache (e.g., Caffeine) that automatically evicts sessions
      older than the idle/absolute timeout.
    - In `logoutWithoutInvalidation`, call `sessions.remove(sessionKey(level, sessionId))` before clearing the cookie.
    - Add a test confirming that after logout the session key is absent from the in-memory store.
    code_example: null
    verification: Login to LEVEL_1, logout, then attempt to access the `/profile` endpoint with the old session ID; assert
      401 or empty session response.
    reference: CWE-770
  evidence:
  - file: src/main/java/org/sasanlabs/service/vulnerability/sessionManagement/SessionManagementService.java
    line: 55
  evidence_check: verified
  prior_finding_ref: null
