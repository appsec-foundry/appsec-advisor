  title: Host-Published Port 11434 Bypasses Facade Access Controls
  scenario: Port 11434 is published directly from the ollama container to the Docker host, making the full Ollama administrative
    REST API reachable to any process on the host or any external network client not blocked by a host firewall. An attacker
    can invoke privileged Ollama endpoints — `/api/pull` to load arbitrary external models, `/api/delete` to remove production
    models, and `/api/create` to install a backdoored Modelfile that overrides the system prompt for all subsequent llmforge
    sessions — without passing through the nginx facade or llmforge's content-filtering layer.
  attack_steps:
  - Attacker probes host port 11434 and receives a valid JSON response from `/api/tags` listing installed models, confirming
    an open unauthenticated Ollama API.
  - Attacker calls `POST /api/pull` with a maliciously fine-tuned model name hosted on a public registry, replacing the legitimate
    phi3:mini weights on the ollama_data volume.
  - Attacker calls `POST /api/delete` with the model name `phi3:mini` to remove the original model, ensuring the backdoored
    model is the only option available.
  - All subsequent llmforge inference calls resolve to the attacker-controlled model, enabling persistent data exfiltration
    and prompt manipulation for all application users.
  evidence_summary: 'docker-compose.yml line 21 (`- "11434:11434"`) publishes the Ollama REST API to the host. The Ollama
    API exposes administrative endpoints (`/api/pull`, `/api/delete`, `/api/create`) that allow arbitrary model management
    without authentication. The architecture context confirms: ''No authentication mechanism in Ollama by default; relies
    on network isolation that is defeated by host port publication''.'
  impact_description: An attacker gains the ability to replace production LLM weights with malicious models, delete operational
    models, and install backdoored system prompts — achieving persistent compromise of all llmforge-mediated AI functionality
    without any application-layer credential.
  likelihood: High
  impact: Critical
  risk: Critical
  actor_ids:
  - ACT-D-01
  - ACT-D-05
  primary_actor: ACT-D-01
  controls_in_place: Host firewall assumed (not verifiable from repository content)
  mitigation_title: Remove host port binding for Ollama and restrict API to internal Docker network
  remediation:
    effort: Low
    steps:
    - 'Remove `ports: - "11434:11434"` from the ollama service in docker-compose.yml so port 11434 is only reachable on the
      internal app_net bridge network.'
    - Restrict `OLLAMA_ORIGINS` to the llmforge service hostname to prevent cross-origin abuse on the internal network.
    - If operational tooling requires host access to the Ollama API, require a shared API key via an authenticating proxy
      placed in front of the internal Ollama listener.
    - Add a container network policy or iptables rule that allows only the llmforge container IP to reach port 11434.
