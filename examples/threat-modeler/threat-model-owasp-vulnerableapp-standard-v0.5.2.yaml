  linked_threats: []
threats:
- local_id: vulnerable-app-java-015
  threat_category_id: TH-06
  additional_categories:
  - TH-09
  stride: Elevation of Privilege
  cwe: CWE-862
  title: Missing Spring Security Filter on Backend Endpoints
  scenario: An attacker sends unauthenticated HTTP requests directly to the Java backend through the Nginx facade; no Spring
    Security filter chain exists on any endpoint, and the facade enforces no authentication either (tb-4 assumption unverified),
    so every endpoint including UNSAFE-profile handlers (SSRF, command injection, file upload) is reachable without credentials.
  attack_steps:
  - Attacker sends unauthenticated HTTP request to any backend endpoint via the facade, relying on the absent tb-4 auth enforcement.
  - Backend processes the request with no session check; all UNSAFE-profile endpoints including command injection and SSRF
    execute fully.
  - Attacker chains unauthenticated SSRF and command injection to exfiltrate data or achieve container compromise.
  evidence_summary: Zero hits for WebSecurityConfigurerAdapter, SecurityFilterChain, @EnableWebSecurity, or HttpSecurity across
    the entire org.sasanlabs package; combined with the architecture context stating tb-4 provides no auth enforcement, all
    endpoints are unauthenticated.
  impact_description: Every vulnerability endpoint, including the most critical SSRF and command-injection handlers, is reachable
    without any authentication from within the Docker network, multiplying the exploitability of all other findings.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Docker internal network (app_net) provides network-layer isolation; not a substitute for application-layer
    authentication
  mitigation_title: Implement Spring Security filter chain requiring authentication on all non-public backend endpoints
  remediation:
    effort: High
    steps:
    - Add a Spring Security configuration class (SecurityFilterChain bean) that requires a valid session for all endpoints
      not explicitly marked @Profile('public') as open training surfaces.
    - Ensure the facade (nginx) forwards the session header and the backend validates it, replacing the current unverified
      trust assumption.
    - Add integration tests asserting that unauthenticated requests to UNSAFE-profile endpoints return HTTP 401.
    code_example: null
    verification: curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/vulnerable/SSRFVulnerability/LEVEL_1?fileurl=http://example.com
      without a session cookie must return 401.
    reference: 'CWE-862: https://cwe.mitre.org/data/definitions/862.html'
  evidence: []
  controls_absent_evidence:
  - pattern: WebSecurityConfigurerAdapter|SecurityFilterChain|@EnableWebSecurity|HttpSecurity
    search_paths:
    - src/main/java/org/sasanlabs
    hit_count: 0
    searched_at: '2026-08-18T00:07:00Z'
  evidence_check: ambiguous
  prior_finding_ref: null
  architectural_violation: true
