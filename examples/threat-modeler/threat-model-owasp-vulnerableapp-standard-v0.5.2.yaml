  title: OS Command Injection via Shell Process (CommandInjection.java:48)
  scenario: An attacker sends ?ipaddress=127.0.0.1%3Bwhoami to /CommandInjectionVulnerability/LEVEL_1; the application concatenates
    ipAddress into the shell command 'ping -c 2 127.0.0.1;whoami' passed to sh -c, executing the injected command and returning
