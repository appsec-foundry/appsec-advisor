  title: AES in ECB Mode Leaks Ciphertext Patterns (EncryptionUtils.java:88)
  scenario: Secrets encrypted with AES/ECB produce identical ciphertext blocks for identical plaintext blocks; an attacker
    who obtains ciphertext from two different encryption calls on related data can confirm whether blocks are identical without
    the key, breaking confidentiality of structured or repeated data.
