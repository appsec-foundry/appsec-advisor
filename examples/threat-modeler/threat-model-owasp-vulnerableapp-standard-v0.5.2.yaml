security_controls:
- domain: Identity and Authentication Controls
  control: Login Credential Validation
  effectiveness: Unsafe
  kind: mechanism
  rule_id: null
  assessment: 'AuthLoginService builds the credential-check SQL query by string concatenation. An attacker supplies a crafted
    username (e.g. '' OR ''1''=''1) to bypass the check entirely without knowing any password. The authentication mechanism
    exists but is defeated. Evidence: AuthenticationVulnerability.java (trust-boundary tb-3 enforcement point).'
  implementation: src/main/java/org/sasanlabs/service/vulnerability/authentication/AuthenticationVulnerability.java
- domain: Identity and Authentication Controls
  control: Route Authentication Gate
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-AUTHN-001
  assessment: State-changing endpoints POST /scanner/benchmark (BenchmarkController.java:38), POST /clearCache (CachePoisoningVulnerability.java:393),
    and POST /test (EmailTestController.java:28) have unknown authentication status. No Spring Security filter chain enforcing
    authentication across vulnerability endpoints is evidenced; the only verified auth path is the SQL-injectable login.
  implementation: src/main/java/org/sasanlabs/benchmark/controller/BenchmarkController.java, src/main/java/org/sasanlabs/service/vulnerability/cachePoisoning/CachePoisoningVulnerability.java,
    src/main/java/org/sasanlabs/controller/EmailTestController.java
- domain: Identity and Authentication Controls
  control: JWT Signing Algorithm Whitelist
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: JWTUtils.java:33 declares NONE_ALGORITHM = "none" as an explicit constant. JWTValidator.java:131 and :196 call
    signedJWT.verify(verifier) without first rejecting the none algorithm. An attacker sets alg=none in the JWT header and
    strips the signature to forge any token payload.
  implementation: src/main/java/org/sasanlabs/service/vulnerability/jwt/bean/JWTUtils.java, src/main/java/org/sasanlabs/service/vulnerability/jwt/impl/JWTValidator.java
- domain: Session Management
  control: Session Cookie Hardening
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-COOKIE-001
  assessment: No positive evidence of Secure, HttpOnly, or SameSite cookie flags in the Spring Boot configuration or application
    properties. Architecture coverage finds preconditions present but no confirming signal. Risk is compounded by the absence
    of TLS at the facade layer, making Secure flags irrelevant even if configured.
  implementation: null
- domain: Input Handling
  control: Parameterized Database Access
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-SQLI-001
  assessment: ErrorBasedSQLInjectionVulnerability.java:239 contains an inline comment noting that a parameterized query is
    intentionally not used. Multiple vulnerability endpoint classes build SQL statements by string concatenation. The JDBC
    layer supports parameterized queries but the deliberate vulnerable paths bypass them.
  implementation: src/main/java/org/sasanlabs/service/vulnerability/sqlInjection/ErrorBasedSQLInjectionVulnerability.java
- domain: Input Handling
  control: Schema and Allowlist Input Validation
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-INPUT-001
  assessment: 'The benchmark pipeline applies bounded validation: ScanType.java:19 uses enum valueOf and BenchmarkResultWriter.java:71
    normalizes tool names. Vulnerability endpoints pass user input directly to injection sinks with no validation. Validation
    coverage is limited to the non-security-sensitive benchmark path.'
  implementation: src/main/java/org/sasanlabs/benchmark/model/ScanType.java, src/main/java/org/sasanlabs/benchmark/service/BenchmarkResultWriter.java
- domain: Output Encoding
  control: HTML Output Encoding and XSS Prevention
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-XSS-001
  assessment: Frontend templates assign server responses directly to element.innerHTML without sanitization, confirmed at
    bin/main/static/templates/LDAPInjectionVulnerability/LEVEL_1/LDAP.js:3. The application deliberately exercises DOM-based
    XSS sinks. No Content Security Policy header is configured.
  implementation: src/main/resources/static
- domain: Authorization Controls
  control: Object-Level Ownership Check (IDOR/BOLA)
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: IDORLoginService.java:67 verifies that a JWT is cryptographically valid but does not verify the authenticated
    caller owns the object being addressed. An attacker with any valid JWT can retrieve any other user's login details by
    supplying an arbitrary object identifier.
  implementation: src/main/java/org/sasanlabs/service/vulnerability/idor/IDORLoginService.java
- domain: Authorization Controls
  control: Management Endpoint Protection
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-MGMT-001
  assessment: POST /test (EmailTestController.java:28) is a management-class endpoint with authentication status unknown.
    No Spring Security configuration scoping this route to authenticated or administrative principals is evidenced in the
    repository.
  implementation: src/main/java/org/sasanlabs/controller/EmailTestController.java
- domain: Transport Security
  control: Transport Encryption (TLS)
  effectiveness: Unsafe
  kind: surface
  rule_id: ARCH-TLS-001
  assessment: 'The facade is bound to HTTP port 80 with no TLS termination in docker-compose.yml. Internal LLM traffic uses
    plain HTTP (docker-compose.yml:41: OLLAMA_HOST=http://ollama:11434; docker-compose.yml:67: OLLAMA_URL=http://ollama:11434).
    PasswordResetService.java:230 forces an http:// prefix on reset links, embedding a cleartext URL in email tokens. No HTTPS
    redirect or Strict-Transport-Security header is configured.'
  implementation: docker-compose.yml
- domain: Cryptography and Secrets
  control: Managed Secret Storage
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-SECRET-001
  assessment: sasanlabs.p12 (PKCS12 keystore) is committed to the repository and included in the auth component path globs.
    JWTAlgorithmKMS.java:41 hardcodes the keystore password as a source literal. JWTUtils.java:65 carries a BEGIN PRIVATE
    KEY PEM header marker, confirming private key material is present in source. Any repository clone exposes the full JWT
    signing key.
  implementation: src/main/resources/sasanlabs.p12, src/main/java/org/sasanlabs/service/vulnerability/jwt/bean/JWTUtils.java
- domain: Supply Chain
  control: Third-Party CI/CD Action Pinning
  effectiveness: Weak
  kind: lifecycle
  rule_id: ARCH-SUPPLY-001
  assessment: 'Eight GitHub Actions steps reference mutable semver tags rather than immutable commit SHAs: docker/login-action@v3,
    docker/setup-qemu-action@v3, docker/setup-buildx-action@v3, gittools/actions/gitversion/setup@v0.9.7, gittools/actions/gitversion/execute@v0.9.7,
    tvdias/github-tagger@v0.0.1, docker/build-push-action@v6 (docker.yml), and docker/login-action@v1 (create-release.yml).
    A tag mutation by any upstream maintainer executes arbitrary code in the build pipeline with registry push credentials.'
  implementation: .github/workflows/docker.yml, .github/workflows/create-release.yml
- domain: LLM Security Controls
  control: LLM Prompt and Output Sanitization
  effectiveness: Missing
  kind: mechanism
  assessment: LLMForge forwards facade-proxied HTTP requests directly to the Ollama inference API at http://ollama:11434 with
    no evidenced prompt validation, length cap, injection guard, or output sanitization. No authentication gate at the LLMForge
    API is confirmed from available sources. The Ollama inference port 11434 is published directly to the host, allowing callers
    to bypass the facade and LLMForge entirely.
  implementation: null
- domain: Logging and Monitoring
  control: Security Event Logging
  effectiveness: Partial
  kind: mechanism
  assessment: log4j2.xml is present, establishing a logging framework. The benchmark pipeline logs tool names and result counts.
    No structured security event logging for authentication failures, authorization rejections, or injection attempts is evidenced
    in the vulnerability endpoint packages. Sensitive data logging posture for password reset tokens and credentials is unverified.
  implementation: src/main/resources/log4j2.xml
- domain: Deployment Configuration
  control: Dependency Lockfile and Frozen Install
  effectiveness: Partial
  kind: lifecycle
  assessment: build.gradle declares Gradle dependency versions. A Gradle dependency lockfile is not confirmed committed to
    the repository. CI workflows invoke standard Gradle tasks rather than lock-verified resolution. No automated dependency
    scanning workflow is present in the GitHub Actions configuration.
  implementation: build.gradle
- domain: Operations Runtime and Supply Chain Controls
  control: Automated SCA scanning
  effectiveness: Missing
  kind: lifecycle
  assessment: Automated SCA scanning not detected in the repository. Patch-management posture depends on this control being
    in place — the team is reactive rather than proactive without it.
  linked_threats: []
- domain: Operations Runtime and Supply Chain Controls
  control: Automated dependency updates
  effectiveness: Missing
  kind: lifecycle
  assessment: Automated dependency updates not detected in the repository. Patch-management posture depends on this control
    being in place — the team is reactive rather than proactive without it.
  linked_threats: []
- domain: Operations Runtime and Supply Chain Controls
  control: Lockfile hygiene
  effectiveness: Missing
  kind: lifecycle
  assessment: Lockfile hygiene not detected in the repository. Patch-management posture depends on this control being in place
