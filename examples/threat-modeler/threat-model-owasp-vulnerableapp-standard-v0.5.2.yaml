tier_root_causes:
  edge:
  - DOM sinks assign server/user data via innerHTML without sanitization
  - 'Security response headers absent: no CSP, frame-ancestors, or referrer policy'
  - Credentials and tokens exposed via URL query parameters and cookie flags
  - Client-side redirect targets taken from server response without allowlist
  - target=_blank links missing rel=noopener leak opener window reference
  server:
  - Untrusted input concatenated into SQL, shell commands, and HTML output
  - Authorization derived from client-controlled cookies not server session
  - Service and endpoint boundaries lack authentication requirements
  - 'Broken crypto: ECB mode, alg=none JWT acceptance, non-CSPRNG tokens'
  - CI/CD actions use mutable tags and overprivileged registry credentials
  data:
  - Data services published on host ports without authentication controls
  - Internal service traffic sent over cleartext channels on Docker network
  - SMTP relay accepts any sender without credential or origin verification
  - Data service endpoints emit no access logs for unauthenticated access
  - Container images use mutable tags with no digest pinning or verification
