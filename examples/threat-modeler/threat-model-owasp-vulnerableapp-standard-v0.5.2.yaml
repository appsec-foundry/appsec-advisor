  title: SQL injection authentication bypass (AuthLoginService.java:43)
  scenario: An unauthenticated attacker submits `' OR '1'='1'--` as the username to the Level 1 login endpoint. The string-concatenated
    SQL query matches all rows, returning the first user record and issuing an authenticated response without valid credentials.
  attack_steps:
  - Attacker sends username=`' OR '1'='1'--` and any password to AuthenticationVulnerability/LEVEL_1 login endpoint.
  - 'AuthLoginService.authenticateLevel1SQLi concatenates input directly: SQL becomes `WHERE level=1 AND username='''' OR
    ''1''=''1''--'' AND password=...`.'
  - JdbcTemplate executes the tautological query and returns the first auth_users row unconditionally.
  - Endpoint returns userId, username, email, and role of that user, granting session access without credential verification.
  evidence_summary: AuthLoginService.java:43-47 constructs the SQL query by direct string concatenation of the `username`
    and `password` request parameters, with no parameterized query or escaping.
  impact_description: Any attacker can authenticate as any Level-1 user, including admins, without knowing credentials. The
    SQL error path at line 57 also leaks database exception detail.
