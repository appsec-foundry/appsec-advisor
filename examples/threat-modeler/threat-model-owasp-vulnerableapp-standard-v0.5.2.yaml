    mutation.
  evidence_summary: 'docker.yml:37 uses gittools/actions/gitversion/setup@v0.9.7 and docker.yml:46 uses tvdias/github-tagger@v0.0.1
    — both pinned to mutable semver tags, not immutable commit SHAs. The controls context confirms: ''All third-party actions
    pinned to mutable semver tags rather than immutable commit SHAs''. Recon signal category 14 (unpinned-github-action) fires
    for these lines. create-release.yml:18 uses actions/checkout@v2 and create-release.yml:35 uses softprops/action-gh-release@v1
    — also mutable.'
