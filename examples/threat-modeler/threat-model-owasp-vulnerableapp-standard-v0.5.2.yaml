  evidence_summary: EncryptionUtils.java:88 calls Cipher.getInstance('AES/ECB/PKCS5Padding'); the comment on line 87 explicitly
    acknowledges this mode does not use an IV and reveals patterns (CWE-327).
  impact_description: Encrypted secrets whose plaintext shares common prefixes or block-aligned patterns leak structural information
    via ciphertext comparison; dictionary attacks on block-encrypted data become feasible.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: PBKDF2WithHmacSHA256 used for key derivation at line 76, mitigating the key-strength aspect; ECB mode
    weakness remains
  mitigation_title: Replace AES/ECB with AES/GCM authenticated encryption in EncryptionUtils
  remediation:
    effort: Low
