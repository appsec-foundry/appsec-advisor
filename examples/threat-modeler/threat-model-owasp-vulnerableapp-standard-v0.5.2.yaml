  stride: Elevation of Privilege
  cwe: CWE-862
  title: Unauthenticated web UI enables password reset token theft and account takeover
  scenario: An internet-reachable attacker accesses the Mailpit web UI at http://<docker-host>:8025 without credentials, retrieves
    a valid password reset token from a captured email for any target user, and uses that token to reset the target user's
    password, gaining full authenticated access to the Java application.
  attack_steps:
  - Attacker discovers the Mailpit web UI is host-published on port 8025 by scanning the Docker host or reading docker-compose.yml
    from a compromised dev machine.
  - Attacker opens http://<host>:8025/mailpit/ in a browser; the inbox loads with all captured emails because no authentication
    is required.
  - Attacker triggers a password-reset flow for a target user account (or waits for an organic reset) and then retrieves the
    one-time token from the newly captured email.
  - Attacker submits the stolen reset token to the Java application's password-reset endpoint and sets a new password, gaining
    full account control.
  evidence_summary: docker-compose.yml line 82 publishes port 8025 to the host with no authentication; the architecture-context
    confirms the SQLite store holds password reset tokens from the Java backend SMTP flow.
  impact_description: Full account takeover for any user whose password-reset email is captured by Mailpit; because Mailpit
    stores all captured emails, the attacker can target any account that has ever triggered a reset while the container has
    been running.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None
  mitigation_title: Require authentication on Mailpit web UI and bind port 8025 to loopback only
