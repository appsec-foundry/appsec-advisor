  - Attacker submits the unsecured token (header.payload.) to JWTVulnerability/LEVEL_6 cookie endpoint.
  - JWTValidator.customHMACNoneAlgorithmVulnerableValidator reads `alg` from the header and returns `true` at line 104-106
    without verifying any HMAC.
  - Server returns HTTP 200 and accepts the forged token as authenticated.
  evidence_summary: 'JWTValidator.java:104-106: `if (JWTUtils.NONE_ALGORITHM.contentEquals(alg.toLowerCase())) { return true;
    }` — any token claiming alg=none is unconditionally accepted without signature check.'
