  stride: Elevation of Privilege
  cwe: CWE-602
  title: Client-supplied role cookie grants admin privilege in IDOR Level 3
  scenario: An attacker logs into the IDOR LEVEL_3 endpoint and modifies the `role_level3` cookie to `ADMIN`. On the next
    request, `IDORVulnerability.level3` reads the role from the attacker-controlled cookie at line 158 and evaluates `ROLE_ADMIN.equalsIgnoreCase(role)`
    as true at line 164, granting unrestricted access to any user's profile regardless of the verified JWT subject.
  attack_steps:
  - Attacker authenticates at IDORLoginController/LEVEL_3 and receives `token_level3` (JWT) and `role_level3=user` cookies.
  - Attacker modifies `role_level3` cookie value to `ADMIN` using browser devtools or a proxy intercept.
  - Request to IDORVulnerability/LEVEL_3?id=<victim_id> is processed; line 158 assigns `cookieRole` (attacker-controlled)
    as the effective role.
  - Line 164 evaluates `ROLE_ADMIN.equalsIgnoreCase("ADMIN")` as true; `fetchUserById(id)` returns the victim's salary and
    profile without ownership check.
  evidence_summary: 'IDORVulnerability.java:158: `String role = cookieRole != null ? cookieRole : decodedUser.getRole()` —
    role from the client-supplied `role_level3` cookie overrides the JWT claim. Line 164: `if (ROLE_ADMIN.equalsIgnoreCase(role)
    || tokenUserId == id)` — access is granted when the attacker-supplied role matches `ADMIN`.'
  impact_description: Any authenticated user can escalate to full admin access by modifying a single cookie, reaching all
    other users' salary, role, and username data via the IDOR LEVEL_3 endpoint.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: JWT signature is verified; but role authorization derives from the unverified client cookie rather than
    the JWT or the database.
  mitigation_title: Derive role exclusively from verified JWT claims or server-side DB lookup in IDORVulnerability.level3
  remediation:
    effort: Low
    steps:
    - 'Replace `cookieRole != null ? cookieRole : decodedUser.getRole()` with a server-side DB role lookup (as implemented
      in LEVEL_5) or use only `decodedUser.getRole()` from the verified JWT.'
    - Remove the `role_level3` cookie from `IDORLoginController.level3Login` if it has no legitimate use.
    - 'Add a test: login as non-admin, set `role_level3=ADMIN`, request another user''s profile; assert 403.'
    code_example: null
    verification: POST login to IDORLoginController/LEVEL_3, set `role_level3=ADMIN` cookie, GET IDORVulnerability/LEVEL_3?id=<other-user>;
      assert HTTP 403.
    reference: CWE-602
  evidence:
