  title: Stored Cross-Site Scripting (routes/saveLoginIp.ts:25)
  affected_parameter: true-client-ip
  scenario: 'GET /rest/saveLoginIp records the caller''s `true-client-ip` request header verbatim into the user''s `lastLoginIp`
    column. The header is fully attacker-controlled — there is no proxy that overwrites it and no format check that the value
    resembles an IP address. Sanitization is conditional: `security.sanitizeSecure()` runs only in the `else` branch, so whenever
    the corresponding challenge flag is enabled the raw header value is written straight to the database. Any authenticated
    user can therefore store an HTML payload such as an `iframe` with a `javascript:` source in their own record. The value
    is later rendered wherever last-login IPs are displayed, notably the administrative user list served by routes/authenticatedUsers.ts,
    so the payload executes in an administrator''s browser with the administrator''s session.'
  attack_steps:
  - An attacker registers an account and logs in to obtain a session token.
  - The attacker sends `GET /rest/saveLoginIp` with the header `true-client-ip` set to an HTML payload carrying a `javascript:`
    URL.
  - The handler stores the payload unsanitized in the attacker's `lastLoginIp` column.
  - An administrator opens the user list, the payload renders in their browser, and the attacker's script runs with the administrator's
    session.
  evidence_summary: '`routes/saveLoginIp.ts:25` applies `sanitizeSecure` only inside the `else` branch of the challenge check,
    leaving the raw header value on the path taken when the flag is set.'
  impact_description: A low-privilege user injects script that executes in an administrator's authenticated browser session,
    enabling session theft or administrative actions on the admin's behalf.
  likelihood: Medium
  impact: High
  risk: High
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-02
  controls_in_place: '`security.sanitizeSecure()` is applied on one branch only; there is no validation that the header parses
    as an IP address, and no output encoding is enforced at the rendering site.'
  mitigation_title: Validate true-client-ip as an IP address before persisting it in routes/saveLoginIp.ts
  remediation:
    effort: Low
    steps:
    - Parse the header with `net.isIP()` and discard the value entirely when it does not resolve to a valid IPv4 or IPv6 address,
      falling back to `req.socket.remoteAddress`.
    - Remove the conditional at routes/saveLoginIp.ts:22-26 so no code path can persist an unsanitized header value.
    - Only honour `true-client-ip` when the request arrives from a trusted reverse-proxy address; otherwise ignore client-supplied
      forwarding headers.
    - Contextually encode `lastLoginIp` at every render site as a defence-in-depth second layer.
    code_example: "// Before — the header is stored as-is on the challenge-enabled branch\n// lastLoginIp = req.headers['true-client-ip']\n\
      \n// After — only a syntactically valid IP is ever persisted, so no markup can\n// reach the column regardless of which\
      \ branch runs\nimport net from 'node:net'\nconst headerIp = String(req.headers['true-client-ip'] ?? '')\nconst lastLoginIp\
      \ = net.isIP(headerIp)\n  ? headerIp\n  : utils.toSimpleIpAddress(req.socket.remoteAddress ?? '')"
    verification: 'Send GET /rest/saveLoginIp with `true-client-ip: <iframe src="javascript:alert(1)">`, then read the user
      record — `lastLoginIp` must contain the socket address, not the payload.'
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
