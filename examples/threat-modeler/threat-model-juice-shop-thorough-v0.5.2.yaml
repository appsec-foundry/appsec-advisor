  stride: Tampering
  cwe: CWE-602
  title: Wallet Top-Up Amount Carried in sessionStorage (wallet.component.ts:44)
  affected_parameter: walletTotal
  scenario: 'The amount credited to a user''s wallet is chosen in the browser and never re-derived server-side. `wallet.component.ts:44`
    writes the top-up amount from `balanceControl` into `sessionStorage.walletTotal` and routes to the payment screen; `payment.component.ts:131`
    reads it back as `this.totalPrice`; `payment.component.ts:218` then posts `walletService.put({ balance: this.totalPrice,
    paymentId: this.paymentId })`. The only bound on the value is the Angular validator pair `Validators.min(10)` and `Validators.max(1000)`
    declared on the form control at `wallet.component.ts:30`, which runs in the browser and never sees the request. The server
    accepts the number as given: `addWalletBalance()` at `routes/wallet.ts:22-28` checks only that the refe**** (10 chars) card belongs
    to the caller, then calls `WalletModel.increment({ balance: req.body.balance })` with no range check and without charging
    the card for the amount. An attacker who edits the `sessionStorage` value between the two screens — or who posts to the
    endpoint directly — credits their wallet with an arbitrary balance and spends it in the same checkout flow.'
  attack_steps:
  - An attacker starts a wallet top-up, enters an allowed amount, and continues so the SPA writes `sessionStorage.walletTotal`.
  - The attacker overwrites `sessionStorage.walletTotal` with `1000000` in the browser console before confirming the payment.
  - The attacker confirms, and `payment.component.ts:218` posts that balance, which `routes/wallet.ts:26` increments onto
    the wallet without validating the amount or charging the card.
  evidence_summary: '`wallet.component.ts:44` persists the user-entered amount to `sessionStorage`, and the `Validators.min(10)`/`max(1000)`
    pair at line 30 is the only bound applied anywhere before `routes/wallet.ts:26` increments the balance.'
  impact_description: An authenticated user credits themselves an arbitrary wallet balance and spends it at checkout, producing
    direct financial loss.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: '`addWalletBalance()` at `routes/wallet.ts:23` verifies that `paymentId` names a card owned by the caller
    before crediting, so the top-up cannot be performed with an arbitrary card. It applies no bound to `req.body.balance`
    and performs no charge against that card.'
  mitigation_title: Derive the wallet top-up amount server-side from the charged payment transaction
  remediation:
    effort: Medium
    steps:
    - Have the SPA post the requested amount as an explicit request parameter to a server-side top-up endpoint rather than
      staging it in `sessionStorage` across two routes.
    - Validate the amount in `addWalletBalance()` at `routes/wallet.ts:22` against the same 10-1000 bound the form declares,
      rejecting anything outside it with 400, and mirror the validator so the two cannot drift.
    - Credit the wallet only from the settled amount returned by the payment authorisation against the card, not from a number
      in the request body.
    - Make the increment idempotent by keying it to a server-generated transaction id, so a replayed request cannot credit
      the balance twice.
