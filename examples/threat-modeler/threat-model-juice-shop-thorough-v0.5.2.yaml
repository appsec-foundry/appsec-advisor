  title: Session Not Invalidated After Password Reset (routes/resetPassword.ts:44)
  scenario: 'The reset handler writes the new password with `user.update({ password: newPassword })` and returns. It does
    not touch `security.authenticatedUsers`, so every token issued before the reset stays in `tokenMap` and continues to authenticate.
    The same gap applies to 2FA enable and disable in routes/2fa.ts, which save the model and update only the caller''s own
    cache entry. An attacker who has stolen a session — via the stored XSS in auth-005, a forged token, or a shared device
    — therefore keeps access after the victim performs the standard remediation of changing their password, and keeps it for
    the token''s full six-hour validity with no mechanism available to cut it short. From the victim''s perspective the account
    appears secured while the attacker''s session is still live.'
  attack_steps:
  - An attacker obtains a valid session token for the victim's account and notes that it remains in the server-side token
    map.
  - The victim notices the compromise and resets their password through the recovery flow.
  - The attacker continues issuing requests with the original token, which is still present in the cache and still within
    its six-hour validity, retaining full access to the account.
  evidence_summary: '`routes/resetPassword.ts:44` performs the password write without any call that removes the user''s entries
    from `security.authenticatedUsers`.'
  impact_description: A compromised session survives the victim's password change, so the account owner has no effective way
    to evict an attacker.
  likelihood: Medium
  impact: High
  risk: High
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  controls_in_place: None. Tokens are stateless apart from the in-memory map, and nothing removes map entries on a credential
    change.
  mitigation_title: Evict all cached sessions for a user on password reset and 2FA state change
  remediation:
    effort: Medium
    steps:
    - After the password write at routes/resetPassword.ts:44, delete every `tokenMap` entry belonging to that user id and
      clear the matching `idMap` key, then require re-authentication.
    - Apply the same eviction in routes/2fa.ts after `setup` (line 130) and `disable` (line 163) so enabling or removing a
      second factor terminates other sessions.
    - Add a `credentialsChangedAt` timestamp to the User model and reject any presented token whose `iat` predates it, so
      eviction also holds for stateless verification paths and across processes.
    - Send a notification to the account address whenever a password or 2FA change invalidates sessions.
    code_example: '// After — the credential change actually terminates existing sessions

      await user.update({ password: newPassword, credentialsChangedAt: new Date() })

      security.revokeAllForUser(user.id) // clears tokenMap + idMap entries

      // and on every verify: reject when decoded.iat * 1000 < credentialsChangedAt'
    verification: Log in as a test user and keep the token. Reset that user's password, then reuse the original token against
      GET /rest/user/authentication-details — the response must be 401.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
  evidence:
  - file: routes/resetPassword.ts
    line: 44
  evidence_check: verified
