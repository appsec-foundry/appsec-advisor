  title: Unverified JWT Signature (routes/chat.ts:45)
  affected_parameter: Authorization
  scenario: 'An attacker mints a JWT whose payload contains the victim''s numeric user id, signs it with any key of their
    choosing, and sends it as the `Authorization` header on `POST /rest/chat`. `getUserId()` at `routes/chat.ts:45` resolves
    the identity with `security.decode(token)`, which is `jws.decode(token)?.payload` at `lib/insecurity.ts:56` — the payload
    is base64-decoded and returned with no signature check, while the verifying counterpart `security.verify()` (line 55)
    is never called on this path. The forged id then drives two security decisions in the same handler: `getUserNameFromToken()`
    writes the victim''s username into the system prompt (line 83), and the `getOrderById` tool loads the victim''s email
    to authorize order lookups (lines 159-169). The attacker holds the agent''s full user context without ever authenticating.'
  attack_steps:
  - An attacker reads the id of a target account, for example from a product review author or an order confirmation page.
  - The attacker forges a JWT carrying `data.id` set to that target id and signs it with an arbitrary key, since no signature
    check runs on this path.
  - The attacker posts a chat message with the forged token, and the agent greets them by the victim's username and answers
    order questions in the victim's context.
  evidence_summary: '`getUserId()` at `routes/chat.ts:45` calls `security.decode()`, a bare `jws.decode()` wrapper at `lib/insecurity.ts:56`,
    while the signature-verifying `security.verify()` is never invoked in this handler.'
  impact_description: Any unauthenticated caller can drive the chat agent — including its order-lookup tool — as an arbitrary
    registered user.
  likelihood: High
  impact: High
  risk: High
  owasp_llm_ids: []
  owasp_asi_ids:
  - ASI03
  controls_in_place: None on this path. `security.verify()` exists at `lib/insecurity.ts:55` and `security.isAuthorized()`
    guards neighbouring routes (`server.ts:633-634`), but neither is applied to `/rest/chat` or to the identity lookup inside
    the handler.
  mitigation_title: Verify the JWT signature in the chat handler instead of decoding it
  remediation:
