- local_id: sqlite-db-005
  threat_category_id: TH-01
  additional_categories: []
  stride: Tampering
  cwe: CWE-79
  title: Stored Cross-Site Scripting (models/user.ts:49)
  affected_parameter: username
  scenario: 'The persistence layer, not the view layer, is where this application decides whether user content is safe to
    render. Three model setters strip markup on the way into the database — `username` (models/user.ts:47), `Feedback.comment`
    (models/feedback.ts:41), and `Product.description` (models/product.ts:44) — and each of them branches on a runtime flag.
    When `utils.isChallengeEnabled(...)` is true, `username` is passed through `security.sanitizeLegacy` and `comment` through
    `security.sanitizeHtml`; only the `else` branch reaches `security.sanitizeSecure`. That inverts the safe default: the
    weaker sanitizer is the active path in the deployed configuration, and the stronger one runs only when the flag is off.
