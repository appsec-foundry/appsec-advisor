  title: Unauthorized Workflow Trigger (.github/workflows/rebase.yml:10)
  scenario: Any GitHub user who can comment on a juice-shop pull request posts `/rebase`. The `issue_comment` trigger at .github/workflows/rebase.yml:3
    fires a job whose only gate is `contains(github.event.comment.body, '/rebase')` at line 10 — there is no `github.event.comment.author_association`
    check for OWNER/MEMBER/COLLABORATOR. The job runs on the default branch with the repository's `GITHUB_TOKEN` and force-pushes
    a rebased history onto the PR head branch, so an unrelated third party controls when a privileged, credential-bearing
    workflow executes and when a contributor's branch is rewritten.
  attack_steps:
  - An attacker opens any open pull request on the repository and posts the comment `/rebase`.
  - The attacker's comment satisfies the only gate at `rebase.yml:10`, so GitHub starts the job on the default branch with
    the repository `GITHUB_TOKEN`.
  - The attacker repeats the comment on further pull requests to force-push rewritten history onto other contributors' branches
    and consume runner minutes at will.
  evidence_summary: The `if:` condition at rebase.yml:10 tests only the comment body and PR-ness; no `author_association`
    or membership predicate appears anywhere in the workflow.
  impact_description: Any GitHub account can start a token-bearing workflow run and rewrite the head branch of pull requests
    it does not own.
  likelihood: Medium
  impact: Medium
  risk: Medium
  actor_ids:
  - ACT-D-06
  primary_actor: ACT-D-06
  controls_in_place: The rebase action itself is SHA-pinned (cirrus-actions/rebase@b87d48154a87a85666003575337e27b8cd65f691)
    and the job only touches the PR head branch, not protected branches.
  mitigation_title: Gate the /rebase comment trigger on author_association in rebase.yml
  remediation:
    effort: Low
    steps:
    - Extend the job `if:` at .github/workflows/rebase.yml:10 with `&& contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.comment.author_association)` so only trusted accounts trigger it.
    - 'Add a top-level `permissions:` block granting only `contents: write` and `pull-requests: read`, so the run cannot reach
      issues, packages, or actions scopes.'
    - Optionally require the comment author to also be the PR author by comparing `github.event.comment.user.login` with `github.event.issue.user.login`.
    code_example: "# .github/workflows/rebase.yml\npermissions:\n  contents: write\n  pull-requests: read\njobs:\n  rebase:\n\
      \    # Before: any commenter could start this job\n    # After: only repo owners/members/collaborators can\n    if:\
      \ >-\n      github.event.issue.pull_request != '' &&\n      contains(github.event.comment.body, '/rebase') &&\n    \
      \  contains(fromJSON('[\"OWNER\",\"MEMBER\",\"COLLABORATOR\"]'), github.event.comment.author_association)"
    verification: From an account with no repository permissions, comment `/rebase` on an open PR and confirm the Actions
      tab shows the `rebase` job skipped (condition false); repeat as a collaborator and confirm it runs.
    reference: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
