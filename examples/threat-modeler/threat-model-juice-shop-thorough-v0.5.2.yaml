- local_id: sqlite-db-007
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: Uncontrolled Resource Consumption (models/index.ts:36)
  scenario: 'The datastore is an in-process SQLite file, so the database shares the Node event loop and the container''s disk
    with the application it serves. SQLite allows one writer at a time; the configuration at models/index.ts:35-40 acknowledges
    this by retrying on `SQLITE_BUSY` at most five times and by forcing `Transaction.TYPES.IMMEDIATE`, which takes the write
    lock at transaction start rather than at first write and therefore widens the window during which every other writer is
    blocked. There is no `busyTimeout`, no statement timeout, and no pool cap. The consequence is that write concurrency is
    bounded by retry count rather than by a queue: a modest burst of concurrent writes — bulk feedback posts, repeated basket
    updates, a scripted registration flood — exhausts five retries and surfaces as request failures for unrelated users, not
    just for the attacker. Because the file is local and unbounded, the same write path also lets an attacker grow the database
    on disk until the volume fills, at which point every write across the application fails at once.'
  evidence_summary: '`models/index.ts:36-40` bounds write contention with a five-attempt `SQLITE_BUSY` retry under `Transaction.TYPES.IMMEDIATE`,
    with no busy timeout, statement timeout, or size cap configured anywhere in the model layer.'
  impact_description: A burst of concurrent or oversized writes exhausts the retry budget or the disk volume, failing writes
    for all users of the single shared database file.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: A bounded `SQLITE_BUSY` retry (max 5) exists, which limits the failure to an error rather than a hang,
    but it does not queue or shed load.
  mitigation_title: Add a busy timeout, WAL mode, and statement timeouts to the Sequelize SQLite configuration
  remediation:
    effort: Low
    steps:
    - Enable WAL journal mode (`PRAGMA journal_mode=WAL`) and set `PRAGMA busy_timeout=5000` on connect so concurrent readers
      do not block the writer and contending writers wait rather than immediately consuming a retry.
    - 'Narrow the lock window: use `Transaction.TYPES.DEFERRED` for read-mostly transactions so the write lock is taken at
      first write instead of at transaction start.'
    - Bound per-request work at the model layer — enforce a maximum `limit` on every `findAll` used by a public route, and
      reject requests whose page size exceeds it, so one caller cannot pull the whole table.
    - For any deployment beyond a single instance, move to a server-backed engine (PostgreSQL) via the same Sequelize models;
      a single-writer file database cannot be scaled horizontally at all.
    code_example: "// models/index.ts — After: contention is absorbed by a wait, not by burning retries\nconst sequelize =\
      \ new Sequelize('database', 'username', 'password', {\n  dialect: 'sqlite',\n  storage: process.env.DB_PATH ?? '/var/lib/juiceshop/juiceshop.sqlite',\n\
      \  transactionType: Transaction.TYPES.DEFERRED,\n  pool: { max: 5, acquire: 5000 },\n  retry: { match: [/SQLITE_BUSY/],\
      \ name: 'query', max: 5 }\n})\nawait sequelize.query('PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;')"
    verification: Drive 100 concurrent POSTs to a write endpoint and assert no response carries a `SQLITE_BUSY` error and
      p99 latency stays bounded; assert `PRAGMA journal_mode` returns `wal` at runtime.
    reference: CWE-400
  evidence:
  - file: models/index.ts
    line: 36
  evidence_check: verified
