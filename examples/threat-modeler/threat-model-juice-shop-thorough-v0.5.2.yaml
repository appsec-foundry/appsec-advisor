- name: 'External to Auth: security.authorize() RS256 JWT issuance'
  kind: identity
  assumption: A JWT is issued only after the SQL query returns a non-null User row and all required authentication factors
    are verified.
  evidence:
  - file: routes/login.ts
    line: 18
  - file: lib/insecurity.ts
    line: 54
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: auth
  enforcement_point: security.authorize() RS256 JWT issuance
  assumption_legs:
  - leg: validation
    condition: Credential inputs (email, password, TOTP code) are type-checked and length-bounded before the database lookup
      runs.
  - leg: authentication
    condition: A JWT is issued only after the SQL query returns a non-null User row and, when totpSecret is set, a valid TOTP
      code is verified.
  - leg: authorization
    condition: A JWT grants access only to resources belonging to the user ID it encodes and never to another user's data
      or elevated privileges.
  surface: network
  transition:
  - identity
  id: tb-3
  assumption_verdict: refuted
