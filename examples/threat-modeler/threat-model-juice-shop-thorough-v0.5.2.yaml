  title: Hardcoded HMAC Key (lib/insecurity.ts:42)
  scenario: 'Security-question answers are protected by `hmac()`, an HMAC-SHA256 whose key is the string literal `pa4qacea4VK9t9nGv7yZtwmj`
    embedded in the source. Because the key is public and the same for every user, the construction provides no more protection
    than an unkeyed hash: an attacker who obtains the SecurityAnswer table — for example through the login SQL injection —
    precomputes HMACs for a dictionary of plausible answers and matches them offline, with no per-user salt to force separate
    work per account. Recovered answers feed straight into the reset-password flow, so cracking the table converts into mass
    account takeover. The recovered key is also usable to forge a matching answer value directly if write access to the table
    is obtained.'
  evidence_summary: '`lib/insecurity.ts:42` passes a fixed string literal as the HMAC key, and `routes/resetPassword.ts:41`
    uses that HMAC as the sole comparison for the security answer.'
  impact_description: The entire security-answer table is recoverable offline by dictionary attack, and each recovered answer
    is a working account-takeover credential via the reset flow.
  likelihood: High
  impact: High
  risk: High
  actor_ids:
  - ACT-D-01
  - ACT-D-06
  primary_actor: ACT-D-01
  controls_in_place: None. The key is a source literal with no per-user salt, no work factor, and no rotation path.
  mitigation_title: Store security answers with a salted password hash and move the HMAC key to secret configuration
  remediation:
    effort: Medium
    steps:
    - 'Stop using a keyed hash for answers: store them with `bcrypt.hash(answer.trim().toLowerCase(), 12)` so each row carries
      its own salt and a deliberate work factor.'
    - For any remaining HMAC use, read the key from `process.env.HMAC_KEY` and abort startup when it is absent instead of
      falling back to a literal.
    - Treat the committed key as compromised — rotate it and force re-entry of security answers, or retire the security-question
      flow entirely per auth-004.
    - Add a secret scanner to CI so a fixed key literal cannot be reintroduced.
    code_example: "// Before — one public key for every stored answer\n// export const hmac = (data: string) => crypto.createHmac('sha256',\
      \ 'pa4qa...').update(data).digest('hex')\n\n// After — per-row salt plus work factor; two users with the same answer\
      \ no\n// longer share a stored value, so one dictionary run cannot cover the table\nexport const hashAnswer = (answer:\
      \ string) =>\n  bcrypt.hash(answer.trim().toLowerCase(), 12)\nexport const verifyAnswer = (answer: string, stored: string)\
      \ =>\n  bcrypt.compare(answer.trim().toLowerCase(), stored)"
    verification: Store the same security answer for two accounts and assert the persisted values differ. Start the application
      without HMAC_KEY set and assert startup fails.
