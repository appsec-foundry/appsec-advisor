    code executes in this repository's runner on the next image-touching push or pull request, because the step resolves the
    action from a moving branch ref instead of a commit SHA.
  attack_steps:
  - I gain write access to the upstream action repository or its maintainer account.
  - I push a malicious commit to main, which this workflow resolves at the next run.
  - I read the GITHUB_TOKEN handed to the step and commit code or open releases in the target repository.
