  name: SQLite / Sequelize Data Layer
  description: Persistent storage layer using SQLite as the default database, accessed through Sequelize ORM models. Stores
    users, passwords, addresses, payment cards, baskets, orders, challenge state, product catalog, and feedback. Initialized
