components:
- id: web-frontend
  name: Juice Shop Angular SPA
  description: Single-page application built with Angular 17+ and TypeScript that delivers the entire user-facing UI including
    product catalog, shopping cart, user profile, hacking-instructor overlay, and OAuth login flow. Compiled and served as
    static assets by the Express backend on port 3000.
  paths:
  - frontend/src/app/**/*.ts
  - frontend/src/app/**/*.html
  - frontend/src/hacking-instructor/**/*.ts
  - frontend/src/app/Services/*.ts
