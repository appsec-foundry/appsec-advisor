- local_id: angular-spa-008
  threat_category_id: TH-02
  additional_categories:
  - TH-04
  stride: Information Disclosure
  cwe: CWE-522
  title: Browser-Held Bearer Token Without Backend-for-Frontend
  scenario: 'The SPA is the token custodian for the whole system. `login.component.ts:101` receives the raw JWT in the login
    response body and hands it to browser storage; `request.interceptor.ts:16` then attaches it to every direct call the browser
    makes to `/api` and `/rest`. No server-side session broker sits between the browser and the API, so the browser holds
    a long-lived credential that JavaScript must be able to read by design — which is why the storage and guard weaknesses
    in this component escalate to account takeover rather than staying UI defects. The same architecture forces the SPA to
    inspect the token itself (`app.guard.ts:38`), leaks the credential into the OAuth URL fragment (`login.component.ts:148`),
    and leaves nothing to revoke server-side when a token is stolen. A Backend-for-Frontend removes the class: the Express
    tier exchanges credentials, keeps the API token server-side, and issues the browser only an opaque `HttpOnly` session
    cookie.'
  evidence_summary: '`login.component.ts:101` stores the API bearer token in the browser and `request.interceptor.ts:16` sends
    it directly to the API — no server-side session broker exists between the two.'
  impact_description: Every client-side weakness in this component becomes a credential compromise, and stolen tokens cannot
    be revoked because no server-side session exists.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Tokens carry an 8-hour expiry on the cookie copy (`login.component.ts:103`) and are cleared on logout
    and on OAuth error. There is no server-side session record, so no revocation is possible before expiry.
  mitigation_title: Introduce a Backend-for-Frontend that holds API tokens server-side
  remediation:
    effort: High
    steps:
    - Add a BFF layer in the Express tier that performs login and the OAuth code exchange, stores the resulting API token
      in a server-side session store, and returns only an opaque session id to the browser.
    - Issue that session id as an `HttpOnly Secure SameSite=Strict` cookie and add CSRF protection to state-changing routes,
      since the credential becomes ambient.
    - Proxy `/api` and `/rest` calls through the BFF so the browser never holds or transmits the API bearer token itself.
    - Expose a `/rest/user/whoami` endpoint that returns role and entitlement from the verified session, replacing the SPA's
      own `jwtDecode()` inspection in `app.guard.ts`.
    - Add server-side session revocation so a compromised session can be terminated before token expiry.
    code_example: null
    verification: After the change, log in and assert the login response body contains no JWT, `localStorage` holds no `token`
      key, and the only credential present is an `HttpOnly` cookie. Confirm a direct browser call to `/api/Users` without
      the BFF proxy is rejected.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
