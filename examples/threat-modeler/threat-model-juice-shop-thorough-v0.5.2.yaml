    and the three /rest/2fa endpoints, which each carry an express-rate-limit instance — and the handler itself implements
    no failed-attempt counter, no per-account lockout, no exponential backoff, and no CAPTCHA. A grep for any throttling or
    attempt-counting identifier in routes/login.ts and lib/insecurity.ts returns zero hits. An attacker therefore runs credential
    stuffing against the full user list obtained from routes/authenticatedUsers.ts at whatever rate the network allows, and
    each attempt costs the server only one MD5 computation, so there is no natural throttle either. Because no authentication
    event is logged, the campaign is also invisible.
