  title: Unbounded ZIP decompression (routes/fileUpload.ts:34)
  scenario: 'extractZipBuffer streams every archive entry to disk at routes/fileUpload.ts:34 with no cap on the number of
    entries, the declared uncompressed size of an entry, or the cumulative bytes written. The only limit anywhere in the path
    is multer''s 200000-byte cap on the compressed upload (server.ts:692), which is exactly the wrong side of the ratio: DEFLATE
    reaches roughly 1000:1 on repetitive input, so a 200 KB archive can expand into hundreds of megabytes, and a nested archive
    far more. unzipper exposes entry.vars.uncompressedSize before the stream is consumed, but the loop never reads it. A single
    anonymous request therefore converts a small upload into sustained disk writes; repeating it fills the volume that holds
    uploads/complaints/, which is the same filesystem the application and its SQLite data live on.'
  attack_steps:
  - An attacker builds a ZIP under 200 KB containing entries of highly repetitive data that expand by roughly three orders
    of magnitude.
  - The attacker POSTs it to `/file-upload` without credentials and repeats the request in a loop.
  - Each request writes the fully expanded entries under `uploads/complaints/` with no byte ceiling, exhausting free space
    on the application volume.
  evidence_summary: The extraction loop writes entry.stream() straight to disk and never consults entry.vars.uncompressedSize
    or tracks cumulative extracted bytes.
  impact_description: Repeated small uploads exhaust disk space on the volume shared by the application and its database,
    taking the service down.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None on the decompressed side. multer caps the compressed upload at 200000 bytes (server.ts:692).
  mitigation_title: Cap entry count, per-entry size, and total extracted bytes during ZIP extraction
  remediation:
    effort: Medium
    steps:
    - Reject the archive when `directory.files.length` exceeds a fixed entry cap before extracting anything.
    - Read `entry.vars.uncompressedSize` and skip any entry above a per-entry byte limit without opening its stream.
    - Track cumulative extracted bytes across entries and abort the whole extraction once a total budget is exceeded, deleting
      what was already written.
    - Extract into a per-request temporary directory and move the result into place only after the full extraction stays inside
      budget.
    code_example: "const MAX_ENTRIES = 64\nconst MAX_TOTAL = 10 * 1024 * 1024\nif (directory.files.length > MAX_ENTRIES) throw\
      \ new Error('Archive has too many entries')\nlet written = 0\nfor (const entry of directory.files) {\n  // After: the\
      \ declared size is checked before any byte is streamed to disk\n  written += entry.vars.uncompressedSize\n  if (written\
      \ > MAX_TOTAL) { entry.autodrain(); throw new Error('Archive expands beyond budget') }\n  await pipeline(entry.stream(),\
      \ fs.createWriteStream(target))\n}"
    verification: Upload a 200 KB zip bomb that declares 500 MB uncompressed; assert the response is an error, and assert
      `du -s uploads/complaints` grew by less than the configured total budget.
    reference: CWE-409
  evidence:
