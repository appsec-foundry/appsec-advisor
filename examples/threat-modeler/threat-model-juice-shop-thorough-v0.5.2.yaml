  title: Missing Security Event and Audit Logging
  scenario: 'The login handler issues a session token at routes/login.ts:26 and writes no security event: there is no logger
    call anywhere in routes/login.ts, routes/wallet.ts or routes/orderHistory.ts. The only record of a successful or failed
    authentication is the morgan HTTP access log configured at server.ts:338, which captures the request line but neither
    the resolved user identity nor the outcome, so an operator cannot reconstruct who authenticated or which account a wallet
    mutation belonged to.'
  evidence_summary: A zero-hit search for 'logger' across routes/login.ts, routes/wallet.ts and routes/orderHistory.ts shows
    no security event is emitted at the token-issuing statement routes/login.ts:26.
  impact_description: Credential-stuffing, account takeover and wallet mutation cannot be attributed to an account or reconstructed
    after the fact.
  likelihood: Medium
  impact: Medium
  risk: Medium
