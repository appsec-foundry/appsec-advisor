- local_id: sqlite-db-006
  threat_category_id: TH-16
  additional_categories: []
  stride: Repudiation
  cwe: CWE-778
  title: Missing Database Audit Trail (models/index.ts:42)
  scenario: 'Nothing in the data layer records who changed what. `logging: false` at models/index.ts:42 discards the SQL stream
    entirely, and no model carries an actor column — a grep across `models/` for `createdBy`, `updatedBy`, `audit`, or a logger
    import returns nothing. Sequelize''s default `createdAt`/`updatedAt` timestamps say a row moved but not who moved it.
    The gap is sharpest on `Wallet.balance` (models/wallet.ts:35), which is a mutable scalar rather than an append-only ledger:
    a balance can be rewritten in place and the prior value is gone, so a fraudulent top-up is indistinguishable from a legitimate
    one after the fact and there is no sum-of-entries invariant to reconcile against. The same applies to `role` changes on
    Users and to soft-deletes under `paranoid: true`. Practically this means the elevation and tampering findings above are
    not just exploitable but unprovable afterwards: an incident responder cannot establish which account was promoted, when,
    or by whom, and a disputing customer cannot be contradicted.'
  evidence_summary: '`models/index.ts:42` sets `logging: false`, and no model in `models/` defines an actor column or emits
    an audit record — the balance at models/wallet.ts:35 is an in-place mutable integer with no ledger table behind it.'
  impact_description: Privilege changes, wallet adjustments, and deletions leave no attributable record, so fraud cannot be
    reconstructed and a user's denial of a transaction cannot be refuted.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: Sequelize's default `createdAt`/`updatedAt` timestamps exist on the models, but they carry no actor identity
    and are overwritten in place.
  mitigation_title: Add an append-only audit table and a wallet ledger keyed to the acting user
  remediation:
    effort: Medium
    steps:
    - Introduce an append-only `AuditLog` model (actor id, action, model name, row id, before/after JSON, timestamp) with
      no update or destroy hooks, and write to it from `afterCreate`/`afterUpdate`/`afterDestroy` hooks on User, Wallet, Card,
      and Address.
    - 'Propagate the acting identity into the ORM: pass the authenticated user id in the Sequelize `options` bag on every
      write (`{ userId: req.user.id }`) so the hooks can record an actor rather than an anonymous change.'
    - Replace the mutable `Wallet.balance` with a `WalletTransaction` ledger of signed amounts and derive the balance as their
      sum, so an adjustment can be traced to its originating entry and reconciled.
    - Ship the audit stream off the box to an append-only sink rather than leaving it in the same SQLite file an attacker
      who reaches the database can rewrite.
    code_example: "// models/wallet.ts — After: balance becomes derived, adjustments become entries\nWalletTransaction.init({\n\
      \  WalletId: DataTypes.INTEGER,\n  amount: DataTypes.INTEGER,   // signed; credit positive, debit negative\n  actorUserId:\
      \ DataTypes.INTEGER,\n  reason: DataTypes.STRING\n}, { tableName: 'WalletTransactions', sequelize, updatedAt: false\
      \ })\n\n// balance is no longer writable in place\nconst balance = await WalletTransaction.sum('amount', { where: {\
      \ WalletId } })"
    verification: Change a user's role and adjust a wallet balance, then assert `SELECT actorUserId, action FROM AuditLog`
      contains one row per change naming the acting account, and that an UPDATE against AuditLog is rejected.
    reference: CWE-778
  evidence:
