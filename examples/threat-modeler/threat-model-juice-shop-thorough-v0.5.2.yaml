  cwe: CWE-602
  title: Client-Side-Only Authorization Guard (frontend/src/app/app.guard.ts:54)
  scenario: The admin, accounting, and deluxe route guards decide privilege from a token the user controls and never verify.
    `LoginGuard.tokenDecode()` at `app.guard.ts:38` calls `jwtDecode(token)` on the `localStorage` value — a decode, not a
    verification, so no signature is checked — and `AdminGuard.canActivate()` at line 54 admits the route whenever `payload.data.role
    === roles.admin`. `AccountingGuard` at line 70 and `DeluxeGuard.isDeluxe()` at line 86 read the same unverified payload.
    An attacker overwrites `localStorage.token` with a self-made JWT carrying `data.role = 'admin'` and every guarded route
    opens, including `/administration`. Whether that yields real data depends entirely on the Express backend repeating the
    check server-side; the SPA contributes no authority. Beyond route access, `DeluxeGuard` gates pricing and feature behaviour,
    so a forged payload also unlocks deluxe-only UI paths.
  attack_steps:
  - An attacker registers an ordinary account and logs in normally.
  - The attacker replaces `localStorage.token` in the browser console with an unsigned JWT whose payload sets `data.role`
    to `admin`.
  - The attacker navigates to `/administration`; `app.guard.ts:54` decodes the forged payload without checking the signature
    and admits the route.
  - The attacker drives the loaded admin screens against the REST API to find endpoints where the server repeats no authorization
    check of its own.
  evidence_summary: '`app.guard.ts:38` uses `jwtDecode()` — which parses without verifying — and `AdminGuard` at line 54 grants
    the route on the decoded `data.role` alone.'
  impact_description: Any user reaches the administration, accounting, and deluxe UI surfaces by editing a value in their
    own browser storage.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: '`AdminGuard` and `AccountingGuard` compare `payload.data.role` against the constants in `roles.ts` and
    redirect to `/403` on mismatch. Both operate on unverified client-held data; the only real control would be server-side
    authorization, which this component does not implement.'
  mitigation_title: Treat route guards as UX only and enforce role checks on every REST endpoint
  remediation:
    effort: Medium
    steps:
    - Replace `tokenDecode()` in `app.guard.ts` with a call to a server endpoint such as `/rest/user/whoami` that returns
      the caller's role from the verified session, and cache the result in a service.
    - Add server-side role middleware to every admin and accounting route so the guard's decision is never load-bearing —
      the SPA guard exists only to avoid rendering a screen the user cannot use.
    - Return 403 from the API for privileged data regardless of what the SPA rendered, and write the negative test at the
      API level rather than the route level.
    - Do not branch pricing or entitlement logic on `DeluxeGuard.isDeluxe()`; have the server return the authoritative entitlement
      with the product data.
    code_example: "// Before (frontend/src/app/app.guard.ts:52-60)\n// const payload = this.loginGuard.tokenDecode()   //\
      \ jwtDecode: parses, does not verify\n// if (payload?.data && payload.data.role === roles.admin) { return true }\n\n\
      // After: ask the server, which verified the session signature\ncanActivate () {\n  return this.userService.whoAmI().pipe(\n\
      \    map(user => user.role === roles.admin),\n    tap(ok => { if (!ok) this.loginGuard.forbidRoute() }),\n    catchError(()\
      \ => { this.loginGuard.forbidRoute(); return of(false) })\n  )\n}"
    verification: Set `localStorage.token` to an unsigned JWT with `data.role='admin'`, open `/administration`, and assert
      every REST call the page makes returns 403. Add an API-level test that an ordinary user's token is rejected by each
      admin route.
    reference: CWE-602
  evidence:
  - file: frontend/src/app/app.guard.ts
    line: 54
  evidence_check: verified
