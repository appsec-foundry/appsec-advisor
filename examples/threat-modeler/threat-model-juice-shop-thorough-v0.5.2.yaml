  title: Weak Password Recovery Mechanism (routes/resetPassword.ts:41)
  affected_parameter: answer
  scenario: Password recovery requires only an email address and the answer to a security question. There is no emailed one-time
    link, no possession proof, no notification to the account owner, and no session invalidation. The handler compares `security.hmac(answer)`
    against the stored answer and, on a match, immediately writes the caller-supplied `new` password onto the user record.
    Security answers are inherently low-entropy — the seeded dataset uses values such as a family member's name or a childhood
    street — so an attacker who knows or can research the victim (or who simply enumerates common answers) takes over the
    account outright. Because the reset succeeds silently, the legitimate owner learns of it only when their own password
    stops working.
  attack_steps:
  - An attacker reads the victim's security question from the public profile or the /rest/user/security-question endpoint.
  - The attacker posts to `/rest/user/reset-password` with the victim's email, a guessed answer, and a password of their choosing.
  - On the first correct guess the handler overwrites the victim's password and returns the updated user record, giving the
    attacker sole control of the account.
  evidence_summary: '`routes/resetPassword.ts:41` treats a matching security-answer HMAC as sufficient proof of identity and
    proceeds directly to the password write on line 44.'
  impact_description: Full account takeover — including administrative accounts — from knowledge of a single low-entropy answer,
    with no out-of-band step the owner could refuse.
  likelihood: High
  impact: High
  risk: High
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  controls_in_place: A per-key rate limiter is mounted on the route in server.ts (100 requests / 5 min), and the handler rejects
    empty or mismatched password pairs. Neither constrains guessing of the answer itself, and no second channel is involved.
  mitigation_title: Replace security-question recovery with an emailed single-use, short-lived reset token
  remediation:
    effort: High
    steps:
    - Change the flow so POST /rest/user/reset-password only accepts an email, always answers with the same generic message,
      and mails a 128-bit CSPRNG token that is stored hashed, expires in 15 minutes, and is consumed on first use.
    - Move the actual password change to a second endpoint that requires the token, and never return or log the token in the
      triggering response.
    - If security questions must be retained, demote them to an additional factor alongside the emailed token rather than
      the sole factor.
    - On successful reset, delete the user's entry from `security.authenticatedUsers` and send a notification email to the
      account address.
    - Enforce a password policy at reset time (minimum length, byte-length cap before hashing) — the User model currently
      applies none.
    code_example: "// After — proof of control over the registered mailbox, not knowledge of a fact\nconst token = crypto.randomBytes(32).toString('hex')\n\
      await PasswordResetModel.create({\n  UserId: user.id,\n  tokenHash: crypto.createHash('sha256').update(token).digest('hex'),\n\
      \  expiresAt: new Date(Date.now() + 15 * 60 * 1000)\n})\nawait mailer.sendResetLink(user.email, token) // never in the\
      \ HTTP response\nres.json({ status: 'If the address exists, a reset link has been sent.' })"
