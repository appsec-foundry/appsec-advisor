  title: Hardcoded Cryptographic Key (lib/insecurity.ts:21)
  scenario: 'The RSA private key used to sign every session JWT is a literal PEM block in `lib/insecurity.ts`, committed to
    a public repository. `authorize()` signs with that constant and the matching public key ships as `encryptionkeys/jwt.pub`,
    so the signing secret is available to anyone who can read the source or pull the published container image. An attacker
    constructs a payload of their choosing — `{"data": {"id": 1, "email": "admin@juice-sh.op", "role": "admin"}}` — signs
    it with the copied key using RS256, and presents it as a Bearer token. Every server-side check that only verifies the
    signature accepts it. The same constant is reused as the HMAC key for `deluxeToken()` at line 150, so the deluxe-membership
    token that `isDeluxe()` cross-checks is forgeable from the same material.'
  attack_steps:
  - An attacker copies the PEM private key literal out of `lib/insecurity.ts` in the public source tree.
  - 'The attacker signs a self-authored payload containing `"role": "admin"` with that key using RS256 and a 6-hour expiry.'
  - 'The attacker sends the forged token as `Authorization: Bearer <token>` and is accepted by every route behind the signature
    check, without ever touching the login endpoint.'
  evidence_summary: '`lib/insecurity.ts:21` assigns a complete RSA private key as a string literal, and `authorize()` on line
    54 signs all session tokens with it.'
  impact_description: Anyone with read access to the source can mint a valid admin session token at will, and no credential
    rotation is possible without a code change and redeploy.
  likelihood: High
  impact: Critical
  risk: Critical
  actor_ids:
  - ACT-D-01
  - ACT-D-06
  primary_actor: ACT-D-01
  controls_in_place: None. The key is not read from an environment variable, a key file, or a secret manager, and there is
    no rotation mechanism.
  mitigation_title: Load the JWT signing key from external secret configuration and rotate the exposed key pair
  remediation:
    effort: Medium
    steps:
    - Generate a fresh RSA key pair and treat the committed one as permanently compromised — it must never be reused after
      this change.
    - Replace the literal at lib/insecurity.ts:21 with a required read from configuration, e.g. `const privateKey = process.env.JWT_PRIVATE_KEY
      ?? fs.readFileSync(process.env.JWT_PRIVATE_KEY_FILE, 'utf8')`, and throw at startup when it is absent so the process
      fails closed rather than falling back to a default.
    - 'Stop reusing the signing key as an HMAC secret: give `deluxeToken()` at lib/insecurity.ts:150 its own independently
      configured key.'
    - Purge the key from git history (git filter-repo or BFG) and add a pre-commit secret scanner so a PEM literal cannot
      reappear.
    code_example: "// Before — signing key is a source literal, unrotatable and public\n// const privateKey = '-----BEGIN\
      \ RSA PRIVATE KEY-----\\r\\nMIICXAIBAAKBgQ...'\n\n// After — required at startup; missing config stops the process instead\
