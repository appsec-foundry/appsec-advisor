  title: Insecure Direct Object Reference (routes/chat.ts:169)
  affected_parameter: orderId
  scenario: 'The `getOrderById` tool decides ownership at `routes/chat.ts:169` by comparing the stored `order.email` against
    `maskedEmail`, which line 165 derives by replacing every vowel in the caller''s address with `*`. The transformation is
    lossy: `bob@juice-sh.op`, `bab@juice-sh.op` and `bib@juice-sh.op` all collapse to `b*b@j**c*-sh.*p`, so a caller matches
    the orders of every account sharing their consonant skeleton. The tool is reached by chat text alone — the attacker asks
    the assistant for an order by id and the model supplies the argument — so no direct API knowledge is needed. Chained with
    llm-integration-001, whose forged token lets the attacker choose which mask is computed, this becomes unauthenticated
    retrieval of other customers'' order records.'
  attack_steps:
  - An attacker registers an account whose email address matches a target customer's address in every consonant, differing
    only in vowels.
  - The attacker asks the shop assistant for the details of an order id belonging to that target customer.
  - The model calls `getOrderById`, the masked-email comparison at `routes/chat.ts:169` matches, and the full order document
    is streamed back into the chat.
  evidence_summary: Ownership at `routes/chat.ts:169` is decided by equality against a vowel-stripped copy of the caller's
    email produced at line 165, not against a stored user identifier.
  impact_description: Customers whose email addresses differ only in vowels can read each other's complete order documents,
    including delivery details and line items.
  controls_in_place: A masked-email equality check (routes/chat.ts:165-169) and an authentication guard that returns early
    when no user id resolves (line 160). No comparison against a stable user identifier.
  likelihood: Medium
  impact: High
  risk: High
  owasp_llm_ids: []
  owasp_asi_ids:
  - ASI02
  mitigation_title: Authorize order lookups against the stored user id, not a masked email
  remediation:
    effort: Low
    steps:
    - Persist the owning user id on the order document and filter on it in the query at `routes/chat.ts:166`, so a non-owned
      order is never loaded into memory.
    - Delete the vowel-masking transformation at line 165 — masking is a display concern and must never be an authorization
      comparison.
    - Return an identical 'Order not found' result for both a missing order and a non-owned order, so the tool output does
      not confirm that an order id exists.
    - Add a cross-user test with two accounts whose emails differ only in vowels and assert each can retrieve only its own
      order.
    code_example: '// Before — ownership decided on a lossy mask, so vowel-variant emails collide

      // const maskedEmail = user.email.replace(/[aeiou]/gi, ''*'')

      // if (order.email !== maskedEmail) return { error: ''...'' }


      // After — the owner id is part of the query; a foreign order never loads

      const order = await db.ordersCollection.findOne({ orderId, userId })

      if (!order) return { error: ''Order not found'' }

      return order'
