  _title_source: Suppress tool-call events on the client stream unless the caller is an admin
  steps:
  - Wrap the `res.write` block at `routes/chat.ts:228-238` in an explicit condition that requires a verified admin role, evaluated
    from a signature-checked token rather than from `security.decode`.
  - 'Default the behaviour to suppressed: emit tool-call events only when the admin check returns true, so a missing or malformed
    token yields no disclosure.'
  - Keep the operational signal by continuing to increment `metricToolCalls` (line 227) server-side, which needs no client
    exposure.
