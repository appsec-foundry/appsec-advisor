verdict:
  severity: red
  opening: Juice Shop is not production-ready. Every major control category is either absent or defeated, giving an unauthenticated
    attacker a straight path to full account takeover, server-side code execution, and bulk customer data theft.
  bullets:
  - title: Admin account takeover without a password
    body: The signing key for every login token is committed to the public repository, letting anyone forge an admin session
      offline.
    findings:
    - F-006
    - F-007
    - F-008
    weaknesses:
    - W-004
    verified_attack_path: true
  - title: Full database read via login form
    body: The login form passes unsanitised input straight into a raw database query, exposing all user records to any anonymous
      visitor.
    findings:
    - F-010
    - F-011
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Server takeover via order upload
    body: A crafted order payload reaches a server-side code evaluator with no isolation, giving the attacker arbitrary command
      execution.
    findings:
    - F-015
    weaknesses: []
    verified_attack_path: false
  - title: Customer session stolen via stored script
    body: User-controlled content is rendered without output encoding, enabling persistent scripts that steal active login
      tokens from every visitor.
    findings:
    - F-009
    - F-031
    - F-042
    weaknesses: []
    verified_attack_path: false
  - title: Self-promotion to admin role
    body: Registration and email-verification routes accept a role field from the request body, letting any user grant themselves
      administrative rights.
    findings:
    - F-016
    - F-017
    weaknesses: []
    verified_attack_path: true
  - title: Supply chain replacement at build time
    body: No lockfile or digest-pinned base image is enforced, allowing a compromised upstream package to replace application
      code on the next build.
    findings:
    - F-002
    weaknesses: []
    verified_attack_path: false
  closing: Shipping this application exposes customers to data theft, account takeover, and server compromise from any internet-connected
    attacker.
  bullets_intro: 'The dominant worst-case outcomes, each reachable without a prior foothold:'
