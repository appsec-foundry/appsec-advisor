  title: Mass Assignment of Privileged Role (models/user.ts:79)
  affected_parameter: role
  scenario: 'User registration is exposed through the generic Sequelize REST layer at `POST /api/Users`. The only pre-handler
    middleware (server.ts:408-422) trims `email`, `password` and `passwordRepeat` and runs challenge checks; nothing removes
    unexpected fields, so every attribute declared on the model is writable from the request body. The `role` attribute at
    models/user.ts:79 defaults to `customer` but its validator accepts the literal `admin`, and its setter simply stores whatever
    it is given. A self-registering attacker therefore includes `"role": "admin"` in the signup body and receives an administrator
    account. The same primitive sets `deluxeToken`, `lastLoginIp` and `isActive`, so an attacker can also fabricate the deluxe
    entitlement or reactivate a disabled account.'
  attack_steps:
  - 'An attacker POSTs to `/api/Users` with a normal email and password plus the extra field `"role": "admin"`.'
  - The registration middleware trims only the credential fields and passes the whole body to the model, whose role validator
    accepts `admin`.
  - The attacker logs in with the credentials just chosen and receives a token whose `data.role` is `admin`.
  - The attacker uses that token against the administration endpoints, which decide access solely from the role claim.
  evidence_summary: models/user.ts:79-98 declares `role` as a client-writable attribute whose `isIn` validator includes `admin`,
    and no allowlist strips it from the registration body at server.ts:408.
  impact_description: Any anonymous visitor can create an administrator account through the public registration endpoint.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: A validator restricting `role` to the four known values. It blocks invalid strings but still admits `admin`,
    so it does not constrain privilege.
  mitigation_title: Strip privileged attributes from the registration body before model creation
  remediation:
    effort: Low
    steps:
    - Add middleware ahead of `POST /api/Users` that builds the creation payload from an explicit allowlist of `email`, `password`
      and `username`, discarding every other key.
    - Force `role` to `security.roles.customer` on creation and change it only through a separate admin-guarded endpoint.
    - Mark `role`, `deluxeToken`, `totpSecret` and `isActive` as non-fillable in the REST layer so the generic router cannot
      bind them.
    - 'Add a test asserting that a signup body containing `role: admin` produces a user whose stored role is `customer`.'
    code_example: "// Before: the whole request body is handed to UserModel.create\n\n// After: only these three fields can\
      \ come from the client\napp.post('/api/Users', (req, res, next) => {\n  const { email, password, username } = req.body\n\
      \  req.body = { email, password, username, role: security.roles.customer }\n  next()\n})"
    verification: POST `{"email":"t@example.com","password":"...","passwordRepeat":"...","role":"admin"}` to `/api/Users`,
      then read the created record and assert `role === 'customer'`.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
  evidence:
