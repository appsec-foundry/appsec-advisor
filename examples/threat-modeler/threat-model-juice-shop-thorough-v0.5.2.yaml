- local_id: ci-cd-pipeline-002
  threat_category_id: TH-14
  stride: Tampering
  cwe: CWE-1104
  title: Dependency Resolution Without Integrity Pinning (Dockerfile:5)
  scenario: 'The repository disables lockfiles outright — the root `.npmrc` and `frontend/.npmrc` both contain a lockfile-disabling
    directive, `package-lock.json` is listed in `.gitignore:10`, and neither `package-lock.json` nor `frontend/package-lock.json`
    exists in the tree. Every build therefore resolves the semver ranges in `package.json` fresh against the registry: `Dockerfile:5`
    runs `npm install --omit=dev`, `.github/workflows/ci.yml:51` and every test job run bare `npm install`, and `npm ci` appears
    nowhere in the repository. An attacker who publishes a malicious patch release of any direct or transitive dependency
    — or who compromises an existing maintainer account — is picked up automatically by the next build. Because `npm install`
    executes `postinstall` scripts and the docker job publishes the result to `bkimminich/juice-shop:latest` (ci.yml:345),
    that package''s code runs on the runner holding `DOCKERHUB_TOKEN` and ships inside the published image to every downstream
    consumer.'
  attack_steps:
  - An attacker takes over a low-profile transitive npm dependency of Juice Shop, by maintainer-account compromise or by acquiring
    the package from an inactive maintainer.
  - The attacker publishes a patch version that stays inside the existing semver range and adds a `postinstall` script.
  - The next push to master runs `npm install` in the Docker build (`Dockerfile:5`), which resolves the new version because
    no lockfile constrains it and executes the `postinstall` script on the runner.
  - The attacker's code reads the runner environment and is baked into the image that `ci.yml:345` pushes as `bkimminich/juice-shop:latest`.
  evidence_summary: No `package-lock.json` exists at the repository root or under `frontend/`, `.gitignore:10` excludes it,
    and a repository-wide search for `npm ci` returns zero hits.
  impact_description: A single compromised transitive package version executes on the release runner and is published inside
    the official Docker image without any integrity check.
  likelihood: High
  impact: Critical
  risk: Critical
  actor_ids:
  - ACT-D-06
  primary_actor: ACT-D-06
  controls_in_place: 'Partial: the `lint` job (ci.yml:36) and the lint-fixer and bundle-analysis workflows use `npm install
    --ignore-scripts`, so those specific jobs do not execute install hooks. The build, test, package, and Docker jobs do not.'
  mitigation_title: Commit npm lockfiles and switch every CI and Docker install to npm ci
  remediation:
    effort: Medium
    steps:
    - Remove the lockfile-disabling directive from `.npmrc` and `frontend/.npmrc`, delete the `package-lock.json` entry from
      `.gitignore:10`, run `npm install` locally once, and commit both generated lockfiles.
    - Replace every `npm install` in `.github/workflows/*.yml` and `Dockerfile:5` with `npm ci`, which fails the build when
      `package.json` and the lockfile disagree and never silently upgrades a dependency.
    - Add `--ignore-scripts` to install steps that do not need native builds, and use `npm rebuild` explicitly for the packages
      that do.
    - Enable Dependabot or Renovate on the lockfile so version bumps arrive as reviewable pull requests rather than as silent
      resolution changes.
    code_example: '# Dockerfile

      # Before: resolves semver ranges fresh on every build, runs install scripts

      # RUN npm install --omit=dev

      # After: installs exactly the audited tree recorded in package-lock.json

      COPY package.json package-lock.json ./

      RUN npm ci --omit=dev --ignore-scripts'
    verification: Change a dependency version in `package.json` without regenerating the lockfile and confirm the Docker build
      fails with `npm ci` EUSAGE; then run `npm ci --dry-run` in CI and confirm the resolved tree hashes match the committed
      lockfile.
