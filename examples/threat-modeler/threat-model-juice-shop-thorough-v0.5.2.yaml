  title: Unauthenticated WebSocket Channel
  scenario: 'The Socket.IO server is created with `new Server(server, { cors: { origin: ''http://localhost:4200'' } })` and
    immediately registers `io.on(''connection'', ...)` with no `io.use()` handshake middleware. Nothing reads `socket.handshake.auth`,
    `socket.handshake.headers.cookie`, or the JWT that `security.isAuthorized()` validates on the REST side, so the socket
    never acquires an identity. Because the Socket.IO server is attached to the same HTTP server as the Express API (server.ts:749),
    an anonymous internet client that can reach port 3000 can open the WebSocket upgrade and immediately invoke every registered
    event handler. The CORS `origin` value is not a substitute: Socket.IO only enforces it against browsers that send an `Origin`
    header, and any non-browser client (curl, socket.io-client, a script) connects regardless. This is the WebSocket leg of
    the same trust boundary the REST API guards with expressJwt.'
  attack_steps:
  - An attacker points a `socket.io-client` script at `ws://<host>:3000/socket.io/` with no cookie, no bearer token and no
    `Origin` header.
  - The handshake succeeds because no `io.use()` middleware inspects it, and the server immediately runs the `connection`
    handler for the anonymous socket.
  - The attacker now emits `notification received`, `verifyLocalXssChallenge` and the other registered events and receives
    every server-side broadcast, all without ever authenticating.
  evidence_summary: '`registerWebsocketEvents.ts` registers a `connection` handler at line 23 with no preceding `io.use()`
    middleware and no reference to `socket.handshake`, so no credential is ever read from the upgrade request.'
  impact_description: Every Socket.IO event handler and every server broadcast is reachable by an unauthenticated client that
    can open a TCP connection to port 3000.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: A CORS origin of `http://localhost:4200` is configured on the Socket.IO server. This restricts browser-based
    cross-origin connections only — it is not an authentication control and is bypassed by any non-browser client. No handshake
    authentication, no per-socket identity.
  mitigation_title: Add a Socket.IO handshake middleware that verifies the session JWT before accepting a connection
  remediation:
    effort: Medium
    steps:
    - Register an `io.use((socket, next) => ...)` middleware in `lib/startup/registerWebsocketEvents.ts` before `io.on('connection')`,
      and reject the handshake with `next(new Error('unauthorized'))` when no valid token is present.
    - Verify the token with the same routine the REST tier uses (`security.verify()` / the expressJwt public key in `lib/insecurity.ts`)
      so the WebSocket and HTTP legs cannot diverge; read it from `socket.handshake.auth.token` rather than a query string
      so it does not land in access logs.
    - Attach the decoded principal to `socket.data.user` and make every event handler read the actor from `socket.data.user`
      instead of trusting the payload.
    - 'Update the Angular client to pass the token via `io(url, { auth: { token } })` so authenticated users keep working
      after the middleware is enforced.'
    code_example: "// Before: any client that completes the upgrade gets a socket\n// io.on('connection', (socket) => { ...\
      \ })\n\n// After: the handshake fails closed when the JWT is absent or invalid\nio.use((socket, next) => {\n  const\
      \ token = sock**** (28 chars)\n  const user = token ? security.verify(token) && security.decode(token) : null\n\
      \  if (!user) { return next(new Error('unauthorized')) }  // no identity -> no socket\n  socket.data.user = user\n \
      \ next()\n})\n\nio.on('connection', (socket) => { /* socket.data.user is now trustworthy */ })"
    verification: Run `npx socket.io-client ws://localhost:3000` (or a 5-line node script using `io('http://localhost:3000')`
      with no `auth` option) and assert the client receives a `connect_error` with message `unauthorized` and never a `connect`
      event. Repeat with a valid login JWT in `auth.token` and assert `connect` fires.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html#websockets
