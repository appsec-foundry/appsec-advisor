  stride: Spoofing
  cwe: CWE-321
  title: Hard-coded RSA private signing key (lib/insecurity.ts:21)
  scenario: An attacker who reads the public repository copies the RSA private key literal embedded in lib/insecurity.ts:21
    and calls jwt.sign with it offline, producing tokens indistinguishable from those issued by security.authorize(). The
    same key is also the HMAC secret for deluxeToken(), so the attacker can additionally forge the deluxe membership proof
    that isDeluxe() checks.
  attack_steps:
  - I copy the PEM private key literal from lib/insecurity.ts:21 in the published source tree.
  - I sign an RS256 token with payload data.role=admin and data.id set to the victim account id.
  - I present that token to /rest/user/data-export and export another customer's personal data as if I were them.
  evidence_summary: lib/insecurity.ts:21 assigns a full RSA private key as a string literal in tracked source; lib/insecurity.ts:54
    signs all session tokens with it.
  impact_description: Anyone with repository access can mint valid sessions for any user or role indefinitely, and key rotation
    requires a code change and redeploy.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — the signing key is a source literal with no external configuration path
  mitigation_title: Load the JWT signing key from external secret configuration
  remediation:
    effort: Medium
    steps:
    - Replace the literal in lib/insecurity.ts:21 with a required read of a key path or secret-manager reference, and fail
      startup when it is absent.
    - Rotate the current key pair, invalidate existing sessions, and add a startup test asserting the process exits when the
      key variable is unset.
    code_example: null
    verification: Start the server with the key variable unset and assert a non-zero exit; grep the repository for '-----BEGIN
      RSA PRIVATE KEY-----' and expect zero hits.
    reference: 'CWE-321: Use of Hard-coded Cryptographic Key'
