  title: SQL Injection (routes/login.ts:34)
  affected_parameter: email
  scenario: 'The login handler builds its credential lookup by string interpolation: the raw `req.body.email` value is pasted
    into a `SELECT * FROM Users WHERE email = ''...'' AND password = ''...''` statement and executed through Sequelize''s
    raw-query API with `plain: true`. An unauthenticated attacker posting `{"email": "'' OR 1=1--", "password": "x"}` to POST
    /rest/user/login terminates the email literal and comments out the entire password comparison, so the query returns the
    first row of the Users table. The handler then treats that row as a verified user and calls `security.authorize()` on
    it, minting a signed 6-hour RS256 JWT for whichever account is returned — in the seeded dataset, the admin. The same primitive
    supports UNION-based extraction of every column of the Users table, including the MD5 password hashes and TOTP secrets.'
  attack_steps:
  - 'An attacker posts to `/rest/user/login` with the body `{"email": "'' OR 1=1--", "password": "anything"}`.'
  - The interpolated statement drops the password comparison, returns the first Users row, and the handler mints a signed
    JWT for that account.
  - The attacker replays the returned token against administrative endpoints and, using `UNION SELECT`, dumps every user's
    email, role, password hash, and TOTP secret.
  evidence_summary: '`routes/login.ts:34` interpolates `req.body.email` directly into the WHERE clause of a raw SQL statement
    instead of passing it as a bind parameter.'
  impact_description: Any internet client authenticates as an arbitrary account — including admin — without knowing a password,
    and can read the full Users table.
  likelihood: High
  impact: Critical
  risk: Critical
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  controls_in_place: None. The route is registered without authentication, without a schema validator, and without a rate
    limiter; the only handling of `req.body.email` is the `|| ''` empty-string default on line 34.
  mitigation_title: Replace the interpolated login lookup in routes/login.ts with a parameterized Sequelize query
  remediation:
    effort: Low
    steps:
    - 'Replace the raw `models.sequelize.query` call at routes/login.ts:34 with `UserModel.findOne({ where: { email: req.body.email,
      password: security.hash(req.body.password), deletedAt: null } })`, which emits bind parameters instead of a concatenated
      string.'
    - 'If a raw query must be kept, pass `{ replacements: { email: req.body.email, password: hashed }, type: QueryTypes.SELECT
      }` and use `:email` / `:password` placeholders — never template literals.'
    - Add an express-validator or zod schema in front of the route that rejects any `email` that is not a syntactically valid
      address and any `password` longer than 72 bytes.
    - Grep the repository for remaining `sequelize.query(` call sites that embed `req.` values and convert each to bind parameters.
    code_example: "// Before — req.body.email is concatenated into the statement\n// models.sequelize.query(`SELECT * FROM\
      \ Users WHERE email = '${req.body.email}' ...`)\n\n// After — Sequelize binds the value, so quotes in it can never end\
      \ the literal\nconst user = await UserModel.findOne({\n  where: {\n    email: req.body.email,\n    password: security.hash(req.body.password\
      \ ?? ''),\n    deletedAt: null\n  }\n})"
    verification: POST /rest/user/login with `{"email":"' OR 1=1--","password":"x"}` must return HTTP 401 'Invalid email or
      password.' and must not return an `authentication.token`. Add this as a regression test in test/api/loginApiSpec.ts.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
