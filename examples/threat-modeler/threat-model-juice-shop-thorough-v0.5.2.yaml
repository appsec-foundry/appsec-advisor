- id: M-001
  title: Hash passwords with a strong, salted algorithm
  threat_ids:
  - T-001
  priority: P1
  severity: Critical
  effort: Medium
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Replace the MD5 password setter in models/user.ts with an argon2id beforeSave h…
  steps:
  - Add `argon2` as a dependency and delete the synchronous `set (clearTextPassword)` block on the `password` attribute at
    models/user.ts:73-77 — a Sequelize setter cannot await, which is what forced the synchronous MD5 call in the first place.
  - Hash in an async `beforeSave` hook guarded by `user.changed('password')`, using `argon2id` with at least 19 MiB memory
    cost and a per-password salt (argon2 embeds the salt in the encoded digest, so no schema column is needed).
  - Widen the `password` column to `DataTypes.STRING(255)` so the ~97-byte encoded argon2 digest is not silently truncated,
    and reject inputs over 128 bytes before hashing to bound work per request.
  - 'Add a login-time rehash path: when a stored digest is a 32-character hex string (a legacy MD5 row), verify against MD5
    once, then immediately re-store the argon2id digest and force a password change for that account.'
  code_example: "// models/user.ts — Before: synchronous, unsalted, GPU-crackable\n// password: { type: DataTypes.STRING,\
    \ set (p: string) { this.setDataValue('password', security.hash(p)) } }\n\n// After: plain column + async hook, so a memory-hard\
    \ KDF with a per-password salt can be awaited\npassword: { type: DataTypes.STRING(255) },\n\nUser.addHook('beforeSave',\
    \ async (user: User) => {\n  if (!user.changed('password')) return\n  user.setDataValue('password', await argon2.hash(user.password,\
    \ { type: argon2.argon2id, memoryCost: 19456 }))\n})"
  verification: 'Register a user with password `admi**** (8 chars)`, then read the row: the stored value must start with `$argon2id$`
    and must differ between two accounts that share that password. Assert in CI that `SELECT password FROM Users` returns
    no value matching `^[0-9a-f]{32}$`.'
  reference: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
  file: models/user.ts:76
