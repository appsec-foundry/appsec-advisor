  cwe: CWE-158
  title: Null-byte bypass of ftp extension allow-list (routes/fileServer.ts:28)
  affected_parameter: :file
  scenario: servePublicFiles() validates the requested filename against an allow-list of .md and .pdf at routes/fileServer.ts:27,
    and only afterwards, on line 28, calls security.cutOffPoisonNullByte(file), which truncates the string at the first %00
    (lib/insecurity.ts:44-49). Validation therefore runs on the pre-truncation string and the filesystem read on line 33 runs
    on the post-truncation string, so the two disagree by construction. A request for /ftp/incident-support.kdbx%2500.md satisfies
    the allow-list as '...kdbx%00.md' and then resolves to ftp/incident-support.kdbx. The ftp/ directory holds a KeePass database
    (incident-support.kdbx), a full package-lock.json.bak dependency inventory, a compiled encrypt.pyc, and coupons_2013.md.bak
    - none of which the .md/.pdf policy is meant to release. The route requires no authentication, and serveIndex on server.ts:269
    publishes the directory listing that tells the attacker exactly which names to ask for.
  attack_steps:
  - An attacker browses `/ftp`, whose directory listing is published by `serveIndex`, and reads the names of the non-public
    files stored there.
  - The attacker requests `/ftp/incident-support.kdbx%2500.md`, so the allow-list on line 27 sees a `.md` suffix and admits
    the request.
  - '`cutOffPoisonNullByte` on line 28 truncates the name at the null byte, and line 33 sends `ftp/incident-support.kdbx`
    in the response.'
  - The attacker repeats this for `package.json.bak` and `encrypt.pyc` to collect the remaining non-public files.
  evidence_summary: The extension allow-list is evaluated on line 27 before cutOffPoisonNullByte rewrites the filename on
    line 28, so the validated string and the string passed to res.sendFile on line 33 are different values.
  impact_description: Any unauthenticated visitor can download every file in ftp/ regardless of extension, including the KeePass
    database and the dependency-inventory backup.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Partial - a forward-slash check on line 18 blocks directory traversal, and an .md/.pdf allow-list exists
    on line 27 but is evaluated against the untruncated name.
  mitigation_title: Reject filenames containing encoded null bytes and validate after canonicalisation
  remediation:
    effort: Low
    steps:
    - Reject the request outright when the raw `params.file` contains `%00` or a literal NUL, instead of silently truncating
      it in cutOffPoisonNullByte.
    - Reorder routes/fileServer.ts so canonicalisation happens first and endsWithAllowlistedFileType() is evaluated on the
      exact string later passed to res.sendFile.
    - Serve ftp/ from a directory that contains only the files intended for public release; move incident-support.kdbx, the
