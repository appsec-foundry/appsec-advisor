  title: Checkout Object References Held in sessionStorage
  affected_parameter: paymentId
  scenario: 'The entire checkout request is assembled from values the user can edit. `order-summary.component.ts:75-79` builds
    `orderDetails` from `sessionStorage.getItem(''paymentId'')`, `''addressId''`, and `''deliveryMethodId''`, then calls `basketService.checkout(Number(sessionStorage.getItem(''bid'')),
    btoa(sessionStorage.getItem(''couponDetails'')), orderDetails)`. Each of those keys is a bare primary key with no binding
    to the caller: `bid` is written at `login.component.ts:105` from the login response, the rest at `address.component.ts:83`
    and the payment screen. Two effects follow. First, `ngOnInit` at line 47 and line 55 fetches and renders whatever `addressId`
    and `paymentId` are present — line 57 prints the last four digits of the card returned by `paymentService.getById()` —
    so substituting another user''s id turns the order-summary screen into a read primitive for foreign addresses and card
    fragments. Second, `placeOrder()` submits the substituted ids as the order''s payment and delivery instruments, and it
    submits `bid` as the basket to check out; `routes/order.ts:34` takes that basket id straight from `req.params.id` and
    `routes/basket.ts:18` does the same, so the server keys on the client''s number rather than on the session''s own basket.'
  attack_steps:
  - An attacker authenticates normally and opens the checkout flow so the SPA populates `sessionStorage`.
  - The attacker edits `sessionStorage.paymentId`, `addressId`, or `bid` in the browser console to an id belonging to another
    user.
  - The attacker reloads the order-summary route, where `order-summary.component.ts:47` and `:55` render the other user's
    address and card fragment.
  - The attacker submits the order, and `placeOrder()` at line 79 sends the foreign ids to the checkout endpoint, which resolves
    them without checking ownership.
  evidence_summary: '`order-summary.component.ts:75-79` builds every checkout parameter — `paymentId`, `addressId`, `deliveryMethodId`,
    `bid`, `couponDetails` — from `sessionStorage`, with no server-issued token binding those ids to the caller.'
  impact_description: An authenticated user reads other users' saved addresses and card fragments and can place orders against
    a basket, address, and payment instrument that are not their own.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: The `Authorization` bearer token is attached to each of these calls by `request.interceptor.ts:16`, so
    the caller is authenticated. Nothing ties the authenticated identity to the object ids the SPA supplies; `routes/order.ts:34`
    and `routes/basket.ts:18` both read the basket id from the request path.
  mitigation_title: Resolve checkout objects from the server-side session instead of client-held ids
  remediation:
    effort: Medium
    steps:
    - 'Keep the in-progress order server-side: create a checkout session on the server when the flow starts and have the SPA
      reference it by an opaque id, rather than carrying `bid`, `paymentId`, `addressId`, and `deliveryMethodId` in `sessionStorage`.'
    - Add an ownership predicate to every read the flow makes — `addressService.getById`, `paymentService.getById`, `deliveryService.getById`
      — so the API filters on `UserId` from the verified token and returns 403 for foreign ids.
    - Derive the basket id server-side from the authenticated user in `routes/basket.ts` and `routes/order.ts` instead of
      `req.params.id`.
    - Compute the promotional discount server-side at checkout; do not accept `couponDetails` or the `couponDiscount` percentage
      that `order-summary.component.ts:69` reads from `sessionStorage`.
    code_example: '// Before (frontend/src/app/order-summary/order-summary.component.ts:74-79)

      // const orderDetails = {

      //   paymentId: sessionStorage.getItem(''paymentId''),

      //   addressId: sessionStorage.getItem(''addressId''),

      //   deliveryMethodId: sessionStorage.getItem(''deliveryMethodId'')

      // }

      // this.basketService.checkout(Number(sessionStorage.getItem(''bid'')), btoa(sessionStorage.getItem(''couponDetails'')),
      orderDetails)


      // After: the server owns the checkout session; the SPA only confirms it

      this.basketService.confirmCheckout(this.checkoutSessionId).subscribe(...)


      // Express side — ids are resolved against the token, never against the body

      const basket = await BasketModel.findOne({ where: { UserId: req.user.id } })

      const card = await CardModel.findOne({ where: { id: body.paymentId, UserId: req.user.id } })

      if (!card) return res.sendStatus(403)'
    verification: As user A, set `sessionStorage.paymentId` to a card id belonging to user B and load `/order-summary`; assert
      the API returns 403 and no card digits render. Add an API test that checkout with a foreign `bid` returns 403 rather
      than an order confirmation.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
