  cwe: CWE-918
  title: Server-Side Request Forgery (routes/profileImageUrlUpload.ts:24)
  affected_parameter: imageUrl
  scenario: 'The profile-image-by-URL handler fetches whatever URL the request body carries: `const url = req.body.imageUrl`
    at line 19 followed by `await fetch(url)` at line 24. No scheme allowlist, host allowlist, DNS resolution check, or redirect
    limit is applied, so the request originates from inside the application''s network position. An authenticated user can
    therefore reach cloud instance metadata endpoints, container-internal services, and any host reachable from the API that
    is not reachable from the internet. The response body is streamed to disk under `frontend/dist/.../uploads/<userId>.<ext>`
    and served back as the user''s profile image, which turns the SSRF into a read primitive rather than a blind one. On fetch
    failure the handler falls back to storing the raw URL as the profile image (line 36), which is itself the value interpolated
    into the Content-Security-Policy header at routes/userProfile.ts:88.'
  evidence_summary: routes/profileImageUrlUpload.ts:24 calls `fetch(url)` on the unvalidated `req.body.imageUrl` value read
    at line 19.
  impact_description: An authenticated user makes the server issue arbitrary outbound requests and retrieves the responses,
    exposing internal services and metadata credentials.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None on the request itself. The extension check at line 28 only decides the stored filename suffix and
    does not constrain the destination.
  mitigation_title: Restrict profile image fetches to an https allowlist with resolved-IP checks
  remediation:
    effort: Medium
    steps:
    - Parse the URL and reject anything whose protocol is not `https:` before calling fetch.
    - Resolve the hostname and reject private, loopback, link-local and unique-local address ranges, re-checking after every
      redirect; cap redirects at zero or one.
    - Set an explicit fetch timeout and a maximum response size, and verify the response `Content-Type` is an image type before
      writing to disk.
    - Remove the fallback at line 36 that stores an unvalidated URL as the profile image, since that value is later interpolated
      into a CSP header.
    code_example: '// Before - routes/profileImageUrlUpload.ts:24: the server fetches any URL the client names

      // const response = await fetch(url)


      // After: scheme check plus resolved-address check before the request is made

      const parsed = new URL(url)

      if (parsed.protocol !== ''https:'') throw new Error(''unsupported scheme'')

      const { address } = await dns.promises.lookup(parsed.hostname)

      if (ipaddr.parse(address).range() !== ''unicast'') throw new Error(''blocked target'')

      const response = await fetch(parsed, { redirect: ''error'', signal: AbortSignal.timeout(5000) })'
    verification: POST `{"imageUrl":"http://169.254.169.254/latest/meta-data/"}` to `/profile/image/url` and assert HTTP 4xx,
      that no outbound request was made, and that the stored `profileImage` is unchanged.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
  evidence:
  - file: routes/profileImageUrlUpload.ts
    line: 24
  boundary_refs:
