  title: Unverified Password Change (routes/changePassword.ts:39)
  scenario: 'The password-change handler makes the current-password check conditional on the client having sent one: `if (currentPassword
    && security.hash(currentPassword) !== loggedInUser.data.password)`. When `current` is simply omitted from the query string
    the condition short-circuits and the update at line 51 proceeds, so possession of a bearer token alone is sufficient to
    set a new password. That removes the last barrier that would otherwise contain a stolen or forged token — and this component
    offers several ways to obtain one, including the algorithm-confusion path at lib/insecurity.ts:52. The endpoint is additionally
    registered as a GET (server.ts:597), so the new password travels in the URL and is written to the access log that routes/logfileServer.ts:14
    serves to anonymous callers.'
  evidence_summary: routes/changePassword.ts:39 guards the current-password comparison with `if (currentPassword && ...)`,
    so omitting the parameter skips verification entirely.
  impact_description: Anyone holding a session token can permanently take over the account by resetting its password without
    knowing the old one.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: A token lookup (routes/changePassword.ts:33) and a new-password repeat match. Neither re-establishes
    that the caller knows the existing credential.
  mitigation_title: Require the current password unconditionally and move the change endpoint to POST
  remediation:
    effort: Low
    steps:
    - Reject the request with HTTP 401 when `current` is absent, before any comparison, so the check cannot be skipped by
      omission (routes/changePassword.ts:39).
    - Compare the supplied current password with a constant-time function against the stored hash rather than a plain string
      inequality.
    - Re-register the endpoint as `POST /rest/user/change-password` reading from the request body, so credentials leave the
      URL and the access log.
    - Invalidate all existing sessions for the user after a successful password change, including the entry in `authenticatedUsers`.
    code_example: "// Before - routes/changePassword.ts:39: the check applies only if the client opts in\n// if (currentPassword\
      \ && security.hash(currentPassword) !== loggedInUser.data.password) { ... }\n\n// After: the current password is mandatory\n\
      if (!currentPassword || !crypto.timingSafeEqual(\n  Buffer.from(security.hash(currentPassword)),\n  Buffer.from(loggedInUser.data.password)\n\
      )) {\n  return res.status(401).send(res.__('Current password is not correct.'))\n}"
    verification: With a valid token, call the change-password endpoint supplying only `new` and `repeat` and assert HTTP
      401 and that the stored password digest is unchanged.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
