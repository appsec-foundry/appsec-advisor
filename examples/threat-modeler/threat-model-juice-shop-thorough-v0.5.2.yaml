- local_id: ci-cd-pipeline-009
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-284
  title: Default-scope GITHUB_TOKEN passed to action (image_actions.yml:35)
  scenario: An attacker controlling the calibreapp/image-actions code uses the GITHUB_TOKEN handed to that step to write repository
    contents, packages, or releases, because neither image_actions.yml nor ci.yml declares a `permissions:` block, so every
    job inherits the repository default token scope instead of the read-only minimum each job needs.
  attack_steps:
  - I get my code into a step that receives GITHUB_TOKEN, for example through the mutable @main action reference.
  - I call the GitHub API with that token, which carries whatever default scope the repository grants rather than a per-job
    least-privilege set.
  - I push a commit or publish a package under the repository's own identity from inside the runner.
  evidence_summary: image_actions.yml passes secrets.GITHUB_TOKEN into the third-party Compress Images step and also creates
    pull requests with it; no `permissions:` key exists at workflow or job level in image_actions.yml or ci.yml, which passes
    the same token at lines 190, 253, and 389.
  impact_description: A single compromised step gains repository write authority — code, packages, and releases — turning
    any action or dependency compromise into trunk and artifact tampering.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: image_actions jobs are restricted to the upstream repository and non-fork pull requests; branch protection
    on master is assumed but not observable in workflow source.
  mitigation_title: Declare least-privilege permissions blocks in image_actions.yml and ci.yml
  remediation:
    effort: Low
    steps:
    - 'Add a top-level `permissions: contents: read` to both workflows and grant `contents: write` / `pull-requests: write`
      only on the jobs that create commits or pull requests.'
    - Set the repository-wide default workflow token permission to read-only so a new workflow without a permissions block
      cannot inherit write scope.
    code_example: null
    verification: 'Inspect a completed run''s `Set up job` log and confirm the GITHUB_TOKEN permissions list shows `contents:
      read` for jobs that do not write, then confirm the create-pull-request job still succeeds with its explicit grant.'
    reference: 'CWE-284: Improper Access Control'
