- local_id: ci-cd-pipeline-007
  threat_category_id: TH-16
  stride: Repudiation
  cwe: CWE-778
  title: Unattributed Automated Commits to Protected Branch
  scenario: 'Three workflows write to branches directly from CI under a shared bot identity, and none of them signs the resulting
    commit. `.github/workflows/frontend-bundle-analysis.yml:59-66` configures `user.name "GitHub Action"`, checks out master
    and runs `git push origin master` — with `continue-on-error: true` at line 67, so a failed or rejected push leaves no
    red build. `.github/workflows/lint-fixer.yml:22` and the four `update-*` workflows commit as `JuiceShopBot` via git-auto-commit-action.
    The only integrity marker used is `commit_options: ''--signoff''`, which is an unverified text trailer, not a cryptographic
    signature, and no workflow configures a GPG or SSH signing key. When a commit later turns out to be malicious, the audit
    trail cannot distinguish a legitimate bot run from an attacker who obtained the same token, and the `continue-on-error`
    push hides the attempt entirely.'
  evidence_summary: 'A search for signing configuration across `.github/workflows/` returns only `commit_options: ''--signoff''`
    trailers; no `crazy-max/ghaction-import-gpg`, `gpg` key import, or `commit.gpgsign` setting exists.'
  impact_description: Commits reaching master carry no verifiable authorship, so a token-theft-driven commit is indistinguishable
    from a legitimate automated one.
  likelihood: Medium
  impact: Medium
  risk: Medium
  actor_ids:
  - ACT-D-06
  primary_actor: ACT-D-06
  controls_in_place: Commits carry DCO `--signoff` trailers and a consistent JuiceShopBot author identity in the git-auto-commit
    workflows; pr-compliance.yml enforces DCO sign-off on human contributions.
  mitigation_title: Sign bot commits with a GPG key and fail the bundle-analysis push loudly
  remediation:
    effort: Medium
    steps:
    - Import a dedicated bot GPG key in each committing workflow (`crazy-max/ghaction-import-gpg`, SHA-pinned) and set `git
      config commit.gpgsign true`, so GitHub marks the commits Verified and a token alone cannot forge them.
    - 'Remove `continue-on-error: true` from `.github/workflows/frontend-bundle-analysis.yml:67` so a rejected or failed push
      to master surfaces as a failed run.'
    - Replace the direct `git push origin master` at line 66 with a pull request via `peter-evans/create-pull-request`, keeping
      branch protection and review in the path for every automated change.
    - Enable branch protection on master requiring signed commits, which turns the signing control into an enforced gate rather
      than a convention.
    code_example: "- name: \"Import bot GPG key\"\n  uses: crazy-max/ghaction-import-gpg@<40-hex-sha> #v6.2.0\n  with:\n \
      \   gpg_private_key: ${{ secrets.BOT_GPG_KEY }}\n    passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}\n    git_user_signingkey:\
      \ true\n    git_commit_gpgsign: true\n# Before: continue-on-error: true swallowed a failed push to master\n- name: \"\
      Commit screenshot\"\n  run: git commit -S -s -m \"Update bundle analysis screenshot\" && git push origin master"
    verification: Trigger the bundle-analysis workflow via workflow_dispatch and confirm the resulting commit shows GitHub's
      `Verified` badge; then revoke the push permission and confirm the run fails rather than reporting success.
    reference: CWE-778
  evidence:
  - file: .github/workflows/frontend-bundle-analysis.yml
    line: 66
  evidence_check: verified
