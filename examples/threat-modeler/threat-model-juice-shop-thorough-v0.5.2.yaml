  title: Server-Side Template Injection (routes/userProfile.ts:61)
  scenario: 'The profile page renderer treats a stored username as executable code. When the username matches `#{...}`, routes/userProfile.ts:56
    extracts the inner substring and line 61 passes it to `eval`, so the expression runs in the API process with full module
    scope. The username reaches the database through the user''s own profile update, which means the attacker controls both
    the trigger and the payload and needs only their own account. Whatever the expression returns is then substituted into
    the Pug template at line 73 and compiled at line 87, giving a second injection stage: template directives in the returned
    string are interpreted by Pug rather than escaped. The handler also weakens its own response headers, emitting a CSP at
    line 88 that interpolates the user-controlled `profileImage` value and enables `unsafe-eval`.'
  attack_steps:
  - An attacker sets their profile username to `#{process.env.JWT_PRIVATE_KEY}` or a similar Node expression through `POST
    /profile`.
  - The attacker then requests `GET /profile`, which matches the `#{...}` pattern and evaluates the inner expression server-side.
  - The evaluated result is substituted into the Pug template and returned in the rendered page, so the attacker reads process
    state directly.
  - The attacker escalates by returning a payload whose text is itself a Pug directive, which the subsequent compile step
    executes.
  evidence_summary: routes/userProfile.ts:61 calls `eval(code)` on a substring of the stored username, and line 73 splices
    the result into the Pug source compiled at line 87.
  impact_description: A registered user runs arbitrary server-side expressions and reads process environment and application
    state through the rendered profile page.
  likelihood: Medium
  impact: Critical
  risk: High
  controls_in_place: The username setter at models/user.ts:47-54 applies HTML sanitisation, which strips markup but leaves
    `#{...}` untouched because it is not HTML.
  mitigation_title: Remove eval from the profile renderer and bind the username as template data
  remediation:
    effort: Low
    steps:
    - Delete the `#{...}` branch and the `eval(code)` call at routes/userProfile.ts:54-64.
    - Stop building the template by string replacement; compile `views/userProfile.pug` once and pass `{ username, emailHash,
      theme }` as locals so Pug escapes them.
    - Emit a static Content-Security-Policy that does not interpolate `user.profileImage` and does not include `unsafe-eval`
      (routes/userProfile.ts:88).
    - Add an ESLint rule failing the build on `no-eval` outside test fixtures.
    code_example: '// Before - routes/userProfile.ts:61: stored profile text is executed

      // username = eval(code)


      // After: the username is data passed to a precompiled template

      const fn = pug.compileFile(''views/userProfile.pug'')

      res.set(''Content-Security-Policy'', "default-src ''self''; script-src ''self''")

      res.send(fn({ username: user.username, emailHash: security.hash(user.email) }))'
    verification: Set a username of `#{1+1}`, request `/profile`, and assert the page renders the literal `#{1+1}` rather
      than `2`. Assert the response CSP header contains no `unsafe-eval`.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
