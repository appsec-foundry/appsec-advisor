  - I call PUT /rest/order-history/1/delivery-status with the forged bearer token and the accounting-only guard admits me.
  - I keep the forged token for six hours of full administrative API access without ever holding a password.
  evidence_summary: 'lib/insecurity.ts:52 passes only { secret: publicKey } to expressJwt; no algorithms allowlist restricts
    the accepted signature type.'
  impact_description: Complete authentication bypass across every JWT-protected REST route, including accounting-only order
