tier_root_causes:
  edge:
  - Account credentials derived in browser code from public identity attributes
  - Session tokens persisted in script-readable storage instead of cookies
  - Route-parameter data bound to the DOM through an explicit sanitizer bypass
  - Federated tokens accepted from the URL without state, issuer or audience checks
  - Client-side loops and socket handshakes run with no timeout or credential
  server:
  - Request data interpolated into SQL, filesystem paths and model prompts
  - Token signatures verified with no pinned algorithm, key or revocation state
  - Signing keys, HMAC keys and test credentials embedded as source literals
  - Route registration omits the authorization guard and the rate limiter
  - CI jobs resolve actions, base images and dependencies from mutable refs
  data:
  - Model setters accept privileged attributes straight from the request body
  - Seed data ships fixed credentials that are identical in every deployment
  - Secrets persisted in cleartext or under one shared, unsalted hash key
  - Free-text columns persisted without length or content validation
  - Sensitive field values interpolated into log and error message text
