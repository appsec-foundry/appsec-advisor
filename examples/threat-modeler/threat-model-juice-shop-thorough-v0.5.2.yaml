  title: Data-Export Throttle Enforced in localStorage (data-export.component.ts:48)
  affected_parameter: lstdtxprt
  scenario: 'The only anti-automation control on the personal-data export is a timestamp the user owns. `needCaptcha()` at
    `data-export.component.ts:47-53` reads `localStorage.lstdtxprt`, and only if the last successful export was less than
    300000 ms ago does it call `getNewCaptcha()` and set `presenceOfCaptcha`; `save()` at line 66 then attaches `dataRequest.answer`
    only when that flag is set. The flag is written by the client itself at line 73. Deleting the key — or simply never letting
    the SPA set it — means no captcha is requested and none is sent. There is no server-side counterpart: `server.ts:621`
    wires `/rest/user/data-export` with `security.appendUserId()` and `dataExport()` only, with no `verifyImageCaptcha` middleware,
    and the shared verifier at `routes/imageCaptcha.ts:52` would pass anyway because `!captchas[0]` short-circuits to `next()`
    when no captcha row was issued for the user. Each unthrottled call runs a Sequelize query plus two MongoDB collection
    scans (`routes/dataExport.ts:27-44`) and returns the caller''s full memories, orders, and reviews, so a script can loop
    the endpoint to burn database capacity and to poll for freshly written records.'
  attack_steps:
  - An attacker authenticates and calls `localStorage.removeItem('lstdtxprt')` so the SPA never marks a captcha as required.
  - The attacker posts to `/rest/user/data-export` in a loop with no `answer` field, and `routes/imageCaptcha.ts:52` is never
    reached because the route carries no captcha middleware.
  - Each request runs the full export — one Sequelize query and two MongoDB collection reads — so the loop consumes database
    capacity for as long as the attacker sustains it.
  evidence_summary: '`data-export.component.ts:48` decides whether a captcha is needed from the client-written `localStorage.lstdtxprt`
    value, and `server.ts:621` registers the export route without any captcha or rate-limit middleware.'
  impact_description: An authenticated caller runs the export endpoint without limit, each call triggering three database
    reads that return the caller's complete stored data.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: '`security.appendUserId()` on `server.ts:621` restricts the export to authenticated callers and scopes
    the result to their own records. No rate limit, captcha, or lockout applies to the route, and the SPA''s five-minute gate
    lives entirely in `localStorage`.'
  mitigation_title: Enforce the data-export captcha and rate limit server-side
  remediation:
    effort: Low
    steps:
    - Insert `verifyImageCaptcha` into the `/rest/user/data-export` middleware chain at `server.ts:621` so the answer is checked
      before `dataExport()` runs.
    - 'Change `routes/imageCaptcha.ts:52` to fail closed: a missing captcha row must reject the request rather than fall through
      to `next()`, otherwise skipping the captcha request bypasses the check.'
    - Add an `express-rate-limit` instance keyed on the authenticated user id to the export route — a few requests per hour
      matches the intent of the existing five-minute gate.
    - Keep the SPA's `needCaptcha()` behaviour as a UX hint only, and stop treating `localStorage.lstdtxprt` as the record
      of the last export; have the server return the last-export timestamp.
    code_example: '// server.ts:621 — Before: no captcha, no rate limit

      // app.post(''/rest/user/data-export'', security.appendUserId(), utils.asyncHandler(dataExport()))


      // After

      const exportLimiter = rateLimit({ windowMs: 60 * 60 * 1000, max: 5, keyGenerator: (req) => String(req.user?.id) })

      app.post(''/rest/user/data-export'', security.appendUserId(), exportLimiter, verifyImageCaptcha, utils.asyncHandler(dataExport()))


      // routes/imageCaptcha.ts:52 — fail closed when no captcha was issued

      if (captchas[0] && req.body.answer === captchas[0].answer) { next() } else { res.status(401).send(...) }'
    verification: Clear `localStorage.lstdtxprt`, then post to `/rest/user/data-export` six times in a minute without an `answer`
      field and assert requests are rejected with 401 (missing captcha) and then 429 (rate limit). Add an API test that an
      export request omitting `answer` never returns user data.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
