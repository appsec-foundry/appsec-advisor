  cwe: CWE-287
  title: Partial-Authentication Token Accepted As Session (routes/login.ts:41)
  scenario: 'When a user has a TOTP secret, the login handler answers 401 but still returns a `tmpToken` produced by `security.authorize()`
    — the same signing function, the same RS256 key, and the same six-hour expiry as a full session token. The only thing
    distinguishing it is a `type` claim in the payload, and that claim is checked in exactly one place: routes/2fa.ts:22.
    The shared authorization middleware `security.isAuthorized()` validates the signature alone and inspects no claim, so
    any route that relies on that middleware without also resolving the caller through `authenticatedUsers` accepts the pre-authentication
    token as a full session. An attacker who knows only the victim''s password — the first factor — thereby reaches protected
    functionality without ever supplying the TOTP code the second factor was added to require.'
  attack_steps:
  - An attacker submits the victim's correct password to `/rest/user/login` for a 2FA-protected account and receives a 401
    carrying a `tmpToken`.
  - 'The attacker presents that `tmpToken` as `Authorization: Bearer` against routes protected only by the shared signature-checking
    middleware.'
  - The middleware validates the signature and ignores the `type` claim, so the attacker operates with the victim's identity
    without ever entering a TOTP code.
  evidence_summary: '`routes/login.ts:41` mints the second-factor placeholder with the same `security.authorize()` call used
    for full sessions, distinguished only by a payload claim no middleware reads.'
  impact_description: The second authentication factor is reduced to an optional step for any endpoint that checks the signature
    but not the token type.
  likelihood: Medium
  impact: Critical
  risk: High
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  controls_in_place: The 2FA verification handler checks `type !== 'password_valid_needs_second_factor_token'` at routes/2fa.ts:22,
    but that check exists only on that one route. The token's short-lived intent is not expressed in its lifetime, which matches
    a full session at six hours.
  mitigation_title: Issue the second-factor placeholder as a distinct short-lived token and enforce its type in middleware
  remediation:
    effort: Medium
    steps:
    - 'Mint the `tmpToken` with a separate signing key or a distinct `audience` claim (`aud: ''2fa-challenge''`) so a token
      intended for the challenge cannot validate against the session audience.'
    - Set its expiry to the length of the challenge window — 5 minutes — instead of inheriting the six-hour session lifetime.
