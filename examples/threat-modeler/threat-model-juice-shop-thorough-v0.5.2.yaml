  title: XML external entity expansion on upload (routes/fileUpload.ts:76)
  affected_parameter: uploaded .xml document
  scenario: 'handleXmlUpload passes the raw uploaded buffer to parseXmlString at routes/fileUpload.ts:76. lib/xml.ts:36 configures
    libxml2 with XML_PARSE_NOENT | XML_PARSE_DTDLOAD and lib/xml.ts:22 calls xmlRegisterFsInputProviders(), which grants the
    WASM parser host filesystem access. An uploaded document declaring <!ENTITY xxe SYSTEM "file:///etc/passwd"> therefore
    has the entity substituted during parsing. The parsed result is not discarded: line 79 embeds utils.trunc(xmlString, 400)
    directly into the Error message handed to next(), so the first 400 characters of the resolved entity are returned to the
    uploader in the error response body. Because the same parser accepts http:// and ftp:// system identifiers, the same request
    doubles as a server-side request forgery primitive against services reachable from the application host. The endpoint
    is anonymous, so this is a pre-auth read primitive.'
  attack_steps:
  - An attacker POSTs an XML file to `/file-upload` whose DOCTYPE declares `<!ENTITY xxe SYSTEM "file:///etc/passwd">` and
    whose root element references `&xxe;`.
  - libxml2 substitutes the entity because `XML_PARSE_NOENT | XML_PARSE_DTDLOAD` is set and the filesystem input provider
    is registered.
  - Line 79 embeds the substituted document into the 410 error message, returning up to 400 characters of `/etc/passwd` in
    the HTTP response body.
  - The attacker repeats the request with an `http://` system identifier to reach internal-only services from the application
    host.
  evidence_summary: routes/fileUpload.ts:76 parses attacker XML through lib/xml.ts, which enables XML_PARSE_NOENT and XML_PARSE_DTDLOAD
    and registers a host filesystem input provider.
  impact_description: An unauthenticated uploader reads arbitrary local files back out of the error response and can pivot
    to internal HTTP endpoints from the server.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Partial - the parse runs inside a vm context with a 2000 ms timeout, which bounds entity-expansion bombs
    but does nothing to prevent entity resolution or disclosure.
  mitigation_title: Disable DTD loading and entity substitution in the XML upload parser
  remediation:
    effort: Low
    steps:
    - Remove `XML_PARSE_NOENT` and `XML_PARSE_DTDLOAD` from the option mask in lib/xml.ts:36, and add `XML_PARSE_NONET` so
      network system identifiers are refused.
    - Do not register `xmlRegisterFsInputProviders()` (lib/xml.ts:22) in any build that serves untrusted uploads - it is what
      grants the WASM sandbox host file access.
    - Stop echoing parsed document content into the error message at routes/fileUpload.ts:79; return a fixed rejection string
      and log the detail server-side only.
    - Reject documents containing a DOCTYPE declaration before parsing, since the upload feature has no legitimate need for
      one.
    code_example: "// Before: entities are substituted and external ones are loaded from disk\n// const option = ParseOption.XML_PARSE_NOENT\
      \ | ParseOption.XML_PARSE_DTDLOAD | ...\n// After: no DTD load, no entity substitution, no network fetch\nconst option\
      \ = libxml2.ParseOption.XML_PARSE_NOBLANKS |\n               libxml2.ParseOption.XML_PARSE_NOCDATA |\n             \
      \  libxml2.ParseOption.XML_PARSE_NONET"
