  cwe: CWE-345
  title: Unvalidated wallet address seeds on-chain correlation state (web3Wallet.ts:15)
  affected_parameter: walletAddress
  scenario: 'POST /rest/web3/walletExploitAddress reads req.body.walletAddress at routes/web3Wallet.ts:15 and adds it to the
    walletsConnected registry at line 16 — before the try block, before any authentication, and with no format check (a grep
    of the component for isAddress, joi, zod or validate returns zero hits). The registry is then used at line 27 as the authority
    for who is credited when the ContractExploited event fires on-chain: walletsConnected.has(exploiter) decides whether the
    challenge is solved. Two integrity problems follow. First, arbitrary non-address strings enter a security-relevant set,
    so the correlation key space is attacker-shaped rather than a validated 20-byte address. Second, an attacker can pre-register
    any third party''s address and have the server attribute that party''s independent on-chain activity to the attacker''s
    request, because nothing links the registered address to the caller who registered it.'
  evidence_summary: routes/web3Wallet.ts:15-16 persists `req.body.walletAddress` into walletsConnected outside the try block
    with no `isAddress()` check and no authenticated caller identity.
  impact_description: Security-relevant server state is written directly from unvalidated request input and later trusted
    as an authority for on-chain attribution.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None. No address-format validation, no authentication, and no binding between the registered address
    and the registering caller.
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  mitigation_title: Validate and bind walletAddress to the caller before adding it to walletsConnected
  remediation:
    effort: Low
    steps:
    - Reject the request with 400 unless `ethers.isAddress(req.body.walletAddress)` is true, and normalise via `getAddress()`
      so checksum and lowercase forms map to one key.
    - Store the entry as a `Map<address, sessionId>` rather than a bare Set, and when the `ContractExploited` event fires
      credit only the session that registered that exact address.
    - Require a signed nonce (as in walletNFTVerify) so registration proves control of the address instead of merely asserting
      it.
    code_example: "// Before: any string is persisted as a trusted correlation key\n// After: only a checksummed address bound\
      \ to the calling session enters the registry\nconst { isAddress, getAddress } = await import('ethers')\nif (!isAddress(req.body.walletAddress))\
      \ {\n  return res.status(400).json({ success: false, message: 'Invalid Ethereum address' })\n}\nwalletsConnected.set(getAddress(req.body.walletAddress),\
      \ req.session.id)"
    verification: 'POST `{"walletAddress": "not-an-address"}` and assert a 400 response and that the registry size is unchanged;
      POST a valid checksummed address and assert exactly one normalised entry is created.'
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
  evidence:
  - file: routes/web3Wallet.ts
    line: 15
  boundary_refs:
  - boundary_id: tb-1
    origin_component_id: web3-nft
    rationale: Request body field is written into security-relevant state without any schema or address-format check.
    leg: validation
    evidence_locations:
    - file: routes/web3Wallet.ts
      line: 15
