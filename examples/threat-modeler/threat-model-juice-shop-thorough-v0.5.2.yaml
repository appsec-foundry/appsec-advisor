    same workflow uses actions/checkout@v6 and peter-evans/create-pull-request@v8 tag refs; ci.yml:188 likewise uses coverallsapp/github-action@v2
    while every other action in ci.yml is SHA-pinned.
  impact_description: Arbitrary upstream code runs inside the pipeline with access to the job's GITHUB_TOKEN and workspace,
    allowing source or artifact tampering without any change in this repository.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Most actions in ci.yml are pinned to full commit SHAs; image_actions.yml jobs are restricted to the upstream
