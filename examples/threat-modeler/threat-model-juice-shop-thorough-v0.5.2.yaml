- local_id: file-upload-service-004
  threat_category_id: TH-07
  additional_categories: []
  stride: Tampering
  cwe: CWE-434
  title: Upload validation middleware that never rejects (routes/fileUpload.ts:64)
  affected_parameter: file.originalname
  scenario: 'checkFileType (routes/fileUpload.ts:62-68) and checkUploadSize (routes/fileUpload.ts:55-60) are registered in
    the POST /file-upload chain and read like validation, but neither ever short-circuits the request: both consist solely
    of a challengeUtils.solveIf() call followed by an unconditional next(). checkFileType computes the extension on line 63
    and on line 64 uses it only to decide whether to mark a training challenge solved - a file with an extension outside {pdf,
    xml, zip, yml, yaml} is passed straight through rather than rejected. The extension itself is derived from the client-supplied
    originalname and is never cross-checked against the buffer''s magic bytes, so the ZIP, XML, and YAML handlers dispatch
    purely on an attacker-chosen suffix. The practical result is that the endpoint accepts any content of any type up to the
    200000-byte multer limit, and the routing decision between the three parser paths is under attacker control.'
  attack_steps:
  - An attacker names a crafted archive `payload.zip` so that `handleZipFileUpload` claims it, or `payload.xml` to reach the
    XXE parser, choosing the handler purely by suffix.
  - The attacker POSTs the file to `/file-upload`; `checkFileType` on line 64 records a challenge but calls `next()` unconditionally,
    so nothing is rejected.
  - The chosen parser processes attacker-controlled bytes it was never intended to receive, because the suffix and the actual
    content need not agree.
  evidence_summary: Both checkUploadSize and checkFileType end in an unconditional next(); the extension computed on line
    63 feeds only a challengeUtils.solveIf() call and never a rejection branch.
  impact_description: Any file type and content reaches the parser handlers, and the attacker selects which parser runs by
    choosing the filename suffix.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Only the 200000-byte multer fileSize limit at server.ts:692. The named validation middleware performs
    no enforcement.
  mitigation_title: Make checkFileType and checkUploadSize reject non-conforming uploads instead of only recording challenges
  remediation:
    effort: Low
    steps:
    - 'In checkFileType, return `res.status(415).json({ error: ''Unsupported file type'' })` when the extension is outside
      the allow-list, instead of falling through to `next()`.'
    - Verify the buffer's magic bytes with the `file-type` package (already a dependency, used at routes/profileImageFileUpload.ts:24)
      and reject when the detected MIME does not match the claimed extension.
    - In checkUploadSize, reject with 413 above an explicit byte threshold rather than only calling `challengeUtils.solveIf`.
    - 'Store uploads under a generated name and serve them with `Content-Disposition: attachment` and `X-Content-Type-Options:
      nosniff` so stored content is never interpreted by a browser.'
    code_example: "async function checkFileType (req, res, next) {\n  const ext = req.file?.originalname.split('.').pop()?.toLowerCase()\n\
      \  const allowed = new Set(['pdf', 'xml', 'zip', 'yml', 'yaml'])\n  // Before: the extension only fed challengeUtils.solveIf\
      \ and next() ran regardless\n  if (!ext || !allowed.has(ext)) return res.status(415).json({ error: 'Unsupported file\
      \ type' })\n  const sniffed = await fileType.fromBuffer(req.file.buffer)\n  if (!sniffed || !mimeMatchesExt(sniffed.mime,\
      \ ext)) return res.status(415).json({ error: 'Content does not match extension' })\n  next()\n}"
    verification: POST a file named `shell.php`; assert HTTP 415 and assert nothing is created under `uploads/`. POST a `.zip`
      whose bytes are PDF; assert 415.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
  evidence:
  - file: routes/fileUpload.ts
    line: 64
  boundary_refs:
  - boundary_id: tb-4
    origin_component_id: file-upload-service
    rationale: The two middlewares named as type and size validation call next() unconditionally, so no upload is ever refused
      on type or size.
    leg: validation
    evidence_locations:
