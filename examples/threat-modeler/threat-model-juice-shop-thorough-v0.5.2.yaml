    publishes a backdoored image as bkimminich/juice-shop:latest, because the docker job authenticates to Docker Hub with
    a static long-lived password secret rather than a short-lived OIDC workflow identity.
  attack_steps:
  - I compromise any step in a job that can reach the docker login environment and read DOCKERHUB_TOKEN.
  - I authenticate to Docker Hub from my own machine with that stolen token, which stays valid until someone rotates it.
  - I push a backdoored bkimminich/juice-shop:latest that every downstream `docker pull` accepts as the official image.
  evidence_summary: docker/login-action is given username and password from repository secrets, so publishing authority rests
    on a static credential with no expiry or workflow binding.
  impact_description: A single stolen secret lets an attacker publish images under the project's own identity to all downstream
    consumers, with no credential expiry to bound the window.
