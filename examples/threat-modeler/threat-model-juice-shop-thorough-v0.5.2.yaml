  stride: Tampering
  cwe: CWE-306
  title: Unauthenticated Socket.IO Channel (socket-io.service.ts:22)
  scenario: 'The real-time channel is opened without any credential and is used in both directions. `SocketIoService`''s constructor
    at `socket-io.service.ts:20-28` calls `io(window.location.origin, { path: ... })` — or `io(environment.hostServer)` —
    with no `auth`, `query`, or `extraHeaders` option, so the handshake carries no token even though every HTTP call from
    the same SPA carries a bearer header via `request.interceptor.ts:16`. The channel is not read-only: `challenge-solved-notification.component.ts:78`
    emits `notification received`, line 112 emits `verifyCloseNotificationsChallenge` with the client''s own notification
    list, `search-result.component.ts:140` emits `verifyLocalXssChallenge` with the raw `q` parameter, and `deluxe-user.component.ts:73`
    emits `verifySvgInjectionChallenge`. Any client that connects — including one that never authenticated — can emit these
    events with values of its choosing and receives every `challenge solved` broadcast that `navbar.component.ts:168`, `sidenav.component.ts:81`,
    and `score-board.component.ts:98` subscribe to. When `environment.hostServer` is used rather than the page origin, the
    transport is whatever that value declares; `environment.ts:12` sets it to `http://localhost:3000`, so a non-loopback build
    that keeps this shape would carry the channel in cleartext.'
  attack_steps:
  - An attacker opens a Socket.IO connection to the application path directly, without logging in, and the server completes
    the handshake because no credential is required.
  - The attacker emits `verifyLocalXssChallenge` and `verifyCloseNotificationsChallenge` with values of their choosing, driving
    server-side state the SPA is expected to report honestly.
  - The attacker leaves the connection open and records every `challenge solved` broadcast the server pushes to all connected
    clients.
  evidence_summary: '`socket-io.service.ts:22` and `:26` construct the Socket.IO client with no `auth`, `query`, or `extraHeaders`
    option, while four components emit server-consumed events over that same unauthenticated connection.'
  impact_description: An unauthenticated client drives the server's challenge-verification events with arbitrary values and
    observes every broadcast pushed to legitimate users.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: The connection reuses the page origin and path when `environment.hostServer === '.'`, so the browser
    applies same-origin defaults to the initial polling request. No credential is presented on the handshake and no per-event
    authorization exists on the client side.
  mitigation_title: Authenticate the Socket.IO handshake and authorize each inbound event server-side
  remediation:
    effort: Medium
    steps:
    - Pass the session credential on the handshake in `socket-io.service.ts:22` and `:26` via the `auth` option, and reject
      unauthenticated connections in the server's `io.use()` middleware.
    - Authorize every inbound event against the connected socket's verified identity rather than the payload it carries, so
      `verify*Challenge` emissions cannot be forged by an unconnected party.
    - Scope `challenge solved` broadcasts to rooms the recipient is entitled to, instead of emitting to all connected clients.
    - Validate the `Origin` of the handshake server-side against an explicit allowlist so a third-party page cannot open the
      channel from a victim's browser.
    code_example: "// Before (frontend/src/app/Services/socket-io.service.ts:22)\n// this._socket = io(window.location.origin,\
      \ { path: ... })\n\n// After: the handshake presents the session credential\nthis._socket = io(window.location.origin,\
      \ {\n  path: ...,\n  withCredentials: true,\n  auth: (cb) => { cb({ token: localStorage.getItem('token') }) }\n})\n\n\
      // Express/Socket.IO side\nio.use((socket, next) => {\n  const user = security.verify(sock**** (28 chars))\n\
      \  if (!user) return next(new Error('unauthorized'))\n  socket.data.user = user\n  next()\n})"
    verification: Connect a Socket.IO client with no credential and assert the handshake is rejected. Then connect as user
      A, emit `verifyCloseNotificationsChallenge` with another user's data, and assert the server acts on `socket.data.user`
      rather than the payload.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Web_Socket_Security_Cheat_Sheet.html
  evidence:
  - file: frontend/src/app/Services/socket-io.service.ts
    line: 22
  evidence_check: verified
  controls_absent_evidence:
  - pattern: auth:\|query:\|extraHeaders
    search_paths:
    - frontend/src/app/Services/socket-io.service.ts
    hit_count: 0
    searched_at: '2026-08-02T21:13:20Z'
