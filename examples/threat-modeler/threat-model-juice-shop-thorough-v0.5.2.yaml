  cwe: CWE-290
  title: Wallet ownership accepted from request body (routes/nftMint.ts:41)
  affected_parameter: walletAddress
  scenario: 'POST /rest/web3/walletNFTVerify reads req.body.walletAddress at routes/nftMint.ts:41 and treats the string as
    proof that the caller controls that Ethereum account. There is no session authentication on the route (server.ts:644 registers
    it without security.isAuthorized()) and no cryptographic ownership proof — a grep across the component for verifyMessage,
    recoverAddress, SiweMessage or signature returns zero hits. Ethereum addresses are public data emitted by the NFTMinted
    event the server itself subscribes to at routes/nftMint.ts:24, so any anonymous internet caller who observes or guesses
    a minter address can claim it. The same handler then calls addressesMinted.delete(metamaskAddress) at line 43 before granting
    credit, so the impersonation is also destructive: the legitimate minter''s pending entry is consumed and their own later
    verification returns ''Wallet did not mint the NFT''.'
  attack_steps:
  - An attacker watches the public Sepolia chain (or the shop's own event stream) for an address that emitted `NFTMinted`.
  - 'The attacker sends `POST /rest/web3/walletNFTVerify` with `{"walletAddress": "<victim address>"}` and no credentials
    of any kind.'
  - The server matches the address in `addressesMinted`, deletes the entry and returns success, so the attacker is credited
    and the real owner is denied.
  evidence_summary: routes/nftMint.ts:41 binds `req.body.walletAddress` straight into the membership test at line 42 with
    no signature challenge and no authenticated session behind it.
  impact_description: Any anonymous caller can impersonate an arbitrary wallet owner and simultaneously destroy that owner's
    verification state.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: None. No authentication middleware on the route and no signature-based proof of address control.
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  mitigation_title: Require a signed nonce challenge before crediting wallet ownership in walletNFTVerify
  remediation:
    effort: Medium
    steps:
    - Add a `GET /rest/web3/nonce` endpoint that issues a random single-use nonce bound to the caller's session and stores
      it server-side with a short TTL.
    - Change `walletNFTVerify` to require `{ walletAddress, signature }`, recover the signer with `ethers.verifyMessage(nonce,
      signature)` and reject unless the recovered address strictly equals `walletAddress` (compare lowercased or via `getAddress`).
    - Register the route behind `security.isAuthorized()` in server.ts:644 so the verified wallet is bound to a known user
      identity, and consume the nonce on first use so a captured signature cannot be replayed.
    code_example: '// Before: membership test on an attacker-supplied string

      // After: only a signature over a server-issued nonce proves control of the address

      const { verifyMessage, getAddress } = await import(''ethers'')

      const nonce = await consumeNonce(req.session.id)

      if (!nonce) return res.status(400).json({ success: false })

      const signer = getAddress(verifyMessage(nonce, req.body.signature))

      if (signer !== getAddress(req.body.walletAddress)) return res.status(401).json({ success: false })'
    verification: Send `POST /rest/web3/walletNFTVerify` with a known-minted address and no `signature` field; assert 401
      and assert the address is still present in the registry (a follow-up verify by the true owner with a valid signature
      must still succeed).
