    ships no `Content-Security-Policy` meta tag, and a repo-wide grep for `Content-Security-Policy` across `frontend/src`
    returns zero hits. With nine active sanitizer bypasses in the SPA — `administration.component.ts:73` and `:91`, `search-result.component.ts:110`
    and `:143`, `about.component.ts:119`, `track-result.component.ts:48`, `last-login-ip.component.ts:39`, `data-export.component.ts:57`,
    `score-board.component.ts:82` — the absence removes the last barrier between an injected payload and an outbound request:
    an XSS payload may load remote script and `fetch()` the `localStorage` token to any host it chooses. The page also carries
    an inline `<script>` block at `index.html:17` that initialises the cookie-consent widget, so adopting a strict policy
    requires moving that block to a file or hashing it first.'
  evidence_summary: '`frontend/src/index.html` declares no `Content-Security-Policy` meta tag, and its `<head>` contains an
