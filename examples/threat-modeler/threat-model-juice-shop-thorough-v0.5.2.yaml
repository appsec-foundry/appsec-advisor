  stride: Repudiation
  cwe: CWE-778
  title: Missing Socket Event Audit Logging (lib/startup/registerWebsocketEvents.ts:23)
  scenario: Nothing in the Socket.IO registration path writes to the application logger. The module imports `config`, `utils`,
    `socket.io`, `datacache`, `challengeUtils` and `insecurity`, but not `lib/logger`, and a search for `logger`, `winston`
    and `audit` across the file returns nothing. Connections, disconnections, the state-deleting `notification received` event
    and the three state-changing `verify*` events all execute silently. Combined with the absent handshake identity, this
    means the two mutations recorded in findings socket-io-gateway-003 and socket-io-gateway-004 leave no record of what changed,
    when, or from which source — there is no server-side artefact to distinguish a legitimate dismissal from an attacker emptying
    the queue, and an incident responder has only the reverse proxy's connection log to work from.
  evidence_summary: '`lib/startup/registerWebsocketEvents.ts` imports no logger and contains no log call, so every connection
    and every state-changing socket event completes without an audit record.'
  impact_description: State changes driven over the WebSocket channel cannot be attributed or reconstructed after the fact,
    leaving no forensic trail for the tampering described in findings socket-io-gateway-003 and socket-io-gateway-004.
  likelihood: High
  impact: Low
  risk: Medium
  controls_in_place: None in this path. `lib/logger.ts` exists and is used elsewhere in the codebase (for example the webhook
    failure path in `lib/challengeUtils.ts:41`), but it is not wired into the socket handlers.
  mitigation_title: Log socket connection lifecycle and state-changing events with actor, event, and source address
  remediation:
    effort: Low
    steps:
    - Import `lib/logger` into `lib/startup/registerWebsocketEvents.ts` and log connect and disconnect with `socket.id`, `socket.handshake.address`
      and the authenticated principal once the handshake middleware is in place.
    - Log every state-changing handler (`notification received` and the three `verify*` events) with actor, event name, target
      identifier and outcome — accepted or rejected — so a rejected attempt is as visible as a successful one.
    - Never log the notification `flag` value or the raw payload; log the notification key and a payload length instead, so
      the audit trail does not become the disclosure channel described in finding socket-io-gateway-002.
    - Ship these records to the same append-only sink as the HTTP access log so WebSocket and REST activity can be correlated
      on one timeline.
    code_example: "io.on('connection', (socket: any) => {\n  logger.info(`socket connect id=${socket.id} addr=${socket.handshake.address}`)\n\
      \  socket.on('notification received', (data: any) => {\n    const ok = dismissFor(socket.data.user, data)\n    logger.info(`socket\
      \ event=notification_received user=${socket.data.user?.id ?? 'anon'} result=${ok ? 'accepted' : 'rejected'}`)\n  })\n\
      })"
    verification: Open a socket, emit `notification received`, and assert the application log contains one connect record
