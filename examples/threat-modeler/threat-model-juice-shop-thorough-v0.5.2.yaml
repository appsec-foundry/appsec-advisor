security_controls:
- domain: Identity and Authentication Controls
  control: Password-Based Authentication
  kind: mechanism
  effectiveness: Unsafe
  assessment: 'Authentication flow exists and is relied upon but has three independent critical breaks: (1) routes/login.ts:34
    uses raw SQL string interpolation enabling authentication bypass via SQL injection; (2) lib/insecurity.ts:41 hashes passwords
    with MD5 (not bcrypt/argon2) making all stored passwords trivially crackable offline; (3) lib/insecurity.ts:21 embeds
    the RSA private key in source, enabling offline JWT forgery by anyone with repo access. Each break alone fully compromises
    authentication.'
  implementation: routes/login.ts:18 implements the POST /rest/user/login handler. The login route queries users via raw SQL
    (routes/login.ts:34), hashes the password with MD5 (lib/insecurity.ts:41), and on success calls security.authorize() to
    issue a JWT (lib/insecurity.ts:54).
  linked_threats: []
  group_subcontrols: true
  subcontrols:
  - title: User Registration
    effectiveness: Weak
    status_note: POST /api/Users lacks email uniqueness enforcement and accepts arbitrary passwords; no strength policy.
    assessment: Registration endpoint at routes/register.ts accepts any password without strength validation. Password stored
      as MD5 hash (lib/insecurity.ts:41). No email confirmation step.
  - title: Password-Based Login
    effectiveness: Unsafe
    status_note: Raw SQL at routes/login.ts:34 enables full authentication bypass via SQL injection.
    assessment: 'routes/login.ts:34 uses template literal interpolation directly in the SQL query: SELECT * FROM Users WHERE
      email = ''${req.body.email}''. An attacker can supply `'' OR 1=1--` as the email to bypass credential checks and authenticate
      as any user.'
  - title: Password Reset
    effectiveness: Weak
    status_note: Security questions are enumerable (GET /api/SecurityQuestions is unauthenticated) and answers are predictable.
    assessment: Password reset relies on security question answers. The question list is publicly enumerable via an unauthenticated
      endpoint, reducing the reset mechanism to a guessable single-factor.
  - title: Password Change
    effectiveness: Weak
    status_note: Requires current session but does not verify the existing password before allowing change.
    assessment: Password change does not require re-authentication with the current password, enabling privilege escalation
      for any attacker with a stolen session.
  - title: Password Storage
    effectiveness: Unsafe
    status_note: MD5 hashing at lib/insecurity.ts:41 — all stored passwords are trivially crackable.
    assessment: 'lib/insecurity.ts:41: `export const hash = (data) => crypto.createHash(''md5'').update(data).digest(''hex'')`.
      MD5 is not a password hash function; it has no work factor, no salting, and known rainbow tables cover common passwords.'
- domain: Identity and Authentication Controls
  control: Social Login Adapter (OAuth / OIDC)
  kind: mechanism
  effectiveness: Weak
  assessment: OAuth integration is implemented as a frontend-only identity adapter in frontend/src/app/oauth/oauth.component.ts.
    The Google access token is read client-side and exchanged for a local session via the standard login endpoint — which
    has its own SQL injection and MD5 vulnerabilities. There is no server-side PKCE, no state parameter validation, and the
    token exchange inherits all Password-Based Login weaknesses.
  implementation: frontend/src/app/oauth/oauth.component.ts reads the access token from the OAuth redirect URL and calls the
    local login API to obtain a Juice Shop JWT. No server-side authorization-code flow exists.
  linked_threats: []
  subcontrols:
  - title: OAuth Login Adapter
    effectiveness: Weak
    status_note: Frontend-only; no PKCE, no server-side state validation, inherits raw-SQL login path.
    assessment: The OAuth adapter converts the Google identity into a local login request that goes through the same SQL-injectable
      login route. No id_token validation occurs server-side; the adapter trusts the email returned by the Google UserInfo
      API without server-side verification.
- domain: Identity and Authentication Controls
  control: Multi-Factor Enrollment (TOTP)
  kind: mechanism
  effectiveness: Partial
  assessment: TOTP enrollment via OTPlib 13.4.0 is implemented at routes/2fa.ts. Enrollment generates a TOTP secret stored
    in the users table. The mechanism is intentionally designed to be bypassable as a training challenge; enrollment requires
    an authenticated session but the underlying session can itself be forged via alg:none bypass.
  implementation: routes/2fa.ts implements TOTP secret generation using otplib. The shared secret is stored in UserModel.totpSecret.
  linked_threats: []
- domain: Identity and Authentication Controls
  control: Multi-Factor Verification (TOTP)
  kind: mechanism
  effectiveness: Partial
  assessment: 'TOTP verification via OTPlib 13.4.0 is implemented at routes/2fa.ts. When totpSecret is set on a user account,
    the login flow issues a tmpToken and requires a second-factor code before issuing the final JWT. However: (1) the tmpToken
    is signed with the same hardcoded RSA private key as the main JWT, enabling forgery; (2) OAuth login bypasses TOTP entirely;
    (3) direct API token access bypasses TOTP. The control covers only the password-login path.'
  implementation: routes/2fa.ts and lib/startup/registerWebsocketEvents.ts handle TOTP token verification via otplib. Verification
    calls authenticator.check() against the stored totpSecret.
  linked_threats: []
- domain: Identity and Authentication Controls
  control: Authentication Rate Limiting
  kind: primitive
  effectiveness: Partial
  assessment: 'express-rate-limit 7.5.1 is applied to the login and password-reset endpoints. Default limit is 5 requests
    per 15-minute window per IP. Gaps: (1) rate limiting is per-IP only, not per-account — rotating source IPs bypasses it;
    (2) in-memory rate limit store is not shared across instances; (3) registration endpoint is not rate-limited; (4) TOTP
    brute-force endpoint may not be covered.'
  implementation: express-rate-limit 7.5.1 configured in app.ts or lib/startup/. Applied to /rest/user/login and password
    reset endpoints.
  linked_threats: []
- domain: Session and Token Controls
  control: Session Token Signing (JWT Based)
  kind: primitive
  effectiveness: Unsafe
  assessment: 'lib/insecurity.ts:21 embeds the RSA-2048 private key as a string literal in source code. lib/insecurity.ts:54:
    `jwt.sign(user, privateKey, { expiresIn: ''6h'', algorithm: ''RS256'' })`. Because the private key is in the public GitHub
    repository, any attacker can sign arbitrary JWTs offline and authenticate as any user including admin. The signing control
    is present but completely defeated.'
  implementation: 'lib/insecurity.ts:54: security.authorize() signs tokens using jsonwebtoken 0.4.0 with RS256 and a hardcoded
    private key at lib/insecurity.ts:21.'
  linked_threats: []
- domain: Session and Token Controls
  control: Session Token Validation (JWT Based)
  kind: primitive
  effectiveness: Unsafe
  assessment: 'Two independent algorithm-confusion vectors: (1) lib/insecurity.ts:55 uses `jws.verify(token, publicKey)` which
    does not enforce the algorithm — an attacker can sign with the HS256 algorithm using the RSA public key as the HMAC secret;
    (2) express-jwt 0.1.3 (lib/insecurity.ts:52) is approximately 8 major versions behind current and known to accept alg:none
    on some code paths. Either vector allows forging tokens without the private key.'
  implementation: 'lib/insecurity.ts:52: `security.isAuthorized() = expressJwt({ secret: publicKey })`. lib/insecurity.ts:55:
    `security.verify = (token) => jws.verify(token, publicKey)`. express-jwt 0.1.3 used on protected routes.'
  linked_threats: []
- domain: Session and Token Controls
  control: Session Token Storage (Browser localStorage)
  kind: primitive
  effectiveness: Unsafe
  assessment: JWT tokens are stored in localStorage in 14+ locations across the Angular frontend (frontend/src/app/Services/request.interceptor.ts:16,
    app.guard.ts, basket.service.ts, navbar.component.ts, and others). localStorage is accessible to any JavaScript on the
    page — any XSS vulnerability enables full session theft. No HttpOnly cookies are used for session tokens.
  implementation: 'frontend/src/app/Services/request.interceptor.ts:16 reads the JWT from localStorage and injects it into
    every outbound API request as an Authorization: Bearer header.'
  linked_threats: []
- domain: Session and Token Controls
  control: Session Token Revocation
  kind: primitive
  effectiveness: Missing
  assessment: No token revocation mechanism exists. The in-process `authenticatedUsers.tokenMap` (lib/insecurity.ts:70) tracks
    active tokens as a heap map but is not persisted — it resets on server restart. Logout does not invalidate the JWT; if
    the token is stolen before logout it remains valid until its 6-hour expiry. No blocklist, no short-lived tokens with refresh,
    no server-side session invalidation.
  implementation: null
  linked_threats: []
- domain: Session and Token Controls
  control: Session Token Expiry
  kind: primitive
  effectiveness: Partial
  assessment: 'lib/insecurity.ts:54 sets `expiresIn: ''6h''` on all issued JWTs. The expiry is enforced at validation time
    by express-jwt. Gaps: (1) the 6-hour window is long for a training app with publicly exploitable sessions; (2) no token
    rotation on privilege change; (3) session does not rotate on login — session fixation possible if a pre-login token is
    obtained.'
  implementation: 'lib/insecurity.ts:54: `jwt.sign(user, privateKey, { expiresIn: ''6h'', algorithm: ''RS256'' })`.'
  linked_threats: []
- domain: Authorization Controls
  control: Role-Based Access Control
  kind: mechanism
  effectiveness: Weak
  assessment: Role-based checks exist at the route level (e.g. `req.user.role === 'admin'` patterns) but are applied inconsistently.
    Admin routes at /api/Users and /admin are guarded by role checks, but many routes rely on the Angular client-side guard
    (app.guard.ts) which provides no server-side enforcement. Object-level authorization (IDOR) is absent by design — users
    can access other users' baskets, orders, and profiles by manipulating IDs.
  implementation: lib/authenticate.ts and lib/authorize.ts provide role-check helpers. Routes apply them selectively via middleware
    chain.
  linked_threats: []
- domain: Authorization Controls
  control: Object-Level Authorization
  kind: primitive
  effectiveness: Missing
  assessment: No per-resource ownership verification is implemented. Routes such as GET /api/Users/:id, GET/PATCH /api/BasketItems/:id,
    and GET /api/Orders return objects based solely on the path parameter without verifying that the authenticated user owns
    the requested resource. This is intentional in Juice Shop (IDOR challenges) but represents a complete absence of the control.
  implementation: null
  linked_threats: []
- domain: Query Construction and Data Access Controls
  control: SQL Query Construction
  kind: primitive
  effectiveness: Unsafe
  assessment: 'routes/login.ts:34 uses raw string interpolation in a Sequelize `sequelize.query()` call: `SELECT * FROM Users
    WHERE email = ''${req.body.email || ''''}'' AND password = ''${security.hash(req.body.password || '''')}''`. This is a
    confirmed SQL injection point — supplying `'' OR 1=1--` as the email bypasses authentication. The rest of the codebase
    uses Sequelize parameterized queries (models/ directory), making this raw SQL path an outlier that breaks the ORM safety
    boundary.'
  implementation: routes/login.ts:34 uses models.sequelize.query() with raw template literals. models/*.ts use Sequelize Model
    methods with parameterized WHERE clauses.
  linked_threats: []
- domain: Query Construction and Data Access Controls
  control: ORM Parameterized Queries
  kind: primitive
  effectiveness: Partial
  assessment: Sequelize ORM is used for most data access operations. Model methods (findOne, findAll, findByPk, create, update)
    use parameterized queries by default, providing parameterization for the majority of the data access layer. The critical
    exception is routes/login.ts:34 which bypasses the ORM with raw SQL.
  implementation: models/user.ts, models/basket.ts, models/product.ts etc. use Sequelize Model API with automatic parameterization.
  linked_threats: []
- domain: Input Boundary Validation Controls
  control: Validation Approach
  kind: primitive
  effectiveness: Weak
  assessment: Input validation is scattered per-endpoint with no centralized schema enforcement. Zod is imported in the codebase
    but not used for runtime request body validation. body-parser parses JSON and URL-encoded bodies without size limits.
    The intentional design allows bypass of any per-endpoint validation as part of training challenges, meaning no validation
    is reliably enforced.
  implementation: body-parser (JSON + URL-encoded) handles request parsing. Zod is present in dependencies but not applied
    to route handler inputs.
  linked_threats: []
- domain: Input Boundary Validation Controls
  control: Request Schema Validation
  kind: primitive
  effectiveness: Missing
  assessment: No centralized schema validation library (Joi, Zod, express-validator) validates incoming request bodies against
    defined schemas before they reach route handlers. Individual routes perform ad-hoc type checks at best. This is intentional
    for the training scenarios but means every injection sink in the application is reachable with arbitrary input.
  implementation: null
  linked_threats: []
- domain: Output Encoding and Rendering Controls
  control: Template Sanitization (Angular)
  kind: primitive
  effectiveness: Unsafe
  assessment: 'Angular''s DomSanitizer is deliberately bypassed in at least 5 locations: frontend/.../administration.component.ts:73
    renders user-email HTML via bypassSecurityTrustHtml; frontend/.../about.component.ts:119 renders user feedback comments
    via bypassSecurityTrustHtml; frontend/.../about.component.html:51 uses [innerHTML]=''item?.args'' with unescaped server
    data; frontend/.../data-export.component.ts:57 renders captcha HTML via bypassSecurityTrustHtml; frontend/.../track-result.component.ts:48
    interpolates orderId into an innerHTML trust bypass. Each bypass allows stored XSS to execute in the context of the authenticated
    user.'
  implementation: Angular's template engine escapes by default. frontend/src/app/ components explicitly call sanitizer.bypassSecurityTrustHtml()
    and bind [innerHTML] to server-returned content.
  linked_threats: []
- domain: Output Encoding and Rendering Controls
  control: Server-Side Output Sanitization
  kind: primitive
  effectiveness: Weak
  assessment: lib/insecurity.ts:58-67 exports sanitizeHtml (wraps sanitize-html 1.4.2), sanitizeLegacy (regex-only), and sanitizeSecure
    (recursive sanitize-html). The library version 1.4.2 is outdated. Usage is inconsistent — some routes apply sanitizeHtml
    to stored content but most do not. The training design intentionally allows unsanitized content through for XSS challenges.
  implementation: 'lib/insecurity.ts:58: `sanitizeHtml = sanitize-html 1.4.2`. Applied selectively in some routes.'
  linked_threats: []
- domain: Browser and Cross-Origin Controls
  control: Content Security Policy
  kind: primitive
  effectiveness: Partial
  assessment: Helmet 4.6.0 is configured and provides several security headers including X-Content-Type-Options, X-Frame-Options,
    and Strict-Transport-Security. CSP is intentionally permissive to support the training scenarios (inline scripts, eval,
    wildcard sources are needed for some challenges). Permissions-Policy and Referrer-Policy may not be fully configured.
  implementation: Helmet 4.6.0 configured in Express middleware chain. Exact CSP directives depend on runtime configuration.
  linked_threats: []
- domain: Browser and Cross-Origin Controls
  control: CORS Policy
  kind: primitive
  effectiveness: Weak
  assessment: cors 2.8.5 is applied with origin configuration from lib/customize/cors.ts. Some deployment configurations allow
    wildcard origins (`*`). Socket.IO CORS is configured separately and may have more permissive settings. The combination
    of wildcard CORS with credentials in some configurations creates cross-origin credential exposure. Exact restrictions
    depend on deployment-time configuration.
  implementation: cors 2.8.5 middleware applied in Express pipeline. lib/customize/cors.ts provides the origin configuration
    function.
  linked_threats: []
- domain: Browser and Cross-Origin Controls
  control: CSRF Protection
  kind: primitive
  effectiveness: Missing
  assessment: No CSRF protection (csurf middleware or equivalent) was detected in the codebase. State-changing routes (POST
    /api/Users/login, POST /api/BasketItems, PATCH /api/Users/:id, etc.) do not require a CSRF token. The application uses
    JWT in the Authorization header for most API calls, which browsers do not automatically include in cross-site requests
    — providing natural CSRF resistance for those endpoints. However, any cookie-based or credentialed cross-origin scenario
    remains vulnerable.
  implementation: null
  linked_threats: []
- domain: Cryptography Secrets and Data Protection
  control: Password Hashing
  kind: primitive
  effectiveness: Unsafe
  assessment: 'lib/insecurity.ts:41: `export const hash = (data: string) => crypto.createHash(''md5'').update(data).digest(''hex'')`.
    MD5 is a general-purpose hash, not a password hash function. It has no work factor, uses no per-user salt, and precomputed
    rainbow tables exist for all common passwords. Every password in the Users table is trivially crackable offline once the
    database is obtained.'
  implementation: lib/insecurity.ts:41 defines the global hash function. models/user.ts:76 calls security.hash(clearTextPassword)
