  title: Open Redirect (lib/insecurity.ts:136)
  affected_parameter: to
  scenario: '`isRedirectAllowed` decides whether a redirect target is permitted with `url.includes(allowedUrl)` — a substring
    test rather than an origin comparison. Any URL that merely contains an allowlisted string anywhere passes, so `https://attacker.example/?x=https://github.com/juice-shop/juice-shop`
    is accepted and routes/redirect.ts:19 issues a 302 to the attacker''s host. The endpoint is unauthenticated (server.ts:659),
    which makes it a ready-made credibility wrapper: a phishing link whose visible hostname is the shop''s own domain lands
    the victim on an attacker-controlled login page, and any token appended to the original request travels in the `Referer`
    of the redirected navigation.'
  evidence_summary: lib/insecurity.ts:136 evaluates `url.includes(allowedUrl)`, so an allowlisted string appearing anywhere
    in the URL — including in a query parameter — satisfies the check.
  impact_description: An attacker turns the application's own domain into a redirector for phishing and can leak referrer
    data to a host they control.
  likelihood: High
  impact: Low
  risk: Medium
  controls_in_place: An allowlist of eight target URLs (lib/insecurity.ts:122). It is matched by substring containment, so
    it constrains nothing an attacker cannot satisfy.
  mitigation_title: Match redirect targets by parsed origin instead of substring containment
  remediation:
    effort: Low
    steps:
    - Parse the candidate with `new URL(url)` and compare `origin` plus `pathname` against the allowlist entries with strict
      equality, replacing the `includes` test at lib/insecurity.ts:136.
    - Reject any candidate that fails to parse, or whose protocol is not `https:`.
    - Prefer an indirection map — accept a short opaque key and look the real destination up server-side — so no caller-supplied
      URL is ever reflected into `res.redirect`.
    - 'Set `Referrer-Policy: no-referrer` on the redirect response so the originating URL is not disclosed to the target.'
    code_example: "// Before - lib/insecurity.ts:136: substring containment accepts any wrapping URL\n// allowed = allowed\
      \ || url.includes(allowedUrl)\n\n// After: exact origin and path comparison against the allowlist\nexport const isRedirectAllowed\
      \ = (url: string) => {\n  let candidate: URL\n  try { candidate = new URL(url) } catch { return false }\n  if (candidate.protocol\
      \ !== 'https:') return false\n  return [...redirectAllowlist].some((allowed) => {\n    const a = new URL(allowed)\n\
      \    return a.origin === candidate.origin && a.pathname === candidate.pathname\n  })\n}"
