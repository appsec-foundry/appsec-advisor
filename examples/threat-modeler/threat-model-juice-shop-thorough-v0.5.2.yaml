tier_root_causes:
  edge:
  - DOM XSS sinks accept unsanitized input without DomSanitizer protection
  - OAuth implicit flow leaks access tokens into browser URL history
  - Authorization enforced client-side in Angular guards, bypassable server-side
  - Predictable PRNG OAuth nonce enables state-parameter forgery in the SPA
  server:
  - Hardcoded RSA key and weak HMAC secret enable arbitrary JWT forgery
  - No algorithm allowlist in JWT verification - alg:none and confusion attacks
  - Raw string interpolation into SQL on login and search - no parameterization
  - Authorization middleware absent on most API routes - privilege escalation
  - Dependency integrity unpinned in Dockerfile - supply-chain substitution
  data:
  - MD5 used for password hashing - trivially reversible via rainbow tables
  - Sensitive fields stored without encryption at rest (answers, payment data)
  - No audit trail for write operations - repudiation of tampering possible
