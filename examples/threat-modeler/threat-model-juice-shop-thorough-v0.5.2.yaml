  cwe: CWE-829
  title: Remote Script Execution in Build (.github/workflows/ci.yml:358)
  scenario: 'The `heroku` job pipes a remote script straight into a shell: `.github/workflows/ci.yml:358` runs `curl https://cli-assets.heroku.com/install.sh
    | sh` with no checksum, no signature, and no version pin. Whatever bytes `cli-assets.heroku.com` returns at that moment
    execute as the runner user. The same job then hands `secrets.HEROKU_API_KEY` to the deploy step at ci.yml:371, and the
    job runs on every push to `master` and `develop`. An attacker who controls that host, its CDN edge, or the DNS answer
    for it — or a Heroku-side compromise — gains code execution on a runner holding a production deployment credential.'
  attack_steps:
  - An attacker gains control of content served at `cli-assets.heroku.com`, through a vendor-side compromise or a CDN/DNS
    hijack of that hostname.
  - The attacker serves a modified `install.sh` that installs the real CLI and additionally exfiltrates the runner's environment.
  - The next push to `master` runs `ci.yml:358`, executing the attacker's script as the runner user before `secrets.HEROKU_API_KEY`
    is used at line 371.
  - The attacker replays the stolen Heroku credential to deploy arbitrary code to the production `juice-shop` app.
  evidence_summary: Line 358 is a bare `run:` step piping curl output to `sh`; the workflow contains no checksum verification,
    GPG check, or pinned installer version for it.
  impact_description: Remote code execution on a release runner that holds the production Heroku deployment key.
  likelihood: Medium
  impact: Critical
  risk: High
  actor_ids:
  - ACT-D-06
  primary_actor: ACT-D-06
  controls_in_place: The job is gated to the upstream repository and to pushes on master/develop (ci.yml:351), so fork pull
    requests cannot reach it. The transport is HTTPS.
  mitigation_title: Replace the piped Heroku CLI installer with a pinned, checksum-verified install
  remediation:
    effort: Low
    steps:
    - Pin the installer to a specific released version, download it to a file, verify a checksum you have committed, and only
      then execute it — never pipe network output directly into a shell.
    - Prefer the distribution-packaged CLI (`npm install -g heroku@<exact version>` against a committed lockfile, or the vendor's
      signed apt/tarball release) so the artifact is version-addressable.
    - Move the deploy step into a separate job so the installer step and the step that receives `secrets.HEROKU_API_KEY` do
      not share a process environment.
    code_example: "- name: \"Install Heroku CLI\"\n  run: |\n    # Before: curl https://cli-assets.heroku.com/install.sh |\
      \ sh\n    # After: fetch to disk, verify the pinned digest, then execute\n    curl -fsSL -o heroku-install.sh https://cli-assets.heroku.com/install.sh\n\
      \    echo \"${{ env.HEROKU_INSTALLER_SHA256 }}  heroku-install.sh\" | sha256sum -c -\n    sh heroku-install.sh"
    verification: Corrupt one byte of the downloaded installer in a scratch branch and confirm the `sha256sum -c` step fails
      the job before the deploy step runs.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html
  evidence:
  - file: .github/workflows/ci.yml
    line: 358
  boundary_refs:
