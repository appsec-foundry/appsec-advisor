- local_id: auth-011
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-770
  title: Unbounded Session Cache Growth (lib/insecurity.ts:74)
  scenario: '`authenticatedUsers.put()` writes each issued token into two process-global objects, `tokenMap` keyed by the
    full JWT string and `idMap` keyed by user id. Nothing ever removes an entry: there is no logout handler, no expiry sweep
    tied to the token''s 6-hour lifetime, and no size bound — a repository-wide grep for token deletion or a logout route
    returns zero hits. Every successful login therefore adds a permanent entry holding the complete user object. An attacker
    with any working credential — or with the login SQL injection, which needs none — drives repeated logins and grows the
    map without limit until the Node heap is exhausted and the process dies, taking the whole single-process application down.
    The same absence means a stolen token stays honoured in the cache for its full lifetime with no way to revoke it.'
  attack_steps:
  - An attacker obtains one working credential, or uses the login injection which requires none.
  - The attacker loops the login endpoint, which is not rate-limited, so each request mints a new token and adds a permanent
    map entry holding the full user object.
  - The heap grows until the Node process exceeds its memory limit and terminates, ending service for all users.
  evidence_summary: '`lib/insecurity.ts:74` inserts into `tokenMap` on every login, and no code path in the repository deletes
    from it or bounds its size.'
  impact_description: Repeated logins exhaust process memory and crash the single application process; separately, no issued
    token can ever be revoked before its 6-hour expiry.
  likelihood: Medium
  impact: Medium
  risk: Medium
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  controls_in_place: None. Tokens carry a 6-hour `expiresIn`, but the cache entry outlives it because nothing reads the expiry.
  mitigation_title: Bound and expire the session cache and add server-side token revocation
  remediation:
    effort: Medium
    steps:
    - Replace the plain-object maps at lib/insecurity.ts:70-91 with an LRU cache carrying a max entry count and a TTL matching
      the token's 6-hour `expiresIn`, so entries are evicted automatically.
    - Add a logout route that deletes the caller's entry from both `tokenMap` and `idMap` and clears the `token` cookie.
    - Delete the user's cache entry on password reset, on 2FA enable and disable, and on role change, so those events actually
      terminate live sessions.
    - Move the cache to a shared store (Redis) if the application is ever run with more than one process, since a per-process
      object cannot enforce revocation across instances.
    - Add rate limiting on the login route (see auth-012) so the growth rate is bounded independently.
    code_example: "// After — entries expire with the token and the map cannot grow without bound\nimport { LRUCache } from\
      \ 'lru-cache'\nconst tokenMap = new LRUCache<string, ResponseWithUser>({\n  max: 10_000,\n  ttl: 6 * 60 * 60 * 1000\n\
      })\nexport const revoke = (token: string) => { tokenMap.delete(token) }"
    verification: Issue 20,001 logins against a cache configured with max 10,000 and assert the cache size stays at 10,000.
      Log out and assert the previously valid token is rejected on the next request.
    reference: CWE-770
  evidence:
  - file: lib/insecurity.ts
    line: 74
  evidence_check: verified
  controls_absent_evidence:
  - pattern: delete authenticatedUsers|tokenMap\[.*\] = undefined|logout
    search_paths:
    - lib/
    - routes/
    hit_count: 0
    searched_at: '2026-08-02T21:08:00Z'
