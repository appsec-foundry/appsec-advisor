- id: M-088
  title: Implement an erasure worker that anonymizes user rows and cascades to associate…
  threat_ids:
  - T-089
  priority: P3
  severity: Medium
  effort: Medium
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Implement an erasure worker that anonymizes user rows and cascades to associate…
  steps:
  - 'Add a worker that consumes `PrivacyRequests` rows with `deletionRequested = true` and performs a real erasure: overwrite
    `email`, `username`, `lastLoginIp`, `password`, and `totpSecret` with tombstone values before the soft delete, so the
    retained row carries no personal data.'
  - Cascade to associated records — delete or anonymise the user's Addresses, Cards, Memories, and Complaints in the same
    transaction; `paranoid` on the parent does nothing for children.
  - 'Extend the PrivacyRequests model beyond a boolean: add `requestedAt`, `completedAt`, and a status enum so the erasure
    is auditable and a stalled request is visible.'
  - Set a retention window for soft-deleted rows and purge them on schedule, so `deletedAt` marks a bounded grace period rather
    than permanent storage.
  code_example: "// erasure worker — After: the retained row is a tombstone, not a profile\nawait sequelize.transaction(async\
    \ (t) => {\n  await CardModel.destroy({ where: { UserId }, force: true, transaction: t })\n  await AddressModel.destroy({\
    \ where: { UserId }, force: true, transaction: t })\n  await UserModel.update(\n    { email: `deleted-${UserId}@invalid`,\
    \ username: '', password: '', totpSecret: '', lastLoginIp: '0.0.0.0' },\n    { where: { id: UserId }, transaction: t }\n\
    \  )\n  await UserModel.destroy({ where: { id: UserId }, transaction: t }) // soft delete of a scrubbed row\n})"
  verification: Submit a deletion request, run the worker, then assert `SELECT email, totpSecret FROM Users WHERE id = <user>`
    returns tombstone values and `SELECT COUNT(*) FROM Cards WHERE UserId = <user>` returns 0.
  reference: CWE-359
  file: models/user.ts:123
