  title: Uncontrolled recursion (lib/insecurity.ts:66)
  scenario: An attacker submits crafted markup to any caller of sanitizeSecure, which recurses at lib/insecurity.ts:66 until
    the sanitizer output stops changing. The function carries no depth counter, no iteration cap, and no input-size limit,
    so markup whose sanitized form never reaches a fixed point drives recursion until the Node.js stack overflows and the
    single-process server terminates the request handler chain.
  evidence_summary: lib/insecurity.ts:61 through 68 define sanitizeSecure as a self-call that repeats whenever the sanitized
    output differs from its input, with no recursion depth bound or length check.
  impact_description: A single crafted request can exhaust the call stack in the shared Node.js process, degrading or interrupting
    service for all users.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: The loop terminates only when sanitize-html output converges; no independent bound exists.
  mitigation_title: Bound the sanitizeSecure recursion with an iteration and size limit
  remediation:
    effort: Low
    steps:
    - Rewrite sanitizeSecure at lib/insecurity.ts:61 as a bounded loop with a small maximum iteration count and reject the
      input when the limit is reached.
    - Enforce a maximum input length before sanitization begins.
    - Add a test that feeds an input exceeding the iteration bound and asserts a rejection rather than a stack overflow.
    code_example: null
    verification: 'Run the new test: an input that does not converge within the iteration cap must produce a handled rejection
