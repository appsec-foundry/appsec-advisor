  stride: Information Disclosure
  cwe: CWE-311
  title: Missing Encryption of Sensitive Data at Rest (models/index.ts:41)
  scenario: 'The whole datastore is a single plain file — `storage: ''data/juiceshop.sqlite''` — created by the stock `sequelize`
    sqlite dialect with no page passphrase and no SQLCipher build. It sits inside the application''s own working directory,
    which is also the directory tree the application serves files from, so a path-traversal or arbitrary-file-read primitive
    anywhere in the shop reads the entire database in one request rather than one row at a time. What that file holds makes
    the difference material: `models/card.ts:38` stores `cardNum` as a full unmasked `INTEGER` primary account number with
    no tokenisation or truncation, and `models/user.ts:112` stores `totpSecret` as a plain `STRING` — the shared seed that
    generates second-factor codes. Neither field is encrypted at the column level either, so there is no defence-in-depth
    behind the missing file encryption. An attacker who obtains the file gets card numbers they can charge and TOTP seeds
    that defeat the second factor, without needing to break any cryptography.'
  attack_steps:
  - An attacker exploits any file-read or path-traversal primitive in the shop to fetch `data/juiceshop.sqlite` from the application's
    own working directory.
  - The attacker opens the file with the sqlite3 CLI, which succeeds without a passphrase, and reads `Cards.cardNum` and `Users.totpSecret`
    as cleartext.
  - The attacker charges the recovered card numbers and generates valid TOTP codes to defeat second-factor checks on the affected
