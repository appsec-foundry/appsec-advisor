- local_id: web3-nft-006
  threat_category_id: TH-17
  stride: Information Disclosure
  cwe: CWE-209
  title: Raw provider errors returned to caller (routes/nftMint.ts:33)
  scenario: 'Every handler in this component ends its catch block with res.status(500).json(utils.getErrorMessage(error)),
    and utils.getErrorMessage (lib/utils.ts:210) returns error.message verbatim with no sanitisation. The errors reaching
    that catch originate from the ethers WebSocketProvider constructed at routes/nftMint.ts:18 and routes/web3Wallet.ts:20,
    whose endpoint URL embeds the server''s third-party credential: wss://eth-sepolia.g.alchemy.com/v2/${process.env.ALCHEMY_API_KEY}.
    Provider and transport errors routinely quote the connection target, so an anonymous caller who triggers a failure — the
    endpoints need no authentication — can receive the Alchemy API key or, at minimum, the internal provider topology, dependency
    versions and failure modes. Because the same handler logs the message at line 20, the credential can also land in application
    logs and any downstream log sink.'
  evidence_summary: routes/nftMint.ts:33 serialises the raw `error.message` into the HTTP response, and the provider URL built
    at line 18 interpolates ALCHEMY_API_KEY into that error's likely text.
  impact_description: A third-party API credential and internal provider details can be echoed to unauthenticated callers
    and into logs.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None. Errors are passed through verbatim; no error mapper or redaction is applied on this surface.
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  mitigation_title: Return an opaque error body from web3 handlers and redact the provider URL before logging
  remediation:
    effort: Low
    steps:
    - 'Replace `res.status(500).json(utils.getErrorMessage(error))` in all four web3 handlers with a fixed body such as `{
      success: false, message: ''Internal error'' }` plus a correlation id.'
    - Log the full error server-side only, after masking the provider URL — pass the API key via the provider's options or
      strip `/v2/<key>` from any string before it reaches logger or response.
    - Add a global Express error handler so a newly added handler cannot regress to leaking raw messages.
    code_example: '// Before: res.status(500).json(utils.getErrorMessage(error))  // may echo the Alchemy key

      // After: caller sees an opaque id; the detail stays server-side and redacted

      const id = randomUUID()

      logger.error({ id, msg: utils.getErrorMessage(error).replace(/\/v2\/[^\s/]+/g, ''/v2/***'') })

      res.status(500).json({ success: false, message: ''Internal error'', id })'
    verification: Start the service with an invalid ALCHEMY_API_KEY, call `GET /rest/web3/nftMintListen`, and assert the response
      body contains neither the key nor the string `alchemy.com`.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
  evidence:
