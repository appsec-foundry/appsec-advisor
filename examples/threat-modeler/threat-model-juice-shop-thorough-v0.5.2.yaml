  stride: Spoofing
  cwe: CWE-798
  title: Hardcoded Cryptographic Key (models/securityAnswer.ts:45)
  affected_parameter: answer
  scenario: Security answers are the fallback authenticator for the password-reset flow, so a digest an attacker can invert
    is equivalent to a stored password. The SecurityAnswer model protects them with `security.hmac(answer)`, which is HMAC-SHA256
    under the literal key `pa4qacea4VK9t9nGv7yZtwmj` compiled into `lib/insecurity.ts:42`. Three defects compound here. The
    key is a source-code constant in a public repository, so it provides no secrecy against anyone who can read the project.
    HMAC-SHA256 is a single fast round with no work factor, so it is a poor choice for a low-entropy secret regardless of
    key handling. And the construction is deterministic without a per-row salt, so equal answers yield equal digests and one
    precomputed table covers every user. Security answers draw from a small space — a pet name, a city, a mother's maiden
    name — so a wordlist of a few hundred thousand entries inverts essentially the whole SecurityAnswers table.
  attack_steps:
  - An attacker reads the static HMAC key from the published source of this open-source application, where it is a literal
    in `lib/insecurity.ts`.
  - The attacker computes HMAC-SHA256 under that key over a wordlist of common security answers such as pet names, cities,
    and surnames.
  - The attacker matches the resulting table against stolen `SecurityAnswers.answer` digests and drives the password-reset
    flow to take over each matched account.
  evidence_summary: '`models/securityAnswer.ts:45` protects every answer with `security.hmac`, whose key is a source-code
    literal in `lib/insecurity.ts:42` and whose construction is a single unsalted SHA256 round.'
  impact_description: An attacker with any read of the SecurityAnswers table recovers cleartext answers and resets passwords
    on arbitrary accounts, bypassing the primary credential entirely.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: The answer is not stored in cleartext, and a keyed construction is used — but the key is public and the
    construction has no salt or work factor.
  mitigation_title: Hash security answers with argon2id and load any keying material from external configuration
  remediation:
    effort: Medium
    steps:
    - Replace the `set (answer)` HMAC call at models/securityAnswer.ts:44-46 with the same async `beforeSave` argon2id path
      used for passwords, so answers get a per-row salt and a memory-hard work factor.
    - 'Normalise before hashing (trim, casefold) so verification stays usable, and treat the answer as a credential everywhere:
      never return it in an API response and never compare it outside a constant-time verify.'
    - If a pepper is retained in addition to the KDF, read it from an environment variable or secret manager at startup and
      fail startup when absent — never from a source literal.
    - 'Invalidate the existing rows: mark all current answers as legacy, require re-enrollment on next login, and rate-limit
      the reset endpoint so an inverted answer alone does not grant unlimited attempts.'
    code_example: "// models/securityAnswer.ts — Before: deterministic, public key, no work factor\n// answer: { type: DataTypes.STRING,\
      \ set (a: string) { this.setDataValue('answer', security.hmac(a)) } }\n\n// After: per-row salt + memory-hard KDF; equal\
      \ answers no longer share a digest\nanswer: { type: DataTypes.STRING(255) },\n\nSecurityAnswer.addHook('beforeSave',\
      \ async (sa: SecurityAnswer) => {\n  if (!sa.changed('answer')) return\n  sa.setDataValue('answer', await argon2.hash(sa.answer.trim().toLowerCase(),\
      \ { type: argon2.argon2id }))\n})"
    verification: Enroll the same answer `fluffy` on two accounts and assert the two stored digests differ. Assert that a
      grep for the literal key string across the repository returns zero hits.
    reference: CWE-798
