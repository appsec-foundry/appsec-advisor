  title: Predictable Credential (frontend/src/app/oauth/oauth.component.ts:30)
  scenario: 'An attacker who knows any Google-login user''s email address can authenticate as that user without touching Google.
    On the OAuth callback, `oauth.component.ts:30` computes `const password = btoa(profile.email.split('''').reverse().join(''''))`
    and registers the account with it via `userService.save()`, then `login()` at line 46 reuses the same derivation to sign
    in through the ordinary `/rest/user/login` password endpoint. The derivation is a public, deterministic function of a
    public identifier: base64 of the reversed email. Every OAuth account therefore also has a working local password that
    the attacker can compute offline, which makes the password endpoint a parallel authentication path around the federated
    flow entirely — MFA, Google account recovery, and the `authorizedRedirects` allowlist all sit on the other path and never
    see the request.'
  attack_steps:
  - An attacker learns a target's email address, for example `bender@juice-sh.op`, from the product reviews or the feedback
    list.
  - The attacker computes the password locally as `btoa('po.hs-eciuj@rednep')` — base64 of the reversed email — using the
    same expression as `oauth.component.ts:30`.
  - The attacker posts that email and computed password to `/rest/user/login` and receives a valid JWT for the victim's account,
    never contacting Google.
