  title: Insecure Password Hashing (lib/insecurity.ts:41)
  scenario: Passwords are stored as a single unsalted MD5 digest. The exported `hash()` helper is a bare MD5 of the cleartext,
    and the User model's password setter calls it on every write, so every row in the Users table holds a raw MD5 value. MD5
    is fast to compute and unsalted digests are identical across users, so an attacker who obtains the table — trivially,
    via the login SQL injection in routes/login.ts — recovers plaintext passwords by rainbow-table lookup for common values
    and by GPU brute force for the rest, at rates measured in billions of guesses per second. Identical hashes also reveal
    which users share a password. The same `hash()` function additionally gates 2FA setup and 2FA disable in routes/2fa.ts,
    so cracking one password removes the victim's second factor as well.
  evidence_summary: '`lib/insecurity.ts:41` returns an unsalted MD5 digest, and the User model''s password setter is its only
    caller for stored credentials.'
  impact_description: A single database read yields plaintext passwords for most accounts, enabling takeover here and credential
    reuse against the users' other services.
  likelihood: High
  impact: High
  risk: High
  actor_ids:
  - ACT-D-01
  - ACT-D-03
  primary_actor: ACT-D-01
  controls_in_place: None. No salt, no per-user work factor, no pepper, and no password policy on the User model.
  mitigation_title: Migrate stored credentials to bcrypt with per-user salt and rehash on next login
  remediation:
    effort: High
    steps:
    - Replace `hash()` at lib/insecurity.ts:41 with `bcrypt.hash(password, 12)` (or argon2id with a tuned memory cost) and
      make verification use the constant-time `bcrypt.compare`.
    - 'Migrate lazily: keep a `passwordAlgorithm` column, verify legacy rows against MD5 once, and immediately rewrite the
      row with the bcrypt digest on the next successful login.'
    - Reject passwords longer than 72 UTF-8 bytes before hashing rather than relying on bcrypt's silent truncation, and apply
      the check at set and change time.
    - Update the two `security.hash(password)` comparisons in routes/2fa.ts (lines 107 and 152) to the constant-time comparison
      so 2FA setup and disable do not keep the legacy path alive.
    - Force a password reset for all accounts once migration is available, since existing MD5 digests must be assumed cracked.
    code_example: '// Before — one fast, unsalted digest for every user

      // export const hash = (data: string) => crypto.createHash(''md5'').update(data).digest(''hex'')


      // After — per-user salt and a tunable work factor make offline cracking

      // infeasible, and compare() is constant-time

      import bcrypt from ''bcryptjs''

      export const hashPassword = (plain: string) => bcrypt.hash(plain.slice(0, 72), 12)

      export const verifyPassword = (plain: string, stored: string) => bcrypt.compare(plain, stored)'
    verification: Register a new user and read the stored password column — it must start with a bcrypt identifier such as
      `$2b$12$` and must differ between two users who chose the same password.
