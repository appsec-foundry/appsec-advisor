  title: NoSQL Injection (routes/updateProductReviews.ts:18)
  affected_parameter: id
  scenario: 'The review update handler passes `req.body.id` straight into a Mongo-style selector as `{ _id: req.body.id }`
    and issues the update with `{ multi: true }`. Because the body is parsed JSON, the attacker controls the type of that
    field, not just its value: sending an object such as `{"$ne": ""}` turns the selector into a predicate that matches every
    stored review, and `multi: true` applies the update to all of them in one request. The handler also reads the authenticated
    user at line 16 but never uses it in the selector, so no ownership predicate limits the rows either. The route requires
    a token (server.ts:634), which open registration makes trivial to obtain.'
  evidence_summary: 'routes/updateProductReviews.ts:18-20 uses `req.body.id` as the selector value with `multi: true`, so
    a JSON object supplied by the caller becomes a query operator.'
  impact_description: Any authenticated user rewrites the message of every product review in the store, and can overwrite
    reviews authored by others.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: Authentication on the route. The authenticated identity is read at routes/updateProductReviews.ts:16
    but only for challenge bookkeeping, never as a selector constraint.
  mitigation_title: Coerce the review id to a string and scope the update to the authenticated author
  remediation:
    effort: Low
    steps:
    - Validate `req.body.id` as a string before use and reject non-string types, so an object cannot become a query operator.
    - 'Add `author: user.data.email` to the selector so the update can only touch the caller''s own review.'
    - 'Drop `multi: true`; a single-review update never needs to modify more than one document.'
    - 'Add a test posting `{"id": {"$ne": ""}}` and assert the response reports zero modified documents.'
    code_example: "// Before - routes/updateProductReviews.ts:18: a JSON object becomes an operator\n// db.reviewsCollection.update({\
      \ _id: req.body.id }, { $set: { message } }, { multi: true })\n\n// After: string-typed id plus an ownership predicate,\
      \ single document\nif (typeof req.body.id !== 'string') return res.status(400).json({ error: 'invalid id' })\nawait\
      \ db.reviewsCollection.update(\n  { _id: req.body.id, author: user.data.email },\n  { $set: { message: String(req.body.message\
      \ ?? '') } }\n)"
    verification: PATCH `/rest/products/reviews` with `{"id":{"$ne":""},"message":"x"}` using a valid token and assert HTTP
      400 and that no review documents were modified.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
  evidence:
