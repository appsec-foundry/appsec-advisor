  stride: Information Disclosure
  cwe: CWE-200
  title: Repository secrets exposed to job-wide environment (ci.yml:252)
  scenario: An attacker whose code runs anywhere in the e2e-test job — through a dependency install hook or the third-party
    Cypress action — reads CYPRESS_RECORD_KEY, ALCHEMY_API_KEY, SOLUTIONS_WEBHOOK, and GITHUB_TOKEN from the process environment,
    because the secrets are injected into the whole step environment rather than scoped to a single vetted command.
  evidence_summary: The e2e-test step passes four repository secrets as env values to the cypress-io/github-action step that
    also executes the application and its unpinned-install dependency tree.
  impact_description: Leaked recording keys, the challenge-solution webhook, and a repository-scoped GITHUB_TOKEN let an attacker
    forge CI signals and act against the repository outside the pipeline.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: Fork pull requests do not receive repository secrets from GitHub; the Cypress action is SHA-pinned.
  mitigation_title: Scope e2e secrets to the minimum steps in ci.yml
  remediation:
    effort: Medium
    steps:
    - Drop GITHUB_TOKEN from the Cypress step env unless a specific action input requires it, and move the remaining secrets
      to the narrowest step that needs each one.
    - Add a review check that every `secrets.` reference in .github/workflows/ names the step that consumes it.
    code_example: null
    verification: Re-run the e2e-test job after removing each secret in turn and confirm the job still passes for every secret
      the tests do not actually consume.
