- local_id: file-upload-service-006
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: YAML alias-expansion memory exhaustion (routes/fileUpload.ts:109)
  affected_parameter: uploaded .yml document
  scenario: 'handleYamlUpload evaluates yaml.load(data) inside a vm context at routes/fileUpload.ts:109 with `{ timeout: 2000
    }`. A vm timeout bounds wall-clock execution but not heap allocation, and V8 does not interrupt a running allocation to
    honour it - a billion-laughs YAML document whose nested aliases multiply out to gigabytes drives the Node process toward
    its heap limit before the 2000 ms deadline can take effect. The catch block on lines 114-119 already anticipates this
    by matching ''Invalid string length'' and marking a yamlBomb challenge solved, which confirms the expansion runs to completion
    rather than being pre-empted. Since the endpoint is anonymous, a handful of concurrent requests can push the single Node
    process into an out-of-memory abort, taking the whole shop down rather than only the upload feature.'
  attack_steps:
  - An attacker writes a YAML document with nine levels of nested aliases, each level referencing the previous one several
    times, well under the 200 KB upload cap.
