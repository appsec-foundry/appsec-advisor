  title: Insecure Token Storage (frontend/src/app/Services/request.interceptor.ts:16)
  scenario: 'The session JWT is kept where any script in the origin can read it. `login.component.ts:101`, `oauth.component.ts:51`,
    `payment.component.ts:232`, and `two-factor-auth-enter.component.ts:56` all write the token with `localStorage.setItem(''token'',
    ...)`, and `request.interceptor.ts:16` reads it back on every outgoing request to build the `Authorization: Bearer` header.
    The pre-authentication 2FA token is held the same way (`two-factor-auth-service.ts:38` reads `totp_tmp_token` from `localStorage`).
    The token is additionally mirrored into a cookie at `login.component.ts:104` with only an `expires` option — a grep for
    `httpOnly`, `secure:`, or `sameSite` across `frontend/src/app` returns zero hits, so that copy is JavaScript-readable,
    is sent cross-site, and travels in cleartext wherever the deployment is not HTTPS (`environment.ts:12` points `hostServer`
    at `http://localhost:3000`). Any of the nine sanitizer bypasses in this component turns into full credential theft with
    a one-line payload, and the stolen token stays valid until its own expiry because there is no server-side session to revoke.'
  attack_steps:
  - An attacker lands script in the application origin through one of the sanitizer-bypass sinks, for example the search `q`
    parameter.
  - The payload reads the credential directly with `localStorage.getItem('token')`, which no browser control protects.
  - 'The attacker replays that value as an `Authorization: Bearer` header from their own client and acts as the victim for
    the token''s remaining lifetime.'
  evidence_summary: '`request.interceptor.ts:16` builds every request''s `Authorization` header from `localStorage.getItem(''token'')`,
    a store readable by any script in the origin.'
  impact_description: One successful script injection yields a reusable bearer token for the victim's account, with no server-side
    revocation path.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: The cookie copy written at `login.component.ts:104` expires after 8 hours, and `invalidateSession()`
    at `oauth.component.ts:63` clears both stores on error. Neither limits read access by script.
  mitigation_title: Move the session credential into an HttpOnly Secure SameSite cookie and drop the localStorage copy
  remediation:
    effort: Medium
    steps:
    - 'Have the Express login route set the session cookie itself with `httpOnly: true, secure: true, sameSite: ''strict''`
      and stop returning the raw token in the response body.'
    - Remove every `localStorage.setItem('token', ...)` call — `login.component.ts:101`, `oauth.component.ts:51`, `payment.component.ts:232`,
      `two-factor-auth-enter.component.ts:56` — and the mirror `cookieService.put('token', ...)` writes at `login.component.ts:104`,
      `oauth.component.ts:50`, `payment.component.ts:233`.
