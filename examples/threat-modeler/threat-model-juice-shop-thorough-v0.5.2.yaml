  stride: Denial of Service
  cwe: CWE-409
  title: Uncontrolled Archive Expansion (routes/fileUpload.ts:29)
  scenario: '`extractZipBuffer` iterates every entry of an uploaded archive and streams each one to disk with no bound on
    entry count, per-entry uncompressed size, or cumulative output. The upload itself is capped at 200 KB by multer (server.ts:692),
    but that cap applies to the compressed input; a 200 KB zip of highly redundant data expands to many gigabytes. Because
    the loop awaits each `pipeline` sequentially and never checks free space or an aggregate byte counter, a single anonymous
    POST to `/file-upload` fills the volume backing `uploads/`, which is the same filesystem that holds the SQLite database
    and the log files. Repeated posts also hold the event loop in filesystem work.'
  evidence_summary: routes/fileUpload.ts:29-35 loops over `directory.files` and writes every entry with no entry-count, per-file,
    or cumulative size limit.
  impact_description: One anonymous upload exhausts the application volume, which stops writes to the database, the logs and
    subsequent uploads.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: A 200 KB multer limit on the compressed upload (server.ts:692). It bounds the input, not the expanded
    output.
  mitigation_title: Cap entry count and cumulative uncompressed size during zip extraction
  remediation:
    effort: Low
    steps:
    - Track a running total of bytes written in the loop at routes/fileUpload.ts:29 and abort the extraction once it exceeds
      a fixed budget such as 10 MB.
    - Reject archives whose `directory.files.length` exceeds a small maximum before extraction starts.
    - Check each entry's declared `uncompressedSize` against the remaining budget and skip the entry rather than streaming
      it.
    - Write extracted files to a dedicated volume or quota-limited directory so exhaustion cannot affect the database or logs.
    code_example: "// After: entry-count and cumulative-size budgets bound the expansion\nconst MAX_ENTRIES = 50\nconst MAX_TOTAL_BYTES\
      \ = 10 * 1024 * 1024\nif (directory.files.length > MAX_ENTRIES) throw new Error('too many entries')\nlet written = 0\n\
      for (const entry of directory.files) {\n  written += entry.uncompressedSize ?? 0\n  if (written > MAX_TOTAL_BYTES) throw\
      \ new Error('archive too large when expanded')\n  // ... validated write\n}"
    verification: Upload a 200 KB zip whose entries expand to more than 1 GB and assert the request fails with HTTP 4xx and
      that total bytes written under `uploads/` stay below the configured budget.
    reference: CWE-409
