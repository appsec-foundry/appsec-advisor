  title: JWT verified without algorithm allowlist (lib/insecurity.ts:52)
  scenario: An unauthenticated attacker fetches the RSA public key that the server publishes under /encryptionkeys, signs
    a self-made token whose payload sets data.role to admin using HS256 with that public key as the HMAC secret, and sends
