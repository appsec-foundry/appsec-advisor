  stride: Elevation of Privilege
  cwe: CWE-347
  title: Improper signature verification (lib/insecurity.ts:55)
  scenario: An attacker forges the 2FA temporary token because security.verify at lib/insecurity.ts:55 calls jws.verify with
    only two arguments, so the public key is consumed as the algorithm parameter and no key is supplied for signature checking.
    routes/2fa.ts:20 trusts that result before reading userId from the decoded payload, letting an attacker present a self-made
    tmpToken naming any account, supply the matching TOTP code for a secret they control, and receive a full session token
    without the victim's password or second factor.
  attack_steps:
  - I craft a JWS whose payload sets userId to the victim and type to password_valid_needs_second_factor_token.
  - I post it as tmpToken to /rest/2fa/verify together with a TOTP code, since the verify helper supplies no key to check
    the signature against.
  - The handler loads the victim by that userId and returns a full session token bound to their account.
  evidence_summary: lib/insecurity.ts:55 invokes jws.verify with a two-argument cast so publicKey occupies the algorithm slot
    and no verification key is passed, and routes/2fa.ts:20 and 115 gate the 2FA verify and setup flows on that return value.
  impact_description: Second-factor enforcement and the setup-token integrity guarantee both collapse, allowing full session
    issuance for any account without password or TOTP knowledge.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: TOTP verification runs, but the token that names the account under verification is not authentically
    signed.
  mitigation_title: Verify the temporary 2FA token with a pinned algorithm and key
  remediation:
    effort: Low
    steps:
    - 'Replace the jws.verify call at lib/insecurity.ts:55 with jwt.verify passing the public key and algorithms: [''RS256''],
      and remove the cast that hid the wrong arity.'
    - Bind the tmpToken to the authenticating session and give it a short expiry so it cannot be replayed or minted independently.
    - Add a negative test posting an unsigned or attacker-signed tmpToken to the 2FA verify route and asserting HTTP 401.
    code_example: null
    verification: 'Run the new negative test: a tmpToken with an invalid or absent signature must yield HTTP 401 from /rest/2fa/verify
      and issue no session token.'
    reference: 'CWE-347: Improper Verification of Cryptographic Signature'
  evidence:
  - file: lib/insecurity.ts
