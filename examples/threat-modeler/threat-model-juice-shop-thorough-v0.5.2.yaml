  title: Path Traversal via Archive Extraction (routes/fileUpload.ts:34)
  scenario: Zip entries are written using the archive's own entry name with no normalisation. routes/fileUpload.ts:31 resolves
    `'uploads/complaints/' + fileName`, and the guard on line 33 only asserts that the resolved path is inside the process
    working directory — an entry named `../../ftp/legal.md` satisfies that check while still escaping the intended upload
    directory. Worse, the write on line 34 does not use the resolved path at all; it concatenates the raw entry name into
    `fs.createWriteStream`, so traversal segments are honoured by the filesystem regardless of what the guard computed. Because
    `/file-upload` is registered without authentication (server.ts:309), an anonymous client can overwrite any file the application
    user can write, including files served from `ftp/` and the SQLite database.
  evidence_summary: routes/fileUpload.ts:34 streams each entry to `'uploads/complaints/' + fileName` using the unnormalised
    archive entry name, bypassing the resolved-path check on line 33.
  impact_description: An anonymous uploader writes attacker-chosen content to arbitrary writable paths, which allows overwriting
    served files and application data.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: A containment check comparing the resolved absolute path to the process working directory (routes/fileUpload.ts:33).
    It is both too permissive and applied to a different path than the one written.
  mitigation_title: Normalize and confine zip entry paths before writing extracted files
  remediation:
    effort: Low
    steps:
    - Compute `const target = path.resolve(UPLOAD_DIR, entry.path)` and skip the entry unless `target.startsWith(path.resolve(UPLOAD_DIR)
      + path.sep)`.
    - Write to that validated `target`, never to a freshly concatenated string, so the check and the write refer to the same
      path.
    - Reject entries whose type is not `File` and entries whose name contains `..` or an absolute prefix before any filesystem
      call.
    - Cap the entry count and the cumulative uncompressed size before extraction begins.
    code_example: '// Before - routes/fileUpload.ts:34: the raw entry name reaches the filesystem

      // await pipeline(entry.stream(), fs.createWriteStream(''uploads/complaints/'' + fileName))


      // After: resolve, confine, then write to the validated path

      const root = path.resolve(''uploads/complaints'')

      const target = path.resolve(root, entry.path)

      if (!target.startsWith(root + path.sep)) continue

      await pipeline(entry.stream(), fs.createWriteStream(target))'
