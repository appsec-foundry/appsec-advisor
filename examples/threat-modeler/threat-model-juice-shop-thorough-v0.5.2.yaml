  title: Zip Slip arbitrary file write (routes/fileUpload.ts:33)
  affected_parameter: ZIP entry path
  scenario: 'extractZipBuffer() at routes/fileUpload.ts:28-36 iterates every archive entry and writes it with the raw, attacker-controlled
    entry.path concatenated onto the literal prefix ''uploads/complaints/''. The only guard is absolutePath.includes(path.resolve(''.''))
    on line 33, which merely asserts that the resolved target lies somewhere beneath the repository root - it does not assert
    that it lies beneath uploads/complaints/. An entry named ../../ftp/legal.md resolves to <repo>/ftp/legal.md, passes the
    includes() check, and is written. Because the write on line 34 uses the un-normalised relative concatenation rather than
    the validated absolutePath, an attacker can place files anywhere in the application directory: overwrite ftp/legal.md,
    drop a file into the publicly served frontend/dist/frontend tree, or clobber a .ts/.js source file that the process will
    load on the next restart. The endpoint is anonymous (see file-upload-service-002), so no account is needed.'
  attack_steps:
  - An attacker crafts a ZIP archive containing a single entry whose stored name is `../../ftp/legal.md` instead of a plain
    filename.
  - The attacker POSTs the archive to `/file-upload` as multipart field `file` with no credentials, since the route registers
    no auth middleware.
  - '`extractZipBuffer` resolves the entry to a path still inside the repository root, so the `includes(path.resolve(''.''))`
    guard on line 33 passes.'
