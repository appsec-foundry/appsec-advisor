  title: XXE External Entity Parsing (lib/xml.ts:35)
  scenario: 'The shared XML parser enables entity substitution and DTD loading and then explicitly grants the WASM parser
    host filesystem access. lib/xml.ts:35 combines `XML_PARSE_NOENT` with `XML_PARSE_DTDLOAD`, and lib/xml.ts:22 calls `xmlRegisterFsInputProviders()`
    so that `file://` system entities resolve against the container filesystem. The reachable caller is the upload handler:
    routes/fileUpload.ts:76 passes the uploaded buffer to `parseXmlString`, and line 79 places the expanded document into
    an error message that the error handler returns to the client. The attacker therefore both triggers the read and receives
    its contents. The upload route at server.ts:309 carries no authentication middleware, so the whole chain is available
    to an anonymous client.'
  evidence_summary: lib/xml.ts:35 sets `XML_PARSE_NOENT | XML_PARSE_DTDLOAD` and lib/xml.ts:22 registers filesystem input
    providers for the parser.
  impact_description: An anonymous uploader reads arbitrary files readable by the application user and receives their contents
    in the HTTP response.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: A 2000 ms parse timeout (lib/xml.ts:38) and a 200 KB multer upload cap. Both bound expansion cost; neither
    prevents entity resolution.
  mitigation_title: Disable entity substitution and DTD loading in the shared XML parser
  remediation:
    effort: Low
    steps:
    - Remove `XML_PARSE_NOENT` and `XML_PARSE_DTDLOAD` from the option mask at lib/xml.ts:35, leaving only `XML_PARSE_NOBLANKS`.
    - Delete the `xmlRegisterFsInputProviders()` call at lib/xml.ts:22 so the parser has no filesystem resolver at all.
    - Reject any document whose prolog contains a `<!DOCTYPE` declaration before parsing, so entity definitions never reach
      the parser.
    - Stop echoing parsed document content into the error message at routes/fileUpload.ts:79; return a generic rejection instead.
    code_example: '// Before - lib/xml.ts:35: entities resolve and the parser can read the filesystem

      // const option = libxml2.ParseOption.XML_PARSE_NOENT | libxml2.ParseOption.XML_PARSE_DTDLOAD | ...


      // After: no entity substitution, no external DTD, no fs provider registered

      const option = libxml2.ParseOption.XML_PARSE_NOBLANKS | libxml2.ParseOption.XML_PARSE_NOCDATA'
