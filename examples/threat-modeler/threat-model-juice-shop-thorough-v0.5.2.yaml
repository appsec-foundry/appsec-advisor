- local_id: socket-io-gateway-004
  threat_category_id: TH-06
  additional_categories:
  - TH-02
  stride: Elevation of Privilege
  cwe: CWE-863
  title: Client-Controlled State Transition (lib/startup/registerWebsocketEvents.ts:40)
  scenario: 'Three handlers — `verifyLocalXssChallenge`, `verifySvgInjectionChallenge`, `verifyCloseNotificationsChallenge`
    (lines 40-51) — let the client''s own payload decide whether a server-side challenge is marked solved. Each passes `data`
    straight into `challengeUtils.solveIf(...)`, whose predicate is a pure string comparison or a regex over that payload;
    nothing corroborates that the described action actually happened in the browser. `verifyCloseNotificationsChallenge` is
    the extreme case: the predicate is `Array.isArray(data) && data.length > 1`, so emitting a two-element array is the whole
    exploit. Because the socket has no identity, an anonymous client drives a privileged application state transition that
    `solveIf` propagates into the persisted challenge record and the global solve broadcast, attributing progress that the
    caller never earned and was never authenticated to claim.'
  attack_steps:
  - An attacker opens an unauthenticated Socket.IO connection to port 3000.
  - The attacker emits `verifyCloseNotificationsChallenge` with the payload `[1,2]`, which satisfies the handler's entire
    `Array.isArray(data) && data.length > 1` predicate.
  - '`solveIf` marks the challenge solved server-side and the solve is persisted and broadcast as though the attacker had
    performed the real in-browser action.'
  evidence_summary: The verify handlers pass the client payload directly into `challengeUtils.solveIf`, so the client's own
    message is the sole evidence the server accepts for a state transition it persists.
  impact_description: An unauthenticated client can forge application progress state that is persisted and broadcast to all
    users, with no authenticated actor bound to the change.
  likelihood: High
  impact: Low
  risk: Medium
  controls_in_place: '`verifySvgInjectionChallenge` additionally calls `security.isRedirectAllowed(data)`, but that checks
    the payload string against a redirect allow-list — it does not establish that the client performed the action or that
    the client is authorized to claim it.'
  mitigation_title: Bind challenge-verification events to an authenticated principal and derive solve state from server-observed
    facts
  remediation:
    effort: Medium
    steps:
    - Gate all three `verify*` handlers on `socket.data.user` from the handshake middleware and ignore the event when no principal
      is attached.
    - Attribute the solve to `socket.data.user.id` inside `challengeUtils.solveIf` instead of letting an anonymous socket
      mutate global challenge state.
    - Replace client-asserted predicates with server-observed evidence where the action is server-visible (for example, correlate
      the SVG-injection solve with the actual `/redirect` request the server handled) so the payload is corroboration rather
      than proof.
    - Validate the payload shape (`typeof data === 'string'`, bounded length; a bounded array for the close-notifications
      event) before evaluating any predicate.
    code_example: "socket.on('verifyCloseNotificationsChallenge', (data: any) => {\n  const user = socket.data.user\n  if\
      \ (!user) { return }                       // anonymous sockets cannot claim progress\n  if (!Array.isArray(data) ||\
      \ data.length > 100) { return }\n  challengeUtils.solveIf(challenges.closeNotificationsChallenge,\n    () => notificationsDismissedBy(user.id)\
      \ > 1)  // server-observed, not client-asserted\n})"
    verification: From an unauthenticated socket, emit `verifyCloseNotificationsChallenge` with `[1,2]` and assert the challenge
      record is unchanged and no `challenge solved` broadcast is emitted.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
  evidence:
