  title: Mutable Action Reference (.github/workflows/image_actions.yml:33)
  scenario: 'Most workflows in this repository pin third-party actions to 40-character commit SHAs, but six references do
    not. The worst is `.github/workflows/image_actions.yml:33`, which uses `calibreapp/image-actions@main` — a branch ref
    that resolves to whatever the upstream maintainer last pushed, and which receives `secrets.GITHUB_TOKEN` at line 35. The
    same file uses `actions/checkout@v6` (line 30) and `peter-evans/create-pull-request@v8` (line 42); `.github/workflows/ci.yml:188`
    uses `coverallsapp/github-action@v2` with `secrets.GITHUB_TOKEN`; `.github/workflows/codeql-analysis.yml:23,34,36` use
    `github/codeql-action/*@v3` in a job holding `security-events: write`. Git tags and branches are mutable, so an upstream
    account takeover silently replaces the code executed inside these jobs — the SHA-pinning control the pipeline otherwise
    relies on simply is not applied here.'
  attack_steps:
  - An attacker compromises the `calibreapp/image-actions` repository, by maintainer-account takeover or by a malicious commit
    to its `main` branch.
  - The attacker pushes code to `main` that reads the job environment and calls the GitHub API with the token it is handed.
  - The next image change pushed to master runs `image_actions.yml:33`, which resolves `@main` to the attacker's commit and
    passes it `secrets.GITHUB_TOKEN` at line 35.
  - The attacker uses that token to commit to the repository, giving them a foothold in the source tree that feeds the release
    pipeline.
  evidence_summary: 'A repository-wide search for `uses:` references lacking a 40-hex SHA returns six hits: image_actions.yml
    lines 30, 33 and 42; ci.yml line 188; codeql-analysis.yml lines 23, 34 and 36.'
  impact_description: An upstream account takeover of any of these actions executes attacker code inside jobs that are handed
    the repository's GITHUB_TOKEN.
  likelihood: Medium
  impact: High
  risk: High
  actor_ids:
  - ACT-D-06
  primary_actor: ACT-D-06
  controls_in_place: 'Partial: the majority of action references — actions/checkout, actions/setup-node, docker/*, cypress-io/github-action,
    softprops/action-gh-release, nick-invision/retry, Gamesight/slack-workflow-status — are SHA-pinned with a version comment.
    image_actions.yml is additionally gated to same-repository events (lines 24-27).'
  mitigation_title: SHA-pin the six remaining mutable action references
  remediation:
    effort: Low
    steps:
    - Replace `calibreapp/image-actions@main` (image_actions.yml:33) with the 40-character commit SHA of the release you intend
      to run, followed by a `#vX.Y.Z` comment matching the convention already used in ci.yml:29.
    - Do the same for `actions/checkout@v6` (image_actions.yml:30), `peter-evans/create-pull-request@v8` (image_actions.yml:42),
      `coverallsapp/github-action@v2` (ci.yml:188) and the three `github/codeql-action/*@v3` references (codeql-analysis.yml:23,
      34, 36).
    - Enable the organisation Actions policy that permits only SHA-pinned third-party actions, or add a `zizmor`/`actionlint`
      step to CI that fails on any `uses:` value without a 40-hex ref.
    - Let Dependabot's `github-actions` ecosystem update the pinned SHAs so pinning does not mean running stale code.
    code_example: "# .github/workflows/image_actions.yml\n# Before: a branch ref — resolves to whatever upstream last pushed\n\
      # uses: calibreapp/image-actions@main\n# After: an immutable commit SHA, version recorded in a comment\n- uses: calibreapp/image-actions@1c8a1b4e40ebb1eb5b02e3a1b30b9db0d0e75b34\
      \ #v1.1.0\n  with:\n    githubToken: ${{ secrets.GITHUB_TOKEN }}"
    verification: 'Run `grep -rn ''uses: .*@'' .github/workflows/ | grep -vE ''@[0-9a-f]{40}''` and confirm it returns no
      lines; wire the same command into a CI step that exits non-zero on any hit.'
    reference: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
  evidence:
  - file: .github/workflows/image_actions.yml
    line: 33
