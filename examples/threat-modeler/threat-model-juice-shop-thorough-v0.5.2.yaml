    since the credential becomes ambient.
  - Proxy `/api` and `/rest` calls through the BFF so the browser never holds or transmits the API bearer token itself.
  - Expose a `/rest/user/whoami` endpoint that returns role and entitlement from the verified session, replacing the SPA's
    own `jwtDecode()` inspection in `app.guard.ts`.
  - Add server-side session revocation so a compromised session can be terminated before token expiry.
  verification: After the change, log in and assert the login response body contains no JWT, `localStorage` holds no `token`
    key, and the only credential present is an `HttpOnly` cookie. Confirm a direct browser call to `/api/Users` without the
    BFF proxy is rejected.
