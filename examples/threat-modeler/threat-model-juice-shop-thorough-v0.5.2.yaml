  title: Unauthenticated file-upload endpoint (routes/fileUpload.ts:19)
  scenario: 'The middleware chain for POST /file-upload (server.ts:309) is uploadToMemory.single(''file'') -> ensureFileIsPassed
    -> observeFileUploadMetricsMiddleware -> checkUploadSize -> checkFileType -> handleZipFileUpload -> handleXmlUpload ->
    handleYamlUpload. None of these establishes or checks a caller identity: ensureFileIsPassed (routes/fileUpload.ts:19)
    only asserts that a multipart part was present, and routes/fileUpload.ts imports no authentication helper at all. server.ts
    uses security.isAuthorized() on 23 other routes, so the omission here is specific to the upload surface rather than a
    global design. Every downstream weakness in this component - Zip Slip write, XXE file read, decompression bomb - is therefore
    reachable by an anonymous internet client with a single curl request, and no user account, session, or token has to be
    obtained first. The absence of an identity also means the metrics and error paths record no principal, so the uploads
    cannot be attributed after the fact.'
  attack_steps:
  - An attacker discovers `POST /file-upload` from the client bundle or by probing, without holding any account on the shop.
  - The attacker sends a multipart request with field `file` and no `Authorization` header and no session cookie.
  - The request passes `ensureFileIsPassed` on line 19 - the only gate in the chain - and reaches the ZIP, XML, and YAML handlers
    with full effect.
  evidence_summary: routes/fileUpload.ts imports no module from lib/insecurity and defines no identity check; ensureFileIsPassed
    on line 19 branches solely on whether req.file is non-null.
  impact_description: Anonymous internet clients can drive the archive-extraction, XXE, and parser-bomb paths of this component
    without ever authenticating.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None. A 200000-byte multer limit applies but performs no identity check.
  mitigation_title: Require an authenticated session on POST /file-upload and rate-limit it per principal
  remediation:
    effort: Low
    steps:
    - Insert `security.isAuthorized()` into the `app.post('/file-upload', ...)` chain in server.ts:309, ahead of `ensureFileIsPassed`,
      matching the pattern already used on the other 23 protected routes.
    - Add an `express-rate-limit` instance to the same chain (the package is already imported at server.ts:31) keyed on the
      authenticated user id, so a single account cannot drive unbounded extraction work.
    - Log the authenticated principal alongside each accepted upload so the action is attributable.
    code_example: "app.post('/file-upload',\n  // After: identity is established before any parsing or extraction work happens\n\
      \  security.isAuthorized(),\n  rateLimit({ windowMs: 5 * 60 * 1000, max: 20, validate: false }),\n  uploadToMemory.single('file'),\
      \ ensureFileIsPassed, checkUploadSize, checkFileType,\n  handleZipFileUpload, handleXmlUpload, handleYamlUpload)"
