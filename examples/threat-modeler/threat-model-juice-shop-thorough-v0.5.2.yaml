  threat_category_id: TH-06
  stride: Elevation of Privilege
  cwe: CWE-250
  title: Excessive Default Workflow Token Permissions
  scenario: 'Only three of the sixteen workflows declare a `permissions:` block — lock.yml:8, codeql-analysis.yml:11 and pr-compliance.yml:7.
    The remaining thirteen, including the release-critical `.github/workflows/ci.yml` (jobs begin at line 24) and `release.yml`,
    inherit the repository default token scope, which on a repository configured for read-write default grants `GITHUB_TOKEN`
    write access to contents, packages, issues, pull requests, deployments and actions in every job. Those same jobs run `npm
    install` over unpinned dependencies with install scripts enabled (ci.yml:51, 71, 110, 147) and check out without `persist-credentials:
    false`, so any dependency or action that executes during the run inherits a repository-wide write token. That converts
    a build-time code-execution foothold into the ability to commit to the source tree the release pipeline builds from.'
  attack_steps:
  - An attacker achieves code execution inside a CI job, through a compromised transitive dependency's install script or a
    repointed mutable action.
  - The attacker reads `GITHUB_TOKEN` from the job environment, which carries the repository default scope because the workflow
    declares no `permissions:` block.
  - The attacker uses that token to push a commit or a release asset, placing their code into the branch the docker and heroku
    jobs deploy from.
  evidence_summary: A repository-wide search for `permissions:` in `.github/workflows/` returns three hits (lock.yml:8, codeql-analysis.yml:11,
    pr-compliance.yml:7) across sixteen workflow files.
  impact_description: A build-time code-execution foothold escalates to repository write access, reaching the branch the release
    pipeline builds and deploys.
  likelihood: Medium
  impact: High
  risk: High
  actor_ids:
  - ACT-D-06
  primary_actor: ACT-D-06
  controls_in_place: codeql-analysis.yml:11-14 and pr-compliance.yml:7-9 already apply least-privilege token scopes, so the
    pattern is established in the repository; deployment jobs are additionally gated on repository and branch conditions.
  mitigation_title: Declare least-privilege permissions blocks in all sixteen workflows
  remediation:
    effort: Low
    steps:
    - Set the repository default in Settings -> Actions -> General -> Workflow permissions to 'Read repository contents and
      packages permissions', so an omitted `permissions:` block fails closed.
    - 'Add a top-level `permissions: { contents: read }` to `.github/workflows/ci.yml` above the `jobs:` key at line 24 and
      to the other twelve workflows lacking one, then grant wider scopes per job only where a step needs them.'
    - 'Give the write-needing jobs their exact scope: `contents: write` for the release and auto-commit jobs, `pull-requests:
      write` for image_actions.yml, nothing else.'
    - Add an actionlint or zizmor CI step that fails any workflow file without a top-level `permissions:` declaration.
    code_example: "# .github/workflows/ci.yml — above `jobs:`\n# Before: no permissions block, so GITHUB_TOKEN inherited the\
      \ repo default\npermissions:\n  contents: read\njobs:\n  docker:\n    permissions:\n      contents: read   # widen only\
      \ where a step actually needs it\n      packages: write"
    verification: 'Open any workflow run summary and confirm the ''GITHUB_TOKEN Permissions'' block lists only `contents:
      read` for jobs that do not push; add a scratch step running `gh api -X PATCH repos/$GITHUB_REPOSITORY` and confirm it
      fails with 403.'
    reference: https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
