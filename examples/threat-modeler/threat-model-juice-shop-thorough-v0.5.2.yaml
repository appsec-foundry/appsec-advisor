assets:
- id: A-001
  name: User Credentials
  classification: Restricted
  description: User email addresses and password hashes stored in the SQLite Users table. Bcrypt-hashed but accessible via
    SQL injection or direct DB file read.
  linked_threats: []
- id: A-002
  name: JWT Signing Secret
  classification: Restricted
  description: HS256/RS256 secret used to sign JWT tokens. Defaults to a hardcoded value in lib/insecurity.ts when NODE_ENV
    is not set or JWT_SECRET env var absent. Compromise enables unrestricted token forgery.
  linked_threats: []
- id: A-003
  name: User PII (Orders, Addresses, Payment Data)
  classification: Confidential
  description: User delivery addresses, order history, wallet balances, and payment-related data persisted in SQLite tables.
    Accessible via IDOR, SQL injection, or admin panel hijacking.
  linked_threats: []
- id: A-004
  name: Active JWT Session Tokens
  classification: Restricted
  description: Bearer tokens stored in browser localStorage. Accessible to any JavaScript on the page — any XSS on any origin
    of the SPA enables token theft and full session takeover.
  linked_threats: []
- id: A-005
  name: Admin Credentials and Admin Panel Access
  classification: Restricted
  description: Admin role JWT claims and admin panel access at /administration. Weak default admin account enables takeover;
    JWT forgery bypasses all admin controls.
  linked_threats: []
- id: A-006
  name: SQLite Database File
  classification: Confidential
  description: File-based SQLite 3 database containing all application data (users, products, orders, feedback). In-process
    and co-located with the application; accessible if path traversal succeeds.
  linked_threats: []
- id: A-007
  name: LLM / OpenAI API Key
  classification: Restricted
  description: OPENAI_API_KEY environment variable granting access to external LLM provider. Not in source but could be leaked
    via error messages or environment dump vulnerabilities.
  linked_threats: []
- id: A-008
  name: Demo Encryption Keys
  classification: Internal
  description: RSA and other demo keys committed to encryptionkeys/ directory. Intentionally public for training; represent
    a class of key-material exposure risk.
  linked_threats: []
- id: A-009
  name: Challenge Solution Data
  classification: Internal
  description: Challenge flag strings, codefix content in data/static/codefixes/, and scoring data. Leakage reduces training
    effectiveness; not a production secret.
  linked_threats: []
- id: A-010
  name: User-Uploaded Files
  classification: Internal
  description: Files uploaded by users stored in uploads/ and served via static routes. Malicious uploads (scripts, archives
    with path traversal) represent stored attack payloads.
  linked_threats: []
- id: A-011
  name: Application Source Code
  classification: Public
  description: Full source code publicly available on GitHub. Enables attackers to enumerate routes, hardcoded strings, and
    logic prior to exploitation. Intentional for the training use case.
  linked_threats: []
