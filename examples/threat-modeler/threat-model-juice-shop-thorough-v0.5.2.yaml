  cwe: CWE-400
  title: Unthrottled Socket Event Processing (lib/startup/registerWebsocketEvents.ts:46)
  scenario: 'No rate limit, connection cap, or payload-size bound applies to the Socket.IO surface. The `express-rate-limit`
    instances in `server.ts` (lines 343, 459, 466, 472) are Express middleware bound to specific HTTP routes and never see
    WebSocket frames. Every handler therefore runs once per emit, unauthenticated and unbounded. `verifySvgInjectionChallenge`
    is the sharpest edge: it evaluates `data?.match(/.*\.\.\/\.\.\/\.\.[\w/-]*?\/redirect\?to=https?:\/\/cataas.com\/cat.*/)`
    on the raw payload — a leading `.*` followed by a lazy `[\w/-]*?` class, which backtracks catastrophically on a long non-matching
    string of slashes and word characters. Node.js regex evaluation is synchronous on the single event loop, and because the
    Socket.IO server shares that process and port 3000 with the whole Express API (server.ts:749), a blocking match stalls
    REST traffic too, not just the WebSocket channel.'
  attack_steps:
  - An attacker connects anonymously and emits `verifySvgInjectionChallenge` with a payload of many thousands of `../` and
    slash characters that never completes the `/redirect?to=` tail.
  - The regex backtracks on the main thread while the attacker repeats the emit in a tight loop across several sockets.
  - The shared event loop stops servicing both WebSocket events and Express REST routes on port 3000, so the entire application
    stops responding.
  evidence_summary: The verify handler applies a regex with a leading `.*` and a lazy character class directly to the unbounded
    client payload on the shared event loop, and no rate-limit, connection-cap, or size check exists anywhere in the socket
    registration path.
  impact_description: An unauthenticated client can stall the single Node.js event loop and take the REST API down with the
    WebSocket channel, since both share process and port 3000.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Socket.IO's default `maxHttpBufferSize` of 1 MB bounds a single frame, which is far above the length
    needed to trigger regex backtracking. The `express-rate-limit` instances in `server.ts` are route-scoped HTTP middleware
    and do not apply to socket events.
  mitigation_title: Rate-limit socket events and bound the regex-evaluated payload in verifySvgInjectionChallenge
  remediation:
    effort: Medium
    steps:
    - Reject payloads over a small explicit length (a few hundred characters) at the top of each verify handler before any
      regex runs — the legitimate inputs are short URLs and markup fragments.
    - 'Anchor the SVG-injection regex and drop the leading `.*` / lazy class so it cannot backtrack: match on a bounded `^`
      -anchored pattern, or replace the match with `String.prototype.includes` checks plus the existing `security.isRedirectAllowed(data)`
      call.'
    - Add a per-socket token bucket in the connection handler (a counter reset on an interval) and disconnect sockets that
      exceed it, so a single client cannot loop an event.
    - Set an explicit `maxHttpBufferSize` and `connectTimeout` in the `new Server(...)` options, and cap concurrent connections
      per source IP at the reverse proxy.
    code_example: "socket.on('verifySvgInjectionChallenge', (data: any) => {\n  // Before: unbounded payload into a backtracking\
      \ regex on the event loop\n  // challengeUtils.solveIf(..., () => data?.match(/.*\\.\\.\\/\\.\\.\\/\\.\\.[\\w/-]*?\\\
      /redirect\\?to=.../))\n\n  // After: length cap first, then a non-backtracking containment check\n  if (typeof data\
      \ !== 'string' || data.length > 512) { return }\n  challengeUtils.solveIf(challenges.svgInjectionChallenge,\n    ()\
      \ => data.includes('/redirect?to=') && security.isRedirectAllowed(data))\n})"
    verification: Emit `verifySvgInjectionChallenge` with a 100 000-character payload of repeated `../a/` and assert the server
      responds to a concurrent `GET /rest/admin/application-version` within 1 second; assert the oversized payload is dropped
      without evaluation.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
  evidence:
  - file: lib/startup/registerWebsocketEvents.ts
    line: 46
  evidence_check: verified
