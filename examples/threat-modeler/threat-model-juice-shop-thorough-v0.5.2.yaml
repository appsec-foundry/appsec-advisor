  stride: Spoofing
  cwe: CWE-601
  title: Open redirect via substring allowlist match (routes/redirect.ts:16)
  affected_parameter: to
  scenario: GET /redirect?to=<url> gates the redirect on security.isRedirectAllowed(), which loops the allowlist and accepts
    the URL when url.includes(allowedUrl) is true anywhere in the string (lib/insecurity.ts:136). Because the check is an
    unanchored substring test rather than an origin comparison, an attacker appends an allowlisted URL to their own domain
    as a fragment or query value — https://attacker.example/steal#https://github.com/juice-shop/juice-shop — and routes/redirect.ts:19
    hands the browser a 302 to the attacker host. The redirect runs on the shop's own origin, so the link carries the shop's
    domain in mail filters, chat previews and user inspection, which is exactly what makes it useful for credential phishing.
    The same primitive is the classic sink for OAuth authorization-code and token theft whenever an authorization server or
    SSO flow is configured to return to a shop URL.
  attack_steps:
  - An attacker crafts `https://juice-shop.example/redirect?to=https://attacker.example/login#https://github.com/juice-shop/juice-shop`
    so the allowlisted string appears inside the fragment.
  - The attacker distributes the link, which renders as a legitimate shop URL in mail and chat clients.
  - The victim's browser follows the 302 issued at `routes/redirect.ts:19` and lands on the attacker's cloned login page with
    the shop referrer intact.
  evidence_summary: routes/redirect.ts:16 delegates the entire redirect decision to isRedirectAllowed, whose implementation
    at lib/insecurity.ts:136 uses includes rather than an exact-origin match.
  impact_description: Any shop URL can be turned into a phishing or token-exfiltration launcher that carries the shop's domain
    reputation.
  likelihood: High
  impact: Medium
  risk: High
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  controls_in_place: An allowlist exists (lib/insecurity.ts:122) but is matched by unanchored substring containment, so it
    constrains nothing an attacker cannot embed in their own URL.
  mitigation_title: Replace substring allowlist matching in performRedirect with exact-origin comparison
  remediation:
    effort: Low
    steps:
    - Parse the incoming `to` value with `new URL(toUrl)` inside a try/catch and reject anything that does not parse or whose
      protocol is not `https:`.
    - Compare the parsed `origin` (and, where path matters, the normalised pathname prefix) against a Set of allowlisted origins
      using strict equality — never `String.prototype.includes` or `startsWith` on the raw URL.
    - 'Prefer indirection where possible: accept a short opaque key (`?to=github`) and resolve it server-side to the target
      URL so no attacker-controlled URL ever reaches `res.redirect`.'
    code_example: "// Before: url.includes(allowedUrl) matches an allowlisted string anywhere in the URL\n// After: only the\
      \ parsed origin decides, so appended fragments/queries cannot smuggle a match\nconst ALLOWED_ORIGINS = new Set(['https://github.com',\
      \ 'https://etherscan.io'])\nexport const isRedirectAllowed = (url: string) => {\n  try {\n    const parsed = new URL(url)\n\
      \    return parsed.protocol === 'https:' && ALLOWED_ORIGINS.has(parsed.origin)\n  } catch { return false }\n}"
    verification: Request `GET /redirect?to=https://attacker.example/#https://github.com/juice-shop/juice-shop` and assert
      the response is 406 with no `Location` header; assert `GET /redirect?to=https://github.com/juice-shop/juice-shop` still
      returns 302 to that exact URL.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
