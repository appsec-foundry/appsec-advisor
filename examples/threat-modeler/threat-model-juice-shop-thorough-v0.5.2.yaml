      attaches the cookie; pair this with CSRF protection on state-changing routes, since the credential becomes ambient.'
    - Replace the client-side `tokenDecode()` in `app.guard.ts` with a `/rest/user/whoami` call for role and login state,
      as the SPA can no longer read the token.
    code_example: '// Before (frontend/src/app/Services/request.interceptor.ts:14-18)

      // req = req.clone({ setHeaders: { Authorization: `Bearer ${localStorage.getItem(''token'')}` } })


      // After: the credential is an HttpOnly cookie the browser attaches; JS never sees it

      req = req.clone({ withCredentials: true })


      // Express side

