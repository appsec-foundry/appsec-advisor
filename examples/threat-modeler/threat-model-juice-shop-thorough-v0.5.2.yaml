  title: Server-Side Code Injection (routes/b2bOrder.ts:23)
  affected_parameter: orderLinesData
  scenario: 'The B2B order handler takes the `orderLinesData` field straight from the JSON request body and evaluates it as
    JavaScript. The string is placed into a `vm` context together with the `notevil` evaluator and executed by `vm.runInContext(''safeEval(orderLinesData)'',
    sandbox, { timeout: 2000 })`. Neither `node:vm` nor `notevil` is a security boundary: `node:vm` shares the host realm
    and is documented as unsuitable for untrusted code, and `notevil` is an interpreter with a public history of prototype-
    and constructor-based escapes. Any authenticated caller — and registration is open at server.ts:408 — can therefore run
    attacker-chosen expressions inside the API process. The 2-second timeout only bounds a runaway loop; it does not constrain
    what a fast payload reaches.'
  attack_steps:
  - An attacker registers a normal account and obtains a bearer token, which satisfies the `/b2b/v2` guard.
  - The attacker POSTs to `/b2b/v2/orders` with `orderLinesData` set to a constructor-chain payload that escapes the interpreter
    into the host realm.
  - The escaped expression executes inside the Node process with the privileges of the application user.
  - The attacker reads the process environment and application files, or opens an outbound connection, from inside the API
    container.
  evidence_summary: routes/b2bOrder.ts:23 executes `safeEval(orderLinesData)` inside a `vm` context whose input is `body.orderLinesData`
    taken verbatim at line 19.
  impact_description: An authenticated B2B caller executes arbitrary code inside the API process, giving access to secrets,
    the database file, and outbound network reach.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: '`/b2b/v2` requires a bearer token (server.ts:424) and the evaluation carries a 2000 ms timeout. Registration
    is unrestricted, so the token requirement is not a meaningful barrier, and the timeout bounds duration rather than capability.'
  mitigation_title: Remove dynamic evaluation of orderLinesData from the B2B order handler
  remediation:
    effort: Medium
    steps:
    - Delete the `vm.createContext` / `vm.runInContext` block at routes/b2bOrder.ts:21-23; an order line payload never needs
      to be executed.
    - Parse `orderLinesData` as JSON and validate it against an explicit schema listing the permitted fields and their types
      before any business logic reads it.
    - If an expression language is genuinely required, use a purpose-built non-Turing-complete evaluator running in a separate
      OS process with a hard memory and CPU cap, not `node:vm`.
