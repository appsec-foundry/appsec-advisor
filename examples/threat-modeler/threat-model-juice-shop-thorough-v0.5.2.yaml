    scenario: 'Passwords are stored as unsalted MD5 digests. `hash()` at lib/insecurity.ts:41 is a bare MD5 over the input,
      and the `password` setter at models/user.ts:76 applies it to every credential written. MD5 is a fast, collision-broken
      hash with no work factor and no per-user salt, so identical passwords produce identical digests and commodity hardware
      evaluates billions of candidates per second. This directly amplifies the two SQL injection sinks in this component:
      once the Users table is dumped through routes/search.ts:23, the recovered digests fall to rainbow-table lookup almost
      immediately, converting a read of the database into working credentials for every account and for any site where those
      passwords were reused. The same digest is also the comparison value for the 2FA setup and disable flows at routes/2fa.ts:107
      and :152.'
    source_ref: backend-api-013
