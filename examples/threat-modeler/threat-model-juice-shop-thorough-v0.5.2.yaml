  title: Unauthenticated WebSocket Channel (lib/startup/registerWebsocketEvents.ts:33)
  scenario: 'The Socket.IO server accepts every connection without any handshake authentication: there is no middleware on
    the namespace, no token is read from the handshake, and no user identity is bound to the socket. On connect the server
    immediately pushes the entire `notifications` array to the client. The `notification received` handler then lets any connected
    client splice entries out of that shared server-side array by flag value, and the `verifySvgInjectionChallenge` / `verifyLocalXssChallenge`
    handlers accept arbitrary client payloads that drive server state. The CORS origin is pinned to `http://localhost:4200`,
    which restricts browser-based cross-origin use but places no restriction at all on a non-browser client such as a socket.io
    CLI or a script setting its own Origin header.'
  attack_steps:
  - An attacker connects a socket.io client directly to the server, supplying no token and no browser Origin.
  - The attacker receives the full notification stream pushed on connect, including notifications intended for other users.
  - The attacker emits `notification received` with harvested flag values, removing those entries from the shared server-side
    array so other clients never receive them.
  evidence_summary: '`lib/startup/registerWebsocketEvents.ts:33` registers a state-mutating event handler on a connection
    that passed no authentication middleware.'
  impact_description: Any internet client reads the broadcast notification stream and deletes entries from shared server state,
    suppressing delivery to legitimate clients.
  likelihood: High
  impact: Medium
  risk: High
  actor_ids:
  - ACT-D-01
  primary_actor: ACT-D-01
  controls_in_place: CORS origin restricted to http://localhost:4200. No handshake authentication, no per-socket identity,
    no authorization check on any event handler.
  mitigation_title: Authenticate the Socket.IO handshake and authorize each event handler by socket identity
  remediation:
    effort: Medium
    steps:
    - Add `io.use((socket, next) => { ... })` middleware that reads the JWT from `socket.handshake.auth.token`, verifies it
      with the RS256-pinned verifier, and attaches the resolved user to `socket.data.user`; reject the handshake otherwise.
    - Scope notification delivery to the connected user instead of emitting the whole shared array to every socket.
    - In the `notification received` handler at line 33, only remove entries owned by `socket.data.user`, rather than any
      flag the client names.
    - Validate the shape and length of every inbound event payload before use, and configure the CORS origin from application
      configuration instead of the hardcoded development URL.
    code_example: "// After — no socket reaches an event handler without a verified identity\nio.use((socket, next) => {\n\
      \  const token = sock**** (28 chars)\n  try {\n    socket.data.user = jwt.verify(token, publicKey, { algorithms:\
      \ ['RS256'] })\n    next()\n  } catch {\n    next(new Error('unauthorized'))\n  }\n})"
    verification: Connect a socket.io client with no `auth.token` — the connection must be refused with an `unauthorized`
      connect_error and no `challenge solved` events must be received.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
