  stride: Information Disclosure
  cwe: CWE-532
  title: Unauthenticated Log File Disclosure (routes/logfileServer.ts:14)
  scenario: '`serveLogFiles` sends any file under `logs/` to any caller. The only check is that the requested name contains
    no forward slash (line 13); there is no authentication, no authorization, and no extension allowlist. The directory it
    exposes holds the Morgan `combined` access log written at server.ts:338, which records full request lines. Because several
    sensitive operations in this component are GET requests that carry their parameters in the query string — most notably
    `/rest/user/change-password?current=...&new=...` at routes/changePassword.ts:14 — the access log contains plaintext passwords
    alongside the bearer-token-bearing requests that produced them. The route also sits next to a directory index (`/support/logs`,
    server.ts:281), so an attacker does not need to guess filenames.'
  evidence_summary: routes/logfileServer.ts:14 calls `res.sendFile(path.resolve('logs/', file))` with no authentication or
    authorization check anywhere in the handler.
  impact_description: An anonymous visitor downloads the HTTP access log and recovers plaintext password-change parameters
    and session activity for every user.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: A rejection of names containing `/` (routes/logfileServer.ts:13). It blocks traversal out of the directory
    but grants unrestricted access to everything inside it.
  mitigation_title: Require operator authorization for log retrieval and stop logging credentials
  remediation:
    effort: Medium
    steps:
    - Register `/support/logs` and `/support/logs/:file` behind an authorization check that requires an operator role, or
      remove the routes and retrieve logs out of band.
    - Change `/rest/user/change-password` to a POST that carries `current` and `new` in the request body, so credentials never
      enter a request line (routes/changePassword.ts:14).
    - Configure a Morgan token that redacts the query string for authentication and password endpoints before the line is
      written.
    - Rotate and purge existing log files, which already contain plaintext credentials.
    code_example: '// Before - routes/logfileServer.ts:14: anyone may fetch any log file

      // res.sendFile(path.resolve(''logs/'', file))


      // After: only an authorized operator reaches the handler

      app.use(''/support/logs'', security.isAuthorized(), security.hasRole(''admin''))

      app.use(''/support/logs/:file'', security.isAuthorized(), security.hasRole(''admin''), serveLogFiles())'
    verification: GET `/support/logs/access.log` with no Authorization header and assert HTTP 401. Then perform a password
      change and assert the new log line contains no password value.
    reference: CWE-532
  evidence:
  - file: routes/logfileServer.ts
    line: 14
