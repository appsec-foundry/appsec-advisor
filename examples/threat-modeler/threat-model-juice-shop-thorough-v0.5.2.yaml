  title: Unscoped Notification Broadcast (lib/startup/registerWebsocketEvents.ts:30)
  scenario: Two paths leak the same server-side notification objects to every connected socket. On connection, `notifications.forEach(n
    => socket.emit('challenge solved', n))` replays the entire in-memory notification backlog to whoever just connected (line
    29-31). At runtime, `challengeUtils.ts:75` calls `globalWithSocketIO.io.emit('challenge solved', notification)` — a server-wide
    broadcast with no room or namespace scoping. The notification object built at `challengeUtils.ts:62-70` carries a `flag`
    field (the challenge's solution token) and a `hidden` flag that is only a client-side display hint. Combined with the
    missing handshake authentication, an anonymous client connects once and harvests both the historical backlog and every
    future solve event produced by other users, including the `flag` values the `hidden` setting was meant to withhold.
  attack_steps:
  - An attacker opens an unauthenticated Socket.IO connection and subscribes to the `challenge solved` event.
  - The server replays the whole in-memory `notifications` backlog to the new socket, one `challenge solved` emit per entry.
  - The attacker keeps the socket open and passively records every subsequent broadcast, reading the `flag` field of solves
    performed by other users.
  evidence_summary: The connection handler iterates the shared `notifications` array and emits each entry to the newly connected
    socket, and `challengeUtils.ts:75` broadcasts new notifications with `io.emit` rather than to a user-scoped room.
  impact_description: Any anonymous client obtains the full history and live stream of other users' solve notifications, including
    the `flag` token that the `hidden` display setting was intended to suppress.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: The `hidden` field on the notification is set from `config.challenges.showSolvedNotifications`, but it
    is a rendering hint evaluated by the client — the `flag` value is transmitted over the wire either way. No room, namespace,
    or per-recipient filtering.
  mitigation_title: Scope challenge-solved notifications to the solving user's room and strip the flag from broadcast payloads
  remediation:
    effort: Medium
    steps:
    - Join each authenticated socket to a per-user room in the connection handler (`socket.join('user:' + socket.data.user.id)`)
      and replace the global `io.emit(...)` in `lib/challengeUtils.ts:75` with `io.to('user:' + solverId).emit(...)`.
    - Build the broadcast payload server-side without the `flag` field; deliver the flag only over the authenticated REST
      path to the user who actually solved the challenge.
    - Stop replaying the whole `notifications` backlog on connect — send only the entries belonging to the connecting principal,
      after the handshake middleware from finding socket-io-gateway-001 has established who that is.
    - Enforce the `showSolvedNotifications` config on the server before emitting rather than relying on the client to honour
      the `hidden` flag.
    code_example: '// Before: every connected socket receives every notification, flag included

      // notifications.forEach((n) => socket.emit(''challenge solved'', n))

      // io.emit(''challenge solved'', notification)


      // After: recipient-scoped, and the flag never leaves the server on this channel

      const { flag, ...publicNotification } = notification

      io.to(`user:${solverId}`).emit(''challenge solved'', publicNotification)'
    verification: Connect client A as user A and client B as user B, solve a challenge as user A, and assert client B receives
      no `challenge solved` event. Assert the payload delivered to client A contains no `flag` property.
    reference: CWE-200
