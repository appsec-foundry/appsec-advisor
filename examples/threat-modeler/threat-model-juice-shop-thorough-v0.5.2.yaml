- id: auth-service
  name: JWT Authentication and 2FA Middleware
  description: Authentication subsystem co-located with the Express backend, comprising JWT issuance and validation via a
    hardcoded RSA key pair in lib/insecurity.ts, TOTP-based 2FA enrollment and verification in routes/2fa.ts, and per-request
    authentication middleware in routes/authenticatedUsers.ts. OAuth flow for Google sign-in is handled by the Angular SPA
    with credential derivation on the server side.
