- local_id: llm-integration-006
  threat_category_id: TH-17
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-200
  title: Internal Tool Calls Exposed to Clients (routes/chat.ts:228)
  affected_parameter: show_tool_calls
  scenario: LLM07 — internal detail exposure through an ineffective debug guard. `routes/chat.ts:228-238` writes every `tool-call`
    event to the SSE stream, emitting the internal tool name and the model-chosen arguments as JSON. The `show_tool_calls`
    cookie and the non-admin role test on lines 221-226 sit inside `challengeUtils.solveIf`, which only records a challenge
    solve — neither value gates the `res.write` that follows, so the exposure applies to every caller including anonymous
    ones. An attacker watching the stream learns the tool inventory (`searchProducts`, `getProductReviews`, `getOrderById`,
    `generateCoupon`), the exact argument names, and whether a probing message actually reached the coupon tool. That converts
    blind prompt-injection attempts against llm-integration-002 into a feedback-driven loop.
  attack_steps:
  - An attacker sends an ordinary product question to `/rest/chat` and reads the raw SSE stream rather than the rendered chat
    bubble.
  - The attacker records the `tool_calls` entries, which name every tool and its argument schema, including `generateCoupon`
    with `discount`.
  - The attacker iterates injection phrasings and uses the presence or absence of a `generateCoupon` event as the success
    signal for each attempt.
  evidence_summary: The `res.write` at `routes/chat.ts:228` serialises `event.toolName` and `event.input` unconditionally;
    the `show_tool_calls` cookie test at line 225 is an argument to `challengeUtils.solveIf` and controls nothing on the write
    path.
  impact_description: Every client learns the agent's internal tool surface and receives per-attempt confirmation of whether
    an injection reached a privileged tool.
  controls_in_place: A `show_tool_calls` cookie and a non-admin role comparison exist at lines 221-226, but both live inside
    a challenge-solving callback and do not guard the stream write.
  likelihood: High
  impact: Low
  risk: Medium
  owasp_llm_ids:
  - LLM07
  owasp_asi_ids: []
  mitigation_title: Suppress tool-call events on the client stream unless the caller is an admin
  remediation:
    effort: Low
    steps:
    - Wrap the `res.write` block at `routes/chat.ts:228-238` in an explicit condition that requires a verified admin role,
      evaluated from a signature-checked token rather than from `security.decode`.
    - 'Default the behaviour to suppressed: emit tool-call events only when the admin check returns true, so a missing or
      malformed token yields no disclosure.'
    - Keep the operational signal by continuing to increment `metricToolCalls` (line 227) server-side, which needs no client
      exposure.
    - Send anonymous callers a content-free progress marker instead of the tool name and arguments.
    code_example: "// Before — every caller receives the tool name and arguments\n// res.write(`data: ${JSON.stringify({ choices:\
      \ [{ delta: { tool_calls: [...] } }] })}\\n\\n`)\n\n// After — the write is gated on a verified admin role; others get\
      \ a bare marker\nmetricToolCalls.labels({ tool: event.toolName }).inc()\nif (await isVerifiedAdmin(req)) {\n  res.write(`data:\
      \ ${JSON.stringify({ choices: [{ delta: { tool_calls: [/* ... */] } }] })}\\n\\n`)\n} else {\n  res.write(`data: ${JSON.stringify({\
      \ choices: [{ delta: { content: '' } }] })}\\n\\n`)\n}"
    verification: As an anonymous caller, send a product query and assert the raw SSE body contains no `tool_calls` key and
      no tool name; repeat as a verified admin and assert the events are present.
    reference: CWE-200
  evidence:
  - file: routes/chat.ts
    line: 228
  evidence_check: verified
