    \ {\n  path: ...,\n  withCredentials: true,\n  auth: (cb) => { cb({ token: localStorage.getItem('token') }) }\n})\n\n\
    // Express/Socket.IO side\nio.use((socket, next) => {\n  const user = security.verify(sock**** (28 chars))\n\
    \  if (!user) return next(new Error('unauthorized'))\n  socket.data.user = user\n  next()\n})"
