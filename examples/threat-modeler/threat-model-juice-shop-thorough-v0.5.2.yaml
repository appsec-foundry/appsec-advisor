  title: JWT Algorithm Confusion (lib/insecurity.ts:52)
  scenario: 'Every server-side token check omits an algorithm allow-list. `isAuthorized()` constructs the express-jwt middleware
    with only `{ secret: publicKey }`; `updateAuthenticatedUsers()` on line 189 calls `jwt.verify(token, publicKey, cb)` with
    no options object; and `verify()` on line 55 hands the public key to `jws.verify` in the algorithm parameter. The pinned
    dependency versions — express-jwt 0.1.3 and jsonwebtoken 0.4.0 in package.json — predate algorithm enforcement, so the
    header''s `alg` field decides which verification routine runs. An attacker sets the header algorithm to `none`, strips
    the signature, and supplies an arbitrary payload; alternatively they switch to a symmetric HMAC algorithm and sign with
    the published `encryptionkeys/jwt.pub` contents, which the code passes as the verification secret. Both variants yield
    a token the middleware treats as authentic.'
  attack_steps:
  - 'An attacker takes any valid token, or authors a payload with `"role": "admin"` from scratch.'
  - The attacker rewrites the token header so verification falls back to an unsigned or symmetric path and re-encodes it with
    the empty or public-key-derived signature.
  - The attacker sends the token to a protected route; the middleware accepts it because no allow-list constrains which verification
    routine may run.
  evidence_summary: '`lib/insecurity.ts:52` builds the express-jwt middleware with a secret but no `algorithms` option, and
    the same omission repeats at lines 55 and 189.'
  impact_description: An unauthenticated attacker forges a session for any user and role without possessing any key material,
    defeating every authorization check downstream.
  likelihood: High
  impact: Critical
  risk: Critical
  actor_ids:
  - ACT-D-01
  primary_actor: ACT-D-01
  controls_in_place: None. No call site passes an `algorithms` array, and no `issuer` or `audience` claim is checked either.
  mitigation_title: Pin RS256 as the only accepted algorithm at every JWT verification call site in lib/insecurity.ts
  remediation:
    effort: Medium
    steps:
    - Upgrade `express-jwt` and `jsonwebtoken` in package.json to currently maintained major versions (express-jwt 8.x, jsonwebtoken
      9.x), which reject a token whose `alg` is not explicitly allow-listed.
    - 'Pass `{ secret: publicKey, algorithms: [''RS256''] }` to the express-jwt factory at lib/insecurity.ts:52.'
    - 'Add `{ algorithms: [''RS256''] }` as the options argument to the `jwt.verify` call at lib/insecurity.ts:189.'
    - 'Replace the `jws.verify` wrapper at lib/insecurity.ts:55 with `jwt.verify(token, publicKey, { algorithms: [''RS256'']
