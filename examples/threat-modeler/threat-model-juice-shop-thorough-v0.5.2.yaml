- local_id: auth-service-006
  threat_category_id: TH-02
  additional_categories: []
  stride: Spoofing
  cwe: CWE-613
  title: Missing token revocation (lib/insecurity.ts:54)
  scenario: An attacker who has captured a bearer token continues to use it for the full six-hour lifetime even after the
    victim logs out or changes their password, because security.authorize() at lib/insecurity.ts:54 issues a stateless JWT
    whose only invalidation mechanism is expiry. Neither the password-change handler nor the 2FA handlers remove entries from
    the in-memory authenticatedUsers map or maintain a denylist, so no server-side action ends an active session.
  evidence_summary: lib/insecurity.ts:54 signs a six-hour JWT with no jti or revocation hook, and the authenticatedUsers map
    at lines 70 to 91 exposes only put, get, tokenOf, from, and updateFrom, with no delete or invalidate operation.
  impact_description: A stolen or leaked token stays valid for up to six hours regardless of logout, password reset, or 2FA
    changes, so incident containment is impossible without restarting or rekeying the service.
  likelihood: Medium
  impact: High
  risk: Medium
  controls_in_place: Six-hour token expiry is the only bound on session lifetime.
  mitigation_title: Add server-side token invalidation on logout and credential change
  remediation:
    effort: Medium
    steps:
    - Include a jti claim in the payload signed at lib/insecurity.ts:54 and check it against a shared revocation store in
      the verification middleware.
    - Revoke all outstanding tokens for a user on logout, password change, password reset, and 2FA enable or disable.
    - Add an integration test that changes a password and then asserts the previously issued token receives HTTP 401.
    code_example: null
    verification: 'Run the new integration test: a token issued before a password change must return HTTP 401 on a protected
      route after the change.'
    reference: 'CWE-613: Insufficient Session Expiration'
  evidence:
  - file: lib/insecurity.ts
    line: 54
  boundary_refs:
