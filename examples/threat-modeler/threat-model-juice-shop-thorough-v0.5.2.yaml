  handles_sensitive_data: true
  threat_ids:
  - T-005
  - T-009
  - T-018
  - T-043
  - T-064
  - T-077
- id: api-backend
  name: Express.js REST API and WebSocket Server
  description: Node.js 24 Express application serving REST endpoints under /api/*, /rest/*, and /socket.io (Socket.IO real-time
    channel), static frontend assets, Swagger UI, and an LLM-backed chat endpoint that proxies requests to an OpenAI-compatible
    provider. Contains deliberately vulnerable route handlers across the full OWASP Top Ten for training purposes.
  paths:
  - server.ts
  - routes/*.ts
  - lib/*.ts
  - lib/startup/*.ts
  - models/*.ts
  - data/datacreator.ts
  - data/datacache.ts
  - data/staticData.ts
  - data/types.ts
  tier: application
