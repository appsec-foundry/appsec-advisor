  _title_source: Introduce a Backend-for-Frontend that holds API tokens server-side
  steps:
  - Add a BFF layer in the Express tier that performs login and the OAuth code exchange, stores the resulting API token in
    a server-side session store, and returns only an opaque session id to the browser.
