  threat_category_id: TH-02
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-640
  title: Weak password recovery mechanism (routes/resetPassword.ts:41)
  scenario: An unauthenticated attacker posts guessed security answers for a chosen email to POST /rest/user/reset-password
    until the HMAC comparison at routes/resetPassword.ts:41 succeeds, then sets a new password at line 44 and owns the account.
    The endpoint requires no session, no second factor, and no emailed one-time token, and the zero-hit throttling search
    shows nothing limits the guess rate, so a low-entropy answer such as a pet or city name is recoverable by dictionary attack.
  evidence_summary: routes/resetPassword.ts:41 grants the reset on a single HMAC equality check against the submitted answer,
    and line 44 immediately writes the caller-supplied password with no out-of-band confirmation.
  impact_description: Any internet caller takes over an arbitrary account, including administrator accounts, using only the
    account email and a guessable answer.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: The answer is compared as a keyed HMAC rather than plaintext, but the key is hardcoded and the attempt
    rate is unbounded.
  mitigation_title: Replace the security-question reset with an out-of-band one-time token
  remediation:
    effort: High
    steps:
    - Replace the answer check at routes/resetPassword.ts:41 with a single-use, short-lived token delivered to the registered
      email address and verified server-side before any password write.
    - Return an identical non-enumerating response whether or not the email exists, and throttle the endpoint per account
      and per source.
    - Add tests asserting the response body, logs, and URL contain no reset token and that a second use of the same token
      is rejected.
    code_example: null
    verification: 'Run the new tests: the reset request response must contain no token, a used token must be rejected on reuse,
      and requests past the throttle threshold must return HTTP 429.'
    reference: 'CWE-640: Weak Password Recovery Mechanism for Forgotten Password'
