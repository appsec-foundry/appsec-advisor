  cwe: CWE-522
  title: Long-Lived Registry Credentials in Build Job (.github/workflows/ci.yml:327)
  scenario: 'Static, long-lived credentials are placed in the environment of jobs that also execute unverified third-party
    code. `.github/workflows/ci.yml:327` passes `secrets.DOCKERHUB_TOKEN` to the docker login step of a job that ran `actions/checkout`
    without `persist-credentials: false`; `ci.yml:249-253` hands `E2E_SOLUTIONS_WEBHOOK`, `ALCHEMY_API_KEY`, `CYPRESS_RECORD_KEY`
    and `GITHUB_TOKEN` to the Cypress job, which first runs `npm install` over unpinned dependencies with install scripts
    enabled and then boots the full application; `update-challenges-www.yml:19` and `update-news-www.yml:14` expose `BOT_TOKEN`,
    a cross-repository write credential. Any code that executes in those jobs — a compromised npm postinstall hook, a repointed
    action — reads the environment and the checkout credentials in `.git/config` directly. Because the Docker Hub and bot
    tokens are static personal access tokens rather than short-lived OIDC credentials, a single leak stays usable until someone
    notices and rotates it.'
  evidence_summary: A search for `persist-credentials` across `.github/workflows/` returns zero hits, so every `actions/checkout`
    leaves its token in `.git/config` for the rest of the job, including the docker job that logs in with DOCKERHUB_TOKEN
    at ci.yml:327.
  impact_description: One malicious dependency or action in these jobs yields a Docker Hub push token, a cross-repository
    bot token, and third-party API keys that remain valid indefinitely.
  likelihood: Medium
  impact: High
  risk: High
  actor_ids:
  - ACT-D-06
  primary_actor: ACT-D-06
  controls_in_place: Secrets are refe**** (10 chars) per job rather than declared workflow-wide, and the credential-bearing jobs are
    gated on `github.repository == 'juice-shop/juice-shop'`, so forks and fork pull requests receive no secret values.
  mitigation_title: Move registry publishing to OIDC and stop persisting checkout credentials
  remediation:
    effort: Medium
    steps:
    - 'Add `persist-credentials: false` to every `actions/checkout` step, so the job token is not left in `.git/config` while
      `npm install` and third-party actions run.'
    - 'Replace the static `DOCKERHUB_TOKEN` with OIDC-based registry authentication (`id-token: write` plus the registry''s
      federated login), so the credential exists only for the duration of the push step.'
    - 'Split the Docker build and the Docker push into separate jobs: the build job runs untrusted dependency code with no
      registry secret, and the push job consumes only the built artifact.'
    - 'Scope `BOT_TOKEN` to a fine-grained token limited to `contents: write` on `juice-shop/juice-shop.github.io`, and put
      the remaining static secrets on a documented rotation schedule.'
    code_example: "- name: \"Check out Git repository\"\n  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683\
      \ #v4.2.2\n  with:\n    # Before: the job token stayed in .git/config for every later step\n    # After: nothing installable\
      \ can read a credential from the workspace\n    persist-credentials: false"
    verification: Add a temporary step after checkout running `git config --local --get-regexp 'http\..*\.extraheader'` and
      confirm it exits non-zero (no stored credential) in the docker and e2e jobs.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  evidence:
  - file: .github/workflows/ci.yml
    line: 327
