- local_id: sqlite-db-001
  threat_category_id: TH-03
  stride: Spoofing
  cwe: CWE-916
  title: Weak Password Hash (models/user.ts:76)
  affected_parameter: password
  scenario: 'The User model''s `password` attribute setter is the single place where every credential in the system is transformed
    before storage. It calls `security.hash(clearTextPassword)`, which is an unsalted MD5 digest (`lib/insecurity.ts:41`).
    Because the setter is on the model rather than in a route, every write path — registration, password reset, admin-created
    accounts, seed data — inherits it, so there is no code path that stores a stronger digest. Two properties make the stored
    column directly usable to an attacker: MD5 is a fast, GPU-friendly hash with no work factor, and the absence of a per-row
    salt means identical passwords produce identical digests, so a single rainbow table covers the whole Users table at once.
    Any read primitive over the database — SQL injection, a leaked backup, a file-read on the co-located SQLite file — converts
    immediately into cleartext credentials rather than into a cracking problem that costs the attacker time.'
  attack_steps:
  - An attacker obtains a dump of the Users table through an injection primitive, a leaked backup, or a file read of the co-located
    SQLite database.
  - The attacker feeds the `password` column into a GPU cracker, which recovers common passwords from unsalted MD5 digests
    at billions of guesses per second.
  - The attacker signs in as the recovered accounts, including any whose `role` is `admin`, and replays the same passwords
    against the victims' other services.
  evidence_summary: '`models/user.ts:76` routes every password write through `security.hash`, which `lib/insecurity.ts:41`
    defines as a single-round unsalted MD5 digest.'
  impact_description: One read of the Users table yields cleartext passwords for effectively every account, including administrators,
    plus credentials reusable against unrelated services.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None. The setter applies no salt, no work factor, and no pepper; there is no second hashing layer elsewhere
    in the write path.
  mitigation_title: Replace the MD5 password setter in models/user.ts with an argon2id beforeSave hook
  remediation:
    effort: Medium
    steps:
    - Add `argon2` as a dependency and delete the synchronous `set (clearTextPassword)` block on the `password` attribute
      at models/user.ts:73-77 — a Sequelize setter cannot await, which is what forced the synchronous MD5 call in the first
      place.
    - Hash in an async `beforeSave` hook guarded by `user.changed('password')`, using `argon2id` with at least 19 MiB memory
      cost and a per-password salt (argon2 embeds the salt in the encoded digest, so no schema column is needed).
    - Widen the `password` column to `DataTypes.STRING(255)` so the ~97-byte encoded argon2 digest is not silently truncated,
      and reject inputs over 128 bytes before hashing to bound work per request.
    - 'Add a login-time rehash path: when a stored digest is a 32-character hex string (a legacy MD5 row), verify against
      MD5 once, then immediately re-store the argon2id digest and force a password change for that account.'
    code_example: "// models/user.ts — Before: synchronous, unsalted, GPU-crackable\n// password: { type: DataTypes.STRING,\
      \ set (p: string) { this.setDataValue('password', security.hash(p)) } }\n\n// After: plain column + async hook, so a\
      \ memory-hard KDF with a per-password salt can be awaited\npassword: { type: DataTypes.STRING(255) },\n\nUser.addHook('beforeSave',\
      \ async (user: User) => {\n  if (!user.changed('password')) return\n  user.setDataValue('password', await argon2.hash(user.password,\
      \ { type: argon2.argon2id, memoryCost: 19456 }))\n})"
    verification: 'Register a user with password `admi**** (8 chars)`, then read the row: the stored value must start with `$argon2id$`
      and must differ between two accounts that share that password. Assert in CI that `SELECT password FROM Users` returns
      no value matching `^[0-9a-f]{32}$`.'
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
  evidence:
  - file: models/user.ts
    line: 76
  evidence_check: verified
