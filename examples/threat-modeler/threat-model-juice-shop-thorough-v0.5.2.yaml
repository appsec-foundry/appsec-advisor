  cwe: CWE-916
  title: Weak MD5 password hashing (lib/insecurity.ts:41)
  scenario: An attacker who obtains the Users table through the login SQL injection or any other read primitive recovers plaintext
    passwords offline, because lib/insecurity.ts:41 hashes every password with a single unsalted MD5 pass. Commodity hardware
    reverses unsalted MD5 for typical passwords in seconds, and the missing salt means one rainbow-table pass cracks the whole
    table at once.
  evidence_summary: lib/insecurity.ts:41 defines hash() as a single crypto MD5 digest with no salt and no work factor, and
    routes/login.ts:34 and routes/2fa.ts:107 use it as the password comparison function.
  impact_description: A single database read yields plaintext passwords for every user, enabling account takeover here and
    credential stuffing against unrelated services.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None
  mitigation_title: Replace MD5 password hashing with a memory-hard KDF in lib/insecurity.ts
  remediation:
    effort: High
    steps:
    - Replace the MD5 digest at lib/insecurity.ts:41 with Argon2id or bcrypt using per-password salts and tuned cost parameters,
      and keep MD5 only for non-security digests if any remain.
    - Rehash each password transparently on the next successful login and reject input above the algorithm's UTF-8 byte limit
      at password set time.
    - Add a test asserting two identical passwords produce different stored hashes and that verification still succeeds.
    code_example: null
    verification: 'Run the new test: hashing the same password twice must yield different stored values, and both must verify
      successfully against the original password.'
