  cwe: CWE-798
  title: Hardcoded BIP-39 mnemonic derives wallet private key (routes/checkKeys.ts:10)
  scenario: 'routes/checkKeys.ts:10 embeds a twelve-word BIP-39 mnemonic as a source literal and line 11 derives the full
    HD wallet from it with HDNodeWallet.fromPhrase, producing privateKey, publicKey and address in process memory. The mnemonic
    is the root secret: anyone reading the repository — which is public — reconstructs the identical private key offline with
    three lines of ethers, then signs any transaction that wallet is authorised for and drains or transfers whatever it holds,
    without ever touching this application. The endpoint POST /rest/web3/submitKey (server.ts:641) compounds this by acting
    as an oracle: line 18 confirms an exact private-key match and lines 21-24 distinguish the address and public key in separate
    401 responses, so a caller learns which class of key material they submitted. Rotation does not help while the replacement
    is committed the same way.'
  attack_steps:
  - An attacker clones the public repository and reads the mnemonic literal at `routes/checkKeys.ts:10`.
  - The attacker derives the private key offline with `HDNodeWallet.fromPhrase(mnemonic)`, exactly as line 11 does.
  - The attacker signs transactions as that wallet directly against the chain, bypassing the application entirely.
  evidence_summary: routes/checkKeys.ts:10 stores the mnemonic as a plain string literal and line 12 reads `mnemonicWallet.privateKey`
    from it.
  impact_description: The wallet's private key is publicly derivable, so control of that on-chain account is available to
    anyone who reads the source.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: None. The mnemonic is a committed source literal with no external configuration or secret-manager path.
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  - ACT-D-03
  - ACT-D-06
  primary_actor: ACT-D-01
  mitigation_title: Move the wallet mnemonic out of source into required external configuration
  remediation:
    effort: Medium
    steps:
    - Read the mnemonic from `process.env.WEB3_WALLET_MNEMONIC` (or a secret manager) and fail startup when it is absent,
      rather than shipping a literal.
    - 'Rotate the exposed wallet: generate a new mnemonic, move any residual balance, and treat the committed phrase as permanently
      burned — git history keeps it reachable after deletion.'
    - Compare submitted key material in constant time and return one undifferentiated 401 for every failure so the endpoint
      stops disclosing which key class was supplied.
    - Add the mnemonic pattern to a pre-commit secret scanner so a replacement literal cannot be reintroduced.
    code_example: '// Before: const mnemonic = ''purpose betray marriage blame crunch ...''

      // After: the secret never enters the repository and its absence stops the process

      const mnemonic = process.env.WEB3_WALLET_MNEMONIC

      if (!mnemonic) throw new Error(''WEB3_WALLET_MNEMONIC is required'')

      const mnemonicWallet = HDNodeWallet.fromPhrase(mnemonic)'
    verification: Grep the working tree for the mnemonic's first three words and assert zero hits; start the service with
      `WEB3_WALLET_MNEMONIC` unset and assert startup fails instead of falling back to a default.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
