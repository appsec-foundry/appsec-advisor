trust_boundaries:
- name: 'api-backend to SQLite: Sequelize parameterized query binding'
  kind: process
  assumption: Every query reaches SQLite through Sequelize parameter binding.
  evidence:
  - file: models/user.ts
    line: 1
  - file: routes/chat.ts
    line: 12
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: api-backend
  to: db-layer
  enforcement_point: Sequelize parameterized query binding
  assumption_legs:
  - leg: data-interpretation
    condition: Every query reaching SQLite is constructed through Sequelize model methods using parameterized bindings, never
      via raw string concatenation.
  covers_components:
  - api-backend
  - db-layer
  surface: in-process
  transition: []
  id: tb-4
  assumption_verdict: refuted
- name: 'Internet to REST API: security.isAuthorized() expressJwt middleware'
  kind: network
  assumption: Every state-changing route is registered behind security.isAuthorized().
  evidence:
  - file: lib/insecurity.ts
    line: 52
  - file: server.ts
    line: 749
  - file: lib/startup/registerWebsocketEvents.ts
    line: 8
  - file: server.ts
    line: 641
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: api-backend
  enforcement_point: security.isAuthorized() expressJwt middleware
  assumption_legs:
  - leg: validation
    condition: Every request body and path parameter is type-checked and schema-validated before it reaches business logic.
  - leg: authentication
    condition: Every state-changing route is registered behind security.isAuthorized(), which verifies the RS256-signed JWT
      before the handler runs.
  - leg: authorization
    condition: Every resource access checks the authenticated subject's identity against the requested object before returning
      or modifying data.
  surface: network
  transition: []
  covers_components:
  - api-backend
  - web3-nft
  id: tb-1
  assumption_verdict: refuted
- name: 'Push/PR to CI/CD: GITHUB_TOKEN scopes and branch protection'
  kind: build
  assumption: Only authorized contributors can trigger workflows that access repository secrets.
  evidence:
  - file: .github/workflows/ci.yml
    line: 1
  - file: .github/workflows/release.yml
    line: 1
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: ci-cd-pipeline
  enforcement_point: GITHUB_TOKEN scopes and branch protection
  assumption_legs:
  - leg: authentication
    condition: Workflow triggers are authenticated by GitHub; only events from the repository's own push and pull_request
      hooks can initiate a workflow run.
  - leg: authorization
    condition: Repository secrets and privileged job steps are accessible only to workflows triggered from protected branches,
      not from untrusted fork PRs.
  surface: build-pipeline
  transition:
  - operator
  id: tb-2
  assumption_verdict: refuted
- name: 'Internet to auth endpoints: login credential check and jwt.sign'
  kind: identity
  assumption: A JWT is issued only after the presented credentials match a stored account record.
  evidence:
  - file: lib/insecurity.ts
    line: 54
  - file: server.ts
    line: 26
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: auth-service
  enforcement_point: login route credential check and jwt.sign issuance
  assumption_legs:
  - leg: validation
    condition: Every authentication request validates the format and completeness of submitted credentials before performing
      a database lookup.
  - leg: authentication
    condition: A JWT bearing a user identity is issued via security.authorize() only after the submitted credentials successfully
      match the stored record.
  surface: network
  transition:
  - identity
  id: tb-3
  assumption_verdict: refuted
- name: api-backend to LLM provider API
  kind: third-party
  assumption: Nothing attacker-controlled reaches the LLM provider unfiltered.
  evidence:
  - file: routes/chat.ts
    line: 9
  - file: routes/chat.ts
    line: 110
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: api-backend
  to: external
  assumption_legs:
  - leg: egress-content
    condition: User-supplied chat messages are sanitized or bounded before being appended to the system prompt or sent to
      the LLM provider.
  - leg: egress-destination
    condition: The LLM provider base URL comes exclusively from server-side configuration and cannot be overridden by request
      input.
  - leg: response-trust
    condition: LLM tool-call responses are treated as untrusted data and validated before being acted upon or returned to
      the client.
  surface: network
  transition:
  - operator
  id: tb-5
  assumption_verdict: refuted
security_controls:
- domain: Identity and Authentication Controls
  control: JWT Issuance and Signature Verification
  effectiveness: Unsafe
  kind: mechanism
  assessment: RSA private key used to sign all session JWTs is hardcoded as a string literal at lib/insecurity.ts:21 and committed
    to the public repository. Any party with read access to the repository can extract the key and forge valid RS256-signed
    tokens for any user identity, defeating the authentication boundary entirely.
  implementation: lib/insecurity.ts — security.authorize() signs with hardcoded privateKey; security.isAuthorized() verifies
    via expressJwt
  rule_id: ARCH-JWT-001
- domain: Identity and Authentication Controls
  control: Route Authentication Middleware
  effectiveness: Weak
  kind: mechanism
  assessment: security.isAuthorized() expressJwt middleware is registered for most API routes via server.ts:749, but POST
    /file-upload, POST /profile/image/file, POST /profile/image/url, POST /rest/memories, POST /api/Feedbacks, GET /rest/admin/application-version,
    GET /rest/admin/application-configuration, and PUT /rest/continue-code-findIt/apply/:continueCode have authentication
    status unknown (server.ts:309-312, 406, 606-607, 612).
  implementation: lib/insecurity.ts:52, server.ts:749 — expressJwt middleware registered globally with per-route exceptions
  rule_id: ARCH-AUTHN-001
- domain: Identity and Authentication Controls
  control: Authentication Endpoint Rate Limiting
  effectiveness: Missing
  kind: mechanism
  assessment: No rate-limiting middleware or upstream throttling control is present for login, registration, password-reset,
    or 2FA verification endpoints. No per-account or per-source-IP limit is observable in repository source. Brute-force and
    credential-stuffing attacks face no technical barrier at the application layer.
  implementation: null
- domain: Authorization Controls
  control: Role and Resource Authorization
  effectiveness: Weak
  kind: mechanism
  assessment: 'Authorization is applied per-route without a central policy framework. At least 19 PUT, DELETE, and PATCH routes
    on sensitive resources have authorization status unknown: /api/Products/:id, /api/Recycles/:id, /api/BasketItems/:id,
    /api/Quantitys/:id, /api/Feedbacks/:id, /api/Cards/:id, /api/Addresss/:id, /rest/basket/:id/coupon/:coupon, /rest/order-history/:id/delivery-status,
    /rest/wallet/balance, /rest/products/:id/reviews, and /rest/products/reviews (server.ts:370-451, 605-634).'
  implementation: routes/*.ts — per-handler checks with no central policy
  rule_id: ARCH-AUTHZ-001
- domain: Authorization Controls
  control: Object-Level Ownership Verification (BOLA/IDOR)
  effectiveness: Weak
  kind: mechanism
  assessment: Authenticated routes addressing resources by numeric ID have JWT middleware present but no observable ownership
    check binding the resource to the authenticated subject. Affected routes include GET/PUT/DELETE /api/Recycles/:id, PUT
    /api/BasketItems/:id, DELETE /api/Quantitys/:id, PUT /api/Feedbacks/:id, and PUT/DELETE /api/Products/:id (server.ts:370-433).
    An authenticated user can reference another user's resource ID.
  implementation: null
  rule_id: ARCH-BOLA-001
- domain: Authorization Controls
  control: Management Endpoint Access Control
  effectiveness: Weak
  kind: surface
  assessment: GET /rest/admin/application-version and GET /rest/admin/application-configuration are registered without observable
    authentication or authorization middleware (server.ts:606-607). Application version and configuration details are exposed
    to unauthenticated callers.
  implementation: server.ts:606-607 — routes registered without isAuthorized()
  rule_id: ARCH-MGMT-001
- domain: Authorization Controls
  control: Database Principal Separation
  effectiveness: Missing
  kind: mechanism
  assessment: All database operations share a single Sequelize connection to the SQLite file with no separate read-only versus
    read-write principals. A compromised application path yields full database write access regardless of the sensitivity
    of the operation.
  implementation: null
  rule_id: ARCH-DBSEP-001
- domain: Input Handling Controls
  control: Parameterized Database Access
  effectiveness: Partial
  kind: mechanism
  assessment: Sequelize ORM parameterized bindings are the declared primary data access pattern (trust boundary tb-4 confirmed
    via models/user.ts and routes/chat.ts:12). The assumption that every query in every route reaches SQLite through parameterized
    bindings lacks complete verification; ad-hoc SQL construction in some routes is a hypothesis raised by architecture analysis.
  implementation: models/*.ts, routes/chat.ts — Sequelize findOne/findAll with where clauses
  rule_id: ARCH-SQLI-001
- domain: Input Handling Controls
  control: Schema-Level Input Validation
  effectiveness: Weak
  kind: cross-cutting
  assessment: No centralized schema or allowlist validation is applied at trust-boundary entry. Observed controls are limited
    to field trimming (server.ts:411-413) and URL path normalization (server.ts:204). Type, range, and format enforcement
    is absent for most route parameters and request bodies, providing no defense-in-depth against injection or malformed input.
  implementation: server.ts:204, 411-413 — regex replace and String.trim() only
  rule_id: ARCH-INPUT-001
- domain: Frontend Security Controls
  control: Angular Template Output Encoding
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'Angular DomSanitizer is deliberately bypassed via bypassSecurityTrustHtml in eight locations: about.component.ts:119
    (user feedback), last-login-ip.component.ts:39 (last IP address), administration.component.ts:73 and :91 (user email and
    feedback), data-export.component.ts:57 (CAPTCHA image), search-result.component.ts:110 and :143 (product description and
    search query), and track-result.component.ts:48 (order number). Attacker-controlled strings from server responses and
    URL query parameters are rendered as raw HTML into the DOM.'
  implementation: frontend/src/app — DomSanitizer.bypassSecurityTrustHtml() used in place of safe text binding
  rule_id: ARCH-XSS-001
- domain: Frontend Security Controls
  control: CORS Policy
  effectiveness: Partial
  kind: mechanism
  assessment: Socket.IO server restricts CORS origin to the single literal value 'http://localhost:4200' (lib/startup/registerWebsocketEvents.ts:20).
    REST API CORS configuration is not confirmed in repository source; the cross-origin access policy for /api/* and /rest/*
    endpoints is unresolved.
  implementation: lib/startup/registerWebsocketEvents.ts:20 — Socket.IO cors.origin hardcoded
  rule_id: ARCH-CORS-001
- domain: Session and Token Management
  control: Session Cookie Hardening
  effectiveness: Missing
  kind: mechanism
  assessment: Authentication relies on JWT bearer tokens transmitted as Authorization headers; no session cookies were observed
    in server configuration. Cookie attributes (Secure, HttpOnly, SameSite) and CSRF protection for cookie-based flows are
    not present.
  implementation: null
  rule_id: ARCH-COOKIE-001
- domain: Cryptography and Secrets
  control: Cryptographic Secret Management
  effectiveness: Unsafe
  kind: mechanism
  assessment: The RSA private key used to sign all session JWTs is a hardcoded string literal at lib/insecurity.ts:21 and
    is committed to a public repository. A BIP39 wallet mnemonic is hardcoded at routes/checkKeys.ts:10. Both values are adversarially
    accessible to anyone who can read the repository, making JWT forgery and wallet key derivation trivially achievable.
  implementation: lib/insecurity.ts:21 — RSA PEM literal; routes/checkKeys.ts:10 — BIP39 mnemonic literal
  rule_id: ARCH-SECRET-001
- domain: Transport Security
  control: Transport Layer Encryption (TLS)
  effectiveness: Missing
  kind: mechanism
  assessment: The Express application binds HTTP on port 3000 with no TLS configuration in application source. No environment
    variable or startup requirement for an upstream TLS terminator is present. Credentials, session tokens, and sensitive
    data travel in cleartext unless a separately configured reverse proxy provides termination.
  implementation: null
  rule_id: ARCH-TLS-001
- domain: LLM and AI Controls
  control: LLM Prompt Injection Guard and Tool-Call Authorization
