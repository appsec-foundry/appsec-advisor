  stride: Spoofing
  cwe: CWE-598
  title: OAuth Implicit Flow Token in URL (frontend/src/app/login/login.component.ts:148)
  scenario: 'An attacker targets the Google sign-in path. `googleLogin()` at `frontend/src/app/login/login.component.ts:148`
    navigates the browser to `accounts.google.com/o/oauth2/v2/auth` with `response_type=token` — the deprecated implicit flow
    — and no `state`, no `nonce`, and no PKCE parameters (repo-wide grep for `code_challenge`, `code_verifier`, `state=`,
    `nonce` across `frontend/src` returns zero hits). Google therefore returns a live access token in the URL fragment, which
    `parseRedirectUrlParams()` at `frontend/src/app/oauth/oauth.component.ts:71` splits out of `this.route.snapshot.data.params`
    and posts to `/rest/user/login`. Because the fragment is part of the address bar, the token reaches browser history, screenshots,
    and any injected script on the callback page. The absent `state` parameter is the second half: an attacker who obtains
    a token for their own Google account can hand a victim a crafted `#access_token=<attacker_token>` callback link, and the
    SPA logs the victim into the attacker''s account without any binding check.'
  attack_steps:
  - An attacker completes the Google sign-in themselves and captures the `access_token` value their own callback URL fragment
    carries.
  - The attacker sends the victim a link to the Juice Shop callback route with that fragment appended.
  - The victim's browser hands the fragment to `oauth.component.ts:71`, which logs the victim into the attacker's account
    because no `state` value ties the callback to the victim's own request.
  evidence_summary: '`login.component.ts:148` builds the authorization URL with `response_type=token` and only `client_id`,
    `scope`, and `redirect_uri` — no `state`, `nonce`, or `code_challenge`.'
  impact_description: A Google access token for the `email` scope is exposed in the URL fragment, and the unbound callback
    lets an attacker force a victim into an attacker-controlled session.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: '`ngOnInit()` at `login.component.ts:80` matches the computed `redirectUri` against `config.application.googleOauth.authorizedRedirects`
    with an exact `===` comparison, then falls back to `authorizedRedirect.proxy`. The check runs entirely in the browser
    and only decides whether the button is enabled — it constrains nothing that Google enforces.'
  mitigation_title: Replace the implicit OAuth flow with authorization code + PKCE and validate state and nonce
  remediation:
    effort: Medium
    steps:
    - Change `googleLogin()` at `login.component.ts:148` to `response_type=code`, and add `code_challenge` plus `code_challenge_method=S256`
      derived from a per-attempt verifier held in `sessionStorage`.
    - Generate a per-attempt `state` and `nonce` with `crypto.getRandomValues()`, send both in the authorization URL, and
      reject the callback in `oauth.component.ts:parseRedirectUrlParams()` when the returned `state` does not equal the stored
      value.
    - Exchange the authorization code server-side so no token ever appears in the browser URL; the SPA receives only the application
      session established by the Express backend.
    - Move the `authorizedRedirects` allowlist check server-side — the current `login.component.ts:80` comparison is advisory
      only.
    code_example: "// Before: implicit flow, token lands in the URL fragment\n// location.replace(`${oauthProviderUrl}?client_id=${this.clientId}&response_type=token&scope=email&redirect_uri=${this.redirectUri}`)\n\
      \n// After: code flow + PKCE + state; nothing sensitive is returned in the URL\nconst verifier = base64url(crypto.getRandomValues(new\
      \ Uint8Array(32)))\nconst state = base64url(crypto.getRandomValues(new Uint8Array(16)))\nsessionStorage.setItem('pkce_verifier',\
      \ verifier)\nsessionStorage.setItem('oauth_state', state)\nconst challenge = base64url(await crypto.subtle.digest('SHA-256',\
