- id: M-071
  title: Validate redirect targets against an allowlist
  threat_ids:
  - T-072
  priority: P3
  severity: Medium
  effort: Low
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Match redirect targets by parsed origin instead of substring containment
  steps:
  - Parse the candidate with `new URL(url)` and compare `origin` plus `pathname` against the allowlist entries with strict
    equality, replacing the `includes` test at lib/insecurity.ts:136.
  - Reject any candidate that fails to parse, or whose protocol is not `https:`.
  - Prefer an indirection map — accept a short opaque key and look the real destination up server-side — so no caller-supplied
    URL is ever reflected into `res.redirect`.
  - 'Set `Referrer-Policy: no-referrer` on the redirect response so the originating URL is not disclosed to the target.'
  code_example: "// Before - lib/insecurity.ts:136: substring containment accepts any wrapping URL\n// allowed = allowed ||\
    \ url.includes(allowedUrl)\n\n// After: exact origin and path comparison against the allowlist\nexport const isRedirectAllowed\
    \ = (url: string) => {\n  let candidate: URL\n  try { candidate = new URL(url) } catch { return false }\n  if (candidate.protocol\
    \ !== 'https:') return false\n  return [...redirectAllowlist].some((allowed) => {\n    const a = new URL(allowed)\n  \
    \  return a.origin === candidate.origin && a.pathname === candidate.pathname\n  })\n}"
  verification: GET `/redirect?to=https://attacker.example/?x=https://github.com/juice-shop/juice-shop` and assert HTTP 406
    with no `Location` header pointing at `attacker.example`.
  reference: https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
  file: lib/insecurity.ts:136
