  scenario: An attacker with access to reverse-proxy logs, browser history, or a referrer header harvests plaintext passwords,
    because routes/changePassword.ts:14 through 17 read the current, new, and repeat passwords from req.query. Every password
    change therefore places both the old and the new plaintext password into the request line, which intermediaries record
    by default.
  evidence_summary: routes/changePassword.ts:14 reads query.current as the current password and lines 15 and 17 read the new
    and repeated passwords from the same query object.
  impact_description: Plaintext passwords accumulate in access logs, proxy logs, and browser history, where they are readable
    by operators and by anyone who later obtains those logs.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None
  mitigation_title: Accept password-change parameters in the request body instead of the query string
