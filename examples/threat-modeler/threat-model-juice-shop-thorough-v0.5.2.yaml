assets:
- id: A-001
  name: User Account Credentials
  classification: Restricted
  description: Password hashes stored in the users table via models/user.ts. Juice Shop uses a weak hashing scheme (MD5) for
    challenge purposes, making the stored credentials directly exploitable if the database is exfiltrated. Credential theft
    is the primary consequence of SQLi or database-file access attacks.
  linked_threats: []
  evidence_flags: []
- id: A-002
  name: User PII (email, address, name)
  classification: Confidential
  description: Email addresses, delivery addresses, and user profile data persisted in the users and address Sequelize models.
    Exposed through multiple IDOR-vulnerable REST endpoints and the data-export route.
  linked_threats: []
  evidence_flags: []
- id: A-003
  name: JWT Bearer Tokens
  classification: Confidential
  description: JWT tokens issued by the Express backend and stored in browser localStorage by the Angular SPA (basket.service.ts:64).
    XSS payloads can exfiltrate these tokens, providing full authenticated access to the victim's account without requiring
    credentials.
  linked_threats: []
  evidence_flags: []
- id: A-004
  name: Payment Card Data
  classification: Confidential
  description: Payment card numbers and metadata stored in the card Sequelize model (models/card.ts) and exposed through /api/Cards/:id
    endpoints. Multiple missing-authz routes allow any authenticated user to read or modify card records belonging to other
    users.
  linked_threats: []
  evidence_flags: []
- id: A-005
  name: SQLite Database File
  classification: Confidential
  description: SQLite database file on local filesystem containing all user, order, product, challenge, and session data.
    Accessible to any process running as the application user; file-path traversal or RCE leads to full data exfiltration.
  linked_threats: []
  evidence_flags: []
- id: A-006
  name: Hardcoded RSA Private Key (JWT Signing Key)
  classification: Restricted
  description: 2048-bit RSA private key embedded verbatim in lib/insecurity.ts at line 21, used to sign all JWTs issued by
    the application. Any party with read access to the source repository can forge arbitrary JWT tokens for any user account,
    bypassing authentication entirely.
  linked_threats: []
  evidence_flags: []
- id: A-007
  name: LLM API Key
  classification: Restricted
  description: External LLM provider API key consumed at runtime via the LLM_API_KEY environment variable (routes/chat.ts:110)
    and validated at startup by lib/startup/validatePreconditions.ts. Exfiltration enables unauthorized use of the configured
    LLM service and incurs billing under the key owner's account.
  linked_threats: []
  evidence_flags: []
- id: A-008
  name: Application Configuration Data
  classification: Internal
  description: Runtime application configuration exposed unauthenticated at /rest/admin/application-configuration (server.ts:607),
    including feature flags, challenge parameters, and LLM endpoint URLs. Discloses internal topology that assists targeted
    attack planning.
  linked_threats: []
  evidence_flags: []
- id: A-009
  name: CI/CD Pipeline Secrets
  classification: Restricted
  description: GitHub Actions workflow secrets including npm publish tokens, container registry credentials, and GITHUB_TOKEN
    used across release.yml and related workflows. Compromise via unpinned third-party actions or pull_request_target misuse
    would give an attacker publish rights to the npm package and Docker image.
  linked_threats: []
  evidence_flags: []
- id: A-010
  name: Challenge Progress and CTF State
  classification: Internal
  description: User challenge completion records and application CTF state stored in the challenge and related Sequelize models.
    Manipulable via unauthenticated continue-code endpoints (R-067, R-068, R-069), allowing arbitrary challenge completion
    without solving the underlying exercise.
  linked_threats: []
  evidence_flags: []
