- local_id: sqlite-db-008
  threat_category_id: TH-17
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-359
  title: Indefinite Retention of Personal Data (models/user.ts:123)
  scenario: 'The User model is declared `paranoid: true` (models/user.ts:123), so Sequelize turns every delete into an UPDATE
    that sets `deletedAt` and leaves the row intact. Everything the account held stays in the table indefinitely: email address,
    password digest, `totpSecret`, `lastLoginIp`, and — through the foreign keys wired in models/relations.ts — the associated
    Addresses, Cards, and Memories, none of which are cascaded or scrubbed. The erasure path that should compensate does not
    exist: `models/privacyRequests.ts:34` stores a single `deletionRequested` boolean with a default of `false` and no state
    machine, no completion timestamp, and no worker that acts on it. So a user exercising a deletion right produces a flag
    and nothing more. The security consequence is concrete rather than merely regulatory — every later breach of this database
    exposes the personal data of users who believed they had left years earlier, and the retained `totpSecret` and card rows
    of deleted accounts are as usable to an attacker as those of active ones.'
  evidence_summary: '`models/user.ts:123` sets `paranoid: true` so deletes only stamp `deletedAt`, while models/privacyRequests.ts:34
    records deletion intent as a bare boolean with no erasure or anonymisation path behind it.'
  impact_description: Personal data, card records, and TOTP seeds of deleted accounts persist indefinitely and are exposed
    by any future breach, with no mechanism to honour a deletion request.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: A PrivacyRequests table records that a deletion was asked for; nothing consumes it, and soft delete preserves
    every attribute of the account.
  mitigation_title: Implement an erasure worker that anonymizes user rows and cascades to associated personal data
  remediation:
    effort: Medium
    steps:
    - 'Add a worker that consumes `PrivacyRequests` rows with `deletionRequested = true` and performs a real erasure: overwrite
      `email`, `username`, `lastLoginIp`, `password`, and `totpSecret` with tombstone values before the soft delete, so the
      retained row carries no personal data.'
    - Cascade to associated records — delete or anonymise the user's Addresses, Cards, Memories, and Complaints in the same
      transaction; `paranoid` on the parent does nothing for children.
    - 'Extend the PrivacyRequests model beyond a boolean: add `requestedAt`, `completedAt`, and a status enum so the erasure
      is auditable and a stalled request is visible.'
    - Set a retention window for soft-deleted rows and purge them on schedule, so `deletedAt` marks a bounded grace period
      rather than permanent storage.
    code_example: "// erasure worker — After: the retained row is a tombstone, not a profile\nawait sequelize.transaction(async\
      \ (t) => {\n  await CardModel.destroy({ where: { UserId }, force: true, transaction: t })\n  await AddressModel.destroy({\
      \ where: { UserId }, force: true, transaction: t })\n  await UserModel.update(\n    { email: `deleted-${UserId}@invalid`,\
      \ username: '', password: '', totpSecret: '', lastLoginIp: '0.0.0.0' },\n    { where: { id: UserId }, transaction: t\
      \ }\n  )\n  await UserModel.destroy({ where: { id: UserId }, transaction: t }) // soft delete of a scrubbed row\n})"
    verification: Submit a deletion request, run the worker, then assert `SELECT email, totpSecret FROM Users WHERE id = <user>`
      returns tombstone values and `SELECT COUNT(*) FROM Cards WHERE UserId = <user>` returns 0.
    reference: CWE-359
  evidence:
  - file: models/user.ts
    line: 123
  evidence_check: verified
