  code_example: "// Before — every caller receives the tool name and arguments\n// res.write(`data: ${JSON.stringify({ choices:\
    \ [{ delta: { tool_calls: [...] } }] })}\\n\\n`)\n\n// After — the write is gated on a verified admin role; others get\
    \ a bare marker\nmetricToolCalls.labels({ tool: event.toolName }).inc()\nif (await isVerifiedAdmin(req)) {\n  res.write(`data:\
    \ ${JSON.stringify({ choices: [{ delta: { tool_calls: [/* ... */] } }] })}\\n\\n`)\n} else {\n  res.write(`data: ${JSON.stringify({\
