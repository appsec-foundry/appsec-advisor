  cwe: CWE-89
  title: SQL Injection
  affected_parameter: email
  scenario: 'The login handler builds its authentication query by interpolating `req.body.email` and the MD5 digest of `req.body.password`
    directly into a raw SQL string passed to Sequelize''s `query()` with `plain: true`. No parameter binding, escaping, or
    type check stands between the JSON request body and the SQLite parser. An unauthenticated attacker POSTs to `/rest/user/login`
    with an email of `'' OR true--`, which terminates the string literal and comments out the password comparison, so the
    first row of `Users` is returned as the authenticated principal. Because `plain: true` returns exactly one row and the
    seeded admin is row 1, the attacker receives a valid RS256 JWT for the administrator without ever knowing a password.
    The same sink also permits UNION-based extraction of any table SQLite can reach.'
  attack_steps:
  - 'An attacker POSTs to `/rest/user/login` with the JSON body `{"email": "'' OR 1=1--", "password": "x"}`.'
  - The attacker's quote closes the email literal and the `--` comments out the password and soft-delete predicates, so the
    query matches every row.
  - The attacker receives the first matching user row, which is the seeded administrator, and the server issues a signed session
    token for that account.
  - The attacker replays that token against `/api/Users` and the other administrative endpoints as a fully privileged principal.
  evidence_summary: routes/login.ts:34 concatenates `req.body.email` into the SQL text handed to Sequelize's raw `query()`
    rather than passing it as a bind parameter.
  impact_description: Any unauthenticated internet client can authenticate as the administrator and read or modify every record
    the application owns.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None. `/rest/user/login` is registered at server.ts:596 with no authentication, no schema validation,
    and no rate limiting ahead of the handler.
  mitigation_title: Replace the raw login query in routes/login.ts with a parameterized Sequelize finder
  remediation:
    effort: Low
    steps:
    - 'Replace the `models.sequelize.query()` call at routes/login.ts:34 with `UserModel.findOne({ where: { email: req.body.email,
      password: hashed } })`, which binds both values as parameters.'
    - 'If a raw query must be retained, pass values via `replacements` and `type: QueryTypes.SELECT` so Sequelize escapes
      them, never via template interpolation.'
    - Add a request-body schema check (the project already depends on `zod`, used in routes/chat.ts:10) that rejects an `email`
      field that is not a syntactically valid address before the handler runs.
    - Grep the repository for every remaining `sequelize.query(` call site and convert each one the same way.
    code_example: "// Before - routes/login.ts:34: attacker-controlled text becomes SQL syntax\n// models.sequelize.query(`SELECT\
      \ * FROM Users WHERE email = '${req.body.email}' ...`)\n\n// After: email travels as a bound parameter, so quotes stay\
      \ data\nconst user = await UserModel.findOne({\n  where: {\n    email: req.body.email ?? '',\n    password: security.hash(req.body.password\
      \ ?? '')\n  }\n})"
    verification: POST `{"email":"' OR 1=1--","password":"x"}` to `/rest/user/login` and assert the response is HTTP 401 with
      body `Invalid email or password.` rather than a 200 carrying an `authentication.token`. Add this as a regression test
      in the existing test suite.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
