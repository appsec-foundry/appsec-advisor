- id: M-093
  title: Offload CPU-bound work and bound execution time
  threat_ids:
  - T-094
  priority: P3
  severity: Medium
  effort: Low
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Add a busy timeout, WAL mode, and statement timeouts to the Sequelize SQLite co…
  steps:
  - Enable WAL journal mode (`PRAGMA journal_mode=WAL`) and set `PRAGMA busy_timeout=5000` on connect so concurrent readers
    do not block the writer and contending writers wait rather than immediately consuming a retry.
  - 'Narrow the lock window: use `Transaction.TYPES.DEFERRED` for read-mostly transactions so the write lock is taken at first
    write instead of at transaction start.'
  - Bound per-request work at the model layer — enforce a maximum `limit` on every `findAll` used by a public route, and reject
    requests whose page size exceeds it, so one caller cannot pull the whole table.
  - For any deployment beyond a single instance, move to a server-backed engine (PostgreSQL) via the same Sequelize models;
    a single-writer file database cannot be scaled horizontally at all.
  code_example: "// models/index.ts — After: contention is absorbed by a wait, not by burning retries\nconst sequelize = new\
    \ Sequelize('database', 'username', 'password', {\n  dialect: 'sqlite',\n  storage: process.env.DB_PATH ?? '/var/lib/juiceshop/juiceshop.sqlite',\n\
    \  transactionType: Transaction.TYPES.DEFERRED,\n  pool: { max: 5, acquire: 5000 },\n  retry: { match: [/SQLITE_BUSY/],\
    \ name: 'query', max: 5 }\n})\nawait sequelize.query('PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;')"
  verification: Drive 100 concurrent POSTs to a write endpoint and assert no response carries a `SQLITE_BUSY` error and p99
    latency stays bounded; assert `PRAGMA journal_mode` returns `wal` at runtime.
  reference: CWE-400
  file: models/index.ts:36
