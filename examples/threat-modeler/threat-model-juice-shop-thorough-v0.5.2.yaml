- local_id: auth-service-018
  threat_category_id: TH-06
  additional_categories:
  - TH-02
  stride: Elevation of Privilege
  cwe: CWE-602
  title: Client-side-only admin guard (frontend/src/app/app.guard.ts:54)
  scenario: An attacker edits the JWT payload stored in localStorage so data.role reads admin, because AdminGuard at frontend/src/app/app.guard.ts:54
    decides route access from jwtDecode output alone. tokenDecode at line 38 decodes without verifying the signature, so the
    guard reaches its allow branch on an unsigned or tampered payload and the administration views render, exposing their
    structure and issuing their API calls without any client-side obstacle.
  evidence_summary: frontend/src/app/app.guard.ts:54 compares payload.data.role against the admin role from a payload produced
    by jwtDecode at line 38, which decodes the token without signature verification.
  impact_description: Administrative and accounting views become reachable by editing a browser-storage value, revealing privileged
    interface structure and driving privileged API calls that must then be rejected server-side.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Server routes are separately guarded by expressJwt, but the role decision in the browser rests entirely
    on an unverified decoded payload.
  mitigation_title: Confirm the admin role server-side before rendering privileged routes
  remediation:
    effort: Medium
    steps:
    - Have AdminGuard and AccountingGuard at frontend/src/app/app.guard.ts:54 and 70 resolve the role from a server endpoint
      that verifies the token, rather than from a locally decoded payload.
    - Ensure every administrative API route enforces the role server-side so a bypassed guard grants no data.
