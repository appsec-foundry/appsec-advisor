- local_id: auth-service-011
  threat_category_id: TH-03
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-798
  title: Hardcoded HMAC key (lib/insecurity.ts:42)
  scenario: An attacker reads the literal HMAC key from lib/insecurity.ts:42 and precomputes the digest of every plausible
    security answer, because routes/resetPassword.ts:41 compares stored answers against this keyed digest. With the key public
    the HMAC provides no secrecy over the answer set, so a stolen SecurityAnswers table is reversed by dictionary attack and
    the same key cannot be rotated without a code change.
  evidence_summary: lib/insecurity.ts:42 embeds the HMAC-SHA256 key as a string literal, and routes/resetPassword.ts:41 uses
    security.hmac to compare the submitted security answer with the stored value.
  impact_description: Security answers are recoverable offline from a database copy, feeding the password-reset takeover path
    for every enrolled account.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: Answers are stored as keyed HMAC digests rather than plaintext, but the key is public.
  mitigation_title: Move the security-answer HMAC key to external secret configuration
  remediation:
    effort: Medium
    steps:
    - Read the HMAC key at lib/insecurity.ts:42 from a required secret source and fail startup when it is absent.
    - Store security answers with a per-record salt and a memory-hard KDF rather than a shared-key HMAC, and re-enroll answers
      on next use.
    - Add a startup test asserting the process exits non-zero when the HMAC key variable is unset.
    code_example: null
    verification: Start the server with the HMAC key variable unset and assert a non-zero exit code with no answer-comparison
      path reachable.
    reference: 'CWE-798: Use of Hard-coded Credentials'
  evidence:
  - file: lib/insecurity.ts
    line: 42
  evidence_check: verified
  prior_finding_ref: null
