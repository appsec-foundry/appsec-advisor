  cwe: CWE-290
  title: Caller-Supplied Identity Header (request.interceptor.ts:23)
  affected_parameter: X-User-Email
  scenario: 'Every outgoing request carries a second, unauthenticated statement of who the caller is. `request.interceptor.ts:20-25`
    reads the `email` key straight out of `localStorage` and attaches it as an `X-User-Email` header, independent of the `Authorization`
    header built four lines above. The value is not derived from the verified session — it is whatever string the user last
    put in browser storage, and any user can set it in the console. The server side already has a reader for it: `userEmailFrom()`
    at `lib/insecurity.ts:93` returns `headers[''x-user-email'']` with no cross-check against the JWT subject. A grep across
    `routes/`, `lib/`, and `server.ts` finds no current caller of that helper, so today the header is inert; the exposure
    is that the SPA supplies a forgeable identity claim as ambient request context, and the first log line, analytics event,
    or authorization branch that reads it inherits an attacker-chosen identity. Attribution for any action recorded from that
    header is therefore unusable as evidence — the account named in the record is not necessarily the account that acted.'
  attack_steps:
  - An attacker logs in normally and then sets `localStorage.email` to another user's address in the browser console.
  - 'The attacker performs ordinary application actions; `request.interceptor.ts:23` attaches `X-User-Email: victim@juice-sh.op`
    to each request while the `Authorization` header still carries the attacker''s own token.'
  - The attacker denies the actions, because any record or decision keyed on `userEmailFrom()` names the victim rather than
    the token holder.
  evidence_summary: '`request.interceptor.ts:20-25` sets `X-User-Email` from `localStorage.getItem(''email'')`, a value the
    user writes, and `lib/insecurity.ts:93` exposes a reader for that header that never compares it to the session.'
  impact_description: Any server-side log entry or decision that consumes `X-User-Email` records an identity the caller chose,
    destroying attribution for the actions concerned.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: The `Authorization` bearer token is sent on the same requests and is the only claim the server verifies.
    Nothing reconciles the two, and no route currently consumes the header — the `userEmailFrom()` helper at `lib/insecurity.ts:93`
    has no caller in `routes/`, `lib/`, or `server.ts`.
  mitigation_title: Stop sending X-User-Email and derive caller identity server-side from the verified token
  remediation:
    effort: Low
    steps:
    - Delete the second `req.clone()` block at `request.interceptor.ts:20-25`; the SPA has no reason to assert an identity
      the token already carries.
    - Delete `userEmailFrom()` at `lib/insecurity.ts:93` so no future route can be wired to a client-supplied identity, and
      resolve the caller's email from the verified JWT subject instead.
    - Where the email is genuinely needed for display, fetch it through `/rest/user/whoami` rather than caching it in `localStorage`
      as an authority.
    - Add an audit log that records actor id, action, resource, and timestamp from the verified session, so security-relevant
      actions have an attribution source that the caller cannot influence.
    code_example: '// Before (frontend/src/app/Services/request.interceptor.ts:20-26)

      // if (localStorage.getItem(''email'')) {

      //   req = req.clone({ setHeaders: { ''X-User-Email'': String(localStorage.getItem(''email'')) } })

      // }


      // After: the token is the only identity claim; the server resolves the email from it.

      // (block removed entirely)


      // Express side — identity comes from the verified session, never from a header

      const actor = security.authenticatedUsers.from(req)?.data

      log.info({ actorId: actor?.id, actorEmail: actor?.email, action, resourceId })'
    verification: Set `localStorage.email` to another user's address, perform an action, and assert no server log line or
      response reflects that address. Add a unit test asserting `RequestInterceptor` emits only the `Authorization` header,
      and a grep-based CI check that `x-user-email` appears nowhere in `routes/` or `lib/`.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
  evidence:
  - file: frontend/src/app/Services/request.interceptor.ts
    line: 23
  evidence_check: verified
