    steps:
    - Remove the bypassSecurityTrustHtml call in trustProductDescription(); use Angular's default interpolation {{description}}
      or DomSanitizer.sanitize(SecurityContext.HTML, description) to allow safe markup only.
    - Sanitize product description input server-side on write using an allow-list HTML sanitizer (e.g., DOMPurify) before
      persisting to the database.
    - Add a Playwright/Cypress test that injects <img src=x onerror=alert(1)> as a product description and asserts no alert
