    has no permissions block. The recon signal IAC-010 (High severity) at ci.yml line 1 confirms the missing permissions control.'
  impact_description: A compromised CI step inherits write access to repository contents, packages, and deployments via GITHUB_TOKEN,
    enabling unauthorized code or artifact publishing as the project identity.
