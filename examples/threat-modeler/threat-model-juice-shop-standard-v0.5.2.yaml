components:
- id: frontend-spa
  name: Frontend SPA
  description: Angular 21 single-page application served from the Express backend at '/'. Handles all user-facing UI including
    authentication flows, product browsing, checkout, user profile, admin dashboard, and the interactive hacking-instructor
    tutorial. Stores JWT bearer tokens in localStorage and manages OAuth implicit flow callbacks.
  paths:
