trust_boundaries:
- name: 'external -> backend-api: security.isAuthorized() expressJwt middleware'
  kind: network
  assumption: Every state-changing or data-access route is gated behind security.isAuthorized() expressJwt middleware.
  evidence:
  - file: server.ts
    line: 352
  - file: lib/insecurity.ts
    line: 52
  - file: server.ts
    line: 641
  - file: routes/nftMint.ts
    line: 38
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: backend-api
  enforcement_point: security.isAuthorized() expressJwt middleware
  assumption_legs:
  - leg: validation
    condition: Every request body and path parameter is schema-validated before it reaches route handler business logic.
  - leg: authentication
    condition: Every state-changing or data-access route is gated behind security.isAuthorized() expressJwt middleware.
  - leg: authorization
    condition: Every object reference is checked against the authenticated user's JWT identity before access is granted.
  surface: network
  transition: []
  covers_components:
  - backend-api
  - web3-nft
  id: tb-1
  assumption_verdict: refuted
- name: 'external -> auth: security.authorize() jwt.sign'
  kind: identity
  assumption: A JWT is issued via jwt.sign only after credentials are matched against the stored password hash.
  evidence:
  - file: lib/insecurity.ts
    line: 54
  - file: routes/login.ts
    line: 24
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: auth
  enforcement_point: security.authorize() jwt.sign
  assumption_legs:
  - leg: validation
    condition: Login and registration request bodies are type-checked before credential comparison or account creation.
  - leg: authentication
    condition: A JWT is issued via jwt.sign only after credentials are matched against the stored password hash.
  - leg: authorization
    condition: Privilege-raising auth operations such as 2FA setup verify the caller holds a valid session before proceeding.
  surface: network
  transition:
  - identity
  id: tb-2
  assumption_verdict: refuted
- name: 'backend-api -> data-store-sqlite: Sequelize model parameter binding'
  kind: process
  assumption: Every backend API query reaches SQLite through Sequelize model methods using parameterized binding, not raw
    string concatenation.
  evidence:
  - file: models/user.ts
    line: 36
  - file: models/basket.ts
    line: 1
  - file: routes/login.ts
    line: 34
  - file: lib/insecurity.ts
    line: 1
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: backend-api
  to: data-store-sqlite
  enforcement_point: Sequelize model parameter binding
  assumption_legs:
  - leg: data-interpretation
    condition: Every backend API query reaches SQLite through Sequelize model methods using parameterized binding, not raw
      string concatenation.
  covers_components:
