  evidence:
  - file: routes/chat.ts
    line: 184
  evidence_check: verified
  evidence_summary: routes/chat.ts:184 calls `security.generateCoupon(discount)` directly inside the tool execute function
    with no guard on the discount value or on precondition verification.
  evidence_tier: confirmed-exploitable
  impact: High
  impact_description: The chatbot can generate real discount coupons exceeding policy limits for any user who persuades the
    LLM, causing direct financial loss without requiring any exploit technique.
  likelihood: High
  local_id: llm-chat-service-002
  mitigation_title: Enforce coupon policy conditions in the generateCoupon tool execute function with database verification
  owasp_asi_ids:
  - ASI02
  owasp_llm_ids:
  - LLM06
  remediation:
    code_example: "// After — enforce policy in execute function\nexecute: async ({ orderId }) => {\n  const userId = await\
      \ getUserId(req)\n  if (!userId) return { error: 'Authentication required' }\n  const order = await db.ordersCollection.findOne({\
      \ orderId })\n  if (!order || order.userId !== userId) return { error: 'Order not found' }\n  if (!order.damage_report)\
      \ return { error: 'No verified damage report on this order' }\n  const discount = 10  // fixed by policy, not LLM-supplied\n\
      \  const couponCode = security.generateCoupon(discount)\n  logger.info({ event: 'coupon_generated', userId, orderId,\
      \ discount })\n  return { couponCode, discount }\n}"
    effort: Medium
    reference: CWE-284
    steps:
    - 'Move all coupon policy conditions to the execute function: require orderId as a parameter, look up the order in the
      database, verify it belongs to the authenticated user and has a damage_report status before generating a coupon.'
    - Cap the discount to 10% in server-side code (`const safDiscount = Math.min(discount, 10)`) and remove the discount from
      the LLM input schema entirely, using only the server-determined value.
    - 'Require user authentication before any tool that generates financial instruments can execute; return `{ error: ''Authentication
      required'' }` from generateCoupon if userId is undefined.'
    - 'Add structured audit logging for every generateCoupon call: actor, orderId, discount amount, generated code hash, and
      timestamp.'
    verification: Authenticated as user A, call generateCoupon for an undamaged order via the chatbot. Verify the tool returns
      an error, not a coupon code. Then as an unauthenticated user verify the tool returns 'Authentication required'.
  risk: High
  scenario: 'The generateCoupon tool at routes/chat.ts:176-187 is wired to `security.generateCoupon(discount)` (line 184)
    which produces real, redeemable coupon codes. The tool is invocable by the LLM during any chat session, authenticated
    or not, whenever the LLM determines coupon conditions are met. Because no server-side authorization guard exists in the
    execute function — the policy conditions (damaged order, explicit rejection, max 10%) are only represented in the system
    prompt — the tool''s damage bound is the full range of discount values the LLM will accept. Even without adversarial prompt
