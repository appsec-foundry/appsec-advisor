  - file: models/card.ts
    line: 1
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: api-server
  to: sqlite-db
  enforcement_point: Sequelize model method parameterized queries
  assumption_legs:
  - leg: data-interpretation
    condition: Every query reaches SQLite through Sequelize parameter binding without raw string interpolation of caller-supplied
