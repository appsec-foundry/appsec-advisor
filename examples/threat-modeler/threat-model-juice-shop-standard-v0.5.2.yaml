- local_id: angular-spa-001
  threat_category_id: TH-10
  additional_categories: []
  stride: Spoofing
  cwe: CWE-287
  title: OAuth implicit flow exposes access_token in URL fragment (app.routing.ts:286)
  scenario: An attacker who can observe the browser history, Referer header, or a shared/logged URL receives the OAuth access_token
    embedded in the URL fragment (#access_token=...) before the Angular router consumes it, allowing impersonation of the
    victim user.
  attack_steps:
  - Attacker tricks victim into initiating Google OAuth login from a shared or monitored browser session.
  - Google redirects to /#access_token=<token>; the token appears in browser history and any Referer headers sent to third-party
    resources on the page.
  - Attacker retrieves token from browser history, Referer log, or a referrer-leaking analytics script and replays it against
    the /rest/user/whoami API endpoint.
  - Attacker is authenticated as the victim and gains full account access including stored payment and address data.
  evidence_summary: app.routing.ts:286 routes to the OAuthComponent when the URL contains '#access_token=', confirming the
    OAuth implicit flow is in use. oauth.component.ts:28 immediately consumes parseRedirectUrlParams().access_token from the
    fragment.
  impact_description: Attacker authenticates as any user who completed Google OAuth login, gaining access to their orders,
    personal data, and stored payment information.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None — access_token is exposed in URL fragment without any PKCE or state validation observed in the SPA
    OAuth handler.
  mitigation_title: Replace implicit flow with authorization-code flow and PKCE in oauth.component.ts
  remediation:
    effort: High
    steps:
    - Migrate the Google OAuth integration from implicit flow (response_type=token) to authorization-code flow with PKCE (response_type=code,
      code_challenge_method=S256).
    - Exchange the authorization code server-side so the access_token never appears in the browser URL.
    - Validate the state parameter server-side on every callback to prevent CSRF on the OAuth callback.
    - Verify with an automated test that navigating to the /# callback URL without a valid code+code_verifier pair returns
      a 400 and no session is created.
    code_example: null
    verification: Send a crafted callback URL containing '#access_token=forged_token'; confirm the application does not create
      an authenticated session and returns to the login page.
    reference: RFC 9700 – OAuth 2.0 Security Best Current Practice, section 4.2 (Implicit Grant)
  evidence:
  - file: frontend/src/app/app.routing.ts
    line: 286
  evidence_check: verified
