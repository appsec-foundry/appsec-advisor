  handles_sensitive_data: true
  threat_ids:
  - T-003
  - T-035
- id: auth-guard
  name: Client-Side Auth Guards and JWT Session
  description: Angular LoginGuard and AdminGuard route guards that enforce client-side navigation restrictions. JWT tokens
    issued by api-server are stored in browser localStorage and attached to outgoing requests via an HTTP interceptor. OAuth
    credential derivation (reversible base64 encoding) is also handled here.
  paths:
  - frontend/src/app/app.guard.ts
  - frontend/src/app/app.routing.ts
  - frontend/src/app/login/**
  - frontend/src/app/oauth/**
