  cwe: CWE-327
  title: MD5 Password Hashing Without Salt (lib/insecurity.ts:41)
  scenario: lib/insecurity.ts:41 defines the password hash as `crypto.createHash('md5').update(data).digest('hex')`. MD5 has
    no iteration cost and produces a 128-bit output with no salt. If an attacker exfiltrates the Users table (e.g. via the
    SQL injection at routes/login.ts:34), all password hashes can be cracked against rainbow tables within seconds for common
    passwords and within hours for arbitrary passwords using GPU acceleration.
  evidence_summary: 'lib/insecurity.ts:41: `export const hash = (data: string) => crypto.createHash(''md5'').update(data).digest(''hex'')`.
    routes/login.ts:34 uses `security.hash(req.body.password)` in the SQL query to check passwords — confirming MD5 as the
    sole password storage algorithm.'
  impact_description: All user passwords stored as unsalted MD5 hashes are recoverable offline once the database is exfiltrated;
    full account compromise for all users follows.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None — MD5 is the only password-hashing primitive; no salt, no iteration.
  mitigation_title: Replace MD5 with Argon2id or bcrypt for Password Storage
  remediation:
    effort: High
    steps:
    - 'Replace `crypto.createHash(''md5'')` at lib/insecurity.ts:41 with `argon2.hash(data, { type: argon2.argon2id })` using
      the argon2 npm package.'
    - 'Migrate existing password hashes: on next successful login, rehash the password with Argon2id and store the new hash.'
    - Add a unit test that verifies the hash function returns a value beginning with `$argon2id$` and that two hashes of the
      same input differ (salted).
    code_example: null
    verification: Hash a sample password, store it, then verify it with argon2.verify; assert that the stored string is not
      32 hex characters (MD5 output).
    reference: 'CWE-327: https://cwe.mitre.org/data/definitions/327.html'
