  component_name: Authentication & Session Surface
  controls_in_place: Security answers are HMAC-SHA256 stored, not plaintext; the reset endpoint is rate-limited.
  cwe: CWE-321
  evidence:
  - file: lib/insecurity.ts
    line: 42
  evidence_check: verified
  evidence_summary: '`lib/insecurity.ts:42` hardcodes `''pa4qacea4VK9t9nGv7yZtwmj''` as the HMAC-SHA256 key; this same function
    is called at `routes/resetPassword.ts:41` to compare submitted answers to the stored HMAC.'
  evidence_tier: confirmed-exploitable
  impact: Medium
  impact_description: An attacker with a copy of the SecurityAnswer table can verify any candidate answer offline without
    submitting to the rate-limited reset endpoint.
  likelihood: Medium
  local_id: auth-007
  mitigation_title: Move HMAC key to environment variable and replace with bcrypt for security answers
  prior_finding_ref: null
  remediation:
    code_example: '// Before:

      export const hmac = (data: string) => crypto.createHmac(''sha256'', ''pa4qacea4VK9t9nGv7yZtwmj'').update(data).digest(''hex'');


      // After (with bcrypt for answers):

      import bcrypt from ''bcryptjs'';

      export const hashAnswer = (answer: string) => bcrypt.hash(answer.toLowerCase().trim(), 12);

      export const verifyAnswer = (answer: string, stored: string) => bcrypt.compare(answer.toLowerCase().trim(), stored);'
    effort: Medium
    reference: CWE-321
    steps:
    - Replace `'pa4qacea4VK9t9nGv7yZtwmj'` in `lib/insecurity.ts:42` with `process.env.HMAC_SECRET`; fail startup when absent.
    - Preferably, replace HMAC entirely with `bcrypt.hash(answer, 12)` for security answers — bcrypt's work factor makes offline
      dictionary attacks expensive even if the key is leaked.
    - Rotate all stored security answer HMACs on next user interaction by re-hashing on first successful answer comparison.
    verification: Verify the HMAC_SECRET environment variable is required at startup (`unset HMAC_SECRET && node server.js`
      should exit non-zero); confirm `grep pa4qacea4VK9t9nGv7yZtwmj lib/insecurity.ts` returns no output.
  risk: Medium
  scenario: 'The `hmac()` function at `lib/insecurity.ts:42` uses the hardcoded key `''pa4qacea4VK9t9nGv7yZtwmj''` as the
    HMAC-SHA256 secret for all security answers. Because this key is in the public source repository, any attacker can precompute
    the HMAC of candidate answers offline: `crypto.createHmac(''sha256'', ''pa4qacea4VK9t9nGv7yZtwmj'').update(''Samuel'').digest(''hex'')`.
    Comparing the output against the `SecurityAnswer` table (obtainable via SQLi) reveals whether a given answer matches —
    turning the HMAC into an effective lookup table. This removes the main purpose of HMAC as a keyed primitive: without key
    secrecy, it reduces to a simple hash.'
  source: configuration-defect
  stride: Information Disclosure
  threat_category_id: TH-03
  title: Hardcoded HMAC Key for Security Answer Storage (lib/insecurity.ts:42)
