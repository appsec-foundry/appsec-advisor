  - T-039
- id: sqlite-db
  name: SQLite / Sequelize Data Store
  description: Embedded SQLite database accessed through Sequelize ORM. Stores users, products, orders, baskets, addresses,
    payment cards, challenge completion state, and feedback. Also backed by a MarsDB in-memory store for reviews. Runs in
    the same process as api-server.
  paths:
  - models/**
  - data/datacreator.ts
  - data/datacache.ts
  - data/staticData.ts
  tier: data
  complexity: simple
  framework: sequelize
  deployment_zones:
