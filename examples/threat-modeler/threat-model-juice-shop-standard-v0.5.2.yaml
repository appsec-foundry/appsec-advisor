  evidence_summary: '`routes/2fa.ts:16` defines the `verify` handler with no `rateLimit` middleware call; the `totpToken`
    field is validated only for correctness, not for attempt frequency.'
  evidence_tier: confirmed-exploitable
  impact: High
  impact_description: An attacker who intercepts or phishes the `tmpToken` can brute-force the 6-digit TOTP code and complete
    2FA authentication without the victim's authenticator app.
  likelihood: Low
  local_id: auth-011
  mitigation_title: Apply rate limiting to the 2FA verification endpoint
  prior_finding_ref: null
  remediation:
    code_example: null
    effort: Low
    reference: CWE-307
    steps:
    - Apply `express-rate-limit` on `POST /rest/2fa/verify` with a limit of 5 attempts per 5-minute window per IP and per
      `tmpToken` claim.
    - After 5 failed TOTP attempts, invalidate the `tmpToken` so the user must re-authenticate with their password before
      retrying.
    - Add a test that submits 6 incorrect TOTP codes in rapid succession and asserts the 6th returns HTTP 429.
    verification: Submit 6 wrong TOTP codes against `POST /rest/2fa/verify` with the same `tmpToken` within 1 minute and assert
      the 6th response is HTTP 429.
  risk: Medium
  scenario: 'The `verify()` handler at `routes/2fa.ts:16` accepts a `tmpToken` (the intermediate 2FA challenge token issued
    after successful password entry) and a `totpToken` (6-digit TOTP code). There is no rate limiting on this endpoint. A
    TOTP code is 6 decimal digits (10^6 possibilities). With a 30-second validity window and the `epochTolerance: 30` parameter
    at `routes/2fa.ts:31` accepting codes one window before and after, an attacker who obtains a valid `tmpToken` (e.g., via
    phishing or MITM) can automate 1,000,000 requests to brute-force the TOTP token within the validity window — bypassing
