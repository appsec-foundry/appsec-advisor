  - Attacker uses the returned token to perform all authenticated operations as admin.
  evidence_summary: routes/login.ts:34 contains `models.sequelize.query(`SELECT * FROM Users WHERE email = '${req.body.email
    || ''}' AND password = '${security.hash(req.body.password || '')}'`)`. This raw interpolation bypasses Sequelize's parameterized
    binding.
