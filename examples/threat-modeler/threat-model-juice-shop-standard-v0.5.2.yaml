  title: Hardcoded RSA Private Key (lib/insecurity.ts:21)
  scenario: An attacker who obtains the source repository extracts the 1024-bit RSA private key hardcoded at lib/insecurity.ts:21,
    then signs arbitrary JWT payloads with RS256 to impersonate any user account, including administrators, without interacting
    with the authentication endpoint.
  attack_steps:
  - Attacker reads lib/insecurity.ts from the public repository and copies the RSA private key literal starting on line 21.
  - Attacker constructs a JWT payload with an arbitrary userId and role (e.g. admin), signs it with the extracted key using
    RS256.
  - Attacker sends the forged JWT as the Authorization bearer token; lib/insecurity.ts:52 verifies it with the matching public
    key and grants full session access.
  - Attacker issues admin API calls or exports all user data using the impersonated session.
  evidence_summary: lib/insecurity.ts:21 contains the RSA private key literal as a TypeScript string constant `privateKey`.
    The corresponding public key at line 20 is loaded from disk, but the private key is committed to source.
  impact_description: Any entity with repository read access can forge valid JWTs for any user identity, bypassing all JWT-based
    authentication and authorization controls in the application.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — private key is a source-committed string constant.
  mitigation_title: Remove Private Key from Source and Load from Secret Store
  remediation:
    effort: Medium
    steps:
    - Delete the `privateKey` literal from lib/insecurity.ts and load it from `process.env.JWT_PRIVATE_KEY` or a mounted secret
      file at startup; fail startup when absent.
    - Rotate the RSA key pair immediately; revoke all outstanding JWTs by changing the public key reference.
    - Add a CI secret-scanning step (e.g. git-secrets or truffleHog) that fails on RSA key literals in .ts or .js files.
