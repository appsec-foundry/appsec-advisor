assets:
- id: A-001
  name: User Credentials (Email + Password Hash)
  classification: Restricted
  description: User email addresses and bcrypt/MD5 password hashes stored in the SQLite users table. These are the primary
    authentication tokens for the application — compromise enables account takeover for all registered users. No evidence
    of bcrypt usage despite dependency declaration; MD5 or plaintext may be in use per recon.
  linked_threats: []
  evidence_flags:
  - inferred_classification
  - predates_threat_discovery
- id: A-002
  name: JWT Bearer Tokens (Session Tokens)
  classification: Restricted
  description: 'JWT tokens signed with a private key (lib/insecurity.ts) and stored in browser localStorage. Carried in Authorization:
    Bearer headers on every API request. Tokens cannot be revoked server-side — theft persists until natural expiry. Outdated
    jsonwebtoken 0.4.0 library is in use.'
  linked_threats: []
  evidence_flags:
  - predates_threat_discovery
- id: A-003
  name: JWT Signing Key
  classification: Restricted
  description: RSA private key (or HMAC secret) used to sign and verify all application JWTs. Located in lib/insecurity.ts.
    If the key is hardcoded or discoverable, attackers can forge arbitrary admin tokens without authentication. The outdated
    jsonwebtoken library may allow alg:none bypass independently of key compromise.
  linked_threats: []
  evidence_flags:
  - predates_threat_discovery
- id: A-004
  name: User PII (Profile Data, Addresses, Security Answers)
  classification: Confidential
  description: User personal data including full names, email addresses, delivery addresses, and security question answers
    stored across the SQLite users, addresses, and security-answers tables. Accessible via authenticated REST endpoints; IDOR
    on numeric IDs allows cross-user data leakage.
  linked_threats: []
  evidence_flags:
  - predates_threat_discovery
- id: A-005
  name: Order and Basket Data (Financial Records)
  classification: Confidential
  description: Customer basket contents and order history stored in SQLite baskets/basket-items/orders tables. Basket IDs
    are sequential integers (predictable), enabling IDOR access to any user's current order. Order history contains purchase
    records that could reveal user behaviour or purchasing power.
  linked_threats: []
  evidence_flags:
  - predates_threat_discovery
- id: A-006
  name: Product Catalogue and Reviews
  classification: Internal
  description: Product descriptions, pricing, images, and user-submitted reviews stored in SQLite and served via REST API.
    Reviews can contain HTML content rendered with DomSanitizer bypass — stored XSS vector. Product data itself is public
    but admin-modifiable.
  linked_threats: []
  evidence_flags:
  - predates_threat_discovery
- id: A-007
  name: Application Configuration (config/*.yml)
  classification: Confidential
  description: YAML configuration files (config/default.yml, config/ctf.yml, etc.) containing application secrets, chatbot
    LLM endpoint URLs, feature flags, and branding. Some configs include challenge unlock keys. Not stored in the database
    but committed to the public GitHub repository, making their contents attacker-visible.
  linked_threats: []
  evidence_flags:
  - predates_threat_discovery
- id: A-008
  name: Uploaded Files (FTP Directory / File Upload Endpoint)
  classification: Internal
  description: User-uploaded files stored in the ftp/ directory and served statically. The upload endpoint at POST /file-upload
    accepts arbitrary file types with weak validation. Files may include exploit payloads (XXE-laden XMLs, malicious SVGs).
    The ftp/ directory is world-readable via directory listing in challenge scenarios.
  linked_threats: []
  evidence_flags:
  - predates_threat_discovery
- id: A-009
  name: Chat Messages and LLM Interaction Data
  classification: Internal
  description: User chat messages sent to the LLM chatbot via Socket.IO, and LLM-generated responses. Messages are forwarded
    unfiltered to the configurable LLM backend endpoint. Potentially contains sensitive user queries or PII if users disclose
    personal information in chat. LLM response content is not sanitized before rendering.
  linked_threats: []
  evidence_flags:
  - predates_threat_discovery
- id: A-010
  name: CI/CD Secrets and Build Tokens (GitHub Actions)
  classification: Restricted
  description: GITHUB_TOKEN and any repository secrets used by GitHub Actions workflows for package publishing, Docker image
    push, and deployment. Token permissions are overly broad (no per-workflow permission scoping), enabling supply chain attacks
    via malicious workflow code.
  linked_threats: []
  evidence_flags:
  - predates_threat_discovery
- id: A-011
  name: Web3 Wallet Keys and NFT Assets
  classification: Restricted
  description: Ethereum wallet private keys and NFT ownership records used by the web3-nft challenge surface (routes/checkKeys.ts,
    routes/nftMint.ts). Key material may be hardcoded or stored in the application for challenge purposes. Compromise enables
    on-chain asset theft or NFT minting abuse.
  linked_threats: []
  evidence_flags:
  - predates_threat_discovery
