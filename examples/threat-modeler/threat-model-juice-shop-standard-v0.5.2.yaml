  title: Wildcard CORS Allows All Origins (server.ts:183)
  scenario: 'server.ts:182-183 registers `app.options(''*'', cors())` and `app.use(cors())` with no origin configuration.
    Express cors() defaults to Access-Control-Allow-Origin: * and Access-Control-Allow-Credentials is not explicitly set.
    Any attacker-controlled web page can make cross-origin requests to all API endpoints. When a user with an active session
    visits a malicious page, the page sends state-changing requests using ambient browser credentials (JWT cookies).'
  evidence_summary: 'server.ts:182: `app.options(''*'', cors())` and line 183: `app.use(cors())`. A comment on line 181 reads
    ''Bludgeon solution for possible CORS problems: Allow everything!'', confirming the wildcard configuration is intentional.
    No origin allowlist restricts the reflection of caller origins.'
  impact_description: Attacker-controlled page makes credentialed cross-origin requests to perform any action the victim's
    session permits, including order placement, account modification, and data export.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None — all origins are permitted with no restriction.
  mitigation_title: Restrict CORS to an Explicit Allowlisted Origin
