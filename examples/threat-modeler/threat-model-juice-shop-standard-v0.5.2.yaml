tier_root_causes:
  edge:
  - JWT and 2FA tokens in localStorage — reachable by any XSS on the domain
  - Client-side-only route guards allow direct navigation to admin views
  - OAuth implicit flow without state parameter, enabling CSRF and token theft
  - Missing noopener on outbound links enables reverse tabnapping
  - Reflected XSS via unsanitised Angular bindings in product and review fields
  server:
  - Hardcoded RSA private key and HMAC secret committed in source code
  - Raw SQL string interpolation bypasses ORM on login, search, and review paths
  - Missing server-side authorisation on sensitive routes (password reset, data)
  - 'LLM tool agency unbounded: prompt injection escalates to coupon generation'
  - Rate limiting absent or bypassable on auth endpoints via header spoofing
  data:
  - SQLite database file unencrypted at rest, enabling full credential dump
  - Passwords hashed with MD5 without salt, reversible via rainbow tables
  - TOTP secrets and deluxe tokens stored as plaintext string columns
  - Integer auto-increment PKs expose object enumeration across all models
  - No query timeout or statement-level resource limits on SQLite connection
cross_repo_dependencies: []
