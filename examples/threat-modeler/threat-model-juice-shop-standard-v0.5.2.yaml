- id: api-server
  name: Express REST API Backend
  description: Node.js/TypeScript Express application serving REST API routes, WebSocket events (Socket.IO), file uploads,
    and the LLM chat interface. Handles JWT authentication middleware, all business logic, and serves the Angular SPA static
    bundle on port 3000.
