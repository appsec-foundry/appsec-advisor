  cwe: CWE-922
  title: JWT authentication token stored in localStorage XSS-accessible (app.guard.ts:18)
  scenario: Any successful XSS payload (e.g., from angular-spa-004 or angular-spa-005) calls localStorage.getItem('token')
    and exfiltrates the JWT to an attacker-controlled endpoint; the attacker then replays the JWT to authenticate as the victim
    against all API endpoints for the token's remaining lifetime.
  evidence_summary: 'app.guard.ts:18: localStorage.getItem(''token'') is the sole authentication check for LoginGuard. request.interceptor.ts:13-16
    confirms that every outbound API request reads the JWT from localStorage to set the Authorization header — the token lives
    exclusively in localStorage with no HttpOnly cookie protection.'
  impact_description: Every authenticated user's JWT can be stolen by any XSS payload, resulting in full account takeover
    for the JWT's lifetime with no server-side revocation mechanism evidenced.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — the JWT is stored in localStorage (JavaScript-accessible), not in an HttpOnly cookie.
  mitigation_title: Store the JWT in an HttpOnly SameSite=Strict cookie instead of localStorage
  remediation:
    effort: High
    steps:
    - Move JWT storage from localStorage to an HttpOnly SameSite=Strict cookie set by the server on successful login, so JavaScript
      cannot access it.
    - Update the request interceptor to omit the Authorization header (the browser will automatically include the cookie on
      same-site requests).
    - Implement server-side CSRF protection (double-submit cookie or synchronizer token pattern) since the auth credential
      is now cookie-based.
    - Add a test asserting that after login, no token value is present in localStorage and the session is established only
      via the HttpOnly cookie.
