tier_root_causes:
  edge:
  - bypassSecurityTrustHtml sinks disable HTML sanitization in multiple components
  - JWT stored in localStorage, accessible to any XSS payload in the same origin
  - OAuth implicit flow exposes tokens in URL without CSRF state binding
  - Client-side-only route guards bypassed by direct API calls to backend
  - Hardcoded test credentials and predictable OAuth passwords shipped in JS bundle
  server:
  - Raw string interpolation into SQL queries instead of parameterized statements
  - isAuthorized() middleware absent on file-upload, admin, Web3, and chat routes
  - 'Cryptographic secrets hardcoded in source: RSA key, HMAC key, wallet mnemonic'
  - Unvalidated input at API boundaries enables injection, path traversal, and SSRF
  - No rate limits or resource caps on login, reset, LLM, and WebSocket endpoints
  data:
  - Hardcoded admin credentials seeded in committed static data files
  - Unsalted MD5 password hashing offers no resistance to rainbow-table attacks
