  architectural_violation: false
  attack_steps:
  - An attacker obtains a valid JWT (e.g., via the XSS vector at `search-result.component.ts:143`) and decodes it to confirm
    the `role` field.
  - The attacker opens the Juice Shop SPA, sets `localStorage.setItem('token', '<stolen-admin-jwt>')` in DevTools, and navigates
    to `/#/administration`.
  - Angular's `AdminGuard` calls `jwtDecode(token)` on the attacker-supplied value, finds `role === 'admin'`, and returns
    `true`, rendering the admin panel.
  - The attacker has full admin UI access and can call admin API endpoints using the forged or stolen token.
  component_name: Frontend SPA
  controls_in_place: Angular route guards exist client-side. Server-side API endpoints for admin actions may have their own
    auth middleware (outside this component).
  cwe: CWE-602
  evidence:
  - file: frontend/src/app/app.guard.ts
    line: 52
  evidence_check: verified
  evidence_summary: '`app.guard.ts:52` reads the JWT role from localStorage with `jwtDecode()` but performs no signature verification,
    expiry check, or server-side challenge before granting access to `/administration`.'
  evidence_tier: confirmed-exploitable
  impact: High
  impact_description: Any party who can place a valid admin JWT in localStorage — via XSS, token theft, or session fixation
    — bypasses all SPA route guards and accesses the admin panel.
  likelihood: High
  local_id: frontend-spa-013
  mitigation_title: Replace client-side JWT role check with a server-side session-validation API call before rendering protected
    routes
  remediation:
    code_example: "// Before (app.guard.ts:17-20)\ncanActivate () {\n  if (localStorage.getItem('token')) { return true }\n\
      \  ...\n}\n\n// After — verify with server\nasync canActivate (): Promise<boolean> {\n  const me = await this.userService.whoAmI().toPromise()\n\
      \  if (!me || !me.data) { this.forbidRoute(); return false }\n  return true\n}"
    effort: Medium
    reference: CWE-602
    steps:
    - In `LoginGuard.canActivate()`, replace the localStorage token presence check with a call to `/rest/user/whoami` — if
      the server returns 401, the route is blocked regardless of localStorage contents.
    - In `AdminGuard.canActivate()`, verify the role by consuming the `whoami` response (cache it with a short TTL per navigation
      to avoid per-request overhead) rather than decoding the client-held JWT.
    - Move the JWT to an `HttpOnly` cookie (see finding `frontend-spa-010`) so the client cannot read or forge it at all,
      making client-side decoding moot.
    verification: With an expired or invalid JWT in localStorage, navigate to `/#/profile` (LoginGuard-protected) and confirm
      the server returns 401 and the guard redirects to `/403`.
  risk: High
  scenario: The `AdminGuard.canActivate()` at `app.guard.ts:52-54` and `AccountingGuard.canActivate()` at line 65-68 enforce
    role checks by decoding the JWT stored in localStorage client-side using `jwtDecode()` and comparing `payload.data.role`.
    The `LoginGuard` at line 18 only checks whether a token string is present in localStorage (`if (localStorage.getItem('token'))`),
    without verifying the token's signature or expiry. These guards are enforced only in Angular's client-side router — they
    cannot prevent direct API calls, WebSocket events, or any attacker who opens the Angular app with browser developer tools.
    Because the token is stored in localStorage and the guard only reads it without server-side re-validation, a forged, expired,
    or stolen JWT placed in localStorage bypasses every `canActivate` guard. The admin panel route at `/administration` is
    protected only by `AdminGuard`.
  source: stride
  stride: Elevation of Privilege
