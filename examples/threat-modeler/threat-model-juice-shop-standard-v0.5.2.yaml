- local_id: sqlite-db-005
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: Unbounded LIKE wildcard query on attacker-controlled input (routes/search.ts:23)
  scenario: An attacker submits a crafted search string consisting of alternating percent signs and characters up to the 200-character
    limit; SQLite's LIKE pattern matching with leading and trailing wildcards performs a full table scan for each LIKE expression,
    consuming CPU proportional to the table size and causing the API to queue or time out for legitimate requests.
  attack_steps: null
  evidence_summary: routes/search.ts line 21-23 reads req.query.q, truncates at 200 characters, then embeds it verbatim in
    SELECT * FROM Products WHERE ((name LIKE '%<criteria>%' OR description LIKE '%<criteria>%')); no query timeout or result-size
    limit is applied.
  impact_description: Sustained requests with adversarial LIKE patterns exhaust SQLite's CPU budget; because SQLite operates
    in-process with api-server, a blocked query stalls the Node.js event loop, making the entire API unresponsive.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: Input length capped at 200 characters (routes/search.ts:22), but this does not prevent CPU-intensive
    patterns.
  mitigation_title: Apply a query timeout and reject search inputs containing only wildcard characters
  remediation:
    effort: Medium
    steps:
    - Apply a SQLite PRAGMA busy_timeout or use Sequelize query options to set a statement timeout on the search query.
    - Validate the search criteria server-side to reject strings that contain only special characters or produce degenerate
      LIKE patterns (e.g., strings consisting entirely of '%' or '_').
    - Switch the product search to a full-text search index (SQLite FTS5) to avoid per-row LIKE scans.
    code_example: null
    verification: Send GET /rest/products/search?q=%25%25%25%25 in a tight loop; confirm the server returns HTTP 400 or applies
      a timeout and does not become unresponsive to concurrent requests.
    reference: 'CWE-400: Uncontrolled Resource Consumption'
  evidence:
  - file: routes/search.ts
    line: 23
  evidence_check: ambiguous
