- id: angular-spa
  name: Angular Frontend SPA
  description: Angular 18+ single-page application delivering the user-facing shopping and hacking-challenge interface. Runs
    entirely in the browser; communicates with api-server via XHR. Includes intentional XSS sinks (bypassSecurityTrustHtml)
    and window.open calls without noopener as part of security training.
  paths:
  - frontend/src/**
  tier: client
  complexity: complex
  framework: angular
  deployment_zones:
