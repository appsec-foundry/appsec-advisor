- id: M-004
  title: Use parameterized database queries
  threat_ids:
  - T-004
  - T-008
  priority: P1
  severity: Critical
  effort: Low
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Replace raw SQL login query with Sequelize parameterized model lookup
  steps:
  - 'Replace `models.sequelize.query(...)` at `routes/login.ts:34` with `UserModel.findOne({ where: { email: req.body.email,
    password: security.hash(req.body.password), deletedAt: null } })` using Sequelize ORM methods.'
  - Remove the raw SQL string template entirely; Sequelize's `where` clause uses parameterized binding by default.
  - Add an integration test that submits `' OR '1'='1'--` as the email and asserts HTTP 401 is returned.
  - 'Replace the raw `sequelize.query()` call at routes/login.ts:34 with `UserModel.findOne({ where: { email: req.body.email,
    password: security.hash(req.body.password), deletedAt: null } })`.'
  - Upgrade the password hashing algorithm from MD5 to bcrypt or Argon2 (see backend-api-014) — this is a pre-requisite for
    treating the password field as a proper credential.
  - Add express-rate-limit middleware to POST /rest/user/login (see backend-api-016).
  code_example: "// Before (vulnerable):\nawait models.sequelize.query(\n  `SELECT * FROM Users WHERE email = '${req.body.email}'\
    \ AND ...`\n);\n\n// After (safe):\nawait UserModel.findOne({\n  where: { email: req.body.email, password: security.hash(req.body.password),\
    \ deletedAt: null }\n});"
  verification: Submit `POST /rest/user/login` with `{"email":"' OR '1'='1'--","password":"x"}` and assert the response is
    HTTP 401, not a JWT-bearing 200.
  reference: CWE-89
  file: routes/login.ts:34
