  likelihood: High
  local_id: backend-api-017
  mitigation_title: Derive rate-limit key from a verified proxy IP rather than the X-Forwarded-For header
  remediation:
    code_example: "// Before (server.ts:343-347)\napp.use('/rest/user/reset-password', rateLimit({\n  windowMs: 5 * 60 * 1000,\n\
      \  max: 100,\n  keyGenerator ({ headers, ip }) { return headers['X-Forwarded-For'] ?? ip }\n}))\n\n// After — rely on\
      \ req.ip (set correctly by trust proxy config)\napp.use('/rest/user/reset-password', rateLimit({ windowMs: 5 * 60 *\
      \ 1000, max: 100 }))"
    effort: Low
    reference: CWE-290
    steps:
    - Remove the custom `keyGenerator` from the rate limiter at server.ts:346 and rely on `req.ip` instead, which express-rate-limit
      uses by default.
    - 'Configure `trust proxy` only when behind a known reverse proxy, and set it to the proxy''s specific IP rather than
      the global `true` value: `app.set(''trust proxy'', ''10.0.0.1'')`.'
    - If a CDN/proxy injects X-Forwarded-For, validate it at the ingress layer rather than trusting it in application code.
    verification: Send 101 POST /rest/user/reset-password requests while rotating `X-Forwarded-For` values; expect HTTP 429
      once the real source IP limit is reached.
  risk: High
  scenario: 'Server.ts:342 enables `app.enable(''trust proxy'')` and server.ts:346 configures the rate limiter''s `keyGenerator`
    as `({ headers, ip }) => headers[''X-Forwarded-For''] ?? ip`. Express''s `trust proxy` setting causes `req.ip` to be derived
    from the X-Forwarded-For header, which is fully attacker-controlled on any endpoint not behind a verified proxy. An attacker
