- id: M-001
  title: Store session tokens in HttpOnly, Secure cookies
  threat_ids:
  - T-001
  priority: P1
  severity: Critical
  effort: High
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Move session JWT to an HttpOnly Secure cookie via a Backend-for-Frontend and el…
  steps:
  - 'Implement a Backend-for-Frontend (BFF) pattern: the login endpoint sets a `HttpOnly; Secure; SameSite=Strict` cookie
    containing the JWT, never returning the raw token to Angular.'
  - Remove all `localStorage.setItem('token', ...)` calls from `login.component.ts`, `oauth.component.ts`, and any other component;
    the Angular `HttpClient` will send the `HttpOnly` cookie automatically.
  - Replace the `LoginGuard.canActivate()` token-presence check with a lightweight `/rest/user/whoami` call — the cookie is
    the credential, not a value in localStorage.
  - Store the 2FA temp token as a short-lived server-side session attribute (Redis, server-side session store) keyed to a
    non-sensitive session ID, not in localStorage.
  verification: After the fix, open DevTools → Application → localStorage and confirm no `token` or `totp_tmp_token` key is
    present; confirm the session cookie has `HttpOnly` and `Secure` flags visible in DevTools → Application → Cookies.
  reference: CWE-922
  file: frontend/src/app/login/login.component.ts:101
- id: M-002
  title: Add security audit logging
  threat_ids:
  - T-002
  priority: P2
  severity: High
  effort: Low
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Emit structured security events on every authentication outcome
  steps:
  - 'Add a security logger (e.g., `winston` with a dedicated transport) that records at minimum: `timestamp`, `event_type`
    (login_success, login_failure, 2fa_success, 2fa_failure, password_reset), `userId` or `email`, `ip`, `user_agent`.'
  - In `routes/login.ts`, log inside both the success path (`afterLogin`) and the `else if (!user.data?.id)` failure branch
    at line 50.
  - In `routes/resetPassword.ts`, log on success at line 43 and on wrong-answer failure at line 49.
  - Route the security log to an append-only sink (separate file, SIEM, or remote log service) distinct from the application
    debug log.
  code_example: "// In routes/login.ts afterLogin:\nsecurityLogger.info({\n  event: 'login_success', userId: user.id,\n  ip:\
    \ req.ip, ua: req.headers['user-agent'], ts: new Date().toISOString()\n});"
  verification: Perform a successful login followed by a failed login; assert the security log contains two events with the
    correct `event_type` values and no sensitive fields (password, token).
  reference: CWE-778
  file: routes/login.ts:48
- id: M-003
