    scenario: An attacker submits the correct private key to `POST /rest/web3/submitKey`. The `checkKeys` handler at `routes/checkKeys.ts:6-32`
      derives wallet credentials, compares them, awards the challenge, and responds — but logs nothing. There is no record
      of which IP or authenticated user submitted the correct key, at what time, or how many failed attempts preceded success.
      If the wallet private key were to be used for on-chain activity shortly after submission, operators cannot correlate
      the submission event with subsequent blockchain transactions to investigate whether the application was used as a stepping
      stone.
