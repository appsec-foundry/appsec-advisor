    local_id: auth-009
    scenario: None of the authentication route handlers — `routes/login.ts`, `routes/2fa.ts`, `routes/resetPassword.ts` —
      emit a structured security event when authentication succeeds or fails, when a 2FA challenge is attempted, or when a
      password reset is completed. An attacker who successfully authenticates via SQL injection (`auth-001`) or forges a JWT
      (`auth-002`) leaves no record in any log. Incident response teams investigating a breach cannot determine when admin
      credentials were first abused, which accounts were accessed, or how many failed attempts preceded a successful compromise.
      This absence also prevents anomaly detection (e.g., alerting on repeated failed logins for one account).
