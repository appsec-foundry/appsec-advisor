  - T-046
  - T-051
- id: backend-api
  name: Backend API (Express + Socket.IO)
  description: Node.js 24 / Express 4 monolithic application server handling all REST endpoints (authentication, products,
    basket, orders, user management, file upload, B2B API), real-time Socket.IO WebSocket connections (chat, notifications,
    order updates), and static file serving. Implements JWT issuance and validation via jsonwebtoken 0.4.0 / express-jwt 0.1.3.
    Initialised in server.ts, entrypoint app.ts.
