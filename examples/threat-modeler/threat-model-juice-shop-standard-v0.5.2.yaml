  title: Hardcoded HD wallet mnemonic phrase (routes/checkKeys.ts:10)
  scenario: Attacker reads routes/checkKeys.ts from the repository and extracts the 12-word BIP-39 mnemonic at line 10; derives
    the HD wallet private key, public key, and address offline using ethers.js; submits the derived private key to POST /rest/web3/submitKey;
    and subsequently uses the private key to sign arbitrary Ethereum transactions from this wallet address.
  attack_steps:
  - Attacker reads routes/checkKeys.ts from the public source repository and copies the mnemonic phrase at line 10.
  - Attacker runs HDNodeWallet.fromPhrase(mnemonic).privateKey locally, deriving the full private key without any server interaction.
  - Attacker submits the derived private key to POST /rest/web3/submitKey, passing the challenge check at line 16.
  - Attacker imports the private key into MetaMask or a local wallet, controlling any ETH and tokens held by the derived address
    on any Ethereum network.
  evidence_summary: Line 10 commits a 12-word mnemonic in plaintext; line 11 calls HDNodeWallet.fromPhrase(mnemonic) at runtime
    confirming the mnemonic is the sole controlling secret; lines 12-14 derive private key, public key, and address from it.
  impact_description: 'Full HD wallet compromise: attacker can derive the private key and sign any Ethereum transaction from
    this wallet, draining all ETH and ERC-20 tokens held by the derived address on any network where the wallet is used.'
  likelihood: High
  impact: Critical
