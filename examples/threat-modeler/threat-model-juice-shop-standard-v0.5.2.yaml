  evidence:
  - file: lib/insecurity.ts
    line: 150
  evidence_check: verified
  evidence_summary: '`lib/insecurity.ts:150` calls `crypto.createHmac(''sha256'', privateKey)` where `privateKey` is the publicly
    committed literal from line 21; the result of `deluxeToken(email)` is checkable offline by any reader of the source.'
  evidence_tier: confirmed-exploitable
  impact: Medium
  impact_description: Any attacker with the public source repository can generate a valid deluxe-tier JWT for their account,
    gaining deluxe-tier pricing and access without a subscription.
  likelihood: High
  local_id: auth-012
  mitigation_title: Rotate the private key and derive deluxe tokens from a separate, server-side secret
  prior_finding_ref: null
  remediation:
    code_example: "// Before:\nexport const deluxeToken = (email: string) => {\n  const hmac = crypto.createHmac('sha256',\
      \ privateKey);\n  return hmac.update(email + roles.deluxe).digest('hex');\n};\n\n// After: derive from a separate secret\n\
      export const deluxeToken = (email: string) => {\n  const secret = process.env.DELUXE_TOKEN_SECRET;\n  if (!secret) throw\
      \ new Error('DELUXE_TOKEN_SECRET is required');\n  return crypto.createHmac('sha256', secret).update(email + roles.deluxe).digest('hex');\n\
      };"
    effort: Medium
    reference: CWE-321
    steps:
    - Remove the hardcoded `privateKey` (covered in auth-002 remediation) — rotating the key also invalidates all existing
      `deluxeToken` values.
    - Store the deluxe-token derivation secret separately from the JWT signing key in `process.env.DELUXE_TOKEN_SECRET`.
    - Replace the `deluxeToken(email)` computation with a server-side lookup in the `Orders` or `DeluxeSubscriptions` table,
      removing the need for a client-verifiable HMAC at all.
    verification: Using the old private key, compute a deluxe token and include it in a forged JWT; assert the `isDeluxe()`
      check returns false after the key is rotated.
  risk: High
  scenario: 'The `deluxeToken()` function at `lib/insecurity.ts:149-152` computes `HMAC-SHA256(email + ''deluxe'', privateKey)`
    using the same RSA private key string committed at line 21. The `isDeluxe()` check at line 167 accepts a JWT with `role:
    ''deluxe''` only when the JWT''s `deluxeToken` claim equals `deluxeToken(email)`. Because the private key is publicly
    committed to the repository, an attacker can: (1) compute a valid `deluxeToken` for their own email using the known key,
