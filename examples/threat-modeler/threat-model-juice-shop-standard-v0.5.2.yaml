  evidence_summary: routes/changePassword.ts:14 reads password parameters from req.query (HTTP GET), causing them to appear
    in Morgan access logs; line 39 conditionally skips current-password verification when the `current` param is absent.
  evidence_tier: confirmed-exploitable
  impact: Medium
  impact_description: Server access logs contain plaintext passwords, exposing credentials to anyone with log access. A session-hijacked
    or stolen JWT also allows password reset without knowledge of the current password.
  likelihood: Medium
  local_id: backend-api-011
  mitigation_title: Move password change to POST with body parameters and enforce current-password verification
  remediation:
    code_example: "// Before (routes/changePassword.ts:13-14)\nreturn async ({ query, headers, connection }: Request, res:\
      \ Response, next: NextFunction) => {\n  const currentPassword = query.current as string\n\n// After — use POST body\n\
      return async ({ body, headers, connection }: Request, res: Response, next: NextFunction) => {\n  const currentPassword\
      \ = body.current as string\n  if (!currentPassword) { res.status(400).send('Current password required'); return }\n\
      \  // … then always enforce the hash check"
    effort: Low
    reference: CWE-598
    steps:
    - Re-register the endpoint as `POST /rest/user/change-password` and move `currentPassword`, `newPassword`, and `repeatPassword`
      from `req.query` to `req.body`.
    - 'Make current-password verification unconditional: remove the `if (currentPassword && ...)` guard and always require
      a matching current password before accepting the change.'
    - Add security.isAuthorized() middleware to the endpoint in server.ts to enforce JWT-level authentication.
    verification: Send `GET /rest/user/change-password?current=x&new=y&repeat=y` after the fix; expect HTTP 404 or 405 (method
      not allowed). Confirm no password values appear in access.log.
  risk: Medium
  scenario: The password change endpoint is registered as `GET /rest/user/change-password` at server.ts:597. The handler at
    routes/changePassword.ts:14 reads `current`, `new`, and `repeat` from `req.query`. Morgan logging (server.ts:338) records
    every request in 'combined' format including the full URL. A user changing their password via the Angular frontend sends
    `GET /rest/user/change-password?current=OldSecret123&new=NewSecret456&repeat=NewSecret456` — the complete old and new
    passwords appear in cleartext in `logs/access.log.YYYY-MM-DD`. Any operator, log aggregation system, or attacker who gains
    access to these logs obtains the plaintext credentials. Additionally, when `current` is omitted from the request, the
    handler at line 39 skips the current-password verification step entirely, allowing any holder of a valid JWT to change
    the account password without knowing the original.
