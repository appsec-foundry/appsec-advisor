  threat_category_id: TH-10
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-522
  title: OAuth-derived password deterministically derivable from user email
  scenario: The Juice Shop OAuth flow derives each user's local account password as btoa(email.split('').reverse().join(''));
    any attacker who knows a victim's email address can compute this password offline and authenticate directly via the /rest/user/login
    endpoint, bypassing the OAuth provider's MFA or session controls entirely.
  attack_steps:
  - Attacker learns victim's email address (e.g., from order confirmation, public profile, or account enumeration).
  - Attacker computes password = btoa(email.split('').reverse().join('')) in a browser console — takes under one second.
  - Attacker sends a direct POST to /rest/user/login with the computed credentials and receives a valid JWT.
  - Attacker is authenticated as the victim with full account access, without triggering any OAuth provider controls.
  evidence_summary: 'oauth.component.ts:30: const password = btoa(profile.email.split('''').reverse().join('''')) — the derived
    password is a deterministic, reversible Base64 encoding of the reversed email, not a cryptographically random value. The
    same formula is used at line 31 (save) and line 46 (login), confirming it is the stable credential for all OAuth-created
    accounts.'
  impact_description: Any user account created via Google OAuth can be compromised by an attacker who knows the email address,
    enabling full account takeover without any OAuth provider interaction.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — the formula is embedded in the shipped JavaScript bundle and trivially reversible.
  mitigation_title: Replace email-derived password with a CSPRNG-generated credential in oauth.component.ts
  remediation:
    effort: Medium
    steps:
    - Replace the btoa derivation with a server-side OAuth account creation flow that generates a cryptographically random
      password (crypto.getRandomValues or equivalent) and stores only its bcrypt hash — never returning it to the client.
    - On subsequent OAuth logins, skip local password verification entirely and rely on the validated OAuth access_token as
      the authentication credential.
    - Remove the local password-based login path for OAuth-created accounts (or mark them with a flag the server checks to
      reject direct password logins).
    code_example: null
    verification: Create an account via Google OAuth; attempt to log in via POST /rest/user/login with btoa(email.split('').reverse().join(''))
      as password; confirm the response is HTTP 401.
    reference: OWASP ASVS v4.0 V2.1.1 – Password requirements (minimum entropy)
