  title: CI/CD Workflow Token Permissions Not Restricted
  scenario: ci.yml declares no top-level permissions block, so every job inherits the repository-default GITHUB_TOKEN scope;
    on a repository with legacy defaults this is read-write for contents, packages, and deployments. A step compromised through
    an unpinned action (ci-cd-pipeline-001 or ci-cd-pipeline-002) can write to the repository, create releases, or push packages
    without any scope restriction from the workflow definition.
  attack_steps:
  - Attacker exploits ci-cd-pipeline-001 to inject malicious code into a CI step that runs with the unrestricted GITHUB_TOKEN.
  - Malicious step uses the token to call the GitHub API and push a commit or create a release to the repository, bypassing
    branch protection if the token scope allows it.
