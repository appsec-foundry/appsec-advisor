  evidence_check: verified
  evidence_summary: grep for `permissions:` across .github/workflows/ returns only 3 of 14 workflow files; ci.yml, image_actions.yml,
    release.yml, and 8 others carry no explicit permissions block.
  evidence_tier: confirmed-exploitable
  impact: High
  impact_description: A CI runner compromise in any of the 11 unscoped workflows escalates directly to full repository write
    access — commit forgery, release artifact tampering, package publication — without additional privilege exploitation.
  likelihood: Medium
  local_id: ci-cd-pipeline-003
  mitigation_title: Add least-privilege permissions blocks to all 11 workflows lacking explicit GITHUB_TOKEN scopes
  prior_finding_ref: null
  remediation:
    code_example: "# ci.yml — add at the top level (after 'on:', before 'env:'):\npermissions:\n  contents: read\n\n# release.yml\
      \ — narrowed to only what publishing requires:\npermissions:\n  contents: write\n  packages: write"
    effort: Low
    reference: CWE-284
    steps:
    - 'Set the repository default to read-only: Settings → Actions → General → Workflow permissions → select ''Read repository
      contents and packages''.'
    - 'Add an explicit `permissions:` block at the top of each of the 11 workflows. Use `permissions: contents: read` as the
      safe baseline for test workflows, then grant only the scopes the workflow actually uses.'
    - 'For release.yml (publishes packages and containers), scope to `contents: write, packages: write` only.'
    - 'For ci.yml''s heroku job, use `permissions: contents: read` since it only deploys and does not write to the repository.'
    - Verify with `grep -rL 'permissions:' .github/workflows/*.yml` after the change; expected output is empty.
    verification: After adding blocks, run `grep -rL 'permissions:' .github/workflows/*.yml` and confirm zero results. Trigger
      a test workflow and verify the GITHUB_TOKEN's effective scopes match only the declared permissions via the Actions run
      log.
  risk: High
  scenario: Eleven GitHub Actions workflows lack an explicit `permissions:` block at the workflow or job level. When no permissions
    block is declared, the GITHUB_TOKEN inherits the repository's default permission policy. If the repository uses GitHub's
    default of read-and-write permissions, every workflow without a declared permissions block operates with broad write access
    to contents, packages, deployments, issues, pull-requests, and other scopes. A successful compromise of any of these 11
    workflows — via a malicious unpinned action (ci-cd-pipeline-002) or the Heroku curl installer (ci-cd-pipeline-001) — immediately
    grants full repository write access without requiring any additional privilege escalation. Only codeql-analysis.yml, pr-compliance.yml,
