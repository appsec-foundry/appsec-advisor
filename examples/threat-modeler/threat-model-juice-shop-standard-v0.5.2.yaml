- local_id: api-server-002
  threat_category_id: TH-02
  additional_categories: []
  stride: Spoofing
  cwe: CWE-347
  title: JWT Algorithm Confusion via Missing Algorithms Allowlist (lib/insecurity.ts:52)
  scenario: 'lib/insecurity.ts:52 calls `expressJwt({secret: publicKey})` without an `algorithms` parameter. An attacker obtains
    the RSA public key (served or embedded in the bundle), constructs a JWT with `alg: HS256`, and signs it with the public
    key bytes as the HMAC secret. express-jwt accepts this token because without an algorithms allowlist it verifies HS256
    with the `secret` value, which equals the attacker-supplied HMAC key.'
  attack_steps:
  - Attacker retrieves the RSA public key from `encryptionkeys/jwt.pub` or extracts it from the source.
  - 'Attacker crafts a JWT header with `alg: HS256` and an arbitrary payload (e.g. admin userId), then signs using the public
    key bytes as the HMAC-SHA256 secret.'
  - Attacker presents the forged token; `isAuthorized()` at lib/insecurity.ts:52 verifies it successfully because express-jwt
    checks HS256 with `publicKey` as the secret.
  - Attacker gains an authenticated session with attacker-chosen identity and roles.
  evidence_summary: 'lib/insecurity.ts:52 exports `isAuthorized` as `expressJwt({secret: publicKey} as any)`. The `as any`
    cast suppresses the TypeScript algorithms requirement, and no explicit algorithms list is passed, enabling RS256→HS256
    algorithm confusion.'
  impact_description: Attacker forges a valid JWT for any identity without the private key, bypassing all session authentication.
  likelihood: Medium
  impact: Critical
  risk: Critical
  controls_in_place: None — no algorithms allowlist constrains acceptable JWT signature algorithms.
  mitigation_title: Enforce algorithms Allowlist in expressJwt Configuration
  remediation:
    effort: Low
    steps:
    - 'Change lib/insecurity.ts:52 to `expressJwt({ secret: publicKey, algorithms: [''RS256''] })` and remove the `as any`
      cast.'
    - Apply the same fix to `updateAuthenticatedUsers` at lib/insecurity.ts:189 which calls `jwt.verify(token, publicKey,
      ...)` without an algorithms option.
    - Add a unit test that presents an HS256-signed token to `isAuthorized()` and expects a 401 response.
    code_example: null
    verification: 'Send `Authorization: Bearer <HS256-signed token with publicKey as secret>` to a protected route and verify
      a 401 Unauthorized response with `UnauthorizedError`.'
    reference: https://auth0.com/blog/critical-vulnerabilities-in-json-web-token-libraries/
