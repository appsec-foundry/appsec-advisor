- id: M-001
  title: Move cryptographic keys to a managed secret store
  threat_ids:
  - T-001
  priority: P1
  severity: Critical
  effort: Medium
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Remove Private Key from Source and Load from Secret Store
  steps:
  - Delete the `privateKey` literal from lib/insecurity.ts and load it from `process.env.JWT_PRIVATE_KEY` or a mounted secret
    file at startup; fail startup when absent.
  - Rotate the RSA key pair immediately; revoke all outstanding JWTs by changing the public key reference.
  - Add a CI secret-scanning step (e.g. git-secrets or truffleHog) that fails on RSA key literals in .ts or .js files.
  verification: Run `grep -r 'BEGIN RSA PRIVATE KEY' lib/ routes/ server.ts` in CI and assert zero matches; also confirm startup
    fails when JWT_PRIVATE_KEY is unset.
  reference: 'CWE-321: https://cwe.mitre.org/data/definitions/321.html'
  file: lib/insecurity.ts:21
