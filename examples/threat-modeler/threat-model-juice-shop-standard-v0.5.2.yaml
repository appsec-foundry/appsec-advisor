      DataTypes.UUIDV4`; this eliminates sequential enumeration at the schema level.'
    - In the Sequelize model-route middleware or individual route handlers for `/api/Users/:id`, `/rest/basket/:id`, and order
      endpoints, add a `WHERE userId = req.user.id` scope (or use Sequelize scopes) so a user can only access their own records.
