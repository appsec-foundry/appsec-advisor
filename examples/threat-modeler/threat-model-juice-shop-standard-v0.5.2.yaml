security_controls:
- domain: Identity and Authentication Controls
  control: Password-Based Authentication
  kind: mechanism
  effectiveness: Unsafe
  assessment: 'Login route POST /rest/user/login exists (routes/login.ts) but password verification uses MD5 (lib/insecurity.ts:41:
    crypto.createHash(''md5'')) — a fast, broken hash. No bcrypt, scrypt, Argon2, or PBKDF2 present. No rate limiting on the
    login route itself (server.ts:596 adds no rateLimit middleware before login()). Brute-force and rainbow-table attacks
    are trivially fast.'
  rule_id: ARCH-AUTHN-001
  linked_threats: []
- domain: Identity and Authentication Controls
  control: Social Login Adapter (OAuth)
  kind: mechanism
  effectiveness: Unsafe
  assessment: Google OAuth 2.0 implemented as a frontend-only implicit flow (login.component.ts:148 — response_type=token).
    The OAuth 2.0 implicit flow is deprecated per RFC 9700. No `state` parameter is generated or validated, exposing the callback
    to CSRF/replay. The access_token is extracted from the URL fragment (app.routing.ts:286) and stored in localStorage. No
    PKCE, no server-side authorization-code exchange, no audience validation.
  linked_threats: []
- domain: Identity and Authentication Controls
  control: Multi-Factor Authentication (TOTP)
  kind: mechanism
  effectiveness: Partial
  assessment: TOTP is implemented via otplib 13.4.0 (routes/2fa.ts). The enrollment and verification flows exist, but the
    temporary TOTP state token is stored in browser localStorage during the MFA challenge step — readable by any XSS payload.
    No observed server-side lockout after repeated TOTP failures.
  linked_threats: []
- domain: Identity and Authentication Controls
  control: Authentication Rate Limiting
  kind: primitive
  effectiveness: Partial
  assessment: express-rate-limit 7.5.1 is installed and applied to /rest/user/reset-password (server.ts:343) and a few OTP
    endpoints (server.ts:459,466,472). However, the primary login endpoint POST /rest/user/login (server.ts:596) has no rate-limit
    middleware — unlimited brute-force attempts are possible.
  rule_id: ARCH-AUTHN-001
  linked_threats: []
- domain: Session and Token Controls
  control: Session Token Signing (JWT Based)
  kind: lifecycle
  effectiveness: Unsafe
  assessment: JWT signing uses jsonwebtoken 0.4.0 (released 2014). This ancient version allows algorithm confusion attacks
    including alg:none bypass. The RSA private key used to sign all tokens is hardcoded as a plaintext string literal in lib/insecurity.ts
    (deliberately vulnerable by design). Any attacker with access to the public repository can extract the private key and
    forge arbitrary admin JWTs.
  rule_id: ARCH-JWT-001
  linked_threats: []
- domain: Session and Token Controls
  control: Session Token Storage (Browser localStorage)
  kind: lifecycle
  effectiveness: Weak
  assessment: Bearer JWT is stored in browser localStorage (request.interceptor.ts, login.component.ts) — accessible to any
    JavaScript executing on the page. 36 findings of localStorage.getItem('token') calls across frontend components. HttpOnly
    cookies are not used, making XSS → token theft the primary session compromise path.
  linked_threats: []
- domain: Session and Token Controls
  control: Session Token Revocation
  kind: lifecycle
  effectiveness: Missing
  assessment: Logout is implemented by client-side localStorage.removeItem('token') only. No server-side token blocklist,
    no JWT revocation list, no session invalidation endpoint. A stolen JWT remains valid until its exp claim lapses regardless
    of logout.
  linked_threats: []
- domain: Session and Token Controls
  control: Session Token Expiry
  kind: lifecycle
  effectiveness: Partial
  assessment: JWTs carry an exp claim set at issuance. However, no idle-timeout enforcement was observed — a token remains
    valid for its full lifetime even during extended inactivity. express-jwt 0.1.3 validates exp on protected routes, but
    the library version (2016) predates several security fixes.
  linked_threats: []
- domain: Authorization Controls
  control: Centralized Authorization Policy
  kind: mechanism
  effectiveness: Weak
  assessment: Authorization is applied ad-hoc per route without a centralized policy engine. Architecture coverage detected
    19+ sensitive PUT/DELETE routes with authz=unknown (server.ts:370–634). Angular route guards (AdminGuard, AccountingGuard)
    check the JWT role client-side without server re-validation — a client-side bypass renders them ineffective.
  rule_id: ARCH-AUTHZ-001
  linked_threats: []
- domain: Authorization Controls
  control: Object-Level Ownership Check
  kind: primitive
  effectiveness: Missing
  assessment: No ownership or tenant-scoping guard is applied to object-addressed routes. Basket, order, address, and feedback
    endpoints use auto-increment integer IDs (/rest/basket/:id, /api/BasketItems/:id) without verifying that the authenticated
    user owns the refe**** (10 chars) object. Classic IDOR/BOLA surface.
  rule_id: ARCH-BOLA-001
  linked_threats: []
- domain: Authorization Controls
  control: Management Endpoint Protection
  kind: primitive
  effectiveness: Partial
  assessment: Admin-specific routes like GET /rest/admin/application-version and GET /rest/admin/application-configuration
    (server.ts:606-607) are reachable with authn=unknown signal. Some admin endpoints appear unguarded. The metrics endpoint
    GET /metrics has two registrations — one public and one conditionally admin-gated depending on config.
  rule_id: ARCH-MGMT-001
  linked_threats: []
- domain: Query Construction and Data Access Controls
  control: ORM / Parameterized Queries (Sequelize)
  kind: primitive
  effectiveness: Partial
  assessment: Sequelize ORM 6.37.3 is the primary data access layer and handles most queries safely. However, raw template-literal
    interpolation into query strings exists in at least one search route (routes/search or equivalent), enabling SQL injection
    for that path. The ORM's safe defaults do not protect against explicitly raw queries.
  rule_id: ARCH-SQLI-001
  linked_threats: []
- domain: Input Boundary Validation Controls
  control: Validation Approach
  kind: primitive
  effectiveness: Weak
  assessment: 'No centralized validation framework or request-schema middleware is applied across the API surface. Validation
    is scattered ad-hoc: trim() calls on a few fields (server.ts:411-413), URL normalization regex (server.ts:204), and some
    Sequelize model-level constraints. zod 4.4.3 is a dependency but is not observed in use for API request validation.'
  rule_id: ARCH-INPUT-001
  linked_threats: []
- domain: Input Boundary Validation Controls
  control: File Upload Constraints
  kind: primitive
  effectiveness: Partial
  assessment: File uploads are handled by multer 1.4.5-lts.1 and content-type checked by file-type 16.5.4. However, file size
    limits are not explicitly configured, archive extraction via unzipper 0.12.3 does not validate for zip-slip path traversal,
    and the XML parser (libxml2-wasm) configuration for XXE hardening is not confirmed.
  linked_threats: []
- domain: Output Encoding and Rendering Controls
  control: Template Sanitization (Angular)
  kind: primitive
  effectiveness: Weak
  assessment: Angular 21's DomSanitizer provides XSS protection by default. However, protection is explicitly disabled in
    15+ component files via DomSanitizer.bypassSecurityTrustHtml() applied to user-controlled inputs (about.component.ts:119,
    search-result.component.ts:110, 143, administration.component.ts:73, 91, last-login-ip.component.ts:39, etc.). snarkdown()
    rendering of hint text creates an additional innerHTML sink (hacking-instructor/index.ts:126).
  rule_id: ARCH-XSS-001
  linked_threats: []
- domain: Output Encoding and Rendering Controls
  control: sanitize-html Library
  kind: primitive
  effectiveness: Weak
  assessment: sanitize-html 1.4.2 (2019) is present as a dependency. This version predates multiple XSS bypass patches in
    the sanitize-html 2.x series. Usage scope not confirmed from recon — if applied to user-generated content it provides
    partial protection only.
  linked_threats: []
- domain: Browser and Cross-Origin Controls
  control: CORS Policy
  kind: primitive
  effectiveness: Weak
  assessment: 'CORS is configured with open defaults: app.use(cors()) with no origin allowlist (server.ts:182-183). This reflects
    any Origin header without validation. Combined with JWT in localStorage and Bearer token auth, cross-origin requests from
    attacker-controlled pages can leverage ambient tokens if the user visits a malicious site.'
  rule_id: ARCH-CORS-001
  linked_threats: []
- domain: Browser and Cross-Origin Controls
  control: CSRF Protection
  kind: primitive
  effectiveness: Missing
  assessment: No CSRF token generation or validation was observed for state-changing endpoints. The application relies entirely
    on Bearer token auth in the Authorization header (which CORS should block for cross-origin requests) but the wide-open
    CORS configuration undermines this defense. No SameSite cookie policy since sessions use localStorage, not cookies.
  linked_threats: []
- domain: Browser and Cross-Origin Controls
  control: Security Headers (Helmet)
  kind: primitive
  effectiveness: Partial
  assessment: Helmet 4.6.0 (May 2021) is enabled, providing X-Content-Type-Options and X-Frame-Options by default. However,
    helmet 4.x does not enable HSTS or CSP by default, and explicit configuration of these headers was not confirmed. The
    aging version lacks defaults added in helmet 5+/6+ (Cross-Origin policies, Permissions-Policy).
  linked_threats: []
- domain: Browser and Cross-Origin Controls
  control: Content Security Policy
  kind: primitive
  effectiveness: Partial
  assessment: A CSP header reference was found at routes/userProfile.ts:95 suggesting CSP is configured for at least one route.
    However, a site-wide CSP via helmet.contentSecurityPolicy() was not confirmed from recon. Without a consistent CSP, XSS
    mitigations from the sanitization layer are not defense-in-depth.
  linked_threats: []
- domain: Cryptography Secrets and Data Protection
  control: Password Hashing
  kind: primitive
  effectiveness: Unsafe
  assessment: 'Passwords are hashed with MD5: crypto.createHash(''md5'').update(data).digest(''hex'') at lib/insecurity.ts:41.
    MD5 is a fast, broken hash algorithm — no salt, no work factor, rainbow tables and GPU cracking trivially recover passwords.
    bcrypt, scrypt, Argon2, and PBKDF2 are all absent from the dependency tree.'
  linked_threats: []
- domain: Cryptography Secrets and Data Protection
  control: Managed Secret Storage
  kind: primitive
  effectiveness: Missing
  assessment: The RSA private key used to sign all JWT sessions is hardcoded as a plaintext PEM string in lib/insecurity.ts:21.
    A BIP-39 blockchain mnemonic phrase is hardcoded in routes/checkKeys.ts:10. No secrets manager (Vault, AWS SSM, Azure
    Key Vault, env injection at deploy) is configured. These secrets are permanently exposed in the public repository.
  rule_id: ARCH-SECRET-001
  linked_threats: []
- domain: Cryptography Secrets and Data Protection
  control: Transport Encryption
  kind: primitive
  effectiveness: Partial
  assessment: The application binds HTTP only (config/default.yml port 3000, no TLS config in server.ts). TLS is assumed to
    be terminated externally at a reverse proxy or cloud load balancer. No HSTS header is set by the application itself. The
    SQLite connection is in-process and inherits filesystem-level controls; LLM backend call uses the configurable URL (default
    http://localhost:11434/v1 — plaintext).
  rule_id: ARCH-TLS-001
  linked_threats: []
- domain: File Parser and Outbound Request Controls
  control: Archive Extraction (unzipper)
  kind: primitive
  effectiveness: Partial
  assessment: unzipper 0.12.3 is used for zip file handling. No explicit path traversal (zip-slip) guard was confirmed in
