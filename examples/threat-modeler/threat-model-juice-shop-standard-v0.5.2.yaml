  component_name: Web3 / Wallet / NFT Surface
  controls_in_place: None — no authentication, no rate limiting, no Set size cap on any web3 state endpoint.
  cvss_v4:
    vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N
    base_score: 8.7
    severity: High
    source: stride-analyzer
  cwe: CWE-400
  evidence:
  - file: routes/web3Wallet.ts
    line: 16
  evidence_check: verified
  evidence_summary: '`routes/web3Wallet.ts:16` calls `walletsConnected.add(metamaskAddress)` unconditionally before any validation
    or rate check; the Set at line 10 has no capacity limit.'
  evidence_tier: confirmed-exploitable
  impact: High
  impact_description: An attacker can exhaust server heap memory by flooding `/rest/web3/walletExploitAddress` with distinct
    wallet addresses, crashing the Node.js process and taking down the application.
  likelihood: Medium
  local_id: web3-nft-005
  mitigation_title: Cap in-memory Set size and apply rate limiting to unauthenticated web3 endpoints
  remediation:
    code_example: '// Before (routes/web3Wallet.ts:15-16):

      const metamaskAddress = req.body.walletAddress

      walletsConnected.add(metamaskAddress)


      // After:

      const metamaskAddress = req.body.walletAddress

      if (!isAddress(metamaskAddress)) return res.status(400).json({ error: ''Invalid address'' })

      if (walletsConnected.size < 10000) walletsConnected.add(metamaskAddress)'
    effort: Low
    reference: CWE-400
    steps:
    - Apply `express-rate-limit` middleware to all `/rest/web3/*` routes, limiting each IP to a reasonable request rate (e.g.,
      10 requests per minute).
    - 'Add a maximum size guard before adding to `walletsConnected`: `if (walletsConnected.size < MAX_TRACKED_WALLETS) walletsConnected.add(metamaskAddress)`
      where `MAX_TRACKED_WALLETS` is a configurable constant (e.g., 10 000).'
    - Move `walletsConnected.add(metamaskAddress)` to inside the `try` block, after validating that `metamaskAddress` is a
      valid Ethereum address via `ethers.isAddress()`.
    verification: Send 20 000 POST requests with distinct addresses to `/rest/web3/walletExploitAddress`; server heap usage
      must remain bounded and the endpoint must begin returning 429 after the rate limit is reached.
  risk: Medium
  scenario: An attacker sends high-volume POST requests to `/rest/web3/walletExploitAddress` — which has no authentication
    or rate limiting. At `routes/web3Wallet.ts:16`, each request adds `req.body.walletAddress` to the module-global `walletsConnected`
    Set before the try block. Since Ethereum addresses are strings and differ per request (e.g., sequential hex strings),
    each request adds a new entry to the Set. Over time the Set grows unboundedly, consuming heap memory until the Node.js
    process is killed by the OS or crashes with OOM. The same pattern exists in `routes/nftMint.ts:10` (`addressesMinted`)
    but requires an on-chain event to populate, making it less directly exploitable.
  source: stride
