  title: Mutable-tag GitHub Actions (.github/workflows/image_actions.yml:33)
  scenario: An attacker who compromises the calibreapp GitHub account re-tags the @main branch of calibreapp/image-actions
    to a malicious workflow action; the next image-change trigger on the public repository downloads and executes attacker-controlled
    code inside the CI runner, which holds secrets.GITHUB_TOKEN, enabling repo write operations or token exfiltration.
  attack_steps:
  - Attacker compromises calibreapp GitHub organization credentials and force-pushes a malicious action implementation to
    the @main branch of calibreapp/image-actions.
  - Any maintainer commit touching an image file triggers image_actions.yml, which fetches calibreapp/image-actions@main and
    receives secrets.GITHUB_TOKEN at line 35.
  - Malicious action reads GITHUB_TOKEN from the action environment and uses the GitHub API to push a backdoored commit or
    create a release on behalf of the project.
  - Compromise is not detected until the malicious action code is noticed in the calibreapp repository, after arbitrary writes
    have already occurred.
  evidence_summary: image_actions.yml line 33 uses calibreapp/image-actions@main (fully mutable floating tag); line 30 uses
    actions/checkout@v6 and line 42 uses peter-evans/create-pull-request@v8 — all three are tag-resolved at runtime with no
    SHA pin preventing substitution.
  impact_description: Arbitrary code runs in the CI runner with GITHUB_TOKEN write access; attacker can push commits, create
    PRs, or publish release artifacts as the project identity.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Workflow restricted to same-repo PRs only (image_actions.yml lines 24-27 checks github.event.pull_request.head.repo.full_name
    == github.repository); does not prevent action-repo compromise.
  mitigation_title: Pin all GitHub Actions to commit SHA in image_actions.yml
  remediation:
    effort: Low
    steps:
    - Replace @v6, @main, and @v8 tags on actions/checkout, calibreapp/image-actions, and peter-evans/create-pull-request
      with their current 40-character SHA-256 commit hashes.
    - Enable Dependabot or Renovate with `github-actions` ecosystem scanning to automatically open PRs when SHA-pinned actions
      have upstream releases.
    code_example: null
