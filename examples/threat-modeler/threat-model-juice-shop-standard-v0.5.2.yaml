assets:
- id: A-001
  name: User Account Credentials
  classification: Confidential
  description: Email addresses, usernames, and password hashes stored in the users table (SQLite). Intentionally stored without
    bcrypt as a training exercise, making them recoverable from DB dumps. Also includes 2FA secrets (otplib) and security
    question answers.
  linked_threats: []
  evidence_flags: []
- id: A-002
  name: Payment Card Records
  classification: Restricted
  description: Card numbers (masked), expiry dates, and billing addresses stored in the cards table via models/card.ts. Accessible
    to any authenticated user who knows or can enumerate the card ID due to missing per-object authorization checks.
  linked_threats: []
  evidence_flags: []
- id: A-003
  name: JWT Signing Secret
  classification: Confidential
  description: The HMAC secret used to sign and verify JWT session tokens via jsonwebtoken v0.4.0. Hardcoded or ephemeral
    depending on configuration; compromise allows forging arbitrary user sessions including admin tokens.
  linked_threats: []
  evidence_flags: []
- id: A-004
  name: User Order and Basket History
  classification: Confidential
  description: Shopping basket contents, order history, and checkout records stored in baskets and basketitems tables. Exposed
    via /rest/basket/:id with missing per-user authorization, allowing cross-user basket access.
  linked_threats: []
  evidence_flags: []
- id: A-005
  name: User Delivery Addresses
  classification: Confidential
  description: Physical delivery addresses linked to user accounts, stored in the addresses table via models/address.ts. Subject
    to missing per-object authorization on PUT and DELETE operations.
  linked_threats: []
  evidence_flags: []
- id: A-006
  name: Product Catalog and Pricing
  classification: Internal
  description: Product names, descriptions, prices, and quantities managed via the Products and Quantitys API endpoints. Admin-only
    mutation (PUT/DELETE) is unenforced at the authorization layer, allowing any authenticated user to alter product data.
  linked_threats: []
  evidence_flags: []
- id: A-007
  name: Application Configuration
  classification: Internal
  description: Runtime configuration loaded from config/default.yml controlling port, database path, feature flags, challenge
    difficulty, and branding. Exposed partially via /rest/admin/application-configuration (unauthenticated GET).
  linked_threats: []
  evidence_flags: []
- id: A-008
  name: Challenge State and Progress Data
  classification: Internal
  description: Hacking challenge completion flags, continue-codes, and scoring data stored in the challenges table. Continue-code
    endpoints lack authentication, enabling arbitrary challenge completion via code submission.
  linked_threats: []
  evidence_flags: []
- id: A-009
  name: User-Uploaded Profile Images and Memories
  classification: Internal
  description: Profile images and memory files uploaded by users via /profile/image/file and /rest/memories. Upload endpoints
    lack authentication checks; file type validation is intentionally weak as a training exercise for unrestricted file upload
    vulnerabilities.
  linked_threats: []
  evidence_flags: []
attack_surface:
- entry_point: POST /file-upload
  protocol: HTTP
  auth_required: false
  notes: Unauthenticated file upload to server filesystem; primary unrestricted file upload attack surface.
  relevance_tags:
  - missing-auth
- entry_point: POST /profile/image/file
  protocol: HTTP
  auth_required: false
  notes: Unauthenticated profile image file upload path; file type validation is intentionally weak.
  relevance_tags:
  - missing-auth
- entry_point: POST /profile/image/url
  protocol: HTTP
  auth_required: false
  notes: Unauthenticated profile image URL fetch; SSRF risk via user-supplied URL.
  relevance_tags:
  - missing-auth
- entry_point: POST /rest/memories
  protocol: HTTP
  auth_required: false
  notes: Unauthenticated POST to /rest/memories; allows anonymous content injection.
  relevance_tags:
  - missing-auth
