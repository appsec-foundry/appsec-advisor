  title: Cross-Site Scripting (XSS)
  scenario: An attacker with access to a product creation or update API endpoint injects an HTML payload into a product description;
    when any user performs a search, trustProductDescription() calls bypassSecurityTrustHtml() on all API-returned descriptions,
    rendering the payload as live HTML and executing the attacker's script in the victim's browser session.
  attack_steps:
  - Attacker injects a script payload into a product description via the product API (e.g., PUT /api/Products/:id).
  - A logged-in user searches for products; search-result.component.ts:110 applies bypassSecurityTrustHtml to every description
    in the response.
  - The injected script executes in the victim's DOM and reads localStorage.getItem('token') to exfiltrate the JWT to an attacker-controlled
    endpoint.
  - Attacker authenticates as the victim using the stolen JWT.
  evidence_summary: 'search-result.component.ts:110: tableData[i].description = this.sanitizer.bypassSecurityTrustHtml(tableData[i].description)
    — Angular''s sanitizer is explicitly disabled for every product description returned by the API. The vuln-code-snippet
    annotation confirms this is an intentional XSS training sink.'
  impact_description: Attacker executes arbitrary JavaScript in every searching user's browser session, stealing JWT tokens
    stored in localStorage and performing actions as the victim.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Angular default template auto-escape is present but explicitly bypassed at this location.
  mitigation_title: Remove bypassSecurityTrustHtml from trustProductDescription and sanitize server-side before storage
  remediation:
