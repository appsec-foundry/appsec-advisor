security_controls:
- domain: Identity and Authentication Controls
  control: JWT Signing Key Management
  effectiveness: Unsafe
  kind: primitive
  rule_id: ARCH-JWT-001
  assessment: RSA private key assigned as a string literal at lib/insecurity.ts:21 in a public repository. Any actor with
    read access to the repository can extract the key and forge arbitrary JWT tokens for any user identity. No algorithm whitelist
    is confirmed in source; the verify call may accept 'none' or HS256 downgrade attacks.
  implementation: lib/insecurity.ts:21 — const privateKey = '----**** (31 chars)...'
  status_note: Private key is committed in source; any repo reader can forge sessions.
- domain: Identity and Authentication Controls
  control: Route Authentication Middleware
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-AUTHN-001
  assessment: 'security.isAuthorized() middleware is applied to many routes (server.ts:309, 356, 641, 644) but multiple state-changing
    routes have authn=unknown at analysis time: POST /file-upload, POST /profile/image/file, POST /profile/image/url, POST
    /rest/memories (server.ts:309-312), POST /api/Feedbacks (server.ts:406), GET /rest/admin/application-version and GET /rest/admin/application-configuration
    (server.ts:606-607), PUT /rest/continue-code-findIt/apply/:continueCode (server.ts:612). These routes accept unauthenticated
    requests.'
  implementation: lib/insecurity.ts — security.isAuthorized(); server.ts — route registration
- domain: Identity and Authentication Controls
  control: OAuth Credential Derivation
  effectiveness: Unsafe
  kind: mechanism
  assessment: OAuth credential derivation in auth-guard uses reversible base64 encoding rather than a proper authorization-code+PKCE
    flow. Base64 is not a security primitive; any actor who observes or intercepts the encoded value can recover the underlying
    credential without any secret.
  implementation: frontend/src/app/oauth/ — credential derivation from OAuth response via reversible base64
- domain: Authorization Controls
  control: Object-Level Ownership Check (BOLA/IDOR)
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: 'Multiple object-addressing routes have authentication middleware present but no confirmed per-object ownership
    check: GET/PUT/DELETE /api/Recycles/:id (server.ts:388-390), PUT /api/BasketItems/:id (server.ts:426), DELETE /api/Quantitys/:id
    (server.ts:429), PUT /api/Feedbacks/:id (server.ts:433), PUT /api/Cards/:id (server.ts:440), DELETE /api/Cards/:id (server.ts:441),
    PUT /api/Addresss/:id (server.ts:450-451). Authenticated users may access other users'' objects.'
  implementation: server.ts — Sequelize CRUD routes with :id parameters
- domain: Authorization Controls
  control: Centralized Authorization Policy
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-AUTHZ-001
  assessment: Authorization is applied inconsistently across routes. Admin-only operations such as PUT/DELETE /api/Products/:id
    (server.ts:370-371), PUT /rest/wallet/balance (server.ts:627), PATCH /rest/products/reviews (server.ts:634), and PUT /rest/order-history/:id/delivery-status
    (server.ts:625) show authz=unknown. No centralized policy enforcer (RBAC middleware or attribute-based check) is evidenced
    covering all routes.
  implementation: server.ts — per-route inline checks; no central policy middleware found
- domain: Authorization Controls
  control: Management Endpoint Protection
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-MGMT-001
  assessment: GET /rest/admin/application-version (server.ts:606) and GET /rest/admin/application-configuration (server.ts:607)
    expose application metadata and configuration. Authentication signal is unknown at analysis time, meaning these endpoints
    may be accessible without credentials.
  implementation: server.ts:606-607 — admin REST endpoints
- domain: Input Handling Controls
  control: Schema / Allowlist Input Validation
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-INPUT-001
  assessment: No centralized schema validation framework (e.g. Joi, express-validator) is evidenced. Validation consists of
    trim() calls on registration fields (server.ts:411-413) and regex path normalization (server.ts:204, 246). Upload endpoints,
    URL-fetch endpoints, and body fields passed to SQL or shell are not validated against an allowlist before reaching business
    logic.
  implementation: server.ts:204, 246, 411-413 — ad-hoc sanitization; no schema validator library found
- domain: Input Handling Controls
  control: Output Encoding / Angular Template Autoescape
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-XSS-001
  assessment: 'Angular''s DomSanitizer.bypassSecurityTrustHtml() is called with user-controlled values in at least eight component
    locations: feedbacks (about.component.ts:119), last-login IP (last-login-ip.component.ts:39), user email in admin view
    (administration.component.ts:73), admin feedback (administration.component.ts:91), captcha image (data-export.component.ts:57),
    product description (search-result.component.ts:110), search query (search-result.component.ts:143), and order ID (track-result.component.ts:48).
    These calls explicitly disable Angular''s sanitization and allow arbitrary HTML/script injection from server-returned
    or URL-supplied data.'
  implementation: frontend/src/app/*/bypassSecurityTrustHtml calls (8 locations across 5 components)
  status_note: Autoescape deliberately bypassed at 8 sinks; stored and reflected XSS are trivially exploitable.
- domain: Input Handling Controls
  control: Parameterized Database Access
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-SQLI-001
  assessment: Sequelize ORM with model-method parameterized queries is confirmed for primary CRUD operations (models/user.ts,
    models/card.ts — tb-4). However, raw string interpolation is present in route error messages (routes/vulnCodeSnippet.ts:46)
    and template literals are used in other contexts. Routes that use Sequelize.query() with raw SQL or sequelize.literal()
    may bypass parameterization; these must be audited individually.
  implementation: models/*.ts — Sequelize model methods; routes/vulnCodeSnippet.ts:46 — raw interpolation in error path
- domain: Session and Token Management
  control: JWT Token Storage
  effectiveness: Unsafe
  kind: mechanism
  assessment: JWT tokens are stored in browser localStorage per the auth-guard component design (HTTP interceptor attaches
    them to outgoing requests). localStorage is accessible to any JavaScript running in the page origin, so any of the evidenced
    bypassSecurityTrustHtml XSS sinks can directly read and exfiltrate the token without additional exploit steps.
  implementation: frontend/src/app/app.guard.ts — localStorage token storage and HTTP interceptor attachment
- domain: Session and Token Management
  control: Client-Side Route Guards
  effectiveness: Weak
  kind: mechanism
  assessment: LoginGuard and AdminGuard enforce navigation restrictions in the Angular router (frontend/src/app/app.guard.ts).
    These guards protect the UI only; they are bypassed entirely by direct API calls. Any authorization decision they implement
    is not enforced server-side and provides no security guarantee.
  implementation: frontend/src/app/app.guard.ts — LoginGuard, AdminGuard
- domain: Cryptography and Secrets
  control: Managed Secret Storage
  effectiveness: Unsafe
  kind: primitive
  rule_id: ARCH-SECRET-001
  assessment: 'At least two high-value secrets are committed in source: (1) RSA private key for JWT signing at lib/insecurity.ts:21
    — a full PEM block assigned to a constant in the public repository; (2) BIP-39 crypto wallet mnemonic at routes/checkKeys.ts:10
    — ''purpose betray marriage blame crunch monitor spin slide donate sport lift clutch''. Neither secret is injected at
    runtime from an external store; both are recoverable by any repository reader.'
  implementation: lib/insecurity.ts:21 — JWT RSA private key literal; routes/checkKeys.ts:10 — wallet mnemonic literal
  status_note: Two committed secrets (JWT signing key, wallet mnemonic) are recoverable from public source.
- domain: Transport Security
  control: Transport Encryption (TLS)
  effectiveness: Partial
  kind: surface
  rule_id: ARCH-TLS-001
  assessment: The Express application binds to HTTP on port 3000 with no TLS configuration in source. No TLS terminator is
    declared through required startup configuration. TLS may be applied by an upstream reverse proxy in deployment, but this
    is not confirmed from repository evidence. Credentials, JWT tokens, and sensitive data cross the network in cleartext
    when deployed without an external terminator.
  implementation: server.ts — http.createServer() / express on port 3000; no https.createServer() or TLS cert config found
- domain: Transport Security
  control: CORS Policy
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-CORS-001
  assessment: The Socket.IO server is constructed with a CORS origin hardcoded to 'http://localhost:4200' (lib/startup/registerWebsocketEvents.ts:20),
    which is a development origin rather than a configurable production value. The Express REST API CORS policy is not confirmed
    from source. A localhost-only CORS allowlist blocks cross-origin browser requests but does not substitute for server-side
    authentication, which is separately evidenced as absent on the WebSocket channel.
  implementation: 'lib/startup/registerWebsocketEvents.ts:20 — new Server(server, { cors: { origin: ''http://localhost:4200''
    } })'
- domain: Trust-Boundary Enforcement
  control: WebSocket Authentication
  effectiveness: Weak
  kind: mechanism
  assessment: The Socket.IO server registers io.on('connection', ...) with no io.use() authentication middleware anywhere
    in the handler chain (lib/startup/registerWebsocketEvents.ts). socket.handshake.auth, socket.handshake.headers.authorization,
    and query-token checks are absent. Any client that can reach port 3000 and upgrade to WebSocket can receive real-time
    event data without presenting credentials.
  implementation: lib/startup/registerWebsocketEvents.ts:20-23 — io.on('connection') with no preceding io.use() auth middleware
  status_note: WebSocket channel has no server-side authentication; unauthenticated clients receive live events.
- domain: Trust-Boundary Enforcement
