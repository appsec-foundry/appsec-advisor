    effort: Low
    reference: CWE-290
    steps:
    - Replace the unconditional `req.headers['true-client-ip']` read with a check that only trusts the header when the request
      source (`req.socket.remoteAddress`) matches a configured trusted-proxy CIDR allowlist.
    - Fall back to `utils.toSimpleIpAddress(req.socket.remoteAddress)` for all other requests.
    - Apply the same pattern to any other forwarding headers (`X-Forwarded-For`, `X-Real-IP`) consumed elsewhere in the codebase.
    verification: 'Send a login request with `True-Client-IP: 1.2.3.4` from an untrusted source and verify `lastLoginIp` in
      the database reflects the actual socket address, not `1.2.3.4`.'
  risk: Medium
  scenario: 'After a successful login, the handler at `routes/saveLoginIp.ts:18` stores `req.headers[''true-client-ip'']`
    directly as the user''s `lastLoginIp` in the `Users` table. No proxy whitelist or validation is applied — any HTTP client
    can include `True-Client-IP: <arbitrary string>` and have it written to the database. An attacker can set this header
    to an arbitrary value (e.g., a colleague''s office IP, `127.0.0.1`, or an XSS payload) to corrupt the stored login origin.
