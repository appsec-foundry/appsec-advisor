- local_id: realtime-channel-005
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: Unbounded WebSocket Connection Fan-Out (registerWebsocketEvents.ts:29)
  scenario: An attacker opens a large number of concurrent WebSocket connections to port 3000; each new connection triggers
    notifications.forEach at line 29, emitting one socket.emit call per stored notification, exhausting file descriptors and
    I/O throughput for legitimate users.
  evidence_summary: io.on('connection') at line 23 has no connection limit or rate-limiting middleware; each accepted connection
    immediately executes notifications.forEach at line 29 which performs O(N) emissions; no admission control or per-IP connection
    cap is present in the file or evidenced in the controls context.
  impact_description: An attacker flooding the server with WebSocket connections causes unbounded fan-out of notification
    emissions per connection, exhausting server I/O and degrading or denying WebSocket service to legitimate users.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None
  mitigation_title: Enforce per-IP connection rate limiting in the io.use() middleware layer
  remediation:
    effort: Medium
    steps:
    - Add an io.use() middleware that enforces a per-IP connection rate limit (e.g., using socket.io's built-in adapter or
      an external rate-limiter) before accepting the WebSocket upgrade.
    - Set a maximum concurrent connection count per IP and reject excess connections with a 429-equivalent Socket.IO error.
    - Write a test that simulates rapid connection attempts from one IP and asserts that connections beyond the threshold
      are rejected.
    code_example: null
    verification: null
    reference: 'CWE-400: https://cwe.mitre.org/data/definitions/400.html'
  evidence:
  - file: lib/startup/registerWebsocketEvents.ts
    line: 29
  evidence_check: verified
