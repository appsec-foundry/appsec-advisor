  risk: High
  scenario: 'All core models — User, Basket, BasketItem, Order, Address, Card — define their primary key as `DataTypes.INTEGER,
    autoIncrement: true`, as seen in `models/user.ts:39-43`. Auto-increment integers are trivially enumerable: an authenticated
    attacker who knows their own user ID (returned in the JWT payload) can iterate adjacent integer IDs to access records
