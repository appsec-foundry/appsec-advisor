trust_boundaries:
- name: 'Internet to REST API: security.isAuthorized() middleware'
  kind: network
  assumption: Every state-changing route is registered behind security.isAuthorized().
  evidence:
  - file: server.ts
    line: 309
  - file: server.ts
    line: 356
  - file: lib/startup/registerWebsocketEvents.ts
    line: 1
  - file: server.ts
    line: 641
  - file: server.ts
    line: 644
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: api-server
  enforcement_point: security.isAuthorized() middleware
  assumption_legs:
  - leg: validation
    condition: Every request body and path parameter is schema-checked before it reaches business logic.
  - leg: authentication
    condition: Every state-changing route is registered behind security.isAuthorized() before the route handler fires.
  - leg: authorization
    condition: Every object reference is checked against the authenticated subject before access is granted.
  surface: network
  transition: []
  covers_components:
  - api-server
  - realtime-channel
  - web3-nft
  id: tb-1
  assumption_verdict: refuted
