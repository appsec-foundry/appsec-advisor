    before any user login occurs. Any visitor — including unauthenticated users — has an active Socket.IO connection to the
    server. The `search-result.component.ts:141` emits the `verifyLocalXssChallenge` event on that socket to signal the server,
    which means an unauthenticated attacker can send arbitrary named events to the server. If the server trusts socket events
