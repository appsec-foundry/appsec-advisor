      { auth: { token: localStorage.getItem(''token'') } })`.'
    - On the server, add a Socket.IO middleware that validates the `auth.token` JWT before accepting the connection, and reject
      connections with no or invalid tokens.
    verification: Connect to the Socket.IO endpoint without a token (e.g., using a raw `socket.io-client` script outside the
      SPA) and confirm the server responds with a connection error or closes the socket immediately.
  risk: Medium
  scenario: 'The `SocketIoService` constructor at `socket-io.service.ts:22` calls `io(window.location.origin, { path: ...
