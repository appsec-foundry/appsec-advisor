  mitigation_title: Accept True-Client-IP only when the request originates from a trusted reverse proxy
  prior_finding_ref: null
  remediation:
    code_example: 'const TRUSTED_PROXIES = (process.env.TRUSTED_PROXIES ?? '''').split('','');

      const isTrustedProxy = TRUSTED_PROXIES.some(cidr => req.socket.remoteAddress?.startsWith(cidr));

