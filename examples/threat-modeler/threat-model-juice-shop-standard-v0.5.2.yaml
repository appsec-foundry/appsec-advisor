  controls_in_place: The tmpToken is a short-lived RS256 JWT with a `type` claim (`password_valid_needs_second_factor_token`)
    that restricts its use to the 2FA verify endpoint.
  cwe: CWE-522
  evidence:
  - file: routes/login.ts
    line: 41
  evidence_check: verified
  evidence_summary: '`routes/login.ts:41` returns the `tmpToken` as a signed JWT in the HTTP response body for the client
    to store; the CONTROLS section confirms it is stored in `localStorage`, where JavaScript can read it.'
  evidence_tier: confirmed-exploitable
  impact: Medium
  impact_description: An XSS payload executing during the 2FA challenge window can steal the intermediate token and use it
    to complete the 2FA challenge, bypassing the second factor.
  likelihood: Medium
  local_id: auth-013
  mitigation_title: Store the 2FA intermediate token in an HttpOnly session cookie, not localStorage
  prior_finding_ref: null
  remediation:
    code_example: null
    effort: Medium
    reference: CWE-522
    steps:
    - Replace the `tmpToken` in the JSON response body with a server-side session identifier (e.g., a signed `HttpOnly`, `Secure`,
      `SameSite=Strict` cookie) that maps to the pending 2FA state.
    - The `POST /rest/2fa/verify` endpoint reads the pending state from the server-side session, not from a client-supplied
      token.
    - As an interim measure, shorten the tmpToken lifetime to 2 minutes (instead of the default 6 hours inherited from `security.authorize()`)
      to limit the attack window.
    verification: Complete the password step and inspect browser localStorage; assert no JWT-shaped value is stored after
      the 2FA prompt appears.
  risk: Medium
  scenario: 'When a user with 2FA enabled completes the password step, `routes/login.ts:38-44` returns HTTP 401 with body
    `{ status: ''totp_token_required'', data: { tmpToken: <signed JWT> } }`. The frontend stores this `tmpToken` in `localStorage`
    during the 2FA challenge step (per CONTROLS: ''TOTP temp token stored in localStorage during challenge step''). Any XSS
    payload executed in the browser during this window can read the token from `localStorage` and present it to `POST /rest/2fa/verify`
    paired with a brute-forced TOTP code (see auth-011). The design couples two weaknesses: client-side storage of a server-issued
    token and no rate limit on verification.'
  source: stride
  stride: Information Disclosure
  threat_category_id: TH-02
  title: MFA Intermediate Token Returned for Client-Side Storage (routes/login.ts:41)
