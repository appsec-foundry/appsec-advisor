- id: llm-chat-service
  name: LLM Chatbot Service
  description: 'Chat feature implemented in backend/routes/chat.ts using Vercel AI SDK (ai 6.0.116) with @ai-sdk/openai-compatible
    provider. Accepts user messages via Socket.IO ''chat:send'' events, forwards them unfiltered to a configurable OpenAI-compatible
    LLM endpoint (default: http://localhost:11434/v1 for Ollama), and streams responses back. No prompt injection filtering
    or output validation observed.'
