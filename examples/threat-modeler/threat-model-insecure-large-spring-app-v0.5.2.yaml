threats:
- local_id: crypto-api-005
  threat_category_id: TH-09
  additional_categories:
  - Elevation of Privilege
  stride: Information Disclosure
  cwe: CWE-306
  title: Missing Authentication on Sensitive Data Endpoints
  scenario: GET /api/legacy-crypto/credentials is permitted without authentication (SecurityConfig.java:46); the handler at
    CustomCryptoController.java:40-47 calls VaultCredentialRepository.findAll() and, for every record, maps username, the
    raw ciphertext secret, and the HomegrownCipher-decoded plaintext password (via recoverPassword()) into the JSON response,
    disclosing every stored credential in cleartext to any unauthenticated caller.
  attack_steps:
  - Attacker confirms /api/legacy-crypto/** is unauthenticated via SecurityConfig.java:46 and sends GET /api/legacy-crypto/credentials
    to the server without providing any credentials.
  - Server calls VaultCredentialRepository.findAll() and streams all vault records through recoverPassword(); attacker receives
    a JSON array containing every username with its decoded plaintext secret.
  evidence_summary: CustomCryptoController.java:41 calls vaultCredentialRepository.findAll() inside a GET handler with no
    @PreAuthorize or security annotation; line 45 calls customCryptoService.recoverPassword() to include the XOR-decoded plaintext
    secret in the response; SecurityConfig.java:46 explicitly permits /api/legacy-crypto/** without authentication.
  impact_description: Every vault credential stored in the database, including its decoded plaintext secret, is returned to
    any unauthenticated caller, enabling complete credential theft from the vault.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: VaultCredentialRepository uses Spring Data JPA parameterized methods (prevents SQL injection; does not
    restrict data access to authenticated callers)
  mitigation_title: Require authentication and remove plaintext secret exposure in CustomCryptoController credentials endpoint
  remediation:
    effort: Low
    steps:
    - Add @PreAuthorize('hasRole(ROLE_ADMIN)') to the credentials() handler and remove the /api/legacy-crypto/** permit-all
      rule from SecurityConfig.java:46; remove the 'recovered' field from the response map at line 45 so decoded secrets are
      never returned over the API.
