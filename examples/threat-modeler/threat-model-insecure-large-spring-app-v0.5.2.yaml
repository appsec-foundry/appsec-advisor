tier_root_causes:
  server:
  - Security filter chain overuses permitAll on dangerous and privileged routes
  - Secrets and credentials hardcoded in source, config, and container image layers
  - Untrusted input concatenated into SQL, shell, path, XML, and URL sinks
  - Hand-rolled or cryptographically weak tokens replace vetted auth mechanisms
  - Authorization decided from client-supplied JWT claims without server-side lookup
