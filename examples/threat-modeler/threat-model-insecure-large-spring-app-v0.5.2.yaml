  cwe: CWE-916
  title: MD5 used for password hashing in registration (LegacyPasswordService.java:15)
  scenario: RegistrationController.register() at line 55 calls legacyPasswordService.hashForAudit(password) to hash the password
    before storing it in the AppUser entity. LegacyPasswordService.hashForAudit() at line 15 uses MessageDigest.getInstance("MD5")
    — an unsalted MD5 hash. MD5 is cryptographically broken, produces a 128-bit output trivially reversed by rainbow tables,
    and runs in nanoseconds on a GPU, enabling offline brute-force of the entire user password database from a single database
    compromise.
  attack_steps: null
  evidence_summary: LegacyPasswordService.java line 15 explicitly selects MD5 via MessageDigest.getInstance("MD5") with no
    salt, and the result is persisted as the AppUser password field at RegistrationController line 52-58.
  impact_description: An attacker who reads the AppUser table (via SQL injection or database compromise) can reverse all MD5
    hashes using publicly available rainbow tables or GPU cracking in minutes, recovering all user passwords.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Spring Security PasswordEncoder (BCrypt) is used for the in-memory UserDetailsManager (SecurityConfig
    line 132); the AppUser entity uses MD5 via a separate service
  mitigation_title: Replace MD5 in LegacyPasswordService with BCryptPasswordEncoder or Argon2
  remediation:
    effort: Medium
    steps:
    - In RegistrationController.register(), replace legacyPasswordService.hashForAudit(password) with passwordEncoder.encode(password)
      (the BCryptPasswordEncoder already configured in SecurityConfig).
    - Remove or repurpose LegacyPasswordService to avoid MD5 use for any credential storage; if retained for non-security
      audit purposes, add a Javadoc warning that it must not be used for credential storage.
    - 'Migrate existing AppUser rows: on next login, compare the submitted password to the stored MD5 for one-time migration
      and immediately re-hash with BCrypt.'
    - Add a test that registers a user, reads the AppUser.password field, and asserts it starts with '$2a$' (BCrypt prefix)
      not a 32-char hex string.
    code_example: null
    verification: Register a new user, query AppUser where username=<new_user>, and confirm the password column value starts
      with '$2a$' rather than a 32-character hex string.
    reference: 'CWE-916: https://cwe.mitre.org/data/definitions/916.html'
