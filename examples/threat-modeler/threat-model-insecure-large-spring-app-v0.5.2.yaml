  stride: Spoofing
  cwe: CWE-347
  title: Algorithm none JWT accepted via parseClaimsJwt (LegacyJwtVerifier.java:17)
  scenario: An anonymous attacker constructs a JWT with alg=none and an arbitrary role=ADMIN claim in the body, submits it
    to the publicly accessible GET /api/legacy-admin/audit?token= endpoint. LegacyJwtVerifier.readClaims() calls Jwts.parseClaimsJwt()
    which parses unsigned JWTs without any key or algorithm verification, returning attacker-controlled claims. The role check
    at LegacyAdminAuditController line 41 passes, disclosing all user accounts, emails, admin flags, and aggregate record
    counts.
  attack_steps:
  - Attacker constructs a JWT with header {alg:none} and body {sub:attacker,role:ADMIN}, base64url-encodes each part, appends
    an empty signature segment, and joins them with dots.
  - Attacker sends GET /api/legacy-admin/audit?token=<forged_jwt> to the publicly reachable endpoint (SecurityConfig line
    39 permits all requests).
  - LegacyJwtVerifier.readClaims() at line 15-17 calls Jwts.parserBuilder().build().parseClaimsJwt(token) which accepts the
    unsigned token and returns the attacker-supplied claims map.
  - Role claim evaluates to ADMIN at LegacyAdminAuditController line 41; the response includes all user records (id, username,
    email, role, admin flag) and aggregate order and document counts.
  evidence_summary: parseClaimsJwt() at line 17 is the JJWT method for unsigned JWTs; Jwts.parserBuilder().build() without
    a signing key configured accepts alg=none tokens, enabling arbitrary claim injection.
  impact_description: Full user directory (usernames, emails, admin status) disclosed to unauthenticated attacker; ADMIN role
    forged without valid credentials, bypassing all application authorization checks downstream.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — LegacyJwtVerifier uses parseClaimsJwt (unsigned) not parseClaimsJws (signed); no algorithm allowlist
    or key configured
  mitigation_title: Replace parseClaimsJwt with parseClaimsJws and enforce HS256 algorithm allowlist in LegacyJwtVerifier
  remediation:
    effort: Low
    steps:
    - Replace Jwts.parserBuilder().build().parseClaimsJwt(token) with Jwts.parserBuilder().setSigningKey(secretKey).requireAlgorithm(SignatureAlgorithm.HS256).build().parseClaimsJws(token)
      using a stable externally configured secret.
    - Add a unit test that submits a JWT with alg=none and asserts that readClaims() throws JwtException.
    - If this path is deprecated and unsupported, remove LegacyJwtVerifier entirely and migrate LegacyAdminAuditController
      to use SignedJwtService.verify().
    code_example: null
    verification: Submit curl -s 'http://localhost:8080/api/legacy-admin/audit?token=eyJhbGciOiJub25lIn0.eyJyb2xlIjoiQURNSU4ifQ.'
      and confirm the response is 401 or 403, not a user listing.
    reference: 'CWE-347: https://cwe.mitre.org/data/definitions/347.html'
