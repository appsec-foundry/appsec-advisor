security_controls:
- domain: Identity and Authentication Controls
  control: Spring Security Form Login and HTTP Basic Authentication
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-AUTHN-001
  assessment: 'Spring Security form-login and HTTP Basic are wired in SecurityConfig.java:50-61 and delegate to an InMemoryUserDetailsManager
    with BCrypt-encoded passwords. The control is functional for those paths but incomplete: all 14 seeded accounts share
    the literal password ''password'' (SecurityConfig.java:72-127), creating a trivially guessable shared credential. No rate
    limiting or account-lockout mechanism is present on /login. HTTP Basic over unencrypted HTTP (port 8080, no TLS configured)
    exposes credentials in transit.'
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
  status_note: Functional credential verification via BCrypt; defeated in practice by hardcoded shared passwords and absent
    rate limiting.
- domain: Identity and Authentication Controls
  control: Signed JWT Authentication (HS256)
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: 'SignedJwtService.java issues and verifies HS256 JWTs using a key generated by Keys.secretKeyFor(). The algorithm
    is whitelisted during verify() (line 38). However the signing key is ephemeral: generated in a field initializer at startup,
    so it is unique per JVM instance and all issued tokens are invalidated on restart. No expiry refresh or key-rotation mechanism
    is present. The 15-minute expiry (line 28) is correctly short.'
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/SignedJwtService.java
  status_note: Algorithm whitelist enforced; key is ephemeral and lost on restart, invalidating all sessions.
- domain: Identity and Authentication Controls
  control: Legacy JWT Acceptance (unsigned tokens)
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: LegacyJwtVerifier.readClaims() calls Jwts.parserBuilder().build().parseClaimsJwt() (line 16), which parses unsigned
    (alg=none) JWTs without requiring a signature. Any caller can forge arbitrary claims including roles and subject by constructing
    a plaintext JWT. This is an active, relied-upon path exposed through the AuthController.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/LegacyJwtVerifier.java
  status_note: 'Defeated: accepts unsigned JWTs, allowing arbitrary claim forgery.'
- domain: Identity and Authentication Controls
  control: Homegrown Session Token
  effectiveness: Unsafe
  kind: mechanism
  assessment: HomegrownSessionService.issueToken() encodes the numeric user ID as Base64 (line 21). The token carries no signature,
    HMAC, or entropy. Any caller who knows or guesses a user ID can forge a valid session token for that user. resolve() decodes
    the token and looks up the user by the decoded ID with no integrity check.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/HomegrownSessionService.java
  status_note: 'Defeated: token is Base64-encoded user ID with no integrity protection, trivially forgeable.'
- domain: Identity and Authentication Controls
  control: Credential Logging
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'CredentialLoggingFilter.doFilterInternal() logs the plaintext username and password from every POST /login
    request at INFO level (line 25: ''log.info("Processing sign-in for username={} password={}", username, password)''). Any
    log aggregation, SIEM, or stdout capture receives cleartext credentials for all login attempts.'
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/CredentialLoggingFilter.java
  status_note: 'Defeated: plaintext credentials written to application logs on every login attempt.'
- domain: Identity and Authentication Controls
  control: Legacy SQLite Credential Store
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'LegacySqliteUserStore seeds three accounts at startup with cleartext passwords stored directly in the legacy_users
    table (line 37-39: passwords ''password'' and ''admin''). The authenticate() method compares the submitted password against
    the stored cleartext value. The SQLite file is written to the runtime/ directory with no access controls enforced by the
    application.'
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteUserStore.java
  status_note: 'Defeated: credentials stored and compared in cleartext; fixed weak default passwords seeded at startup.'
- domain: Session and Token Management
  control: CSRF Protection
  effectiveness: Unsafe
  kind: mechanism
  assessment: SecurityConfig.java line 28 calls csrf(AbstractHttpConfigurer::disable), disabling CSRF protection globally
    for the entire application. The CsrfSettingsController and CsrfTokenService in the csrf package provide CSRF token management
    as a demo surface but are not wired into the Spring Security filter chain. Every state-changing browser-authenticated
    endpoint is unprotected against cross-site request forgery.
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
  status_note: 'Defeated: CSRF protection disabled globally at the filter chain level.'
- domain: Session and Token Management
  control: Session Cookie Hardening
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-COOKIE-001
  assessment: No explicit Secure, SameSite, or HttpOnly cookie attributes are configured in application.yml or SecurityConfig.java
    beyond Spring Boot defaults. The server binds on HTTP (port 8080) with no TLS, so the Secure flag has no effect even if
    set. frameOptions is set to sameOrigin (SecurityConfig.java:29), which is appropriate for H2 console use but does not
    constitute session hardening.
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
  status_note: Default Spring cookie attributes; Secure flag inapplicable without TLS; SameSite not explicitly configured.
- domain: Authorization
  control: Role-Based Access Control via @PreAuthorize
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-AUTHZ-001
  assessment: 'Spring Security @PreAuthorize annotations enforce role checks on several endpoints (e.g., AdminUserController
    POST /api/admin/users requires ROLE_ADMIN, line 22). However coverage is inconsistent: multiple admin and privileged routes
    lack any annotation. The SecurityConfig anyRequest().authenticated() catch-all applies only after the large list of explicitly
    permitted paths, and several admin surfaces are under those permitted prefixes.'
  implementation: src/main/java/com/example/appsecverificationtarget/accesscontrol/AdminUserController.java
  status_note: Present on select endpoints; absent on legacy admin routes and several profile/report operations.
- domain: Authorization
  control: Legacy Admin Endpoint Access Control
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-AUTHN-001
  assessment: SecurityConfig.java line 41 explicitly permits all requests matching '/legacy/admin' and '/legacy/admin/**'.
    LegacyAdminBoardController exposes GET /legacy/admin (list all users), POST /legacy/admin/users/{id}/promote (grant ADMIN
    role), and POST /legacy/admin/users/{id}/delete (delete user) with no authentication or authorization check of any kind.
    These are destructive privileged operations reachable by any unauthenticated caller.
  implementation: src/main/java/com/example/appsecverificationtarget/legacyadmin/LegacyAdminBoardController.java
  status_note: 'Defeated: unauthenticated privilege escalation and account deletion reachable at /legacy/admin/**.'
- domain: Authorization
  control: Management and Actuator Endpoint Access Control
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-MGMT-001
  assessment: 'SecurityConfig.java line 33 permits all requests to /actuator/**. application.yml exposes all actuator endpoints
    (include: ''*'') and sets show-values: ALWAYS for /actuator/env and /actuator/configprops. The integration-token value
    (''loca**** (28 chars)'') and all other environment variables including datasource credentials are returned in
    plaintext to any unauthenticated caller via /actuator/env.'
  implementation: src/main/resources/application.yml
  status_note: 'Defeated: all actuator endpoints unauthenticated; environment secrets returned in plaintext responses.'
- domain: Authorization
  control: H2 Console Access Control
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'SecurityConfig.java line 32 permits all requests to /h2-console/**. application.yml enables the H2 console
    (h2.console.enabled: true). The H2 web console provides direct SQL query access to the in-memory database containing all
    application data. No authentication is required to reach the console. frameOptions is set to sameOrigin rather than deny,
    permitting iframe embedding from the same origin.'
  implementation: src/main/resources/application.yml
  status_note: 'Defeated: H2 database console accessible without authentication at /h2-console.'
- domain: Authorization
  control: Object-Level Ownership Check (BOLA/IDOR)
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: JPA repository queries in access control paths use parameterized Spring Data methods, providing structural parameterization.
    However, cross-user object isolation relies on caller-supplied identifiers being matched against the authenticated principal
    at the controller layer. ProfileController PUT /me (line 34) and order/document access paths have unresolved authorization
    on the ownership check. No centralized ownership-enforcement utility is present.
  implementation: src/main/java/com/example/appsecverificationtarget/accesscontrol/ProfileController.java
  status_note: Parameterized queries used; ownership checks inconsistently applied at the controller layer.
- domain: Input Handling
  control: Parameterized SQL via Spring Data JPA Repositories
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-SQLI-001
  assessment: Spring Data JPA repositories (AppUserRepository, OrderRepository, DocumentRepository, VaultCredentialRepository,
    CleanProjectRepository) use parameterized derived queries and named parameters, providing safe data access for those paths.
    However the DAO layer (OrderLookupDao, DocumentLookupDao, ReportLookupDao) and the LegacySqliteUserStore.authenticateRaw()
    bypass this mechanism via string concatenation.
  implementation: src/main/java/com/example/appsecverificationtarget/domain/
  status_note: Adequate on repository paths; defeated in DAO and legacy SQLite paths.
- domain: Input Handling
  control: SQL Injection Prevention in Native Query DAOs
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-SQLI-001
  assessment: 'OrderLookupDao.findByOwnerEmail() constructs a native SQL string by direct string concatenation of the caller-supplied
    email parameter (line 22: ''"where u.email = ''" + email + "''"''). DocumentLookupDao and ReportLookupDao use the same
    pattern. LegacySqliteUserStore.authenticateRaw() concatenates both username and password into the WHERE clause (line 64).
    All paths accept untrusted @RequestParam inputs with no sanitization.'
  implementation: src/main/java/com/example/appsecverificationtarget/inputvalidation/OrderLookupDao.java
  status_note: 'Defeated: caller-supplied input concatenated directly into native SQL in multiple DAO classes.'
- domain: Input Handling
  control: Path Traversal Prevention
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'FileReadController.read() constructs a filesystem path by string concatenation: Path.of("runtime/documents/"
    + name) with no normalization or containment check (line 19). A caller supplies any value to the ''name'' @RequestParam
    including ''../../../etc/passwd''. The endpoint is explicitly permitted without authentication in SecurityConfig.java
    line 37.'
  implementation: src/main/java/com/example/appsecverificationtarget/serverside/FileReadController.java
  status_note: 'Defeated: caller-controlled name parameter enables path traversal; endpoint is unauthenticated.'
- domain: Input Handling
  control: SSRF Prevention (Outbound HTTP)
  effectiveness: Unsafe
  kind: mechanism
  assessment: IntegrationController.fetch() accepts a caller-supplied 'url' @RequestParam and passes it directly to RestTemplate.getForObject()
    (line 23) with no allowlist, scheme restriction, or DNS resolution control. The endpoint is permitted without authentication
    in SecurityConfig.java line 37. Any internal or cloud-metadata address is reachable from the server.
  implementation: src/main/java/com/example/appsecverificationtarget/serverside/IntegrationController.java
  status_note: 'Defeated: caller supplies arbitrary URL; no destination allowlist; endpoint unauthenticated.'
- domain: Input Handling
  control: XXE Prevention (XML Parsing)
  effectiveness: Unsafe
  kind: mechanism
  assessment: XmlPreviewController.preview() creates a DocumentBuilderFactory and DocumentBuilder without disabling external
    entity resolution (line 22-24). The FEATURE_SECURE_PROCESSING flag and DOCTYPE/entity-expansion disabling calls are absent.
    The endpoint accepts untrusted XML from any caller and is permitted without authentication in SecurityConfig.java line
    42.
  implementation: src/main/java/com/example/appsecverificationtarget/serverside/XmlPreviewController.java
  status_note: 'Defeated: entity resolution enabled in DocumentBuilderFactory; endpoint unauthenticated.'
- domain: Input Handling
  control: Schema and Allowlist Input Validation
  effectiveness: Missing
  kind: cross-cutting
  rule_id: ARCH-INPUT-001
  assessment: No centralized schema or allowlist validation framework is present. JSR-380 (@Valid/@Validated Bean Validation)
    annotations are absent from controller method signatures and request body classes in the vulnerable input paths. LandscapeOperations
    applies only value.trim() (line 63). No type, range, or format constraints are enforced before business logic runs on
    @RequestParam inputs across order, document, project, and search endpoints.
  status_note: No centralized input validation layer found; only ad-hoc trimming observed.
- domain: Cryptography and Secrets
  control: Password Hashing (Primary Store BCrypt)
  effectiveness: Adequate
  kind: primitive
  assessment: The primary user store uses BCryptPasswordEncoder (SecurityConfig.java:131-133) for all password operations
    routed through Spring Security's UserDetailsService. BCrypt with default strength (10 rounds) is an appropriate algorithm.
    This applies only to the InMemoryUserDetailsManager path; the legacy SQLite store stores passwords in cleartext and is
    separately assessed.
  implementation: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
  status_note: Adequate for primary store; legacy SQLite path is a separate Unsafe control.
- domain: Cryptography and Secrets
  control: Legacy Password Hashing (MD5)
  effectiveness: Unsafe
  kind: primitive
  assessment: LegacyPasswordService.hashForAudit() uses MD5 (MessageDigest.getInstance("MD5"), line 15). MD5 is a cryptographically
    broken algorithm that must not be used for password hashing or security-relevant digests. The method is named 'hashForAudit'
    but processes passwords and is callable via CryptoController.
  implementation: src/main/java/com/example/appsecverificationtarget/crypto/LegacyPasswordService.java
  status_note: 'Defeated: MD5 is cryptographically broken and must not be used for password or security digest operations.'
- domain: Cryptography and Secrets
  control: OTP / Token Generation Randomness
  effectiveness: Unsafe
  kind: primitive
  assessment: LegacyTokenService.nextOtp() generates 6-digit OTPs using java.util.Random (line 5-6), which is a linear congruential
    generator seeded from system time. java.util.Random is not cryptographically secure; an attacker who observes one or more
    outputs can predict future values. A CSPRNG (SecureRandom) is required for all security token generation.
  implementation: src/main/java/com/example/appsecverificationtarget/crypto/LegacyTokenService.java
  status_note: 'Defeated: java.util.Random is predictable; SecureRandom required for OTP generation.'
- domain: Cryptography and Secrets
  control: Homegrown and Custom Cipher Implementations
  effectiveness: Unsafe
  kind: primitive
  assessment: HomegrownCipher and CustomCryptoService provide hand-rolled cryptographic implementations. Hand-rolled crypto
    consistently fails to achieve the security properties of peer-reviewed, standardized algorithms. Neither class uses an
    established AEAD mode from a maintained library. Any data encrypted or protected through these paths should be treated
    as unprotected.
  implementation: src/main/java/com/example/appsecverificationtarget/crypto/HomegrownCipher.java
  status_note: 'Defeated: hand-rolled cryptographic implementations provide no meaningful security guarantee.'
- domain: Cryptography and Secrets
  control: JWT Signing Key Management
  effectiveness: Weak
  kind: mechanism
  assessment: SignedJwtService generates the HS256 signing key at field initialization time using Keys.secretKeyFor() (line
    19). The key is in-memory only and not persisted. Every application restart generates a new key, invalidating all previously
    issued tokens. No key rotation, external key management, or key-store integration is present.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/SignedJwtService.java
  status_note: Ephemeral key lost on restart; external persistent key store required for production.
- domain: CORS Policy
  control: Cross-Origin Resource Sharing Policy
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-CORS-001
  assessment: CorsPolicyFilter.isTrustedOrigin() returns true for any Origin header that starts with the string 'http' (line
    32). For any matching origin, the filter sets Access-Control-Allow-Origin to the reflected origin value and Access-Control-Allow-Credentials
    to 'true' (lines 18-19). This allows any http:// or https:// origin—effectively all web origins—to make credentialed cross-origin
    requests to any endpoint, bypassing the browser same-origin policy for authenticated operations.
  implementation: src/main/java/com/example/appsecverificationtarget/cors/CorsPolicyFilter.java
  status_note: 'Defeated: any http/https origin reflected with credentials=true, defeating the same-origin policy.'
- domain: Transport Security
  control: TLS / Transport Encryption
  effectiveness: Missing
  kind: cross-cutting
  rule_id: ARCH-TLS-001
  assessment: application.yml configures only HTTP on port 8080 with no TLS settings (no server.ssl block). No upstream TLS
    terminator is declared through required configuration. LandscapeDataSeeder seeds integration endpoints with plaintext
    http:// URLs for ERP, CRM, and ANALYTICS targets (LandscapeDataSeeder.java:60). All credentials, session tokens, and sensitive
    data travel over unencrypted HTTP.
  implementation: src/main/resources/application.yml
  status_note: No TLS configured at application or declared upstream; all traffic is plaintext HTTP.
- domain: Data Protection
  control: Legacy SQLite Cleartext Credential Storage
  effectiveness: Unsafe
  kind: mechanism
  assessment: LegacySqliteUserStore stores passwords in the legacy_users table as plaintext strings and compares submitted
    passwords directly against stored values (authenticate(), line 44-60). The database file (runtime/legacy-auth.sqlite)
    is written to the filesystem with no application-level access control. Read access to the file yields all credentials
    without any cracking effort.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteUserStore.java
  status_note: 'Defeated: passwords stored and compared in cleartext in an unprotected SQLite file.'
- domain: Logging and Monitoring
  control: Security Event Logging
  effectiveness: Unsafe
  kind: mechanism
  assessment: CredentialLoggingFilter logs the plaintext username and password from every login attempt at INFO level, which
    is included in default log output. The log statement (line 25) captures both parameters unconditionally before authentication
    succeeds or fails. This exposes all submitted credentials—including for failed attempts—to any party with log access.
  implementation: src/main/java/com/example/appsecverificationtarget/authentication/CredentialLoggingFilter.java
  status_note: 'Defeated: plaintext credential values written to logs; log access equals credential access.'
- domain: Logging and Monitoring
  control: Actuator Endpoint Exposure
  effectiveness: Unsafe
  kind: surface
  assessment: 'application.yml exposes all Spring Boot Actuator endpoints without restriction (include: ''*'') and enables
    sensitive value display (show-values: ALWAYS for env and configprops). SecurityConfig.java line 33 permits all /actuator/**
    requests without authentication. /actuator/env returns all environment variables including datasource credentials and
    the integration-token in plaintext.'
  implementation: src/main/resources/application.yml
  status_note: 'Defeated: all actuator endpoints unauthenticated; environment secrets exposed in plaintext via /actuator/env.'
- domain: Dependency Lifecycle
  control: Dependency Pinning and Vulnerability Scanning
  effectiveness: Missing
  kind: lifecycle
  assessment: No dependency lockfile (Maven or Gradle lock) and no dependency vulnerability scanning configuration (OWASP
    Dependency-Check, Snyk, or equivalent) are present in the repository. The pom.xml or build file manages versions but without
