- id: auth-service
  name: Authentication Service
  description: Multi-mechanism authentication layer implementing Spring Security session-based login, signed JWT issuance
    and validation, homegrown session token service, legacy JWT acceptance (including unsigned), and legacy SQLite-backed
    credential lookup. Contains intentionally vulnerable implementations including cleartext password storage in SQLite and
    credential logging.
  paths:
  - src/main/java/com/example/appsecverificationtarget/authentication/*.java
  tier: application
  complexity: complex
  framework: spring-security
  deployment_zones:
  - dmz
  - internal-network
  handles_sensitive_data: true
  threat_ids:
  - T-005
  - T-006
  - T-014
  - T-015
  - T-019
  - T-021
  - T-031
  - T-032
- id: access-control
  name: Access Control and Authorization
  description: Authorization layer using Spring Security @PreAuthorize annotations for RBAC across 13 roles. Exposes admin
    user management, document and order access decisions, profile operations, and a legacy admin board. Contains intentionally
    broken authorization checks including unauthenticated admin management endpoints.
  paths:
  - src/main/java/com/example/appsecverificationtarget/accesscontrol/*.java
  - src/main/java/com/example/appsecverificationtarget/legacyadmin/*.java
  tier: application
  complexity: moderate
  framework: spring-security
  deployment_zones:
  - internal-network
  handles_sensitive_data: false
  threat_ids:
  - T-003
  - T-011
  - T-012
  - T-017
  - T-022
  - T-041
  - T-044
- id: web-ui
  name: Web UI Layer (Thymeleaf MVC)
  description: 'Server-side Thymeleaf MVC layer rendering HTML templates for user-facing operations: document management,
    order management, profile editing, admin user pages, and the dashboard. Processes form submissions for state-changing
    operations that are missing authentication enforcement.'
  paths:
  - src/main/java/com/example/appsecverificationtarget/web/*.java
  - src/main/resources/templates/**
  - src/main/resources/static/**
  tier: application
  complexity: moderate
  framework: thymeleaf
  deployment_zones:
  - dmz
  - internal-network
  handles_sensitive_data: false
  threat_ids:
  - T-040
  - T-048
  - T-049
  - T-053
- id: landscape-service
  name: Landscape Service Portfolio
  description: Large-scale service catalog testing fixture exposing 30+ HTTP endpoints across client onboarding, billing,
    partner, compliance, audit, analytics, and catalog domains. Includes abstract service hierarchy, internal/exposed service
    split, and persistence through LandscapePersistence and LandscapeDataSeeder.
  paths:
  - src/main/java/com/example/appsecverificationtarget/landscape/**/*.java
  tier: application
  complexity: complex
  framework: spring-boot
  deployment_zones:
  - internal-network
  handles_sensitive_data: false
  threat_ids:
  - T-025
- id: input-validation-api
  name: Input Validation API (Vulnerable)
  description: Intentionally vulnerable input handling layer demonstrating SQL injection via raw EntityManager string concatenation
    (OrderLookupDao, DocumentLookupDao, ReportLookupDao), unvalidated @RequestParam inputs in order and document search controllers,
    and a project search endpoint with similar exposure.
  paths:
  - src/main/java/com/example/appsecverificationtarget/inputvalidation/*.java
  - src/main/java/com/example/appsecverificationtarget/projectsearch/*.java
  tier: application
  complexity: moderate
  framework: spring-boot
  deployment_zones:
  - internal-network
  handles_sensitive_data: false
  threat_ids:
  - T-007
- id: server-side-api
  name: Server-Side Dangerous Sinks
  description: 'Intentionally vulnerable server-side processing: SSRF via IntegrationController HTTP client, path traversal
    via FileReadController (unsanitized name parameter with ../), XXE via XmlPreviewController (entity resolution not disabled),
    command injection via ToolController, and output encoding bypass via OutputPreviewController.'
  paths:
  - src/main/java/com/example/appsecverificationtarget/serverside/*.java
  - src/main/java/com/example/appsecverificationtarget/outputhandling/*.java
  tier: application
  complexity: moderate
  framework: spring-boot
  deployment_zones:
  - internet
  - internal-network
  handles_sensitive_data: false
  threat_ids:
  - T-008
  - T-037
  - T-038
  - T-039
  - T-043
  - T-051
- id: crypto-api
  name: Crypto and Token Service
  description: 'Cryptographic service layer including intentionally weak implementations: homegrown cipher (HomegrownCipher),
    legacy password hashing (LegacyPasswordService), legacy token generation (LegacyTokenService), custom crypto (CustomCryptoService),
    and a VaultCredential JPA entity with its repository. Exposes token and credential retrieval endpoints.'
  paths:
  - src/main/java/com/example/appsecverificationtarget/crypto/*.java
  tier: application
  complexity: moderate
  framework: spring-boot
  deployment_zones:
  - internal-network
  handles_sensitive_data: true
  threat_ids:
  - T-001
  - T-020
  - T-026
  - T-029
  - T-033
  - T-047
  - T-050
- id: cors-csrf-middleware
  name: CORS and CSRF Middleware
  description: 'Security middleware layer with intentionally vulnerable implementations: CorsPolicyFilter reflects any Origin
    header that starts with ''http'' into Access-Control-Allow-Origin without allowlist validation; CsrfSettingsController
    and CsrfTokenService implement CSRF token management with bypass exposure.'
  paths:
  - src/main/java/com/example/appsecverificationtarget/cors/*.java
  - src/main/java/com/example/appsecverificationtarget/csrf/*.java
  tier: application
  complexity: simple
  framework: spring-boot
  deployment_zones:
  - dmz
  - internal-network
  handles_sensitive_data: false
  threat_ids:
  - T-028
  - T-036
- id: data-layer
  name: Data Layer (H2 + SQLite)
  description: JPA domain entities (AppUser, CustomerOrder, DocumentRecord) with Spring Data repositories backed by an H2
    in-memory primary database. A separate SQLite file (legacy-auth.sqlite) stores legacy user credentials in cleartext. The
    H2 web console is exposed without authentication at /h2-console.
  paths:
  - src/main/java/com/example/appsecverificationtarget/domain/*.java
  tier: data
  complexity: moderate
  framework: spring-data-jpa
  deployment_zones:
  - prod-write-db
  - internal-network
  handles_sensitive_data: true
  threat_ids: []
- id: clean-api
  name: Clean Reference Implementation
  description: 'Reference control implementation demonstrating correct security patterns: parameterized JPA repository queries
    (CleanProjectRepository), proper input handling via CleanProjectRequest, and correct authorization enforcement. Used as
    a baseline fixture for scanner false-positive tuning.'
  paths:
  - src/main/java/com/example/appsecverificationtarget/clean/*.java
  tier: application
  complexity: simple
  framework: spring-boot
  deployment_zones:
  - internal-network
  handles_sensitive_data: false
  threat_ids: []
