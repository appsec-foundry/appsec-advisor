components:
- id: api-gateway
  name: API Gateway / Spring Boot Entry Point
  description: Spring Boot application entry point and central security configuration hub. Hosts Spring Security filter chain,
    session/JWT filter wiring, H2 console exposure, and demo data seeding. Coordinates request routing to all application-layer
    components.
  paths:
  - src/main/java/com/example/appsecverificationtarget/AppsecVerificationTargetApplication.java
  - src/main/java/com/example/appsecverificationtarget/config/*.java
  - src/main/resources/application.yml
  - Dockerfile
  - docker-compose.yml
