  title: Hardcoded JWT signing key in container image ENV permits token forgery
  scenario: An attacker who obtains the Docker image reads JWT_SIGNING_KEY=hardcoded-legacy-jwt-secret from ENV metadata,
    signs an arbitrary JWT claiming admin identity using HS256, and authenticates to all JWT-protected endpoints without possessing
    a legitimate credential.
  attack_steps:
  - Attacker pulls the application image from the registry and runs `docker inspect <image>` to read Config.Env, extracting
    JWT_SIGNING_KEY=hardcoded-legacy-jwt-secret in plaintext.
  - Attacker crafts a JWT with header {"alg":"HS256"} and payload {"sub":"admin","roles":["ADMIN"]} and signs it with the
    extracted key using any standard JWT library.
  - 'Attacker sends the forged token in an Authorization: Bearer header to a protected endpoint such as /api/secure-jwt/**
    and receives a full authenticated admin response.'
  evidence_summary: Dockerfile line 13 contains `ENV JWT_SIGNING_KEY=hardcoded-legacy-jwt-secret` baked as a static image
    layer; any party with image read access recovers the key via docker inspect without any additional exploitation.
  impact_description: Attacker forges JWT tokens for any principal including admin, bypassing all JWT-based authentication
    on all protected routes.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: SignedJwtAuthenticationFilter validates token signatures (SecurityConfig.java:62), but the known key
    negates this control
  mitigation_title: Remove JWT_SIGNING_KEY from Dockerfile ENV and inject via secret manager at container runtime
  remediation:
    effort: Medium
    steps:
    - Remove the JWT_SIGNING_KEY ENV directive from the Dockerfile; load the signing key from an orchestrator secret (Docker
      secret, Kubernetes secret, or AWS Secrets Manager) mounted at container startup.
    - Rotate the exposed key immediately; invalidate all tokens signed with the old key by updating the key and forcing re-authentication.
