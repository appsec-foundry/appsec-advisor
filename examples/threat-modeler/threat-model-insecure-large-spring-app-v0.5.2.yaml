  stride: Tampering
  cwe: CWE-352
  title: CSRF token not validated against session (CsrfSettingsController.java:47)
  scenario: An attacker hosts a page that submits POST /csrf/settings with formToken=x and a chosen contactEmail; CsrfSettingsController.update()
    at line 47 checks only that formToken is non-null and non-blank, never calling csrfTokenService.currentToken(session)
    for value comparison, so the guard is bypassed and the victim's contact email is overwritten.
  attack_steps:
  - Attacker hosts http://evil.com/csrf.html that auto-submits POST /csrf/settings with formToken=x and contactEmail=attacker@evil.com
    using the victim's ambient session cookie.
  - CsrfSettingsController.update() evaluates formToken == null || formToken.isBlank() at line 47; the value 'x' passes both
    predicates, and csrfTokenService.currentToken(session) is never called.
  - contactPreferenceStore.update(authentication.getName(), contactEmail) at line 50 overwrites the victim's contact email
    with the attacker-supplied value, completing the unauthorized state change.
  evidence_summary: update() at line 47 guards only token existence; csrfTokenService.currentToken(session) is never invoked
    in this method, making any non-empty string a valid bypass regardless of the cryptographically generated session token.
  impact_description: Any attacker web page visited by an authenticated user can overwrite that user's contact email preference
    without the user's knowledge or consent.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: CsrfTokenService generates a SecureRandom 24-byte URL-safe token stored in session via issueToken();
    the existence check at line 47 is present but validates presence only.
  actor_ids:
  - ACT-D-01
  - ACT-D-04
  - ACT-D-05
  primary_actor: ACT-D-01
