  stride: Elevation of Privilege
  cwe: CWE-863
  title: Authorization via forgeable JWT role claim (LegacyAdminAuditController.java:40)
  scenario: LegacyAdminAuditController.audit() at line 40 extracts the role claim from the JWT via legacyJwtVerifier.readClaims(token).get("role")
    and at line 41 compares it to the string "ADMIN" without any server-side role lookup against the user database or session
    store. Because authorization is determined entirely by the unverified claim in the submitted token, any attacker who can
    submit a token with role=ADMIN — through the alg:none bypass (auth-service-001) or by obtaining a modified token — gains
    full admin access to the audit endpoint and the full user directory it exposes.
  attack_steps:
  - Attacker crafts or obtains a JWT containing role=ADMIN in its payload (enabled by alg:none acceptance at LegacyJwtVerifier.java:17).
  - 'Attacker sends GET /api/legacy-admin/audit?token=<token> — this endpoint is publicly accessible (SecurityConfig line
    39: permitAll).'
  - LegacyAdminAuditController.audit() extracts claims.get("role") at line 40 and the string comparison at line 41 passes
    because the claim value is ADMIN.
  - The response includes the full user directory (id, username, email, role, admin flag for all AppUser records) and aggregate
    counts, with no server-side role validation performed.
  evidence_summary: Line 40 reads the role from the attacker-supplied JWT claims map with no server-side cross-check; the
    role string comparison at line 41 is the sole authorization gate, making admin access contingent on claim content alone.
  impact_description: Attacker escalates from anonymous to effective ADMIN role, reading full user directory including email
    addresses and admin flags for all application users, enabling targeted phishing or account takeover campaigns.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: String comparison of role claim at line 41 (insufficient — relies on unverified token contents)
  mitigation_title: Replace JWT role claim authorization with server-side role lookup in LegacyAdminAuditController
  remediation:
    effort: Medium
    steps:
    - Remove the JWT-claim-based role check at lines 39-44 and require callers to present a valid Spring Security session
      (inject Authentication authentication parameter) with ROLE_ADMIN.
    - Add .requestMatchers(HttpMethod.GET, "/api/legacy-admin/audit").hasRole("ADMIN") to SecurityConfig before the existing
      permitAll matchers.
    - Add a test that submits a JWT with role=ADMIN to GET /api/legacy-admin/audit without a Spring Security session and asserts
      401 or 403.
    code_example: null
    verification: Submit GET /api/legacy-admin/audit?token=<alg-none-admin-jwt> and confirm the response is 401 or 403, not
      a user listing.
    reference: 'CWE-863: https://cwe.mitre.org/data/definitions/863.html'
