- local_id: auth-service-010
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-862
  title: Unauthenticated token issuance for arbitrary user ID (AuthController.java:38)
  scenario: AuthController.homegrownToken() at line 37-38 accepts any caller-supplied Long userId parameter and returns HomegrownSessionService.issueToken(userId)
    without requiring the caller to be authenticated. SecurityConfig line 43 authenticates GET /api/auth/signed-jwt/token
    but line 44 makes all remaining /api/auth/** routes permitAll, including /api/auth/homegrown-token. An anonymous attacker
    sends GET /api/auth/homegrown-token?userId=1 to receive a valid session token for the target user and then uses it on
    /api/legacy-session/orders to read that user's data.
  attack_steps:
  - Attacker sends GET /api/auth/homegrown-token?userId=1 to the unauthenticated endpoint (SecurityConfig line 44 grants permitAll
    to /api/auth/**).
  - AuthController at line 38 calls homegrownSessionService.issueToken(1L) which returns Base64('1') = 'MQ==' without any
    credential check.
  - Attacker sends GET /api/legacy-session/orders?token=MQ== and HomegrownSessionService.resolve() decodes the token to userId=1
    and returns that user's orders.
  - Attacker iterates userId values to enumerate all registered users and their order histories with no authentication required
    at any step.
  evidence_summary: AuthController line 38 calls issueToken(userId) where userId comes directly from @RequestParam without
    authentication; SecurityConfig line 44 places this endpoint under the permitAll /api/auth/** matcher.
  impact_description: Any anonymous attacker can obtain a valid session token for any user ID, impersonate that user on /api/legacy-session/orders,
    and enumerate all user identities and their associated data.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — the endpoint requires no authentication or authorization
  mitigation_title: Restrict /api/auth/homegrown-token to authenticated callers and bind token issuance to the authenticated
    principal
  remediation:
    effort: Low
    steps:
    - Move GET /api/auth/homegrown-token to require authentication by adding an explicit .requestMatchers(HttpMethod.GET,
      "/api/auth/homegrown-token").authenticated() rule before the /api/auth/** permitAll in SecurityConfig.
    - In AuthController.homegrownToken(), replace @RequestParam Long userId with Authentication authentication and resolve
      the userId from the authenticated principal, removing the caller-controlled parameter entirely.
    - Add a test that calls GET /api/auth/homegrown-token without credentials and asserts 401; add another that calls it authenticated
      as user A with userId=B and asserts 403.
    code_example: null
    verification: Send GET /api/auth/homegrown-token?userId=1 without credentials and confirm 401 is returned, not a token.
    reference: 'CWE-862: https://cwe.mitre.org/data/definitions/862.html'
