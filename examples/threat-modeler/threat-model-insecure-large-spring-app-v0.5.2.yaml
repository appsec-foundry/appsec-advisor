verdict:
  severity: red
  opening: The application runs in a state of systemic compromise — authentication, authorization, secret management, and
    data access all lack foundational controls, making full server and data access achievable without credentials.
  bullets:
  - title: Admin access without login
    body: Any visitor can promote their own account to administrator or obtain valid sessions for any other user.
    findings:
    - F-011
    - F-014
    - F-015
    - F-013
    - F-016
    weaknesses:
    - W-001
    - W-002
    verified_attack_path: true
  - title: All vault credentials readable without login
    body: An unauthenticated caller can retrieve every stored password in plaintext along with all embedded production service
      secrets.
    findings:
    - F-001
    - F-009
    - F-010
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Server takeover via injection
    body: Injection flaws in database access and command execution layers let any caller extract data or run server commands.
    findings:
    - F-006
    - F-007
    - F-008
    weaknesses: []
    verified_attack_path: false
  - title: Auth token forgery for any user
    body: Token signing keys are hardcoded in source and unsigned tokens are accepted, so any caller can impersonate any user.
    findings:
    - F-004
    - F-005
    weaknesses: []
    verified_attack_path: true
  - title: All account passwords crackable offline
    body: User passwords are stored in plaintext or with a broken hash scheme, exposing every account to offline cracking.
    findings:
    - F-021
    - F-033
    weaknesses:
    - W-005
    verified_attack_path: false
  - title: Any admin action forgeable from the web
    body: Any web page can silently trigger account changes, including admin creation, whenever an authenticated user is browsing.
    findings:
    - F-002
    - F-023
    - F-028
    weaknesses: []
    verified_attack_path: false
  closing: A remediation sprint covering authentication controls, secret rotation, and injection defenses is required before
    any production-facing deployment.
  bullets_intro: 'What an attacker can do today, worst first:'
