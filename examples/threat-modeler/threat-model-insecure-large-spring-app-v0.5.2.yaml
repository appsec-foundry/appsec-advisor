  stride: Tampering
  cwe: CWE-89
  title: SQL injection in authenticateRaw (LegacySqliteUserStore.java:64)
  scenario: 'LegacySqliteUserStore.authenticateRaw() at line 64 concatenates attacker-controlled username and password request
    parameters directly into the SQL string without parameterization. The endpoint GET /api/legacy-sqlite/login-raw is publicly
    accessible (SecurityConfig line 40: /api/legacy-sqlite/** permitAll). An attacker submits a tautological SQL fragment
    in the password parameter to bypass authentication and return any row, including the legacy_admin ADMIN-role account.'
  attack_steps:
  - Attacker sends GET /api/legacy-sqlite/login-raw?username=x&password=x%27+OR+%271%27%3D%271 to the unauthenticated endpoint.
  - 'authenticateRaw() concatenates the input at line 64, producing: WHERE username = ''x'' and password = ''x'' OR ''1''=''1'',
    which evaluates to true for all rows.'
  - Statement.executeQuery() returns the first row (legacy_admin with role=ADMIN) and the controller responds with status=accepted
    and role=ADMIN.
  - Attacker now possesses a valid ADMIN role identity and can enumerate other rows by adjusting LIMIT/OFFSET to extract all
    users and cleartext passwords from the table.
  evidence_summary: Line 64 performs direct string concatenation of username and password into the SQL WHERE clause without
