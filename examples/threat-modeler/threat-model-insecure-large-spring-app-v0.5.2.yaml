  title: Unauthenticated actuator /env exposes all config secrets in plaintext
  scenario: An unauthenticated attacker sends a single GET /actuator/env request to the publicly accessible management endpoint
    and reads a JSON document containing every Spring property value including integration-token, datasource credentials,
    and any other secrets present in the application configuration.
  attack_steps:
  - Attacker sends `GET http://<host>:8080/actuator/env` with no session cookie or Authorization header.
  - Spring Boot returns a JSON object with show-values:ALWAYS, making every property value visible including `app.integration-token=****
    (28 chars)` and datasource credentials.
  - Attacker reads all exposed secret values and uses them to authenticate against the application API or downstream systems
    without any legitimate account.
