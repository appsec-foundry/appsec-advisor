- local_id: access-control-002
  threat_category_id: TH-01
  additional_categories:
  - TH-06
  stride: Tampering
  cwe: CWE-915
  title: Mass Assignment of Password Hash via PUT /me (ProfileController.java:41)
  scenario: 'An authenticated user sends PUT /api/profile/me with a JSON body containing ''passwordHash'': ''<known-value>'';
    the controller at lines 41-42 copies this field directly to the persisted AppUser entity without passing it through the
    application''s PasswordEncoder, overwriting the stored credential with an arbitrary caller-controlled string and breaking
    credential integrity.'
  attack_steps:
  - 'Attacker authenticates as any valid low-privilege account and crafts PUT /api/profile/me with body {"passwordHash": "attacker-chosen-value"}.'
  - ProfileController copies incoming.getPasswordHash() to current.setPasswordHash() at line 42 without hashing, persisting
    the raw attacker-controlled string as the credential.
  - Attacker authenticates again using the known raw value; if the PasswordEncoder is NoOp or the app uses {noop} prefixing,
    login succeeds with the attacker-controlled credential.
  evidence_summary: ProfileController.java lines 41-42 unconditionally set passwordHash from the caller-supplied request body
    field without PasswordEncoder processing, allowing any authenticated user to store an arbitrary raw string as their credential.
  impact_description: 'Credential integrity is broken: any authenticated user can overwrite their stored password hash with
    a raw, caller-chosen string. In applications using NoOpPasswordEncoder or any encoder that compares plaintext, this allows
    the attacker to set a weak or known password without going through the secure change-password flow.'
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Spring Security anyRequest().authenticated() ensures the caller is authenticated before reaching the
    endpoint
  mitigation_title: Remove passwordHash field from profile update handler and route through a dedicated password-change endpoint
  remediation:
    effort: Low
    steps:
    - Delete the passwordHash conditional block (ProfileController.java lines 41-42); expose password changes only through
      a dedicated PUT /me/password endpoint that accepts {currentPassword, newPassword}, verifies currentPassword against
      the stored hash, encodes newPassword with the application's PasswordEncoder, then persists the encoded value.
    - Add a test that sends PUT /api/profile/me with a 'passwordHash' field and asserts the stored hash is unchanged in the
      database.
    code_example: null
    verification: 'POST PUT /api/profile/me with {"passwordHash": "tampered"}; query DB and assert stored passwordHash is
      unchanged.'
    reference: 'CWE-915: Improper Control of Dynamically-Identified Variables (Mass Assignment)'
