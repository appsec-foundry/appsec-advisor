  title: Unauthenticated User Promotion to Admin (LegacyAdminBoardController.java:28)
  scenario: An unauthenticated attacker calls POST /legacy/admin/users/{id}/promote targeting any user ID; no authentication
    or authorization check is present; the controller sets admin=true and role='ADMIN' on the target user and persists it
    to the database, granting that user permanent admin privileges.
