- local_id: crypto-api-003
  threat_category_id: TH-03
  additional_categories: []
  stride: Tampering
  cwe: CWE-327
  title: AES/ECB mode allows ciphertext block manipulation (LegacyCryptoService.java:17)
  scenario: LegacyCryptoService.encryptExportValue() uses AES/ECB/PKCS5Padding with the hardcoded key '0123456789abcdef' (line
    13). ECB mode encrypts identical plaintext blocks to identical ciphertext blocks and provides no message authentication,
    allowing an attacker with source access to decrypt any captured export token, modify the plaintext, re-encrypt with the
    same key, and inject the altered ciphertext where the export token is consumed.
  attack_steps:
  - Attacker reads LegacyCryptoService.java:13, extracts '0123456789abcdef', and uses standard AES/ECB to decrypt any captured
    ciphertext returned by GET /api/crypto/export-token.
  - Attacker modifies the decrypted plaintext value, re-encrypts it with AES/ECB and the same key, and submits the tampered
    ciphertext to any downstream consumer that decrypts export tokens without integrity verification.
  evidence_summary: LegacyCryptoService.java:17 calls Cipher.getInstance('AES/ECB/PKCS5Padding'); line 13 stores the key as
    a hardcoded string constant, making the cipher trivially reversible to anyone who reads the source and removing all integrity
    protection from export tokens.
  impact_description: An attacker can decrypt, alter, and re-encrypt any export token; since ECB produces no authentication
    tag, tampered ciphertext cannot be distinguished from genuine output.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None
  mitigation_title: Replace AES/ECB with authenticated encryption in LegacyCryptoService
  remediation:
    effort: Medium
    steps:
    - Replace Cipher.getInstance('AES/ECB/PKCS5Padding') with AES/GCM/NoPadding and generate a fresh 96-bit IV per encryption;
      prepend the IV to the ciphertext output and strip it on decryption.
    - Load the AES key from an externally supplied secret (application properties or a secrets manager) rather than the hardcoded
      constant at line 13; add a test that modifies any ciphertext byte and confirms decryption throws an AEADBadTagException.
    code_example: null
    verification: Flip one byte in an export-token ciphertext and confirm the decryption step throws an authentication tag
      mismatch exception.
    reference: 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm — https://cwe.mitre.org/data/definitions/327.html'
  evidence:
