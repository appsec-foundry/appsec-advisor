    line 33 grants `.requestMatchers("/actuator/**").permitAll()`, requiring no authentication. application.yml line 27 places
    `integration-token: **** (28 chars)` in the application properties, directly exposed by /actuator/env.'
  impact_description: All application secrets including integration tokens, database credentials, and any injected environment
    variables are read in a single unauthenticated HTTP request.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — actuator is entirely permit-all with full value exposure
  mitigation_title: Restrict actuator access to authenticated admin role and mask sensitive property values
