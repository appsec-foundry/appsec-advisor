- local_id: cors-csrf-middleware-002
  threat_category_id: TH-06
  additional_categories:
  - Spoofing
  stride: Information Disclosure
  cwe: CWE-942
  title: Wildcard CORS origin reflection with credentials (CorsPolicyFilter.java:32)
  scenario: 'An attacker page at http://evil.com sends a credentialed GET to /api/cors/account; CorsPolicyFilter.isTrustedOrigin()
    at line 32 returns true for any non-null origin beginning with ''http'', causing the filter at line 18-19 to reflect the
    attacker origin into Access-Control-Allow-Origin and set Access-Control-Allow-Credentials: true; the browser then allows
    the attacker script to read the full JSON response containing the victim''s id, username, email, and role.'
  attack_steps:
  - Attacker embeds a credentialed fetch('https://target/api/cors/account', {credentials:'include'}) in a page at http://evil.com
    and lures an authenticated victim to visit it.
  - 'CorsPolicyFilter.isTrustedOrigin() at line 32 evaluates ''http://evil.com''.startsWith(''http'') as true and the filter
    sets Access-Control-Allow-Origin: http://evil.com and Access-Control-Allow-Credentials: true.'
  - Browser CORS check passes; the attacker's JavaScript reads the response body containing id, username, email, and role
    of the authenticated victim.
  evidence_summary: isTrustedOrigin() at line 32 contains `return origin != null && origin.startsWith("http")`, which matches
    every http:// and https:// URL without an allowlist; the reflected origin at line 18 combined with credentials=true at
    line 19 allows any web origin to read authenticated responses.
  impact_description: Cross-origin scripts exfiltrate authenticated user's id, username, email, and role from /api/cors/account;
    role disclosure enables targeted privilege abuse.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: 'Vary: Origin response header is set at CorsPolicyFilter.java:22, which is correct caching hygiene but
    provides no protection against the broken allowlist.'
  actor_ids:
  - ACT-D-01
  primary_actor: ACT-D-01
  mitigation_title: Replace origin-prefix check with explicit allowlist in CorsPolicyFilter.isTrustedOrigin()
  remediation:
    effort: Low
    steps:
    - Replace the startsWith('http') predicate in isTrustedOrigin() with an exact-match check against a configured set of
      known-good origins (e.g., loaded from application.yml); use Set.contains() for O(1) exact matching.
    - 'Add an integration test that sends Origin: http://evil.example.com and asserts the response does not include an Access-Control-Allow-Origin
      header (or returns a 403/omitted header).'
    code_example: "// CorsPolicyFilter — replace isTrustedOrigin with allowlist exact match\nprivate static final Set<String>\
      \ ALLOWED_ORIGINS = Set.copyOf(\n    List.of(\"https://orderdesk.example.com\"));\n\nprivate boolean isTrustedOrigin(String\
      \ origin) {\n    return origin != null && ALLOWED_ORIGINS.contains(origin);\n}"
    verification: 'Run `curl -H ''Origin: http://evil.example.com'' -I http://localhost:8080/api/cors/account` with a valid
      session cookie; the response must not contain `Access-Control-Allow-Origin: http://evil.example.com`.'
    reference: 'CWE-942: Permissive Cross-domain Policy with Untrusted Domains — https://cwe.mitre.org/data/definitions/942.html'
