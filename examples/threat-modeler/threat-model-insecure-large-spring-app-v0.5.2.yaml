trust_boundaries:
- name: 'external -> api-gateway: Spring Security SecurityFilterChain'
  kind: network
  assumption: Every request to a protected resource requires an authenticated session or token before the controller method
    executes.
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
    line: 26
  - file: src/main/resources/application.yml
  - file: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
    line: 37
  - file: src/main/java/com/example/appsecverificationtarget/serverside/IntegrationController.java
    line: 22
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: api-gateway
  enforcement_point: Spring Security SecurityFilterChain
  assumption_legs:
  - leg: validation
    condition: Every path parameter and request body reaching a controller has been type- and format-checked before business
      logic runs.
  - leg: authentication
    condition: Every route not explicitly marked permitAll() requires an authenticated Spring Security principal before the
      handler executes.
  - leg: authorization
    condition: Every object access within a protected handler is verified against the authenticated principal before the response
      is returned.
  covers_components:
  - api-gateway
  - server-side-api
  surface: network
  transition: []
  id: tb-1
  assumption_verdict: refuted
- name: 'external -> auth-service: Spring Security form-login and HTTP-basic handlers'
  kind: identity
  assumption: A session or token is issued only after the submitted credential is verified against the registered user store.
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
    line: 50
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: auth-service
  enforcement_point: Spring Security form-login and HTTP-basic handlers
  assumption_legs:
  - leg: validation
    condition: Username and password inputs are bounded in length before any hashing or database lookup occurs.
  - leg: authentication
    condition: A session cookie or token is issued only after the submitted credential matches a stored, hashed password.
  - leg: authorization
    condition: The session established at login carries only the roles granted to the authenticated user, not caller-supplied
      role claims.
  surface: network
  transition:
  - identity
  id: tb-2
  assumption_verdict: refuted
- name: 'api-gateway -> auth-service: Spring Security UserDetailsService'
  kind: process
  assumption: The authentication provider delegates credential verification to a registered UserDetailsService and does not
    short-circuit the check.
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
    line: 62
  confidence: inferred
  resolution_status: resolved
  sources:
  - detected
  from: api-gateway
  to: auth-service
  enforcement_point: Spring Security UserDetailsService
  assumption_legs:
  - leg: authentication
    condition: The Spring Security filter chain delegates every login attempt to the UserDetailsService and rejects any result
      that does not return a fully authenticated token.
  covers_components:
  - api-gateway
  - auth-service
  surface: in-process
  transition: []
  id: tb-3
  assumption_verdict: unconfirmed
  adjacent_finding_ids:
  - T-005
  - T-006
  - T-014
  - T-015
  - T-019
  - T-021
  - T-031
  - T-032
- name: server-side-api -> external
  kind: third-party
  assumption: Nothing attacker-controlled reaches an external host; outbound targets are restricted to an allow-listed set
    of destinations.
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/serverside/IntegrationController.java
    line: 23
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: server-side-api
  to: external
  assumption_legs:
  - leg: egress-content
    condition: No attacker-controlled string is passed as the target URL or request body to the outbound RestTemplate call.
  - leg: egress-destination
    condition: Outbound HTTP calls target only destinations on a server-managed allow-list, not a caller-supplied URL parameter.
  - leg: response-trust
    condition: The body returned from any external HTTP call is treated as untrusted input before it is stored or rendered.
  surface: network
  transition:
  - operator
  id: tb-10
  assumption_verdict: refuted
- name: 'access-control -> data-layer: JPA UserRepository and OrderRepository'
  kind: process
  assumption: Every ownership check uses a parameterized JPA query so that user-supplied identifiers cannot alter the WHERE
    predicate.
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/accesscontrol/UserAccessController.java
  - file: src/main/java/com/example/appsecverificationtarget/accesscontrol/OrderAccessController.java
  confidence: inferred
  resolution_status: resolved
  sources:
  - detected
  from: access-control
  to: data-layer
  enforcement_point: JPA UserRepository and OrderRepository
  assumption_legs:
  - leg: data-interpretation
    condition: Every ownership lookup passes the caller's identity through a JPA named-query parameter, never through string
      concatenation.
  - leg: authorization
    condition: Access-control queries bind the authenticated principal's ID as a parameter so that no caller can supply a
      different owner identifier.
  covers_components:
  - access-control
  - data-layer
  surface: in-process
  transition: []
  id: tb-4
  assumption_verdict: clean
