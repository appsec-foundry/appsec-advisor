  threat_category_id: TH-03
  additional_categories: []
  stride: Tampering
  cwe: CWE-321
  title: Hardcoded XOR key permits offline token forgery (HomegrownCipher.java:8)
  scenario: An attacker with source read access extracts the hardcoded key 'orderdesk-legacy-key' from HomegrownCipher.java:8,
    XOR-encodes any desired subject string (e.g., 'v1:admin') using the same repeating-key XOR loop as encode() at lines 13-15,
    and submits the forged base64url token to /api/legacy-crypto/whoami, which decodes and returns the attacker-chosen subject
    as the authenticated identity.
  attack_steps:
  - Attacker reads HomegrownCipher.java:8, extracts the key 'orderdesk-legacy-key', and locally XOR-encodes 'v1:admin' to
    produce a syntactically valid token.
  - Attacker submits the forged token to GET /api/legacy-crypto/whoami?token=<forged>; the server decodes it and returns 'admin'
    as the authenticated subject with no server-side signature check.
  evidence_summary: HomegrownCipher.java:8 stores the cipher key as a static plaintext constant; encode() at lines 13-15 applies
    repeating-key XOR with no HMAC or integrity tag, making the cipher fully reversible by anyone who reads the source.
  impact_description: Any party with source access can forge valid tokens for any subject; the XOR cipher provides no integrity
    guarantee so forged tokens are indistinguishable from legitimately issued ones.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None
  mitigation_title: Replace HomegrownCipher with HMAC-signed JWT in CustomCryptoService
  remediation:
    effort: Medium
    steps:
    - Replace HomegrownCipher.issueToken() usage in CustomCryptoService with the existing SignedJwtService (or a standard
      HMAC-SHA256 JWT library); remove HomegrownCipher and its KEY constant.
    - Invalidate all tokens that were issued using the XOR scheme and add a test asserting that a locally crafted XOR-encoded
      'v1:admin' token is rejected by /api/legacy-crypto/whoami after the change.
    code_example: null
    verification: Craft an XOR-encoded 'v1:admin' token using the old key and confirm GET /api/legacy-crypto/whoami returns
      HTTP 401 or an error after migration.
    reference: 'CWE-321: Use of Hard-coded Cryptographic Key — https://cwe.mitre.org/data/definitions/321.html'
