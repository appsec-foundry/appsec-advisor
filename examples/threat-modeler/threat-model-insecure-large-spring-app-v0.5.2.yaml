- local_id: crypto-api-008
  threat_category_id: TH-03
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-330
  title: Predictable OTP via non-CSPRNG Random (LegacyTokenService.java:10)
  scenario: LegacyTokenService uses java.util.Random (a 48-bit linear congruential generator) seeded non-cryptographically
    at line 10. GET /api/crypto/otp is unauthenticated (SecurityConfig.java:45). An attacker who observes multiple OTP values
    from the endpoint can reconstruct the 48-bit LCG internal state and predict all future OTP values, bypassing any OTP-gated
    authentication or privilege check that consumes nextOtp() output.
  attack_steps:
  - Attacker calls GET /api/crypto/otp repeatedly (unauthenticated per SecurityConfig.java:45) and records 10+ consecutive
    6-digit values from the java.util.Random sequence.
  - Attacker applies a 48-bit LCG seed-recovery algorithm against the collected values to reconstruct the Random internal
    state and predict the next OTP without interacting with the server.
  - Attacker submits the predicted OTP to any authentication or privilege-granting endpoint that uses LegacyTokenService.nextOtp()
    as a second factor, bypassing the OTP challenge without valid credentials.
  evidence_summary: LegacyTokenService.java:10 initializes 'private final Random random = new Random()' without a cryptographic
    seed; line 13 calls random.nextInt(900000) whose output is fully deterministic once the 48-bit LCG state is recovered
    from observed outputs.
  impact_description: Any OTP-gated action that relies on LegacyTokenService.nextOtp() can be bypassed by an attacker who
    observes the output sequence, allowing unauthorized privilege escalation without valid credentials.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None
  mitigation_title: Replace java.util.Random with SecureRandom in LegacyTokenService
  remediation:
    effort: Low
    steps:
    - Replace 'new Random()' with 'new SecureRandom()' at LegacyTokenService.java:10; increase OTP length to at least 8 digits
      or adopt a TOTP library (RFC 6238) to add time-binding.
    - Add a test that generates 1000 consecutive OTPs from a SecureRandom-backed instance and confirms no statistical bias
      (chi-square test on digit distribution); verify the unauthenticated /api/crypto/otp endpoint is removed or gated.
    code_example: null
    verification: After the change, collect 20 consecutive OTP values from GET /api/crypto/otp and confirm a java.util.Random
      seed-recovery tool cannot predict the 21st value within 2^48 guesses.
    reference: 'CWE-330: Use of Insufficiently Random Values — https://cwe.mitre.org/data/definitions/330.html'
  evidence:
