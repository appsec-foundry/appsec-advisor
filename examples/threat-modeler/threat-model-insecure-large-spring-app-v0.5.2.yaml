  stride: Elevation of Privilege
  cwe: CWE-862
  title: H2 web console accessible without authentication grants full database access
  scenario: An unauthenticated network-adjacent attacker navigates to /h2-console, connects to the in-memory database using
    the JDBC URL and blank password from application.yml, and executes arbitrary SQL against all tables, escalating to OS
    command execution via H2's CREATE ALIAS mechanism.
  attack_steps:
  - Attacker browses to `http://<host>:8080/h2-console` without any session cookie and receives the H2 database login form,
    bypassing Spring Security because the path is permitAll.
  - Attacker enters JDBC URL `jdbc:h2:mem:appsec_large_verification_target` with username `sa` and empty password as configured
    in application.yml line 8, and clicks Connect.
  - Attacker executes `SELECT * FROM users` and additional tables to exfiltrate all credentials, PII, and business records
    in plaintext.
  - Attacker executes `CREATE ALIAS EXEC AS $$ void exec(String cmd) throws Exception { Runtime.getRuntime().exec(cmd); }$$;
    CALL EXEC('id')` to achieve OS-level code execution within the container.
  evidence_summary: SecurityConfig.java line 32 grants `.requestMatchers("/h2-console/**").permitAll()` with no authentication
    requirement. application.yml lines 7-8 configure H2 with username 'sa' and empty password. application.yml line 11 enables
    the H2 web console. The H2 console bypasses Spring Security entirely because of the frameOptions sameOrigin setting (SecurityConfig.java:29)
    which was added only to allow iframe embedding, not to restrict access.
  impact_description: Complete compromise of all application data and potential OS-level code execution from a single unauthenticated
    HTTP session.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: frameOptions sameOrigin restricts cross-origin embedding but does not restrict direct access
  mitigation_title: Disable H2 console in production profiles and restrict to authenticated admin role in development
  remediation:
    effort: Low
    steps:
    - Set `spring.h2.console.enabled=false` in the default and production profiles; create a separate local-dev application-dev.yml
      that enables it only when the dev profile is active.
    - Remove `.requestMatchers("/h2-console/**").permitAll()` and replace with `.requestMatchers("/h2-console/**").hasRole("DEVELOPER")`
      to enforce authentication when the console is enabled in development.
    code_example: null
    verification: GET /h2-console as an unauthenticated user and confirm HTTP 302 redirect to /login; verify `spring.h2.console.enabled`
      evaluates to false in any environment without the dev profile active.
    reference: CWE-862 – Missing Authorization; Spring H2 Console Security
