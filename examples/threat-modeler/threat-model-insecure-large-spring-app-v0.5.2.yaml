assets:
- id: A-001
  name: User Authentication Credentials
  classification: Confidential
  description: AppUser entity holds username, email, password hash, and role assignments stored in the H2 in-memory database.
    Legacy SQLite store holds cleartext passwords for legacy auth users. Compromise enables account takeover across all 13
    application roles.
  linked_threats: []
  evidence_flags: []
- id: A-002
  name: JWT and Session Signing Keys
  classification: Restricted
  description: JWT_SIGNING_KEY hardcoded in Dockerfile (line 15) and docker-compose.yml (line 44); application.yml holds integration-token.
    These keys protect session integrity — their disclosure allows forging arbitrary JWT tokens for any user or role.
  linked_threats: []
  evidence_flags: []
- id: A-003
  name: Order Records
  classification: Restricted
  description: CustomerOrder JPA entities stored in H2 database, representing business transaction records with customer identity
    and order details. Exposed to SQL injection via OrderLookupDao and to unauthenticated access via missing-auth POST endpoints
    in OrderManagementController.
  linked_threats: []
  evidence_flags: []
- id: A-004
  name: Document Records
  classification: Restricted
  description: DocumentRecord JPA entities storing file metadata and access-control bindings in H2. Exposed to SQL injection
    via DocumentLookupDao, unauthenticated CRUD via DocumentManagementController, and IDOR via DocumentDecisionController
    release endpoint.
  linked_threats: []
  evidence_flags: []
- id: A-005
  name: Vault Credentials
  classification: Restricted
  description: VaultCredential JPA entities holding credential material managed by the crypto-api component. Reachable via
    unauthenticated /credentials endpoint (R-029) and /export-token endpoint (R-033); direct credential exfiltration without
    exploitation of any secondary vulnerability.
  linked_threats: []
  evidence_flags: []
- id: A-006
  name: Service Portfolio / Landscape Catalog
  classification: Internal
  description: Service portfolio records in LandscapePersistence describing service capabilities, ownership, and exposure
    classification across the 30+ landscape service endpoints. Disclosure reveals internal service topology and may assist
    targeted attacks against specific service surfaces.
  linked_threats: []
  evidence_flags: []
- id: A-007
  name: H2 In-Memory Database
  classification: Confidential
  description: Primary transactional H2 in-memory database backing all JPA repositories. The H2 web console is exposed without
    authentication at /h2-console (Spring Security permitAll), giving any unauthenticated requester full DDL/DML access to
    all stored data.
  linked_threats: []
  evidence_flags: []
- id: A-008
  name: Spring Actuator Telemetry and Heap Dump
  classification: Confidential
  description: 'Spring Boot Actuator endpoints fully exposed with show-values: ALWAYS in application.yml. /actuator/env returns
    all environment variables including hardcoded secrets; /actuator/heapdump returns a full JVM heap dump enabling offline
    extraction of in-memory credentials, tokens, and PII.'
  linked_threats: []
  evidence_flags: []
