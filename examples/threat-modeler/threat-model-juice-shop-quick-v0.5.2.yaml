  title: Hardcoded Mnemonic Enables Predictable Private Key — routes/checkKeys.ts:10
  scenario: The mnemonic phrase `'purpose betray marriage blame crunch monitor spin slide donate sport lift clutch'` is hardcoded
    at `routes/checkKeys.ts:10`. Running `HDNodeWallet.fromPhrase(mnemonic)` on it with `ethers` deterministically yields
