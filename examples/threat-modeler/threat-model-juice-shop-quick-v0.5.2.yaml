- local_id: auth-002
  threat_category_id: TH-02
  stride: Spoofing
  cwe: CWE-347
  title: JWT algorithm none Accepted by expressJwt — lib/insecurity.ts:52
  scenario: '`security.isAuthorized()` is implemented as `expressJwt({ secret: publicKey })` without specifying an `algorithms`
    allowlist (insecurity.ts:52). The underlying `jsonwebtoken@0.4.0` library does not reject the `alg:none` header value,
    meaning an attacker can craft a JWT, strip the signature, set `alg: ''none''` in the JOSE header, and the middleware will
    accept it as valid. The attacker can modify any payload field — including `data.email`, `data.id`, and `data.role` — before
    stripping the signature, enabling impersonation of any user and assumption of any role.'
  attack_steps:
  - An attacker authenticates with a legitimate low-privilege account to obtain a valid RS256 JWT.
  - The attacker base64-decodes the header, changes `alg` from `RS256` to `none`, modifies the payload (e.g., `data.role =
    'admin'`, `data.id = 1`), then re-encodes and drops the signature segment.
  - 'The attacker submits the token as `Authorization: Bearer <header>.<payload>.` to any protected endpoint; `expressJwt@0.1.3`
    passes the request as an authenticated admin.'
  evidence_summary: '`expressJwt({ secret: publicKey })` at `lib/insecurity.ts:52` omits `algorithms: [''RS256'']`, allowing
    `jsonwebtoken@0.4.0` to accept unsigned `alg:none` tokens.'
  impact_description: Complete authentication bypass and arbitrary identity assumption without requiring the private key or
    any user credential.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: JWT is validated on protected routes via express-jwt middleware. No algorithm pin is configured.
  mitigation_title: Upgrade jsonwebtoken and Pin Algorithm to RS256 in isAuthorized()
  remediation:
    effort: Medium
    steps:
    - Upgrade `jsonwebtoken` to ≥9.0.0 and `express-jwt` to ≥8.x, which reject `alg:none` by default.
    - 'Add an explicit algorithm allowlist: `expressJwt({ secret: publicKey, algorithms: [''RS256''] })` in `lib/insecurity.ts:52`.'
    - 'Run integration tests to confirm protected routes return HTTP 401 for unsigned tokens and tokens with `alg: ''HS256''`.'
    code_example: '// Before (insecurity.ts:52):

      export const isAuthorized = () => expressJwt({ secret: publicKey } as any)


      // After:

      export const isAuthorized = () => expressJwt({ secret: publicKey, algorithms: [''RS256''] })'
