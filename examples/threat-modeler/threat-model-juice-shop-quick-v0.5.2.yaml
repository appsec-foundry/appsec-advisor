  stride: Repudiation
  cwe: CWE-798
  title: Hardcoded Testing Credentials in Bundled SPA Source — login.component.ts:61
  scenario: Lines 61–62 of `login.component.ts` declare public class properties `testingUsername = 'testing@juice-sh.op'`
    and `testingPassword = 'IamU**** (17 chars)'`. These strings are compiled into the Angular production bundle and are trivially
    visible to any visitor via browser DevTools or a bundle inspector. Any person with access to the application can extract
    the credentials and authenticate as the shared test account. Because the account is shared and generic, server audit logs
    attribute all actions to 'testing@juice-sh.op', making it impossible to link malicious operations back to the actual perpetrator.
    An attacker can modify data, access sensitive features, or perform destructive actions while plausibly claiming the shared
    account was in use by someone else.
  evidence_summary: login.component.ts:61–62 exposes a shared account email and plaintext password as `public` class properties
    compiled directly into the SPA bundle.
  impact_description: Any visitor can authenticate as the shared test account; server audit logs cannot distinguish an attacker's
    actions from a developer's, eliminating accountability for malicious operations.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: None — no Angular `isDevMode()` guard, environment check, or build-time stripping protects these properties
    from appearing in the production bundle.
  mitigation_title: Remove hardcoded testing credentials from SPA source and rotate the test account password
