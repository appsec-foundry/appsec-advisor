- id: M-009
  title: Store session tokens in HttpOnly, Secure cookies
  kind: fix
  priority: P3
  severity: High
  effort: High
  threat_ids:
  - T-001
  auto_emitted: true
  auto_source: finding-fix
  prevents:
  - CWE-922
  _title_source: Replace localStorage token storage with an HttpOnly session cookie issued by a Backend-for-Frontend proxy
  steps:
  - 'Introduce a Backend-for-Frontend session endpoint (e.g., `POST /api/session`) in the Express backend that consumes the
    JWT from the current login flow and issues `Set-Cookie: session=<opaque-id>; HttpOnly; Secure; SameSite=Strict`. The SPA
    receives only the opaque session cookie — never the raw JWT in JavaScript-accessible storage.'
  - Remove `localStorage.setItem('token', authentication.token)` at `login.component.ts:101` and `localStorage.setItem('totp_tmp_token',
    ...)` at line 120, and every corresponding `localStorage.getItem('token')` read in `app.guard.ts` and other callers. Replace
    with the cookie-authenticated session model.
  - 'If a full BFF refactor is not feasible immediately, at minimum set `httpOnly: true` on the `ngy-cookie` `put()` call
    and stop writing to `localStorage` — this alone prevents JavaScript-readable token theft from XSS.'
  code_example: '// BEFORE (login.component.ts:101):

    localStorage.setItem(''token'', authentication.token) // XSS-accessible


    // AFTER — BFF session endpoint returns an HttpOnly cookie; no localStorage write:

    // The Express BFF route sets: res.cookie(''session'', opaqueId, { httpOnly: true, secure: true, sameSite: ''strict''
    })

    // The Angular side needs no token storage — the browser sends the cookie automatically.'
  verification: After login, open DevTools → Application → Local Storage — no 'token' key must appear. Open Application →
    Cookies — a 'session' cookie must be present and marked HttpOnly (no JavaScript access via `document.cookie`).
  reference: CWE-922
  file: frontend/src/app/login/login.component.ts:101
- id: M-010
  title: Move cryptographic keys to a managed secret store
  kind: fix
  priority: P2
  severity: Critical
  effort: High
  threat_ids:
  - T-002
  auto_emitted: true
  auto_source: finding-fix
  prevents:
  - CWE-321
  _title_source: Remove Private Key from Source and Rotate via External Secret Store
  steps:
  - Immediately rotate the RSA key pair; invalidate all tokens signed with the exposed key.
  - Store the new private key in an external secret manager (e.g., HashiCorp Vault, AWS Secrets Manager, environment variable
    injected at runtime) — never in source files.
  - Update `lib/insecurity.ts:21` to read the private key from `process.env.JWT_PRIVATE_KEY` (or a mounted secret file path)
    and fail application startup when the variable is absent.
  - Add a pre-commit hook and CI secret-scan (e.g., `truffleHog`, `gitleaks`) to prevent future key commits.
  - Purge the exposed key from git history using `git filter-repo`.
  code_example: '// Before (insecurity.ts:21) — key literal in source:

    const privateKey = ''[PEM PRIVATE KEY — REDACTED]\r\nMIICXAI...'';


    // After — read from environment at startup, fail-closed:

    const privateKey = process.env.JWT_PRIVATE_KEY;

    if (!privateKey) throw new Error(''JWT_PRIVATE_KEY is required'');'
  verification: After rotation, attempt to sign a JWT with the old private key and submit to GET /rest/whoami. The server
    must return HTTP 401. Confirm CI secret-scan blocks a test commit containing a PEM key.
  reference: CWE-321
  file: lib/insecurity.ts:21
