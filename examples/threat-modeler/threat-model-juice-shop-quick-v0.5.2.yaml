  handles_sensitive_data: true
  threat_ids: []
- id: cicd-pipeline
  name: CI/CD Pipeline
  description: GitHub Actions and GitLab CI pipelines that run tests, build Docker images (bkimminich/juice-shop), publish
    release artifacts, and generate SBOMs. Includes a multi-stage Dockerfile that produces a distroless final image running
    as UID 65532.
  paths:
  - .github/workflows/**
  - .gitlab-ci.yml
  - Dockerfile
  - docker-compose.test.yml
  tier: application
  complexity: simple
  framework: null
