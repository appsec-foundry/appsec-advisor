      notification)` or to the authenticated user''s room.'
    - Once authentication middleware is added (realtime-channel-001 fix), associate each socket with the authenticated user's
      ID via `io.use(...)` and use `io.to(userRoom).emit(...)` so only the solving user's sessions receive the flag.
    - Exclude the `flag` field from the global `io.emit` payload; transmit it only in the targeted per-user notification.
