tier_root_causes:
  edge:
  - insecure client-side storage of tokens and credentials in localStorage
  - client-side-only role enforcement bypassable via Angular route guard tampering
  - DOM-based XSS from unencoded search input rendered in browser context
  server:
  - hardcoded RSA private key and MD5 password hash in source repository
  - raw SQL template-literal interpolation without parameterized queries
  - authentication middleware absent on privileged and management endpoints
  - no rate limiting on login, password-reset, and registration flows
  - prompt injection enables LLM coupon policy bypass without authorization
weaknesses:
- id: W-001
  weakness_class: injection
  kind: design
  title: Database access relies on concatenated queries
  statement: Parameterized Database Access is not consistently enforced.
  severity: Critical
  severity_basis: confirmed
  observable_backing:
    absent_control_signal:
    - Parameterized Queries
    - ORM / Repository Layer
  mechanism_id: database-query-concatenation
  affected_components:
