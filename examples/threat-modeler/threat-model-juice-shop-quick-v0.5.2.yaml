- local_id: realtime-channel-001
  threat_category_id: TH-13
  additional_categories:
  - TH-02
  stride: Spoofing
  cwe: CWE-306
  title: Unauthenticated WebSocket Channel
  scenario: The Socket.IO server is initialised at registerWebsocketEvents.ts:19 and the connection handler at line 23 (`io.on('connection',
    ...)`) carries no `io.use(...)` authentication middleware. Despite the documented control claiming JWT validation at connection
    time, no such middleware exists in the component source. Any client — anonymous, cross-origin, or adversarial — can establish
    a full Socket.IO session and begin receiving server-push events and submitting message-handler events. The hardcoded CORS
    origin (`http://localhost:4200` at line 20) restricts only browser-initiated cross-origin HTTP upgrade requests; non-browser
    clients (Node scripts, Python, curl with WebSocket support) are unaffected by CORS and connect freely. This breaks the
    `authentication` leg of trust boundary tb-1.
  attack_steps:
  - An attacker opens a Socket.IO connection to the server's WebSocket endpoint without supplying any authorization header
    or token.
  - The server accepts the connection at registerWebsocketEvents.ts:23 and immediately pushes all pending `challenge solved`
    notifications (line 29) to the attacker's socket.
  - The attacker uses the established session to emit `verifyLocalXssChallenge` or other handler events as if they were an
    authenticated user.
  evidence_summary: '`io.on(''connection'', (socket: any) => { ... })` at line 23 registers all event handlers with no preceding
    `io.use(authMiddleware)` call anywhere in the file.'
  impact_description: Any unauthenticated network client can join the real-time channel, receive all challenge solved notifications
    including CTF flags, and interact with all server-side socket event handlers.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Socket.IO CORS origin is restricted to `http://localhost:4200` (line 20), which limits browser-based
    cross-site attacks but does not restrict non-browser clients.
  mitigation_title: Add Socket.IO authentication middleware to reject unauthenticated connections
  remediation:
    effort: Low
    steps:
    - Add an `io.use()` middleware before the `io.on('connection', ...)` handler that extracts the JWT from `socket.handshake.auth.token`,
      verifies it with `security.verify()` or `jwt.verify()` using the configured secret, and calls `next(new Error('Unauthorized'))`
      on failure.
    - Update the Socket.IO CORS origin from the hardcoded `http://localhost:4200` to the value from application config (e.g.
      `config.get('server.corsOrigin')`) so production deployments are not blocked by an incorrect hardcoded value.
    code_example: "// Before: no middleware\nio.on('connection', (socket) => { ... })\n\n// After: authenticate at connection\
      \ time\nio.use((socket, next) => {\n  const token = **** (28 chars)\n  if (!token) return next(new Error('Unauthorized'))\n\
      \  try {\n    socket.data.user = jwt.verify(token, security.publicKey, { algorithms: ['RS256'] })\n    next()\n  } catch\
      \ {\n    next(new Error('Unauthorized'))\n  }\n})\nio.on('connection', (socket) => { ... })"
    verification: Connect with a Socket.IO client omitting `auth.token`; the server must emit a `connect_error` with message
      `Unauthorized` and the socket must not receive `challenge solved` events.
    reference: CWE-306
  evidence:
  - file: lib/startup/registerWebsocketEvents.ts
    line: 23
  boundary_refs:
