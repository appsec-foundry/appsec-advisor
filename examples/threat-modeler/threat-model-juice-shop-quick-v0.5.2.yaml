    hit_count: 0
    searched_at: '2026-08-17T00:00:00Z'
  mitigation_title: Replace plain Object token store with a TTL-bounded cache and add rate limiting in lib/insecurity.ts
  remediation:
    effort: Medium
    steps:
    - Replace the tokenMap plain Object at lib/insecurity.ts:71 with a TTL cache (e.g., lru-cache or node-cache) configured
      to evict entries after 6 hours, matching the JWT expiry.
    - Add express-rate-limit middleware on POST /rest/user/login to cap requests to a safe threshold per IP (e.g., 10 per
      15 minutes).
