  - T-024
  - T-027
  - T-031
  - T-036
- id: auth-session
  name: Authentication and Session Management
  description: JWT-based authentication and session subsystem co-located with the backend. Issues RS256-signed tokens via
    a hardcoded RSA private key, maintains an in-memory token-to-user map, performs bcrypt password verification, and provides
    express-jwt middleware for route protection.
