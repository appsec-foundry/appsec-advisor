      \ NULL`,\n  { model: UserModel, plain: true }\n)\n\n// After — parameterised ORM:\nUserModel.findOne({\n  where: {\n\
      \    email: req.body.email,\n    password: security.hash(req.body.password || ''),\n    deletedAt: null\n  }\n})"
