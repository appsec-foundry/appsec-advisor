- local_id: auth-005
  threat_category_id: TH-03
  stride: Information Disclosure
  cwe: CWE-328
  title: Unsalted MD5 Password Hashing — lib/insecurity.ts:41
  scenario: All user passwords are stored as unsalted MD5 digests via `crypto.createHash('md5').update(data).digest('hex')`
    at `lib/insecurity.ts:41`. MD5 is a fast, non-key-stretching hash; the absence of a per-user salt means identical passwords
    produce identical digests. If an attacker exfiltrates the Users table — through the SQL injection at routes/login.ts:34,
    a separate SQLi, or direct DB access — every password can be cracked against public rainbow tables within minutes. The
    login handler at routes/login.ts:34 also embeds the MD5 hash of the supplied password directly in the query string, enabling
    an attacker who can observe query logs to extract the hash without needing the plaintext.
  evidence_summary: '`export const hash = (data: string) => crypto.createHash(''md5'').update(data).digest(''hex'')` at `lib/insecurity.ts:41`
    uses MD5 with no salt for password hashing.'
  impact_description: All stored user passwords are trivially recoverable from the database if the Users table is exfiltrated,
    enabling mass credential compromise and cross-site reuse attacks.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None. No bcrypt, scrypt, Argon2, or PBKDF2 is used. No salt is applied.
  mitigation_title: Replace MD5 with Argon2id for Password Hashing with Per-User Salt
  remediation:
    effort: High
    steps:
    - Replace `crypto.createHash('md5')` in `lib/insecurity.ts:41` with `argon2.hash(password)` from the `argon2` npm package
      (Argon2id profile, at least memory=65536, iterations=3, parallelism=4).
    - 'Migrate existing password hashes: on next successful login, re-hash the verified plaintext with Argon2id and store
      the new hash; reject logins for accounts that have not re-hashed after a migration window.'
    - Update the login query (routes/login.ts:34) to fetch the user by email only, then verify the submitted password against
      the stored hash with `argon2.verify(storedHash, submittedPassword)` — this eliminates the password hash from the SQL
      query string entirely.
    - Enforce a minimum password length of 8 characters and cap input at 1000 UTF-8 bytes before hashing to prevent DoS via
      hash input.
    code_example: null
    verification: After migration, exfiltrate the Users table and attempt MD5 rainbow-table cracking against the hashes. All
      hashes must be Argon2id format (starting with `$argon2id$`) and resistant to offline cracking within a reasonable time
      budget.
    reference: CWE-328
  evidence:
  - file: lib/insecurity.ts
    line: 41
  evidence_check: verified
  prior_finding_ref: null
