- local_id: auth-007
  threat_category_id: TH-06
  stride: Elevation of Privilege
  cwe: CWE-862
  title: JWT Role Claim Trusted Without DB Re-Validation — lib/insecurity.ts:154
  scenario: 'All role-based authorization decisions in the application — `isAccounting()` at insecurity.ts:154, `isDeluxe()`
    at insecurity.ts:165, `isCustomer()` at insecurity.ts:170 — extract the `role` field from the JWT payload using `decode(jwtFrom(req))`
    and compare it to a role constant without re-fetching the user''s current role from the database. Because the JWT is the
    sole source of truth for the caller''s role, any capability that enables JWT token issuance with an attacker-controlled
    payload (the committed private key at auth-001, the alg:none bypass at auth-002) immediately translates into full vertical
    privilege escalation: setting `data.role: ''admin''` in the forged token grants unconditional access to every admin-gated
    route. Additionally, a legitimately issued token retains its role indefinitely until expiry (6 hours), even if the user''s
    role is downgraded server-side.'
  evidence_summary: '`isAccounting()` at `lib/insecurity.ts:154` reads `decodedToken?.data?.role` from the JWT payload and
    authorizes without any DB lookup to confirm the current role.'
  impact_description: Any JWT-forgery primitive (committed private key or alg:none bypass) immediately yields full admin access;
    role changes made server-side do not take effect until token expiry.
  likelihood: Medium
  impact: Critical
  risk: High
  controls_in_place: JWT signature validation via RS256 (when the algorithm is correctly pinned). Tokens expire after 6 hours.
  mitigation_title: Re-Validate Sensitive Role Claims Against Database on Each Privileged Request
  remediation:
    effort: Medium
    steps:
    - 'For every admin or accounting route, supplement JWT role claim checks with a database lookup: `const dbUser = await
      UserModel.findByPk(decodedToken.data.id); if (dbUser?.role !== roles.accounting) return res.status(403).json({error:''Forbidden''});`.'
    - Implement short-lived tokens (max 15 minutes for privileged sessions) or use an opaque session token that references
      a server-side session entry that can be invalidated immediately on role change or logout.
    - Add the user's current role to a deny-list (Redis or DB) on role downgrade or logout, and check the deny-list in `isAuthorized()`
      before accepting any token.
    code_example: null
    verification: Log in as admin, downgrade the account's role in the DB, then immediately attempt to access an admin-only
      endpoint with the original JWT. With the fix applied, the response must be HTTP 403; without it, the existing token
      grants continued admin access for up to 6 hours.
    reference: CWE-862
