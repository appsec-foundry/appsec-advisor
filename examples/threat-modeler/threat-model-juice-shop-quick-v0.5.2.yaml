  title: Unbounded Chat Request Resource Consumption — routes/chat.ts:191
  scenario: 'The `POST /rest/chat` handler applies no rate limiting middleware and accepts `req.body.messages` as an unbounded
    array at line 191. Every request triggers a `streamText` call to the external LLM API, opening a streaming connection
    for up to 10 agentic steps (`stopWhen: stepCountIs(10)` at line 209). An authenticated attacker can submit thousands of
    parallel requests, each carrying a large message history, simultaneously consuming: (a) server-side streaming connections
    held open during LLM processing, (b) the operator''s LLM API token budget (input tokens priced per token multiplied by
    history size), and (c) Sequelize connection pool slots if `searchProducts` or `getOrderById` is triggered on each step.
    The Prometheus token-usage counters at lines 243–251 track cost post-hoc but do not enforce any cap.'
  evidence_summary: '`const messages = req.body?.messages ?? []` at line 191 passes the full user-controlled array to `streamText`
    with no length cap, size check, or rate-limit middleware preceding the call.'
  impact_description: A single authenticated user can exhaust LLM API token budget and degrade chat availability for all users
    at negligible personal cost.
  likelihood: High
  impact: High
  risk: High
  owasp_llm_ids: []
  controls_in_place: '`stopWhen: stepCountIs(10)` caps agentic iterations per individual request. JWT authentication is required,
    which prevents unauthenticated access.'
  mitigation_title: Add rate limiting and message-history size cap to POST /rest/chat
  remediation:
    effort: Low
    steps:
    - Apply `express-rate-limit` middleware to `POST /rest/chat` with a per-user (JWT `sub`) window, e.g. 20 requests per
      minute, stored in a shared Redis instance to be effective across process replicas.
    - 'Reject requests where `req.body.messages` exceeds a maximum length (e.g., 50 messages) or total character count (e.g.,
      32,000 characters): `if (messages.length > 50) return res.status(400).json({ error: ''Message history too long'' })`.'
    - Set a maximum per-request token budget in `streamText` via the `maxTokens` option (Vercel AI SDK) to bound LLM API cost
      per call.
    code_example: "// In server.ts or the chat router:\nimport rateLimit from 'express-rate-limit'\nconst chatLimiter = rateLimit({\n\
