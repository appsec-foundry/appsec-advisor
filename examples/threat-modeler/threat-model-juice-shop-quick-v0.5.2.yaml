  stride: Spoofing
  cwe: CWE-321
  title: Hard-coded RSA Private Key — lib/insecurity.ts:21
  scenario: 'The RSA private key used to sign all JWTs is committed verbatim to `lib/insecurity.ts` at line 21. Anyone with
    read access to the source repository — including public GitHub forks, CI artefact logs, or any developer machine — can
    extract the key and use it to sign arbitrary JWTs. Because the same private key signs tokens for every user (customers,
    accounting, admin), the attacker can forge a token for the admin account without ever providing credentials. The `security.authorize()`
    function on line 54 calls `jwt.sign(user, privateKey, { algorithm: ''RS256'' })`, so a validly-signed forged token passes
    every downstream `security.isAuthorized()` check.'
  attack_steps:
  - An attacker clones the public repository and copies the RSA private key literal from `lib/insecurity.ts:21`.
  - The attacker signs a JWT with `jwt.sign({data:{id:1,role:'admin',email:'admin@juice-sh.op'}}, privateKey, {algorithm:'RS256'})`
    using the extracted key.
  - The attacker includes the forged token as a Bearer header on any protected endpoint; the server's `expressJwt` middleware
    accepts it as an authentic admin session.
  evidence_summary: '`const privateKey = ''[PEM PRIVATE KEY — REDACTED]...''` at `lib/insecurity.ts:21` stores the full 1024-bit
    signing key as a string literal.'
  impact_description: 'Full authentication bypass: an attacker obtains a valid signed JWT for any user, including admin, without
    knowledge of any password.'
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: JWT is signed with RS256; the public key is read from a file (`encryptionkeys/jwt.pub`) rather than hardcoded.
    However the private key is committed inline, negating the benefit.
  mitigation_title: Remove Private Key from Source and Rotate via External Secret Store
  remediation:
    effort: High
    steps:
    - Immediately rotate the RSA key pair; invalidate all tokens signed with the exposed key.
    - Store the new private key in an external secret manager (e.g., HashiCorp Vault, AWS Secrets Manager, environment variable
      injected at runtime) — never in source files.
    - Update `lib/insecurity.ts:21` to read the private key from `process.env.JWT_PRIVATE_KEY` (or a mounted secret file path)
      and fail application startup when the variable is absent.
    - Add a pre-commit hook and CI secret-scan (e.g., `truffleHog`, `gitleaks`) to prevent future key commits.
    - Purge the exposed key from git history using `git filter-repo`.
    code_example: '// Before (insecurity.ts:21) — key literal in source:

      const privateKey = ''[PEM PRIVATE KEY — REDACTED]\r\nMIICXAI...'';


      // After — read from environment at startup, fail-closed:

      const privateKey = process.env.JWT_PRIVATE_KEY;

      if (!privateKey) throw new Error(''JWT_PRIVATE_KEY is required'');'
    verification: After rotation, attempt to sign a JWT with the old private key and submit to GET /rest/whoami. The server
      must return HTTP 401. Confirm CI secret-scan blocks a test commit containing a PEM key.
    reference: CWE-321
