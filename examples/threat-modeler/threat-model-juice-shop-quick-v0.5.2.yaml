  title: No rate limit on POST /rest/user/login allows unbounded — server.ts:596
  scenario: An unauthenticated attacker sends POST /rest/user/login in a tight loop with credential-guessing payloads. No
    rate-limiting middleware is registered on this route — the only rateLimit() call in server.ts (line 343) covers /rest/user/reset-password.
    Each request triggers a raw SQL query and an MD5 hash operation; sustained volume exhausts database connection pool threads
    and degrades availability, while also enabling offline-speed credential enumeration against MD5-hashed passwords.
  attack_steps: null
  evidence_summary: server.ts:596 registers app.post('/rest/user/login', login()) with no preceding rateLimit() or throttle
    middleware; server.ts:343 applies rateLimit only to /rest/user/reset-password.
  impact_description: Unlimited credential-guessing enables account takeover and connection-pool exhaustion; no lockout or
    throttle boundary exists on the primary authentication endpoint.
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: None on the login route; rate limiting exists at server.ts:343 for password reset only.
  mitigation_title: Apply per-IP and per-account rate limiting to POST /rest/user/login in server.ts
  actor_ids:
  - ACT-D-01
  primary_actor: ACT-D-01
  remediation:
