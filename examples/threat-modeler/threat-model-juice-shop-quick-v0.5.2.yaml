- local_id: frontend-spa-004
  threat_category_id: TH-04
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-922
  title: Insecure Client-Side Storage of JWT and TOTP Token — login.component.ts:101
  scenario: 'The Angular SPA stores the session JWT in `localStorage` at `login.component.ts:101` and a temporary TOTP pre-authentication
    token at line 120 (`localStorage.setItem(''totp_tmp_token'', error.data.tmpToken)`). The `app.guard.ts` reads the JWT
    directly from `localStorage` at lines 18 and 35. Because `localStorage` is accessible to any JavaScript executing in the
    same origin — including injected XSS payloads — both tokens are the primary exfiltration target for the reflected DOM-XSS
    at `search-result.component.ts:143` (frontend-spa-002). No Backend-for-Frontend proxy holds tokens server-side. The JWT
    is not protected by an `HttpOnly; Secure; SameSite=Strict` cookie that would make it inaccessible to JavaScript. This
    is the SPA-without-BFF architectural anti-pattern: the component description explicitly notes ''No backend-for-frontend
    intermediary'', confirming that the token must live in browser-accessible storage.'
  evidence_summary: login.component.ts:101 writes the session JWT to `localStorage` with no HttpOnly-cookie boundary; any
    same-origin JavaScript can read it via `localStorage.getItem('token')`.
  impact_description: A successful XSS exploit at any same-origin endpoint immediately yields the victim's JWT and TOTP pre-auth
    token, enabling full session takeover.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: A session cookie is also set via `ngy-cookie` alongside localStorage, but `ngy-cookie` does not set `HttpOnly`
    by default, and the JWT remains simultaneously accessible via `localStorage`, negating the cookie layer's protection.
  mitigation_title: Replace localStorage token storage with an HttpOnly session cookie issued by a Backend-for-Frontend proxy
  remediation:
    effort: High
    steps:
    - 'Introduce a Backend-for-Frontend session endpoint (e.g., `POST /api/session`) in the Express backend that consumes
      the JWT from the current login flow and issues `Set-Cookie: session=<opaque-id>; HttpOnly; Secure; SameSite=Strict`.
      The SPA receives only the opaque session cookie — never the raw JWT in JavaScript-accessible storage.'
    - Remove `localStorage.setItem('token', authentication.token)` at `login.component.ts:101` and `localStorage.setItem('totp_tmp_token',
      ...)` at line 120, and every corresponding `localStorage.getItem('token')` read in `app.guard.ts` and other callers.
      Replace with the cookie-authenticated session model.
    - 'If a full BFF refactor is not feasible immediately, at minimum set `httpOnly: true` on the `ngy-cookie` `put()` call
      and stop writing to `localStorage` — this alone prevents JavaScript-readable token theft from XSS.'
    code_example: '// BEFORE (login.component.ts:101):

      localStorage.setItem(''token'', authentication.token) // XSS-accessible


      // AFTER — BFF session endpoint returns an HttpOnly cookie; no localStorage write:

      // The Express BFF route sets: res.cookie(''session'', opaqueId, { httpOnly: true, secure: true, sameSite: ''strict''
      })

      // The Angular side needs no token storage — the browser sends the cookie automatically.'
    verification: After login, open DevTools → Application → Local Storage — no 'token' key must appear. Open Application
      → Cookies — a 'session' cookie must be present and marked HttpOnly (no JavaScript access via `document.cookie`).
    reference: CWE-922
  evidence:
  - file: frontend/src/app/login/login.component.ts
    line: 101
