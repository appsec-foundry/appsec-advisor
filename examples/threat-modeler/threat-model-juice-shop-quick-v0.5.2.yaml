assets:
- id: A-001
  name: User Credentials
  classification: Confidential
  description: 'Email addresses and bcrypt-hashed passwords for all registered users stored in the SQLite users table. Compromise
    enables account takeover across all user accounts. Evidence: models/user.ts, routes/login.ts.'
  linked_threats:
  - T-003
  - T-004
  - T-012
  - T-013
  - T-022
  - T-036
  evidence_flags: []
- id: A-002
  name: JWT Signing Private Key
  classification: Restricted
  description: RSA-2048 private key hardcoded in lib/insecurity.ts at line 21 used to sign all session tokens. Any party with
    this key can forge valid tokens for any user identity including admin accounts.
  linked_threats:
  - T-001
  - T-002
  - T-005
  - T-010
  - T-011
  - T-013
  - T-026
  - T-027
  - T-035
  evidence_flags:
  - hardcoded_secret
  - repo_committed
- id: A-003
  name: Session Tokens (JWT)
  classification: Confidential
  description: RS256-signed JWTs issued at login and stored by the frontend in localStorage (frontend/src/app/Services/basket.service.ts:64).
    Exposure via XSS grants full authenticated access to the token holder's account for up to 6 hours.
  linked_threats:
  - T-002
  - T-009
  - T-012
  - T-019
  - T-032
  evidence_flags:
  - client_side_storage
- id: A-004
  name: Payment Card Data
  classification: Restricted
  description: Credit and debit card numbers stored in the cards table (models/card.ts). Accessible to authenticated users
    via /api/Cards/:id with missing authorization checks. Regulatory exposure under PCI-DSS if the application were production-deployed.
  linked_threats:
  - T-003
  - T-004
  - T-006
  - T-012
  - T-022
  evidence_flags: []
- id: A-005
  name: User Personal Data and Order History
  classification: Confidential
  description: Delivery addresses, order history, basket contents, and user profile data persisted in SQLite. Reachable via
    multiple missing-authz API endpoints (e.g., /rest/user/data-export, /api/Addresss/:id). GDPR-category PII.
  linked_threats:
  - T-003
  - T-004
  - T-006
  - T-007
  - T-012
  - T-022
  evidence_flags: []
- id: A-006
  name: Challenge Progress and Application State
  classification: Internal
  description: User challenge completion records, continue-code tokens, and scoreboard state stored in the database. Manipulation
    via unauthenticated /rest/continue-code/apply/:continueCode endpoints would corrupt training-session integrity.
  linked_threats:
  - T-030
  evidence_flags: []
- id: A-007
  name: Application Source and CI/CD Build Artifacts
  classification: Internal
  description: Source code, compiled Angular SPA, Docker images, and SBOM artifacts produced by GitHub Actions and GitLab
    CI pipelines. Images are not digest-pinned and no container signing (cosign) is in place, creating integrity gaps.
  linked_threats: []
  evidence_flags:
  - no_image_signing
  - no_digest_pinning
