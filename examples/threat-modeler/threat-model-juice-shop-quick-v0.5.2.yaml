  impact: High
  risk: High
  controls_in_place: The Angular route guard prevents accidental UI navigation to admin routes for standard users. It does
    not constitute a server-side security boundary and makes no server request to verify the token or role.
  mitigation_title: Remove client-side role verification from Angular route guards and rely on server-side authorization
  remediation:
