  title: SQL Injection in Login Credential Query — routes/login.ts:34
  scenario: 'The login handler builds its SQL query by string-interpolating user-supplied `req.body.email` and the MD5 hash
    of `req.body.password` directly into a `models.sequelize.query()` call at `routes/login.ts:34`. An attacker can supply
    `'' OR 1=1--` as the email value, causing the WHERE clause to evaluate to `1=1` and returning the first user row — typically
    the admin account. Because `{ model: UserModel, plain: true }` is used, the first matching row is returned directly and
    a JWT is issued for it. No prepared-statement or parameterised-query protection is present.'
  attack_steps:
  - 'An attacker sends `POST /rest/user/login` with JSON body `{"email": "'' OR 1=1--", "password": "anything"}`.'
  - The server interpolates the input into `SELECT * FROM Users WHERE email = '' OR 1=1--' AND password = ...`, which returns
    the first user row (admin).
  - The server calls `afterLogin` with the returned admin record and issues a fully valid JWT for the admin account.
  evidence_summary: '`models.sequelize.query(''SELECT * FROM Users WHERE email = \'''' + req.body.email + ''\'' ...'', ...)`
    at `routes/login.ts:34` uses string concatenation for user-controlled input.'
  impact_description: 'Unauthenticated admin access: an attacker bypasses credential verification and receives a valid admin
    JWT without knowing any password.'
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None. The query uses raw string interpolation with no parameterisation or input sanitisation.
  mitigation_title: Replace String-Interpolated Sequelize Query with Parameterised ORM Finder
  remediation:
    effort: Medium
    steps:
    - 'Replace `models.sequelize.query(\`SELECT * FROM Users WHERE email = ''${email}''...\`)` with `UserModel.findOne({ where:
      { email: req.body.email, password: security.hash(req.body.password), deletedAt: null } })` to use Sequelize''s parameterised
      ORM layer.'
    - Remove the raw `sequelize.query()` call entirely; Sequelize's `findOne` with a plain where-object issues a parameterised
      prepared statement automatically.
    - Add integration tests that supply SQL metacharacters (`' OR 1=1--`, `; DROP TABLE Users;`) and assert HTTP 401 is returned
      with no authentication token.
    code_example: "// Before (routes/login.ts:34) — vulnerable raw query:\nmodels.sequelize.query(\n  `SELECT * FROM Users\
