  cwe: CWE-522
  title: Derived OAuth Credential from Email Claim — oauth.component.ts:30
  scenario: 'When a user first authenticates via Google OAuth, `oauth.component.ts:30` derives a deterministic password as
    `btoa(profile.email.split('''').reverse().join(''''))`. Line 31 then calls `userService.save({ email, password, passwordRepeat:
    password })`, registering this derived value as the user''s permanent Juice Shop password. The same derivation appears
    at line 46 for subsequent logins. Any attacker who learns the victim''s email address — from a public profile, a data
    breach, or basic social engineering — can compute the exact password offline and authenticate directly to the standard
    `/rest/user/login` endpoint, bypassing Google entirely. The OAuth security model is collapsed: knowledge of the email
    becomes sufficient for full account access.'
  attack_steps:
  - An attacker discovers a victim's Google account email from a public source such as LinkedIn or a prior credential breach
    dump.
  - The attacker computes the victim's Juice Shop password locally with `btoa(email.split('').reverse().join(''))`, replicating
    the derivation in oauth.component.ts:30.
  - The attacker submits the email and derived password to `POST /rest/user/login`, receives a valid JWT, and controls the
    victim's account without triggering any Google OAuth prompt.
  evidence_summary: oauth.component.ts:30 constructs a deterministic password from the reversed base64-encoded email; line
    31 registers this value as the account credential, making the Google OAuth flow irrelevant to password strength.
  impact_description: Full account takeover for every Juice Shop user who logged in via Google OAuth, requiring only the victim's
    email address as the sole prerequisite.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Google OAuth integration provides a first-factor challenge, but the derived-password pattern eliminates
    its security benefit by creating a local credential that is deterministically computable from the email alone.
  mitigation_title: Replace derived-credential OAuth pattern with direct ID-token verification and PKCE code flow
  remediation:
    effort: High
    steps:
    - 'Remove `userService.save({ email, password, passwordRepeat: password })` from `oauth.component.ts`. The backend must
      accept the Google ID token directly via `POST /rest/user/login` with `{ oauth: true, idToken: <googleIdToken> }` and
      verify its signature, `iss`, `aud`, and `exp` server-side against Google''s JWKS endpoint.'
    - Delete the password-derivation expressions `btoa(email.split('').reverse().join(''))` from `oauth.component.ts` lines
      30 and 46; remove the `userService.save` and `userService.login` calls that depend on them.
    - Switch `login.component.ts:148` from `response_type=token` (implicit flow) to `response_type=code&code_challenge=<S256>&code_challenge_method=S256`
      (PKCE authorization-code flow) and generate a random `state` parameter on each authorization request, validating it
      on callback.
    code_example: '// BEFORE (oauth.component.ts:30-31):

      const password = btoa(profile.email.split('''').reverse().join(''''))

      this.userService.save({ email: profile.email, password, passwordRepeat: password })


      // AFTER — pass the Google ID token to the backend; no local password is created:

      this.userService.oauthLogin(googleIdToken).subscribe({ next: () => this.router.navigate([''/'']) })'
    verification: 'After removing the derived-password path, attempt `POST /rest/user/login` with `{ email: <victim-email>,
      password: btoa(email.split('''').reverse().join('''')) }` — the server must return 401 because no local password credential
      should exist for OAuth-only accounts.'
    reference: CWE-522
