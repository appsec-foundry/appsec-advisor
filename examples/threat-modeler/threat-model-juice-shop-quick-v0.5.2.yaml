- local_id: backend-api-003
  threat_category_id: TH-05
  stride: Tampering
  cwe: CWE-94
  title: Server-Side Code Injection — routes/b2bOrder.ts:23
  scenario: 'routes/b2bOrder.ts:23 passes body.orderLinesData — an arbitrary attacker-controlled string from the POST /b2b/v2/orders
    request body — directly to vm.runInContext(''safeEval(orderLinesData)'', sandbox, { timeout: 2000 }). notevil''s safeEval
    is not a production-grade sandbox; known bypass techniques allow escaping the restricted context and executing arbitrary
    Node.js code in the server process. The 2-second vm timeout prevents trivial infinite loops but does not block code execution
    payloads. The endpoint requires authentication (isAuthorized() at server.ts:424), so exploitation requires a valid JWT
    — easily obtained via the hardcoded signing key (backend-api-001).'
  attack_steps:
  - 'An attacker authenticates (or forges a JWT via backend-api-001) and sends POST /b2b/v2/orders with body {"orderLinesData":
    "<safeEval sandbox escape payload>"}.'
  - The server evaluates the payload inside vm.runInContext and, on successful escape, executes arbitrary Node.js code in
    the server process.
  - The attacker uses the code execution to read process.env (exposing secrets), exfiltrate database contents, or establish
    a reverse shell.
  evidence_summary: 'routes/b2bOrder.ts:23 calls vm.runInContext(''safeEval(orderLinesData)'', sandbox, { timeout: 2000 })
    where orderLinesData equals req.body.orderLinesData with no structural schema validation.'
  impact_description: A notevil sandbox escape grants arbitrary server-side code execution at the Node.js process privilege
    level, enabling full host compromise.
  likelihood: Medium
  impact: Critical
  risk: High
  controls_in_place: notevil safeEval sandbox and a 2-second vm timeout prevent trivial DoS; authentication is required on
    /b2b/v2.
  mitigation_title: Replace expression evaluation with a strict JSON-schema-validated data structure for B2B order lines
  remediation:
    effort: Medium
    steps:
    - Remove the vm.runInContext and safeEval call from routes/b2bOrder.ts entirely.
    - 'Define a strict zod or joi schema for order data: an array of {productId: z.number().int().positive(), quantity: z.number().int().positive()}
      and parse req.body.orderLinesData against it.'
    - Return HTTP 400 with a descriptive error if the input does not match the schema; never evaluate the raw string.
    code_example: '// Before (routes/b2bOrder.ts:19-23):

      const orderLinesData = body.orderLinesData || ''''

      vm.runInContext(''safeEval(orderLinesData)'', sandbox, { timeout: 2000 })


      // After:

      import { z } from ''zod'';

      const orderLineSchema = z.array(z.object({ productId: z.number().int().positive(), quantity: z.number().int().positive()
      }));

      const lines = orderLineSchema.parse(JSON.parse(body.orderLinesData));'
    verification: Send POST /b2b/v2/orders (authenticated) with orderLinesData set to 'while(true){}' and confirm HTTP 400
      is returned instead of a 503 timeout or code execution.
    reference: CWE-94
  evidence:
  - file: routes/b2bOrder.ts
    line: 23
  boundary_refs:
