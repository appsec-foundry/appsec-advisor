  stride: Elevation of Privilege
  cwe: CWE-285
  title: LLM Excessive Agency Uncapped Discount in generateCoupon — routes/chat.ts:179
  scenario: 'The `generateCoupon` tool''s `inputSchema` at `routes/chat.ts:179` defines the `discount` field as `z.number().describe(''The
    discount percentage for the coupon (maximum 10)'')`. The `.describe()` text is advisory to the LLM and not a Zod validation
    constraint — `z.number().max(10)` is absent. When `execute` runs at line 181, `discount` can be any number supplied by
    the LLM. Through prompt injection (see llm-chat-service-002), an attacker causes the model to call `generateCoupon({discount:
    100})`. The `execute` function passes this directly to `security.generateCoupon(100)` at line 184, which generates a fully
    valid 100% discount coupon. The `chatbotGreedyInjectionChallenge` marker at line 183 (`discount >= 50`) confirms the platform
    authors treat this as an intentional exploit path. An authenticated user with no special permissions obtains a coupon
    that eliminates any order cost.'
  attack_steps:
  - An attacker sends a prompt-injected chat message instructing the LLM to ignore the 10% cap and issue the maximum possible
    discount.
  - 'The LLM calls `generateCoupon` with `{discount: 100}` because `z.number()` at `chat.ts:179` imposes no upper-bound constraint.'
  - At `chat.ts:184`, `security.generateCoupon(100)` executes and returns a valid 100% coupon code that the attacker redeems
    at checkout for a free order.
  evidence_summary: '`z.number().describe(''...maximum 10'')` at line 179 expresses the cap only as hint text; `security.generateCoupon(discount)`
    at line 184 receives the raw LLM-provided value with no server-side validation.'
  impact_description: An attacker with a standard account obtains arbitrarily large coupons, resulting in free or heavily
    discounted purchases and direct financial loss to the operator.
  likelihood: High
  impact: High
  risk: High
  owasp_llm_ids:
  - LLM06
  controls_in_place: System prompt instructs the LLM that the maximum discount is 10%. Zod `describe()` text repeats the limit
    as advisory. JWT authentication is required.
  mitigation_title: Enforce the discount cap server-side in the generateCoupon tool execute function
  remediation:
    effort: Low
    steps:
    - Change `z.number()` to `z.number().min(1).max(10)` at line 179 so Zod rejects any discount outside the permitted range
      before `execute` runs.
    - 'Add a runtime guard inside `execute` as defence-in-depth: `const capped = Math.min(Math.max(discount, 1), 10)` and
      pass `capped` to `security.generateCoupon()` rather than the raw `discount` value.'
    - Log the original LLM-requested discount alongside the capped value so attempted over-discount injections are visible
      in the audit trail.
    code_example: '// routes/chat.ts:179 — Before:

      discount: z.number().describe(''The discount percentage for the coupon (maximum 10)'')


      // After — Zod enforces the bound; execute adds runtime guard:

      discount: z.number().min(1).max(10).describe(''The discount percentage (1–10%)'')

      // Inside execute:

      const capped = Math.min(Math.max(discount, 1), 10)  // defence-in-depth

      const couponCode = security.generateCoupon(capped)'
    verification: 'Submit a prompt that instructs the bot to generate a 50% coupon. Confirm that `security.generateCoupon`
      is either not called, or called with a value of at most 10. Verify a Zod validation error is thrown (and not surfaced
      to the user) when the LLM attempts to call the tool with `{discount: 50}`.'
    reference: CWE-285
  evidence:
  - file: routes/chat.ts
    line: 179
  boundary_refs:
