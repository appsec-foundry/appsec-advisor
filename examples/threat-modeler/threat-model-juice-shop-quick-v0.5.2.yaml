- entry_point: POST /b2b/v2/orders
  protocol: HTTP
  auth_required: true
  notes: POST /b2b/v2/orders — B2B order endpoint; JWT bearer required but accepts arbitrary JSON body (XXE / injection)
- entry_point: POST /profile
  protocol: HTTP
  auth_required: false
  notes: POST /profile — unauthenticated profile POST; authentication enforcement gap
  relevance_tags:
