    nullifies the password clause.
  - 'The resulting query becomes: SELECT * FROM Users WHERE email = ''admin@juice-sh.op''--'' AND password = ''...'' — returning
    the admin row unconditionally.'
  - Server issues a valid JWT for the admin account via security.authorize() at routes/login.ts:24, granting full administrative
    access.
  evidence_summary: routes/login.ts:34 constructs the authentication query by direct template-literal interpolation of req.body.email
    and security.hash(req.body.password), with no parameterized binding or ORM where-clause usage.
  impact_description: Attacker bypasses authentication for any user account, can enumerate or exfiltrate the full Users table,
    and may corrupt or delete records depending on database permissions.
