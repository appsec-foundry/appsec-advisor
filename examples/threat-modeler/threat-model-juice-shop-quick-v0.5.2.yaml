components:
- id: frontend-spa
  name: Frontend SPA
  description: Angular 21 single-page application delivered to browser clients. Implements the shopping UI, challenge tracking,
    admin panel, and hacking-instructor overlays. Contains client-side auth guards (LoginGuard, AdminGuard) and stores JWT
    tokens in localStorage.
  paths:
  - frontend/**
  tier: client
  complexity: complex
  framework: angular
  deployment_zones:
  - internet
  - client-device
  handles_sensitive_data: true
  threat_ids:
  - T-009
  - T-012
  - T-019
  - T-023
  - T-030
- id: backend-api
  name: Backend API Server
  description: Node.js/Express application server exposing REST endpoints under /api/* and /rest/*, serving the Angular SPA
    as static assets, and hosting the Socket.IO WebSocket server for real-time challenge notifications. Implements challenge
    validation, file upload, order management, and AI chatbot logic.
  paths:
  - server.ts
  - app.ts
  - routes/**
  - lib/**
  tier: application
  complexity: complex
  framework: express
  deployment_zones:
  - internet
  - dmz
  handles_sensitive_data: true
  threat_ids:
  - T-002
  - T-004
  - T-006
  - T-007
  - T-008
  - T-010
  - T-011
  - T-014
  - T-018
