  stride: Elevation of Privilege
  cwe: CWE-602
  title: Client-Side-Only Role Enforcement in Angular Route Guards — app.guard.ts:54
  scenario: In `app.guard.ts`, `AdminGuard.canActivate()` at line 52 calls `loginGuard.tokenDecode()`, which uses `jwtDecode`
    from line 38 to decode the JWT stored in `localStorage` without verifying its signature. It then checks `payload.data.role
    === roles.admin` entirely in the browser. An attacker can write a forged JWT — for example one with `alg:none` and `{"data":{"role":"admin"}}`
    in the payload — directly into `localStorage` via the browser console. `tokenDecode()` at line 37 runs `jwtDecode(token)`
    which decodes without signature verification, and `AdminGuard.canActivate()` returns `true`, granting navigation to the
    admin section. The `AccountingGuard` at line 64 has the identical flaw for the accounting role. The guards never make
    an HTTP call to the backend to validate the token's signature or confirm the role.
  attack_steps:
