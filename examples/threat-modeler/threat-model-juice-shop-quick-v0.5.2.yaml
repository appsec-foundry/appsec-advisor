  title: Unbounded In-Memory Token Store — lib/insecurity.ts:74
  scenario: An attacker issues unlimited login requests to POST /rest/user/login with no rate-limiting enforcement; each successful
    authentication appends an entry to the tokenMap plain Object at lib/insecurity.ts:74 with no eviction or size cap, causing
    the Node.js process heap to grow without bound until the server is killed by OOM or becomes unresponsive.
  attack_steps: null
  evidence_summary: authenticatedUsers.tokenMap is initialized as an empty plain Object at lib/insecurity.ts:71; the put()
    method at line 73 assigns entries unconditionally with no max-size check, TTL sweep, or LRU eviction policy.
  impact_description: Node.js process exhausts heap memory and crashes or becomes unresponsive, dropping all active user sessions
    stored exclusively in the same in-memory map.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: JWT 6-hour expiry limits token usefulness but does not evict map entries; no rate limiting on the login
    endpoint
  actor_ids:
