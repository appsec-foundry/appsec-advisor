  stride: Information Disclosure
  cwe: CWE-200
  title: CTF Flag Broadcast to All Connected Clients — lib/challengeUtils.ts:75
  scenario: At challengeUtils.ts:75, `globalWithSocketIO.io.emit('challenge solved', notification)` broadcasts the full notification
    payload to every connected Socket.IO client. The notification object (built at lines 62-70) includes `flag` (the CTF flag
    string from `utils.ctfFlag(challenge.name)`), the challenge `name`, `key`, and decoded `challenge` description. Because
    any unauthenticated client can connect (realtime-channel-001), a passive observer who joins the channel with no credentials
    can collect all CTF flags as challenges are solved by other users, and also receives all previously solved challenge notifications
    on connection via the `notifications.forEach` loop at registerWebsocketEvents.ts:29-31. This defeats the purpose of the
    per-challenge flag as a proof-of-exploitation credential.
  evidence_summary: '`io.emit(...)` at line 75 addresses all sockets indiscriminately; the notification payload at lines 62-70
    includes the `flag` field.'
  impact_description: An unauthenticated passive Socket.IO listener can harvest all CTF flags without performing any challenge,
    rendering the flag-based proof-of-exploitation model ineffective.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: The `hidden` field (line 67) is set when `challenges.showSolvedNotifications` is false in config, but
    the notification including the flag is still emitted — only the UI rendering is suppressed.
  mitigation_title: Restrict challenge solve broadcasts to the solving user's authenticated socket session
  remediation:
