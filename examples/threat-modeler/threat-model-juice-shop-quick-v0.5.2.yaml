security_controls:
- domain: Identity and Authentication Controls
  control: Password-Based Authentication
  kind: mechanism
  effectiveness: Unsafe
  assessment: Login at routes/login.ts uses raw SQL with string interpolation against MD5-hashed passwords (lib/insecurity.ts).
    MD5 is not a password hash — it is a digest function with no salt and no work factor. SQL injection in the login query
    allows auth bypass without a valid credential. Additional RSA private key committed to the repo (lib/insecurity.ts:24)
    enables offline JWT forgery independent of password checks.
  implementation: Password-based login is implemented in routes/login.ts. The credential lookup queries the SQLite User model;
    matching is done server-side against the stored hash. lib/insecurity.ts provides the signing key and hash helper. The
    routes/resetPassword.ts and routes/authenticatedUsers.ts files implement password reset and authenticated-user management.
  linked_threats: []
  subcontrols:
  - title: User Registration
    type: flow
    implementation: User registration accepted at the /register endpoint. Passwords are hashed with MD5 before storage (models/User.ts
      hashPassword hook).
    assessment: MD5 is cryptographically broken for password storage — no salt, trivially reversed via rainbow tables. Should
      be replaced with bcrypt/Argon2.
    relevant_findings: []
  - title: Password-Based Login
    type: flow
    implementation: routes/login.ts constructs a Sequelize query against User model filtering by email and hashed password.
      jsonwebtoken signs the resulting JWT on success.
    assessment: Raw SQL string interpolation in login query path allows SQL injection login bypass (intentionally vulnerable
      challenge). MD5 hash comparison further weakens the control.
    relevant_findings: []
  - title: Password Reset
    type: flow
    implementation: routes/resetPassword.ts implements security-question-based password reset. Users answer a pre-registered
      security question to change their password.
    assessment: Security questions are guessable; no rate limiting on reset attempts. Reset flow does not require email verification
      for the final password change.
    relevant_findings: []
  - title: Password Change
    type: flow
    implementation: routes/authenticatedUsers.ts allows authenticated users to change their password via the API.
    assessment: Requires active JWT session; password-change path inherits all JWT weaknesses. No re-authentication required
      for privilege operations.
    relevant_findings: []
  - title: Password Hashing
    type: primitive
    implementation: 'models/User.ts: beforeCreate/beforeUpdate hooks call a hashPassword function that applies MD5 to the
      plaintext password.'
    assessment: 'MD5 is a fast hash with no salt — trivially reversed. bcrypt, scrypt, or Argon2 required. CRITICAL: this
      is a security control that is intentionally broken.'
    relevant_findings: []
  group_subcontrols: false
- domain: Identity and Authentication Controls
  control: Social Login Adapter (OAuth / OIDC)
  kind: mechanism
  effectiveness: Weak
  assessment: routes/oauth.ts and frontend/src/app/oauth/oauth.component.ts implement an OAuth social login adapter. The frontend
    reads the access token from the redirect URI and calls a local login endpoint with the OAuth profile email, converting
    it into a local password-based session. This is a frontend-only adapter that does not implement a server-side authorization-code
    flow with PKCE. The final session inherits all weaknesses of password-based login (MD5, SQL injection risk, hardcoded
    key).
  implementation: Angular OAuth component reads the access token from the OAuth redirect response, fetches the user profile,
    and calls the backend /rest/user/login with the derived email. No IdP-issued id_token is consumed server-side; the session
    is a locally signed JWT.
  linked_threats: []
  subcontrols:
  - title: Social Login Adapter (OAuth / OIDC)
    type: flow
    implementation: frontend/src/app/oauth/oauth.component.ts extracts access_token from URL fragment, fetches email from
      IdP userinfo, then calls UserService.oauthLogin() which maps to the local login endpoint.
    assessment: Not a full OIDC authorization-code flow. No state parameter validated, no PKCE. Implicit-flow token handling
      in URL fragment is deprecated by OAuth 2.1. Local session issued carries no IdP binding.
    relevant_findings: []
- domain: Identity and Authentication Controls
  control: Multi-Factor Enrollment (TOTP)
  kind: mechanism
  effectiveness: Partial
  assessment: TOTP-based MFA is implemented via routes/2fa.ts using otplib. Enrollment and verification flows exist. However,
    the temporary TOTP setup token is stored in browser localStorage (frontend/src/app/login/login.component.ts:120) making
    it accessible to any XSS in the same origin. MFA is optional and not enforced for admin accounts.
  implementation: routes/2fa.ts provides TOTP setup and verification endpoints. otplib generates and verifies TOTP codes.
    The enrollment flow issues a temporary token stored in localStorage until MFA is confirmed.
  linked_threats: []
- domain: Identity and Authentication Controls
  control: Authentication Rate Limiting
  kind: primitive
  effectiveness: Missing
  assessment: No rate limiting detected on login (/rest/user/login), password-reset, or registration endpoints. Allows unlimited
    brute-force or credential-stuffing attempts without throttling. Helmet middleware provides no rate-limiting capability.
  implementation: null
  linked_threats: []
- domain: Session and Token Controls
  control: Session Token Signing (JWT Based)
  kind: lifecycle
  effectiveness: Unsafe
  assessment: lib/insecurity.ts:24 commits the RSA private key used for JWT signing to the public source repository. Any party
    with access to the repository can forge arbitrary JWT tokens for any user including admin. Additionally, jsonwebtoken@0.4.0
    is a 2014-era version known to accept the alg:none header, enabling signature bypass without knowledge of the key.
  implementation: lib/insecurity.ts exports the signing key (RS256 RSA key pair from encryptionkeys/). jsonwebtoken.sign()
    is called after successful authentication to issue the session token. The key is loaded at module load time from the committed
    file.
  linked_threats: []
  subcontrols:
  - title: Session Token Signing (JWT Based)
    type: lifecycle
    implementation: lib/insecurity.ts loads the RSA private key from encryptionkeys/ and calls jsonwebtoken.sign() with RS256
      algorithm.
    assessment: Private key committed to repository. jsonwebtoken@0.4.0 accepts alg:none — signature validation bypassed by
      stripping header. Both vectors allow unauthenticated admin access.
    relevant_findings: []
  - title: Session Token Validation (JWT Based)
    type: lifecycle
    implementation: express-jwt@0.1.3 middleware validates incoming JWT tokens on protected routes. The public key from lib/insecurity.ts
      is used for RS256 verification.
    assessment: express-jwt@0.1.3 is a 2013-era version with known vulnerabilities. Permissive algorithm acceptance enables
      alg:none bypass. No token allowlisting or revocation check.
    relevant_findings: []
  - title: Session Token Storage (Browser localStorage)
    type: lifecycle
    implementation: frontend/src/app/login/login.component.ts:101 stores the JWT in localStorage after successful login. frontend/src/app/app.guard.ts:18,35
      reads it on each navigation. Navbar and payment components also access localStorage for the token.
    assessment: localStorage is accessible to any JavaScript in the same origin. XSS in the Angular SPA (multiple bypassSecurityTrustHtml
      sites) can exfiltrate the token. No HttpOnly cookie alternative provided.
    relevant_findings: []
  - title: Session Token Revocation
    type: lifecycle
    implementation: No server-side revocation mechanism implemented. Logout is client-side only (localStorage removal).
    assessment: Stolen tokens remain valid until expiry. No blacklist, no server-side session invalidation. Logout does not
      invalidate the token server-side.
    relevant_findings: []
  - title: Session Token Expiry
    type: lifecycle
    implementation: JWT tokens include an exp claim configured at signing time.
    assessment: Expiry is the only time-based control. No idle timeout, no absolute maximum session duration enforced beyond
      the exp claim. No refresh-token rotation.
    relevant_findings: []
  group_subcontrols: false
- domain: Authorization Controls
  control: Role-Based Access Control
  kind: mechanism
  effectiveness: Weak
  assessment: Authorization is implemented as custom inline role checks in individual route handlers (isAdmin, isCustomer
    patterns in lib/middleware/security.ts and route files). No centralized RBAC framework or policy engine. Data-level authorization
    relies on user ID validation in queries, creating IDOR risk when ID parameters are user-controlled. No declarative access
    control policy.
  implementation: lib/middleware/security.ts provides helper functions for checking admin status from the decoded JWT payload.
    Route handlers call these helpers inline before processing. No unified authorization layer.
  linked_threats: []
- domain: Query Construction and Data Access Controls
  control: ORM-Based Query Construction
  kind: mechanism
  effectiveness: Partial
  assessment: Sequelize 6 ORM provides parameterized queries for the majority of database operations (models/*.ts), protecting
    standard CRUD paths against SQL injection. However, intentionally vulnerable challenge routes use raw SQL string interpolation
    — this is by design for the training application. Finale-REST auto-generates CRUD endpoints from Sequelize models, reducing
    injection risk in generated paths.
  implementation: models/*.ts define Sequelize models. Standard find/create/update/destroy operations use Sequelize's parameterized
    query builder. Some routes use Sequelize.query() with literal string interpolation for challenge content.
  linked_threats: []
- domain: Input Boundary Validation Controls
  control: Validation Approach
  kind: cross-cutting
  effectiveness: Weak
  assessment: No centralized input validation middleware or schema-enforcement layer. Each route handler validates inputs
    independently (or not at all in challenge routes). Express body-parser limits JSON body size implicitly. Multer handles
    multipart/file uploads. No allowlist-based type/range/format validation at request ingress.
  implementation: Express body-parser parses JSON and URL-encoded bodies. multer handles file uploads. Some endpoints have
    ad-hoc validation (email format checks, address field constraints). Challenge routes intentionally omit validation.
  linked_threats: []
- domain: Output Encoding and Rendering Controls
  control: Angular Template Rendering
  kind: mechanism
  effectiveness: Weak
  assessment: 'Angular 21 provides auto-escaping in template interpolation ({{ }}) by default. However, multiple components
    call DomSanitizer.bypassSecurityTrustHtml() to bypass this protection: about.component.ts:119, last-login-ip.component.ts:39,
    administration.component.ts:73+91, search-result.component.ts:110+143. innerHTML assignments in hacking-instructor/index.ts:126,142
    introduce DOM-XSS sinks. 35 XSS-pattern findings detected across 8 sites.'
  implementation: Angular 21.2.1 template rendering with DomSanitizer available for safe HTML injection. The bypassSecurityTrustHtml()
    API is used in training components to render user-controlled HTML as intentional challenges.
  linked_threats: []
  subcontrols:
  - title: Template Sanitization (Angular)
    type: surface
    implementation: Angular's default template engine auto-escapes {{ interpolations }}. Trusted HTML pipe bypasses this for
      intentional challenges.
    assessment: Default encoding present, but 6+ explicit bypasses weaken the control to effectively absent in affected components.
    relevant_findings: []
  - title: DOM Sanitizer Bypass Sites
    type: surface
    implementation: 'DomSanitizer.bypassSecurityTrustHtml() called in: about.component.ts:119, last-login-ip.component.ts:39,
      administration.component.ts:73,91, search-result.component.ts:110,143.'
    assessment: Each call is a potential reflected or stored XSS sink when upstream data is user-controlled.
    relevant_findings: []
  - title: '[innerHTML] Bindings'
    type: surface
    implementation: hacking-instructor/index.ts:126,142 assigns to innerHTML directly for hint rendering.
    assessment: Direct innerHTML assignment bypasses Angular's template sanitization entirely.
    relevant_findings: []
- domain: Browser and Cross-Origin Controls
  control: CORS Policy
  kind: mechanism
  effectiveness: Weak
  assessment: 'CORS is configured with a wildcard: app.use(cors()) and app.options(''*'', cors()) in the Express server. This
    reflects any Origin header without validation and enables cross-origin requests with credentials from any domain. No explicit
    origin allowlist is configured. config/default.yml may specify an allowlist but the wildcard app-level configuration takes
