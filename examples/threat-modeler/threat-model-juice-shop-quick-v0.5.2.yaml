- local_id: backend-api-005
  threat_category_id: TH-03
  stride: Information Disclosure
  cwe: CWE-321
  title: RSA JWT Private Key Committed to Source Repository — lib/insecurity.ts:21
  scenario: The RSA-1024 private key used to sign all authentication JWTs is embedded as a hardcoded PKCS#1 string literal
    at lib/insecurity.ts:21. Juice Shop is a public open-source repository, making the key accessible to any visitor. Additionally,
    server.ts:277-278 serves the /encryptionkeys directory — which contains jwt.pub and potentially other key material — without
    authentication. The git history retains every prior version of the key, so removing the literal via a new commit is insufficient;
    the key will remain readable in all prior revisions until history is rewritten. Possession of the private key enables
    complete session forgery (see backend-api-001) and makes future key rotation a complex multi-step operation.
