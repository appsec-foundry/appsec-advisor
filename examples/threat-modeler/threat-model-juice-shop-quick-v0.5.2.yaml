- entry_point: Socket.IO WebSocket Handshake (/socket.io)
  protocol: WSS (Socket.IO 3.1.2)
  auth_required: false
  notes: 'WebSocket upgrade handshake is unauthenticated at connection time. Events are broadcast to all connected clients
    (challenge notifications, score updates). JWT token is passed in the handshake query string and available client-side
    in localStorage. No origin validation beyond CORS headers. Bidirectional channel: server pushes challenge-solved events;
    client sends chatbot messages via emit(''startAssistant'').'
- entry_point: LLM Provider API (Ollama / OpenAI-compatible)
  protocol: HTTPS (Vercel AI SDK streaming)
  auth_required: null
  notes: 'Outbound SSRF-like surface: routes/chat.ts forwards user-supplied chat messages to a configurable LLM endpoint (OLLAMA_URL
    / OPENAI_API_KEY env vars). Prompt injection in user input reaches the LLM. Response streamed back via Socket.IO. No input
    sanitization or output filtering observed.'
- entry_point: GitHub Actions Runner (CI/CD workflow execution)
  protocol: HTTPS (GitHub Actions API)
  auth_required: true
  notes: Runner triggered by push/PR events. Workflows use unpinned action tag references (e.g. actions/checkout@v4) and missing
    permissions blocks (ci.yml, image_actions.yml). Secrets (DOCKER_USERNAME, DOCKER_PASSWORD, GITHUB_TOKEN) are injected
    as env vars. Compromise of a workflow dependency or supply-chain substitution can exfiltrate secrets or inject malicious
    builds.
- entry_point: Docker Hub Image Publish (CI artefact push)
  protocol: HTTPS (Docker Registry v2 API)
  auth_required: true
  notes: CI pipeline (release.yml) authenticates to Docker Hub with DOCKER_USERNAME/DOCKER_PASSWORD secrets and pushes bkimminich/juice-shop
    image. Images are not signed (no cosign/Sigstore). A supply-chain compromise could replace the published image with a
    backdoored variant.
- entry_point: Static File Server (/ftp, /encryptionkeys, /support/logs)
  protocol: HTTP (Express static middleware)
  auth_required: false
  notes: Express serves /ftp/, /encryptionkeys/, and /support/logs/ directories directly as unauthenticated static routes.
    Intentionally exposes backup files (.bak), encryption key material, and server log files as training challenges. In a
    production equivalent this would be a critical information-disclosure surface.
