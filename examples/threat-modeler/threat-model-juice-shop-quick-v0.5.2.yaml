- local_id: realtime-channel-005
  threat_category_id: TH-12
  stride: Denial of Service
  cwe: CWE-400
  title: Missing Rate Limit on WebSocket Connection and — registerWebsocketEvents.ts:19
  scenario: The Socket.IO server at registerWebsocketEvents.ts:19 has no connection rate limit, no per-socket event throttle,
    and no maximum concurrent connection cap. An attacker can open thousands of Socket.IO connections from a single IP, causing
    unbounded memory growth from the `io` connection table. The `notification received` handler (line 33) performs `notifications.splice(i,
    1)` for any flag value provided — an attacker can iterate over known challenge flag formats and systematically drain the
    global in-memory `notifications` array, disrupting notification delivery for all legitimate users until the next server
    restart.
  evidence_summary: '`registerWebsocketEvents.ts:19` creates the Socket.IO server with only a CORS option; no `maxHttpBufferSize`,
    connection limit, or rate-limiting middleware (`express-rate-limit`, `socket.io-rate-limiter`) is applied.'
  impact_description: An attacker can exhaust server memory via mass Socket.IO connections or permanently clear the global
    notifications store, denying challenge notification delivery to legitimate users.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None identified.
  mitigation_title: Add connection rate limiting and protect the notifications array from client-driven mutation
  remediation:
    effort: Low
    steps:
    - Apply a Socket.IO rate-limiting middleware (e.g. `socket.io-rate-limiter` or a custom `io.use(rateLimit(...))`) to cap
      connection attempts per source IP.
    - 'Remove unauthenticated write access to the `notifications` array: gate the `notification received` handler so only
      the socket''s authenticated user can acknowledge their own notifications, not remove arbitrary entries by flag value.'
    - 'Set `maxHttpBufferSize` on the Server constructor (e.g. `{ maxHttpBufferSize: 1e6 }`) to limit the maximum payload
      size per event.'
    code_example: null
    verification: Open 500 Socket.IO connections from a single IP in rapid succession and confirm the server enforces a per-IP
      connection cap by rejecting excess connections with `connect_error`.
    reference: CWE-400
