    origin_component_id: realtime-channel
    rationale: WebSocket connection handler at line 23 omits the expressJwt/io.use authentication step that tb-1's authentication
      leg requires for every state-changing route.
    leg: authentication
    evidence_locations:
    - file: lib/startup/registerWebsocketEvents.ts
      line: 23
