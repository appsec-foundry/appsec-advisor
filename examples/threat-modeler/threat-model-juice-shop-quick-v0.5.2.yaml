  title: Missing Append-Only Security Audit Log for Authentication — routes/login.ts:50
  scenario: 'The backend uses morgan HTTP access logging (server.ts) which records HTTP method, path, and response status
    to a rotating file. This log is mutable, process-writable, and contains no structured security context: no authenticated
    user identity, no authentication outcome, no role or resource accessed per request. Authentication failures at routes/login.ts:50
    emit only an HTTP 401 with no corresponding security event record. An attacker who successfully forges a JWT, performs
    SQL injection, or escalates privileges leaves no forensic record. If the attacker obtains write access to the log directory,
    they can destroy evidence of intrusion.'
  evidence_summary: routes/login.ts:50 emits HTTP 401 on failed authentication with no structured log statement; no security
    event emitter is imported or called in the login flow.
  impact_description: Post-incident investigation cannot determine which accounts were compromised, when a breach occurred,
    or which data was accessed.
  likelihood: High
  impact: Medium
  risk: High
