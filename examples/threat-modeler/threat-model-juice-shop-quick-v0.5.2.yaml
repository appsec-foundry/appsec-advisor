    who clones the public repository can reproduce these values locally in seconds and POST the private key to the unauthenticated
    `POST /rest/web3/submitKey` endpoint, triggering `challengeUtils.solveIf(challenges.nftUnlockChallenge, () => true)` at
    line 15 and marking the challenge solved without any legitimate on-chain interaction.
  attack_steps:
  - An attacker reads the hardcoded mnemonic from the public repository at `routes/checkKeys.ts:10`.
  - The attacker runs `HDNodeWallet.fromPhrase('purpose betray marriage blame crunch monitor spin slide donate sport lift
    clutch').privateKey` locally to derive the private key.
  - 'The attacker POSTs `{"privateKey": "<derived key>"}` to `POST /rest/web3/submitKey`, marking `nftUnlockChallenge` as
    solved at `routes/checkKeys.ts:15`.'
  evidence_summary: '`routes/checkKeys.ts:10` contains a literal BIP-39 mnemonic from which the wallet private key is deterministically
    derived and compared at lines 16 and 18.'
