  title: Missing Authentication on Web3 Endpoints — routes/web3Wallet.ts:15
  affected_parameter: walletAddress
  scenario: All five web3 route handlers are registered in `server.ts:641–645` without any `security.isAuthorized()` or `security.appendUserId()`
    middleware. An unauthenticated caller can POST to `POST /rest/web3/walletExploitAddress` with an arbitrary `walletAddress`,
    invoking `contractExploitListener()` at `routes/web3Wallet.ts:15`. Since no JWT is validated, the application has no verified
    identity for the submitter — any actor on the internet can impersonate a legitimate wallet holder and trigger challenge-state
    changes without possessing the corresponding on-chain credentials.
  attack_steps:
  - 'An attacker sends `POST /rest/web3/walletExploitAddress` with `{"walletAddress": "0xdeadbeef..."}` using no `Authorization`
    header.'
  - The server processes the request through `contractExploitListener()` at `routes/web3Wallet.ts:15`, adding the address
    to `walletsConnected` without any JWT validation.
  - The attacker repeats the pattern against `POST /rest/web3/walletNFTVerify` and `POST /rest/web3/submitKey`, bypassing
    authentication on every web3 operation.
  evidence_summary: '`routes/web3Wallet.ts:15` extracts `req.body.walletAddress` with no prior JWT middleware guard; `server.ts:641–645`
    registers all five web3 routes without `security.isAuthorized()`.'
  impact_description: Any unauthenticated actor can invoke all web3 challenge operations, submit arbitrary wallet addresses,
    and manipulate in-memory challenge state.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — no `security.isAuthorized()` or `security.appendUserId()` middleware is applied to any of the
    five web3 route registrations in `server.ts:641–645`.
  mitigation_title: Add `security.isAuthorized()` middleware to all web3 route registrations in server.ts
  remediation:
    effort: Low
    steps:
    - Add `security.isAuthorized()` as the second argument to every web3 route registration in `server.ts:641–645` — the same
      pattern already used by `app.patch('/rest/products/reviews', security.isAuthorized(), ...)`.
    - Verify the JWT claims (specifically `data.email`) are propagated into each handler so that the wallet address can be
      bound to the authenticated user's session.
    code_example: '// Before (server.ts:641-645 — no auth middleware)

      app.post(''/rest/web3/submitKey'', utils.asyncHandler(checkKeys()))

      app.post(''/rest/web3/walletNFTVerify'', walletNFTVerify())

      app.post(''/rest/web3/walletExploitAddress'', utils.asyncHandler(contractExploitListener()))


      // After — require a valid JWT on every state-changing web3 route

      app.post(''/rest/web3/submitKey'', security.isAuthorized(), utils.asyncHandler(checkKeys()))

      app.post(''/rest/web3/walletNFTVerify'', security.isAuthorized(), walletNFTVerify())

      app.post(''/rest/web3/walletExploitAddress'', security.isAuthorized(), utils.asyncHandler(contractExploitListener()))'
    verification: Send `POST /rest/web3/submitKey` without an `Authorization` header and confirm a `401 Unauthorized` response
