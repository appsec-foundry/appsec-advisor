- local_id: backend-api-006
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-639
  title: Insecure Direct Object Reference
  scenario: An authenticated attacker POSTs to /rest/basket/:id/checkout with a JSON body where UserId is set to a victim's
    user ID. The placeOrder handler uses req.body.UserId directly as the WHERE key for WalletModel.increment at routes/order.ts:157
    without comparing it to the JWT-authenticated user identity. The attacker credits loyalty points to any account and, through
    the paymentId=wallet path at line 150, can also decrement any account's balance.
  attack_steps:
  - Attacker authenticates as their own account and obtains a valid JWT; they enumerate a victim's user ID via GET /api/Users
    or GET /rest/user/whoami.
  - 'Attacker adds items to their own basket and POSTs /rest/basket/:their_basket_id/checkout with body {"UserId": <victimId>,
    "orderDetails": {"paymentId": "wallet"}}.'
  - placeOrder handler at routes/order.ts:150 calls WalletModel.decrement with the victim's UserId, draining the victim's
    wallet to pay for the attacker's order.
  - WalletModel.increment at routes/order.ts:157 credits loyalty points to the victim's wallet; the attacker can repeat to
    farm points or drain funds across arbitrary accounts.
  evidence_summary: routes/order.ts:146 reads req.body.UserId without validation; routes/order.ts:157 passes that value as
    the WHERE clause key to WalletModel.increment with no comparison against the JWT-authenticated user from security.authenticatedUsers.from(req).
  impact_description: Any authenticated user can drain or manipulate any other user's wallet balance and loyalty points, enabling
    financial fraud across all accounts.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: The /rest/basket/:id/order path is protected by security.isAuthorized() at server.ts:400; the placeOrder
    handler is registered at /rest/basket/:id/checkout (server.ts:604), a distinct path not covered by that middleware; in
    either case, ownership of req.body.UserId is never bound to the token identity.
  mitigation_title: Derive UserId exclusively from the verified JWT in routes/order.ts instead of req.body
  actor_ids:
  - ACT-D-02
  - ACT-D-03
  primary_actor: ACT-D-02
  remediation:
    effort: Low
    steps:
    - Replace all reads of req.body.UserId at routes/order.ts:146 with security.authenticatedUsers.from(req)?.data?.id, which
      is derived from the verified JWT and cannot be forged by the caller.
    - Add a test that checks out as userA while supplying userB's ID in the body and asserts only userA's wallet is modified.
    code_example: null
    verification: Issue a checkout request with UserId belonging to a second test account and confirm only the authenticated
      account's wallet balance changes.
    reference: CWE-639 — Authorization Bypass Through User-Controlled Key
  evidence:
  - file: routes/order.ts
    line: 157
