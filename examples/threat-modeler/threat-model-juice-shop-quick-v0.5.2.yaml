    `jwtDecode` on the forged token — no signature check occurs — and the role claim passes the guard.
  - The Angular router permits the navigation, rendering the admin panel and exposing admin API endpoints callable with the
    forged token.
  evidence_summary: app.guard.ts:54 checks `payload.data.role === roles.admin` after decoding the JWT with `jwtDecode` at
    line 38, which does not verify the token signature — no server round-trip confirms the role.
