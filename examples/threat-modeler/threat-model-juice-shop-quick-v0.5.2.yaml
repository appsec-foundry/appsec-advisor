- local_id: web3-nft-004
  threat_category_id: TH-17
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-209
  title: Key-Type Oracle in Error Responses — routes/checkKeys.ts:21
  scenario: 'The key-check handler at `routes/checkKeys.ts:21–27` returns three distinct error messages depending on which
    component of the wallet the attacker supplies: `''Looks like you entered the public address of my ethereum wallet!''`
    when the submission equals `address`, `''Looks like you entered the public key of my ethereum wallet!''` when it equals
    `publicKey`, and a generic rejection otherwise. An attacker enumerating the endpoint can submit candidate values and receive
    precise feedback about whether they found the wallet address, the public key, or neither, narrowing the search space for
    the private key.'
  evidence_summary: '`routes/checkKeys.ts:21` branches on `req.body.privateKey === address` and `=== publicKey` and returns
    distinguishable JSON messages, acting as a confirmation oracle for each key component.'
  impact_description: An attacker learns whether a submitted value is the correct wallet address or public key, confirming
    reconnaissance data and guiding further private-key search.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None — all three error paths are present and return distinguishable JSON bodies with no rate limiting
    on the endpoint.
  mitigation_title: Collapse all non-matching responses to a single generic rejection message
  remediation:
    effort: Low
    steps:
    - 'Replace the three-branch conditional at `routes/checkKeys.ts:21–26` with a single `401` response body such as `{success:
      false, message: ''Incorrect key submitted''}` regardless of whether the value matched the address, public key, or neither.'
    - Apply rate limiting to `POST /rest/web3/submitKey` to prevent automated enumeration of key components.
    code_example: "// Before (routes/checkKeys.ts:21-26) — oracle branches\nif (req.body.privateKey === address) {\n  res.status(401).json({\
      \ success: false, message: 'Looks like you entered the public address...' })\n} else if (req.body.privateKey === publicKey)\
      \ {\n  res.status(401).json({ success: false, message: 'Looks like you entered the public key...' })\n}\n\n// After\
      \ — uniform rejection\nres.status(401).json({ success: false, message: 'Incorrect key submitted' })"
    verification: Submit the wallet's known public address and confirm the response body is identical to that returned for
      a random string.
