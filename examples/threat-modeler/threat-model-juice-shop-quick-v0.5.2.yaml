- id: ci-cd-pipeline
  name: GitHub Actions CI/CD Pipeline
  description: GitHub Actions workflows for CI (ci.yml), CodeQL security scanning (codeql-analysis.yml), release pipeline
    (release.yml), and image optimization (image_actions.yml). Uses npm ci and Docker Hub publishing. Workflows lack SHA-pinned
    action references and missing permissions blocks.
