- local_id: web3-nft-006
  threat_category_id: TH-06
  additional_categories:
  - TH-02
  stride: Elevation of Privilege
  cwe: CWE-639
  title: Wallet Ownership Not Verified in NFT Challenge Claim — routes/nftMint.ts:41
  affected_parameter: walletAddress
  scenario: '`walletNFTVerify()` at `routes/nftMint.ts:41` checks if `addressesMinted.has(req.body.walletAddress)` and, on
    a hit, deletes the entry and marks `nftMintChallenge` as solved. The Set is populated by a blockchain event listener watching
    the real Sepolia contract. Since no authentication is required and the wallet address is fully attacker-controlled, any
    caller who learns a wallet address that has already minted the NFT — whether through blockchain explorer queries or log
    scraping — can POST that address and fraudulently claim the challenge without having minted the NFT themselves. There
    is no cryptographic proof that the submitter owns the Ethereum address.'
  attack_steps:
  - An attacker queries the Sepolia contract event log via Etherscan for `NFTMinted` events and extracts a minter address.
  - 'The attacker POSTs `{"walletAddress": "<minter>"}` to the unauthenticated `POST /rest/web3/walletNFTVerify` endpoint.'
  - The server finds the address in `addressesMinted` at `routes/nftMint.ts:42`, deletes it, and marks `nftMintChallenge`
    solved — granting the attacker credit for an NFT they never minted.
  evidence_summary: '`routes/nftMint.ts:41` resolves the challenge based solely on set membership of `req.body.walletAddress`
    with no binding to the caller''s session identity or cryptographic ownership proof.'
  impact_description: An attacker can claim NFT minting credit by submitting any wallet address that appears in on-chain events,
    bypassing the intended on-chain ownership requirement.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — no JWT check links the submitted `walletAddress` to an authenticated session, and no signature
    challenge proves ownership of the Ethereum address.
  mitigation_title: Bind submitted wallet address to the authenticated user session and require an ownership proof
  remediation:
    effort: Medium
    steps:
    - Require JWT authentication on `POST /rest/web3/walletNFTVerify` (see web3-nft-001) so that `req.user` identifies the
      caller.
    - Implement a wallet-link flow where the user signs a server-issued nonce with their MetaMask private key; store the verified
      wallet address in the user's session record, and only accept NFT-claim requests where `req.body.walletAddress` matches
      the session-linked address.
    - Check `addressesMinted` against the session-linked wallet address rather than the attacker-controlled request body value.
    code_example: "// Before (routes/nftMint.ts:41) — user-supplied address, no ownership check\nconst metamaskAddress = req.body.walletAddress\n\
      if (addressesMinted.has(metamaskAddress)) {\n  challengeUtils.solveIf(challenges.nftMintChallenge, () => true)\n}\n\n\
      // After — address bound to authenticated session (wallet linked during sign-in)\nconst sessionWallet = req.user?.walletAddress\
      \  // populated by prior wallet-link flow\nif (sessionWallet && addressesMinted.has(sessionWallet)) {\n  addressesMinted.delete(sessionWallet)\n\
      \  challengeUtils.solveIf(challenges.nftMintChallenge, () => true)\n}"
    verification: Log in as User A, link their wallet, then send a claim request as User B using User A's wallet address;
      confirm the server rejects the request with `403 Forbidden`.
    reference: CWE-639
  evidence:
  - file: routes/nftMint.ts
    line: 41
