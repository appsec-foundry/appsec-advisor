components:
- id: backend-api
  name: Express REST API Backend
  description: Node.js/Express monolith serving REST routes at /rest/* and /api/*, B2B API at /b2b/v2, Socket.IO real-time
    gateway, static file serving, and authentication middleware. Houses intentionally vulnerable challenge routes alongside
    safe routes. Single deployable unit exposed directly on port 3000.
  paths:
  - server.ts
  - app.ts
  - routes/**
  - lib/**
  - models/**
  - views/**
  - config/**
  - encryptionkeys/**
  tier: application
  complexity: complex
  framework: express
  deployment_zones:
  - internet
  handles_sensitive_data: true
  threat_ids:
  - T-004
  - T-007
  - T-008
  - T-009
  - T-010
  - T-011
  - T-015
  - T-016
  - T-017
  - T-021
  - T-029
  - T-033
  - T-037
- id: frontend-spa
  name: Angular SPA Frontend
  description: Angular 21 single-page application compiled and served by the Express backend. Contains DomSanitizer bypasses,
    localStorage JWT storage, and DOM-XSS sources as intentional training challenges. No backend-for-frontend intermediary.
  paths:
  - frontend/src/**
  - frontend/package.json
  tier: client
  complexity: moderate
  framework: angular
  deployment_zones:
  - client-device
  handles_sensitive_data: true
  threat_ids:
  - T-001
  - T-005
  - T-018
  - T-022
  - T-034
- id: sqlite3-database
  name: SQLite3 Database (Sequelize ORM)
  description: In-process SQLite3 database accessed through Sequelize 6 ORM. Stores user accounts, orders, feedback, basket
    contents, and challenge state. Co-located with application logic in the same process and file system.
  paths:
  - models/**
  - data/**
  tier: data
  complexity: simple
  framework: sequelize
  deployment_zones:
  - internal-network
  handles_sensitive_data: true
  threat_ids: []
- id: llm-chat-service
  name: LLM Chat Service (Vercel AI SDK)
  description: Express route handler at routes/chat.ts using the Vercel AI SDK with @ai-sdk/openai-compatible to forward user
    messages to a configurable LLM endpoint (Ollama/OpenAI-compatible). Streams responses via Socket.IO. No prompt injection
    filtering observed.
  paths:
  - routes/chat.ts
  tier: application
  complexity: simple
  framework: express
  deployment_zones:
  - internet
  handles_sensitive_data: false
  threat_ids:
