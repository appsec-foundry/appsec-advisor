threats:
- local_id: auth-session-001
  threat_category_id: TH-02
  additional_categories:
  - Elevation of Privilege
  - TH-03
  stride: Spoofing
  cwe: CWE-321
  title: Hardcoded RSA Private Key — lib/insecurity.ts:21
  scenario: An attacker who reads the source repository extracts the RSA private key literal at lib/insecurity.ts:21, uses
    it to sign a crafted JWT with data.role='admin', and presents the token to any route protected by isAuthorized() to gain
    full administrative access without valid credentials.
  attack_steps:
  - Attacker clones the repository and copies the RSA private key string from lib/insecurity.ts:21.
  - Attacker crafts a JWT payload with data.role='admin' and the target user's email, signs it RS256 with the extracted key,
    and sets expiry 6h ahead.
  - 'Attacker sends the forged token as Authorization: Bearer <token> to any protected endpoint such as GET /api/Users.'
  - isAuthorized() at lib/insecurity.ts:52 verifies the token against the matching public key and grants full administrative
    access.
  evidence_summary: Line 21 of lib/insecurity.ts defines privateKey as a string literal containing the full PEM-encoded RSA
    private key, making it available to any actor with read access to the source repository.
  impact_description: Attacker forges valid RS256 JWTs for any user account including admin, defeating all JWT-based authorization
    controls across the entire application.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: RS256 algorithm enforced at signing; 6-hour JWT expiry configured
  actor_ids:
  - ACT-D-01
  - ACT-D-06
  primary_actor: ACT-D-01
  mitigation_title: Load RSA private key from environment or secret manager at startup in lib/insecurity.ts
  remediation:
    effort: Medium
    steps:
    - Remove the private key literal from lib/insecurity.ts:21 and replace with process.env.JWT_PRIVATE_KEY loaded at startup;
      fail closed (throw) if the variable is absent.
    - Immediately rotate the compromised key pair and revoke all existing sessions by restarting the service with the new
      key.
    - Add a secret-scanning pre-commit hook and CI gate to reject commits containing RSA or PEM key material.
    code_example: null
    verification: Start the server with JWT_PRIVATE_KEY unset and confirm the process exits with a configuration error rather
      than using a fallback key.
    reference: 'CWE-321: Use of Hard-coded Cryptographic Key'
  evidence:
  - file: lib/insecurity.ts
    line: 21
