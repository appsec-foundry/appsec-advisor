- local_id: api-server-017
  threat_category_id: TH-06
  additional_categories:
  - TH-07
  stride: Elevation of Privilege
  cwe: CWE-862
  title: Missing Authentication on State-Changing Routes
  scenario: An anonymous attacker reaches the archive and markup parsers because server.ts:309 registers `POST /file-upload`
    with only multer and the parsing chain `handleZipFileUpload, handleXmlUpload, handleYamlUpload`, and the authorization
    block that installs `security.updateAuthenticatedUsers()` and the route guards does not begin until server.ts:354. The
    image endpoints at server.ts:310 and server.ts:311 are registered in the same unguarded window; only `/rest/memories`
    at server.ts:312 carries `security.appendUserId()`. Registration order therefore places three attacker-reachable parsers
    outside the authentication boundary entirely.
  evidence_summary: server.ts:309 registers the file-upload route and its zip, XML, and YAML handlers with no security middleware,
    45 lines before the authorization block starts at server.ts:354.
  impact_description: Anonymous callers feed arbitrary archives and markup into server-side parsers and write into the publicly
    served uploads directory, without ever presenting a credential.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: A 200000-byte multer size limit at server.ts:692 and checkUploadSize/checkFileType handlers; no authentication
    or authorization on the route
  mitigation_title: Move the upload route registrations behind the authorization block in server.ts
  remediation:
    effort: Low
    steps:
