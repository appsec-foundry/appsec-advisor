  description: Server-side socket.io real-time channel pushing live events to connected browsers. Internet-facing WebSocket
    surface with its own connection auth/origin checks and message-handler trust boundary.
  paths:
  - lib/challengeUtils.ts
  - lib/startup/registerWebsocketEvents.ts
  tier: application
  complexity: simple
  framework: socket.io
  deployment_zones:
  - internet
  - dmz
  handles_sensitive_data: false
  origin: reconciliation
  threat_ids:
  - T-013
  - T-021
  - T-027
  - T-064
- id: web3-nft
  name: Web3 / Wallet / NFT Surface
  description: Blockchain/web3 endpoints handling wallet addresses, NFT minting, and on-chain key material (ethers). Internet-facing
    crypto-asset surface with its own key-handling and ownership-verification trust boundary.
