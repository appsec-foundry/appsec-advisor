  stride: Elevation of Privilege
  cwe: CWE-862
  title: Comment command without author authorization (.github/workflows/rebase.yml:10)
  scenario: Any GitHub user who can comment on a pull request triggers the privileged rebase job, because the condition at
    .github/workflows/rebase.yml:10 tests only that the thread is a pull request and that the comment body contains `/rebase`,
    and never checks github.event.comment.author_association or the commenter's repository permission. The issue_comment event
    runs the workflow from the default branch with repository secrets and the GITHUB_TOKEN passed to cirrus-actions/rebase
    on line 19, which fetches the pull request head and force-pushes a rewritten branch.
  attack_steps:
  - I comment `/rebase` on any open pull request in the public repository while holding no write permission on it.
  - GitHub runs the rebase job from the default branch with repository secrets and a GITHUB_TOKEN whose scope this workflow
    never restricts.
  - cirrus-actions/rebase rewrites and force-pushes the pull request branch, letting me rewrite history on branches I do not
    own and replay the privileged job whenever I choose.
  evidence_summary: rebase.yml:10 gates the job only on `github.event.issue.pull_request != '' && contains(github.event.comment.body,
    '/rebase')`. The workflow declares no permissions block and passes secrets.GITHUB_TOKEN to the rebase action on line 19,
    and no workflow under .github/workflows references author_association.
  impact_description: An account with no repository permission causes a privileged, secrets-bearing job to run on demand and
    to force-push a rewritten branch, which both crosses the pipeline's authorization boundary and gives an attacker a repeatable
    trigger for any weakness that later appears in that job.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: The comment must be on a pull request thread (rebase.yml:10) and cirrus-actions/rebase is pinned to a
    commit SHA on line 17. No check on the commenter's repository permission or organisation membership exists.
  mitigation_title: Require write-level author_association before running the rebase job in rebase.yml
  remediation:
    effort: Low
    steps:
    - Extend the condition at .github/workflows/rebase.yml:10 to require `contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.comment.author_association)` so only privileged commenters trigger the job.
    - 'Add an explicit `permissions: contents: write` block to the rebase job so the token is not issued with the repository
      default scope.'
    - Add a concurrency group keyed on the issue number so repeated `/rebase` comments cannot queue parallel rebases of the
      same branch.
    code_example: null
    verification: Comment `/rebase` from an account with no repository permission and confirm the rebase job is skipped while
      the workflow run itself still completes via always_job.
    reference: https://cwe.mitre.org/data/definitions/862.html
