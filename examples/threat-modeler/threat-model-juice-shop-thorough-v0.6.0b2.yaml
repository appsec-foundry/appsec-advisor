- local_id: realtime-channel-001
  threat_category_id: TH-13
  additional_categories: []
  stride: Spoofing
  cwe: CWE-306
  title: Unauthenticated WebSocket Channel
  scenario: An attacker points a non-browser Socket.IO client at port 3000 and completes the handshake without presenting
    any credential. The server constructs the Socket.IO server with a single `cors.origin` option and registers no handshake
    authentication, and CORS is a browser-enforced response header rather than a server-side admission check, so a scripted
    client bypasses it entirely and is accepted onto the push channel as an anonymous peer indistinguishable from the legitimate
    Angular frontend.
  attack_steps:
  - I connect a Node socket.io-client to the target on port 3000 with no token, ignoring the browser-only CORS origin restriction.
  - The server accepts my handshake and pushes the queued 'challenge solved' notifications to my socket straight away.
  - I emit verification and notification events on that same socket to read and mutate server-side state as a trusted client.
  evidence_summary: 'lib/startup/registerWebsocketEvents.ts:20 constructs the Socket.IO server with `cors: { origin: ''http://localhost:4200''
    }` as its only connection-level option, and the connection handler at line 23 runs for every socket without inspecting
    a credential. A grep of both component files for `io.use(`, `allowRequest`, `handshake`, `verifyToken`, `isAuthorized`,
    and `authenticate` returned zero hits, so no handshake credential is verified anywhere on this channel.'
  impact_description: Any internet client reaches the live event channel of the same process that serves the JWT-protected
    REST API on port 3000, gaining read access to challenge notifications and write access to the event handlers that mutate
    challenge and notification state.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: Socket.IO CORS restricted to http://localhost:4200 (lib/startup/registerWebsocketEvents.ts:20), which
    is a browser-enforced response header and not a server-side admission check.
  mitigation_title: Verify a JWT in a Socket.IO handshake middleware in registerWebsocketEvents.ts
  remediation:
    effort: Medium
    steps:
    - Register an `io.use()` handshake middleware in lib/startup/registerWebsocketEvents.ts that reads the token from `socket.handshake.auth`
      and verifies it with the same JWT verification helper `lib/insecurity.ts` supplies to `security.isAuthorized()`, calling
      `next(new Error('unauthorized'))` when verification fails so the connection is refused before `io.on('connection')`
      runs.
    - Attach the verified principal to `socket.data` and make the event handlers below it read identity from there instead
      of from client payloads.
    - Replace the hardcoded `http://localhost:4200` origin with a configured allow-list, and keep the origin check as defence
      in depth rather than as the admission control.
    - Add an integration test that opens a socket.io-client connection with no token and with a tampered token, and asserts
      the connection is rejected and no 'challenge solved' event is received.
    code_example: null
    verification: Run `npx wscat -c 'ws://localhost:3000/socket.io/?EIO=4&transport=websocket'` with no auth payload and confirm
      the server closes the connection with an unauthorized error instead of emitting 'server started' or 'challenge solved'.
    reference: https://cwe.mitre.org/data/definitions/306.html
  evidence:
  - file: lib/startup/registerWebsocketEvents.ts
    line: 20
  controls_absent_evidence:
  - pattern: io\.use\(|allowRequest|handshake|verifyToken|isAuthorized|authenticate
