- local_id: realtime-channel-005
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: Unbounded regex on socket input (lib/startup/registerWebsocketEvents.ts:46)
  scenario: An attacker opens many anonymous sockets and floods `verifySvgInjectionChallenge` with maximum-size payloads.
    Each event runs a backtracking regular expression carrying a leading `.*` and a lazy `[\w/-]*?` quantifier over the whole
    attacker-controlled string, synchronously on the single Node event loop that also serves the REST API on port 3000. Neither
    a payload size option nor any per-socket or per-connection event rate limit is configured, so the attacker converts cheap
    event emission into stalled request handling for every other user.
  attack_steps:
  - I open dozens of anonymous socket connections, since no handshake credential and no connection cap apply.
  - On each one I emit verifySvgInjectionChallenge in a tight loop with payloads at the maximum accepted message size.
  - Every emission runs the backtracking regex over my full string on the shared event loop, delaying REST responses on the
    same port.
  evidence_summary: lib/startup/registerWebsocketEvents.ts:46 evaluates `data?.match(/.*\.\.\/\.\.\/\.\.[\w/-]*?\/redirect\?to=https?:\/\/cataas.com\/cat.*/)`
    directly on the client-supplied payload with no length check. A grep of both component files for `maxHttpBufferSize`,
    `rateLimit`, `rate-limit`, and `throttle` returned zero hits, and line 20 shows the Socket.IO server is constructed with
    `cors` as its only option, so the default message size governs and no event rate limit exists.
  impact_description: A single anonymous client can saturate the Node event loop of the process that also serves the REST
    API on port 3000, degrading or stalling the whole application for all users without authenticating.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None on this channel. The regex only runs while the challenge is unsolved, which is the default state
    of a fresh instance.
  mitigation_title: Bound payload size and event rate on the Socket.IO server in registerWebsocketEvents.ts
  remediation:
    effort: Low
    steps:
    - Set an explicit `maxHttpBufferSize` on the Socket.IO server options at lib/startup/registerWebsocketEvents.ts:20, sized
      to the largest legitimate verification payload rather than the default megabyte.
    - Reject oversized or non-string payloads at the top of each `socket.on` handler before any matching runs, and apply a
      per-socket event rate limit that disconnects a socket exceeding it.
    - Rewrite the regex at line 46 to remove the leading `.*` and the lazy quantifier, anchoring it and matching the path
      components explicitly so match cost stays linear in input length.
    - Add a load test that emits oversized verifySvgInjectionChallenge payloads at high rate and asserts REST endpoint latency
      on the same port stays within budget.
    code_example: null
    verification: Emit 200 verifySvgInjectionChallenge events of 1 MB each from a script while polling `GET /rest/admin/application-version`;
