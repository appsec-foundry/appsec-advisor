- local_id: sqlite-database-011
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-284
  title: No database principal separation (models/index.ts:33)
  scenario: An attacker who reaches any query path, including one opened by an injection flaw elsewhere in the process, operates
    with full authority over every table, because a single Sequelize connection created once at module load serves all access
    levels and SQLite enforces no per-principal or row-level permission.
  evidence_summary: createSequelize at models/index.ts:33-44 builds one connection against the file store and initModels binds
    all twenty-one entities to that single instance at line 75, so no read-only, per-role, or per-tenant connection exists
    anywhere in the persistence layer.
  impact_description: 'There is no containment boundary inside the store: a flaw on any single query path yields read and
    write access to credentials, payment cards, addresses, orders, and wallet balances alike.'
  likelihood: Medium
  impact: High
  risk: Medium
  controls_in_place: None — a single shared connection with uniform authority; SQLite provides no database-level principals
  mitigation_title: Enforce authorization above the shared connection in models/index.ts
  remediation:
    effort: High
    steps:
    - Introduce scoped repository functions over the shared Sequelize instance in models/index.ts that apply a mandatory owner
      or role predicate to every query touching Users, Cards, Addresses, Baskets, and Wallets, and forbid direct model access
      from route code, or migrate to an engine that supports database roles and row-level security.
    - Add tests that call each scoped repository function as a non-owning user and assert an empty result or a rejection.
    code_example: null
    verification: Call the card and address repository functions with a user id that does not own the row and confirm no row
      is returned.
    reference: 'CWE-284: Improper Access Control'
  evidence:
  - file: models/index.ts
    line: 33
