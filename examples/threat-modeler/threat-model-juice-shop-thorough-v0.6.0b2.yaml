  cwe: CWE-321
  title: Hardcoded RSA signing key in source (lib/insecurity.ts:21)
  scenario: An attacker who can read the repository mints valid session tokens offline because the RSA private key used to
    sign every JWT is a string literal at lib/insecurity.ts:21. `authorize()` at lib/insecurity.ts:54 signs all authentication
    tokens with that constant, and `deluxeToken()` at lib/insecurity.ts:150 derives the deluxe membership HMAC from the same
    secret, so one disclosed literal defeats both session issuance and the deluxe entitlement check.
  attack_steps:
  - I read the private key literal from lib/insecurity.ts:21 in the published source tree.
  - I sign an RS256 token with payload data.id and data.role set to the admin account and a six-hour expiry, matching what
    authorize() produces.
  - I present that token to the API and it verifies against the server's own public key with no further check.
  - I also recompute any user's deluxeToken with the same key to satisfy the isDeluxe entitlement test.
  evidence_summary: lib/insecurity.ts:21 assigns a complete PEM-encoded RSA private key to a module constant that lib/insecurity.ts:54
    uses as the JWT signing key.
  impact_description: Offline forgery of any user or admin session and of deluxe entitlement tokens, with no server-side signal
    that the token was not issued by the application.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None; the key is a source literal with no external configuration path and no rotation mechanism
  mitigation_title: Load the JWT signing key from external secret configuration in lib/insecurity.ts
  remediation:
    effort: Medium
    steps:
    - Replace the literal at lib/insecurity.ts:21 with a value read from an environment variable or secret store at startup,
      and fail startup when it is absent rather than falling back to a default.
    - Rotate the compromised key pair, regenerate encryptionkeys/jwt.pub, and add a startup test asserting the process exits
      non-zero when the signing key variable is unset.
    code_example: null
    verification: Start the server with the signing-key variable unset and assert a non-zero exit; then grep the repository
      for `BEGIN RSA PRIVATE KEY` and expect zero hits outside test fixtures.
    reference: 'CWE-321: Use of Hard-coded Cryptographic Key'
  evidence:
  - file: lib/insecurity.ts
    line: 21
  boundary_refs:
  - boundary_id: tb-1
    origin_component_id: api-server
