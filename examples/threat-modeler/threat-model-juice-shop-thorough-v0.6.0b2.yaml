  stride: Repudiation
  cwe: CWE-778
  title: Unsigned CI commit to trunk (.github/workflows/frontend-bundle-analysis.yml:61)
  scenario: 'The bundle-analysis job sets its committer to a synthetic `GitHub Action <action@github.com>` identity at .github/workflows/frontend-bundle-analysis.yml:61
    and then commits and pushes to master on line 66 without a commit signature. An attacker with any write path into the
    repository can commit under identical author and committer fields, and a reviewer reading the master history has no signature
    or account link that distinguishes the pipeline''s commit from the forged one. The `continue-on-error: true` on line 67
    additionally leaves the run green when the push is rejected.'
  attack_steps:
  - I obtain a write path into the repository and commit to master using the same `GitHub Action <action@github.com>` author
    and committer fields the pipeline uses.
  - A reviewer auditing the master history sees a commit indistinguishable from the routine screenshot update, and no signature
    exists that would prove which commit the pipeline actually produced.
  evidence_summary: frontend-bundle-analysis.yml:61-62 configures a committer name and e-mail that map to no GitHub account,
    line 66 pushes that commit to master, and line 67 marks the push step continue-on-error. No workflow under .github/workflows
    configures GPG or SSH commit signing.
  impact_description: Commits reaching the trunk cannot be attributed to an accountable principal, so a forensic review after
    a suspected pipeline compromise cannot separate genuine automated commits from forged ones, and a rejected push produces
    no failing run to investigate.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: GitHub records the workflow run and the pushing token in the repository audit log; the commits themselves
    carry no signature and no account-linked identity, and the update-* workflows use a JuiceShopBot identity that at least
    maps to a real account.
  mitigation_title: Sign and attribute bundle-analysis commits and stop swallowing push failures in frontend-bundle-analysis.yml
  remediation:
    effort: Low
    steps:
    - Replace the synthetic identity at .github/workflows/frontend-bundle-analysis.yml:61-62 with the account-linked JuiceShopBot
      identity already used by the update-* workflows, and import a signing key so `git commit -S` produces a verified commit.
    - 'Remove `continue-on-error: true` from line 67 so a rejected or failed push to master fails the workflow run.'
    - Add a check that rejects unsigned commits on master through branch protection, so an unsigned automated commit is caught
      at push time rather than at review time.
    code_example: null
    verification: Trigger the workflow via workflow_dispatch and confirm the resulting master commit shows as Verified in
      the GitHub UI and that a forced push failure marks the run as failed.
    reference: https://cwe.mitre.org/data/definitions/778.html
