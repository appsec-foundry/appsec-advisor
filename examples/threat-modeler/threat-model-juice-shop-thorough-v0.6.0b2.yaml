tier_root_causes:
  edge:
  - Session tokens persisted in script-readable storage, then reused as authority
  - Client-side guards decide authorization from unverified JWT payload claims
  - Framework sanitizer explicitly bypassed for attacker-controlled bindings
  - No origin-level script, framing, or cookie policy behind the SPA shell
  - Login credentials derived or embedded in code shipped to the browser
  server:
  - Per-route opt-in guards leave endpoints without authentication or throttling
  - Request-controlled values reach queries, paths, URLs, and trust decisions
  - Key material and password hashing fixed in source with obsolete primitives
  - Handlers emit internal state chosen by caller input or raw exception text
  - Build inputs unpinned and unverified while workflow tokens keep default scope
  data:
  - Secrets stored in columns as cleartext or fast unsalted digests
  - Seed routine writes fixed or Math.random credentials on every startup
  - Model layer persists input without length bounds or the strict sanitizer
  - One connection with full table authority serves every access level
  - External seed assets written to disk without integrity verification
