abuse_case_analysis:
  status: completed
  reason: null
  cases:
  - id: AC-T-001
    title: Account Takeover via Stored XSS + Token Hijacking
    source: mandatory
    actor: external-attacker — unauthenticated external attacker
    goal: Obtain persistent authenticated access as an arbitrary user without valid credentials.
    prerequisite: Attacker can submit content that is later rendered to other users (e.g. feedback, comments, profile fields).
    combined_risk: Critical
    chain_verdict: partially_blocked
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-009
    - F-030
    - F-015
    blocking_mitigation_ids:
    - M-009
    - M-030
    - M-015
    steps:
    - step: 1
      outcome: Attacker JavaScript executes in the victim's browser session.
      verdict: confirmed
      finding_id: F-009
      evidence:
        file: frontend/src/app/search-result/search-result.component.ts
        line: 143
      controls_found:
      - DomSanitizer (present but bypassed via bypassSecurityTrustHtml — not a mitigating control)
      unverified: false
    - step: 2
      outcome: Token exfiltrated from local/session storage via the Step 1 payload.
      verdict: confirmed
      finding_id: F-030
      evidence:
        file: frontend/src/app/login/login.component.ts
        line: 101
      controls_found: []
      unverified: false
    - step: 3
      outcome: Exfiltrated token accepted for a new session; absence of token binding / PKCE removes the last server-side
        revocation opportunity.
      verdict: confirmed
      finding_id: F-015
      evidence:
        file: frontend/src/app/login/login.component.ts
        line: 148
      controls_found: []
      unverified: false
  - id: AC-T-002
    title: Bulk Data Exfiltration via Broken Object Authorization
    source: mandatory
    actor: authenticated-user — authenticated low-privilege user
    goal: Enumerate and exfiltrate other users' records, then escalate own permissions via unguarded mass assignment.
    prerequisite: Attacker holds a valid, non-privileged user account.
    combined_risk: Critical
    chain_verdict: partially_blocked
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-008
    - F-010
    blocking_mitigation_ids:
    - M-008
    - M-010
    steps:
    - step: 1
      outcome: Attacker enumerates and retrieves records for arbitrary object IDs; no ownership comparison is performed.
      verdict: blocked
      finding_id: F-008
      evidence:
        file: routes/wallet.ts
        line: 27
      controls_found:
      - security.appendUserId() at server.ts:626-627
      unverified: false
    - step: 2
      outcome: Update endpoint persists an unfiltered `role` (or equivalent) field supplied in the request body.
      verdict: confirmed
      finding_id: F-010
      evidence:
        file: routes/verify.ts
        line: 53
      controls_found: []
      unverified: false
  - id: AC-T-003
    title: Privilege Escalation to Admin via JWT Algorithm Confusion
    source: mandatory
    actor: external-attacker — unauthenticated external attacker
    goal: Forge an admin-role JWT without knowledge of the signing secret.
    prerequisite: Attacker can obtain any valid JWT issued by the system (e.g. by registering a free account).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-001
    - F-036
    blocking_mitigation_ids:
    - M-001
    - M-036
    steps:
    - step: 1
      outcome: Verifier accepts attacker-chosen `alg` (e.g. `none` or HMAC-with-public-key), allowing token re-signing without
        the secret.
      verdict: confirmed
      finding_id: F-001
      evidence:
        file: lib/insecurity.ts
        line: 189
      controls_found: []
      unverified: false
    - step: 2
      outcome: 'Forged `role: admin` claim is accepted as authoritative because the role is not re-fetched from the database
        per request.'
      verdict: confirmed
      finding_id: F-036
      evidence:
        file: routes/deluxe.ts
        line: 43
      controls_found: []
      unverified: false
  - id: AC-T-004
    title: Privilege Escalation via Mass-Assignment on Registration
    source: mandatory
    actor: external-attacker — unauthenticated external attacker
    goal: Obtain an administrator account without any existing privilege.
    prerequisite: Self-registration is open (one unauthenticated POST).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-010
    blocking_mitigation_ids:
    - M-010
    steps:
    - step: 1
      outcome: The account-creation handler persists the request body wholesale, so a client-supplied `role` (or `isAdmin`)
        field is written verbatim.
      verdict: confirmed
      finding_id: F-010
      evidence:
        file: routes/verify.ts
        line: 53
      controls_found: []
      unverified: false
  - id: AC-T-005
    title: Authentication Bypass via Exposed Secret Material
    source: mandatory
    actor: external-attacker — unauthenticated external attacker
    goal: Forge trusted tokens / credentials and impersonate any user.
    prerequisite: Signing material or other secrets are reachable (committed to a public repo, served by an unauthenticated
      route, or in an exposed directory).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-004
    - F-001
    blocking_mitigation_ids:
    - M-004
    - M-001
    steps:
    - step: 1
      outcome: A private key, signing secret, or credential file is committed to the source repository or served without authentication.
      verdict: confirmed
      finding_id: F-004
      evidence:
        file: lib/insecurity.ts
        line: 21
      controls_found: []
      unverified: false
    - step: 2
      outcome: The exposed key/secret is the same one the server trusts, so a token signed with it (or the leaked credential)
        is accepted as authentic.
      verdict: confirmed
      finding_id: F-001
      evidence:
        file: lib/insecurity.ts
        line: 189
      controls_found: []
      unverified: false
  - id: AC-T-006
    title: Remote Code Execution via Server-Side Injection
    source: mandatory
    actor: external-attacker — unauthenticated external attacker
    goal: Execute arbitrary code in the application process.
    prerequisite: An input reaches a server-side interpreter / template / eval.
    combined_risk: High
    chain_verdict: mitigated
    verification_complete: true
    unverified_steps: []
    matched_finding_ids: []
    blocking_mitigation_ids: []
    steps:
    - step: 1
      outcome: Attacker-controlled input is passed to `eval`, a server-side template engine, an unsafe sandbox, or an unsafe
        deserializer.
      verdict: blocked
      finding_id: null
      evidence:
        file: lib/xml.ts
        line: 38
      controls_found:
      - vm.createContext sandbox isolates user data from executable code
      - hardcoded script string in vm.runInContext — no user input interpolated
      - new Function specifier is hardcoded, never user-supplied
      unverified: false
