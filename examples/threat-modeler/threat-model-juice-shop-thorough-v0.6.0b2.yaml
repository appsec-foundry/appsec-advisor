  stride: Spoofing
  cwe: CWE-287
  title: Implicit OAuth flow (frontend/src/app/login/login.component.ts:148)
  scenario: An attacker lures a victim to a page that redirects to the shop's own OAuth entry point, or replays a fragment
    of their choosing, because googleLogin() starts a bare implicit flow with response_type=token and sends no state, nonce,
    or PKCE challenge; the route matcher then accepts any URL carrying '#access_token=' (frontend/src/app/app.routing.ts:286)
    and OAuthComponent parses the fragment by string splitting and posts the token straight to /rest/user/oauth without checking
    that this browser started the flow.
  evidence_summary: login.component.ts:148 builds the authorization URL with response_type=token and only client_id, scope,
    and redirect_uri; no state or nonce parameter is generated or stored, and oauth.component.ts:70-79 parses the returned
    fragment without comparing any request-binding value.
  impact_description: A victim can be silently logged into an account the attacker controls (session fixation on the shop),
    or an attacker-obtained Google access token can be injected into the victim's browser to bind their shop session to a
    foreign identity; orders, addresses, and payment data are then created under the wrong account.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: The redirect URI is checked against an authorizedRedirects list served by the API (login.component.ts:80)
    before the button is enabled
  mitigation_title: Replace the implicit flow with authorization code plus PKCE in login.component.ts
  remediation:
    effort: Medium
    steps:
    - Change googleLogin() in frontend/src/app/login/login.component.ts:148 to request response_type=code with code_challenge_method=S256,
      a CSPRNG-generated code_verifier, and a CSPRNG-generated state and nonce held in sessionStorage.
    - Reject the callback in frontend/src/app/oauth/oauth.component.ts unless the returned state exactly matches the stored
      value, and exchange the code server-side instead of parsing an access token out of window.location fragment.
    - Add a component test that drives OAuthComponent with a fragment carrying a mismatched state and asserts no call to userService.oauthLogin
      is made.
    code_example: null
    verification: Run `npx vitest run frontend/src/app/oauth/oauth.component.spec.ts` with the new negative case; a callback
      whose state does not match the stored value must leave isLoggedIn false and issue no /rest/user/oauth request.
    reference: https://datatracker.ietf.org/doc/html/rfc9700#name-implicit-grant
