  title: Cross-Site Scripting (XSS)
  scenario: An attacker sends a victim a link such as /#/search?q=<img src=x onerror=...>, and filterTable() passes the raw
    query parameter through DomSanitizer.bypassSecurityTrustHtml into the searchValue binding, which the template renders
    with [innerHTML]; the payload executes in the shop origin with no Content-Security-Policy to stop it and reads the JWT
    the SPA keeps in localStorage.
  attack_steps:
  - I craft a shop URL whose q query parameter carries an HTML payload with an inline event handler.
  - I send the link to a signed-in user, who opens it in their normal session.
  - 'filterTable() marks my payload trusted and the template writes it into #searchValue via innerHTML, executing my script.'
  - My script reads localStorage.token and posts the victim's session JWT to my server.
  evidence_summary: search-result.component.ts:136-143 reads route.snapshot.queryParams.q and assigns this.searchValue = sanitizer.bypassSecurityTrustHtml(queryParam);
    search-result.component.html:11 binds that value with [innerHTML], completing an unescaped source-to-sink path from the
    URL.
  impact_description: Any user who opens an attacker-crafted search link loses their session JWT and can have arbitrary requests
    issued as themselves; if the victim is an administrator the same payload reaches the admin panel and its user and feedback
    management actions.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — Angular's built-in escaping is explicitly bypassed at this binding site
