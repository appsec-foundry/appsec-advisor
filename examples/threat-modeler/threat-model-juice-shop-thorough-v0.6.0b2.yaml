- local_id: auth-service-008
  threat_category_id: TH-03
  additional_categories:
  - TH-17
  stride: Information Disclosure
  cwe: CWE-598
  title: Password in URL query string (routes/changePassword.ts:15)
  scenario: A user changes their password and the current and new plaintext passwords travel in the request URL, because routes/changePassword.ts
    reads them from query.current and query.new; anyone with access to reverse-proxy access logs, browser history, or a Referer
    header captured by a third-party asset on the page recovers those credentials verbatim.
  evidence_summary: routes/changePassword.ts:15 reads the new password from query.new and line 14 reads the current password
    from query.current, so both credentials are carried in the request line rather than a request body.
  impact_description: Plaintext passwords are persisted in infrastructure logs and browser history outside the application's
    control, so a log reader or a compromised third-party script recovers working credentials for the affected accounts.
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: The endpoint requires a bearer token from the Authorization header; the credential values themselves
    are unprotected in the URL.
  mitigation_title: Move password-change credentials from the query string to the request body
  remediation:
    effort: Medium
    steps:
    - Change the handler at routes/changePassword.ts to read current, new and repeat from req.body and register the route
      as POST, updating the Angular client that calls it.
    - Reject any request that still carries these values as query parameters so a stale client cannot keep leaking them.
    - Add a test asserting that a password change succeeds with a body payload and returns 400 when the credentials are supplied
      as query parameters.
    code_example: null
    verification: 'Run the new test: POST /rest/user/change-password with a JSON body succeeds, and the same values passed
      as query parameters return HTTP 400.'
    reference: 'CWE-598: Use of GET Request Method With Sensitive Query Strings'
  evidence:
  - file: routes/changePassword.ts
    line: 15
