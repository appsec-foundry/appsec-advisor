  stride: Denial of Service
  cwe: CWE-400
  title: Unbounded CI fan-out on pull requests (.github/workflows/ci.yml:14)
  scenario: Any internet user can open and then repeatedly update a pull request against the public repository, and the pull_request
    trigger at .github/workflows/ci.yml:14 starts frontend-test, server-test and api-test, each a three-operating-system by
    three-Node-version matrix whose test steps retry up to three times, alongside the e2e, smoke, docker-test and custom-config
    jobs. The workflow declares no concurrency group, so each new commit the attacker pushes queues another full set of runners
    instead of cancelling the previous run.
  attack_steps:
  - I fork the public repository and open a pull request that touches a path outside the paths-ignore list.
  - I push a new commit to the pull request branch every few seconds; each push queues roughly thirty matrix jobs and no concurrency
    group cancels the run it supersedes.
  - The organisation's Actions concurrency and minute budget is consumed and CI for master and develop is starved behind my
    queued runs.
  evidence_summary: ci.yml:14 registers the pull_request trigger with no fork or author restriction, lines 56-59, 95-98 and
    132-135 define three-by-three matrices for three separate jobs, the nick-invision/retry steps allow three attempts each,
    and the file contains no concurrency key at workflow or job level.
  impact_description: Actions concurrency and billed minutes for the juice-shop organisation are exhausted by attacker-controlled
    pull request activity, delaying or blocking the release, Docker publish and Heroku deploy jobs that depend on the same
    runner pool.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: paths-ignore on lines 15-19 excludes markdown, LICENSE and i18n JSON from triggering the workflow, and
    the docker, heroku, coverage-report and notify-slack jobs are gated to pushes on the upstream repository so they do not
    run for pull requests.
  mitigation_title: Add a per-ref concurrency group with cancel-in-progress to ci.yml
  remediation:
    effort: Low
    steps:
    - 'Add a workflow-level `concurrency: { group: ${{ github.workflow }}-${{ github.ref }}, cancel-in-progress: true }` block
      to .github/workflows/ci.yml so a superseded pull request run is cancelled.'
    - Reduce the pull_request matrix to a single operating system and the default Node version, keeping the full three-by-three
      matrix for push events on master and develop.
    - Enable the repository setting that requires approval before workflows run for first-time contributors, so an unknown
      account cannot queue runners without a maintainer action.
