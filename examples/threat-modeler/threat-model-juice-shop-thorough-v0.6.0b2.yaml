- local_id: realtime-channel-002
  threat_category_id: TH-13
  additional_categories: []
  stride: Tampering
  cwe: CWE-807
  title: Client-trusted security decision (lib/startup/registerWebsocketEvents.ts:41)
  scenario: An attacker emits a `verifyLocalXssChallenge` event whose payload is simply the literal string the server searches
    for. The handler passes that client-supplied value directly into `challengeUtils.solveIf`, which treats a substring match
    on attacker-controlled data as proof that the XSS payload actually rendered in a victim browser, and then persists `solved
    = true`. The same pattern applies to `verifySvgInjectionChallenge` and `verifyCloseNotificationsChallenge`, so an attacker
    forges completion of security exercises without triggering the underlying vulnerability at all.
  attack_steps:
  - I connect anonymously and emit verifyLocalXssChallenge with the exact iframe payload string the handler compares against.
  - The server's criteria callback matches my own input, so solveIf marks the challenge solved and writes it to the database.
  - I repeat with verifySvgInjectionChallenge and verifyCloseNotificationsChallenge payloads to forge the remaining socket-verified
    challenges.
  evidence_summary: lib/startup/registerWebsocketEvents.ts:41 passes the raw event payload `data` into `utils.contains(data,
    '<iframe src="javascript:alert(`xss`)">')` as the completion criterion, and line 50 accepts any client array of length
    greater than one. The criterion is evaluated over data the client fully controls, and lib/challengeUtils.ts:31 shows the
    resulting `solve()` call persists the state with `await challenge.save()`.
  impact_description: Challenge and scoreboard state, the integrity signal this application exists to produce, can be written
    by any anonymous client, so recorded training progress and CTF scoring no longer reflect actual exploitation.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: None. The handler validates only the shape of the client-supplied string, not that the described event
    occurred.
  remediation:
    effort: Medium
    steps:
    - 'Derive challenge completion from server-observed state rather than a client assertion: record the XSS and SVG-injection
      evidence where the server already handles the request that renders or redirects, and have that server-side path call
      `challengeUtils.solveIf`.'
    - Where a browser-side signal is genuinely unavoidable, bind the event to the authenticated socket principal from the
      handshake middleware and to a server-generated nonce issued for that specific attempt, and reject events whose nonce
      was not issued or was already consumed.
    - Add a negative test that emits verifyLocalXssChallenge with the literal payload string over a socket that never triggered
      the XSS, and asserts the challenge remains unsolved.
    code_example: null
    verification: Emit `verifyLocalXssChallenge` with the literal iframe payload from a standalone socket.io-client script,
      then query the challenges table and assert `solved` is still false for `localXssChallenge`.
    reference: https://cwe.mitre.org/data/definitions/807.html
  mitigation_title: Move challenge verification off client-supplied socket payloads in registerWebsocketEvents.ts
  evidence:
  - file: lib/startup/registerWebsocketEvents.ts
    line: 41
