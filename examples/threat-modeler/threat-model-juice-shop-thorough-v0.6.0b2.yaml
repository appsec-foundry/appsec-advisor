security_controls:
- domain: Identity and Authentication Controls
  control: JWT Authentication Middleware
  effectiveness: Partial
  kind: mechanism
  assessment: 'RS256-signed JWTs are enforced by expressJwt (lib/insecurity.ts:52) on most protected routes. The signing algorithm
    is explicitly set (lib/insecurity.ts:54) and is sound. However the RSA private key is committed verbatim in source (lib/insecurity.ts:21),
    making token forgery trivial for any repo reader. Coverage is also incomplete: several state-changing endpoints lack the
    middleware.'
  implementation: lib/insecurity.ts:52-54; server.ts:395,406
  rule_id: ARCH-JWT-001
- domain: Identity and Authentication Controls
  control: Password Storage and Hashing
  effectiveness: Unsafe
  kind: mechanism
  assessment: Passwords are hashed with MD5 (`crypto.createHash('md5')`, lib/insecurity.ts:41). MD5 is a fast general-purpose
    hash with no salt; rainbow-table attacks recover MD5 password hashes in milliseconds. This is the sole password storage
    mechanism and it is trivially defeated.
  implementation: lib/insecurity.ts:41
- domain: Identity and Authentication Controls
  control: TOTP Multi-Factor Authentication
  effectiveness: Partial
  kind: mechanism
  assessment: 'TOTP 2FA is implemented and gated at login (routes/login.ts:37-44; routes/2fa.ts). However 2FA is opt-in per
    account: accounts with an empty totpSecret skip the second factor entirely. Administrative and privileged accounts are
    not required to enroll.'
  implementation: routes/login.ts:37-44; routes/2fa.ts
- domain: Identity and Authentication Controls
  control: Authentication Endpoint Rate Limiting
  effectiveness: Missing
  kind: mechanism
  assessment: No rate-limiting, account-lockout, or throttle middleware is observed on login, registration, password-reset,
    or TOTP-verification endpoints. The login route (server.ts:458) is unthrottled, permitting unbounded brute-force and credential-stuffing
    attempts.
  implementation: null
- domain: Identity and Authentication Controls
  control: Route Authentication Enforcement
  effectiveness: Weak
  kind: cross-cutting
  assessment: security.isAuthorized() expressJwt is applied to many routes but is absent from several state-changing endpoints
    including POST /file-upload, POST /profile/image/file, POST /profile/image/url, POST /rest/memories (server.ts:309-312),
    POST /api/Feedbacks (server.ts:406), and PUT /rest/continue-code-findIt/apply/:continueCode (server.ts:612).
  implementation: server.ts:309-312,406,606-607,612; lib/insecurity.ts:52
  rule_id: ARCH-AUTHN-001
- domain: Authorization Controls
  control: Centralised Authorization Policy
  effectiveness: Weak
  kind: cross-cutting
  assessment: Authorization is enforced route-by-route with no centralized policy engine. Nineteen or more sensitive PUT and
    DELETE routes show authz=unknown (server.ts:370-371, 389-390, 426, 429, 433, 440-441, 450-451, 605, 625, 627, 633-634),
    indicating no consistent ownership or role check covers them.
  implementation: server.ts:370-371,389-390,426,429,433,440-441,450-451,605,625
  rule_id: ARCH-AUTHZ-001
- domain: Authorization Controls
  control: Object-Level Ownership Verification (BOLA/IDOR)
  effectiveness: Weak
  kind: mechanism
  assessment: Routes with resource IDs in URL parameters (/api/Products/:id, /api/Recycles/:id, /api/BasketItems/:id, /api/Feedbacks/:id,
    /api/Cards/:id, /api/Addresss/:id) have JWT middleware present but no observable ownership binding checking the resource
    belongs to the authenticated caller (server.ts:370,388-390,426,429,433,440-441,450-451).
  implementation: server.ts:370,371,388,389,390,426,429,433,440,441,450,451
  rule_id: ARCH-BOLA-001
- domain: Authorization Controls
  control: Management Endpoint Protection
  effectiveness: Partial
  kind: mechanism
  assessment: GET /rest/admin/application-version and GET /rest/admin/application-configuration (server.ts:606-607) expose
    application metadata without a confirmed authentication gate (authn=unknown). These endpoints are accessible to unauthenticated
    callers.
  implementation: server.ts:606-607
  rule_id: ARCH-MGMT-001
- domain: Authorization Controls
  control: Database Principal Separation
  effectiveness: Missing
  kind: mechanism
  assessment: SQLite is accessed via a single Sequelize/TypeORM connection shared by all application code. There is no read-only
    replica or restricted user for read paths, no elevated principal scoped to admin operations, and no separation between
    application-level and schema-migration access.
  implementation: null
  rule_id: ARCH-DBSEP-001
- domain: Cryptography and Key Management
  control: JWT Signing Key Secrecy
  effectiveness: Unsafe
  kind: primitive
  assessment: The RSA private key used to sign every user JWT is committed verbatim as a string literal in source code (lib/insecurity.ts:21).
    Any repository reader can produce valid JWT tokens for arbitrary payloads, including admin identity claims. The key is
    static across all deployments with no rotation path.
  implementation: lib/insecurity.ts:21
  rule_id: ARCH-SECRET-001
- domain: Cryptography and Key Management
  control: HMAC Secret Key Management
  effectiveness: Unsafe
  kind: primitive
  assessment: An HMAC-SHA256 secret is hardcoded as a string literal (`pa4qacea4VK9t9nGv7yZtwmj`, lib/insecurity.ts:42). The
    key is trivially recoverable by any repository reader and cannot be rotated without a code change.
  implementation: lib/insecurity.ts:42
- domain: Cryptography and Key Management
  control: Blockchain Wallet Key Management
  effectiveness: Unsafe
  kind: primitive
  assessment: A BIP-39 mnemonic seed phrase is hardcoded in routes/checkKeys.ts:10. Any repository reader derives the wallet's
    private key hierarchy and controls all funds and assets associated with any derived address.
  implementation: routes/checkKeys.ts:10
- domain: Input Validation and Output Encoding
  control: SQL Query Parameterization
  effectiveness: Unsafe
  kind: mechanism
  assessment: 'The authentication query uses raw string interpolation: `SELECT * FROM Users WHERE email = ''${req.body.email}''
    AND password = ''${security.hash(req.body.password)}''` (routes/login.ts:34). This is an exploitable SQL injection on
    the primary authentication path. Sequelize parameterized queries are used correctly in model-layer code, but the login
    route bypasses them.'
  implementation: routes/login.ts:34; models/user.ts
  rule_id: ARCH-SQLI-001
- domain: Input Validation and Output Encoding
  control: Centralised Schema and Allowlist Input Validation
  effectiveness: Partial
  kind: cross-cutting
  assessment: Request-body handling is limited to string trimming (server.ts:411-413) and URL normalization (server.ts:204,246).
    No centralized schema-validation library is observed for structured request validation across routes; individual route
    handlers apply ad-hoc checks.
  implementation: server.ts:204,246,411-413
  rule_id: ARCH-INPUT-001
- domain: Input Validation and Output Encoding
  control: Angular Template Output Encoding and XSS Prevention
  effectiveness: Weak
  kind: mechanism
  assessment: 'Angular''s built-in template escaping is bypassed in at least eight locations via `DomSanitizer.bypassSecurityTrustHtml()`:
    feedback comments (about.component.ts:119, administration.component.ts:91), user emails (administration.component.ts:73),
    last-login IP (last-login-ip.component.ts:39), order ID (track-result.component.ts:48), captcha image (data-export.component.ts:57),
    search query parameter (search-result.component.ts:143), and product description (search-result.component.ts:110). Attacker-controlled
    values flow into these sinks.'
  implementation: frontend/src/app/about/about.component.ts:119; frontend/src/app/search-result/search-result.component.ts:110,143;
    frontend/src/app/administration/administration.component.ts:73,91; frontend/src/app/last-login-ip/last-login-ip.component.ts:39
  rule_id: ARCH-XSS-001
- domain: Session and Token Management
  control: JWT Session Lifecycle
  effectiveness: Weak
  kind: mechanism
  assessment: JWTs are stored in localStorage by the Angular frontend (request.interceptor.ts:13) and have a 6-hour expiry
    (lib/insecurity.ts:54). Revocation relies on an in-process `authenticatedUsers.tokenMap` (lib/insecurity.ts:70-90) that
    is cleared on process restart; there is no persistent revocation store, no session rotation on privilege change, and localStorage
    storage makes tokens accessible to any same-origin JavaScript.
  implementation: lib/insecurity.ts:54,70-90; frontend/src/app/Services/request.interceptor.ts:13
  rule_id: ARCH-COOKIE-001
- domain: Transport Security
  control: TLS Transport Encryption
  effectiveness: Partial
  kind: surface
  assessment: The Express server binds to port 3000 over plain HTTP; no TLS termination or HTTP-to-HTTPS redirect is configured
    in the application. TLS may be provided by an upstream reverse proxy, but no such configuration is declared or verifiable
    from repository content.
  implementation: null
  rule_id: ARCH-TLS-001
- domain: Transport Security
  control: CORS Policy
  effectiveness: Partial
  kind: mechanism
  assessment: 'Socket.io is configured with `cors: { origin: ''http://localhost:4200'' }` (lib/startup/registerWebsocketEvents.ts:20),
    restricting WebSocket origin to localhost — appropriate for development but unsuitable for any deployed environment. No
    CORS configuration is observed for the main Express REST API, leaving its cross-origin posture unclear.'
  implementation: lib/startup/registerWebsocketEvents.ts:20
  rule_id: ARCH-CORS-001
- domain: Supply Chain and Build Security
  control: Third-Party CI/CD Action Pinning
  effectiveness: Partial
  kind: lifecycle
  assessment: 'Several GitHub Actions references use mutable tags: `calibreapp/image-actions@main` (.github/workflows/image_actions.yml:33),
    `peter-evans/create-pull-request@v8` (line 42), and `coverallsapp/github-action@v2` (.github/workflows/ci.yml:188). A
    tag mutation or upstream account compromise injects arbitrary code into the build pipeline with the workflow''s GITHUB_TOKEN
    permissions.'
  implementation: .github/workflows/image_actions.yml:33,42; .github/workflows/ci.yml:188
  rule_id: ARCH-SUPPLY-001
- domain: Logging and Monitoring
  control: Security Event Logging
  effectiveness: Partial
  kind: cross-cutting
  assessment: No structured security event logging is observed for authentication results, authorization denials, or privilege
    changes in the inspected source. The application uses a general-purpose logger; correlation of security-relevant events
    for incident investigation is not evidenced.
  implementation: null
- domain: Operations Runtime and Supply Chain Controls
  control: Automated SCA scanning
  effectiveness: Missing
  kind: lifecycle
  assessment: Automated SCA scanning not detected in the repository. Patch-management posture depends on this control being
