assets:
- id: A-001
  name: User PII (email, delivery address, contact info)
  classification: Confidential
  description: Email addresses, physical delivery addresses, and contact details stored in the users and addresses tables.
    Collected at registration and checkout; accessible via user profile and data-export routes.
  linked_threats: []
  evidence_flags: []
- id: A-002
  name: Payment card data
  classification: Restricted
  description: Credit/debit card records held in the cards table, including card number, expiry, and holder name. Used during
    checkout; readable via /api/Cards/:id routes that lack object-level authorization checks.
  linked_threats: []
  evidence_flags: []
- id: A-003
  name: User account credentials (hashed passwords, security answers)
  classification: Restricted
  description: Password hashes and security question answers stored in the users table and security_answers table, used for
    login and account recovery. Exposure of these records enables offline cracking and account takeover.
  linked_threats: []
  evidence_flags: []
- id: A-004
  name: JWT session tokens
  classification: Confidential
  description: JSON Web Tokens issued at login and stored in browser localStorage. Stolen tokens grant full session access
    without re-authentication; no server-side revocation list is implemented.
  linked_threats: []
  evidence_flags: []
- id: A-005
  name: Challenge progress and solution state
  classification: Internal
  description: User-specific challenge completion records, continue-code state, and verdict data stored in the challenges
    and challenge_dependencies tables. Manipulation allows illegitimate challenge completion.
  linked_threats: []
  evidence_flags: []
- id: A-006
  name: Application database (SQLite file)
  classification: Confidential
  description: The SQLite database file containing all user, product, order, and challenge data. Direct file-system access
    yields unencrypted access to all stored records including password hashes and PII.
  linked_threats: []
  evidence_flags: []
- id: A-007
  name: Encryption and signing keys
  classification: Restricted
  description: Demo symmetric keys in encryptionkeys/ (AES, jwt.pub, premium.key) used for challenge state encryption and
    JWT verification. These are hardcoded demo keys committed to the repository; exposure allows forging tokens and decrypting
    challenge state.
  linked_threats: []
  evidence_flags:
  - inferred_classification
- id: A-008
  name: CI/CD pipeline secrets and workflow permissions
  classification: Internal
  description: GitHub Actions repository secrets, npm publish tokens, and Docker registry credentials accessed by release.yml
    and ci.yml. Tag-only action references and write-all default permissions expand the blast radius of a supply-chain compromise.
  linked_threats: []
  evidence_flags: []
- id: A-009
  name: Application configuration (CORS, CSP, feature flags)
  classification: Internal
  description: Environment-driven configuration in config/ controlling CORS policy, CSP headers, Helmet defaults, and LLM
    provider endpoints. The /rest/admin/application-configuration endpoint exposes this to unauthenticated callers.
  linked_threats: []
  evidence_flags: []
