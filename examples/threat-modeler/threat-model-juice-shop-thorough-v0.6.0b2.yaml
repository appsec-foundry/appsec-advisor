- local_id: cicd-pipeline-004
  threat_category_id: TH-14
  additional_categories: []
  stride: Tampering
  cwe: CWE-1357
  title: Release built without dependency lockfile (.github/workflows/release.yml:55)
  scenario: An attacker who publishes a malicious version inside any transitive dependency's semver range gets it installed
    at release time, because .github/workflows/release.yml:55 runs `npm install --production` with no lockfile committed to
    the repository and without --ignore-scripts. The package's install hook executes on the runner and its code is packaged
    by `npm run package:ci` on line 56 into the archive that softprops/action-gh-release attaches to the release on line 58.
  attack_steps:
  - I take over a maintainer account for a transitive dependency and publish a patch version carrying a postinstall hook.
  - The next tag push resolves the dependency graph fresh against the live registry, because no lockfile exists, and installs
    my version during `npm install --production`.
  - My postinstall hook runs on the runner and modifies the working tree before `npm run package:ci` builds the release archive.
  - The poisoned archive is attached to the draft GitHub release for every operating system and Node version in the matrix.
  evidence_summary: release.yml:55 installs with `npm install --production`, which resolves versions against the current registry
    state and executes lifecycle scripts. No package-lock.json exists in the repository and no workflow under .github/workflows
    uses `npm ci`, so no build in the pipeline is reproducible from a committed dependency baseline.
  impact_description: Every published release archive and Docker image can carry code that was never reviewed in a pull request,
    and the absence of a lockfile means no diff signal exists to detect the substitution after the fact.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: The lint job (ci.yml:36), lint-fixer.yml:17 and frontend-bundle-analysis.yml:26 install with --ignore-scripts;
    the packaging, test and end-to-end jobs use plain `npm install`.
  mitigation_title: Commit a lockfile and switch the release packaging step to `npm ci --ignore-scripts`
  remediation:
    effort: Medium
    steps:
    - Remove `package-lock=false` from .npmrc and frontend/.npmrc, generate and commit package-lock.json for both trees, then
      change .github/workflows/release.yml:55 and the packaging step at .github/workflows/ci.yml:292 to `npm ci --ignore-scripts
      --omit=dev`.
    - Add a minimum release age gate (npm `--before` or a Renovate `minimumReleaseAge` policy) so a version published minutes
      earlier cannot enter a release build.
    - Add a CI job that runs `npm ci` twice and fails if the lockfile is modified, proving the release install is deterministic.
    code_example: null
    verification: Run `npm ci --ignore-scripts --omit=dev` from a clean checkout and confirm it succeeds and leaves `git status
      --porcelain package-lock.json` empty.
    reference: https://docs.npmjs.com/cli/v10/commands/npm-ci
  evidence:
  - file: .github/workflows/release.yml
    line: 55
