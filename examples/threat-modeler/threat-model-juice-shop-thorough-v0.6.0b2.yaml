- local_id: cicd-pipeline-002
  threat_category_id: TH-14
  additional_categories: []
  stride: Tampering
  cwe: CWE-1104
  title: Action pinned to mutable branch ref (.github/workflows/image_actions.yml:33)
  scenario: Whoever controls the main branch of calibreapp/image-actions pushes a commit that GitHub resolves the next time
    .github/workflows/image_actions.yml:33 runs, executing that code inside this repository's runner with the secrets.GITHUB_TOKEN
    handed to it on line 35. A branch reference is re-resolved on every run, so no review of the repository can pin what actually
    executes.
  attack_steps:
  - I take over the calibreapp/image-actions repository and push a malicious commit onto its main branch.
  - The next push to master or develop that touches an image file resolves calibreapp/image-actions@main to my commit and
    runs it on a juice-shop runner.
  - My step reads the secrets.GITHUB_TOKEN passed on line 35 and uses it to write backdoored source or workflow files back
    into the repository.
  evidence_summary: image_actions.yml:33 references calibreapp/image-actions@main, a mutable branch ref that GitHub re-resolves
    on every run, and line 35 passes secrets.GITHUB_TOKEN to it. The same file also references actions/checkout@v6 (line 30)
    and peter-evans/create-pull-request@v8 (line 42) by tag, and ci.yml:188 references coverallsapp/github-action@v2 by tag.
  impact_description: Arbitrary third-party code executes in the repository's CI with a repository-scoped GITHUB_TOKEN, allowing
    modification of source and workflow files that subsequently flow into the published Docker image and the packaged release
    archive.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: The job is restricted to github.repository == 'juice-shop/juice-shop' and to non-fork pull requests (image_actions.yml:24-27);
    ci.yml and release.yml pin most of their actions by full commit SHA.
  mitigation_title: Pin the actions in image_actions.yml and ci.yml to full commit SHAs
  remediation:
    effort: Low
    steps:
    - Replace calibreapp/image-actions@main on line 33, actions/checkout@v6 on line 30 and peter-evans/create-pull-request@v8
      on line 42 with full 40-character commit SHAs plus a version comment, matching the convention already used in ci.yml.
