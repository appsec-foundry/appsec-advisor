  name: Express.js API Server
  description: Node.js Express server hosting all REST API routes, Socket.IO real-time event handlers, and the AI chatbot
    endpoint backed by Ollama or OpenAI-compatible LLM providers. Runs on port 3000 and serves the compiled Angular frontend
