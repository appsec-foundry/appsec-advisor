  cwe: CWE-522
  title: Predictable derived password (frontend/src/app/oauth/oauth.component.ts:30)
  scenario: An attacker who knows any OAuth user's e-mail address computes that user's shop password offline as btoa(email
    reversed), because OAuthComponent registers and logs in the account with exactly that value; the attacker then authenticates
    through the ordinary /rest/user/login form without touching Google at all.
  attack_steps:
  - I read a victim's e-mail address from a public feedback entry or the admin user list.
  - I compute the shop password locally as base64 of the reversed e-mail string, exactly as oauth.component.ts:30 does.
  - I submit that e-mail and password to the normal login form and receive a JWT for the victim's account.
  evidence_summary: oauth.component.ts:30 sets `const password = btoa(profile.email.split('').reverse().join(''))` and passes
    it to userService.save(), and line 46 reuses the identical expression to log in, so the credential is a pure function
    of the public identity claim.
  impact_description: Every account created through the Google login path is takeable by anyone who learns the e-mail address,
    giving access to that user's basket, order history, addresses, and stored payment methods, and to the admin panel if an
    administrator ever signed in through OAuth.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None
  mitigation_title: Stop deriving the account password from the e-mail claim in oauth.component.ts
  remediation:
    effort: Medium
    steps:
    - Remove the btoa(reversed email) password derivation at frontend/src/app/oauth/oauth.component.ts:30 and :46 and let
      the server establish the federated session from the verified token alone, with no local password created for the account.
    - Where a local credential must exist for legacy reasons, have the server generate it with a CSPRNG and never return or
      reconstruct it in the browser.
    - Add a spec asserting that OAuthComponent issues no userService.save() call carrying a password field.
    code_example: null
    verification: Run `npx vitest run frontend/src/app/oauth/oauth.component.spec.ts`; assert that the request body captured
      for /api/Users contains no `password` property and that login is driven by the OAuth token only.
    reference: https://cwe.mitre.org/data/definitions/522.html
