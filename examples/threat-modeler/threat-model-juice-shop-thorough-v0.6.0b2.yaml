  stride: Information Disclosure
  cwe: CWE-522
  title: Bot PAT exposed to later steps (.github/workflows/update-challenges-www.yml:19)
  scenario: 'The checkout at .github/workflows/update-challenges-www.yml:19 authenticates with secrets.BOT_TOKEN, a token
    carrying write access to the separate repository juice-shop/juice-shop.github.io, and does not set persist-credentials:
    false, so actions/checkout writes that token into the workspace .git/config as an HTTP extraheader. The two shell steps
    on lines 27 and 36 interpolate ${{ github.ref_name }} directly into their command lines, and the third-party stefanzweifel/git-auto-commit-action
    runs in the same job on line 45, giving several routes for injected or compromised code to read the token and use it against
    a repository outside this one''s permission model.'
  attack_steps:
  - I get push access to a branch of juice-shop/juice-shop and dispatch this workflow against a branch whose name terminates
    the shell quoting used on line 28.
  - My injected command reads the http.extraheader entry that actions/checkout wrote into the workspace .git/config and posts
    the BOT_TOKEN to a host I control.
  - I use the stolen token to commit to juice-shop/juice-shop.github.io, a repository in a different trust scope that this
    repository's permissions never covered.
  evidence_summary: 'update-challenges-www.yml:19 passes secrets.BOT_TOKEN to actions/checkout for the external repository
    juice-shop/juice-shop.github.io. No workflow under .github/workflows sets persist-credentials: false, and lines 28 and
    37 interpolate ${{ github.ref_name }} into a run: shell block. The same BOT_TOKEN pattern repeats in update-challenges-www-legacy.yml:19,
    update-challenges-ebook.yml:18, update-news-www.yml:14 and update-news-www-legacy.yml:14.'
  impact_description: A token with write access to three repositories in two GitHub organisations leaves the CI trust boundary,
    letting the holder publish content on the project's public website and companion guide under the project's own bot identity.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: The job is restricted to github.repository == 'juice-shop/juice-shop' (line 13) and the push trigger
    is limited to master and develop; the workflow_dispatch trigger on line 9 carries no such branch restriction.
  mitigation_title: 'Scope BOT_TOKEN to a GitHub App installation token and set persist-credentials: false in the update-*
    workflows'
  remediation:
    effort: Medium
    steps:
