- local_id: api-server-011
  threat_category_id: TH-17
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-209
  title: Stack traces returned by error handler (server.ts:682)
  scenario: An attacker harvests stack traces, file paths, and library versions because server.ts:682 mounts `errorhandler()`
    as the terminal Express middleware with no environment guard, and server.ts:730 sets its title from the application name
    and Express version. Every route that forwards a failure through `next(error)` — for example the raw SQL failure path
    at routes/login.ts:53 — reaches this handler, so a malformed injection payload returns the underlying SQLite error and
    the server-side call stack to the caller.
  evidence_summary: server.ts:682 registers the errorhandler middleware unconditionally, with no NODE_ENV or production check
    anywhere on that registration.
  impact_description: Internal file paths, dependency versions, and database error text are disclosed to anonymous callers,
    accelerating discovery of the injection and authentication flaws in the same component.
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: app.disable('x-powered-by') at server.ts:189 hides the framework header, but the error handler discloses
    far more
  mitigation_title: Restrict the verbose error handler to development in server.ts
  remediation:
    effort: Low
    steps:
    - Gate the registration at server.ts:682 so `errorhandler()` is only mounted when the process is explicitly in a development
      environment, and mount a handler that returns a generic message plus a correlation id otherwise.
    - Log the full error with its stack server-side under that correlation id so debuggability is preserved.
    - Add a test running the app in production mode that triggers a handler error and asserts the response body contains no
      `at ` stack frame and no absolute file path.
    code_example: null
    verification: Start the server in production mode, request a route that throws, and assert the JSON response carries only
      a message and correlation id with no stack array.
    reference: 'CWE-209: Generation of Error Message Containing Sensitive Information'
  evidence:
  - file: server.ts
    line: 682
