threats:
- local_id: api-server-001
  threat_category_id: TH-02
  additional_categories:
  - TH-03
  stride: Spoofing
  cwe: CWE-347
  title: JWT Verification Without Algorithm Allowlist
  scenario: 'An anonymous internet attacker forges a JWT for any account because neither JWT verification path constrains
    the accepted algorithm. `updateAuthenticatedUsers` calls `jwt.verify(token, publicKey, cb)` at lib/insecurity.ts:189 with
    no `algorithms` option, and `isAuthorized()` at lib/insecurity.ts:52 builds `expressJwt({ secret: publicKey })` the same
    way. The verification key is the RS256 public key loaded from `encryptionkeys/jwt.pub` at lib/insecurity.ts:20, which
    ships in the repository, so the attacker signs an HS256 token using that public key text as the HMAC secret and both verifiers
    accept it.'
  attack_steps:
  - I fetch the RS256 public key that the server itself reads from encryptionkeys/jwt.pub and treats as its verification secret.
  - I mint a token with header alg:HS256 and payload data.role=admin, signing it with the public key bytes as the HMAC secret.
  - I send that token to any route guarded by security.isAuthorized(); jsonwebtoken honours my alg header and verifies the
    HMAC successfully.
  - I now act as any user or as admin across every authenticated REST route on port 3000.
  evidence_summary: lib/insecurity.ts:189 calls jwt.verify with only a key and a callback; no algorithms allowlist is passed,
    and the key at line 20 is an asymmetric public key.
  impact_description: Complete authentication bypass for every REST route on port 3000, including admin-only functions, order
    data, wallets, and payment methods.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: expressJwt middleware is registered on most protected routes, but it is configured with the same unconstrained
    key material
  mitigation_title: Pin the accepted JWT algorithm to RS256 in lib/insecurity.ts
  remediation:
    effort: Low
    steps:
    - 'Pass `algorithms: [''RS256'']` to the jwt.verify call at lib/insecurity.ts:189 and to the expressJwt configuration
      at lib/insecurity.ts:52 so a token header can never select the accepted algorithm.'
    - Add a negative test that signs a token HS256 with the contents of encryptionkeys/jwt.pub as the secret and asserts that
      a protected route returns 401.
    code_example: null
    verification: 'Run the new test: `npm test -- --grep ''HS256 confusion''`; the request carrying the HS256-forged admin
      token must return HTTP 401 and no user context.'
    reference: 'CWE-347: Improper Verification of Cryptographic Signature'
  evidence:
  - file: lib/insecurity.ts
    line: 189
