  - T-062
- id: sqlite-database
  name: SQLite Database
  description: SQLite 3 data store (default) holding user accounts, orders, basket items, product catalog, feedback, payment
    cards, addresses, and challenge state. Accessed via TypeORM entity models; the runtime database file is created and seeded
    at startup by data/datacreator.ts.
