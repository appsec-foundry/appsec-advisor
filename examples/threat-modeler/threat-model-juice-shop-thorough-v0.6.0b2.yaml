verdict:
  severity: red
  opening: Juice Shop is not production-ready. Unauthenticated attackers can reach admin functions and extract the full customer
    database using publicly committed credentials, while persistent scripts in user-submitted content enable mass session
    theft.
  bullets:
  - title: Admin access without a password
    body: Any visitor forges a valid admin login token using the server key committed to the public repository.
    findings:
    - F-001
    - F-004
    weaknesses:
    - W-001
    - W-004
    verified_attack_path: true
  - title: Full database extracted without login
    body: Unauthenticated attackers read every user account and password hash via the login form's injectable query.
    findings:
    - F-007
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Active sessions stolen across all customers
    body: Stored scripts in product descriptions and user content execute in every visitor's browser, capturing login tokens.
    findings:
    - F-009
    weaknesses: []
    verified_attack_path: false
  - title: Any account reachable via a known password
    body: Seeded admin and demo accounts use fixed passwords that ship with every deployment.
    findings:
    - F-005
    - F-006
    weaknesses:
    - W-004
    verified_attack_path: false
  - title: Any customer's orders exposed to peers
    body: Logged-in users access other customers' orders and addresses by incrementing numeric record identifiers, with no
      ownership check.
    findings:
    - F-008
    weaknesses:
    - W-003
    verified_attack_path: false
  - title: Self-granted admin role for any user
    body: Any authenticated user promotes their own account to admin by including a role field in a profile update request.
    findings:
    - F-010
    weaknesses: []
    verified_attack_path: true
  closing: Remediation requires fixing the token verifier, rotating all committed keys and credentials, parameterizing database
    queries, and enabling server-side authorization checks.
  bullets_intro: 'What an attacker can do today, worst first:'
