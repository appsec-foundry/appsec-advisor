- local_id: cicd-pipeline-001
  threat_category_id: TH-14
  additional_categories: []
  stride: Spoofing
  cwe: CWE-345
  title: Unsigned container publish (.github/workflows/ci.yml:327)
  scenario: An attacker who obtains the DOCKERHUB_TOKEN repository secret authenticates at .github/workflows/ci.yml:327 and
    pushes a backdoored image over the bkimminich/juice-shop:latest tag written on line 345. No step in any workflow signs
    the image or emits a provenance attestation, so a downstream `docker pull` cannot distinguish the attacker's image from
    a genuine pipeline build.
  attack_steps:
  - I read DOCKERHUB_USERNAME and DOCKERHUB_TOKEN out of a runner during a develop push, using one of the pipeline's mutable-ref
    third-party actions.
  - I authenticate to Docker Hub with the stolen static token and push a backdoored image over the bkimminich/juice-shop:latest
    tag.
  - Downstream users pull bkimminich/juice-shop:latest and run my image, with no signature or provenance attestation available
    to contradict it.
  evidence_summary: ci.yml:327 authenticates the Docker Hub push with the long-lived DOCKERHUB_TOKEN repository secret rather
    than a workflow-scoped OIDC credential, and no workflow under .github/workflows requests id-token, invokes cosign, or
    produces a provenance attestation.
  impact_description: Consumers pulling bkimminich/juice-shop:latest execute attacker-supplied code under the project's own
    name, with no cryptographic means to detect the substitution and no way to bind a published image back to a specific pipeline
    run.
  likelihood: Medium
  impact: High
  risk: High
