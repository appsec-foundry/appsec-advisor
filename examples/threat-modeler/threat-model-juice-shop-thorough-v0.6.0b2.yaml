- local_id: cicd-pipeline-009
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-284
  title: Default-scope workflow token (.github/workflows/release.yml:20)
  scenario: 'The release workflow declares no permissions block at workflow or job level, so the GITHUB_TOKEN handed to softprops/action-gh-release
    at .github/workflows/release.yml:20 and to Gamesight/slack-workflow-status on line 108 is issued with the repository''s
    default scope rather than the contents: write that publishing a release needs. Any step in the packaging matrix that an
    attacker reaches, through the unlocked `npm install --production` on line 55 or a compromised action, inherits that broader
    write access to contents, packages, issues and pull requests.'
  attack_steps:
  - I get code execution in one of the release packaging jobs, for example through a dependency install script that runs during
    `npm install --production` on line 55.
  - I read the GITHUB_TOKEN that the job was issued and find it carries the repository default scope, because no permissions
    block narrows it.
  - I use that token to write to the repository's contents and packages rather than only to attach the release artifact the
    job was meant to publish.
  evidence_summary: release.yml declares no permissions key at workflow or job level while passing secrets.GITHUB_TOKEN to
    third-party actions on lines 20, 63 and 108. Only codeql-analysis.yml, pr-compliance.yml and lock.yml under .github/workflows
    declare a permissions block; ci.yml, release.yml, image_actions.yml, lint-fixer.yml, rebase.yml, frontend-bundle-analysis.yml,
    zap_scan.yml, stale.yml and the five update-* workflows do not.
  impact_description: A compromised release step operates with whatever the repository default token scope is rather than
    a scope the workflow can be reviewed against, so the blast radius of any other pipeline weakness cannot be bounded from
    the repository source alone.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: codeql-analysis.yml:11-14, pr-compliance.yml:7-9 and lock.yml:8-11 declare least-privilege permissions
    blocks, showing the pattern is already established in the repository; the release and CI workflows do not use it.
  mitigation_title: Declare least-privilege permissions blocks in release.yml and ci.yml
  remediation:
    effort: Low
    steps:
    - 'Add a top-level `permissions: contents: read` to .github/workflows/release.yml and .github/workflows/ci.yml, then grant
      `contents: write` only on the create-release and package jobs that attach artifacts.'
    - Apply the same top-level read-only default to image_actions.yml, lint-fixer.yml, rebase.yml, frontend-bundle-analysis.yml,
      zap_scan.yml, stale.yml and the five update-* workflows, raising individual jobs only where they demonstrably need write.
    - Set the repository's default GITHUB_TOKEN workflow permissions to read-only in the Actions settings so a workflow that
      omits the block fails closed.
    code_example: null
    verification: Push a test tag and confirm the release run still attaches the packaged archives while a step running `gh
      api repos/:owner/:repo/issues -f title=probe` fails with 403.
    reference: https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
  evidence:
  - file: .github/workflows/release.yml
    line: 20
  controls_absent_evidence:
  - pattern: 'permissions:'
    search_paths:
    - .github/workflows/release.yml
    - .github/workflows/ci.yml
    hit_count: 0
