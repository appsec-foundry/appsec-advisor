  stride: Tampering
  cwe: CWE-74
  title: Prompt injection via unvalidated messages (routes/chat.ts:191)
  scenario: 'LLM01 — Prompt Injection: an anonymous caller overrides the chatbot''s behavioural rules because routes/chat.ts:191
    reads the entire `req.body.messages` array with no schema, role, or length validation and passes it verbatim to `streamText`
    at routes/chat.ts:206 alongside the trusted system prompt. Nothing filters attacker-supplied entries with `role: ''system''`
    or `role: ''assistant''`, so injected turns are indistinguishable from the server''s own instructions. The coupon policy
    at routes/chat.ts:98-103 is prompt text only, with no check outside the model, so an injected instruction reaches the
    `generateCoupon` tool.'
  evidence_summary: routes/chat.ts:191 assigns req.body.messages to a local with only a nullish-coalescing default, and no
    validation runs before the array reaches streamText at line 206.
  impact_description: An attacker dictates chatbot behaviour, extracts the system prompt, and drives the coupon-issuing tool
    outside the policy the prompt describes.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Behavioural rules are stated in the system prompt at routes/chat.ts:84-105; no code-level check enforces
    them
  mitigation_title: Validate and constrain the chat messages array in routes/chat.ts
  remediation:
    effort: Medium
    steps:
    - Parse `req.body.messages` at routes/chat.ts:191 with a strict zod schema that permits only `user` and `assistant` roles,
      rejects any client-supplied `system` turn, and caps both entry count and per-entry length.
    - Move every enforceable rule out of the prompt into server-side checks at the tool boundary, so an injected instruction
      cannot change what the tools will do.
