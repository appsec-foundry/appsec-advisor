- local_id: api-server-009
  threat_category_id: TH-08
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-918
  title: SSRF via profile image URL (routes/profileImageUrlUpload.ts:24)
  scenario: A low-privilege authenticated user makes the server issue arbitrary outbound requests because routes/profileImageUrlUpload.ts:24
    calls `fetch(url)` with `req.body.imageUrl` taken verbatim from routes/profileImageUrlUpload.ts:19. No scheme or host
    allowlist is applied, so the attacker targets loopback services, RFC 1918 addresses, or a cloud metadata endpoint. When
    the fetch fails, the catch branch at routes/profileImageUrlUpload.ts:36 stores the raw URL on the user profile, turning
    response behaviour and timing into an oracle for what the server could reach.
  evidence_summary: routes/profileImageUrlUpload.ts:24 passes the unvalidated req.body.imageUrl string directly to fetch,
    with no destination allowlist between the assignment at line 19 and the call.
  impact_description: Internal network and cloud metadata reachable from the API server can be probed, and retrieved content
    is written into the publicly served uploads directory.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: The handler requires a session cookie resolved via security.authenticatedUsers at routes/profileImageUrlUpload.ts:21;
    the destination itself is unrestricted
  mitigation_title: Allowlist the fetch destination in routes/profileImageUrlUpload.ts
  remediation:
    effort: Medium
    steps:
    - Before the fetch at routes/profileImageUrlUpload.ts:24, parse the URL, require an https scheme, resolve the host, and
      reject loopback, link-local, and private address ranges as well as any host outside a configured allowlist.
    - Set an explicit request timeout and response size cap on the fetch, and stop persisting the raw URL in the failure branch
      at line 36.
    - Add tests posting `http://169.254.169.254/latest/meta-data/` and `http://127.0.0.1:3000/` and asserting both are rejected
      before any outbound request.
