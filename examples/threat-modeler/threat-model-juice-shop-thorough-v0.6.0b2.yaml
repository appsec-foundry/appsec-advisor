  title: SQL Injection
  scenario: An anonymous attacker authenticates as any account because routes/login.ts:34 builds the login query by interpolating
    `req.body.email` directly into `SELECT * FROM Users WHERE email = '...' AND password = '...'` and passes it to `models.sequelize.query`.
    No parameter binding or escaping is applied, so a quote plus comment sequence in the email field truncates the password
    predicate and the first returned row is handed to `afterLogin` at routes/login.ts:48, which issues a full session token.
  attack_steps:
  - I POST to /rest/user/login with the email field set to a value that closes the string literal and comments out the rest
    of the WHERE clause.
  - The interpolated statement at routes/login.ts:34 now matches the first non-deleted user row regardless of the supplied
    password.
  - afterLogin issues me a signed JWT and a basket id for that account at routes/login.ts:24.
  - I reuse that token against every authenticated REST route on port 3000.
  evidence_summary: routes/login.ts:34 concatenates req.body.email into a raw SQL string passed to sequelize.query, with no
    bind parameters.
  impact_description: Authentication bypass into arbitrary accounts including administrators, plus arbitrary read of the Users
    table through the same injection point.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Sequelize parameterized queries are used on most data paths but explicitly not on this login route
