- local_id: api-module-001
  threat_category_id: TH-02
  additional_categories: []
  stride: Spoofing
  cwe: CWE-798
  title: Hardcoded bearer token signing secret (src/Login.php:10)
  scenario: An attacker reads ACCESS_TOKEN_SECRET = '12345' from Login.php source, then constructs and signs a custom token
    claiming any user identity, and presents it as a valid Bearer token to every protected endpoint.
  attack_steps:
  - Attacker reads the constant ACCESS_TOKEN_SECRET = '12345' from vulnerabilities/api/src/Login.php line 10 (exposed via
    public repo or DVWA lab access).
  - Attacker crafts a token payload with an arbitrary user identity and a future expiry, then signs it using the known secret
    via Token::create_token().
  - Attacker submits the forged Bearer token in the Authorization header to any protected endpoint (e.g. GET /vulnerabilities/api/v2/order/)
    and receives a 200 response with full data.
  - Attacker reuses the same secret to forge refresh tokens using REFRESH_TOKEN_SECRET = '98765' and extends their access
    indefinitely without re-authenticating.
  evidence_summary: Login.php line 10 defines ACCESS_TOKEN_SECRET as the PHP string literal '12345'; line 33 verifies tokens
    by comparing the decrypted secret field against this constant, making offline token forgery trivial for any identity.
  impact_description: Any attacker who reads the source can forge valid session tokens for any user identity and access all
    order and user data, or perform any write operation across the entire API.
  likelihood: High
  impact: High
  risk: Critical
  controls_in_place: Login::check_access_token() validates token format and expiry; controls are structurally sound but rendered
    void by the trivially guessable secret.
  mitigation_title: Replace hardcoded secrets with cryptographically random environment-supplied values in Login.php
  remediation:
    effort: Low
    steps:
    - Remove the ACCESS_TOKEN_SECRET and REFRESH_TOKEN_SECRET string literals from Login.php and read them from an environment
      variable or application configuration at startup.
    - Generate a minimum 256-bit random secret using openssl_random_pseudo_bytes() or equivalent CSPRNG on first deployment
      and store it in a secret manager or .env file outside the repository.
    - Add a PHPUnit test that asserts Login::check_access_token() rejects a token signed with a different secret, confirming
      that secret rotation invalidates existing tokens.
    code_example: null
    verification: 'Confirm ACCESS_TOKEN_SECRET is not a string literal in Login.php: grep -n ''ACCESS_TOKEN_SECRET.*='' vulnerabilities/api/src/Login.php
      should return only the const declaration referencing a configuration call, not a hardcoded value.'
    reference: 'CWE-798: https://cwe.mitre.org/data/definitions/798.html'
