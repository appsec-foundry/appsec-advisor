- local_id: auth-module-010
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-284
  title: Security-level cookie client-controlled without server authorization
  scenario: An authenticated low-privilege user sets their browser cookie 'security=low'; dvwaSecurityLevelGet() at line 204
    reads $_COOKIE['security'] directly without verifying the caller is admin or that the change was authorized server-side;
    all subsequent requests use 'low' security level, disabling HttpOnly and SameSite cookie flags and reducing protections
    on every vulnerability lab handler.
  attack_steps: null
  evidence_summary: dvwaSecurityLevelGet() at line 204 returns $_COOKIE['security'] unconditionally when the cookie is present,
    with no server-side session check against who is permitted to change the security level; any browser can inject or modify
    this cookie to choose 'low', 'medium', 'high', or 'impossible'.
  impact_description: Any authenticated user can self-lower the security level from 'impossible' to 'low', removing HttpOnly
    and SameSite protections from the session cookie and relaxing all lab-level controls for their own session.
  likelihood: High
  impact: Medium
  risk: Medium
  controls_in_place: Cookie value validated against allowlist ['low','medium','high','impossible'] at line 22, preventing
    arbitrary values
  mitigation_title: Store and enforce security level server-side in the authenticated session, not the client cookie
  remediation:
    effort: Medium
    steps:
    - Move the authoritative security level from $_COOKIE['security'] to $_SESSION['dvwa']['security_level'], set only on
      successful POST from security.php by an admin-level user.
    - Retain the cookie only as a transport hint validated and overridden by the session value, or remove it entirely.
    - Add a test confirming that a non-admin user POSTing to security.php to lower the level receives a 403 and the session
      level is unchanged.
    code_example: null
    verification: 'As a non-admin authenticated user, set Cookie: security=low and request a lab page; confirm the page executes
      at the server-assigned level rather than ''low''.'
    reference: 'CWE-284: Improper Access Control'
