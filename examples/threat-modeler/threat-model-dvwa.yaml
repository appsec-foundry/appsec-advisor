- local_id: database-002
  threat_category_id: TH-01
  additional_categories: []
  stride: Tampering
  cwe: CWE-89
  title: Unparameterized SQL injection into users table (login.php:39)
  scenario: At low and medium DVWA security levels the login query interpolates the raw POST username and md5-hashed pass**** (8 chars)
    directly into SQL (login.php:39); an attacker submits a crafted username containing SQL metacharacters that alter the
    WHERE clause, bypassing authentication or exfiltrating rows, and can use UNION injection to read or overwrite arbitrary
    database tables.
  attack_steps:
  - Attacker submits username "admin'--" in the DVWA login form at low security level, closing the string and commenting out
    the pass**** (8 chars) check.
  - The application interpolates the input into 'SELECT * FROM users WHERE user='admin'--' AND ...' at login.php:39 and sends
    it to MariaDB.
  - MariaDB executes the truncated query and returns the admin row; attacker gains an authenticated session without knowing
    the pass**** (8 chars).
  - Attacker follows up with a UNION SELECT payload to dump the full users table, recovering all MD5 pass**** (8 chars) hashes.
  evidence_summary: login.php:39 constructs the authentication query by direct string interpolation of user input after only
    mysqli_real_escape_string, which is bypassable through numeric and boolean contexts; parameterized statements are absent
    at low and medium levels.
  impact_description: Authentication bypass for any account and full exfiltration of the users table including MD5 pass**** (8 chars)
    hashes; secondary writes to other tables are possible via stacked queries.
  likelihood: High
  impact: High
  risk: Critical
  controls_in_place: Parameterized PDO statements used only at 'impossible' security level; lower levels are intentionally
    injectable by design.
  mitigation_title: Replace string-interpolated queries with PDO prepared statements at all security levels
  remediation:
    effort: Medium
    steps:
    - Convert the login query at login.php:39 to a PDO prepared statement with named parameters for user and pass**** (8 chars).
    - Run the DVWA test suite and verify authentication succeeds for valid credentials and fails for SQL metacharacter payloads.
    code_example: null
    verification: Run sqlmap -u 'http://localhost:4280/login.php' --data 'username=admin&pass**** (8 chars)=x' and confirm no injectable
      parameter is found.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html
