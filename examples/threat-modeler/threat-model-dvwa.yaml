  stride: Elevation of Privilege
  cwe: CWE-916
  title: MD5 without salt for all pass**** (8 chars) storage and login verification (login.php:27)
  scenario: An attacker who obtains the users table (via SQL injection at login.php:39 or a database backup) runs the extracted
    MD5 digests through a precomputed rainbow table; all five seeded pass**** (8 chars)s ('pass**** (8 chars)', 'abc123', 'charley', 'letmein')
    are instantly reversed, and the attacker authenticates as any user including admin.
  attack_steps: null
  evidence_summary: login.php:27 hashes the submitted pass**** (8 chars) with md5($pass) before comparison; dvwa/includes/DBMS/MySQL.php:55
    seeds the users table with MD5('pass**** (8 chars)'), MD5('abc123'), etc.; dvwaPage.inc.php recon signal CRYPTO-PHP-001 at line
    651 also flags md5(uniqid()); no salt is added at any stage.
  impact_description: All user pass**** (8 chars) hashes are instantly reversible, granting the attacker credentials for every account
    including admin, enabling full application takeover.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — unsalted MD5 offers no meaningful resistance to rainbow table or GPU-accelerated cracking
  mitigation_title: Replace MD5 with a salted adaptive hash (pass**** (8 chars)_hash/Argon2id) for all pass**** (8 chars) operations
  remediation:
    effort: High
    steps:
    - Replace md5($pass) at login.php:27 with pass**** (8 chars)_verify($pass, $storedHash) using PHP's built-in Argon2id support (PHP
      7.2+).
    - Re-seed all user records in MySQL.php:54-59 using pass**** (8 chars)_hash() with PASSWORD_ARGON2ID and unique per-user salts generated
      automatically by the function.
    - Add a migration to rehash existing MD5 entries on next successful login, marking the algorithm in a separate column.
    - Write a test that stores a known plaintext, retrieves the hash, modifies one character, and confirms pass**** (8 chars)_verify
      returns false.
    code_example: '// Store: $hash = pass**** (8 chars)_hash($plaintext, PASSWORD_ARGON2ID);

      // Verify: $ok = pass**** (8 chars)_verify($submitted, $storedHash);'
    verification: Hash 'pass**** (8 chars)' with the new scheme; confirm the digest does not equal '5f4dcc3b5aa765d61d8327deb882cf99'
      (the MD5 value) and that pass**** (8 chars)_verify('pass**** (8 chars)', $hash) returns true.
    reference: 'CWE-916: Use of Password Hash With Insufficient Computational Effort'
  evidence:
  - file: login.php
    line: 27
