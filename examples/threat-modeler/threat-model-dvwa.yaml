tier_root_causes:
  server:
  - Unsanitized user input passed directly to shell and SQL interpreters
  - Authentication checks absent or bypassable on critical API entry points
  - Client-supplied values used to resolve server-side authorization decisions
  - No rate limiting on credential verification at any authentication endpoint
  - CI pipeline uses mutable action references with overbroad token permissions
  data:
  - Credentials stored in plaintext and committed to version-controlled source
  - Weak hash algorithm without salt used for all credential storage
  - Absence of query audit logging prevents forensic reconstruction of attacks
  - No resource limits on database container enable uncapped query exhaustion
