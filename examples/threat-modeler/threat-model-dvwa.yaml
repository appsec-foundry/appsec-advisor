    the host.
  evidence_summary: HealthController.php line 88 calls exec('ping -c 4 ' . $target) where $target is taken verbatim from $_POST
    JSON input with no sanitization, quoting, or allowlist validation, permitting shell metacharacter injection.
  impact_description: Unauthenticated remote code execution as the web server OS user, enabling full host compromise, credential
    theft, and lateral movement.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None. The health endpoint has no authentication check and performs no input validation on the target
    field.
