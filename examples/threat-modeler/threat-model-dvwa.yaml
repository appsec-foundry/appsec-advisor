  stride: Elevation of Privilege
  cwe: CWE-284
  title: Missing permissions block (.github/workflows/docker-image.yml:1)
  scenario: A compromised GitHub Action step in docker-image.yml (e.g., via a re-tagged third-party action per ci-pipeline-002)
    executes with the default GITHUB_TOKEN, which on repositories with legacy defaults grants write access to contents, packages,
    pull-requests, and issues; the compromised step can push malicious commits, create releases, or modify package metadata
    under the project owner's identity.
  evidence_summary: docker-image.yml has no `permissions:` key at workflow level or job level (lines 1–45); IAC-010 High config-scan
    signal at line 1 confirms the missing permissions block, meaning the GITHUB_TOKEN inherits the repository's default scope,
    which may be write-all on older repositories.
  impact_description: A compromised step gains write access to repository contents, ghcr.io packages, and GitHub releases,
    enabling persistent backdoor injection or malicious package publication under the project's trusted identity.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: GITHUB_TOKEN package-write scope limits registry push to the repository owner namespace; image destination
    derived from GitHub metadata
  mitigation_title: Add least-privilege permissions block to docker-image.yml
  remediation:
    effort: Low
    steps:
    - 'Add `permissions: { contents: read, packages: write }` at the workflow level in docker-image.yml (before `jobs:`) to
      grant only the scopes needed: read source and push to ghcr.io.'
    - Verify no other step in the workflow requires additional scopes; if so, declare those at the individual job level rather
      than broadening the workflow-level grant.
    code_example: null
    verification: 'After adding the block: `gh run view <run-id> --json permissions` must show exactly `contents: read` and
      `packages: write`; any additional write scope indicates over-permission.'
    reference: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#considering-cross-repository-access
