    pass**** (8 chars) hashes.
  - 'Attacker sends PUT /vulnerabilities/api/v2/user/1 with body {"name": "owned", "level": 1} and elevates the user record
    without any authentication.'
  - Attacker sends DELETE /vulnerabilities/api/v2/user/2 and removes a user account, disrupting service for legitimate users.
  evidence_summary: UserController.processRequest() at line 265 switches on HTTP method and calls getUser/getAllUsers/addUser/updateUser/deleteUser
    directly; unlike OrderController, no checkToken() call precedes these operations, leaving all user data endpoints completely
    unauthenticated.
  impact_description: Any unauthenticated client can enumerate all user records (including privilege levels and pass**** (8 chars) hashes),
    create admin-level users, modify or delete any user account, or perform privilege escalation by setting level=1 on any
