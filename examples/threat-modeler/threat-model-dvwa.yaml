security_controls:
- domain: Identity and Authentication
  control: Password Hashing Algorithm
  effectiveness: Unsafe
  kind: primitive
  rule_id: null
  assessment: User pass**** (8 chars)s are stored as unsalted MD5 digests (login.php:39, dvwaPage.inc.php). MD5 is a general-purpose
    hash with no work factor; unsalted digests are trivially reversed via precomputed rainbow tables. The mechanism is present
    and relied upon for all credential verification but is cryptographically defeated.
  implementation: dvwa/includes/dvwaPage.inc.php; login.php
  status_note: MD5 without salt — rainbow-table reversal trivial; replace with Argon2id or bcrypt.
- domain: Identity and Authentication
  control: Authentication Gate (dvwaPageStartup)
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-AUTHN-001
  assessment: dvwaPageStartup(['authenticated']) is called on protected lab pages and redirects unauthenticated requests to
    login.php (dvwaPage.inc.php:132). Coverage is confirmed for the majority of lab modules, but the disable_authentication
    bypass flag allows the entire gate to be skipped in lab configurations. The gate itself functions correctly; the bypass
    path makes effective coverage conditional.
  implementation: dvwa/includes/dvwaPage.inc.php:132; login.php:6
  status_note: Gate present but disable_authentication flag allows complete bypass.
- domain: Identity and Authentication
  control: Authentication Bypass Flag (disable_authentication)
  effectiveness: Unsafe
  kind: mechanism
  rule_id: null
  assessment: The disable_authentication flag is documented in the auth-module and, when set, causes dvwaPageStartup to skip
    the session check entirely. This is a implemented, relied-upon mechanism that defeats authentication for all pages when
    active. Its presence in production-accessible configurations constitutes a complete authentication bypass.
  implementation: dvwa/includes/dvwaPage.inc.php
  status_note: Complete authentication bypass — must not be enabled in any internet-exposed deployment.
- domain: Identity and Authentication
  control: Login Anti-CSRF Token
  effectiveness: Partial
  kind: mechanism
  rule_id: null
  assessment: checkToken() validates user_token against session_token on login form submission (login.php:18, dvwaPage.inc.php:146).
    The token is present for the login form. Coverage of other state-changing endpoints across lab modules is not uniformly
    confirmed; CSRF lab module itself intentionally omits the token at lower security levels.
  implementation: login.php:18; dvwa/includes/dvwaPage.inc.php:146
  status_note: CSRF token on login form confirmed; coverage of other state-changing lab endpoints is incomplete.
- domain: Session Management
  control: Session Cookie Hardening
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-COOKIE-001
  assessment: PHP session cookies are used throughout the application. No positive evidence of Secure, HttpOnly, or SameSite
    cookie attributes in the codebase. Since the application serves only HTTP (no TLS), the Secure flag cannot be set meaningfully,
    and absence of HttpOnly leaves session tokens accessible to client-side JavaScript. Assessed as Partial because of missing
    positive evidence, not confirmed absence.
  implementation: dvwa/includes/dvwaPage.inc.php
  status_note: No confirmed Secure/HttpOnly/SameSite flags; HTTP-only deployment means Secure flag is inapplicable.
- domain: Session Management
  control: Session Regeneration on Privilege Change
  effectiveness: Partial
  kind: mechanism
  rule_id: null
  assessment: The auth-module description states session regeneration occurs on privilege change. Full coverage across all
    privilege transitions (security-level changes, logout) is not confirmed in the available evidence.
  implementation: dvwa/includes/dvwaPage.inc.php
  status_note: Regeneration on login described; full coverage of all privilege transitions unconfirmed.
- domain: Authorization
  control: Object-Level Ownership Check (BOLA/IDOR)
  effectiveness: Missing
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: No evidence of per-resource ownership verification for user or order operations. API-module order and user endpoints
    accept user-supplied identifiers without binding them to the authenticated token subject. BOLA/IDOR is an intentional
    teaching defect in the API lab module.
  implementation: null
  status_note: No ownership checks on user or order resources — intentional IDOR exposure in api-module.
- domain: Input Validation and Injection Prevention
  control: SQL Injection Prevention (Parameterized Queries)
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-SQLI-001
  assessment: PDO prepared statements are used only at the impossible security level (vulnerabilities/captcha/source/impossible.php:40,48).
    All other security levels use unescaped string interpolation or mysqli_real_escape_string (login.php:39), which is not
    equivalent to parameterization and is intentionally bypassable as a teaching exercise. The login credential query uses
    escape-based construction rather than parameterized statements.
  implementation: vulnerabilities/captcha/source/impossible.php:40,48 (parameterized); login.php:22,39 (escape-only)
  status_note: Parameterized queries only at impossible level; all other levels are intentionally injectable.
- domain: Input Validation and Injection Prevention
  control: Command Injection Prevention
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-INPUT-001
  assessment: The exec module uses blacklist character filtering at medium and high security levels (vulnerabilities/exec/source/medium.php:7,13;
    vulnerabilities/exec/source/high.php:7,20). Blacklists are bypassable through alternative separators and encodings and
    are intentionally incomplete as teaching artefacts. The impossible level uses a strict allowlist pattern.
  implementation: vulnerabilities/exec/source/medium.php:7,13; vulnerabilities/exec/source/high.php:7,20
  status_note: Blacklist-only at medium/high — bypassable; allowlist only at impossible level.
- domain: Input Validation and Injection Prevention
  control: Centralized Input Validation Schema
  effectiveness: Weak
  kind: cross-cutting
  rule_id: ARCH-INPUT-001
  assessment: No framework-level or centralized input validation is present. Each lab module applies its own per-level filtering,
    ranging from no validation (low) through blacklists (medium/high) to allowlists (impossible). The JavaScript lab uses
    a ROT13 client-side obfuscation rather than server-side schema validation (vulnerabilities/javascript/source/low.php:13).
  implementation: vulnerabilities/javascript/source/low.php:13 (client-side only)
  status_note: No centralized validation; per-module ad-hoc filtering with intentional gaps.
- domain: Output Encoding and Browser Security
  control: XSS Output Encoding
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-XSS-001
  assessment: The authbypass module writes user_id values directly into innerHTML without encoding (vulnerabilities/authbypass/authbypass.js:43).
    No template engine autoescape is in use; PHP output uses manual htmlspecialchars calls inconsistently across modules.
    XSS at low/medium security levels is intentional across stored, reflected, and DOM XSS modules.
  implementation: vulnerabilities/authbypass/authbypass.js:43
  status_note: innerHTML without encoding confirmed; XSS exposure is intentional across multiple modules.
- domain: Output Encoding and Browser Security
  control: Content Security Policy
  effectiveness: Missing
  kind: mechanism
  rule_id: null
  assessment: No Content-Security-Policy header is emitted by the application. The CSP lab module teaches about CSP as a concept
    but the application itself does not enforce a CSP that would constrain script execution.
  implementation: null
  status_note: No CSP header — script injection is unconstrained at the browser level.
- domain: Transport Security
  control: TLS / HTTPS Enforcement
  effectiveness: Missing
  kind: mechanism
  rule_id: ARCH-TLS-001
  assessment: No TLS configuration is present in the application or Docker Compose deployment. The API OpenAPI spec declares
    the server URL as http://dvwa.test (vulnerabilities/api/openapi.yml:10; vulnerabilities/api/src/UserController.php:15).
    The application binds on TCP 4280 over plain HTTP. All session tokens, credentials, and lab data traverse the network
    in cleartext.
  implementation: null
  status_note: No TLS — all traffic including session cookies and credentials traverse cleartext.
- domain: Transport Security
  control: HTTP Security Headers (HSTS, X-Content-Type-Options, Referrer-Policy)
  effectiveness: Missing
  kind: mechanism
  rule_id: null
  assessment: No evidence of Strict-Transport-Security, X-Content-Type-Options, Referrer-Policy, or Permissions-Policy headers
