- local_id: api-module-009
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-639
  title: Missing object-level authorization on order endpoints BOLA
  scenario: An authenticated attacker supplies another user's order ID in GET /order/{id}, PUT /order/{id}, or DELETE /order/{id};
    OrderController validates the bearer token but performs no check that the token subject owns the requested order, returning
    or mutating the target order.
  evidence_summary: OrderController.getOrder() at line 96 calls checkToken() to verify the bearer token is valid but then
    retrieves $this->data[$id] with no comparison between the order's owner and the token's identity; the same pattern applies
    to updateOrder() and deleteOrder(). Any valid token is sufficient to read or modify any order ID.
  impact_description: Any authenticated user can enumerate, modify, or delete orders belonging to other users by incrementing
    the order ID, exposing shipping addresses and order contents and enabling fraudulent order manipulation.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Token validity is checked (checkToken() verifies the bearer token format and expiry); resource ownership
    is not checked.
  mitigation_title: Add token-subject-to-order-owner check in OrderController.getOrder, updateOrder, and deleteOrder
  remediation:
    effort: Medium
    steps:
    - Extract the user identity (name or ID) from the decrypted token in checkToken() and return it alongside the boolean
      result.
    - In getOrder(), updateOrder(), and deleteOrder(), compare the token subject to the order's owner field before returning
      or mutating the record; return HTTP 403 on mismatch.
    - Add a test that authenticates as user A, then requests order ID belonging to user B, and asserts HTTP 403 is returned.
    code_example: null
    verification: Authenticate as 'tony', then send GET /vulnerabilities/api/v2/order/2 (Morph's order) and confirm the response
      is HTTP 403.
    reference: 'CWE-639: https://cwe.mitre.org/data/definitions/639.html'
