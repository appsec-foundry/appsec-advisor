- local_id: database-006
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: No resource limits on MariaDB container (compose.yml:28)
  scenario: The db service in compose.yml defines no Docker resource limits (memory, CPU) and no MariaDB max_connections or
    max_allowed_packet arguments; an attacker who can execute queries via SQL injection or the disclosed dvwa credential issues
    resource-exhausting queries or bulk inserts that consume unbounded host memory and CPU, making the database and the application
    unavailable.
  evidence_summary: compose.yml db service block starting at line 28 defines no deploy.resources constraints and passes no
    MariaDB tuning arguments; a zero-hit search for resource-bounding keywords in compose.yml confirms the absence.
