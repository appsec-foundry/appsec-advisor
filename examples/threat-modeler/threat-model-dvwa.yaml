  title: OS command injection via unsanitized $target in exec (HealthController.php:88)
  scenario: An unauthenticated attacker sends POST /vulnerabilities/api/v2/health/connectivity with a JSON body where 'target'
    contains shell metacharacters, causing exec() to execute arbitrary OS commands as the web server user.
  attack_steps:
  - 'Attacker sends POST /vulnerabilities/api/v2/health/connectivity with Content-Type: application/json and body {"target":
    "127.0.0.1; id"} to the unauthenticated endpoint.'
  - PHP executes exec('ping -c 4 127.0.0.1; id', ...) where the semicolon introduces a second command interpreted by the shell.
  - The id command executes as the web server user (www-data or equivalent); attacker substitutes a reverse-shell payload
    to gain persistent interactive access.
