  stride: Information Disclosure
  cwe: CWE-916
  title: Unsalted MD5 pass**** (8 chars) storage enables hash reversal (MySQL.php:55)
  scenario: All user accounts are seeded with unsalted MD5 hashes (MySQL.php:55) and the authentication path hashes submitted
    pass**** (8 chars)s with bare md5() (login.php:27); an attacker who obtains a copy of the users table via SQL injection or direct
    database access recovers plaintext pass**** (8 chars)s for all accounts using precomputed rainbow tables, including the admin account
    whose MD5 hash for 'pass**** (8 chars)' is universally known.
  evidence_summary: MySQL.php:55 inserts user rows using MD5('pass**** (8 chars)') with no salt; login.php:27 confirms the same unsalted
    md5() is used at authentication, meaning stored hashes are directly comparable to rainbow-table entries.
  impact_description: Full plaintext credential recovery for all user accounts if the users table is read; the admin pass**** (8 chars)
    'pass**** (8 chars)' is recoverable in milliseconds from its MD5 hash 5f4dcc3b5aa765d61d8327deb882cf99.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None
  mitigation_title: Replace MD5 with Argon2id and add per-user salts in the authentication and setup modules
  remediation:
    effort: Medium
    steps:
    - Replace md5($pass) in login.php:27 and the MD5() calls in MySQL.php:55 with PHP pass**** (8 chars)_hash($pass, PASSWORD_ARGON2ID)
      and pass**** (8 chars)_verify() respectively.
    - Add a migration that rehashes existing accounts on next login and removes raw MD5 hashes from the users table.
