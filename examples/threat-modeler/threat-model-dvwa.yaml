  stride: Elevation of Privilege
  cwe: CWE-863
  title: Security level controlled by client cookie (dvwa/includes/dvwaPage.inc.php:204)
  scenario: An authenticated attacker opens browser developer tools and changes the 'security' cookie from 'high' to 'low';
    dvwaSecurityLevelGet() at dvwaPage.inc.php:204 reads security level directly from $_COOKIE['security'] without session-side
    verification, causing all subsequent requests to route through the intentionally vulnerable low-security code variants
    (unsanitized shell_exec, raw SQL, unfiltered redirect).
  attack_steps:
  - Attacker authenticates with any valid credential and inspects the browser cookie store, finding a 'security' cookie set
    to 'high'.
  - Attacker changes the cookie value to 'low' using browser developer tools or a proxy; dvwaPage.inc.php:204 reads the new
    value unconditionally.
  - 'All module handlers now execute their low-security variants: exec/source/low.php exposes OS command injection, sqli/source/low.php
    exposes raw SQL, and open_redirect/source/low.php exposes the unvalidated redirect.'
  - Attacker exploits any low-level vulnerability, for example submitting ip=127.0.0.1|id to gain remote code execution.
  evidence_summary: dvwaPage.inc.php:200-205 implements dvwaSecurityLevelGet() by returning $_COOKIE['security'] directly
    when set, with no comparison to a server-side session value. Line 226 shows that setcookie() sets the security cookie
    with HttpOnly only at impossible level, making the cookie script-readable at lower levels.
  impact_description: Any authenticated user can immediately downgrade to the most vulnerable code path across all lab modules,
    effectively gaining the attack surface of the low-security level regardless of the intended deployment configuration.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Session authentication (dvwaPageStartup) is requ**** (8 chars); the security level check at dvwaSecurityLevelGet()
    does not verify any server-side session value.
  mitigation_title: Store and enforce security level in the server-side session, not the client cookie
  remediation:
    effort: Medium
    steps:
    - Store the security level in $_SESSION['dvwa']['security_level'] when set by an administrator; remove the direct $_COOKIE['security']
      read at dvwaPage.inc.php:204.
    - Make dvwaSecurityLevelSet() write to the session rather than (or in addition to) the cookie, so that client-side cookie
      modification has no effect on module routing.
    - Add a test that changes the security cookie to 'low' mid-session and asserts the module still executes the session-stored
      security level variant.
    code_example: null
    verification: Set security=low in the browser cookie while the session security level is 'high'; confirm /vulnerabilities/exec
      still executes high.php and not low.php.
    reference: CWE-863
  evidence:
  - file: dvwa/includes/dvwaPage.inc.php
    line: 204
  evidence_check: verified
  prior_finding_ref: null
