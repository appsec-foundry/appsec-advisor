- local_id: database-005
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: Unbounded search query with no LIMIT clause amplifies memory use (search.ts:23)
  scenario: An attacker sends a UNION-injected search query that joins the Products table with the Users, Orders, and Baskets
    tables. Because no LIMIT clause constrains the result set and the result is JSON-serialized entirely in memory before
    the HTTP response is written, the application allocates memory proportional to the full cross-table join result, potentially
    exhausting the Node.js heap for other concurrent requests.
  attack_steps: null
  evidence_summary: routes/search.ts:23 executes the query without any LIMIT or OFFSET clause. The only size restriction is
    a 200-character truncation of the criteria value at line 22, which does not prevent UNION payloads shorter than 200 characters
    from spanning multiple large tables. The result is fully deserialized at line 25 via JSON.stringify(products) with no
    streaming or pagination guard.
  impact_description: A single crafted request can cause the application to allocate several hundred megabytes assembling
    a UNION result set spanning all tables, degrading or crashing the Node.js process for all concurrent users.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: 200-character criteria length truncation (insufficient — does not prevent large result amplification)
  mitigation_title: Add LIMIT clause and result-count cap to search query in routes/search.ts
  remediation:
    effort: Low
    steps:
    - 'Replace the raw sequelize.query() call with a parameterized Sequelize findAll() (see database-002 remediation) and
      add a `limit: 100` option to cap result rows.'
    - Add pagination parameters (offset, limit) validated server-side to a maximum of 100 rows per request.
    - Add a load test that sends 10 concurrent broad search requests and asserts memory use stays below 200 MB.
    code_example: null
    verification: Run `wrk -c 10 -d 5s 'http://localhost:3000/rest/products/search?q=%25'` and confirm the Node.js process
      RSS stays below 200 MB.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
  evidence:
