  title: JWT Bearer Token Stored in localStorage (login.component.ts:101)
  scenario: login.component.ts:101 writes the JWT bearer token to localStorage after successful authentication. localStorage
    is readable by any JavaScript executing in the same origin. The application has nine confirmed bypassSecurityTrustHtml
    XSS sinks; any one of them enables an attacker to read localStorage.getItem('token') and exfiltrate the JWT, achieving
    full account takeover without the user's credentials.
  attack_steps:
  - Attacker exploits any confirmed XSS sink — for example, the ?q= URL parameter at search-result.component.ts:143 — by sending
    a crafted URL to a logged-in victim.
  - Injected script calls localStorage.getItem('token') and transmits the value to an attacker-controlled endpoint.
  - 'Attacker adds the JWT as an Authorization: Bearer header and calls any /rest/* or /api/* endpoint.'
  - Attacker performs any action the victim is authorized for, including reading personal data, placing orders, and changing
    account details — session is fully compromised without re-authentication.
  evidence_summary: login.component.ts:101 stores the JWT in localStorage; app.guard.ts:18 reads it back; basket.service.ts:64
    and request.interceptor.ts:13 use it for authenticated API calls — all confirmed present; known-threat record explicitly
    identifies this pattern.
  impact_description: Every authenticated user's JWT is extractable via XSS. Combined with the eight other confirmed XSS sinks
    in the same SPA origin, this creates a high-probability, low-effort full account-takeover chain. Impact is Critical.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — localStorage is accessible to all same-origin scripts
  mitigation_title: Move JWT to HttpOnly Cookie via BFF Pattern per WEB-002 and BP-API-AUTHZ-ENDUSER
