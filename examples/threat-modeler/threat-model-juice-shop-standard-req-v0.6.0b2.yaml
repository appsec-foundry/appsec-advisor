trust_boundaries:
- name: 'external -> backend-api: security.isAuthorized() expressJwt'
  kind: network
  assumption: Every protected route is registered behind security.isAuthorized() before the handler, and resource access is
    checked against the authenticated user identity.
  evidence:
  - file: server.ts
    line: 356
  - file: lib/insecurity.ts
    line: 52
  - file: routes/checkKeys.ts
    line: 1
  - file: routes/nftMint.ts
    line: 1
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: backend-api
  enforcement_point: security.isAuthorized() expressJwt middleware
  assumption_legs:
  - leg: validation
    condition: Every request body and path parameter is schema-checked before it reaches business logic.
  - leg: authentication
    condition: Every state-changing route requiring authentication is registered behind security.isAuthorized(), which validates
      JWT signature and expiry.
  - leg: authorization
    condition: Every resource reference is checked against the authenticated subject before access is granted.
  surface: network
  transition: []
  covers_components:
  - backend-api
  - web3-nft
  id: tb-1
  assumption_verdict: refuted
- name: 'external -> auth-session: jwt.sign RS256 credential verification'
  kind: identity
  assumption: A token is issued only after credentials pass server-side verification and is signed with the server-held RSA
    private key; elevated-role claims reflect only the database record.
  evidence:
  - file: lib/insecurity.ts
    line: 20
  - file: lib/insecurity.ts
    line: 54
  - file: routes/login.ts
    line: 1
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: auth-session
  enforcement_point: jwt.sign RS256 credential verification
  assumption_legs:
  - leg: validation
    condition: Login request body is validated for required email and password fields before credential lookup.
  - leg: authentication
    condition: A token is accepted only if it is signed with a key only the server holds and has not expired.
  - leg: authorization
    condition: Elevated-role claims in the token payload reflect only what the verified database record states.
  surface: network
  transition:
  - identity
  id: tb-2
  assumption_verdict: refuted
- name: external -> websocket-rt
  kind: network
  assumption: Socket.IO event handlers validate all received data server-side and cannot be used to access or modify another
    user's session state.
  evidence:
  - file: lib/startup/registerWebsocketEvents.ts
    line: 23
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: websocket-rt
  assumption_legs:
  - leg: validation
    condition: All data received via Socket.IO events is validated server-side before being used to update game state.
  - leg: authentication
    condition: The Socket.IO connection handshake does not verify the caller's identity before accepting events.
  - leg: authorization
    condition: Challenge-solving events can advance only server-owned game state, not access or modify another user's data.
  surface: network
  transition: []
