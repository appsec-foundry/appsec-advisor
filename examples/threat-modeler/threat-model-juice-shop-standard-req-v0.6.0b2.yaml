  title: SQL injection via email string interpolation in login (routes/login.ts:34)
  scenario: An attacker sends POST /rest/user/login with email value `' OR 1=1--` and any password; routes/login.ts:34 concatenates
    req.body.email directly into a raw SQL string via template literal, producing a query that returns all users; the application
    authenticates as the first returned row (typically the pre-seeded admin account), issuing a valid admin JWT without any
    valid credentials.
  attack_steps:
  - Attacker sends POST /rest/user/login with {"email":"' OR 1=1--","password":"x"} to the unauthenticated login endpoint.
  - routes/login.ts:34 builds SELECT * FROM Users WHERE email = '' OR 1=1-- ' AND password = '<md5>' AND deletedAt IS NULL;
    the -- comment removes the password check and returns all rows.
  - The application receives the first row (admin account) and calls security.authorize(), returning a valid admin-role JWT
    and the admin email to the attacker.
  - Attacker uses the admin JWT to access any endpoint including /rest/admin/application-configuration and bulk data export
    for all users.
  evidence_summary: routes/login.ts:34 passes req.body.email through the template literal `SELECT * FROM Users WHERE email
    = '${req.body.email || ''}'...` to models.sequelize.query without parameterized binding; the Sequelize ORM is used for
    all other queries but bypassed here.
  impact_description: Unauthenticated attacker gains admin-level JWT access, can exfiltrate all user records including hashed
    passwords, email addresses, and addresses, and perform any privileged operation including data export and order manipulation.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Sequelize ORM is used for most database access with parameterized queries; however this login query uses
    raw sequelize.query without parameterization.
  mitigation_title: Replace raw SQL interpolation with Sequelize ORM parameterized query in routes/login.ts
  remediation:
    effort: Low
    steps:
    - 'Replace the raw sequelize.query at routes/login.ts:34 with a parameterized ORM query: UserModel.findOne({ where: {
      email: req.body.email, password: security.hash(req.body.password), deletedAt: null } }).'
    - Remove the raw SQL string entirely from routes/login.ts; do not use sequelize.query or replacements with user input.
    - 'Add an automated test that sends email: `'' OR 1=1--` and asserts HTTP 401 with no authentication token in the response
      body.'
    code_example: null
    verification: POST /rest/user/login with email `' OR 1=1--` and any password; assert HTTP 401 and that no token field
      appears in the response.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
