tier_root_causes:
  edge:
  - Client-side security enforcement without server-side backing
  - Explicit suppression of Angular XSS sanitizer via bypassSecurityTrustHtml
  - Bearer token persisted in XSS-readable localStorage instead of HttpOnly cookie
  - OAuth implicit flow without state parameter exposes token in URL fragment
  - Deterministic reversible password derivation from public identity attribute
  server:
  - Raw SQL string interpolation of request data across multiple query sites
  - Missing authentication middleware on state-changing and administrative routes
  - Long-lived credentials hardcoded in source files loaded at module init time
  - LLM inputs derived from unfiltered user message roles without trust boundary
  - No per-endpoint rate limiting on authentication and token-budget operations
  data:
  - PAN stored as unencrypted INTEGER with no at-rest field-level encryption
