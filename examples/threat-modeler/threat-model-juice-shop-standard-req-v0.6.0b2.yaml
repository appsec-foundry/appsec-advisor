- local_id: frontend-spa-016
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-602
  title: Client-Side-Only Admin Authorization Guard (app.guard.ts:52)
  scenario: AdminGuard.canActivate() at app.guard.ts:52-58 reads the JWT from localStorage, decodes it client-side, and checks
    payload.data.role === roles.admin. This guard controls only Angular's client-side routing — it does not protect the backend
    API. A non-admin user can bypass admin route restrictions entirely by calling admin-only API endpoints directly (/rest/user/find,
    etc.), or by manipulating their localStorage token to contain a forged admin role claim, since the SPA does not validate
    the JWT signature.
  attack_steps:
  - Attacker opens browser DevTools and sets localStorage.token to a JWT with payload.data.role='admin' (forged client-side;
    signature not verified by the SPA).
  - Angular's AdminGuard reads the manipulated token and grants navigation to the /administration route.
  - Even without token manipulation, attacker calls /rest/user/find directly with their real JWT; if the backend does not
    independently enforce admin authorization, admin data is returned.
  evidence_summary: app.guard.ts:52-58 decodes the JWT client-side and checks the role claim without verifying the signature;
    app.guard.ts:17-18 confirms login check reads only from localStorage; recon subcategory guard-without-server-authority-candidate
    at app.guard.ts:6 confirms this pattern.
  impact_description: If backend endpoints serving admin functionality do not independently enforce role authorization (a
    separate backend finding), the client-side guard provides no security barrier. A sophisticated attacker can forge the
    role claim or make direct API calls, gaining unrestricted admin access.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Angular Router guard — client-side only, no server enforcement
  mitigation_title: Enforce Admin Authorization Server-Side on All Admin API Endpoints per AC-002
  remediation:
    effort: Medium
    steps:
    - 'The primary fix is server-side: verify the JWT signature and admin role claim on every backend endpoint that serves
      admin data before returning a response.'
    - In the SPA, the guard may remain for UX routing, but its security value depends entirely on the backend enforcement
      above.
    - Add a backend integration test confirming that a non-admin JWT receives a 403 response from /rest/user/find and other
      admin-only endpoints.
    code_example: null
    verification: Send a request with a non-admin JWT to /rest/user/find; confirm the backend returns 403 and no user data.
      Then forge a JWT with role=admin (unverifiable signature) and confirm the same 403 response.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
  evidence:
  - file: frontend/src/app/app.guard.ts
    line: 52
  violated_requirements:
