  - Attacker calls ethers.HDNodeWallet.fromPhrase(mnemonic) locally to derive the wallet private key without any server interaction.
  - Attacker imports the derived private key into a web3 wallet client and signs Ethereum transactions to transfer on-chain
    assets.
  - Blockchain transactions are irreversible; any drained or transferred on-chain assets cannot be recovered by the application.
  evidence_summary: checkKeys.ts line 11 calls HDNodeWallet.fromPhrase(mnemonic) where mnemonic is the hardcoded literal at
    line 10; line 12 extracts and uses privateKey, confirming the key derivation path is operational and the wallet holds
    or can hold real on-chain assets.
