verdict:
  severity: red
  opening: Juice Shop is not production-ready. An unauthenticated attacker can bypass authentication, forge any user's session,
    and read or modify any customer's data through multiple independent Critical paths.
  bullets:
  - title: Full admin takeover via token forgery
    body: Any account holder can forge an admin-role session using the signing key committed to source.
    findings:
    - F-004
    - F-005
    weaknesses:
    - W-003
    verified_attack_path: true
  - title: Authentication bypass via login injection
    body: A crafted email field on the login form returns the admin account without a valid password.
    findings:
    - F-003
    - F-006
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Admin account via open registration
    body: Posting an extra role field during self-registration writes a permanent admin to the database.
    findings:
    - F-011
    weaknesses: []
    verified_attack_path: true
  - title: Customer sessions stolen via stored script
    body: A script stored in a product review executes in every visitor's browser and reads their stored session.
    findings:
    - F-009
    - F-010
    weaknesses: []
    verified_attack_path: true
  - title: Other users' orders and payments readable
    body: Authenticated users reach any other customer's addresses, cards, and orders by changing the ID in the request.
    findings:
    - F-008
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Payment cards stored without encryption
    body: Card numbers are written to the database as plain integers, readable by anyone who accesses the database file.
    findings:
    - F-027
    weaknesses: []
    verified_attack_path: false
  closing: Replacing the committed signing key and fixing the login form's query construction blocks the two highest-impact
    chains; moving session tokens to protected browser storage closes the scripted session theft path.
  bullets_intro: 'What an attacker can do today, worst first:'
