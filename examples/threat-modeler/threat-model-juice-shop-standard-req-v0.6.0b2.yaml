  cwe: CWE-287
  title: Predictable OAuth-Derived Password (oauth.component.ts:30)
  scenario: oauth.component.ts:30 derives each OAuth user's application password as btoa(profile.email.split('').reverse().join('')).
    This is a publicly known, reversible deterministic algorithm. Any attacker who knows (or guesses) a victim's Google email
    address — which is often publicly listed — can compute the corresponding password independently and authenticate via the
    standard login endpoint without OAuth, bypassing the OAuth provider entirely.
  attack_steps:
  - Attacker obtains the victim's email address from a public source (LinkedIn, conference badge, or data breach).
  - 'Attacker computes victim''s password in any browser console: btoa(''moc.elpmaxe@eman''.split('''').join('''')) and converts
    the result to the correct form.'
  - 'Attacker submits { email: victim@example.com, password: <computed> } to /rest/user/login; the backend returns a valid
    JWT.'
  - Attacker has full account access for every user who ever authenticated via Google OAuth, without interacting with the
    OAuth provider.
  evidence_summary: oauth.component.ts:30 shows const password = btoa(profile.email.split('').reverse().join('')); line 31
    submits it to userService.save() and line 46 to userService.login() — the algorithm is directly visible in the client
    bundle and is deterministic from the email alone.
  impact_description: All Google-OAuth-registered accounts are compromised if the attacker knows the user's email. The derived
    password is stored permanently and cannot be changed by the user; the only mitigation is deleting the account. This affects
    every OAuth user on the platform.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — the derivation algorithm is public in the client bundle
  mitigation_title: Remove OAuth-Derived Local Password; Authenticate OAuth Users via Token-Only Path per AC-004
  remediation:
    effort: High
    steps:
    - Remove the derived-password registration and login from oauth.component.ts:30-46; instead, the BFF should exchange the
      OAuth token for a server-issued session cookie directly, without creating a local password.
    - Migrate existing OAuth user accounts to invalidate the derived password and mark them as OAuth-only accounts with no
      local password.
    - Implement a backend check that rejects password-based login for accounts flagged as OAuth-only.
    - Write a test confirming that a locally computed btoa-derived password is rejected by /rest/user/login for any OAuth-registered
      account after migration.
    code_example: null
    verification: Register via Google OAuth; compute btoa(email.split('').reverse().join('')) for the test account; POST it
      to /rest/user/login and confirm a 401 response.
    reference: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
