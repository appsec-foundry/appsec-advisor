components:
- id: backend-api
  name: Express REST API
  description: Node.js/TypeScript Express server exposing REST endpoints under /rest/* and /api/* on port 3000. Implements
    business logic for product catalog, shopping, orders, user management, challenge tracking, file upload, and LLM chat proxying
    to the configured AI provider (Ollama or OpenAI-compatible). Serves the Angular SPA static bundle from the same origin.
  paths:
  - server.ts
  - routes/**/*.ts
  - lib/**/*.ts
  tier: application
  complexity: complex
  framework: express
  deployment_zones:
