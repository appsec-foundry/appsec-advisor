- local_id: websocket-rt-005
  threat_category_id: TH-12
  additional_categories: []
  stride: Denial of Service
  cwe: CWE-400
  title: Uncontrolled Socket.IO connection intake (registerWebsocketEvents.ts:20)
  scenario: An attacker opens thousands of concurrent Socket.IO connections to port 3000. Because the Server constructor at
    line 20 specifies no maxConnections limit and no connection-rate middleware is installed, the Node.js event loop processes
    each connection callback and emits the full notifications array to every one. The resulting memory and CPU exhaustion
    degrades or terminates the co-located REST API.
  attack_steps: null
  evidence_summary: 'new Server(server, { cors: { origin: ''http://localhost:4200'' } }) at line 20 creates the Socket.IO
    server with no maxConnections, no connection-rate limit, and no per-IP throttle. The on(''connection'') handler at line
    23-52 iterates the entire notifications array for each connection (line 29-31) without any bound, amplifying the per-connection
    cost.'
  impact_description: An attacker can exhaust Node.js heap and event-loop capacity by opening mass concurrent connections,
    causing the REST API (co-located in the same process) to stop responding for all legitimate users until the process is
    restarted.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — no connection count limit, no per-IP rate limit, no socket.io maxConnections option
  mitigation_title: Enforce per-IP connection rate limit and global connection ceiling on the Socket.IO server
  remediation:
    effort: Medium
    steps:
    - Apply a Socket.IO connection middleware that tracks per-source-IP connection count using an in-process sliding-window
      counter. Reject connections from a source that exceeds the configured threshold (e.g. 10 concurrent connections per
      IP) by calling next(new Error('rate limit exceeded')). Following BP-API-HARDENING §4, this control should be effective
      across processes if the application is clustered (use a Redis-backed rate-limit store such as rate-limiter-flexible).
    - Add a per-event rate limit inside the connection handler using a similar sliding-window counter keyed on socket.id to
      prevent event-flooding attacks from a single connection.
    - Add a load test asserting that 500 concurrent connections from the same IP are rejected after the threshold and that
      the REST API on the same port remains responsive during the connection flood.
    code_example: null
    verification: Use a tool such as artillery or a simple Node.js script to open 200 concurrent WebSocket connections from
      localhost; confirm connections beyond the limit are rejected with an error and that the /rest/admin/application-version
      REST endpoint remains responsive with sub-200ms latency.
    reference: OWASP ASVS v4.0 §13.4 — WebSocket and Real-Time Communication Security
