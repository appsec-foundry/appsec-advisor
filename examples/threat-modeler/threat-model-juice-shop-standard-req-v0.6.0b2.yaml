assets:
- id: A-001
  name: User Credentials and PII
  classification: Confidential
  description: User email addresses, bcrypt-hashed passwords, security questions and answers, and profile data stored in the
    SQLite database user model. Targeted by account-takeover, credential-stuffing, and SQL-injection attacks against the authentication
    endpoints.
  linked_threats: []
  evidence_flags: []
- id: A-002
  name: JWT Signing Secret
  classification: Restricted
  description: The server-side secret used to sign and verify all bearer JWTs, configured via config/default.json. Compromise
    of this secret allows arbitrary token forgery and full authentication bypass for all user accounts including admin.
  linked_threats: []
  evidence_flags: []
- id: A-003
  name: Browser-Stored JWT Session Tokens
  classification: Restricted
  description: Bearer JWTs persisted in browser localStorage by the Angular SPA (basket.service.ts:64, request.interceptor.ts:13).
    Exposed to XSS exfiltration and physical-device access because they are not stored in HttpOnly cookies.
  linked_threats: []
  evidence_flags: []
- id: A-004
  name: Product and Order Data
  classification: Internal
  description: Product catalog, pricing, customer orders, basket contents, delivery status, and payment card references stored
    in SQLite tables. Integrity matters for commerce-logic challenges; several write endpoints lack authorization checks.
  linked_threats: []
  evidence_flags: []
- id: A-005
  name: Challenge State and Exploit Evidence
  classification: Internal
  description: Per-user challenge completion flags, TOTP secrets, continue-codes, and hacking-instructor progress stored in
    the SQLite challenge and hint tables. Manipulation allows score falsification without solving challenges.
  linked_threats: []
  evidence_flags: []
- id: A-006
  name: SQLite Database File
  classification: Confidential
  description: The on-disk SQLite file holding all user, product, order, challenge, and session data for the application instance.
    Direct file read by any process sharing the container filesystem yields all application data in plaintext.
  linked_threats: []
  evidence_flags: []
- id: A-007
  name: CI/CD Pipeline Secrets and Workflow Tokens
  classification: Restricted
  description: GitHub Actions GITHUB_TOKEN, npm publish credentials, and any secrets injected into the CI environment (ci.yml,
    release.yml). Tag-pinned third-party actions and public-PR CI exposure create supply-chain compromise paths to these secrets.
  linked_threats: []
  evidence_flags: []
- id: A-008
  name: Application Source Code and Configuration
  classification: Internal
  description: TypeScript source, Angular frontend bundle, and runtime configuration (config/default.json, .env). Contains
    deliberately embedded vulnerabilities as pedagogical content; bundled test credential in login.component.ts:62 is a hardcoded
    secret.
  linked_threats: []
  evidence_flags: []
