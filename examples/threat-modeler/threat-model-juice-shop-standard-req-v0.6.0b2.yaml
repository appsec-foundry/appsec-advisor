  - T-036
  - T-037
  - T-038
  - T-053
- id: auth-session
  name: Authentication and Session Management
  description: JWT issuance and verification using jsonwebtoken with express-jwt middleware, implemented in lib/insecurity.ts.
    Manages login credential validation, bcrypt password hashing, OAuth implicit-flow token receipt, and TOTP-based 2FA. Issues
    short-lived bearer tokens consumed by the frontend SPA from localStorage.
  paths:
  - lib/insecurity.ts
  - routes/login.ts
  - routes/2fa.ts
  - routes/authenticatedUsers.ts
  - routes/changePassword.ts
  - routes/currentUser.ts
  tier: application
  complexity: moderate
  framework: express
  deployment_zones:
  - internet
  - dmz
  handles_sensitive_data: true
  threat_ids:
  - T-002
  - T-003
  - T-004
  - T-016
  - T-017
  - T-023
  - T-024
  - T-030
  - T-034
- id: frontend-spa
  name: Angular Frontend SPA
  description: Angular 21 single-page application executing in the browser. Handles routing via Angular Router with client-side
    auth guards (app.guard.ts), stores JWT in localStorage, receives OAuth tokens from URL fragment, and calls backend REST
    and WebSocket endpoints. The hacking-instructor module renders challenge hints via innerHTML.
  paths:
  - frontend/src/**/*.ts
  - frontend/src/**/*.html
  - frontend/src/**/*.scss
  tier: client
  complexity: complex
  framework: angular
  deployment_zones:
  - client-device
  handles_sensitive_data: true
  threat_ids:
  - T-001
  - T-009
  - T-010
  - T-040
  - T-042
  - T-052
- id: websocket-rt
  name: Socket.IO Real-Time Service
  description: Socket.IO 3.1 server registered at startup via registerWebsocketEvents.ts, sharing the HTTP port with the REST
    API. Pushes live challenge completion events, scoreboard updates, and hacking-instructor feedback to connected browsers.
    No explicit per-connection authentication or CORS origin validation is enforced.
  paths:
  - lib/startup/registerWebsocketEvents.ts
  - lib/challengeUtils.ts
  - frontend/src/app/Services/socket-io.service.ts
  tier: application
  complexity: moderate
  framework: null
  deployment_zones:
  - internet
  - dmz
  handles_sensitive_data: false
  threat_ids:
  - T-015
  - T-029
  - T-033
- id: database
  name: SQLite Data Store (Sequelize ORM)
  description: File-based SQLite database accessed exclusively through Sequelize ORM model definitions in models/. Stores
    user accounts with bcrypt-hashed passwords, product catalog, shopping baskets, orders, addresses, payment cards, challenge
    completion state, feedback, and recycling records. Not network-exposed; accessed only via in-process ORM calls.
  paths:
  - models/**/*.ts
  - data/datacreator.ts
  - data/datacache.ts
  tier: data
  complexity: moderate
  framework: sequelize
  deployment_zones:
  - prod-env
  handles_sensitive_data: true
  threat_ids:
  - T-027
- id: ci-cd-pipeline
  name: GitHub Actions CI/CD Pipeline
  description: GitHub Actions workflows for automated testing, CodeQL security scanning, ESLint linting, frontend bundle analysis,
    and release packaging. Tag-pinned (non-SHA-pinned) third-party actions are used. The Dockerfile uses --ignore-scripts
    on npm install; lockfiles are committed and npm ci is used in CI.
  paths:
  - .github/workflows/*.yml
  tier: application
  complexity: simple
  framework: null
  deployment_zones:
  - ci-cd-runtime
  - build-pipeline
  handles_sensitive_data: false
  threat_ids:
  - T-039
  - T-041
  - T-044
  - T-045
  - T-046
