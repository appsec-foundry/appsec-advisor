    url: https://appsec.int.example.com/blueprints/api-authz-enduser
    section: '3.3. Step 3: Method-Level Authorization'
    section_url: https://appsec.int.example.com/blueprints/api-authz-enduser#_method_level_authz
    guidance: Validate whether the client or user role is allowed to access a particular route. Check role or scope claims
      from the JWT token. Define application-specific scopes and validate them on each protected endpoint.
    prescribed_by:
    - AC-002
    grounded: true
  _title_source: Enforce Admin Authorization Server-Side on All Admin API Endpoints per AC-002
  steps:
  - 'The primary fix is server-side: verify the JWT signature and admin role claim on every backend endpoint that serves admin
    data before returning a response.'
  - In the SPA, the guard may remain for UX routing, but its security value depends entirely on the backend enforcement above.
  - Add a backend integration test confirming that a non-admin JWT receives a 403 response from /rest/user/find and other
    admin-only endpoints.
  verification: Send a request with a non-admin JWT to /rest/user/find; confirm the backend returns 403 and no user data.
    Then forge a JWT with role=admin (unverifiable signature) and confirm the same 403 response.
  reference: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
  file: frontend/src/app/app.guard.ts:52
