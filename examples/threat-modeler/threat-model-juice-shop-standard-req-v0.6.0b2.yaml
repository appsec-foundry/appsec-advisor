      remove all localStorage.setItem('token') calls from the SPA.
    - Remove the Authorization header injection from request.interceptor.ts:13-16; the browser will automatically attach the
      HttpOnly cookie to same-origin requests.
    - Update app.guard.ts and all services that read localStorage('token') to call a /rest/whoami or equivalent endpoint to
      determine authentication state instead of reading from localStorage.
    - Write tests confirming the JWT is absent from localStorage after login and that the session persists via the HttpOnly
