  title: CI/CD Workflow Token Permissions Not Restricted
  scenario: The lint-fixer.yml workflow has no explicit `permissions:` block and runs on every push; it executes npm lint:fix
    and then uses stefanzweifel/git-auto-commit-action to commit changes back to the branch. Because no permissions block
    restricts the GITHUB_TOKEN, the token inherits the repository's default scope — which may include write access to contents,
    packages, actions, and issues — giving every step in the job and the SHA-pinned git-auto-commit action a credential with
    broad repository write authority.
  evidence_summary: 'lint-fixer.yml has no `permissions:` block at the workflow or job level (confirmed by grep across all
    four key workflows: ci.yml, lint-fixer.yml, rebase.yml, release.yml — none contain a permissions block). The auto-commit
    step at line 22 uses GITHUB_TOKEN implicitly via the git-auto-commit-action, which can push commits to any branch accessible
    to the token. Contrast with codeql-analysis.yml, which correctly scopes permissions (actions: read, contents: read, security-events:
    write).'
  impact_description: A compromised dependency or action in the lint-fixer job (e.g., a malicious version of any npm package
    installed at line 17-19) can use the unrestricted GITHUB_TOKEN to push code to the repository, create releases, modify
    Actions secrets, or tamper with other workflow definitions — bypassing code review entirely.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Actions SHA-pinned (stefanzweifel/git-auto-commit-action at commit SHA, not mutable tag); --ignore-scripts
    on npm install reduces install-hook risk.
  mitigation_title: Add minimal explicit permissions block to lint-fixer.yml restricting GITHUB_TOKEN to contents:write only
  remediation:
    effort: Low
    steps:
    - 'Add the following permissions block immediately after the `on:` trigger in lint-fixer.yml: `permissions: contents:
      write` — this is the minimum scope required for the auto-commit step. All other permission scopes will default to `none`,
      eliminating write access to packages, actions, issues, and secrets.'
    - 'Apply the same pattern to ci.yml, rebase.yml, and release.yml: add job-level `permissions:` blocks scoped to the minimum
      each job requires (e.g., release jobs need `contents: write` for release creation, the docker job needs no additional
      permissions beyond the default).'
    - Add a CI check using `actionlint` or `zizmor` to detect future workflow files missing explicit permissions blocks.
    code_example: null
