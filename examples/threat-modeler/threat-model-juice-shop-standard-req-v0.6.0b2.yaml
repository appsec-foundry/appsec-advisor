  stride: Elevation of Privilege
  cwe: CWE-620
  title: Password change succeeds without current password when field is omitted
  scenario: An authenticated attacker or CSRF gadget sends GET /rest/user/change-password?new=newpass&repeat=newpass omitting
    the `current` parameter. The guard `if (currentPassword && security.hash(currentPassword) !== loggedInUser.data.password)`
    short-circuits because `currentPassword` is undefined/falsy, allowing the password update to proceed. Combined with the
    CSRF vector (auth-session-004), any attacker can lock out a victim from their own account.
  attack_steps: null
  evidence_summary: 'routes/changePassword.ts:39 evaluates `if (currentPassword && ...)`: when `currentPassword` is absent
    from the query string, the condition is falsy and the password update at line 51 proceeds unconditionally. The `currentPassword`
    check is therefore not mandatory.'
  impact_description: An authenticated user can change their own password without knowing the current one. Chained with the
    CSRF vulnerability (auth-session-004), an attacker can change a victim's password via a cross-site request, permanently
    locking the victim out.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: The request requires a valid JWT (authenticated session) via `authenticatedUsers.get(token)` at line
    33.
  mitigation_title: Require and enforce current password verification before accepting password change
  remediation:
    effort: Low
    steps:
    - 'In routes/changePassword.ts, add an explicit guard before the update: `if (!currentPassword) { res.status(401).send(res.__(''Current
      password is required.'')); return; }` This must be placed unconditionally before the `if (currentPassword && ...)` check
      at line 39.'
    - Replace the existing conditional at line 39 with the unconditional `if (security.hash(currentPassword) !== loggedInUser.data.password)
      { res.status(401).send(...); return; }`
    - Add a test that sends a password-change request without the `current` field and confirms HTTP 401 is returned.
    code_example: null
    verification: Send GET (or POST after auth-session-004 fix) /rest/user/change-password without `current` parameter with
      a valid session token — must return HTTP 401.
