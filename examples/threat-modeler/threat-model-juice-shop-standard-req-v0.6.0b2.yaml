- local_id: frontend-spa-013
  threat_category_id: TH-10
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-598
  title: OAuth Access Token Exposed in URL Fragment (app.routing.ts:257)
  scenario: 'app.routing.ts:257 captures window.location.href — including the #access_token=... fragment — at Angular module
    load time and stores it in route data. The access_token is visible in the browser''s address bar, is saved in browser
    history, and may leak via the Referer header to any third-party resource loaded before the OAuth callback component clears
    the fragment.'
  attack_steps: null
  evidence_summary: app.routing.ts:257 executes (window.location.href).substr(window.location.href.indexOf('#')) at module
    initialization time, capturing the full fragment including the OAuth access_token; confirmed by recon subcategory dom-xss-source
    at this line.
  impact_description: The OAuth access_token is exposed in browser history and server logs of any cross-origin resource present
    on the callback page, enabling token theft without active XSS. Token grants access to user profile data via the OAuth
    provider API.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: None
  mitigation_title: Switch OAuth Flow to Authorization Code + PKCE to Eliminate Token in URL Fragment
  remediation:
    effort: High
    steps:
    - Adopt the PKCE authorization code flow (see frontend-spa-001 remediation) to prevent the access_token from ever appearing
      in the URL.
    - As a short-term mitigation, call history.replaceState({}, '', window.location.pathname) immediately on OAuth callback
      before loading any cross-origin resources.
    - Remove the window.location.href substring capture at app.routing.ts:257 once the flow is replaced.
    code_example: null
    verification: 'Complete a Google OAuth login; inspect browser history and confirm no #access_token= fragment is present
      in any history entry.'
    reference: https://datatracker.ietf.org/doc/html/rfc6749#section-10.3
