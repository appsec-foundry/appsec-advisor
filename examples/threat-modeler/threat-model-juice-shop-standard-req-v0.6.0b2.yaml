  title: Hardcoded RSA private key enables arbitrary JWT forgery (lib/insecurity.ts:21)
  scenario: An attacker reads the RSA private key embedded in lib/insecurity.ts line 21, uses it offline to sign a JWT payload
    with any email, role, or userId claim, and submits the forged token to any authenticated API endpoint to impersonate an
    admin or arbitrary user.
  attack_steps:
  - Attacker clones the public repository and extracts the RSA private key literal from lib/insecurity.ts:21.
  - Attacker constructs a JWT payload containing role:admin and any target user email, then signs it with the extracted key
    using RS256.
  - Attacker sends the forged token in the Authorization header to any protected endpoint (e.g., /api/Users/) and receives
    full admin access.
  - Attacker issues replacement tokens for any existing account, bypassing 2FA and all session controls permanently.
  evidence_summary: Line 21 assigns the full RSA private key as a string literal in the module-level `privateKey` constant,
    which is then passed to `jwt.sign()` at line 54. The key is present in plaintext in the committed source.
  impact_description: Complete authentication bypass for every account and role. Attacker can forge tokens for admin, accounting,
    or any customer account, access all user data, trigger privileged operations, and render session revocation impossible.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: RS256 algorithm is sound; 6-hour token expiry provides a nominal bound.
  mitigation_title: Remove hardcoded private key and load from external secret store
  remediation:
    effort: Medium
    steps:
    - Delete the private key literal from lib/insecurity.ts:21 and replace with `const privateKey = process.env.JWT_PRIVATE_KEY
      ?? (() => { throw new Error('JWT_PRIVATE_KEY not configured') })();`
    - Generate a fresh RSA-2048 or ECDSA P-256 key pair outside the repository and inject via environment variable or mounted
      secret at startup.
    - Rotate all live tokens by incrementing a `kid` header or changing the key, invalidating all previously issued tokens.
    - Add a pre-commit hook or CI SAST rule (e.g., gitleaks, truffleHog) to block future private key commits.
    code_example: null
    verification: Run `grep -r 'BEGIN RSA PRIVATE KEY' lib/ routes/` — must return zero hits. Restart the service without
      JWT_PRIVATE_KEY set and confirm it exits with a startup error.
    reference: 'CWE-321: Use of Hard-coded Cryptographic Key — https://cwe.mitre.org/data/definitions/321.html'
  evidence:
  - file: lib/insecurity.ts
    line: 21
  boundary_refs:
