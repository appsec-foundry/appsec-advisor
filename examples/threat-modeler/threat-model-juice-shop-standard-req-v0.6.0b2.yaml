- local_id: auth-session-002
  threat_category_id: TH-02
  additional_categories: []
  stride: Spoofing
  cwe: CWE-89
  title: SQL injection in login query bypasses authentication (routes/login.ts:34)
  scenario: An attacker submits a crafted email value such as `' OR '1'='1'--` to POST /rest/user/login, causing the raw string-concatenated
    SQL query to return the first user row (typically admin) without a matching password, issuing a valid JWT for that account.
  attack_steps:
  - Attacker sends POST /rest/user/login with body `{"email":"' OR '1'='1'--","password":"x"}` requiring no prior authentication.
  - Sequelize executes the interpolated query `SELECT * FROM Users WHERE email = '' OR '1'='1'--' AND password = '<md5>'`,
    which matches the first row regardless of password.
