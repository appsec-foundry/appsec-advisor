security_controls:
- domain: Identity and Authentication Controls
  control: JWT Signing and Verification
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-JWT-001
  assessment: RS256 algorithm is used (lib/insecurity.ts:54) — algorithm choice is sound — but the RSA private key is committed
    verbatim to source at lib/insecurity.ts:21. Any party with repository access can forge valid tokens. The verification
    side trusts the committed public key that corresponds to the exposed private key, so the algorithm enforcement provides
    no real boundary.
  implementation: lib/insecurity.ts
  status_note: RS256 algorithm is present but the signing key is committed to source, defeating the control.
- domain: Identity and Authentication Controls
  control: Password Hashing
  effectiveness: Adequate
  kind: mechanism
  assessment: Component description confirms bcrypt password hashing for stored credentials. No evidence of a weaker algorithm
    or plaintext storage was detected in the architecture scan.
  implementation: lib/insecurity.ts, models/
- domain: Identity and Authentication Controls
  control: OAuth 2.0 Flow
  effectiveness: Unsafe
  kind: mechanism
  assessment: The frontend SPA receives OAuth tokens from the URL fragment (implicit flow), as stated in the component description
    and confirmed by the Angular frontend pattern. The OAuth implicit flow is deprecated and exposes access tokens to browser
    history, referrer headers, and JavaScript running on the page. The PKCE authorization-code flow is the required replacement.
  implementation: frontend/src/app/
  status_note: OAuth implicit flow in use; access tokens exposed in URL fragment.
- domain: Identity and Authentication Controls
  control: Route Authentication Enforcement
  effectiveness: Weak
  kind: cross-cutting
  rule_id: ARCH-AUTHN-001
  assessment: 'security.isAuthorized() expressJwt middleware is registered on the majority of protected routes (server.ts:356),
    but multiple state-changing endpoints are confirmed missing authentication: POST /file-upload (server.ts:309), POST /profile/image/file
    (server.ts:310), POST /profile/image/url (server.ts:311), POST /rest/memories (server.ts:312), POST /api/Feedbacks (server.ts:406),
    PUT /rest/continue-code-findIt/apply/:continueCode (server.ts:612), and the /rest/admin/* information endpoints (server.ts:606-607).'
  implementation: server.ts, lib/insecurity.ts
  status_note: Middleware exists but several sensitive routes bypass authentication entirely.
- domain: Identity and Authentication Controls
  control: Rate Limiting on Authentication Endpoints
  effectiveness: Missing
  kind: mechanism
  assessment: No rate-limiting middleware, token-bucket, or brute-force protection was detected on login, registration, password
    reset, or verification endpoints. The architecture scan found no express-rate-limit or equivalent signal.
  status_note: No rate limiting detected; authentication endpoints are open to brute force.
- domain: Authorization Controls
  control: Centralized Authorization Policy
  effectiveness: Weak
  kind: cross-cutting
  rule_id: ARCH-AUTHZ-001
  assessment: 'No centralized authorization middleware or policy layer was detected. Authorization enforcement is inconsistent
    across routes: PUT/DELETE on /api/Products/:id, /api/Recycles/:id, /api/BasketItems/:id, /api/Feedbacks/:id, /api/Cards/:id,
    /api/Addresss/:id, /rest/basket/:id/coupon/:coupon, /rest/wallet/balance, and others all show authz=unknown (server.ts:370-634).
    Seventeen state-changing routes lack confirmed authorization checks.'
  implementation: server.ts
  status_note: Route-by-route authorization with pervasive gaps; no centralized policy enforcer.
- domain: Authorization Controls
  control: Object-Level Ownership Check (BOLA/IDOR Prevention)
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-BOLA-001
  assessment: 'Authentication middleware is present on most resource endpoints but resource ownership is not bound to the
    authenticated subject. Eight routes confirmed with authn=middleware_present but authz=unknown: /api/Products/:id, /api/Recycles/:id,
    /api/BasketItems/:id, /api/Feedbacks/:id. An authenticated user can address any object by its numeric ID without a subject-to-resource
    binding check.'
  implementation: server.ts, routes/
  status_note: JWT authentication present but per-object ownership not verified against the token subject.
- domain: Authorization Controls
  control: Management Endpoint Protection
  effectiveness: Weak
  kind: surface
  rule_id: ARCH-MGMT-001
  assessment: GET /rest/admin/application-version and GET /rest/admin/application-configuration (server.ts:606-607) are registered
    without a confirmed authentication gate. These expose application version and configuration details to unauthenticated
    callers.
  implementation: server.ts
  status_note: Admin information endpoints reachable without authentication.
- domain: Input Handling and Injection Prevention
  control: Schema and Allowlist Input Validation
  effectiveness: Weak
  kind: cross-cutting
  rule_id: ARCH-INPUT-001
  assessment: Input handling is limited to ad-hoc trimming and URL normalization (server.ts:204, 246, 411-413). No schema
    validation library (e.g., Joi, Zod, express-validator) was detected. Without a centralized validation layer, type, range,
    and format checks are absent from most endpoints, leaving the backend dependent on ORM-level enforcement alone.
  implementation: server.ts
  status_note: Only ad-hoc trimming; no centralized schema validation library detected.
- domain: Input Handling and Injection Prevention
  control: Parameterized Database Access
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-SQLI-001
  assessment: 'Sequelize ORM provides parameterized queries as the primary data access layer (models/index.ts:33). However,
    at least one raw string interpolation into a response message was found in routes/vulnCodeSnippet.ts:46 (`No code challenge
    for challenge key: ${req.params.challenge}`). The extent of raw SQL construction elsewhere requires source-level analysis
    to confirm.'
  implementation: models/index.ts, routes/
  status_note: ORM parameterization is the default; raw interpolation found in at least one route.
- domain: Session and Token Management
  control: Session Token Storage and Cookie Hardening
  effectiveness: Weak
  kind: mechanism
  rule_id: ARCH-COOKIE-001
  assessment: JWT tokens are stored in browser localStorage per the component description. localStorage is accessible to any
    JavaScript on the page, making tokens directly exploitable via XSS. No HttpOnly or Secure cookie configuration was detected
    in the architecture scan. The bypass of Angular's sanitizer in multiple components (see Output Encoding control) amplifies
    this exposure.
  implementation: frontend/src/app/
  status_note: JWT in localStorage; no HttpOnly cookie storage or Secure flag detected.
- domain: Session and Token Management
  control: WebSocket Connection Authentication
  effectiveness: Missing
  kind: mechanism
  assessment: The Socket.IO server (lib/startup/registerWebsocketEvents.ts:23) accepts connections and events without verifying
    the caller's identity. No handshake token validation or per-connection authentication middleware was detected. Any client
    can submit challenge-solving events or receive broadcasts.
  implementation: lib/startup/registerWebsocketEvents.ts
  status_note: No per-connection identity check on Socket.IO; unauthenticated event submission accepted.
- domain: Cryptography and Secrets
  control: Managed Secret Storage
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-SECRET-001
  assessment: 'Two high-value secrets are committed directly to source: the RSA private key used for JWT signing (lib/insecurity.ts:21,
    beginning ''[PEM PRIVATE KEY — REDACTED]'') and a BIP-39 wallet mnemonic (routes/checkKeys.ts:10: ''purpose betray marriage
    blame crunch monitor spin slide donate sport lift clutch''). Both are relied-upon security mechanisms — the private key
    for authentication and the mnemonic for on-chain key derivation — and both are publicly exposed in the repository.'
  implementation: lib/insecurity.ts, routes/checkKeys.ts
  status_note: RSA signing key and wallet mnemonic committed to source; both are functionally compromised.
- domain: Transport and Data Protection
  control: Transport Encryption (TLS)
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-TLS-001
  assessment: No TLS configuration was detected in the application source (server.ts, Dockerfile). The server listens on port
    3000 in cleartext by default. TLS termination may exist at a deployment-layer proxy, but no required-configuration startup
    check or upstream terminator declaration was found in the repository. The application will bind and serve without TLS
    if deployed without an external terminator.
  implementation: server.ts
  status_note: No in-application TLS; relies on assumed external termination with no startup enforcement.
- domain: Frontend Security
  control: Output Encoding and XSS Prevention
  effectiveness: Unsafe
  kind: mechanism
  rule_id: ARCH-XSS-001
  assessment: 'Angular''s DomSanitizer is explicitly bypassed with bypassSecurityTrustHtml in eight locations: about.component.ts:119
    (feedback comments), last-login-ip.component.ts:39 (last login IP), administration.component.ts:73 (user email), administration.component.ts:91
    (feedback comments in admin view), data-export.component.ts:57 (captcha image), search-result.component.ts:110 (product
    descriptions), search-result.component.ts:143 (URL query parameter), track-result.component.ts:48 (order number). These
    are intentional challenge vulnerabilities but they are executed by the application runtime.'
  implementation: frontend/src/app/
  status_note: Angular sanitization deliberately bypassed in eight components; XSS is exploitable at runtime.
- domain: Frontend Security
  control: CORS Policy
  effectiveness: Partial
  kind: mechanism
  rule_id: ARCH-CORS-001
  assessment: The Socket.IO server is configured with a hardcoded development origin ('http://localhost:4200') per lib/startup/registerWebsocketEvents.ts:20.
    No CORS configuration for the REST API was identified in the architecture scan. The Socket.IO configuration is development-mode
    only and does not represent a production allow-list.
  implementation: lib/startup/registerWebsocketEvents.ts
  status_note: Socket.IO CORS locked to localhost:4200 dev origin; REST API CORS policy not confirmed.
- domain: Logging and Monitoring
  control: Security Event Logging
  effectiveness: Partial
  kind: mechanism
  assessment: No structured security event logging middleware (e.g., logging of authentication failures, authorization violations,
    or rate-limit hits) was detected in the architecture scan. The application uses Morgan for HTTP access logging (inferred
    from Express conventions) but no dedicated security-relevant event logger was confirmed.
  status_note: HTTP access logging likely present; structured security event logging not confirmed.
- domain: Dependency Lifecycle
  control: Third-Party Action Pinning
  effectiveness: Weak
  kind: lifecycle
  rule_id: ARCH-SUPPLY-001
  assessment: 'Three GitHub Actions are pinned to mutable references rather than immutable commit SHAs: calibreapp/image-actions@main
    (.github/workflows/image_actions.yml:33), peter-evans/create-pull-request@v8 (.github/workflows/image_actions.yml:42),
    and coverallsapp/github-action@v2 (.github/workflows/ci.yml:188). A tag or branch reference can be silently moved to point
    to malicious code. npm dependencies use lockfiles and npm ci, which is a positive baseline.'
  implementation: .github/workflows/
  status_note: Three actions use mutable tag/branch refs; SHA pinning absent for these actions.
- domain: Dependency Lifecycle
  control: npm Dependency Management
  effectiveness: Adequate
  kind: mechanism
  assessment: Lockfiles are committed to the repository. The Dockerfile uses --ignore-scripts on npm install to reduce supply-chain
    risk from install hooks. CI uses npm ci for frozen installs. No dependency scanning tool (e.g., npm audit, Snyk, Dependabot)
    was confirmed in the workflow files, which is the remaining gap.
  implementation: Dockerfile, .github/workflows/ci.yml
  status_note: Lockfiles and npm ci in place; automated vulnerability scanning not confirmed.
