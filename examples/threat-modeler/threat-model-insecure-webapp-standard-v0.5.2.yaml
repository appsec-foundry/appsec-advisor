- local_id: container-image-004
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-250
  title: Application Container Runs as Root Without USER Directive (Dockerfile)
  scenario: The Dockerfile has no USER instruction. The ENTRYPOINT at line 31 therefore executes the JVM process as UID 0
    (root) inside the container. If an attacker exploits a vulnerability in the Spring Boot application or its dependencies
    (e.g. deserialization, SSRF to the Docker socket, or a directory traversal), the compromised process runs with full root
    privileges inside the container. Combined with the world-writable filesystem set by `chmod -R 777 /app /app/runtime` at
    line 26, any injected code or shell can overwrite the application JAR, install persistent backdoors, or access the Docker
    socket if it is mounted. Container escapes via kernel exploits also have greater impact when the initial process is root.
  attack_steps:
  - An attacker exploits a remote code execution vulnerability in the Spring Boot application (e.g. deserialization of attacker-controlled
    input).
  - The attacker's code executes as UID 0 (root) because no USER directive drops the process to an unprivileged account.
  - The attacker overwrites `/app/target/appsec-verification-target-0.0.1-SNAPSHOT.jar` with a malicious payload, leveraging
    the world-writable permissions set by `chmod -R 777 /app`.
  evidence_summary: No USER instruction appears anywhere in the Dockerfile; the ENTRYPOINT at line 31 runs the JVM as root,
    and `chmod -R 777` at line 26 removes all filesystem protection from the application directory.
  impact_description: Application compromise immediately yields root inside the container, maximizing blast radius for container
    escape or lateral movement.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None — no USER directive, no read-only filesystem mount, no dropped capabilities.
  mitigation_title: Add a non-root USER directive and remove world-writable permissions from the container filesystem
  remediation:
    effort: Low
    steps:
    - Add `RUN groupadd -r appuser && useradd -r -g appuser appuser` before the ENTRYPOINT and add `USER appuser` as the last
      instruction before ENTRYPOINT.
    - Replace `chmod -R 777 /app /app/runtime` with `chmod -R 750 /app && chown -R appuser:appuser /app` so only the application
      owner can write.
    - 'If the application needs to write to `runtime/`, restrict write permission to that directory only: `chmod 770 /app/runtime
      && chown appuser:appuser /app/runtime`.'
    - Verify by running `docker run --rm <image> whoami` and confirming the output is `appuser`, not `root`.
    code_example: "# Add before ENTRYPOINT:\nRUN groupadd -r appuser && useradd -r -g appuser appuser \\\n    && chown -R\
      \ appuser:appuser /app \\\n    && chmod -R 750 /app \\\n    && chmod 770 /app/runtime\n\nUSER appuser\n\nENTRYPOINT\
      \ [\"java\", \"-jar\", \"/app/target/appsec-verification-target-0.0.1-SNAPSHOT.jar\"]"
    verification: Run `docker run --rm <image> id` and confirm UID is non-zero. Attempt to write to /app/target from within
      the container as appuser and confirm permission denied.
    reference: CWE-250
  evidence:
  - file: Dockerfile
    line: 31
  evidence_check: verified
  controls_absent_evidence:
  - pattern: '^USER '
