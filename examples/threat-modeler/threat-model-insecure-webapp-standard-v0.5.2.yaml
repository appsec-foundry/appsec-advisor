  evidence_summary: FileReadController:19 calls `Path.of("runtime/documents/" + name)` with no normalization or prefix check;
    Files.readString() at line 20 reads the resulting path.
  impact_description: Unauthenticated read access to any file the JVM process can access, including application secrets, OS
    password files, and private keys.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — the endpoint is public and performs no path validation.
  mitigation_title: Canonicalize the path and enforce a base-directory prefix check in FileReadController.read
  remediation:
