- id: M-047
  title: Pin the container base image to an immutable digest
  threat_ids:
  - T-049
  priority: P3
  severity: Medium
  effort: Low
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Pin base image to a verified SHA-256 digest and migrate to a maintained JRE ima…
  steps:
  - Migrate to a maintained JRE-only base image such as `eclipse-temurin:17-jre-jammy` to reduce attack surface and receive
    ongoing security patches.
  - 'Pin the chosen image to its SHA-256 digest: `FROM eclipse-temurin:17-jre-jammy@sha256:<verified-digest>`. Obtain the
    digest via `docker buildx imagetools inspect eclipse-temurin:17-jre-jammy`.'
  - Automate digest refreshes with Dependabot (Docker support) or Renovate configured to monitor the base image tag and open
    PRs when the digest changes.
  - In CI, enable Docker Content Trust (`DOCKER_CONTENT_TRUST=1`) or Cosign signature verification to prevent pulling unsigned
    or substituted images.
  code_example: '# Before:

    FROM openjdk:17-slim


    # After — maintained image, pinned digest:

    FROM eclipse-temurin:17-jre-jammy@sha256:REPLACE_WITH_VERIFIED_DIGEST'
