- local_id: spring-app-012
  threat_category_id: TH-06
  stride: Tampering
  cwe: CWE-352
  title: Homegrown CSRF Token Validates Presence Only, Not Value (CsrfSettingsController)
  scenario: CsrfSettingsController.update() at line 47 checks `formToken == null || formToken.isBlank()` and rejects blank
    tokens — but never calls `csrfTokenService.currentToken(session)` to compare the submitted token against the session-stored
    one. Any non-blank string submitted as formToken passes the check. Combined with the global CSRF disable and the permissive
    CORS policy, a cross-origin attacker can POST to /csrf/settings with `formToken=x` to update the victim's contact email.
  evidence_summary: CsrfSettingsController:47 checks only for a blank formToken; CsrfTokenService.currentToken() is imported
    but never called in the update path, making the validation purely cosmetic.
  impact_description: 'The custom CSRF guard on /csrf/settings provides no actual protection: any non-blank token bypasses
    it, allowing cross-site form submission.'
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: CsrfTokenService correctly generates and stores a cryptographically random token in the session; the
    defect is in the validation path, not issuance.
  mitigation_title: Compare submitted CSRF token against session-stored token in CsrfSettingsController.update
  remediation:
    effort: Low
    steps:
    - In CsrfSettingsController.update(), retrieve the expected token via `csrfTokenService.currentToken(session)` and compare
      it to `formToken` using `MessageDigest.isEqual()` (constant-time).
    - Reject the request with HTTP 403 if the tokens do not match or if the session has no token.
    - Re-enable Spring Security's built-in CSRF support (fixing spring-app-011) and delete this custom implementation.
    code_example: "String expected = csrfTokenService.currentToken(session);\nif (expected == null || !MessageDigest.isEqual(\n\
      \        expected.getBytes(StandardCharsets.UTF_8),\n        formToken.getBytes(StandardCharsets.UTF_8))) {\n    throw\
      \ new ResponseStatusException(HttpStatus.FORBIDDEN, \"Invalid CSRF token\");\n}"
    verification: POST to /csrf/settings with formToken=WRONG while holding a valid session; confirm HTTP 403 is returned.
    reference: CWE-352
