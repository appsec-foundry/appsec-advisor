  stride: Information Disclosure
  cwe: CWE-918
  title: Server-Side Request Forgery via Unrestricted URL Fetch
  scenario: IntegrationController.fetch() passes the caller-supplied url parameter directly to `restTemplate.getForObject(url,
    String.class)` with no scheme allowlist, host allowlist, or DNS rebinding protection. The endpoint GET /api/integration/fetch
    is listed as permitAll() in SecurityConfig:37. An attacker accesses the AWS EC2 instance metadata service with http://169.254.169.254/latest/meta-data/iam/security-credentials/
    or probes internal services (http://localhost:8080/actuator/env) to retrieve application secrets and IAM credentials.
  attack_steps:
  - An unauthenticated attacker sends GET /api/integration/fetch?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/
  - IntegrationController:23 calls restTemplate.getForObject() with the attacker's URL; the server makes an outbound HTTP
    request to the metadata endpoint.
  - The response body (IAM credentials) is returned to the attacker in the JSON response body up to 2000 characters.
  evidence_summary: IntegrationController:23 calls `restTemplate.getForObject(url, String.class)` where url is the raw @RequestParam
    value with no validation.
  impact_description: Unauthenticated probing of internal services and cloud metadata endpoints, enabling IAM credential theft
    and internal network mapping.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — no URL validation or allowlist. The response is truncated to 2000 chars but the full HTTP request
    is made regardless.
  mitigation_title: Validate outbound URLs against an explicit scheme and host allowlist in IntegrationController.fetch
  remediation:
    effort: Medium
    steps:
    - Parse the supplied URL and verify the scheme is `https` only and the host matches an explicit allowlist.
    - Block requests to private IP ranges (10.x.x.x, 172.16-31.x.x, 192.168.x.x, 169.254.x.x, ::1) after DNS resolution.
    - Require authentication for the endpoint (remove it from permitAll).
    - Use a dedicated HTTP proxy with egress filtering rather than a raw RestTemplate.
