  title: XML External Entity Injection in XmlPreviewController (XXE)
  scenario: XmlPreviewController.preview() creates a DocumentBuilderFactory with default settings (external entity processing
    enabled) and parses attacker-supplied XML. An attacker posts XML containing an ENTITY declaration referencing a local
    file (e.g., `file:///etc/passwd`) or an external URL, causing the parser to read the resource and embed its contents in
    the parsed document. The POST /api/xml/preview endpoint is listed as permitAll() in SecurityConfig:42.
  attack_steps:
  - An unauthenticated attacker sends a POST to /api/xml/preview with Content-Type text/xml and a payload containing `<!DOCTYPE
    foo [<!ENTITY xxe SYSTEM 'file:///etc/passwd'>]><root>&xxe;</root>`.
  - XmlPreviewController:22 creates an unprotected DocumentBuilderFactory and builder, which fetches the file URI.
  - The parsed document's text content contains lines from /etc/passwd; the parser count or element structure leaks the file
    content indirectly.
  evidence_summary: XmlPreviewController:22 calls DocumentBuilderFactory.newInstance() and builder.parse() with no `setFeature("http://apache.org/xml/features/disallow-doctype-decl",
    true)` call.
  impact_description: Unauthenticated server-side file read and internal network probing via XML external entity injection.
  likelihood: High
  impact: High
