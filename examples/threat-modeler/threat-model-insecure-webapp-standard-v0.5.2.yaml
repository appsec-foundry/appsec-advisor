tier_root_causes:
  server:
  - JWT signature verification absent — alg:none and unsigned tokens accepted
  - raw SQL and OS-command injection from unsanitized request parameters
  - hardcoded secrets baked into source code and Dockerfile ENV layers
  - authentication missing on H2 console, admin board, and actuator endpoints
  - CSRF protection disabled globally and mass-assignment unrestricted on profile
  data:
  - SQL injection in legacy authentication via raw string concatenation
  - credential databases and plaintext passwords committed to Docker image layers
  - unauthenticated read access exposes all users via legacy SQLite endpoint
  - no audit log for H2 SQL console queries allows silent data exfiltration
