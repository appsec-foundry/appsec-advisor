- local_id: container-image-005
  threat_category_id: TH-14
  additional_categories: []
  stride: Tampering
  cwe: CWE-1104
  title: Mutable Base Image Tag Without Digest Pin (Dockerfile)
  scenario: '`FROM openjdk:17-slim` at Dockerfile line 4 uses a mutable Docker Hub tag. Docker resolves the tag to a different
    image manifest on every build whenever the upstream maintainer publishes an update. A build runner that rebuilds the image
    after an upstream push will silently base the application on a different set of OS packages and JVM binaries than the
    previous build. If the Docker Hub account or the CDN serving the manifests is compromised, a malicious image masquerading
    as openjdk:17-slim is pulled without any integrity signal to the builder. Additionally, openjdk:17-slim is flagged as
    deprecated in favour of eclipse-temurin; it is no longer receiving regular security updates, meaning the JVM and system
    libraries baked in carry accumulated unpatched CVEs.'
  evidence_summary: Dockerfile:4 references `openjdk:17-slim` by mutable tag; no `@sha256:` digest appears, so every build
    may pull a different image without the build pipeline detecting the substitution.
  impact_description: A compromised or silently updated base image introduces malicious or vulnerable binaries into every
    container derived from this Dockerfile.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: None — no digest pin, no image signing verification (Cosign/Notary).
  mitigation_title: Pin base image to a verified SHA-256 digest and migrate to a maintained JRE image
  remediation:
    effort: Low
    steps:
    - Migrate to a maintained JRE-only base image such as `eclipse-temurin:17-jre-jammy` to reduce attack surface and receive
      ongoing security patches.
    - 'Pin the chosen image to its SHA-256 digest: `FROM eclipse-temurin:17-jre-jammy@sha256:<verified-digest>`. Obtain the
      digest via `docker buildx imagetools inspect eclipse-temurin:17-jre-jammy`.'
    - Automate digest refreshes with Dependabot (Docker support) or Renovate configured to monitor the base image tag and
      open PRs when the digest changes.
    - In CI, enable Docker Content Trust (`DOCKER_CONTENT_TRUST=1`) or Cosign signature verification to prevent pulling unsigned
      or substituted images.
    code_example: '# Before:

      FROM openjdk:17-slim


      # After — maintained image, pinned digest:

      FROM eclipse-temurin:17-jre-jammy@sha256:REPLACE_WITH_VERIFIED_DIGEST'
    verification: Run `docker inspect <image> | jq '.[0].RootFS.Layers'` on two successive builds and confirm the layer digests
      are identical. Run `docker buildx imagetools inspect eclipse-temurin:17-jre-jammy` to retrieve the pinnable digest before
      updating the Dockerfile.
    reference: CWE-1104
  evidence:
  - file: Dockerfile
    line: 4
  boundary_refs:
  - boundary_id: tb-2
    origin_component_id: container-image
    rationale: The FROM tag is mutable; without a digest pin the build pipeline cannot guarantee the fetched base image is
      the expected artifact, violating the boundary assumption that all base images are pinned to.
    leg: validation
    evidence_locations:
