- local_id: container-image-001
  threat_category_id: TH-03
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-798
  title: Hardcoded Secrets in Dockerfile ENV Layers (Dockerfile)
  scenario: Four secrets — DB_PASSWORD, JWT_SIGNING_KEY, AWS_ACCESS_KEY_ID, and AWS_SECRET_ACCESS_KEY — are baked into ENV
    instructions at Dockerfile lines 12-15. Docker stores each ENV instruction as a discrete image layer. Any user with access
    to the registry (docker pull, docker history, or docker inspect) can read the plaintext values without needing to run
    the container. The JWT signing key enables the attacker to forge arbitrary JWT tokens accepted by the application. The
    AWS credentials provide direct access to the configured AWS account and any resources it is authorized to reach. The DB
    password exposes the database to direct authentication. These secrets cannot be rotated without rebuilding and redeploying
    the image; rotation does not invalidate the secret from previously pulled image layers.
  attack_steps:
  - An attacker with access to the container registry or any image archive pulls the image and runs `docker history --no-trunc
    <image>` to enumerate all layer metadata.
  - The attacker reads the ENV layer values for DB_PASSWORD, JWT_SIGNING_KEY, AWS_ACCESS_KEY_ID, and AWS_SECRET_ACCESS_KEY
    in plain text from the history output.
  - The attacker uses the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to call AWS APIs and the JWT_SIGNING_KEY to sign arbitrary
    tokens accepted by the live application.
  evidence_summary: Dockerfile lines 12-15 set DB_PASSWORD, JWT_SIGNING_KEY, AWS_ACCESS_KEY_ID, and AWS_SECRET_ACCESS_KEY
    as plaintext ENV instructions; each becomes a readable layer in the image manifest.
  impact_description: Any holder of the image can forge JWTs, access AWS resources, and authenticate to the database with
    zero additional exploitation.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None
  mitigation_title: Remove hardcoded secrets from Dockerfile ENV; supply credentials via runtime secret injection
  remediation:
    effort: Medium
    steps:
    - Remove all ENV DB_PASSWORD, JWT_SIGNING_KEY, AWS_ACCESS_KEY_ID, and AWS_SECRET_ACCESS_KEY lines from the Dockerfile.
    - Supply secrets at container runtime via Docker Secrets (Swarm), Kubernetes Secrets mounted as files, or a secrets manager
      sidecar (AWS Secrets Manager, HashiCorp Vault Agent) — never as build ARG or ENV.
    - Rotate all four exposed secrets immediately; treat every previously built image as compromised regardless of registry
      access controls.
    - Add a pre-commit hook or CI step using `gitleaks` or `trufflehog` to block Dockerfile commits that contain ENV lines
      matching secret patterns.
    code_example: '# Before (insecure):

      ENV JWT_SIGNING_KEY=hardcoded-legacy-jwt-secret


      # After — secret injected at runtime, not build time:

      # Kubernetes: mount as file, read in application:

      # spec.containers[].env: [{name: JWT_SIGNING_KEY, valueFrom: {secretKeyRef: {name: app-secrets, key: jwt-signing-key}}}]

      # Application reads System.getenv("JWT_SIGNING_KEY") — no Dockerfile change needed.'
    verification: Run `docker history --no-trunc <rebuilt-image> | grep -E 'DB_PASSWORD|JWT_SIGNING_KEY|AWS_ACCESS'` and confirm
      zero hits. Attempt to start the container without the runtime secret; confirm the application fails with a clear configuration
      error rather than using a fallback default.
    reference: CWE-798
