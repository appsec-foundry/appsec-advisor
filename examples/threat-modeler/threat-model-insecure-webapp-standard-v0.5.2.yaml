- local_id: sqlite-auth-003
  threat_category_id: TH-03
  stride: Information Disclosure
  cwe: CWE-916
  title: Passwords Stored in Plaintext Without Hashing in Legacy SQLite Store
  scenario: 'The save() method at LegacySqliteUserStore.java:100 stores the password parameter directly into the legacy_users
    table with no hashing, salting, or encoding. Both the register path (POST /api/legacy-sqlite/register) and the startup
    seeding block (lines 37-39) use this method.


    The authenticate() method performs a WHERE username=? AND password=? lookup, confirming that plaintext password comparison
    is the authentication mechanism. Any attacker who obtains read access to the SQLite file — via SQL injection, directory
    traversal, container image inspection, or a backup leak — immediately obtains all credentials in usable form, with no
    cracking required.


    The three seeded accounts (legacy_alice/password, legacy_bob/password, legacy_admin/admin) demonstrate that weak passwords
    are the norm in this store.'
  evidence_summary: save() at line 100 passes the password string directly to PreparedStatement.setString() with no transformation,
    and the unauthenticated /users endpoint confirms passwords are stored in their original form.
  impact_description: Any read-access path to the SQLite data — file system, API, or container layer — yields immediately
    usable plaintext credentials for all accounts.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — passwords are stored and compared as plaintext strings.
  mitigation_title: Hash passwords with Argon2 or BCrypt before storage and update comparison logic in authenticate()
  remediation:
    effort: Medium
    steps:
    - Add Spring Security's BCryptPasswordEncoder (or the Argon2PasswordEncoder) as a bean and inject it into LegacySqliteUserStore.
    - In save(), replace `statement.setString(2, password)` with `statement.setString(2, encoder.encode(password))` to store
      only the hash.
    - In authenticate(), replace the WHERE password=? predicate with a plaintext lookup followed by `encoder.matches(rawPassword,
      storedHash)` comparison so the hash comparison happens in application code rather than SQL.
    - Re-seed the database with hashed versions of all existing passwords or force a password reset for existing accounts
      after deployment.
    code_example: "// Before (LegacySqliteUserStore.java:100):\nstatement.setString(2, password); // stored as plaintext\n\
      \n// After — store hash only:\nstatement.setString(2, passwordEncoder.encode(password));\n\n// In authenticate(), fetch\
      \ by username only, then verify:\nif (passwordEncoder.matches(rawPassword, resultSet.getString(\"password\"))) {\n \
      \   return Optional.of(readUser(resultSet));\n}"
    verification: After the fix, query the database directly (`sqlite3 runtime/legacy-auth.sqlite 'SELECT password FROM legacy_users
      LIMIT 1'`) and confirm the value begins with `$2a$` (BCrypt) or `$argon2` rather than a plaintext word.
    reference: CWE-916
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteUserStore.java
    line: 100
  evidence_check: verified
