threats:
- local_id: sqlite-auth-001
  threat_category_id: TH-01
  additional_categories:
  - TH-02
  stride: Spoofing
  cwe: CWE-89
  title: SQL Injection Authentication Bypass in authenticateRaw
  affected_parameter: username, password
  scenario: 'The public endpoint GET /api/legacy-sqlite/login-raw accepts username and password as query parameters and passes
    them to authenticateRaw(), which builds the SQL query by direct string concatenation at LegacySqliteUserStore.java:64:
    `"... where username = ''" + username + "'' and password = ''" + password + "''"`.


    An attacker sends username=`legacy_admin'' --` and any password. The resulting SQL becomes `... where username = ''legacy_admin''
    --'' and password = ''...''`, commenting out the password predicate entirely and returning the admin row. The response
    is a 200 with role=ADMIN.


    Alternatively, a blind UNION injection via the username parameter can extract all credentials from the legacy_users table.
    The parameterized authenticate() method exists but is called only from the POST /login endpoint; the GET /login-raw endpoint
    bypasses it.


    This breaks the tb-5 trust boundary assumption: ''Credential verification uses the parameterized authenticate() method,
    not the raw SQL authenticateRaw().'''
  attack_steps:
  - An attacker sends GET /api/legacy-sqlite/login-raw?username=legacy_admin%27+--&password=**** to the unauthenticated
    public endpoint.
  - The attacker-supplied username reaches authenticateRaw() and is concatenated directly into the SQL string, producing a
    query that comments out the password check.
  - The attacker receives HTTP 200 with status=accepted and role=ADMIN, gaining an authenticated admin session without knowing
    the actual password.
  evidence_summary: authenticateRaw() at line 64 constructs SQL by concatenating username and password directly into the query
    string via Java string concatenation, with no parameterization.
  impact_description: Full authentication bypass for any account including legacy_admin (role=ADMIN); UNION-based injection
    can also dump all usernames and plaintext passwords from legacy_users.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: The parameterized authenticate() method exists and is used by POST /api/legacy-sqlite/login, but is not
    called by the vulnerable GET /api/legacy-sqlite/login-raw endpoint.
  mitigation_title: Replace raw SQL string concatenation in authenticateRaw() with PreparedStatement parameter binding
  remediation:
    effort: Low
    steps:
    - Replace the string-concatenated SQL in authenticateRaw() with a PreparedStatement identical to the one already used
      in authenticate() — or remove authenticateRaw() entirely and route GET /login-raw through the parameterized authenticate()
      method.
    - Remove or disable the GET /api/legacy-sqlite/login-raw endpoint from LegacySqliteAuthController; its raw-SQL path has
      no legitimate production use.
    - Add an integration test that verifies login-raw with username=`' OR '1'='1` returns HTTP 401.
    code_example: "// Before (LegacySqliteUserStore.java:64) — VULNERABLE:\nString sql = \"select id, username, password,\
      \ role from legacy_users where username = '\" + username + \"' and password = '\" + password + \"'\";\n\n// After —\
      \ safe: delegate to the existing parameterized method:\npublic Optional<LegacySqliteUser> authenticateRaw(String username,\
      \ String password) {\n    return authenticate(username, password); // uses PreparedStatement binding\n}"
    verification: Send GET /api/legacy-sqlite/login-raw?username=legacy_admin%27+--&password=x and confirm the response is
      HTTP 401. Send the same payload to POST /api/legacy-sqlite/login and confirm HTTP 401 is still returned (regression).
    reference: CWE-89
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/authentication/LegacySqliteUserStore.java
    line: 64
  boundary_refs:
  - boundary_id: tb-4
