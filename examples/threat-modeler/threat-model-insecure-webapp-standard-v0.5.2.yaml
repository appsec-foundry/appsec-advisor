- local_id: h2-database-004
  threat_category_id: TH-16
  additional_categories: []
  stride: Repudiation
  cwe: CWE-778
  title: No Audit Log for H2 Console SQL Queries
  scenario: 'The H2 console is reachable without authentication and allows arbitrary SQL execution, yet no query-level audit
    log is configured. `spring.jpa.show-sql: false` (application.yml:16) silences Hibernate''s SQL log, but console queries
    bypass JPA entirely and go directly to the H2 JDBC engine — they would not appear in Hibernate logs even if logging were
    enabled. There is no Spring Security audit event (no authenticated principal to log), no JDBC interceptor, and no access
    log configured in application.yml. An attacker who exfiltrates all user data, modifies records, or drops tables via the
    console leaves no attributable trace — not even a username or session identifier, since the access is unauthenticated.'
  evidence_summary: application.yml:16 disables JPA SQL logging; the H2 console queries bypass the JPA layer entirely, and
    no JDBC-level audit interceptor is configured.
  impact_description: Post-incident forensic reconstruction of console-based data theft or destruction is impossible — there
    is no record of which SQL statements were executed or from which IP address.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: None — no query audit log for the H2 console execution path.
  mitigation_title: Enable H2 query trace logging and configure an access log for the console path
  remediation:
    effort: Medium
    steps:
    - In the H2 JDBC URL, append `;TRACE_LEVEL_FILE=2` to write all SQL statements to an H2 trace file, or configure a JDBC
      proxy interceptor (e.g., `p6spy`) to log all database calls.
    - 'Configure Spring Boot''s embedded Tomcat access log (`server.tomcat.accesslog.enabled: true`, pattern including timestamp,
      remote-addr, request-line, status) so that console HTTP requests are recorded.'
    - As the primary remediation, disable the H2 console entirely (see h2-database-001) — eliminating the unauthenticated
      surface removes the need to audit it.
    code_example: "# application.yml\nspring:\n  datasource:\n    url: jdbc:h2:mem:appsec_verification_target;TRACE_LEVEL_FILE=2;...\n\
      \nserver:\n  tomcat:\n    accesslog:\n      enabled: true\n      pattern: \"%h %t \\\"%r\\\" %s\""
    verification: Execute a test SQL statement via the H2 console and confirm the statement appears in the H2 trace file or
      the configured audit log.
    reference: CWE-778
  evidence:
  - file: src/main/resources/application.yml
    line: 16
  evidence_check: verified
  prior_finding_ref: null
  architectural_violation: false
  component_name: H2 In-Memory Database
