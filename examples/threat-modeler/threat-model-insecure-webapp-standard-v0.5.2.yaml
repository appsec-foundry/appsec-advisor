- local_id: sqlite-auth-005
  threat_category_id: TH-03
  stride: Information Disclosure
  cwe: CWE-312
  title: SQLite Credential Database Baked Into Docker Image via COPY . /app
  scenario: 'Dockerfile line 18 copies the entire build context — including runtime/legacy-auth.sqlite — into the image with
    `COPY . /app`. Line 26 then sets `chmod -R 777 /app /app/runtime`, making the database file world-writable inside the
    container.


    The SQLite file contains the same plaintext credential data seeded by initialize(). Anyone with access to the Docker image
    (from a registry, a host, or a compromised CI/CD pipeline) can extract the database with `docker create <image>; docker
    cp <container>:/ app/runtime/legacy-auth.sqlite .` and read all credentials without running the application.


    Further, if the image is ever pushed to a public registry the credentials are permanently exposed in that layer.'
  evidence_summary: Dockerfile line 18 COPY . /app bakes runtime/legacy-auth.sqlite (confirmed by comment 'runtime/ credential
    stores and legacy SQLite auth db') into the image; line 26 sets 777 permissions on /app/runtime.
  impact_description: The SQLite credential file (including all plaintext passwords) is extractable from any copy of the Docker
    image, including CI artifacts, registry pulls, and host snapshots.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None — no .dockerignore exclusion for runtime/ directory.
  mitigation_title: Exclude runtime/legacy-auth.sqlite from the Docker build context and provision it at container startup
    from a mounted secret volume
  remediation:
    effort: Low
    steps:
    - Add `runtime/` to a .dockerignore file so the SQLite database is never copied into any image layer.
    - 'Change Dockerfile COPY to copy only the application artifact: `COPY target/appsec-verification-target-0.0.1-SNAPSHOT.jar
      /app/app.jar` instead of the whole context.'
    - Remove `chmod -R 777 /app /app/runtime`; create the runtime directory with restricted permissions and set the application
