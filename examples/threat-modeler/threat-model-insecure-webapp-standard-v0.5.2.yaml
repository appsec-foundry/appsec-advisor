- local_id: spring-app-029
  threat_category_id: TH-06
  stride: Elevation of Privilege
  cwe: CWE-915
  title: Mass Assignment Privilege Escalation via PUT /api/profile/me (ProfileController)
  scenario: ProfileController.update() at lines 44-47 deserializes the request body as AppUser and then applies the `role`
    field (line 44) and `admin` flag (line 47) directly to the current user without any authorization check. An authenticated
    user sends `PUT /api/profile/me` with body `{"role":"ADMIN","admin":true}` to grant themselves full administrative privileges.
    The updated record is persisted via appUserRepository.save(), making the change permanent.
  attack_steps:
  - An attacker authenticates as a regular user (e.g., alice) and sends `PUT /api/profile/me` with Content-Type application/json.
  - The request body is `{"email":"alice@example.com","role":"ADMIN","admin":true}` — role and admin are user-supplied.
  - ProfileController:44-47 applies incoming.getRole() (ADMIN) and incoming.isAdmin() (true) to the current user object without
    checking if the requester has permission to change roles.
  - appUserRepository.save() persists the promoted record; alice now has ROLE_ADMIN access to all @PreAuthorize-gated admin
    endpoints.
  evidence_summary: ProfileController:44 calls `current.setRole(incoming.getRole())` and line 47 calls `current.setAdmin(incoming.isAdmin())`
    where incoming is bound directly from the request body AppUser without allowlisting.
  impact_description: Any authenticated user can promote themselves to ADMIN by supplying role and admin fields in the profile
    update request body.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — no allowlist on which fields a user may update, and no role-ownership check before applying privileged
    fields.
  mitigation_title: Use an explicit update DTO that excludes role and admin fields in ProfileController.update
  remediation:
    effort: Low
    steps:
    - Replace AppUser as the request body type with a ProfileUpdateRequest DTO containing only user-settable fields (email,
      passwordHash).
    - Never bind the domain entity directly from the request body.
    - If admins must change roles, provide a separate PUT /api/admin/users/{id}/role endpoint protected by @PreAuthorize('hasRole("ADMIN")').
    code_example: "// Define a safe DTO:\npublic record ProfileUpdateRequest(String email, String passwordHash) {}\n\n// In\
      \ update():\n@PutMapping(\"/me\")\npublic ResponseEntity<ProfileResponse> update(\n        Authentication auth, @RequestBody\
      \ ProfileUpdateRequest req) {\n    return appUserRepository.findByUsername(auth.getName()).map(current -> {\n      \
      \  if (req.email() != null) current.setEmail(req.email());   // only safe fields\n        // role and admin: never touched\
      \ here\n        return ResponseEntity.ok(ProfileResponse.from(appUserRepository.save(current)));\n    }).orElseGet(()\
      \ -> ResponseEntity.notFound().build());\n}"
    verification: Send PUT /api/profile/me with body {"role":"ADMIN","admin":true}; confirm the response shows the original
      role and admin=false unchanged.
    reference: CWE-915
  evidence:
