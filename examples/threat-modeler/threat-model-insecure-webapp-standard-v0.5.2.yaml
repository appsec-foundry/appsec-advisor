- id: sqlite-auth
  name: Legacy SQLite Auth Backend
  description: File-based SQLite database at runtime/legacy-auth.sqlite storing usernames and plaintext passwords for the
    legacy authentication path. Accessed via /api/legacy-sqlite/** endpoints and vulnerable to SQL injection.
  paths:
  - runtime/legacy-auth.sqlite
  - src/main/java/com/example/insecure/legacysqlite/**
  tier: data
  complexity: simple
  framework: null
  deployment_zones:
