- local_id: h2-database-003
  threat_category_id: TH-09
  additional_categories: []
  stride: Tampering
  cwe: CWE-1021
  title: H2 Console Clickjacking via sameOrigin Frame Policy
  scenario: The Spring Security configuration sets `frameOptions(HeadersConfigurer.FrameOptionsConfig::sameOrigin)` instead
    of `DENY`, and CSRF protection is disabled globally. Because the H2 console is hosted on the same origin as the application,
    any stored XSS in the application (or any other attacker-controlled same-origin page) can embed `/h2-console/` in a transparent
    iframe and overlay a deceptive UI. A victim who is on the same-origin page and clicks the overlaid element interacts with
    the hidden H2 console, executing attacker-chosen SQL statements (for example, modifying ownership records or inserting
    rogue orders). The combination of permitAll access (no authentication guard), empty password (trivial console login),
    CSRF disabled, and sameOrigin framing makes the console fully controllable via UI redressing on the same origin.
  evidence_summary: application.yml:11 enables the H2 console; SecurityConfig.java:29 sets frameOptions to sameOrigin rather
    than DENY, allowing same-origin iframe embedding.
  impact_description: An attacker with any same-origin content injection vector can drive arbitrary SQL execution through
    the H2 console without the victim knowing they are interacting with a database management interface.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: sameOrigin frame option limits embedding to same-origin pages only; cross-origin clickjacking is blocked.
  mitigation_title: Deny all iframe embedding of the H2 console and re-enable CSRF protection
  remediation:
    effort: Low
    steps:
    - Set `frameOptions(HeadersConfigurer.FrameOptionsConfig::deny)` in SecurityConfig to prevent all framing of the application
      — or scope it to the H2 console path specifically.
    - Remove `.csrf(AbstractHttpConfigurer::disable)` and configure CSRF exclusions only for stateless API paths, not the
      console.
    - Disable the H2 console in non-development profiles as described in h2-database-001 — the primary remediation that eliminates
      this vector entirely.
    code_example: "// SecurityConfig.java\n.headers(headers -> headers\n    .frameOptions(HeadersConfigurer.FrameOptionsConfig::deny)\
      \  // was: sameOrigin\n)"
    verification: 'Verify the `X-Frame-Options: DENY` response header appears on `/h2-console/` requests: `curl -I http://localhost:8080/h2-console/
      | grep -i x-frame-options`.'
    reference: CWE-1021
  evidence:
