- local_id: spring-app-024
  threat_category_id: TH-12
  stride: Denial of Service
  cwe: CWE-307
  title: No Rate Limiting on Authentication Endpoints Enables Credential Brute Force
  scenario: The POST /login endpoint (Spring Security form login) and GET /api/legacy-sqlite/login-raw accept unlimited requests
    with no lockout, rate limit, or CAPTCHA. With the trivially guessable default credential admin/password and dictionary
    words, an attacker can attempt thousands of login combinations per second. There is no in-process throttle, no distributed
    counter, and no lockout event logged beyond the Spring Security failure URL redirect.
  evidence_summary: SecurityConfig:50-55 configures form login with no rate-limiting middleware; grep for 'rateLimit|throttle|RateLimiter'
    in the codebase returns zero hits across all src/ files.
  impact_description: An attacker can enumerate valid usernames (via differential timing or the 'exists' error in RegistrationController:47)
    and brute-force passwords without triggering any lockout.
  likelihood: High
  impact: Medium
  risk: High
  controls_in_place: None — no rate limiting, lockout, or CAPTCHA on any authentication endpoint.
  controls_absent_evidence:
  - pattern: rateLimit|throttle|RateLimiter|Bucket4j|resilience4j\.ratelimiter
    search_paths:
    - src/
    hit_count: 0
    searched_at: '2026-08-02T17:33:00Z'
  mitigation_title: Add rate limiting and account lockout to POST /login and authentication endpoints
  remediation:
    effort: Medium
    steps:
    - Add Bucket4j or Spring Boot's built-in `spring.security.filter.order` combined with a custom AuthenticationFailureHandler
      that increments a Redis/in-memory counter per IP and per username.
    - 'Lock accounts after 5 failed attempts for 15 minutes: record failures in a LoginAttemptService and check it in a custom
      AuthenticationProvider.'
    - Add CAPTCHA (reCAPTCHA v3) to the /login form for repeated failure scenarios.
