  title: SQL Injection
  scenario: 'OrderLookupDao.findByOwnerEmail() builds a native SQL query by directly concatenating the caller-supplied email
    string: `... where u.email = ''" + email + "''`. This method is invoked from the GET /api/orders/search endpoint which
    SecurityConfig:35 lists as permitAll() — no authentication required. An attacker sends email='' UNION SELECT id,username,password_hash,email,email,role
    FROM app_users-- to extract the full user table including BCrypt hashes, or uses the H2 MODE=PostgreSQL stacked-query
    support to execute DML.'
  attack_steps:
  - An unauthenticated attacker sends GET /api/orders/search?email=' UNION SELECT 1,username,password_hash,email,email,1 FROM
    app_users--
  - OrderLookupDao:22 concatenates the value directly into the SQL string, producing a UNION query against app_users.
  - H2 executes the injected UNION and returns all usernames and BCrypt password hashes in the orders response.
  - The attacker cracks the BCrypt hashes offline, obtaining plaintext credentials for all accounts including admin.
  evidence_summary: OrderLookupDao:22 builds the SQL string as `'... where u.email = \'' + email + '\' order by o.id'` using
    EntityManager.createNativeQuery().
  impact_description: Unauthenticated full read/write access to the H2 database including all user, order, and document records.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: Spring Data JPA parameterized queries are used in the domain.* package, but OrderLookupDao bypasses them
    with createNativeQuery() and string concatenation.
  mitigation_title: Parameterize the native query in OrderLookupDao.findByOwnerEmail using JPA named parameters
  remediation:
    effort: Low
    steps:
    - 'Replace the string concatenation with a JPA named parameter: `entityManager.createNativeQuery("... where u.email =
      :email", CustomerOrder.class).setParameter("email", email).getResultList()`.'
    - Alternatively, rewrite the query as a Spring Data JPA @Query method on CustomerOrderRepository with JPQL and named binding.
    - Add an integration test asserting that email=`' OR '1'='1` returns no results.
    code_example: "// Before:\nString sql = \"select o.* from customer_orders o join app_users u\"\n           + \" on o.owner_id\
      \ = u.id where u.email = '\" + email + \"'\";\nreturn entityManager.createNativeQuery(sql, CustomerOrder.class).getResultList();\n\
      \n// After:\nString sql = \"select o.* from customer_orders o join app_users u\"\n           + \" on o.owner_id = u.id\
      \ where u.email = :email order by o.id\";\nreturn entityManager.createNativeQuery(sql, CustomerOrder.class)\n    .setParameter(\"\
      email\", email)\n    .getResultList();"
    verification: Send GET /api/orders/search?email=%27+OR+%271%27%3D%271; confirm an empty list or HTTP 400 is returned.
    reference: CWE-89
