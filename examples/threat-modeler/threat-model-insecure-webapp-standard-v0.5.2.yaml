- local_id: spring-app-002
  threat_category_id: TH-02
  stride: Spoofing
  cwe: CWE-522
  title: Forged Session Token via Base64-Encoded User ID (HomegrownSessionService)
  scenario: HomegrownSessionService.issueToken() encodes the numeric userId as a Base64 string with no HMAC or signature.
    Any caller who supplies a Base64-encoded integer is resolved to that user ID in the database. The admin user has ID 100
    (seeded by DemoDataSeeder); Base64("100") = "MTAw". An attacker sends GET /api/legacy-session/orders?token=MTAw to impersonate
    the admin account and retrieve all admin orders, or GET /api/auth/legacy-session?token=MTAw to obtain the admin's session
    body.
  attack_steps:
  - An attacker observes that GET /api/auth/homegrown-token?userId=N returns Base64(N) and infers the token scheme.
  - The attacker computes Base64("100") = "MTAw" and sends GET /api/legacy-session/orders?token=MTAw.
  - HomegrownSessionService:26-27 decodes the token to the integer 100 and queries appUserRepository.findById(100), returning
    the admin account's orders.
  evidence_summary: HomegrownSessionService:21 issues tokens as `Base64.getEncoder().encodeToString(userId.toString().getBytes())`
    with no HMAC; resolve() at line 24 trusts any validly decoded long as a user ID.
  impact_description: Any caller who knows or guesses a valid user ID can impersonate that account on the legacy session endpoints
    without valid credentials.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — no signature or MAC on the token.
  mitigation_title: Replace Base64 userId tokens with HMAC-signed tokens in HomegrownSessionService
  remediation:
    effort: Medium
    steps:
    - 'Sign the userId using HMAC-SHA256 with a stable server-side secret: `Base64(userId + ''.'' + HMAC-SHA256(secret, userId))`.'
    - Verify the HMAC before looking up the user, rejecting any token whose MAC does not match.
    - Prefer migrating consumers of HomegrownSessionService to use the existing Spring Security session (JSESSIONID) or the
      signed JWT service at /api/secure-jwt/**.
    code_example: "// Replace token issuance:\nMac mac = Mac.getInstance(\"HmacSHA256\");\nmac.init(new SecretKeySpec(secret,\
      \ \"HmacSHA256\"));\nString sig = Base**** (20 chars)().encodeToString(\n    mac.doFinal(userId.toString().getBytes()));\n\
      return userId + \".\" + sig; // token = userId.HMAC"
    verification: Call GET /api/legacy-session/orders?token=MTAw (Base64 of '100'); confirm HTTP 401 is returned for an unsigned
      token.
    reference: CWE-522
