- local_id: spring-app-011
  threat_category_id: TH-06
  stride: Tampering
  cwe: CWE-352
  title: CSRF Protection Globally Disabled in SecurityConfig
  scenario: SecurityConfig:28 calls `.csrf(AbstractHttpConfigurer::disable)`, removing all CSRF protection for every endpoint.
    Any state-changing request (POST /orders, POST /documents, PUT /api/profile/me, POST /legacy/admin/users/{id}/promote)
    can be triggered cross-site by embedding an HTML form on an attacker-controlled page. A logged-in user visiting a malicious
    site causes their browser to silently submit that form using their JSESSIONID cookie, performing arbitrary mutations as
    the victim.
  evidence_summary: SecurityConfig:28 applies `AbstractHttpConfigurer::disable` to the csrf() configurer, removing Spring
    Security's built-in SynchronizerTokenPattern for all endpoints.
  impact_description: Any authenticated user's session can be hijacked to perform arbitrary state-changing operations on their
    behalf by an attacker hosting a malicious page.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: A partial custom CSRF token exists for /csrf/settings only (CsrfTokenService), but it is absent for all
    other forms and APIs.
  mitigation_title: Re-enable Spring Security CSRF protection and add CSRF tokens to all state-changing forms
  remediation:
    effort: Medium
    steps:
    - Remove `.csrf(AbstractHttpConfigurer::disable)` from SecurityConfig.
    - For REST API clients using stateless JWT, configure CSRF to apply only to session-authenticated endpoints using `csrf.ignoringRequestMatchers("/api/auth/**",
      "/api/secure-jwt/**")`.
    - Add `<input type='hidden' name='_csrf' th:value='${_csrf.token}' />` to all Thymeleaf forms or use Thymeleaf's built-in
      `th:action` which inserts the token automatically.
    - Set the SameSite=Strict cookie attribute on JSESSIONID as defense in depth.
    code_example: null
    verification: Construct an HTML form on a separate origin posting to /orders; confirm the request is rejected with HTTP
      403 Forbidden after enabling CSRF.
    reference: CWE-352
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
    line: 28
  evidence_check: verified
