  title: Insecure Direct Object Reference
  scenario: OrderAccessController.get() at line 24 calls `customerOrderRepository.findById(id)` and returns the order if it
    exists, with no check that the authenticated principal owns the order. Any authenticated user can enumerate order IDs
    starting from 100 (the seeded first ID) to read every order in the database, including orders belonging to other users,
    their item names, amounts, statuses, and customer comments. The secure variant (getOwned()) exists at line 31 but is not
    the default GET route.
