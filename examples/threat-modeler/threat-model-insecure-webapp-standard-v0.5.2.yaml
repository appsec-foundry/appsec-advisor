- local_id: spring-app-032
  threat_category_id: TH-02
  stride: Elevation of Privilege
  cwe: CWE-521
  title: No Password Minimum Length Policy on User Registration (RegistrationController)
  scenario: RegistrationController.register() at line 41 accepts any value for the `password` @RequestParam with no minimum
    length, complexity, or maximum-length validation. An attacker can register an account with a 1-character password. Combined
    with the absence of rate limiting (spring-app-024), other users who also choose trivially short passwords are susceptible
    to brute-force attacks. Additionally, BCrypt truncates input at 72 bytes; a missing maximum-byte-length check means a
    73-byte UTF-8 password is silently truncated, causing unexpected authentication behavior for multibyte characters.
  evidence_summary: RegistrationController:41 has `@RequestParam String password` with no @Size or explicit validation; no
    password-policy bean is wired in SecurityConfig.
  impact_description: Users can register with trivially guessable passwords; without rate limiting, account enumeration and
    brute force are viable attacks against registered accounts.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: BCrypt is used for hashing (a strong control); the deficiency is in the input validation layer before
    hashing.
