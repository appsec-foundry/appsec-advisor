- local_id: container-image-003
  threat_category_id: TH-03
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-312
  title: Cleartext Credential Store Baked into Image (Dockerfile)
  scenario: '`COPY . /app` at Dockerfile line 18 copies the entire build context, including `runtime/legacy-auth.sqlite`,
    into the image filesystem. The SQLite database contains cleartext passwords as noted in KNOWN_SECRETS. Any registry user
    who pulls the image can extract `/app/runtime/legacy-auth.sqlite` via `docker create` + `docker cp` or by mounting the
    image layers and reading the file directly, without running the application. This exposure is permanent: the file is in
    a committed layer and cannot be removed post-build without rebuilding the image. If the registry is public or otherwise
    accessible to attackers, all accounts in the legacy auth store are compromised.'
  attack_steps:
  - An attacker with read access to the container registry pulls the image and runs `docker create <image> --name tmp && docker
    cp tmp:/app/runtime/legacy-auth.sqlite .`.
  - The attacker opens the extracted SQLite file and reads the cleartext passwords for all accounts in the legacy authentication
    store.
  evidence_summary: '`COPY . /app` at Dockerfile:18 copies the entire repo tree, which includes `runtime/legacy-auth.sqlite`
    containing cleartext user passwords, into a permanent image layer.'
  impact_description: All accounts in the legacy auth store are exposed in cleartext to anyone with image pull access.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — no .dockerignore excludes the runtime/ directory.
  mitigation_title: Exclude credential stores from Docker build context via .dockerignore and remove cleartext passwords
  remediation:
    effort: Low
    steps:
    - 'Create or update `.dockerignore` at the repository root to exclude `runtime/`, `*.sqlite`, and any other credential
      or secret files: add lines `runtime/` and `**/*.sqlite`.'
    - Migrate legacy-auth.sqlite passwords to hashed form (Argon2id or bcrypt) in the development seed; never ship plaintext
      passwords in any committed fixture.
    - 'Rebuild the image and verify: `docker create <image> --name tmp && docker cp tmp:/app/runtime/legacy-auth.sqlite .`
      must fail with ''no such file or directory''.'
    - If the image has already been pushed to a registry, revoke access or delete all affected tags and rotate any passwords
      stored in the SQLite file.
    code_example: '# .dockerignore (create at repo root)

      runtime/

      **/*.sqlite

      .env

      *.pem

      *.key'
    verification: After adding .dockerignore, run `docker build -t app-test . && docker create app-test --name check && docker
      cp check:/app/runtime . 2>&1 | grep -i 'no such'` — expect the copy to fail. Also run `docker history --format '{{.CreatedBy}}'
      app-test | grep -i sqlite` and confirm no sqlite file appears in any layer command.
