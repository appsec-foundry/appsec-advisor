    rainbow tables cover common passwords, and a GPU can compute billions of MD5 hashes per second. The DemoDataSeeder stores
    MD5 hashes of all seeded user passwords. An attacker who reads the database (via H2 console or SQL injection) can crack
    all MD5 hashes offline within seconds.
