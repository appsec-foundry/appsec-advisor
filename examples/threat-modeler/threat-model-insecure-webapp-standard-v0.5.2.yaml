security_controls:
- domain: Identity and Authentication Controls
  control: Password-Based Login
  kind: mechanism
  effectiveness: Partial
  assessment: Spring Security form-based login uses BCrypt password hashing (adequate). However, self-registration accepts
    single-character passwords (no strength policy), no rate limiting on /login or /register, no email verification, and hardcoded
    demo seeds (alice/bob/admin with password 'password') are loaded on startup. Legacy authentication paths (unsigned JWT,
    homegrown session, plaintext SQLite) co-exist alongside the secure path and bypass Spring Security entirely.
  linked_threats: []
  rule_id: ARCH-AUTH-001
  subcontrols:
  - title: User Registration
    type: flow
    implementation: POST /register via RegistrationController; BCrypt encodes passwords before persistence to H2 via Spring
      Data JPA. No email verification step.
    assessment: No password strength enforcement; single-character passwords accepted. Demo seeds (alice/bob/admin password='**** (8 chars)')
      loaded on startup represent credential fixtures in production-runnable code.
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/authentication/RegistrationController.java
      lines:
      - 1
      - 50
    relevant_findings: []
  - title: Password-Based Login
    type: flow
    implementation: POST /login via Spring Security UsernamePasswordAuthenticationFilter; UserDetailsService loads from H2;
      BCryptPasswordEncoder verifies. On success, Spring creates JSESSIONID session.
    assessment: Core login is BCrypt-correct. No rate limiting on /login leaves brute-force fully open. No account lockout.
      CredentialLoggingFilter logs cleartext username+password on every POST /login (CWE-312).
    evidence:
    - file: src/main/java/com/example/appsecverificationtarget/config/SecurityConfig.java
      lines:
      - 26
      - 55
    relevant_findings: []
  - title: Password Reset
    type: flow
    implementation: Not implemented. No /forgot-password or password-reset flow detected in any controller.
    assessment: Absent. No out-of-band delivery of reset tokens; no token issuance or expiry. Not directly exploitable but
      leaves account recovery undefined.
    evidence: []
    relevant_findings: []
- domain: Identity and Authentication Controls
  control: Legacy Authentication Paths
  kind: cross-cutting
  effectiveness: Weak
  assessment: 'Three parallel authentication paths bypass Spring Security: (1) LegacyJwtVerifier accepts tokens with alg:none
    — no signature required; (2) HomegrownSessionService treats any Base64-encoded user ID as a valid session token; (3) LegacySqliteUserStore
    compares credentials against a plaintext SQLite database via SQL string concatenation (injection + cleartext exposure).
    These paths are intentionally insecure fixtures but are deployed in the same running application.'
  linked_threats: []
  rule_id: ARCH-AUTH-002
- domain: Identity and Authentication Controls
  control: Authentication Rate Limiting
  kind: primitive
  effectiveness: Missing
  assessment: No rate limiting on /login, /register, or /api/legacy-sqlite/login. Spring Security provides no built-in throttle;
    no Bucket4j, Resilience4j, or filter-level rate limit detected. Brute-force enumeration of credentials is unrestricted.
  linked_threats: []
  rule_id: ARCH-AUTH-003
- domain: Session and Token Controls
  control: Spring Security Session Management
  kind: primitive
  effectiveness: Partial
  assessment: Standard Spring Security HttpSession manages authenticated sessions for the form-login path. JSESSIONID cookie
    is issued on login. Session timeout defaults to Spring default (30 min idle). HttpOnly and Secure cookie flags are NOT
    explicitly set in SecurityConfig; Secure flag is absent on HTTP-only local deployment. Session invalidation on logout
    is handled by Spring Security default logout handler.
  linked_threats: []
  rule_id: ARCH-SESSION-001
- domain: Session and Token Controls
  control: Unsigned JWT Verification
  kind: primitive
  effectiveness: Weak
  assessment: LegacyJwtVerifier (jjwt 0.11.5) does not enforce algorithm constraints. A token with header alg:none and an
    empty signature is accepted as valid. Any user can self-issue a token for any user ID or role without knowing any secret.
    This is an intentional exploit fixture.
  linked_threats: []
  rule_id: ARCH-SESSION-002
- domain: Session and Token Controls
  control: Homegrown Session Token
  kind: primitive
  effectiveness: Missing
  assessment: HomegrownSessionService issues Base64(userId) as a session token with no signature, no HMAC, and no expiry.
    Any attacker can forge a token for any user ID by Base64-encoding the target numeric ID. No integrity mechanism exists.
  linked_threats: []
  rule_id: ARCH-SESSION-003
- domain: Authorization Controls
  control: Role-Based Access Control
  kind: mechanism
  effectiveness: Partial
  assessment: 'Spring Security requestMatchers() defines URL-pattern authorization and @PreAuthorize(''hasRole(ADMIN)'') protects
    admin endpoints. However: /api/admin/report is declared in permitAll() without role guard; /legacy/admin/** is fully open;
    authorization is ad-hoc per-controller rather than centralized policy. Several admin-only management endpoints are accessible
    to any authenticated user.'
  linked_threats: []
  rule_id: ARCH-AUTHZ-001
- domain: Authorization Controls
  control: Object-Level Authorization
  kind: primitive
  effectiveness: Missing
  assessment: BOLA/IDOR checks are absent from OrderAccessController.get() and UserAccessController.get(). GET /api/orders/{id}
    and GET /api/users/{id} return the record for any numeric ID without verifying ownership by the authenticated principal.
    Mass assignment in ProfileController.update() allows setting role/admin fields directly via PUT /api/profile/me.
  linked_threats: []
  rule_id: ARCH-AUTHZ-002
- domain: Query Construction and Data Access Controls
  control: Parameterized Query Enforcement
  kind: primitive
  effectiveness: Partial
  assessment: 'Spring Data JPA repositories in domain.* and clean.* use parameterized method queries (safe). However, inputvalidation.*
    package uses EntityManager.createNativeQuery() with direct string concatenation: OrderLookupDao.findByOwnerEmail() and
    DocumentLookupDao.findByTag() concatenate user-supplied email and tag parameters directly into SQL strings, enabling SQL
    injection. No central enforcement layer prevents raw query construction.'
  linked_threats: []
  rule_id: ARCH-SQL-001
- domain: Input Boundary Validation Controls
  control: Validation Approach
  kind: cross-cutting
  effectiveness: Missing
  assessment: No centralized input validation strategy. Clean module (clean.*) uses @Valid DTOs with Bean Validation constraints.
    All other modules accept raw @RequestParam or path variables with no type, format, or range validation. InputValidation
    package intentionally demonstrates the absence of validation as a fixture.
  linked_threats: []
  rule_id: ARCH-INPUTVAL-001
- domain: Input Boundary Validation Controls
  control: Bean Validation (Spring @Valid)
  kind: primitive
  effectiveness: Partial
  assessment: Bean Validation with @Valid is applied in clean.* only. All vulnerable controller classes accept raw parameters
    without DTOs or constraints. @RequestParam fields in vulnerable paths (email in OrderLookupDao, filename in FileReadController,
    command in ToolController) receive no framework-level validation.
  linked_threats: []
  rule_id: ARCH-INPUTVAL-002
- domain: Output Encoding and Rendering Controls
  control: Thymeleaf HTML Auto-Escaping
  kind: primitive
  effectiveness: Partial
  assessment: Thymeleaf template engine escapes HTML entities by default for th:text expressions, providing XSS protection
    for standard form-data rendering. REST/JSON endpoints (OutputPreviewController, OutputPreviewService) return user-supplied
    content without encoding, but endpoints return text/plain or application/json MIME types — not rendered as HTML. No CSP
    header to restrict inline script execution.
  linked_threats: []
  rule_id: ARCH-OUTPUT-001
- domain: Browser and Cross-Origin Controls
  control: CORS Policy
  kind: cross-cutting
  effectiveness: Missing
  assessment: 'CorsPolicyFilter reflects the request Origin header verbatim back in Access-Control-Allow-Origin after checking
    only that it starts with ''http'' — a meaningless check. Access-Control-Allow-Credentials: true is also set, allowing
    cross-origin requests to include session cookies. Any origin (including attacker-controlled) can make credentialed cross-origin
    requests to any endpoint.'
  linked_threats: []
  rule_id: ARCH-CORS-001
- domain: Browser and Cross-Origin Controls
  control: CSRF Protection
  kind: cross-cutting
  effectiveness: Missing
  assessment: Spring Security CSRF protection is globally disabled via http.csrf(AbstractHttpConfigurer::disable) in SecurityConfig.
    All POST/PUT/DELETE endpoints are fully vulnerable to cross-site request forgery. A homegrown CSRF token at /csrf/settings
    is present but checks only for token presence — not token match — making it trivially bypassable.
  linked_threats: []
  rule_id: ARCH-CSRF-001
- domain: Browser and Cross-Origin Controls
  control: HTTP Security Headers
  kind: cross-cutting
  effectiveness: Missing
  assessment: No Content-Security-Policy, X-Content-Type-Options, Referrer-Policy, or Permissions-Policy headers are set.
    HSTS not configured (HTTP-only deployment). Spring Security default headers may provide X-Frame-Options, but no application-level
    header policy is defined. H2 console uses frameOptions().sameOrigin() which is not a security header configuration.
  linked_threats: []
  rule_id: ARCH-HEADERS-001
- domain: Cryptography Secrets and Data Protection
  control: Password Hashing
  kind: primitive
  effectiveness: Partial
  assessment: BCryptPasswordEncoder is used for the primary Spring Security user store — adequate strength. LegacyPasswordService
    uses MD5 for audit password hashes (CWE-916). LegacySqliteUserStore stores passwords in cleartext in runtime/legacy-auth.sqlite.
    So the main path uses BCrypt but two legacy paths use weak or no hashing.
  linked_threats: []
  rule_id: ARCH-CRYPTO-001
- domain: Cryptography Secrets and Data Protection
  control: Secret Management
  kind: mechanism
  effectiveness: Missing
  assessment: Dockerfile hardcodes DB_PASSWORD, JWT_SIGNING_KEY, AWS_ACCESS_KEY_ID, and AWS_SECRET_ACCESS_KEY as ENV instructions
    — baked into image layers. SignedJwtService uses a hardcoded HS256 key in source. CustomCryptoService uses a hardcoded
    XOR key. No secrets manager, vault integration, or externalized credential injection is present. Committed secrets are
    permanently compromised.
  linked_threats: []
  rule_id: ARCH-CRYPTO-002
- domain: Cryptography Secrets and Data Protection
  control: Symmetric Encryption
  kind: primitive
  effectiveness: Weak
  assessment: LegacyCryptoService uses AES/ECB mode with a hardcoded key — ECB mode is deterministic (no IV), revealing patterns
    in plaintext. CustomCryptoService uses a hand-rolled XOR cipher with a static key, which is trivially reversible with
    known plaintext. No use of authenticated encryption (AES-GCM) detected.
  linked_threats: []
  rule_id: ARCH-CRYPTO-003
- domain: File Parser and Outbound Request Controls
  control: File Upload Validation
  kind: primitive
  effectiveness: Missing
  assessment: OrderManagementController and DocumentManagementController accept file uploads with no file type restriction,
    no magic-byte validation, no filename sanitization, and no size limit. Files are stored with their original names under
    runtime/uploads/ and runtime/documents/.
  linked_threats: []
  rule_id: ARCH-FILE-001
- domain: File Parser and Outbound Request Controls
  control: SSRF Prevention
  kind: primitive
  effectiveness: Missing
  assessment: IntegrationController.fetch() passes a user-supplied URL directly to RestTemplate.getForObject() with no allowlist,
    no scheme validation, and no DNS rebinding protection. Attackers can target internal services (http://localhost:*, cloud
    metadata endpoints, etc.).
  linked_threats: []
  rule_id: ARCH-SSRF-001
- domain: File Parser and Outbound Request Controls
  control: XML Parser Hardening
  kind: primitive
  effectiveness: Missing
  assessment: XmlPreviewController.preview() uses the default Java XML parser with no explicit disabling of external entity
    resolution. XXE exploitation (file disclosure, SSRF via XML) is possible on the POST /api/xml/preview endpoint.
  linked_threats: []
  rule_id: ARCH-FILE-002
- domain: File Parser and Outbound Request Controls
  control: Path Traversal Defense
  kind: primitive
  effectiveness: Missing
  assessment: FileReadController.read() appends a user-supplied filename parameter directly to the runtime/documents/ base
    path with no canonicalization or boundary check. Attackers can read arbitrary files on the server with GET /api/files/read?name=../../pom.xml.
  linked_threats: []
  rule_id: ARCH-FILE-003
- domain: File Parser and Outbound Request Controls
  control: Command Injection Defense
  kind: primitive
  effectiveness: Missing
  assessment: ToolController.lookup() passes a user-supplied name parameter to Runtime.exec() via shell command construction.
    OS command injection is possible with semicolons or other shell metacharacters (GET /api/tools/lookup?name=orders;id).
  linked_threats: []
  rule_id: ARCH-CMD-001
- domain: Operations Runtime and Supply Chain Controls
  control: Audit Logging
  kind: primitive
  effectiveness: Weak
  assessment: CredentialLoggingFilter logs cleartext username and password on every POST /login — a severe information disclosure.
    Spring Actuator /actuator/loggers is exposed unauthenticated, providing log-level control to attackers. No structured
    security event log for authentication attempts, access control failures, or privilege escalation events.
  linked_threats: []
  rule_id: ARCH-OPS-001
- domain: Operations Runtime and Supply Chain Controls
  control: Container Image Hardening
  kind: primitive
  effectiveness: Weak
  assessment: Dockerfile runs application as root (no USER directive). Base image openjdk:17-slim is unpinned (mutable tag,
    no digest). chmod -R 777 makes /app and /app/runtime world-writable. COPY . /app bakes runtime/legacy-auth.sqlite (cleartext
    credentials) into the image. Remote script piped directly into bash during build (curl ... | bash). Actuator port exposed
    at 8080 without authentication.
  linked_threats: []
  rule_id: ARCH-OPS-002
- domain: Operations Runtime and Supply Chain Controls
  control: Dependency Version Management
  kind: lifecycle
  effectiveness: Missing
  assessment: No Dependabot or Renovate configuration. No CI/CD pipeline. Maven pom.xml specifies dependency versions with
    no lockfile equivalent. Transitive dependencies are resolved at build time against Maven Central without integrity verification.
    No SCA tool in any pipeline.
  linked_threats: []
  rule_id: ARCH-SUPPLY-001
- domain: Operations Runtime and Supply Chain Controls
  control: CVE Scanning
  kind: lifecycle
  effectiveness: Missing
  assessment: No CI/CD pipeline exists, so no automated CVE scanning is possible. No Trivy, Snyk, OWASP Dependency-Check,
    or equivalent tool is configured anywhere. jjwt 0.11.5 is a known-vulnerable version (CVE for alg:none acceptance). No
    mechanism to detect or block known-vulnerable dependencies.
  linked_threats: []
  rule_id: ARCH-SUPPLY-002
- domain: Real-time and Not Applicable Controls
  control: WebSocket / Real-time Channel
  kind: not_applicable
  effectiveness: Adequate
  assessment: No WebSocket, Socket.IO, or Server-Sent Events detected. All communication is HTTP request/response only. Real-time
    channel security controls are not applicable to this application.
  linked_threats: []
  rule_id: ARCH-RT-001
- domain: Real-time and Not Applicable Controls
  control: AI / LLM Integration Controls
  kind: not_applicable
  effectiveness: Adequate
  assessment: No LLM API calls, vector databases, or AI model integrations detected in application code. IDE configuration
    files (.claude/settings.json, AGENTS.md, .mcp.json) are developer tooling only and do not affect application security
    posture.
  linked_threats: []
  rule_id: ARCH-AI-001
- domain: Operations Runtime and Supply Chain Controls
  control: Automated SCA scanning
  effectiveness: Missing
  kind: lifecycle
  assessment: Automated SCA scanning not detected in the repository. Patch-management posture depends on this control being
