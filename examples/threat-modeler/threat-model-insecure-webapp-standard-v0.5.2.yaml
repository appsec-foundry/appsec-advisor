  cwe: CWE-200
  title: Unauthenticated GET /api/legacy-sqlite/users Returns All Plaintext Passwords
  scenario: 'GET /api/legacy-sqlite/users at LegacySqliteAuthController.java:49 calls findAll() and serializes every row in
    legacy_users into a JSON array. The LegacyUserResponse record at line 65 includes the password field directly in the response
    body. No authentication, authorization check, or session requirement exists on this endpoint.


    Any unauthenticated caller can retrieve the complete credential set — usernames, plaintext passwords, and roles — in a
    single HTTP request. Combined with the plaintext storage finding, this endpoint is a direct credential dump API accessible
    without any prior authentication.'
  attack_steps:
  - An attacker sends GET /api/legacy-sqlite/users with no credentials or session token.
  - The endpoint returns a JSON array containing every account's id, username, plaintext password, and role, allowing the
    attacker to collect all credentials in one request.
  evidence_summary: LegacyUserResponse (line 65) includes the password field, and the /users endpoint calls findAll() with
    no authentication guard in scope.
  impact_description: Complete credential dump of all legacy users including legacy_admin — every username, plaintext password,
    and role — exposed to any unauthenticated caller.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None
  mitigation_title: Remove or authenticate GET /api/legacy-sqlite/users and strip password from the response schema
  remediation:
    effort: Low
    steps:
    - Remove the password field from LegacyUserResponse (or create a separate DTO that excludes it) so credentials are never
      serialized into API responses.
    - Restrict GET /api/legacy-sqlite/users to authenticated admin sessions using Spring Security's @PreAuthorize("hasRole('ADMIN')")
      or remove the endpoint entirely if no operational use case exists.
    - Verify with an unauthenticated curl request that the endpoint returns HTTP 401 or 403 after the fix.
    code_example: "// Before (LegacySqliteAuthController.java:65) — exposes password:\nrecord LegacyUserResponse(Long id,\
      \ String username, String password, String role) { ... }\n\n// After — password excluded from public DTO:\nrecord LegacyUserResponse(Long\
      \ id, String username, String role) {\n    public static LegacyUserResponse from(LegacySqliteUser user) {\n        return\
      \ new LegacyUserResponse(user.id(), user.username(), user.role());\n    }\n}"
    verification: Send GET /api/legacy-sqlite/users without authentication and confirm HTTP 401/403. Confirm the response
      body no longer contains any 'password' field even for authenticated admin callers.
    reference: CWE-200
