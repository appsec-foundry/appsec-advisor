    method at line 31-44 is a separate route /{id}/owned that users are not forced to use.
  impact_description: Any authenticated user can read all orders in the system by iterating numeric IDs, breaking user data
    isolation.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: The /{id}/owned route performs an ownership check, but the /{id} route does not; callers default to the
    unchecked route.
  mitigation_title: Add ownership check to OrderAccessController.get() or remove the unchecked route
  remediation:
    effort: Low
    steps:
    - 'Merge the ownership logic from getOwned() into get(): check `order.getOwner().getUsername().equals(authentication.getName())
      || isAdmin` before returning the order.'
    - Deprecate the /{id}/owned route and redirect to the secured /{id} route.
    - Add `Authentication authentication` parameter to the get() method signature.
    code_example: "// In OrderAccessController.get():\n@GetMapping(\"/{id}\")\npublic ResponseEntity<OrderSummary> get(@PathVariable\
      \ Long id, Authentication auth) {\n    return customerOrderRepository.findById(id)\n        .map(order -> {\n      \
      \      boolean owner = order.getOwner().getUsername().equals(auth.getName());\n            boolean admin = auth.getAuthorities().stream()\n\
      \                .anyMatch(a -> \"ROLE_ADMIN\".equals(a.getAuthority()));\n            if (!owner && !admin) return\
      \ ResponseEntity.status(HttpStatus.FORBIDDEN).<OrderSummary>build();\n            return ResponseEntity.ok(OrderSummary.from(order));\n\
      \        })\n        .orElseGet(() -> ResponseEntity.notFound().build());\n}"
    verification: Authenticate as alice, then request GET /api/orders/102 (bob's order ID); confirm HTTP 403 is returned.
