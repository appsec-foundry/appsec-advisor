- local_id: spring-app-008
  threat_category_id: TH-01
  stride: Tampering
  cwe: CWE-78
  title: OS Command Injection via Name Parameter (ToolController.lookup)
  scenario: ToolController.lookup() passes the caller-supplied name parameter directly to `Runtime.getRuntime().exec(new String[]{"sh","-c","echo
    Result for " + name})`. The shell -c invocation interprets shell metacharacters. The endpoint GET /api/tools/lookup is
    listed as permitAll() in SecurityConfig:37 so no authentication is required. An attacker sends name=x;cat /etc/passwd
    to execute arbitrary OS commands as the application process user.
  attack_steps:
  - An unauthenticated attacker sends GET /api/tools/lookup?name=x;id to the public endpoint.
  - ToolController:18 constructs `{"sh","-c","echo Result for x;id"}` and passes it to Runtime.exec().
  - The shell interprets the semicolon as a command separator and executes both `echo Result for x` and `id`, returning the
    UID/GID in the `output` field.
  - The attacker escalates to `cat /proc/self/environ` or a reverse shell to fully compromise the server.
  evidence_summary: ToolController:18 passes `"echo Result for " + name` as the shell argument to `sh -c` via Runtime.exec()
    without any input sanitization.
  impact_description: Unauthenticated full OS command execution as the JVM process user, enabling complete server compromise.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — no authentication, no input sanitization, no allowlist.
  mitigation_title: Eliminate shell invocation in ToolController.lookup and validate input against an explicit allowlist
  remediation:
    effort: Low
    steps:
    - 'Replace the sh -c invocation with a fixed command and pass name as a separate argument so the shell never interprets
      it: `new String[]{"echo", "Result for", name}` — shell metacharacters are not interpreted when exec() receives a pre-split
      argument array without a shell.'
    - Validate name against an allowlist of expected tokens (alphanumeric + dash/underscore only) before any processing.
    - If the endpoint has no legitimate production purpose, remove it entirely.
    code_example: '// Before (vulnerable):

      new String[]{"sh", "-c", "echo Result for " + name}


      // After (safe — no shell interpolation):

      if (!name.matches("[A-Za-z0-9_\\-]{1,64}")) throw new ResponseStatusException(HttpStatus.BAD_REQUEST);

      new String[]{"echo", "Result for", name}'
    verification: Send GET /api/tools/lookup?name=x%3Bid; confirm the response `output` field contains only 'Result for x;id'
      literally and does not execute the id command.
