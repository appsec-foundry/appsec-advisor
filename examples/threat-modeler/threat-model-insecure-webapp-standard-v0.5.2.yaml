- local_id: spring-app-020
  threat_category_id: TH-06
  stride: Information Disclosure
  cwe: CWE-862
  title: H2 Web Console Exposed Without Authentication Allowing Full Database Access
  scenario: 'SecurityConfig:32 lists `/h2-console/**` as permitAll() while application.yml has `spring.h2.console.enabled:
    true`. The H2 web console at /h2-console is a full SQL IDE that accepts arbitrary SQL against the in-memory database.
    An unauthenticated attacker connects to `jdbc:h2:mem:appsec_verification_target` using the default H2 credentials (username:
    sa, blank password) and executes arbitrary SQL to read all tables (app_users, customer_orders, documents, vault_credentials)
    or write/delete data.'
  attack_steps:
  - An unauthenticated attacker navigates to /h2-console and enters the JDBC URL `jdbc:h2:mem:appsec_verification_target`
    with username=sa and a blank password.
  - The H2 console connects to the application's in-memory database.
  - The attacker executes `SELECT * FROM app_users` to obtain all usernames, emails, roles, admin flags, and BCrypt password
    hashes.
  - The attacker executes `UPDATE app_users SET admin=true WHERE username='attacker'` to grant themselves admin privileges.
  evidence_summary: 'SecurityConfig:32 has `.requestMatchers("/h2-console/**").permitAll()`; application.yml:11 sets `spring.h2.console.enabled:
    true`.'
  impact_description: Full unauthenticated read/write access to the application database, including credential extraction,
    privilege escalation, and data destruction.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: SecurityConfig:29 sets `headers.frameOptions(sameOrigin)` which prevents iframe embedding of the console
    but does not restrict direct browser access.
  mitigation_title: Disable the H2 console in production or restrict it behind ADMIN authentication
  remediation:
    effort: Low
    steps:
    - 'Set `spring.h2.console.enabled: false` in any non-development configuration file.'
    - 'Gate the H2 console behind `hasRole("ADMIN")` if it must be accessible in development: `.requestMatchers("/h2-console/**").hasRole("ADMIN")`.'
    - 'Use Spring profiles to enable the console only in dev: `@ConditionalOnProperty("spring.h2.console.enabled")`.'
    code_example: null
    verification: Navigate to /h2-console without authentication; confirm HTTP 401/403 is returned.
    reference: CWE-862
