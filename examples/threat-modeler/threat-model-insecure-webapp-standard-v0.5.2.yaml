assets:
- id: A-001
  name: User Credentials (H2 Database)
  classification: Restricted
  description: Bcrypt-hashed passwords and usernames stored in the H2 in-memory database. Targeted by SQL injection attacks
    via email/tag parameters and the H2 console. Recreated from seed data on startup.
  linked_threats: []
  evidence_flags: []
- id: A-002
  name: Legacy Plaintext Credentials (SQLite)
  classification: Restricted
  description: Cleartext usernames and passwords stored in runtime/legacy-auth.sqlite. No hashing applied; directly compromised
    via SQL injection or direct file read. Baked into Docker image layers via COPY.
  linked_threats: []
  evidence_flags:
  - inferred_classification
- id: A-003
  name: JWT Signing Key
  classification: Restricted
  description: HS256 signing key hardcoded in SignedJwtService and exposed as Dockerfile ENV JWT_SIGNING_KEY. Compromise allows
    arbitrary JWT forgery and session impersonation for any user or role.
  linked_threats: []
  evidence_flags: []
- id: A-004
  name: Application Session Tokens
  classification: Confidential
  description: JSESSIONID session cookies issued by Spring Security. No explicit Secure or HttpOnly flags set in code; CSRF
    disabled globally, enabling cross-site session theft via the reflected CORS policy.
  linked_threats: []
  evidence_flags: []
- id: A-005
  name: User Orders and Documents
  classification: Confidential
  description: Order records (amounts, status, owner) and document records (content, metadata) stored in H2. Accessible cross-user
    via BOLA/IDOR vulnerabilities on /api/orders/{id} and /api/documents/{id}.
  linked_threats: []
  evidence_flags: []
- id: A-006
  name: Environment Secrets (Actuator Exposure)
  classification: Restricted
  description: All environment variables including AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, DB_PASSWORD, and JWT_SIGNING_KEY
    exposed unauthenticated at /actuator/env. Any attacker with network access can retrieve full environment configuration.
  linked_threats: []
  evidence_flags: []
- id: A-007
  name: Uploaded Files and Documents
  classification: Internal
  description: User-uploaded binary files and documents stored under runtime/uploads/ and runtime/documents/. No file type
    validation; accessible beyond intended paths via path traversal on /api/files/read.
  linked_threats: []
  evidence_flags: []
- id: A-008
  name: Application Configuration and Source Code
  classification: Internal
  description: Spring application configuration (application.yml), Terraform IaC, and compiled artifacts. Exposed via H2 console,
    actuator/configprops endpoint, and baked into Docker image layers via COPY.
  linked_threats: []
  evidence_flags: []
