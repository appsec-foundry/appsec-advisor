  title: Unrestricted File Upload with No MIME Type or Extension Validation
  scenario: BusinessFileStorage.store() uses `file.getOriginalFilename()` directly (line 17) to name the stored file without
    any content-type validation, file extension allowlist, or path sanitization. An attacker uploads a file named `../../webapp/malicious.jsp`
    to the POST /documents or POST /orders endpoint. The `directory.resolve(fileName)` call at line 23 uses Path.resolve(),
    which on Unix normalizes relative traversal but does not block `../` in the originalFilename if it is treated as a simple
    filename component. Additionally, uploading a server-side script file (e.g., .jsp, .jspx) to the upload directory could
    be served if the directory is web-accessible.
  evidence_summary: BusinessFileStorage:17 extracts `file.getOriginalFilename()` with no sanitization; line 23 calls `directory.resolve(fileName)`
    allowing relative path segments in the filename.
  impact_description: An authenticated attacker can upload a server-side script or overwrite files outside the intended upload
    directory, potentially achieving remote code execution.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Uploads require authentication (covered by anyRequest().authenticated()); no type or extension check
    is in place.
  mitigation_title: Validate file type and sanitize filename in BusinessFileStorage.store
  remediation:
    effort: Medium
    steps:
    - Extract only the filename component using `Path.of(fileName).getFileName().toString()` to strip any directory traversal.
    - Maintain an allowlist of permitted MIME types (e.g., PDF, PNG, JPEG, TXT) and reject uploads whose Content-Type does
      not match.
    - Use Apache Tika for server-side content-type verification independent of the client-supplied MIME type.
    - Generate a random UUID filename for storage and store the original filename only in the database record, not on disk.
    code_example: '// Sanitize filename:

      String rawName = file.getOriginalFilename();

      String safeFileName = Path.of(rawName != null ? rawName : "upload").getFileName().toString();

      // Validate type:

      Set<String> ALLOWED_TYPES = Set.of("application/pdf", "image/png", "text/plain");

      if (!ALLOWED_TYPES.contains(file.getContentType())) throw new ResponseStatusException(HttpStatus.BAD_REQUEST);'
    verification: Upload a file named `../../test.jsp` with Content-Type text/html; confirm the file is rejected or stored
      with a sanitized name inside the upload directory only.
    reference: CWE-434
