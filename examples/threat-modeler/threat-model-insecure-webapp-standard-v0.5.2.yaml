  threat_category_id: TH-17
  stride: Information Disclosure
  cwe: CWE-200
  title: Spring Actuator Fully Exposed with show-values:ALWAYS and No Authentication
  scenario: 'application.yml configures `management.endpoints.web.exposure.include: "*"` (exposing all actuator endpoints)
