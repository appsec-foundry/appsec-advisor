- local_id: spring-app-001
  threat_category_id: TH-02
  stride: Spoofing
  cwe: CWE-347
  title: Unsigned JWT Accepted by LegacyJwtVerifier (algorithm none)
  scenario: LegacyJwtVerifier.readClaims() calls Jwts.parserBuilder().build().parseClaimsJwt(token) with no signing key configured.
    JJWT 0.11.5 with this configuration accepts unsigned tokens (alg:none). An attacker calls GET /api/legacy-admin/audit?token=<crafted_token>
    supplying a JWT with header {"alg":"none"} and payload {"role":"ADMIN","sub":"attacker"}, which the verifier parses without
    signature verification. The audit endpoint then grants admin access based solely on the unauthenticated role claim.
  attack_steps:
  - An attacker crafts a JWT with header `{"alg":"none"}` and body `{"sub":"attacker","role":"ADMIN"}`, Base64URL-encoding
    both parts and joining with dots (no signature).
  - The attacker sends GET /api/legacy-admin/audit?token=<crafted_token>; LegacyJwtVerifier:15 calls parseClaimsJwt which
    accepts the unsigned token.
  - The verifier returns claims including role=ADMIN; LegacyAdminAuditController:41 checks only the role claim and returns
    the full user list, order count, and document count.
  evidence_summary: LegacyJwtVerifier:15 builds a JJWT parser via parserBuilder().build() with no setSigningKey() call, then
    calls parseClaimsJwt() which accepts alg:none tokens.
  impact_description: Any unauthenticated caller obtains the full application user list with emails, roles, and admin flags
    by forging a JWT with role=ADMIN.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None — LegacyJwtVerifier performs no signature verification.
  mitigation_title: Reject unsigned JWTs by configuring a mandatory signing key in LegacyJwtVerifier
  remediation:
    effort: Low
    steps:
    - Inject the signing key and call parserBuilder().setSigningKey(key).build().parseClaimsJws(token) instead of parseClaimsJwt(),
      which requires a valid signature.
    - Replace the legacy JWT endpoint with the existing /api/secure-jwt/** path that uses SignedJwtService with a proper RS256/HS256
      key.
    - If the legacy endpoint must remain, enforce a mandatory algorithm allowlist via .requireAlgorithm(SignatureAlgorithm.HS256)
      before parsing.
    code_example: "// Before:\nJwts.parserBuilder().build().parseClaimsJwt(token);\n\n// After:\nJwts.parserBuilder()\n  \
      \  .setSigningKey(signingKey)      // mandatory — rejects alg:none\n    .build()\n    .parseClaimsJws(token);      \
      \   // Jws not Jwt — signature required"
    verification: Send GET /api/legacy-admin/audit?token=eyJhbGciOiJub25lIn0.eyJyb2xlIjoiQURNSU4ifQ. and confirm HTTP 401/500
      is returned; a valid signed token must succeed.
    reference: CWE-347
  evidence:
  - file: src/main/java/com/example/appsecverificationtarget/authentication/LegacyJwtVerifier.java
    line: 15
  boundary_refs:
