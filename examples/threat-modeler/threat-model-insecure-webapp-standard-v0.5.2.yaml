- local_id: container-image-002
  threat_category_id: TH-14
  additional_categories: []
  stride: Tampering
  cwe: CWE-829
  title: Remote Script Pipe Without Integrity Verification (Dockerfile)
  scenario: 'Dockerfile line 21 executes `curl -sfL https://example.com/install-agent.sh | bash` during image build. The script
    is fetched over HTTPS but its integrity is never verified: there is no checksum comparison, no signature check, and no
    pinned URL (the path is a mutable route). An attacker who compromises the example.com server, who can perform a DNS hijack,
    or who can intercept TLS termination (e.g. via a MITM on the build runner''s network) can deliver an arbitrary shell script
    that executes as root inside the build container. The malicious script runs before the application is packaged, so it
    can install a backdoor into the final JAR, add a cron job, exfiltrate the secrets already present in ENV, or replace the
    build toolchain. Every image built from this Dockerfile inherits whatever the script installed.'
  attack_steps:
  - An attacker who controls example.com or can MITM the build runner's HTTPS connection substitutes a malicious `install-agent.sh`
    payload.
  - The Docker build executes `curl -sfL https://example.com/install-agent.sh | bash` as root and the script runs without
    any checksum or signature check.
  - The attacker's script installs a backdoor in `/app`, exfiltrates the ENV secrets, or patches the JAR artifact before `mvn
    package` assembles it.
  evidence_summary: Dockerfile line 21 pipes a remote shell script directly into `bash` with no checksum or signature verification,
    executing arbitrary content from an external server during the build.
  impact_description: A compromised or substituted install script executes as root at build time, backdooring every image
    produced from this Dockerfile.
  likelihood: Medium
  impact: Critical
  risk: High
  controls_in_place: HTTPS fetch (curl -sfL) — provides confidentiality in transit but no authenticity guarantee without checksum
    or signature verification.
  mitigation_title: Replace remote script pipe with a pinned, integrity-verified installation method
  remediation:
    effort: Medium
    steps:
    - 'Remove the `curl | bash` line. Download the script to a named file, verify its SHA-256 checksum against a value pinned
      in the Dockerfile, then execute it: `curl -sfL https://example.com/install-agent.sh -o /tmp/install-agent.sh && echo
      ''<sha256>  /tmp/install-agent.sh'' | sha256sum -c - && bash /tmp/install-agent.sh`.'
    - If the agent is distributed as a signed package, use `dpkg --verify` or GPG signature verification against a pinned
      public key rather than a raw script.
    - Consider vendoring the agent binary into the repository or a private registry so the build never makes an outbound network
      call to an uncontrolled host.
    - In CI, run the build in a network-restricted environment that blocks outbound HTTPS to non-whitelisted hosts.
    code_example: "# Before:\nRUN curl -sfL https://example.com/install-agent.sh | bash\n\n# After — download, verify, execute:\n\
      RUN curl -sfL https://example.com/install-agent.sh -o /tmp/install-agent.sh \\\n    && echo 'EXPECTED_SHA256_HERE  /tmp/install-agent.sh'\
      \ | sha256sum -c - \\\n    && bash /tmp/install-agent.sh \\\n    && rm /tmp/install-agent.sh"
    verification: Build the image in a network-isolated environment (Docker `--network none` for the RUN step or firewall
      rules) and confirm the build fails with a network error, proving the external dependency is eliminated. When vendored,
      confirm the build succeeds without any outbound connection.
    reference: CWE-829
  evidence:
  - file: Dockerfile
    line: 21
  boundary_refs:
  - boundary_id: tb-2
    origin_component_id: container-image
    rationale: The curl|bash step fetches and executes a script from an external host without authentication or integrity
      verification, violating the boundary assumption that installation scripts are fetched only f.
    leg: authentication
    evidence_locations:
    - file: Dockerfile
      line: 21
  evidence_check: verified
  controls_absent_evidence: []
  prior_finding_ref: null
  architectural_violation: false
  component_name: Docker Container Image
