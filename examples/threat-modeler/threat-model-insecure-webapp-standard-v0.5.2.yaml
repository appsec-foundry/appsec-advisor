  title: Legacy Admin Board Fully Open Without Authentication
  scenario: SecurityConfig:41 lists `/legacy/admin/**` as permitAll(). LegacyAdminBoardController.promote() at line 29 sets
    `user.setAdmin(true)` and `user.setRole("ADMIN")` and LegacyAdminBoardController.delete() at line 33 deletes any user
    account. Both operations are exposed via unauthenticated POST requests. An unauthenticated attacker navigates to /legacy/admin,
    views the full user list, and promotes any account (including a newly registered attacker-controlled account) to ADMIN
    without any credential check.
  attack_steps:
  - An unauthenticated attacker navigates to GET /legacy/admin, which is served without authentication due to SecurityConfig:41.
  - LegacyAdminBoardController:23 renders the full user list including all user IDs.
  - The attacker sends POST /legacy/admin/users/100/promote; LegacyAdminBoardController:29 sets the target user's admin=true
    and role=ADMIN and saves the change.
  - The promoted account now has ROLE_ADMIN access to all @PreAuthorize-gated endpoints and the full admin board, completing
    a full privilege escalation without authentication.
  evidence_summary: SecurityConfig:41 has `.requestMatchers("/legacy/admin", "/legacy/admin/**").permitAll()`; LegacyAdminBoardController:29
    promotes and :33 deletes users with no principal check.
  impact_description: Any unauthenticated user can promote any account to ADMIN or delete any user account, achieving complete
    administrative takeover.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None — no authentication or authorization check on any legacy admin operation.
  mitigation_title: Restrict /legacy/admin/** to ROLE_ADMIN authenticated users in SecurityConfig
  remediation:
    effort: Low
    steps:
    - Remove `/legacy/admin` and `/legacy/admin/**` from the permitAll() list.
    - Add `.requestMatchers("/legacy/admin/**").hasRole("ADMIN")` before the anyRequest().authenticated() catch-all.
    - Add @PreAuthorize("hasRole('ADMIN')") to both promote() and delete() methods as defense in depth.
    - Consider removing the legacy admin board entirely if AdminUserController provides equivalent functionality with proper
      authorization.
