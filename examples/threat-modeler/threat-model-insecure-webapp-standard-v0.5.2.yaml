  - Verify by running `docker run --rm <image> whoami` and confirming the output is `appuser`, not `root`.
  code_example: "# Add before ENTRYPOINT:\nRUN groupadd -r appuser && useradd -r -g appuser appuser \\\n    && chown -R appuser:appuser\
    \ /app \\\n    && chmod -R 750 /app \\\n    && chmod 770 /app/runtime\n\nUSER appuser\n\nENTRYPOINT [\"java\", \"-jar\"\
    , \"/app/target/appsec-verification-target-0.0.1-SNAPSHOT.jar\"]"
  verification: Run `docker run --rm <image> id` and confirm UID is non-zero. Attempt to write to /app/target from within
    the container as appuser and confirm permission denied.
  reference: CWE-250
