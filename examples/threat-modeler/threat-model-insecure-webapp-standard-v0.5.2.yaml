- id: file-storage
  name: Local Filesystem Storage
  description: Local filesystem directories (runtime/uploads/ and runtime/documents/) used for user document and file uploads.
    Accessible via the path-traversal-vulnerable /api/files/read endpoint and arbitrary file upload endpoints without type
    validation.
  paths:
  - runtime/uploads/
  - runtime/documents/
  - src/main/java/com/example/insecure/fileread/**
  tier: data
  complexity: simple
  framework: null
  deployment_zones:
