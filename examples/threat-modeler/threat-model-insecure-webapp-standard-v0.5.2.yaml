  title: Path Traversal via Name Parameter in FileReadController.read
  scenario: FileReadController.read() constructs a file path as `Path.of("runtime/documents/" + name)` without calling `.normalize()`
    or `.toRealPath()` to canonicalize the result. GET /api/files/read is listed as permitAll() in SecurityConfig:37. An attacker
    sends ?name=../../application.yml or ?name=../../etc/passwd to read any file accessible to the JVM process, including
    application configuration containing the integration-token and H2 connection details.
  attack_steps:
  - An unauthenticated attacker sends GET /api/files/read?name=../../../etc/passwd
  - FileReadController:19 constructs `Path.of("runtime/documents/../../../etc/passwd")` without normalization.
