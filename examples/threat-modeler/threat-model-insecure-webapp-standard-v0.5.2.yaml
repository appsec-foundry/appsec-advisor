    log store — obtains plaintext credentials for every login attempt, including successful ones.
  evidence_summary: CredentialLoggingFilter:25 passes the request parameter `password` directly into the SLF4J log call at
    INFO level.
  impact_description: All user credentials submitted to the login form are permanently stored in plaintext in application
    logs, enabling offline credential harvest from any log storage system.
