attack_surface:
- entry_point: GET/POST /login.php
  protocol: HTTP
  auth_requ**** (8 chars): false
  notes: Primary authentication endpoint. Password validated against MD5 hashes in MariaDB. CSRF token checked only on 'impossible'
    level. Session fixation possible at low/medium/high levels.
- entry_point: GET/POST /setup.php
  protocol: HTTP
  auth_requ**** (8 chars): false
  notes: Database initialization endpoint. Accessible without authentication; allows resetting the entire database including
    user accounts.
- entry_point: GET /index.php
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: Main landing page after authentication. Redirects unauthenticated users to login.php.
- entry_point: GET/POST /vulnerabilities/sqli/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: SQL injection training module. At low/medium levels uses string interpolation into raw MySQLi queries. GET parameter
    'id' is the injection point.
- entry_point: GET/POST /vulnerabilities/sqli_blind/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: Blind SQL injection training module. Boolean-based and time-based injection via the 'id' GET parameter.
- entry_point: GET/POST /vulnerabilities/exec/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: OS command injection module. Input passed to shell_exec/system/passthru at low/medium levels. POST parameter 'ip'
    is the injection point.
- entry_point: GET /vulnerabilities/fi/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: File inclusion module (LFI/RFI). GET parameter 'page' controls file included via include(). Allows arbitrary local
    file read at low/medium levels.
- entry_point: GET/POST /vulnerabilities/upload/
  protocol: HTTP (multipart/form-data)
  auth_requ**** (8 chars): true
  notes: File upload module. At low level, any file type is accepted including PHP. Files stored in hackable/uploads/. Allows
    webshell upload at low level.
- entry_point: GET/POST /vulnerabilities/xss_r/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: Reflected XSS module. GET parameter 'name' is reflected into HTML response without encoding at low/medium levels.
- entry_point: GET/POST /vulnerabilities/xss_s/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: Stored XSS module. POST parameters 'txtName' and 'mtxMessage' are stored in DB and reflected to all users without
    HTML encoding at low/medium levels.
- entry_point: GET /vulnerabilities/xss_d/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: DOM-based XSS module. URL fragment manipulated by JavaScript to inject DOM content without server-side processing.
- entry_point: GET/POST /vulnerabilities/csrf/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: CSRF vulnerability module. Password change form without anti-CSRF token at low/medium levels, allowing cross-site
    state-change attacks.
- entry_point: GET/POST /vulnerabilities/captcha/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: Insecure CAPTCHA module using Google reCAPTCHA. Password change endpoint validates CAPTCHA client-side at low level,
    bypassing server verification.
- entry_point: GET/POST /vulnerabilities/authbypass/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: Authentication bypass module. Demonstrates client-side authentication bypass via manipulated JavaScript. POST to
    /vulnerabilities/authbypass/token.php without proper server-side validation.
- entry_point: GET /vulnerabilities/bac/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: Broken access control module. Demonstrates horizontal privilege escalation via IDOR vulnerabilities.
- entry_point: GET/POST /vulnerabilities/csp/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: Content Security Policy training module. Demonstrates CSP bypass techniques. CSP headers set at varying restrictiveness
    by difficulty level.
- entry_point: GET/POST /vulnerabilities/open_redirect/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: Open redirect module. GET parameter 'redirect' controls redirect destination without URL validation at low/medium
    levels.
- entry_point: POST /vulnerabilities/api/v1/user/login
  protocol: HTTP (JSON)
  auth_requ**** (8 chars): false
  notes: REST API OAuth2 token endpoint. Issues access tokens using client_credentials flow. No rate limiting at low security
    level.
- entry_point: GET /vulnerabilities/api/v1/user/{id}
  protocol: HTTP (JSON)
  auth_requ**** (8 chars): false
  notes: REST API user lookup endpoint. IDOR vulnerability at low level allows accessing other users' data without authentication.
- entry_point: GET /vulnerabilities/api/help/
  protocol: HTTP
  auth_requ**** (8 chars): false
  notes: Swagger UI documentation endpoint. Publishes full API specification including request/response schemas. No authentication
    requ**** (8 chars); exposes all API endpoints and their parameters.
- entry_point: GET /vulnerabilities/api/openapi.yaml
  protocol: HTTP
  auth_requ**** (8 chars): false
  notes: OpenAPI specification file served without authentication. Allows external tools to import and auto-discover all API
    attack surfaces.
- entry_point: GET /vulnerabilities/weak_id/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: Weak session ID generation module. Demonstrates predictable ID patterns including sequential IDs and MD5-hashed timestamps.
- entry_point: GET/POST /vulnerabilities/javascript/
  protocol: HTTP
  auth_requ**** (8 chars): true
  notes: JavaScript security module. Client-side validation bypass demonstration. POST parameter 'token' generated client-side
    with predictable algorithm.
trust_boundaries:
- name: 'External → Web Application: dvwaPageStartup() session check'
  kind: network
  assumption: Every route requiring authentication calls dvwaPageStartup(['authenticated']) before processing user input.
  evidence:
  - file: login.php
    line: 1
  - file: dvwa/includes/dvwaPage.inc.php
    line: 132
  - file: vulnerabilities/api/public/index.php
    line: 1
  - file: vulnerabilities/api/src/LoginController.php
    line: 74
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: web-application
  enforcement_point: dvwaPageStartup() authenticated session check
  assumption_legs:
  - leg: validation
    condition: Every user-supplied parameter is validated for type and range before reaching business logic.
  - leg: authentication
    condition: Every route requiring a session calls dvwaPageStartup(['authenticated']) before processing, and login enforces
      the CSRF token check.
  - leg: authorization
    condition: Every action is bound to the authenticated user's role and configured security level before execution.
  surface: network
  transition: []
  covers_components:
  - rest-api
  - web-application
  id: tb-1
  assumption_verdict: refuted
- name: Web Application → Database
  kind: network
  assumption: Every query carrying user-controlled input reaches the database through parameterized binding rather than string
    interpolation.
  evidence:
  - file: login.php
    line: 39
  - file: dvwa/includes/dvwaPage.inc.php
    line: 45
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: web-application
  to: database
  assumption_legs:
  - leg: data-interpretation
    condition: Every query carrying user-controlled input reaches the database through parameterized binding rather than string
      interpolation.
  covers_components:
  - database
  - web-application
  surface: network
  transition: []
  id: tb-3
  assumption_verdict: refuted
- name: 'External → CI/CD Pipeline: GitHub push permissions'
  kind: build
  assumption: Only GitHub-authenticated identities with write access to master can push commits that trigger the build workflow.
  evidence:
  - file: .github/workflows/docker-image.yml
    line: 1
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: external
  to: ci-cd-pipeline
  enforcement_point: GitHub repository push permissions
  assumption_legs:
  - leg: validation
    condition: Workflow definition files are read only from the protected master branch, not from untrusted PR or fork sources.
  - leg: authentication
    condition: Only GitHub-authenticated identities can push to the repository and trigger a workflow run.
  - leg: authorization
    condition: Branch protection rules restrict which identities may push to master and thereby trigger the Docker image build.
  surface: build-pipeline
  transition:
  - operator
