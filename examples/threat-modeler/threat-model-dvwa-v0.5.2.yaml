- local_id: rest-api-010
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-862
  affected_parameter: level
  title: Unauthenticated User Privilege Level Manipulation (UserController.php:225)
  scenario: 'The updateUser() method in UserController.php (line 208) accepts a PUT request carrying a JSON body with a ''level''
    field and directly sets the user''s level to the supplied integer value without any authentication, authorization, or
    ownership check. An unauthenticated attacker can issue PUT /api/v2/user/1 with body {"level": 1} to elevate user 1 from
    level 0 to level 1 (admin), or can issue PUT /api/v2/user/2 to change any other user''s privileges. The addUser() method
    at line 154 similarly accepts a caller-supplied ''level'' field when creating new users, allowing an anonymous attacker
    to create arbitrary admin accounts. Combined with the publicly known credentials (rest-api-002), this collapses the entire
    authorization model.'
  evidence_summary: UserController.php:225 assigns $input['level'] directly to $this->data[$id]->level with no prior authentication
    check or role boundary enforcement.
  impact_description: An unauthenticated attacker can escalate any user to admin level or create new admin-level accounts
    without any credentials.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None. The level field is validated as numeric (intval) but not bounded to allowed values and not gated
    behind authentication.
  mitigation_title: Require authentication and enforce caller-role authorization before accepting level-field changes in UserController
  remediation:
    effort: Low
    steps:
    - Add checkToken() to UserController (see rest-api-004 remediation) as a prerequisite; this is the minimum control that
      prevents anonymous privilege escalation.
    - After token verification, decode the caller's identity and enforce that only admin-level callers may change the 'level'
      field; regular users should receive HTTP 403 if the level field differs from their current level.
    - Consider removing the level field from the addUser() and updateUser() request schemas in the OpenAPI spec and treating
      it as a server-assigned property.
    code_example: null
    verification: Issue PUT /api/v2/user/1 with body {"level":1} without an Authorization header and confirm the response
      is HTTP 401; issue the same request with a valid non-admin token and confirm HTTP 403.
