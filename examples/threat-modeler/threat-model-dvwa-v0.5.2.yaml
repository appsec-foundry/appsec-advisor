- local_id: ci-cd-pipeline-002
  threat_category_id: TH-06
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-250
  title: Write-all GITHUB_TOKEN inherited by all workflows no permissions block
  scenario: 'None of the five workflow files declare a `permissions:` block, so every job inherits the repository default
    token scope, which includes `contents: write`, `packages: write`, and `pull-requests: write`. In `shiftleft-analysis.yml:27`,
    the GITHUB_TOKEN is explicitly passed as the `GITHUB_TOKEN` environment variable to `ShiftLeftSecurity/scan-action@v1.3.0`,
    a third-party action from an external vendor. A malicious or compromised version of that action receives a token capable
    of pushing commits to any branch, creating or overwriting releases, modifying workflow files, and reading all repository
    secrets accessible to the workflow. Combined with the mutable tag on the same action (ci-cd-pipeline-001), this creates
    a compound path: action compromise → token exfiltration → full repository write access.'
  evidence_summary: '`shiftleft-analysis.yml:27` passes `GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}` to `ShiftLeftSecurity/scan-action@v1.3.0`;
    no `permissions:` block is present in any workflow file.'
  impact_description: A compromised third-party action gains full write access to the repository, enabling code injection,
    secrets exfiltration, or supply-chain contamination of published Docker images.
  likelihood: Low
  impact: Critical
  risk: High
  controls_in_place: None — no least-privilege permissions declaration is present in any workflow.
  mitigation_title: Add least-privilege permissions block to every workflow file
  remediation:
    effort: Low
    steps:
    - 'Add `permissions: read-all` at the workflow level as a safe default for all five workflows, then explicitly grant only
      the minimum requ**** (8 chars) per-job scope (e.g., `contents: read` for checkout-only jobs, `packages: write` only in the Docker
      push job).'
    - 'For the ShiftLeft workflow, remove the explicit `GITHUB_TOKEN` env var from the `ShiftLeftSecurity/scan-action` step
      or scope the token to `security-events: write` only, as requ**** (8 chars) for SARIF upload.'
    - Use `github/codeql-action/upload-sarif` with a separately scoped token rather than passing the full GITHUB_TOKEN to
      a third-party vendor action.
    - Audit all workflow `secrets.GITHUB_TOKEN` and `secrets.*` references and confirm each is passed only to first-party
      (github/*) or SHA-pinned, trust-verified actions.
