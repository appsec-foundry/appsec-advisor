- id: M-003
  title: Use parameterized database queries
  threat_ids:
  - T-003
  priority: P1
  severity: Critical
  effort: Low
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Replace string-interpolated SQL with PDO prepared statements in all query-build…
  steps:
  - Replace `mysqli_query()` + string interpolation with a PDO prepared statement using a named or positional placeholder.
  - Bind `$_REQUEST['id']` as a typed parameter (PDO::PARAM_INT for numeric IDs) via `$stmt->bindValue()`.
  - Remove the `or die(mysqli_error(...))` error handler; log errors server-side and return a generic message to the client.
  code_example: '// Before (line 10):

    $query = "SELECT first_name, last_name FROM users WHERE user_id = ''$id'';";


    // After:

    $stmt = $db->prepare(''SELECT first_name, last_name FROM users WHERE user_id = :id'');

    $stmt->bindValue('':id'', $id, PDO::PARAM_INT);

    $stmt->execute();

    $rows = $stmt->fetchAll(PDO::FETCH_ASSOC);'
  verification: Submit `id=1' OR '1'='1` and confirm the query returns exactly one row (user ID 1), not all rows.
  reference: CWE-89
  file: vulnerabilities/sqli/source/low.php:10
- id: M-004
  title: Restrict file inclusion to an explicit allowlist of permitted page filenames
  threat_ids:
  - T-004
  priority: P1
  severity: Critical
  effort: Low
  kind: fix
  auto_emitted: true
  auto_source: build-mitigations-fallback
  _title_source: Restrict file inclusion to an explicit allowlist of permitted page filenames
  steps:
  - Replace the unrestricted `include($file)` with a lookup against a hard-coded array of allowed page filenames (e.g. `['include.php',
    'file1.php']`).
  - Reject any `page` parameter value not found in the allowlist and return HTTP 400.
  - Set `allow_url_include=Off` in `php.ini` to prevent remote file inclusion regardless of input validation.
  code_example: "// Safe: allowlist only (mirrors the impossible level pattern)\n$allowed_pages = ['include.php', 'file1.php',\
    \ 'file2.php', 'file3.php'];\n$page = $_GET['page'] ?? '';\nif (!in_array($page, $allowed_pages, true)) {\n    http_response_code(400);\n\
    \    exit('Page not found.');\n}\ninclude($page);"
  verification: Request `?page=../../../../etc/passwd` and confirm the server returns HTTP 400; confirm `?page=include.php`
    still renders the expected content.
  reference: CWE-98
  file: vulnerabilities/fi/index.php:36
