    steps:
    - In production or non-training deployments, disable the Swagger UI endpoint and the gen_openapi.php route entirely or
      restrict them to an authenticated management origin.
    - If Swagger UI must remain accessible for training, require a DVWA session check (dvwaPageStartup(['authenticated']))
      before serving the spec or the UI.
    - Cache the generated YAML and serve it from a static file to avoid on-demand execution of the OpenApi Generator scanner.
    code_example: null
    verification: Issue GET /vulnerabilities/api/openapi.yml without a session cookie and confirm a 401 or 403 response is
