- local_id: database-005
  threat_category_id: TH-03
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-312
  title: Cleartext Passwords in SQLite User Seed (create_sqlite_db.sql:22)
  affected_parameter: users.pass**** (8 chars) column (SQLite backend)
  scenario: When DVWA is configured with `SQLI_DB=sqlite`, the SQLite database is seeded from create_sqlite_db.sql. Lines
    22-25 execute INSERT statements where the pass**** (8 chars) values — 'pass**** (8 chars)', 'abc123', 'charley', 'letmein', 'pass**** (8 chars)' — are
    stored as unquoted string literals with no hashing function applied whatsoever. The PostgreSQL seed (create_postgresql_db.sql)
    wraps values in `MD5()`, even though MD5 is weak; the SQLite seed omits even that. The sqli.db file resides in the database/
    directory within the web root tree; if directory listing or file download is possible (e.g., via path traversal or a misconfigured
    Apache Alias), the entire plaintext credential store is directly downloadable. Even without web exposure, anyone with
    read access to the Docker volume or container filesystem recovers all pass**** (8 chars)s as human-readable strings from the SQLite
    file.
  attack_steps:
  - An attacker identifies that DVWA is running with the SQLite backend (SQLI_DB=sqlite) and locates the sqli.db file in the
    database/ directory.
  - The attacker downloads the SQLite file directly if the web server serves it, or reads it from a container filesystem backup.
  - The attacker opens the file with any SQLite client and reads all five user pass**** (8 chars)s in cleartext without any cracking
    step.
  evidence_summary: create_sqlite_db.sql:22-25 inserts rows into the users table with pass**** (8 chars) values supplied as bare string
    literals — no hash function is invoked, confirming cleartext storage.
  impact_description: Users of the SQLite backend have their pass**** (8 chars)s stored and recoverable without any cryptographic barrier;
    a file-level read gives immediate plaintext credential access.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None. No hashing, encoding, or file access restriction prevents the pass**** (8 chars) strings from being read
    directly from the sqli.db file.
  mitigation_title: Apply bcrypt hashing to SQLite seed inserts and restrict web server access to the database/ directory
  remediation:
    effort: Low
    steps:
    - Replace bare pass**** (8 chars) string literals in create_sqlite_db.sql with pre-computed bcrypt hashes (matching the fix for
      CWE-916 in database-004) so both backends use the same pass**** (8 chars) storage quality.
    - Add an Apache `<Directory /var/www/html/database>` block with `Require all denied` or a `.htaccess` file with `Deny
      from all` to prevent web server traversal to sqli.db.
    - Ensure sqli.db is stored outside the web root tree, referenced by absolute path in config.inc.php, rather than co-located
      with web-accessible files.
    code_example: '-- create_sqlite_db.sql — Before (cleartext pass**** (8 chars)s)

      insert into users values (''1'',''admin'',''admin'',''admin'',(''pass**** (8 chars)''),''admin.jpg'',DATE(),''0'');


      -- After (pre-computed bcrypt hash; match pass**** (8 chars)_hash(''pass**** (8 chars)'', PASSWORD_BCRYPT, [''cost''=>12]) output)

      insert into users values (''1'',''admin'',''admin'',''admin'',''$2y$12$<hash>'',''admin.jpg'',DATE(),''0'');'
    verification: Run `sqlite3 database/sqli.db 'SELECT pass**** (8 chars) FROM users LIMIT 1;'` and confirm the value starts with $2y$
      or $argon2id$. Confirm `curl http://localhost/database/sqli.db` returns HTTP 403.
    reference: CWE-312
  evidence:
