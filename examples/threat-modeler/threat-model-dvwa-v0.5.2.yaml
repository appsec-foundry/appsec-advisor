  stride: Spoofing
  cwe: CWE-321
  title: Hardcoded Cryptographic Key (vulnerabilities/api/src/Login.php:10)
  scenario: 'The token signing secret ACCESS_TOKEN_SECRET is the string literal "12345" (Login.php:10) and the AES-128-GCM
    encryption key ENCRYPTION_KEY is the string literal "Paintbrush" (Token.php:10). Both constants are committed to the public
    DVWA repository. Any attacker who reads the source can construct a valid AES-128-GCM-encrypted payload containing {"secret":
    "12345", "expires": <future>}, base64-encode it with the correct tag/IV/ciphertext separator, and present the result as
    an Authorization: Bearer token. Login::check_access_token() will accept it unconditionally, granting the attacker full
    authenticated access to all token-gated endpoints (order CRUD) without ever supplying real credentials.'
  attack_steps:
  - An attacker reads ACCESS_TOKEN_SECRET "12345" and ENCRYPTION_KEY "Paintbrush" from the public DVWA repository source.
  - The attacker encrypts JSON {"secret":"12345","expires":<far future>} using AES-128-GCM with key "Paintbrush" and a random
    IV.
  - 'The attacker presents the forged bearer token in Authorization: Bearer to any token-gated endpoint such as GET /api/v2/order/.'
  evidence_summary: Login.php:10 assigns ACCESS_TOKEN_SECRET the literal "12345"; check_access_token() at line 33 accepts
    any token whose decrypted secret field matches that constant.
  impact_description: An unauthenticated attacker gains access to all bearer-token-protected API endpoints by presenting a
    forged token crafted offline.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Token encryption uses AES-128-GCM (authenticated mode) but the key is hardcoded and publicly known, negating
    all cryptographic benefit.
  mitigation_title: Replace hardcoded token secrets with environment-variable-sourced keys in Login.php and Token.php
  remediation:
    effort: Low
    steps:
    - Remove LOGIN_ACCESS_TOKEN_SECRET, REFRESH_TOKEN_SECRET, and ENCRYPTION_KEY constants from Login.php and Token.php; replace
      with getenv() or a config provider that reads from environment variables set outside the codebase.
    - Rotate all three secrets immediately; existing issued tokens become invalid and users must re-authenticate.
    - Add a startup assertion that fails if any of the three environment variables is empty or retains a known-bad default
      value.
    code_example: "// Before (Login.php:10)\nprivate const ACCESS_TOKEN_SECRET = \"12345\";\n\n// After\nprivate static function\
      \ accessTokenSecret(): string {\n    $s = getenv('API_ACCESS_TOKEN_SECRET');\n    if (!$s) throw new \\RuntimeException('API_ACCESS_TOKEN_SECRET\
      \ not set');\n    return $s;\n}"
    verification: Set API_ACCESS_TOKEN_SECRET to a random 32-byte value; craft a token using the old secret "12345"; confirm
      the endpoint returns HTTP 401 when the forged token is submitted.
    reference: CWE-321
