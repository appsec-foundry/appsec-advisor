      `http`/`https` within the same origin.
    - Return HTTP 400 with a generic error page for any redirect that fails validation.
    code_example: "// Safe: allowlist-only redirect\n$allowed = ['info.php', 'index.php'];\n$target = $_GET['redirect'] ??\
