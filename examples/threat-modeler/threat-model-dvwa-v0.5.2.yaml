    without authentication.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None. OrderController demonstrates the checkToken() pattern exists but it is absent from UserController.
  mitigation_title: Add bearer-token authentication check to all UserController operations
  remediation:
    effort: Low
    steps:
    - Add a private checkToken() method to UserController identical to the one in OrderController (copies Login::check_access_token
      on the Authorization header).
    - Call checkToken() at the top of each operation method (getUser, getAllUsers, addUser, updateUser, deleteUser) and return
      HTTP 401 on failure.
    - Add integration tests that confirm each user endpoint returns 401 without a valid bearer token.
    code_example: "// Add to UserController — mirrors OrderController:24-36\nprivate function checkToken() {\n    if (array_key_exists(\"\
      HTTP_AUTHORIZATION\", $_SERVER)) {\n        $header = $_SERVER['HTTP_AUTHORIZATION'];\n        $bits = explode(\" \"\
      , $header);\n        if (count($bits) == 2 && strtolower($bits[0]) == \"bearer\") {\n            return Login::check_access_token($bits[1]);\n\
      \        }\n    }\n    return false;\n}"
