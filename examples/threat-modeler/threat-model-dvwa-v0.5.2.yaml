- local_id: database-002
  threat_category_id: TH-06
  additional_categories:
  - TH-03
  stride: Tampering
  cwe: CWE-250
  title: Overprivileged 'dvwa' DB User Has DDL Permissions (bac_setup.sql:27)
  affected_parameter: dvwa database user
  scenario: 'The ''dvwa'' database user — the same credential the web application uses for every runtime query — is granted
    DDL-level privileges including CREATE TABLE, DROP TABLE, and ALTER TABLE. This is confirmed by bac_setup.sql line 27,
    which executes `ALTER TABLE users ADD COLUMN IF NOT EXISTS role VARCHAR(20)` under this user at module setup time. A successful
    SQL injection or application compromise that runs under the ''dvwa'' connection can therefore issue schema-level destructive
    queries: dropping tables, altering column types, inserting backdoor accounts via DDL triggers, or corrupting indexes.
    Normal application operation requires only DML (SELECT, INSERT, UPDATE, DELETE); DDL access is unnecessary and dramatically
    widens the blast radius of any web-layer exploit.'
  attack_steps:
  - An attacker exploits a SQL injection vulnerability in the DVWA web application to gain arbitrary query execution under
    the 'dvwa' database user.
  - The attacker issues `DROP TABLE users;` or `ALTER TABLE users ADD COLUMN backdoor_token TEXT;` through the compromised
    connection.
  - The attacker achieves persistent schema modification or full data destruction without needing database root credentials.
  evidence_summary: bac_setup.sql:27 issues ALTER TABLE under the 'dvwa' user, confirming DDL privileges are granted and exercised
    at the application layer.
  impact_description: A compromised application connection can destroy or alter the database schema, causing denial of service
    or enabling persistent privilege escalation.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None. The 'dvwa' user is used for all application queries including schema setup, providing no privilege
    separation between runtime DML and administrative DDL.
  mitigation_title: Separate DDL setup user from runtime DML-only 'dvwa' application user
  remediation:
    effort: Medium
    steps:
    - 'Create a dedicated setup user with DDL privileges (GRANT CREATE, DROP, ALTER ON dvwa.* TO ''dvwa_setup''@''%'') and
      restrict the runtime ''dvwa'' user to DML only: `GRANT SELECT, INSERT, UPDATE, DELETE ON dvwa.* TO ''dvwa''@''%'';`'
    - Revoke all DDL grants from the 'dvwa' runtime user with `REVOKE ALL PRIVILEGES ON dvwa.* FROM 'dvwa'@'%'; GRANT SELECT,
      INSERT, UPDATE, DELETE ON dvwa.* TO 'dvwa'@'%'; FLUSH PRIVILEGES;`
    - Run schema migrations (bac_setup.sql and similar) using the privileged setup user only at container startup, not through
      the runtime credential.
    code_example: '-- Grant least-privilege to runtime user

      REVOKE ALL PRIVILEGES ON dvwa.* FROM ''dvwa''@''%'';

      GRANT SELECT, INSERT, UPDATE, DELETE ON dvwa.* TO ''dvwa''@''%'';

      FLUSH PRIVILEGES;


      -- Separate setup credential (used only in entrypoint / setup.php)

      CREATE USER ''dvwa_setup''@''%'' IDENTIFIED BY ''<strong-random-pass**** (8 chars)>'';

      GRANT ALL PRIVILEGES ON dvwa.* TO ''dvwa_setup''@''%'';'
