  title: Missing Authentication on User CRUD Endpoints (UserController.php)
  scenario: UserController.processRequest() dispatches GET, POST, PUT, and DELETE methods to user data operations (getUser,
    getAllUsers, addUser, updateUser, deleteUser) with no bearer-token check. In contrast, OrderController calls checkToken()
    before every comparable operation. Any unauthenticated HTTP client can enumerate all users (GET /api/v2/user/), create
    new users (POST /api/v2/user/), overwrite existing user names (PUT /api/v2/user/{id}), or delete any user (DELETE /api/v2/user/{id})
