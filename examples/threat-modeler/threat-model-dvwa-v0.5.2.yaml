- local_id: web-application-020
  threat_category_id: TH-02
  additional_categories: []
  stride: Elevation of Privilege
  cwe: CWE-330
  title: Predictable Sequential Session Identifier (low.php:9)
  scenario: The Weak Session IDs module assigns a custom `dvwaSession` cookie whose value is an integer counter stored in
    the PHP session (`$_SESSION['last_session_id']++` at `weak_id/source/low.php:9`). The counter starts at 1 and increments
    with each POST request. An attacker who observes any valid session cookie value can predict all previous and future values.
    By iterating over possible integer values, the attacker can forge the session cookie of another logged-in user and hijack
    their session on the application features that rely on this custom cookie.
  evidence_summary: '`weak_id/source/low.php:9` increments `$_SESSION[''last_session_id'']` and sets `setcookie(''dvwaSession'',
    $cookie_value)` with no random component.'
  impact_description: Any session issued by the weak_id module is forgeable by brute-forcing a small integer space.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None at low security level. Impossible level uses a cryptographic random value.
  mitigation_title: Generate session identifiers using a cryptographically secure random number generator
  remediation:
    effort: Low
    steps:
    - Replace the sequential counter with `bin2hex(random_bytes(16))` to generate a 128-bit cryptographically random session
      identifier.
    - Store the issued identifiers server-side in the session to enable server-side validation.
    - Set `HttpOnly`, `Secure`, and `SameSite=Strict` flags on the custom `dvwaSession` cookie.
    code_example: '// Before (line 9):

      $_SESSION[''last_session_id'']++;

      $cookie_value = $_SESSION[''last_session_id''];


      // After:

      $cookie_value = bin2hex(random_bytes(16)); // 32-char hex, 128-bit entropy'
    verification: Generate two session IDs in consecutive requests; confirm they share no sequential relationship and each
      has at least 128 bits of entropy.
    reference: CWE-330
  evidence:
  - file: vulnerabilities/weak_id/source/low.php
    line: 9
  evidence_check: verified
