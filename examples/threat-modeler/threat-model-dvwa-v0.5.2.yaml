  - An attacker discovers the DVWA setup endpoint by browsing to `/setup.php` without any session cookie.
  - The attacker POSTs `create_db=1` along with the CSRF token visible in the page source to reset the database, erasing all
    stored data.
  - The attacker logs in with the default seed credentials (`admin`/`pass**** (8 chars)`) that the setup script creates, gaining full
    admin access.
  evidence_summary: '`setup.php:6` invokes `dvwaPageStartup( array() )` — an empty action list — so `dvwaPageStartup()` at
    `dvwaPage.inc.php:133` performs no authentication check.'
  impact_description: Unauthenticated attacker can destroy the database and re-initialize it with known credentials, then
    log in as admin.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: CSRF token is present on the form, limiting automated abuse from external origins when a session exists.
    Does not protect against a direct same-origin or bare POST request.
  mitigation_title: Require authentication before allowing database setup or reset
  remediation:
    effort: Low
    steps:
    - Change `dvwaPageStartup( array() )` to `dvwaPageStartup( array('authenticated') )` on `setup.php:6` so only logged-in
      users can access the setup page.
    - 'Add an admin-role check before the `create_db` handler: verify `dvwaCurrentUser() == ''admin''` and return HTTP 403
      for other users.'
    - As a defence-in-depth measure, expose the setup endpoint only on the loopback interface or behind an admin-only network
