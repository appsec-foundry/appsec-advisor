  title: MD5 Password Hashing Without Salt (login.php:27)
  scenario: 'Passwords are hashed with unsalted MD5 before database comparison (`login.php:27`: `$pass = md5($pass);`). MD5
    is a fast hash with no work factor and is directly reversed by pre-computed rainbow tables for common pass**** (8 chars)s. If an
    attacker obtains the `users` table — via SQL injection (web-application-004), an exposed backup, or a direct database
    attack — they can crack all pass**** (8 chars) hashes using freely available rainbow tables or GPU-accelerated hashcat within minutes
    for dictionary-range pass**** (8 chars)s.'
  evidence_summary: '`login.php:27` calls `md5($pass)` with no salt and no iterated work factor; the same pattern repeats
    in `csrf/source/low.php:12`, `captcha/source/low.php:57`, and `brute/source/low.php:9`.'
  impact_description: Any database dump immediately yields recoverable plaintext pass**** (8 chars)s for all users; no cracking work
    is requ**** (8 chars) for common pass**** (8 chars)s.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None. MD5 is used throughout the authentication stack.
  mitigation_title: Replace MD5 pass**** (8 chars) hashing with pass**** (8 chars)_hash(PASSWORD_BCRYPT) and migrate existing hashes
  remediation:
    effort: Medium
    steps:
    - Replace `md5($pass)` with `pass**** (8 chars)_hash($pass, PASSWORD_BCRYPT, ['cost' => 12])` for new pass**** (8 chars) storage.
    - 'Replace the equality check in the login query with a two-step process: fetch the stored hash by username only, then
      verify with `pass**** (8 chars)_verify($submitted, $stored_hash)`.'
    - Migrate existing MD5 hashes by checking `strlen($stored) == 32` (MD5) on login and re-hashing on first successful authentication.
    code_example: "// login.php — after (bcrypt path)\n$row = /* fetch row by username only */;\nif ($row && pass**** (8 chars)_verify($pass,\
      \ $row['pass**** (8 chars)'])) {\n    if (pass**** (8 chars)_needs_rehash($row['pass**** (8 chars)'], PASSWORD_BCRYPT, ['cost' => 12])) {\n      \
      \  $new_hash = pass**** (8 chars)_hash($pass, PASSWORD_BCRYPT, ['cost' => 12]);\n        /* UPDATE users SET pass**** (8 chars) = ? WHERE\
      \ user = ? */;\n    }\n    dvwaLogin($user);\n}"
    verification: Store a new pass**** (8 chars) with `pass**** (8 chars)_hash()`; confirm `pass**** (8 chars)_verify()` accepts it and that the stored
      value is a 60-character bcrypt string starting with `$2y$`.
    reference: CWE-916
