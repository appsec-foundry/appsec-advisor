- local_id: database-006
  threat_category_id: TH-06
  additional_categories:
  - TH-03
  stride: Elevation of Privilege
  cwe: CWE-798
  title: Known Root Password 'dvwa' Enables Full DB Admin Access (compose.yml:31)
  affected_parameter: MYSQL_ROOT_PASSWORD
  scenario: 'The MariaDB root account is initialized with the pass**** (8 chars) ''dvwa'' (compose.yml:31). The root credential provides
    unrestricted access to all MariaDB capabilities: creating and dropping any database, creating additional privileged users,
    executing `LOAD DATA INFILE` or `SELECT ... INTO OUTFILE` to read/write container filesystem files, and installing plugins.
    While port 3306 is not mapped to the Docker host, any other container that joins the ''dvwa'' Docker network — including
    containers spun up by an attacker who exploited the web application to gain container-escape or network access — can connect
    to the db service on port 3306 using ''root''/''dvwa''. Combined with the public availability of this credential in the
    repository, the blast radius of a web-layer compromise extends to full database administrative control, not just the application-user
    DML access.'
  attack_steps:
  - An attacker who has obtained code execution in any container on the 'dvwa' Docker network reads MYSQL_ROOT_PASSWORD=dvwa
    from the publicly available compose.yml.
  - The attacker connects to the db service on port 3306 with credentials root/dvwa using any MySQL client available in the
    container.
  - The attacker executes `CREATE USER 'backdoor'@'%' IDENTIFIED BY 'secret'; GRANT ALL ON *.* TO 'backdoor'@'%';` to create
    a persistent privileged account, or `SELECT * FROM mysql.user;` to harvest all credentials.
  evidence_summary: compose.yml:31 sets MYSQL_ROOT_PASSWORD=dvwa in version-controlled plain text; the root account has unrestricted
    MariaDB administrative privileges.
  impact_description: An attacker with Docker network adjacency obtains full database admin control, enabling persistent backdoor
    user creation, filesystem read via LOAD_FILE, and complete data exfiltration or destruction.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Port 3306 is not exposed to the Docker host interface. Access requires already being on the 'dvwa' Docker
    network.
  mitigation_title: Replace the root pass**** (8 chars) 'dvwa' with a CSPRNG-generated secret and restrict root to localhost-only binding
  remediation:
    effort: Low
    steps:
    - Generate a unique root pass**** (8 chars) per deployment with `openssl rand -base64 32` and supply it via an untracked .env file
      or Docker secret — never commit it to compose.yml.
    - Add `--bind-address=127.0.0.1` to the MariaDB command in compose.yml to restrict the listening socket to loopback within
      the container, preventing cross-container TCP access to port 3306.
    - 'Confirm the root account has host=''localhost'' only: `SELECT host, user FROM mysql.user WHERE user=''root'';` and
      run `UPDATE mysql.user SET host=''localhost'' WHERE user=''root''; FLUSH PRIVILEGES;`'
    code_example: "# compose.yml — After: no root pass**** (8 chars) in file; bind to loopback\nservices:\n  db:\n    image: docker.io/library/mariadb:10\n\
      \    command: --bind-address=127.0.0.1\n    env_file:\n      - .env.db   # MYSQL_ROOT_PASSWORD generated by openssl\
      \ rand -base64 32\n    networks:\n      - dvwa"
    verification: From a sibling container on the dvwa network, run `mysql -h db -u root -p dvwa dvwa -e 'SELECT 1;'` and
      confirm authentication fails with ERROR 1045. Confirm `SELECT host FROM mysql.user WHERE user='root';` returns only
      'localhost'.
    reference: CWE-798
