- local_id: database-003
  threat_category_id: TH-16
  additional_categories: []
  stride: Repudiation
  cwe: CWE-778
  title: No MySQL Binary Logging or Immutable Audit Trail Configured in Database Layer
  scenario: The MariaDB service in compose.yml is started with default settings and no command-line flags or environment variables
    that enable the binary log (--log-bin), the general query log (--general-log), or any audit plugin. The bac_setup.sql
    file creates access_log and security_log tables, but these are training-exercise tables written to by the DVWA application
    itself using the 'dvwa' user — which has DDL access and can TRUNCATE or DROP them. Without an out-of-process, append-only
    log sink, an attacker who compromises the application can erase evidence of malicious queries (injections, data exfiltration,
    credential harvesting) by simply truncating those tables. There is no mechanism to reconstruct the sequence of SQL statements
    executed against the database after an incident.
  evidence_summary: compose.yml:28-39 starts MariaDB with no --log-bin, --general-log, or audit plugin arguments; bac_setup.sql
    creates application-layer log tables that the 'dvwa' user can truncate.
  impact_description: An attacker can cover their tracks by truncating training-exercise log tables; no database-native log
    exists to reconstruct injected or unauthorized queries after the fact.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: The bac_setup.sql creates access_log and security_log tables in MariaDB, but these are writable by the
    application user and serve the training exercise, not forensic accountability.
  mitigation_title: Enable MariaDB binary logging and route audit events to an append-only external sink
  remediation:
    effort: Low
    steps:
    - Add `--log-bin=binlog` and `--binlog-format=ROW` to the MariaDB service command in compose.yml to enable binary logging
      that captures all DML and DDL changes.
    - Consider enabling the MariaDB Audit Plugin (`INSTALL PLUGIN server_audit SONAME 'server_audit.so'; SET GLOBAL server_audit_logging=ON;`)
      and route its output to a volume-mounted file or sidecar log collector.
