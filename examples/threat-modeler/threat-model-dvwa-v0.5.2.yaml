tier_root_causes:
  server:
  - no input neutralization on raw SQL and OS command injection paths
  - intentionally disabled security controls at low/medium difficulty levels
  - missing HTTP security headers and CSRF token enforcement
  - MD5 pass**** (8 chars) hashing without salt on authentication paths
  - no rate limiting or account lockout on login endpoints
  data:
  - hardcoded database root credentials in compose.yml expose auth bypass
  - no audit logging or binary logging for forensic trail
  - database error messages disclosed in HTTP responses
weaknesses:
- id: W-001
  weakness_class: injection
  kind: design
  title: Input handling lacks enforced boundary validation
  statement: Schema / Allowlist Input Validation is not consistently enforced.
  severity: High
  severity_basis: confirmed
  observable_backing:
    absent_control_signal:
    - Schema Validation
    - Allowlist Validation
  mechanism_id: blacklist-only-input-validation
  affected_components:
  - backend-api
  instances: []
  description: Request handlers do not validate input against one enforced server-side schema or allowlist at the boundary
    — validation is either absent on the vulnerable parameters or limited to rejecting selected bad patterns (a blacklist).
    New encodings and unanticipated input forms can therefore reach downstream parsers or interpreters.
  structural_recommendation: enforce server-side schemas and domain-specific allowlists before input reaches parsing, persistence,
    or command construction
- id: W-002
  weakness_class: outdated_deps
  kind: design
  title: Build pipeline trusts mutable third-party references
  statement: Third-Party Action Pinning is not consistently enforced.
  severity: High
  severity_basis: confirmed
  observable_backing:
    absent_control_signal:
    - Commit-SHA Action Pinning
    - Dependency Provenance Verification
  mechanism_id: build-pipeline-mutable-refs
  affected_components:
  - ci-cd-pipeline
  instances:
  - id: T-014
    file: .github/workflows/docker-image.yml
    line: 13
    basis: confirmed-exploitable
  - id: T-022
    file: .github/workflows/docker-image.yml
    line: 16
    basis: confirmed-exploitable
  description: CI/CD workflows resolve third-party actions and other build dependencies to mutable tags or branches instead
    of immutable commit digests, so a retagged or compromised upstream runs inside the pipeline with its token and secret
    scope.
  structural_recommendation: pin every third-party action and build dependency to an immutable commit SHA (or a vetted internal
    mirror) and enforce SHA-pinning in CI
- id: W-003
  weakness_class: secret_management
  kind: design
  title: Secrets are committed to source instead of a managed store
  statement: Managed Secret Storage is not consistently enforced.
  severity: High
  severity_basis: confirmed
