- local_id: ci-cd-pipeline-001
  threat_category_id: TH-14
  additional_categories: []
  stride: Tampering
  cwe: CWE-1357
  title: Unpinned GitHub Actions allow supply-chain code injection (.github/workflows)
  scenario: All five workflow files reference GitHub Actions via mutable version tags (e.g., `docker/setup-qemu-action@v3`,
    `ShiftLeftSecurity/scan-action@v1.3.0`, `actions/checkout@v6.0.2`) rather than immutable SHA-256 digest pins. An attacker
    who compromises the upstream action repository — or pushes a malicious update to the same tag — causes the next workflow
    run to silently execute attacker-controlled code. The compromised action runs with access to all runner environment variables,
    the repository's secret store, and the inherited write-all GITHUB_TOKEN. Because the tag reference is opaque, there is
    no diff to review and no automatic notification that the action's code changed.
  evidence_summary: '`docker-image.yml:13` uses `actions/checkout@v6.0.2`; `docker-image.yml:16` uses `docker/setup-qemu-action@v3`;
    `shiftleft-analysis.yml:24` uses `ShiftLeftSecurity/scan-action@v1.3.0` — all mutable tag references.'
  impact_description: Arbitrary code execution within the CI runner with access to all repository secrets and write-all GITHUB_TOKEN,
    enabling repository takeover or malicious artifact injection.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: None — no SHA pinning is present in any of the five workflow files.
  mitigation_title: Pin all GitHub Actions to immutable SHA-256 digests
  remediation:
    effort: Low
    steps:
    - For every `uses:` reference in `.github/workflows/*.yml`, replace the version tag with the full SHA-256 commit digest,
      e.g. `actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683` (SHA for v4.2.2).
    - 'Add a comment on the same line documenting the human-readable version tag: `# v4.2.2`.'
    - Adopt a tool such as `pin-github-actions` (Mheads Labs) or Dependabot's `update-actions` to automate discovery and periodic
      SHA refresh.
    - 'Enable Dependabot for GitHub Actions (`dependabot.yml` package-ecosystem: ''github-actions'') to receive automated
      PRs when upstream releases new versions.'
    code_example: '# Before (mutable tag — unsafe):

      - uses: actions/checkout@v6.0.2


      # After (immutable SHA pin — safe):

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2'
    verification: Run `grep -r 'uses:' .github/workflows/ | grep -v '@[0-9a-f]\{40\}'` — zero output confirms all actions
      are SHA-pinned.
    reference: CWE-1357
  evidence:
  - file: .github/workflows/docker-image.yml
    line: 13
  boundary_refs:
