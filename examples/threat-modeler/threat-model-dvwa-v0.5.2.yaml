- local_id: ci-cd-pipeline-003
  threat_category_id: TH-14
  additional_categories: []
  stride: Tampering
  cwe: CWE-494
  title: Docker image pushed without signing or SLSA provenance (docker-image.yml:41)
  scenario: The `Build and push multi-arch DVWA image` step in `docker-image.yml:41` calls `docker buildx build ... --push`
    with no subsequent cosign signing step and no SLSA provenance attestation. The image is tagged with both a floating version
    tag (`latest`) and a short commit SHA. Consumers who deploy `ghcr.io/digininja/dvwa:latest` cannot cryptographically verify
    that the image they pull was produced by this CI workflow from the corresponding source commit. A registry-side substitution,
    a compromised build step, or a MITM on the pull path would be undetectable.
  evidence_summary: '`docker-image.yml:41` executes `docker buildx build --push` with no `cosign sign` or `attest-build-provenance`
    step anywhere in the workflow.'
  impact_description: Consumers deploying the published image have no integrity guarantee; a tampered image could introduce
    backdoors into every DVWA instance deployed from ghcr.io.
  likelihood: Low
  impact: High
  risk: Medium
  controls_in_place: Commit SHA tag provides weak traceability but no cryptographic guarantee.
  mitigation_title: Sign container images with cosign and generate SLSA provenance on every push
  remediation:
    effort: Medium
    steps:
    - Install `sigstore/cosign-installer` action after the build step and run `cosign sign --yes $IMAGE_ID@$DIGEST` using
      a keyless OIDC identity (no long-lived key requ**** (8 chars)).
    - 'Add `docker/build-push-action` with `provenance: true` and `sbom: true` flags to generate SLSA L1 provenance attestations
      and a CycloneDX SBOM alongside the image manifest.'
    - 'Update the job `permissions:` block (after applying ci-cd-pipeline-002 fix) to include `id-token: write` requ**** (8 chars) for
      keyless cosign signing via GitHub OIDC.'
    - 'Document the verification command for consumers: `cosign verify ghcr.io/digininja/dvwa:latest --certificate-identity-regexp=https://github.com/digininja/DVWA
      --certificate-oidc-issuer=https://token.actions.githubusercontent.com`.'
    code_example: "- name: Install cosign\n  uses: sigstore/cosign-installer@<SHA>  # pin to SHA\n\n- name: Sign image\n \
      \ run: cosign sign --yes $IMAGE_ID:$VERSION\n  env:\n    COSIGN_EXPERIMENTAL: 1"
    verification: After a build, run `cosign verify ghcr.io/digininja/dvwa:latest --certificate-identity-regexp=...` — successful
      verification with exit code 0 confirms the image is signed.
    reference: CWE-494
  evidence:
  - file: .github/workflows/docker-image.yml
    line: 41
  boundary_refs:
