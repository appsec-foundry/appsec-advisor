- local_id: rest-api-008
  threat_category_id: TH-17
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-200
  title: Unauthenticated Swagger UI and OpenAPI Specification Exposure
  scenario: The Swagger UI is served publicly at /vulnerabilities/api/swagger and the full OpenAPI specification is available
    at /vulnerabilities/api/openapi.yml without any authentication. The gen_openapi.php script scans the entire src/ directory
    at request time and emits a dynamically generated YAML spec. Any anonymous caller can discover the complete API surface
    — all endpoints, methods, request schemas, response schemas, operation IDs, and the security scheme definition — and use
    the Swagger UI to execute live API calls directly in the browser. While the intentional training context makes full disclosure
    expected, in a real deployment this information accelerates exploitation of other vulnerabilities (rest-api-003, rest-api-004).
  evidence_summary: gen_openapi.php:4 calls OpenApi\Generator::scan(['./src']) on every request with no preceding authentication
    check, emitting the full API spec.
  impact_description: An attacker receives a complete, up-to-date map of all API endpoints, parameters, and data schemas without
    needing to enumerate them manually.
  likelihood: High
  impact: Low
  risk: Medium
  controls_in_place: None. No authentication gate exists before Swagger UI or spec download endpoints.
  mitigation_title: Gate Swagger UI and OpenAPI spec endpoints behind authentication or disable them in non-training environments
  remediation:
