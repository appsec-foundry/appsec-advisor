  cwe: CWE-384
  title: Session Fixation (dvwa/includes/dvwaPage.inc.php:102)
  scenario: At security levels below impossible, `dvwaPage.inc.php:102-103` explicitly preserves the pre-login session identifier
    by calling `session_id($_COOKIE[session_name()])` before `session_start()`. An attacker who plants a known session ID
    in a victim's browser (via a network-layer injection, XSS on a sibling domain, or cookie-tossing) will hold a valid authenticated
    session after the victim logs in, because the server never regenerates the ID on authentication state change.
  evidence_summary: '`dvwaPage.inc.php:102-103` calls `session_id()` with the cookie value at non-impossible levels, keeping
    the attacker''s pre-set ID after login.'
  impact_description: Attacker gains a fully authenticated session as the victim without knowing their credentials.
  likelihood: Medium
  impact: High
  risk: High
  controls_in_place: Session ID is regenerated only at the impossible security level (`session_regenerate_id()` at `dvwaPage.inc.php:99`).
    At low/medium/high levels, explicit ID preservation is the code path.
  mitigation_title: Regenerate session ID unconditionally on login at all security levels
  remediation:
    effort: Low
    steps:
    - In `dvwaPage.inc.php:dvwa_start_session()`, replace the branch that calls `session_id($_COOKIE[session_name()])` with
      unconditional `session_regenerate_id(true)` at all security levels.
    - Set the `delete_old_session` parameter to `true` in `session_regenerate_id(true)` to invalidate the prior session server-side.
    - Add a `session_start()` call before `session_regenerate_id()` when no session is active.
    code_example: "// Before (low/medium/high — line 102):\nif (isset($_COOKIE[session_name()]))\n    session_id($_COOKIE[session_name()]);\n\
      session_start();\n\n// After (all levels):\nsession_start();\nsession_regenerate_id(true); // invalidates old ID, issues\
      \ new one"
    verification: Set `security=low` cookie; set a custom `PHPSESSID=attackerknownid`; submit valid credentials; verify the
      post-login `Set-Cookie` contains a new, different `PHPSESSID` value.
    reference: CWE-384
