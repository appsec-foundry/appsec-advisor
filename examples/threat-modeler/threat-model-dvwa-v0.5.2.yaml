- local_id: rest-api-003
  threat_category_id: TH-01
  additional_categories: []
  stride: Tampering
  cwe: CWE-78
  title: OS Command Injection (vulnerabilities/api/src/HealthController.php:88)
  scenario: 'The checkConnectivity() method at HealthController.php:88 calls exec("ping -c 4 " . $target) where $target is
    taken directly from the JSON request body field "target" with no sanitization, escaping, or allowlisting. The /api/v2/health/connectivity
    endpoint requires no authentication. An attacker sends POST /api/v2/health/connectivity with body {"target": "127.0.0.1;
    cat /etc/passwd"} and the server executes the compound shell command, returning the output when the ping portion succeeds.
    The attacker can read arbitrary files, spawn reverse shells, or pivot to internal network services running under the PHP
    process identity.'
  attack_steps:
  - 'An attacker sends POST /api/v2/health/connectivity with JSON `{"target": "127.0.0.1; id"}` — no authentication is requ**** (8 chars).'
  - The server builds the string "ping -c 4 127.0.0.1; id" and passes it to exec(); the shell interprets the semicolon separator.
  - The attacker reads the process identity from the response and replaces `id` with commands to read /etc/passwd, establish
    a reverse shell, or exfiltrate data.
  evidence_summary: HealthController.php:88 concatenates $input['target'] directly into the exec() argument string with no
    escaping or allowlist check.
  impact_description: Unauthenticated remote code execution on the web server; attacker achieves OS-level command execution
    under the PHP process identity.
  likelihood: High
  impact: Critical
  risk: Critical
  controls_in_place: None. No input sanitization, no escaping, no authentication on the endpoint.
  mitigation_title: Validate connectivity target against an allowlist of hostnames and use escapeshellarg() in HealthController::checkConnectivity()
  remediation:
    effort: Low
    steps:
    - Replace exec("ping -c 4 " . $target) with exec("ping -c 4 " . escapeshellarg($target)); this prevents shell metacharacter
      injection as an immediate fix.
    - 'Add an allowlist validation step before the exec call: restrict $target to hostnames matching a predefined pattern
      (e.g., alphanumeric plus hyphens and dots only) and reject anything else with HTTP 422.'
    - Require bearer token authentication on the /health/connectivity endpoint if it must remain accessible at all; consider
      removing it from the training API unless the command injection is the intentional lesson.
    code_example: "// Before (HealthController.php:88)\nexec (\"ping -c 4 \" . $target, $output, $ret_var);\n\n// After\n\
      if (!preg_match('/^[a-zA-Z0-9\\-.]+$/', $target)) {\n    // reject — non-allowlisted characters\n    $response['status_code_header']\
      \ = 'HTTP/1.1 422 Unprocessable Entity';\n    return $response;\n}\nexec(\"ping -c 4 \" . escapeshellarg($target), $output,\
      \ $ret_var);"
    verification: 'Send POST /api/v2/health/connectivity with body {"target": "127.0.0.1; cat /etc/passwd"} and confirm the
      response is HTTP 422 with no file content returned.'
    reference: CWE-78
  evidence:
