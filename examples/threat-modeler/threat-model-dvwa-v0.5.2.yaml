  assumption_verdict: refuted
security_controls:
- domain: Identity and Authentication Controls
  control: Password-Based Authentication
  kind: mechanism
  effectiveness: Unsafe
  assessment: Passwords hashed with MD5 (login.php:27) — cryptographically broken; rainbow-table inversion trivial. No login
    rate-limiting or account lockout. DISABLE_AUTHENTICATION flag (config.inc.php.dist:43) lets operators bypass the entire
    mechanism. Session fixation is intentionally permitted at low/medium/high levels (dvwaPage.inc.php:102-104); session_regenerate_id()
    called only at impossible level. Training design but constitutes a working exploit path against any deployed instance.
  linked_threats: []
  rule_id: ARCH-AUTH-001
  subcontrols:
  - title: Password-Based Login
    type: flow
    implementation: login.php collects username and pass**** (8 chars), applies stripslashes() and mysqli_real_escape_string(), MD5-hashes
      the pass**** (8 chars), and issues a SELECT query comparing the hash. CSRF token is checked before credential processing. On success,
      dvwaLogin() stores the username in $_SESSION['dvwa']['username'].
    assessment: MD5 is trivially invertible. The credential query at login.php:40 uses string interpolation after escape —
      second-order injection paths remain. No rate limit; brute-force is unrestricted. Session fixation allowed below impossible
      level.
    evidence:
    - file: login.php
      lines:
      - 10
      - 50
    - file: dvwa/includes/dvwaPage.inc.php
      lines:
      - 97
      - 106
    relevant_findings: []
  - title: Authentication Bypass (DISABLE_AUTHENTICATION)
    type: primitive
    implementation: config.inc.php.dist exposes DISABLE_AUTHENTICATION env-var (line 43). When true, dvwaIsLoggedIn() returns
      true unconditionally (dvwaPage.inc.php:150), bypassing all session checks.
    assessment: Operator-facing bypass intended for automated testing tools. If misconfigured in a reachable environment,
      eliminates all access control.
    evidence:
    - file: config/config.inc.php.dist
      lines:
      - 43
    - file: dvwa/includes/dvwaPage.inc.php
      lines:
      - 149
      - 154
    relevant_findings: []
- domain: Session and Token Controls
  control: PHP Session Management
  kind: lifecycle
  effectiveness: Weak
  assessment: 'PHP native sessions used throughout. Cookie flags are security-level-dependent: HttpOnly and SameSite=Strict
    are set only at impossible level (dvwaPage.inc.php:50-57). The Secure flag is hard-coded false at all levels (line 62),
    exposing the session cookie over HTTP. The security level itself is stored in a client-controlled cookie (''security'')
    without server-side signing — any authenticated user can escalate to ''low'' mode by changing the cookie. Session lifetime
    is 86400 seconds with no idle timeout.'
  linked_threats: []
  rule_id: ARCH-COOKIE-001
  subcontrols:
  - title: Session Cookie Flags
    type: primitive
    implementation: dvwa_start_session() in dvwaPage.inc.php calls session_set_cookie_params() with lifetime=86400, secure=false,
      httponly and samesite conditional on security level.
    assessment: HttpOnly and SameSite protect only at impossible level. Secure is never set — session cookies transmit in
      plaintext over HTTP. The security-level cookie itself has httponly only at impossible level (dvwaSecurityLevelSet, line
      221).
    evidence:
    - file: dvwa/includes/dvwaPage.inc.php
      lines:
      - 45
      - 106
    relevant_findings: []
  - title: Session Fixation Prevention
    type: primitive
    implementation: At impossible level, session_regenerate_id() is called after authentication (line 99). At lower levels,
      the existing session id is preserved via session_id($_COOKIE[session_name()]) before session_start(), deliberately allowing
      fixation.
    assessment: Session fixation is intentional training content at low/medium/high levels. At impossible level the fixation
      risk is mitigated.
    evidence:
    - file: dvwa/includes/dvwaPage.inc.php
      lines:
      - 97
      - 105
    relevant_findings: []
- domain: Authorization Controls
  control: Role-Based Access Control
  kind: mechanism
  effectiveness: Unsafe
  assessment: Access control is implemented as a session presence check (dvwaPageStartup(['authenticated'])) that maps to
    a username in $_SESSION. The security level governing which vulnerability protections are applied is read from the client-controlled
    'security' cookie (dvwaSecurityLevelGet, line 204) — any attacker who obtains a session can set this cookie to 'low' and
    disable all higher-level protections. The only role distinction is admin vs non-admin (line 311), which controls the Setup
    tab visibility only. No privilege separation, no RBAC beyond this single check. DISABLE_AUTHENTICATION removes even the
    session check.
  linked_threats: []
  rule_id: ARCH-AUTHZ-001
- domain: Query Construction and Data Access Controls
  control: SQL Query Parameterization
  kind: mechanism
  effectiveness: Unsafe
  assessment: 'login.php uses mysqli_real_escape_string() and string interpolation (line 40: SELECT * FROM users WHERE user=''$user''
    AND pass**** (8 chars)=''$pass''), not prepared statements. Vulnerability modules at low/medium levels use raw string interpolation
    without any escaping. Only the impossible-level source files use PDO prepared statements with bindParam(). The production
    login code path is the non-parameterized variant.'
  linked_threats: []
  rule_id: ARCH-INPUT-001
  subcontrols:
  - title: Login Query (MySQLi escape)
    type: primitive
    implementation: login.php applies mysqli_real_escape_string() to username and MD5 to pass**** (8 chars), then interpolates into
      a string SELECT query.
    assessment: Escape-based mitigation is insufficient — second-order injection paths remain and the escape does not cover
      all injection vectors. Not a parameterized query.
    evidence:
    - file: login.php
      lines:
      - 20
      - 45
    relevant_findings: []
  - title: Vulnerability Module Queries (PDO — impossible level only)
    type: primitive
    implementation: vulnerabilities/sqli/source/impossible.php uses PDO::prepare() with bindParam(:id, PDO::PARAM_INT). All
      other security levels use raw string interpolation.
    assessment: Parameterized queries exist only in the impossible-level source, which is not the active code path by default.
    evidence:
    - file: vulnerabilities/sqli/source/impossible.php
      lines:
      - 16
      - 18
    relevant_findings: []
- domain: Input Boundary Validation Controls
  control: Validation Approach
  kind: cross-cutting
  effectiveness: Unsafe
  assessment: 'No centralized input validation framework or schema validation layer. Each vulnerability module applies its
    own per-level handling: low levels accept raw input; medium levels apply blacklist filtering (easily bypassed); high levels
    use stricter filters; impossible levels apply allowlist validation. The login page applies stripslashes() followed by
    escape — no type/length/format validation. The architectural stance is explicitly ad-hoc and deliberately inadequate at
    sub-impossible levels.'
  linked_threats: []
- domain: Output Encoding and Rendering Controls
  control: HTML Output Encoding
  kind: mechanism
  effectiveness: Unsafe
  assessment: htmlspecialchars() is used selectively in system UI code (dvwaPage.inc.php lines 618-619 for menu rendering).
    The XSS vulnerability modules intentionally write user-controlled data to output without encoding (reflected, stored,
    DOM). authbypass/authbypass.js assigns user data to innerHTML at lines 43-49. csp/source/impossible.js and high.js use
    innerHTML at line 9. No global encoding policy or templating engine with auto-escape.
  linked_threats: []
- domain: Browser and Cross-Origin Controls
  control: CSRF Protection
  kind: mechanism
  effectiveness: Weak
  assessment: 'CSRF token (synchronizer token pattern) is implemented on the login form: generateSessionToken() at login.php:60
    and checkToken() at login.php:18. This protection applies only to the login endpoint. Vulnerability module forms at low/medium
    levels intentionally omit CSRF tokens — the csrf/ module exists specifically to demonstrate this gap. No global CSRF middleware.'
  linked_threats: []
- domain: Browser and Cross-Origin Controls
  control: CORS Policy
  kind: mechanism
  effectiveness: Unsafe
  assessment: 'Both REST API entry points emit Access-Control-Allow-Origin: * (vulnerabilities/api/gen_openapi.php:6 and vulnerabilities/api/public/index.php:11).
    Wildcard origin with no credential restriction. Intentional training content for the API security module.'
  linked_threats: []
  rule_id: ARCH-CORS-001
- domain: Browser and Cross-Origin Controls
  control: Content Security Policy
  kind: mechanism
  effectiveness: Missing
  assessment: No global CSP header. CSP headers exist only within the vulnerabilities/csp/ training module, scoped to the
    CSP lab page. The main application, login page, and all other modules deliver no CSP. The CSP training module intentionally
    demonstrates unsafe configurations at low/medium levels.
  linked_threats: []
  gaps:
  - No CSP header on login.php, index.php, or any non-training page
  - No nonce or hash-based CSP for inline script protection globally
- domain: Browser and Cross-Origin Controls
  control: HTTP Security Headers
  kind: mechanism
  effectiveness: Missing
  assessment: No X-Frame-Options, X-Content-Type-Options, Strict-Transport-Security, Referrer-Policy, or Permissions-Policy
    headers detected anywhere in the application. Cache-Control and Content-Type headers are set on the login page only.
  linked_threats: []
