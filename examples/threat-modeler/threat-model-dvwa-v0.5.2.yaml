- id: M-001
  title: Centralized input validation and output encoding layer
  threat_ids:
  - T-001
  priority: P1
  severity: Critical
  effort: Low
  kind: investigate
  auto_emitted: true
  auto_source: build-mitigations-fallback
  remediation:
    effort: High
    steps:
    - Adopt a framework-level input validation middleware (e.g. Symfony Validator or Laravel Validator for PHP)
    - Replace all raw string interpolation in SQL with PDO prepared statements globally
    - Replace all shell_exec / exec calls with escapeshellarg-wrapped or command-array invocations
    - Add a Content-Security-Policy header that blocks inline script execution across all responses
  _title_source: Centralized input validation and output encoding layer
