- local_id: web-application-014
  threat_category_id: TH-04
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-614
  title: Session Cookie Missing HttpOnly and Secure Flags at Non-Impossible Levels
  scenario: In `dvwa_start_session()` at `dvwaPage.inc.php:62`, `$secure` is hardcoded to `false` for all security levels.
    At non-impossible levels (lines 55-57), `$httponly` is also `false` and `$samesite` is an empty string. This means the
    PHPSESSID session cookie is readable by JavaScript running on the same origin (enabling XSS-based session theft), transmitted
    over plain HTTP (enabling network interception), and offers no SameSite protection against CSRF. Combined with the stored
    and reflected XSS findings, an attacker's XSS payload can directly exfiltrate the session cookie via `document.cookie`.
  evidence_summary: '`dvwaPage.inc.php:62` sets `$secure = false` unconditionally; lines 54-57 set `$httponly = false` and
    `$samesite = ''''` for non-impossible levels.'
  impact_description: XSS payloads can steal the PHPSESSID cookie; HTTP interception captures the session token in transit;
    no SameSite barrier exists for CSRF.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: '`HttpOnly=true` and `SameSite=Strict` only at impossible security level. No Secure flag at any level.'
  mitigation_title: Set HttpOnly, Secure, and SameSite=Strict on the session cookie at all security levels
  remediation:
    effort: Low
    steps:
    - Set `$secure = true` unconditionally in `dvwa_start_session()` (line 62), or derive it from `!empty($_SERVER['HTTPS'])`.
    - Set `$httponly = true` at all security levels (currently only at impossible); remove the `if ($security_level == 'impossible')`
      branch for this flag.
    - Set `$samesite = 'Strict'` at all security levels.
    - Configure the web server or PHP to set the `Secure` flag only when TLS is available, or enforce TLS termination at the
      container boundary.
    code_example: '// dvwaPage.inc.php — apply security flags unconditionally

      $secure  = isset($_SERVER[''HTTPS'']) && $_SERVER[''HTTPS''] !== ''off'';

      $httponly = true;   // always

      $samesite = ''Strict''; // always'
    verification: Authenticate at `security=low` and inspect `Set-Cookie` response header; confirm `HttpOnly`, `Secure`, and
      `SameSite=Strict` attributes are present.
