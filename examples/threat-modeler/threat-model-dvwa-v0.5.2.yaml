- local_id: web-application-012
  threat_category_id: TH-17
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-209
  title: Database Error Disclosure in Authentication Path (login.php:40)
  scenario: When the login query fails at `login.php:40`, the application calls `die('<pre>' . mysqli_error($GLOBALS['___mysqli_ston'])
    . '</pre>')`. The `mysqli_error()` output includes the full SQL error message from MariaDB/MySQL, which reveals the table
    name, column names, query structure, and in some error scenarios the DBMS version. A reconnaissance attacker can trigger
    error messages by submitting malformed usernames (e.g. a single quote) to map the database schema without even completing
    an injection attack.
  evidence_summary: '`login.php:40` passes `mysqli_error()` directly to `die()` as HTML output; any SQL error leaks DB internals
    to the browser.'
  impact_description: Database schema, column names, and DBMS version are disclosed to unauthenticated attackers, accelerating
    SQL injection exploitation.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None. The `@` operator suppresses PHP warnings, but MySQL-level errors are still surfaced via `mysqli_error()`.
  mitigation_title: Remove die(mysqli_error()) and log DB errors server-side with a generic client-facing message
  remediation:
    effort: Low
    steps:
    - Replace `or die('<pre>' . mysqli_error(...) . '</pre>')` with a try/catch block that logs the error server-side via
      `error_log()` and returns a generic 'Login failed' message.
    - Set `PDO::ERRMODE_EXCEPTION` on the PDO connection (already done for the PDO connection at `dvwaPage.inc.php:579`) and
      remove all `mysqli_error()` calls from user-facing code paths.
    - Disable PHP's `display_errors` in the production `php.ini` (`display_errors=Off`).
    code_example: "// Before (line 40):\n$result = @mysqli_query(...) or die('<pre>' . mysqli_error($GLOBALS['___mysqli_ston'])\
      \ . '</pre>');\n\n// After:\n$result = @mysqli_query($GLOBALS['___mysqli_ston'], $query);\nif (!$result) {\n    error_log('Login\
      \ query error: ' . mysqli_error($GLOBALS['___mysqli_ston']));\n    dvwaMessagePush('Login failed.');\n    dvwaRedirect('login.php');\n\
      }"
    verification: Submit a username containing a single quote; confirm the HTTP response contains no SQL error text, only
      the generic 'Login failed' message.
