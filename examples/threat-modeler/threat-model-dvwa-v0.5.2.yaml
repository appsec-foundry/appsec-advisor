  assumption_verdict: refuted
- name: CI/CD Pipeline → External Registry
  kind: build
  assumption: The container image pushed to ghcr.io contains only build artifacts derived from the verified source checkout.
  evidence:
  - file: .github/workflows/docker-image.yml
    line: 16
  confidence: confirmed
  resolution_status: resolved
  sources:
  - detected
  from: ci-cd-pipeline
  to: external
  assumption_legs:
  - leg: egress-content
    condition: The container image pushed to ghcr.io contains only build artifacts derived from the verified source checkout,
      with no attacker-supplied content.
  - leg: egress-destination
    condition: The push destination (ghcr.io registry path) is fixed in the workflow file and cannot be overridden by push-event
      metadata.
  - leg: response-trust
    condition: Registry API responses are treated as untrusted input and never used to derive subsequent build or deployment
