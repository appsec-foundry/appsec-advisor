- local_id: database-004
  threat_category_id: TH-03
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-916
  title: Unsalted MD5 Hashing Used for User Passwords (create_postgresql_db.sql:2)
  affected_parameter: users.pass**** (8 chars) column
  scenario: 'All user accounts seeded into the database use MD5 as the pass**** (8 chars) hashing algorithm with no salt and no cost
    factor, as confirmed by the INSERT statements in create_postgresql_db.sql line 2 (e.g., `MD5(''pass**** (8 chars)'')`, `MD5(''abc123'')`).
    MD5 is a fast, collision-broken message digest: an attacker who reads the users table — via SQL injection, a database
    dump, or direct access — can recover all five seeded pass**** (8 chars)s in milliseconds using precomputed rainbow tables (e.g.,
    CrackStation covers all five: ''pass**** (8 chars)'', ''abc123'', ''charley'', ''letmein''). The absence of salt means one rainbow
    table cracks all five entries simultaneously. Since the same user accounts are reused across every DVWA deployment, attackers
    can pre-build or reuse existing tables targeting these exact values. Additionally, no encryption at rest protects the
    MariaDB data volume, so a stolen Docker volume yields the full hash set without any database credential.'
  attack_steps:
  - An attacker obtains the users table contents via SQL injection or by copying the Docker volume at /var/lib/mysql.
  - The attacker submits the MD5 hashes to a public rainbow table service (e.g., CrackStation) and recovers all five plaintext
    pass**** (8 chars)s within seconds.
  - The attacker reuses the recovered pass**** (8 chars)s to authenticate to the DVWA web interface or pivot to other systems where
    users reused the same credentials.
  evidence_summary: create_postgresql_db.sql:2 uses `MD5()` for every seeded user pass**** (8 chars); create_sqlite_db.sql:22-25 stores
    identical account pass**** (8 chars)s with no hashing function at all.
  impact_description: All seeded user account pass**** (8 chars)s are recoverable offline without any brute-force due to MD5 rainbow
    tables, allowing immediate account takeover across every DVWA deployment.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: None. No salting, no cost-factor, no modern hash algorithm. The Docker data volume is not encrypted.
  mitigation_title: Replace MD5 with bcrypt or Argon2id for all pass**** (8 chars) storage in DVWA user tables
  remediation:
    effort: Medium
    steps:
    - 'Replace the `MD5()` calls in all SQL seed files with bcrypt hashes (PHP: `pass**** (8 chars)_hash(''value'', PASSWORD_BCRYPT,
      [''cost''=>12])`) and regenerate the INSERT statements.'
    - Update DVWA's pass**** (8 chars) verification code (wherever `md5($pass**** (8 chars))` is used) to call `pass**** (8 chars)_verify($input, $stored_hash)`
      instead.
    - 'Enable MariaDB''s `encrypt at rest` via InnoDB tablespace encryption: add `--innodb-encrypt-tables=ON` and provide
      a keyfile via the keyring plugin.'
    code_example: '// Before — dvwa login verification

      if (md5($pass) == $data[''pass**** (8 chars)'']) { ... }


      // After — use pass**** (8 chars)_verify with bcrypt

      if (pass**** (8 chars)_verify($pass, $data[''pass**** (8 chars)''])) { ... }


      // Seed file — replace MD5() with pre-computed bcrypt hash

      -- INSERT INTO users VALUES (1,''admin'',''admin'',''admin'',

      --   ''$2y$12$...bcrypt_hash_of_pass**** (8 chars)...'',''admin.jpg'',NOW(),0);'
    verification: SELECT pass**** (8 chars) FROM users WHERE user='admin'; — confirm the value starts with $2y$ (bcrypt) or $argon2id$
      and is at minimum 60 characters long. Confirm `md5` does not appear in any INSERT statement across database/*.sql.
    reference: CWE-916
  evidence:
  - file: database/create_postgresql_db.sql
    line: 2
  evidence_check: verified
