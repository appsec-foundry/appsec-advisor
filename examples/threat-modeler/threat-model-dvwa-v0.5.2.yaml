- local_id: database-001
  threat_category_id: TH-03
  additional_categories: []
  stride: Spoofing
  cwe: CWE-798
  title: Hardcoded Database Credentials in compose.yml Enable Unauthenticated Access
  affected_parameter: MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD
  scenario: Both the application database user ('dvwa'/'p@ss**** (8 chars)') and the MariaDB root account ('dvwa') are committed in
    plain text to compose.yml, which is version-controlled and publicly accessible on GitHub. Any developer, contributor,
    or external attacker who clones the repository immediately possesses valid credentials for the database. From within the
    Docker network — reachable by any other container on the 'dvwa' network — these credentials can authenticate directly
    against TCP 3306 without any further exploitation. Because every deployment uses identical, non-rotatable credentials
    seeded from the repository, compromising one instance is equivalent to compromising all instances running from that image.
  attack_steps:
  - An attacker clones the public DVWA repository and reads MYSQL_ROOT_PASSWORD=dvwa and MYSQL_PASSWORD=p@ss**** (8 chars) from compose.yml
    lines 31 and 34.
  - The attacker deploys any container on the 'dvwa' Docker network and connects to port 3306 with the extracted credentials.
  - The attacker authenticates successfully as either the 'dvwa' application user or as MySQL root and gains full read/write
    access to the dvwa database.
  evidence_summary: compose.yml:31 sets MYSQL_ROOT_PASSWORD=dvwa and :34 sets MYSQL_PASSWORD=p@ss**** (8 chars) as plain-text environment
    variables in a version-controlled file.
  impact_description: Any party with repository read access can authenticate to the database without further exploitation,
    obtaining all user account data and session material.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: MariaDB port 3306 is not mapped to the host interface in compose.yml, limiting direct access to the Docker
    network. No runtime secret injection (e.g., Docker secrets or environment-variable overrides) is in place.
  mitigation_title: Replace hardcoded MariaDB credentials with externally injected secrets in compose.yml
  remediation:
    effort: Medium
    steps:
    - Remove MYSQL_ROOT_PASSWORD, MYSQL_USER, and MYSQL_PASSWORD from compose.yml and replace them with Docker secrets or
      a .env file excluded from version control via .gitignore.
    - Generate strong, unique pass**** (8 chars)s using a CSPRNG (e.g., `openssl rand -base64 32`) for each deployment rather than shipping
      a fixed default.
    - Add a CI secret-scanning step (e.g., git-secrets, trufflehog) to block future credential commits.
    code_example: "# compose.yml — Before\n# environment:\n#   - MYSQL_ROOT_PASSWORD=dvwa\n#   - MYSQL_PASSWORD=p@ss**** (8 chars)\n\
