  title: Unauthenticated Database Setup and Reset Endpoint (setup.php:6)
  scenario: '`setup.php:6` calls `dvwaPageStartup( array() )` — an empty array — which means no authentication check is performed.
    When the `create_db` POST parameter is present, the page drops and recreates the entire DVWA database. Any unauthenticated
