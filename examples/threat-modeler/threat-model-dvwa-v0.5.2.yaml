- local_id: web-application-010
  threat_category_id: TH-06
  additional_categories: []
  stride: Tampering
  cwe: CWE-565
  title: Client-Controlled Security Level Bypasses All Module Protections
  scenario: All DVWA vulnerability modules select their protection tier based on the return value of `dvwaSecurityLevelGet()`,
    which reads `$_COOKIE['security']` directly (`dvwa/includes/dvwaPage.inc.php:204`). The cookie carries no HMAC or server-side
    signature. An authenticated attacker who sets their own `security=low` cookie immediately downgrades every module from
    whatever level the administrator configured to the completely unprotected low-level variant, re-exposing all training
    vulnerabilities as real attack vectors.
  attack_steps:
  - An attacker authenticates to DVWA and edits the `security` cookie value in their browser from `high` to `low`.
  - '`dvwaSecurityLevelGet()` at `dvwaPage.inc.php:204` returns `low` because the cookie value is used without any server-side
    verification.'
  - Every subsequent request to a vulnerability module loads the `low.php` source variant with no input validation or output
    encoding.
  evidence_summary: '`dvwaPage.inc.php:204` returns `$_COOKIE[''security'']` directly; the cookie value is not signed, validated
    against a server-side session, or restricted to the operator-configured level.'
  impact_description: The operator's intended protection level is ignored; all 15+ vulnerability modules revert to completely
    unprotected behavior for that user.
  likelihood: High
  impact: High
  risk: High
  controls_in_place: Cookie value is validated against known levels (`low`, `medium`, `high`, `impossible`) to prevent arbitrary
    strings.
  mitigation_title: Store security level server-side in the PHP session, not in a client-controlled cookie
  remediation:
    effort: Medium
    steps:
    - Store the operator-configured security level in `$_SESSION['dvwa']['security_level']` on the server side at login time.
    - Replace the `$_COOKIE['security']` read in `dvwaSecurityLevelGet()` with a `$_SESSION['dvwa']['security_level']` read.
    - Keep the cookie only as a display hint (no security consequence); write it server-side via `setcookie()` without trusting
      its value on return.
    - Expose a server-authenticated UI control (`security.php`) that writes the new level to the session only if the requesting
      user has the admin role.
    code_example: null
    verification: Set `security=low` cookie while the server session holds `security_level=high`; confirm all module requests
      use high-level protections.
    reference: CWE-565
