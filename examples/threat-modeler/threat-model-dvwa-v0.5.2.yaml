- local_id: rest-api-007
  threat_category_id: TH-06
  additional_categories: []
  stride: Information Disclosure
  cwe: CWE-942
  title: Overly Permissive CORS Policy
  scenario: 'Both public/index.php (line 11) and gen_openapi.php (line 6) emit Access-Control-Allow-Origin: * unconditionally.
    The wildcard allows any web origin to make cross-origin requests to all API endpoints and read the responses in JavaScript.
    Combined with the absence of authentication on user endpoints (rest-api-004), a malicious web page loaded in any browser
    can silently enumerate all users, create user accounts, or retrieve user data on behalf of a visiting DVWA user. If DVWA
    is deployed on an internal network, a page loaded from an external site can probe internal API endpoints through the victim''s
    browser.'
  evidence_summary: 'public/index.php:11 sets Access-Control-Allow-Origin: * as the first header before any routing or authentication
    logic runs.'
  impact_description: Cross-origin JavaScript on any web page can read API responses and exfiltrate user data from a victim's
    browsing session.
  likelihood: Medium
  impact: Medium
  risk: Medium
  controls_in_place: None. The wildcard is unconditional and applies to all methods and endpoints.
  mitigation_title: Restrict CORS origin header to an explicit allowlist of trusted origins in public/index.php and gen_openapi.php
  remediation:
    effort: Low
    steps:
    - 'Replace the wildcard with an explicit allowlist check: read the Origin request header, validate it against an environment-variable-supplied
      list, and echo back only matched origins.'
    - 'Never combine Access-Control-Allow-Origin: * with Access-Control-Allow-Credentials: true; the current code does not
      set the credentials header but the wildcard should still be removed.'
    - Apply the same fix to gen_openapi.php which also emits the wildcard header.
    code_example: "// Replace in public/index.php:11\n$allowed = ['https://dvwa.example.com'];\n$origin = $_SERVER['HTTP_ORIGIN']\
      \ ?? '';\nif (in_array($origin, $allowed, true)) {\n    header(\"Access-Control-Allow-Origin: $origin\");\n    header(\"\
      Vary: Origin\");\n}"
    verification: Send a cross-origin preflight from an unlisted origin; confirm the response does not include an Access-Control-Allow-Origin
      header matching that origin.
    reference: CWE-942
  evidence:
  - file: vulnerabilities/api/public/index.php
    line: 11
  evidence_check: verified
  architectural_violation: false
