description: Curated demonstration baseline informed by OWASP ASVS 5.0.0 and OWASP Top 10:2025, carrying the requirements of examples/appsec-requirements-example.yaml without its blueprints. It is not an official OWASP standard and must be tailored to the application's technology, data, threat model, and risk policy before operational use. Its links model an internal catalog host and do not resolve.
